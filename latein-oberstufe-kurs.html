<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latein Oberstufe – der komplette Kurs (9.–12. Schulstufe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1b1b1f; --muted:#56535d; --line:#e3ddd3;
  --blue:#3a5a8c; --blue-soft:#e7edf6;
  --petrol:#1d6b74; --petrol-soft:#e3eff1;
  --lilac:#5d4a7e; --lilac-soft:#eee9f5;
  --terra:#9c4f3d; --terra-soft:#f6e9e4;
  --gold:#a7843b; --gold-soft:#f6efdf;
  --radius:20px; --shadow:0 6px 24px rgba(40,30,20,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:18px;line-height:1.75}
h1,h2,h3,h4{line-height:1.3;font-weight:600;margin:0 0 .6em}
h2{font-size:1.75rem} h3{font-size:1.25rem;margin-top:1.5em} h4{font-size:1.05rem}
p{margin:0 0 1em} a{color:var(--blue)}
ul{margin:0 0 1em;padding-left:1.3em} li{margin-bottom:.35em}
.la{font-style:italic;font-weight:500;color:#2c3f63}
.la b.e,b.e{color:var(--terra);font-weight:600}
.note .la,.fb .la{color:inherit}
.big{font-size:1.15rem;line-height:1.9}
.vers{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;font-size:1.1rem;line-height:2.1;overflow-x:auto;white-space:nowrap}
.vers u{text-decoration:none;border-bottom:3px solid var(--blue);padding-bottom:1px}
.vers s{text-decoration:none;border-bottom:3px dotted var(--terra);padding-bottom:1px}

.topbar{position:sticky;top:0;z-index:60;background:rgba(245,242,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.topbar .brand{font-weight:600;cursor:pointer;white-space:nowrap}
.topbar .brand small{font-weight:400;color:var(--muted)}
.topbar .grow{flex:1}
.pbar{width:150px;height:10px;background:#e6dfd3;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--petrol);border-radius:99px;width:0;transition:.4s}
.ptxt{font-size:.85rem;color:var(--muted);white-space:nowrap}
#menuBtn{display:none}

.layout{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1380px;margin:0 auto}
aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line)}
aside input{width:100%;font:inherit;font-size:.95rem;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
aside h5{margin:16px 6px 6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
aside a.ch{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:12px;font-size:.93rem;line-height:1.35}
aside a.ch:hover{background:#fff}
aside a.ch.on{background:#fff;box-shadow:var(--shadow);font-weight:500}
aside a.ch .dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:#fff}
aside a.ch.done .dot{background:var(--petrol);border-color:var(--petrol)}
aside a.ch.part .dot{border-color:var(--gold);background:var(--gold-soft)}
aside a.homelink{display:block;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:500}
aside a.homelink:hover{background:#fff}
main{padding:28px 30px 90px;min-width:0}
.inner{max-width:880px;margin:0 auto}

.hero{background:linear-gradient(135deg,#2f4a75 0%,#1d5d68 50%,#4a3e6b 100%);color:#fff;padding:44px 38px;border-radius:30px;margin-bottom:26px}
.hero h1{font-size:2.3rem;font-weight:700;margin-bottom:.3em}
.hero p{font-size:1.1rem;max-width:720px;opacity:.96;margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:.92rem}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px;border:1px solid #efe9df}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #efe9df;border-left:6px solid var(--blue);transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{display:block;font-weight:500;line-height:1.35}
.tile small{color:var(--muted)}
.tile.done{background:var(--petrol-soft)}
.cF{--c:var(--blue);--cs:var(--blue-soft)}.cS{--c:var(--petrol);--cs:var(--petrol-soft)}.cW{--c:var(--gold);--cs:var(--gold-soft)}.cT{--c:var(--lilac);--cs:var(--lilac-soft)}.cK{--c:var(--terra);--cs:var(--terra-soft)}
.tile{border-left-color:var(--c)} aside h5{color:var(--c)}
.step3{counter-reset:s}
.step3 .card{position:relative;padding-top:54px;margin:0}
.step3 .card:before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:24px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}

.chead{border-radius:26px;padding:30px 32px;background:var(--cs);border-top:6px solid var(--c);margin-bottom:22px}
.chead h2{margin-bottom:.35em}
.tag{display:inline-block;font-size:.8rem;padding:3px 11px;border-radius:999px;font-weight:500;background:#fff;color:var(--c);margin-right:6px}
.goals{margin:14px 0 0;padding-left:1.2em;font-size:.98rem}
.goals li{margin-bottom:.15em}
.formula{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;overflow-x:auto}
.note{border-left:5px solid var(--gold);background:var(--gold-soft);padding:14px 18px;border-radius:12px;margin:14px 0}
.note.f{border-color:var(--terra);background:var(--terra-soft)}
.note.t{border-color:var(--petrol);background:var(--petrol-soft)}
.note b.lab{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tw{overflow-x:auto;margin:12px 0}
table.plain{width:100%;border-collapse:separate;border-spacing:0;font-size:.97rem}
table.plain th{background:var(--cs);text-align:left;padding:10px 14px;font-weight:600}
table.plain td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain tr:last-child td{border-bottom:none}
table.plain th:first-child{border-radius:12px 0 0 0}table.plain th:last-child{border-radius:0 12px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid var(--line)}
figcaption{font-size:.88rem;color:var(--muted);margin-top:4px}

.walk{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px 26px;margin:20px 0;border:1px solid #efe9df}
.walk h4{color:var(--c);margin-bottom:.3em}
.walk .task{background:var(--bg);border-radius:14px;padding:14px 18px;margin:8px 0 12px}
.wstep{display:none;gap:14px;padding:12px 0;border-top:1px dashed var(--line);animation:fade .35s}
.wstep.show{display:flex}
.wstep .n{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.wstep>div:last-child{min-width:0;flex:1}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

button{font-family:inherit;font-size:1rem;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:.2s}
button:hover{filter:brightness(1.08)}
button.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 18px}
button.petrol{background:var(--petrol)} button.lilac{background:var(--lilac)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.ex{background:#fff;border-radius:18px;border:1px solid #efe9df;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px}
.ex.ok{border-left:6px solid var(--petrol)}
.ex.no{border-left:6px solid var(--terra)}
.ex .nr{font-size:.82rem;font-weight:600;color:var(--c);letter-spacing:.05em;text-transform:uppercase}
.ex input[type=text]{font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);width:210px;max-width:100%}
.ex input[type=text]:focus{outline:none;border-color:var(--blue)}
.ex .unit{color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:block;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px 16px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--blue);filter:none}
.opt.right{background:var(--petrol-soft);border-color:var(--petrol)}
.opt.wrong{background:var(--terra-soft);border-color:var(--terra)}
.fb{margin-top:12px;border-radius:14px;padding:12px 16px;display:none}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:var(--petrol-soft)} .fb.bad{background:var(--terra-soft)} .fb.hint{background:var(--gold-soft)}
.fb b.h{display:block;margin-bottom:2px}
.hintline{font-size:.88rem;color:var(--muted);margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.score{font-weight:600;color:var(--petrol)}
.phi{background:var(--bg);border-radius:14px;padding:14px 18px;margin:12px 0}
.phi input{font:inherit;width:110px;padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
footer{color:var(--muted);font-size:.85rem;margin-top:50px;text-align:center}

@media(max-width:560px){.ptxt{display:none}}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:57px;width:min(330px,88vw);background:var(--bg);z-index:55;transform:translateX(-105%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  #menuBtn{display:block;padding:7px 14px}
  main{padding:20px 14px 80px}
  .hero{padding:30px 24px}.hero h1{font-size:1.8rem}
  .pbar{width:80px}
  .topbar .brand small{display:none}
  .topbar{gap:8px;padding:8px 12px}.topbar .brand{overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
  #menuBtn{white-space:nowrap;flex-shrink:0}
  .pbar{flex-shrink:0;width:64px}
  .card,.walk,.ex{padding:18px 16px}.chead{padding:22px 18px}
  .ex input[type=text]{width:100%}
  body{font-size:17px}
}
</style>
</head>

  <button id="menuBtn" class="ghost">☰ Inhalt</button>

</div>

  <main><div class="inner" id="main"></div></main>
</div>
<script>
const DATA={"chapters":[{"id":"grund","t":"Grundbegriffe: Aussprache, Wortarten und Satzglieder","kl":"1","k":1,"a":"F","tag":"Basis","goals":["lateinische Wörter richtig aussprechen und betonen","Wortarten und Satzglieder sicher benennen","erklären, warum im Lateinischen die Endung und nicht die Wortstellung die Funktion zeigt","einfache Sätze nach der Methode „Prädikat zuerst“ übersetzen"],"ex":[{"type":"mc","q":"Auf welcher Silbe wird <span class=\"la\">amicus<\/span> betont?","s":"Die vorletzte Silbe <span class=\"la\">-mi-<\/span> hat ein langes i, daher trägt sie den Ton. Die letzte Silbe wird im Lateinischen nie betont.","o":["auf der zweiten: a-MI-cus","auf der ersten: A-mi-cus","auf der letzten: a-mi-CUS","Die Betonung ist frei wählbar."]},{"type":"mc","q":"Auf welcher Silbe wird <span class=\"la\">dominus<\/span> betont?","h":"Ist die vorletzte Silbe lang oder kurz?","s":"Die vorletzte Silbe <span class=\"la\">-mi-<\/span> ist kurz (kurzer Vokal, danach nur ein Konsonant). Der Ton rückt deshalb auf die drittletzte Silbe.","o":["auf der ersten: DO-mi-nus","auf der zweiten: do-MI-nus","auf der letzten: do-mi-NUS","Die Betonung ist frei wählbar."]},{"type":"mc","q":"Welches Satzglied ist <span class=\"la\">amicum<\/span> im Satz <span class=\"la\">Puella amicum videt.<\/span>?","s":"<span class=\"la\">amicum<\/span> steht im Akkusativ und antwortet auf „Wen sieht das Mädchen?“. Subjekt ist <span class=\"la\">puella<\/span> (Nominativ), Prädikat ist <span class=\"la\">videt<\/span>.","o":["Akkusativobjekt","Subjekt","Prädikat","Adverbiale"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">Laudant.<\/span>?","s":"Die Endung <span class=\"la\">-nt<\/span> bezeichnet die 3. Person Plural. Ein eigenes Wort für „sie“ braucht das Lateinische nicht.","o":["Sie loben.","Er lobt.","Wir loben.","Ihr lobt."]},{"type":"mc","q":"Welche Übersetzung von <span class=\"la\">Dominum servus timet.<\/span> ist richtig?","h":"Achte auf die Endungen und nicht auf die Reihenfolge.","s":"<span class=\"la\">servus<\/span> ist Nominativ (Subjekt), <span class=\"la\">dominum<\/span> ist Akkusativ (Objekt). Dass <span class=\"la\">dominum<\/span> vorne steht, betont es nur: „Den Herrn fürchtet der Sklave.“","o":["Der Sklave fürchtet den Herrn.","Der Herr fürchtet den Sklaven.","Der Herr und der Sklave fürchten sich.","Die Sklaven fürchten den Herrn."]},{"type":"mc","q":"Warum kann <span class=\"la\">rex<\/span> mit „der König“, „ein König“ oder „König“ übersetzt werden?","s":"Den Artikel ergänzt du beim Übersetzen nach dem Zusammenhang. Meist passt der bestimmte Artikel, wenn die Person schon bekannt ist.","o":["Weil das Lateinische keinen Artikel hat.","Weil <span class=\"la\">rex<\/span> drei verschiedene Bedeutungen hat.","Weil <span class=\"la\">rex<\/span> in drei verschiedenen Fällen stehen kann.","Weil die Wortstellung frei ist."]},{"type":"self","q":"Übersetze: <span class=\"la\">Amici puellis donum dant.<\/span>","s":"„Die Freunde geben den Mädchen ein Geschenk.“ Prädikat <span class=\"la\">dant<\/span> (sie geben), Subjekt <span class=\"la\">amici<\/span> (Nominativ Plural), <span class=\"la\">puellis<\/span> Dativ Plural (wem?), <span class=\"la\">donum<\/span> Akkusativ Singular (was?)."},{"type":"mc","q":"Welche Wortart ist <span class=\"la\">saepe<\/span> (oft)?","s":"<span class=\"la\">saepe<\/span> bestimmt das Verb näher (wann? wie oft?) und bleibt immer unverändert. Das ist ein Adverb.","o":["Adverb","Adjektiv","Präposition","Konjunktion"]}],"gen":[],"html":"<h3>Aussprache und Betonung<\/h3>\n<p>Latein wird im Wesentlichen so gesprochen, wie es geschrieben wird. In der Schule üblich ist diese Aussprache: <span class=\"la\">c<\/span> klingt immer wie k (<span class=\"la\">Cicero<\/span> also „Kikero“), <span class=\"la\">v<\/span> wie w, <span class=\"la\">ae<\/span> wie ai, <span class=\"la\">oe<\/span> wie oi, <span class=\"la\">qu<\/span> wie kw, <span class=\"la\">ti<\/span> bleibt ti. Manche Lehrkräfte verwenden die spätere, eingedeutschte Aussprache („Zizero“). Beide sind in Ordnung, wichtig ist nur, dass du bei einer bleibst.<\/p>\n<p>Für die Betonung gibt es eine einzige Regel, und sie richtet sich nach der <b>vorletzten Silbe<\/b>:<\/p>\n<ul><li>Zweisilbige Wörter werden vorne betont: <span class=\"la\">RO-ma<\/span>, <span class=\"la\">A-mat<\/span>.<\/li><li>Ist die vorletzte Silbe lang, wird sie betont: <span class=\"la\">a-MI-cus<\/span>, <span class=\"la\">lau-DA-re<\/span>, <span class=\"la\">pu-EL-la<\/span>.<\/li><li>Ist die vorletzte Silbe kurz, rückt die Betonung eine Silbe nach vorne: <span class=\"la\">DO-mi-nus<\/span>, <span class=\"la\">RE-ge-re<\/span>.<\/li><\/ul>\n<p>Eine Silbe ist lang, wenn ihr Vokal lang ist oder wenn auf den Vokal zwei Konsonanten folgen. Die letzte Silbe wird nie betont.<\/p>\n<h3>Die Wortarten<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Veränderlich<\/th><th>Beispiel<\/th><th>Unveränderlich<\/th><th>Beispiel<\/th><\/tr><tr><td>Substantiv (Nomen)<\/td><td><span class=\"la\">rex<\/span> König<\/td><td>Adverb<\/td><td><span class=\"la\">saepe<\/span> oft<\/td><\/tr><tr><td>Adjektiv<\/td><td><span class=\"la\">magnus<\/span> groß<\/td><td>Präposition<\/td><td><span class=\"la\">in<\/span>, <span class=\"la\">cum<\/span><\/td><\/tr><tr><td>Pronomen<\/td><td><span class=\"la\">is<\/span>, <span class=\"la\">qui<\/span><\/td><td>Konjunktion<\/td><td><span class=\"la\">et<\/span>, <span class=\"la\">sed<\/span><\/td><\/tr><tr><td>Zahlwort<\/td><td><span class=\"la\">tres<\/span> drei<\/td><td>Subjunktion<\/td><td><span class=\"la\">quod<\/span>, <span class=\"la\">si<\/span><\/td><\/tr><tr><td>Verb<\/td><td><span class=\"la\">laudare<\/span> loben<\/td><td>Partikel, Interjektion<\/td><td><span class=\"la\">non<\/span>, <span class=\"la\">o<\/span><\/td><\/tr><\/table><\/div>\n<p>Substantive, Adjektive und Pronomen werden <b>dekliniert<\/b> (Kasus, Numerus, Genus). Verben werden <b>konjugiert<\/b> (Person, Numerus, Tempus, Modus, Genus verbi). Diese Begriffe brauchst du für jede Formenbestimmung.<\/p>\n<h3>Die Endung trägt die Information<\/h3>\n<p>Im Deutschen zeigt oft die Stellung, wer was tut. Im Lateinischen zeigt es die <b>Endung<\/b>. Deshalb bedeuten diese drei Sätze dasselbe:<\/p>\n<div class=\"formula\"><span class=\"la\">Serv<b class=\"e\">us<\/b> domin<b class=\"e\">um<\/b> videt.<\/span> – <span class=\"la\">Domin<b class=\"e\">um<\/b> serv<b class=\"e\">us<\/b> videt.<\/span> – <span class=\"la\">Videt serv<b class=\"e\">us<\/b> domin<b class=\"e\">um<\/b>.<\/span><\/div>\n<p>Immer sieht der Sklave den Herrn, weil <span class=\"la\">servus<\/span> im Nominativ und <span class=\"la\">dominum<\/span> im Akkusativ steht. Die Wortstellung ist frei und dient der Betonung. Üblich ist: Subjekt vorne, Prädikat am Ende.<\/p>\n<p>Zwei weitere Unterschiede zum Deutschen musst du von Anfang an im Kopf haben:<\/p>\n<ul><li>Latein hat <b>keinen Artikel<\/b>. <span class=\"la\">rex<\/span> heißt „der König“, „ein König“ oder „König“. Du entscheidest nach dem Zusammenhang.<\/li><li>Das Subjektspronomen steckt in der <b>Personalendung<\/b>. <span class=\"la\">Lauda<b class=\"e\">t<\/b><\/span> heißt „er lobt“, „sie lobt“ oder „es lobt“. <span class=\"la\">Lauda<b class=\"e\">nt<\/b><\/span> heißt „sie loben“.<\/li><\/ul>\n<h3>Die Satzglieder<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Satzglied<\/th><th>Frage<\/th><th>Im Lateinischen meist<\/th><\/tr><tr><td>Prädikat<\/td><td>Was geschieht?<\/td><td>Verb mit Personalendung<\/td><\/tr><tr><td>Subjekt<\/td><td>Wer oder was?<\/td><td>Nominativ<\/td><\/tr><tr><td>Akkusativobjekt<\/td><td>Wen oder was?<\/td><td>Akkusativ<\/td><\/tr><tr><td>Dativobjekt<\/td><td>Wem?<\/td><td>Dativ<\/td><\/tr><tr><td>Adverbiale<\/td><td>Wo? Wann? Wie? Warum? Womit?<\/td><td>Ablativ, Präpositionalausdruck, Adverb<\/td><\/tr><tr><td>Attribut<\/td><td>Was für ein? Wessen?<\/td><td>Adjektiv, Genitiv (Teil eines Satzglieds)<\/td><\/tr><tr><td>Prädikatsnomen<\/td><td>Was ist das Subjekt?<\/td><td>Nominativ bei <span class=\"la\">esse<\/span>: <span class=\"la\">Marcus amicus est.<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Satz systematisch übersetzen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Magistro puellae libros dant.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Suche zuerst das <b>Prädikat<\/b>: <span class=\"la\">dant<\/span>. Die Endung <span class=\"la\">-nt<\/span> zeigt 3. Person Plural: „sie geben“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Suche das <b>Subjekt<\/b> im Nominativ Plural, weil das Prädikat im Plural steht. <span class=\"la\">puellae<\/span> kann Nominativ Plural sein: „die Mädchen“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Was fordert das Verb? „Geben“ verlangt: wem und was. Suche Dativ und Akkusativ.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">libros<\/span> ist eindeutig Akkusativ Plural: „Bücher“. <span class=\"la\">magistro<\/span> ist Dativ Singular: „dem Lehrer“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Zusammensetzen: „Die Mädchen geben dem Lehrer Bücher.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Kontrolle: Jedes Wort ist verbaut, und jede Endung passt zu ihrer Aufgabe. <span class=\"la\">puellae<\/span> hätte der Form nach auch Genitiv oder Dativ Singular sein können. Entschieden hat das Prädikat im Plural, das ein Subjekt im Plural braucht.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die wichtigste Arbeitsregel des ganzen Kurses: <b>Zuerst das Prädikat<\/b>, dann das Subjekt, dann das, was das Verb verlangt. Übersetze nie Wort für Wort von links nach rechts.<\/div>"},{"id":"dekl12","t":"Die a- und o-Deklination","kl":"1","k":1,"a":"F","tag":"Basis","goals":["Substantive der a- und o-Deklination in allen Fällen bilden","mehrdeutige Endungen erkennen und mit Hilfe des Satzes entscheiden","die Neutrum-Regel anwenden","die Wörterbuchangabe eines Substantivs lesen"],"ex":[{"type":"txt","a":["puellarum"],"q":"Bilde den Genitiv Plural von <span class=\"la\">puella, -ae f.<\/span>","s":"Stamm <span class=\"la\">puell-<\/span> und Endung <span class=\"la\">-arum<\/span>: <span class=\"la\">puellarum<\/span> (der Mädchen)."},{"type":"txt","a":["templa"],"q":"Bilde den Akkusativ Plural von <span class=\"la\">templum, -i n.<\/span>","s":"Neutrum-Regel: Akkusativ gleich Nominativ, im Plural auf <span class=\"la\">-a<\/span>: <span class=\"la\">templa<\/span>."},{"type":"txt","a":["agrum"],"q":"Bilde den Akkusativ Singular von <span class=\"la\">ager, agri m.<\/span> (Acker).","h":"Der Stamm steckt im Genitiv: <span class=\"la\">agr-<\/span>.","s":"Stamm <span class=\"la\">agr-<\/span> und Endung <span class=\"la\">-um<\/span>: <span class=\"la\">agrum<\/span>. Das e des Nominativs fällt weg."},{"type":"mc","q":"Welche Bestimmung ist für <span class=\"la\">amici<\/span> <b>nicht<\/b> möglich?","s":"Die Endung <span class=\"la\">-i<\/span> steht in der o-Deklination für Genitiv Singular und Nominativ (und Vokativ) Plural. Der Dativ Singular lautet <span class=\"la\">amico<\/span>.","o":["Dativ Singular","Genitiv Singular","Nominativ Plural","Vokativ Plural"]},{"type":"mc","q":"In welchem Fall steht <span class=\"la\">templa<\/span> im Satz <span class=\"la\">Romani templa aedificant.<\/span> (aedificare = bauen)?","h":"Wer baut, und was wird gebaut?","s":"Subjekt ist <span class=\"la\">Romani<\/span> (die Römer). <span class=\"la\">templa<\/span> ist ein Neutrum im Plural und hier Objekt: „Die Römer bauen Tempel.“ Der Form nach wäre auch Nominativ Plural denkbar, aber der Satz hat schon ein Subjekt.","o":["Akkusativ Plural","Nominativ Singular","Ablativ Singular","Nominativ Plural"]},{"type":"mc","q":"Welches Geschlecht hat <span class=\"la\">poeta, -ae<\/span> (Dichter)?","s":"Bei Personen richtet sich das Geschlecht nach dem natürlichen Geschlecht. <span class=\"la\">poeta clarus<\/span> heißt „ein berühmter Dichter“, das Adjektiv steht in der maskulinen Form.","o":["maskulin","feminin","neutrum","Das lässt sich nicht sagen."]},{"type":"self","q":"Übersetze: <span class=\"la\">Servi domino aquam portant.<\/span> (portare = tragen, bringen)","s":"„Die Sklaven bringen dem Herrn Wasser.“ <span class=\"la\">servi<\/span> Nominativ Plural (Subjekt zu <span class=\"la\">portant<\/span>), <span class=\"la\">domino<\/span> Dativ, <span class=\"la\">aquam<\/span> Akkusativ."},{"type":"self","q":"Übersetze: <span class=\"la\">Puellae in silva amicum poetae vident.<\/span>","s":"„Die Mädchen sehen im Wald den Freund des Dichters.“ <span class=\"la\">in silva<\/span> ist Ablativ mit Präposition (wo?), <span class=\"la\">poetae<\/span> ist Genitiv und gehört als Attribut zu <span class=\"la\">amicum<\/span>."}],"gen":["dekl"],"html":"<h3>Fünf Fälle, zwei Zahlen<\/h3>\n<p>Das Lateinische hat fünf Fälle, die du ständig brauchst, und den Vokativ für die Anrede.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fall<\/th><th>Frage<\/th><th>Grundfunktion<\/th><\/tr><tr><td>Nominativ<\/td><td>Wer oder was?<\/td><td>Subjekt, Prädikatsnomen<\/td><\/tr><tr><td>Genitiv<\/td><td>Wessen?<\/td><td>Attribut (Zugehörigkeit)<\/td><\/tr><tr><td>Dativ<\/td><td>Wem? Für wen?<\/td><td>Objekt<\/td><\/tr><tr><td>Akkusativ<\/td><td>Wen oder was? Wohin?<\/td><td>Objekt, Richtung<\/td><\/tr><tr><td>Ablativ<\/td><td>Womit? Wodurch? Wo? Wann? Woher?<\/td><td>Adverbiale<\/td><\/tr><\/table><\/div>\n<p>Den Ablativ gibt es im Deutschen nicht. Du übersetzt ihn meist mit einer Präposition: „mit“, „durch“, „von“, „in“, „an“.<\/p>\n<h3>Die Wörterbuchangabe<\/h3>\n<p>Im Wörterbuch stehen Nominativ, Genitiv und Geschlecht: <span class=\"la\">puella, -ae f.<\/span> Der <b>Genitiv<\/b> verrät dir die Deklination und den Stamm. Genitiv auf <span class=\"la\">-ae<\/span>: a-Deklination. Genitiv auf <span class=\"la\">-i<\/span>: o-Deklination.<\/p>\n<h3>Die Formen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>a-Dekl. (f.)<\/th><th>o-Dekl. (m.)<\/th><th>o-Dekl. auf -er<\/th><th>o-Dekl. (n.)<\/th><\/tr><tr><td>Nom. Sg.<\/td><td>puell<b class=\"e\">a<\/b><\/td><td>domin<b class=\"e\">us<\/b><\/td><td>puer<\/td><td>templ<b class=\"e\">um<\/b><\/td><\/tr><tr><td>Gen. Sg.<\/td><td>puell<b class=\"e\">ae<\/b><\/td><td>domin<b class=\"e\">i<\/b><\/td><td>puer<b class=\"e\">i<\/b><\/td><td>templ<b class=\"e\">i<\/b><\/td><\/tr><tr><td>Dat. Sg.<\/td><td>puell<b class=\"e\">ae<\/b><\/td><td>domin<b class=\"e\">o<\/b><\/td><td>puer<b class=\"e\">o<\/b><\/td><td>templ<b class=\"e\">o<\/b><\/td><\/tr><tr><td>Akk. Sg.<\/td><td>puell<b class=\"e\">am<\/b><\/td><td>domin<b class=\"e\">um<\/b><\/td><td>puer<b class=\"e\">um<\/b><\/td><td>templ<b class=\"e\">um<\/b><\/td><\/tr><tr><td>Abl. Sg.<\/td><td>puell<b class=\"e\">a<\/b><\/td><td>domin<b class=\"e\">o<\/b><\/td><td>puer<b class=\"e\">o<\/b><\/td><td>templ<b class=\"e\">o<\/b><\/td><\/tr><tr><td>Nom. Pl.<\/td><td>puell<b class=\"e\">ae<\/b><\/td><td>domin<b class=\"e\">i<\/b><\/td><td>puer<b class=\"e\">i<\/b><\/td><td>templ<b class=\"e\">a<\/b><\/td><\/tr><tr><td>Gen. Pl.<\/td><td>puell<b class=\"e\">arum<\/b><\/td><td>domin<b class=\"e\">orum<\/b><\/td><td>puer<b class=\"e\">orum<\/b><\/td><td>templ<b class=\"e\">orum<\/b><\/td><\/tr><tr><td>Dat. Pl.<\/td><td>puell<b class=\"e\">is<\/b><\/td><td>domin<b class=\"e\">is<\/b><\/td><td>puer<b class=\"e\">is<\/b><\/td><td>templ<b class=\"e\">is<\/b><\/td><\/tr><tr><td>Akk. Pl.<\/td><td>puell<b class=\"e\">as<\/b><\/td><td>domin<b class=\"e\">os<\/b><\/td><td>puer<b class=\"e\">os<\/b><\/td><td>templ<b class=\"e\">a<\/b><\/td><\/tr><tr><td>Abl. Pl.<\/td><td>puell<b class=\"e\">is<\/b><\/td><td>domin<b class=\"e\">is<\/b><\/td><td>puer<b class=\"e\">is<\/b><\/td><td>templ<b class=\"e\">is<\/b><\/td><\/tr><\/table><\/div>\n<p>Dativ und Ablativ Plural sind in <b>allen<\/b> Deklinationen gleich.<\/p>\n<p>Die Wörter auf <span class=\"la\">-er<\/span> behalten das e teils (<span class=\"la\">puer, pueri<\/span>), teils verlieren sie es (<span class=\"la\">ager, agri<\/span>; <span class=\"la\">liber, libri<\/span>). Der Genitiv im Wörterbuch zeigt es dir.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><b>Die Neutrum-Regel<\/b> gilt in allen Deklinationen: Bei Neutra sind Nominativ und Akkusativ immer gleich, und im Plural enden beide auf <span class=\"la\">-a<\/span>.<\/div>\n<h3>Geschlecht<\/h3>\n<p>Wörter der a-Deklination sind fast immer feminin. Ausnahme sind männliche Personen: <span class=\"la\">agricola<\/span> (Bauer), <span class=\"la\">nauta<\/span> (Seemann), <span class=\"la\">poeta<\/span> (Dichter) sind maskulin. In der o-Deklination sind Wörter auf <span class=\"la\">-us<\/span> und <span class=\"la\">-er<\/span> maskulin, Wörter auf <span class=\"la\">-um<\/span> Neutra.<\/p>\n<p>Der <b>Vokativ<\/b> gleicht dem Nominativ. Nur bei Wörtern auf <span class=\"la\">-us<\/span> endet er auf <span class=\"la\">-e<\/span> (<span class=\"la\">domine!<\/span>), bei Wörtern auf <span class=\"la\">-ius<\/span> auf <span class=\"la\">-i<\/span> (<span class=\"la\">fili!<\/span>).<\/p>\n<h3>Mehrdeutige Endungen<\/h3>\n<p>Manche Endungen kommen mehrfach vor. Das ist die häufigste Fehlerquelle beim Übersetzen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Endung<\/th><th>mögliche Bestimmungen<\/th><\/tr><tr><td><span class=\"la\">-ae<\/span><\/td><td>Gen. Sg., Dat. Sg., Nom. Pl. der a-Deklination<\/td><\/tr><tr><td><span class=\"la\">-a<\/span><\/td><td>Nom. Sg. oder Abl. Sg. der a-Deklination; Nom. oder Akk. Pl. eines Neutrums<\/td><\/tr><tr><td><span class=\"la\">-i<\/span><\/td><td>Gen. Sg. oder Nom. Pl. der o-Deklination<\/td><\/tr><tr><td><span class=\"la\">-o<\/span><\/td><td>Dat. Sg. oder Abl. Sg. der o-Deklination<\/td><\/tr><tr><td><span class=\"la\">-is<\/span><\/td><td>Dat. Pl. oder Abl. Pl. beider Deklinationen<\/td><\/tr><tr><td><span class=\"la\">-um<\/span><\/td><td>Akk. Sg. (m.) oder Nom./Akk. Sg. (n.)<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine mehrdeutige Form entscheiden<\/h4><div class=\"task\">Bestimme <span class=\"la\">filiae<\/span> im Satz <span class=\"la\">Matronae filiae donum dant.<\/span> und übersetze.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">dant<\/span>, 3. Person Plural. Gesucht ist ein Subjekt im Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zwei Wörter enden auf <span class=\"la\">-ae<\/span>: <span class=\"la\">matronae<\/span> und <span class=\"la\">filiae<\/span>. Jedes könnte Genitiv Singular, Dativ Singular oder Nominativ Plural sein.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>„Geben“ verlangt ein Wem. Eines der beiden Wörter wird also Dativ sein, das andere Subjekt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Das Subjekt steht üblicherweise vorne: <span class=\"la\">matronae<\/span> = Nominativ Plural, „die Damen“. Dann ist <span class=\"la\">filiae<\/span> Dativ Singular: „der Tochter“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Übersetzung: „Die Damen geben der Tochter ein Geschenk.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Auch möglich wäre: „Die Töchter der Dame geben ein Geschenk.“ (<span class=\"la\">matronae<\/span> Genitiv). Hier entscheidet der Textzusammenhang. Solche Fälle sind selten, aber du sollst sie erkennen und nicht blind die erste Lösung nehmen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"dekl3","t":"Die dritte Deklination","kl":"1","k":1,"a":"F","tag":"Basis","goals":["den Stamm eines Wortes der dritten Deklination aus dem Genitiv gewinnen","konsonantische und i-Stämme deklinieren","von einer gebeugten Form zum Nominativ im Wörterbuch zurückfinden","das Geschlecht an typischen Endungen erkennen"],"ex":[{"type":"txt","a":["regem"],"q":"Bilde den Akkusativ Singular von <span class=\"la\">rex, regis m.<\/span>","s":"Stamm <span class=\"la\">reg-<\/span> und Endung <span class=\"la\">-em<\/span>: <span class=\"la\">regem<\/span>."},{"type":"txt","a":["corpora"],"q":"Bilde den Nominativ Plural von <span class=\"la\">corpus, corporis n.<\/span>","s":"Neutrum: Plural auf <span class=\"la\">-a<\/span> am Stamm <span class=\"la\">corpor-<\/span>: <span class=\"la\">corpora<\/span>."},{"type":"txt","a":["urbium"],"q":"Bilde den Genitiv Plural von <span class=\"la\">urbs, urbis f.<\/span>","h":"Der Stamm endet auf zwei Konsonanten.","s":"<span class=\"la\">urbs<\/span> gehört zur Mischklasse und hat <span class=\"la\">-ium<\/span>: <span class=\"la\">urbium<\/span>."},{"type":"txt","a":["miles"],"q":"Im Text steht <span class=\"la\">militibus<\/span>. Wie lautet der Nominativ Singular?","s":"Stamm <span class=\"la\">milit-<\/span>. Vor dem <span class=\"la\">-s<\/span> des Nominativs fällt das t aus: <span class=\"la\">miles, militis m.<\/span> (Soldat)."},{"type":"mc","q":"Welche Bestimmung hat <span class=\"la\">patri<\/span>?","h":"<span class=\"la\">pater, patris<\/span> gehört zur dritten Deklination.","s":"In der dritten Deklination ist <span class=\"la\">-i<\/span> der Dativ Singular: „dem Vater“. Der Genitiv wäre <span class=\"la\">patris<\/span>, der Nominativ Plural <span class=\"la\">patres<\/span>.","o":["Dativ Singular","Genitiv Singular","Nominativ Plural","Ablativ Singular"]},{"type":"mc","q":"Welches Geschlecht hat <span class=\"la\">libertas, libertatis<\/span>?","s":"Wörter auf <span class=\"la\">-tas<\/span> sind feminin. Sie bezeichnen Eigenschaften und Zustände: <span class=\"la\">libertas<\/span> (Freiheit), <span class=\"la\">civitas<\/span> (Bürgerschaft), <span class=\"la\">veritas<\/span> (Wahrheit).","o":["feminin","maskulin","neutrum","maskulin oder feminin"]},{"type":"mc","q":"Welche Form ist <span class=\"la\">tempora<\/span>?","s":"<span class=\"la\">tempus, temporis n.<\/span> ist ein Neutrum. Die Endung <span class=\"la\">-a<\/span> am Stamm <span class=\"la\">tempor-<\/span> ist Nominativ oder Akkusativ Plural: „die Zeiten“. Dass ein Wort auf <span class=\"la\">-a<\/span> endet, heißt also nicht, dass es zur a-Deklination gehört.","o":["Nominativ oder Akkusativ Plural von <span class=\"la\">tempus<\/span>","Nominativ Singular der a-Deklination","Ablativ Singular von <span class=\"la\">tempus<\/span>","Genitiv Plural von <span class=\"la\">tempus<\/span>"]},{"type":"self","q":"Übersetze: <span class=\"la\">Milites regis urbem hostium capiunt.<\/span> (capere = einnehmen)","s":"„Die Soldaten des Königs nehmen die Stadt der Feinde ein.“ <span class=\"la\">milites<\/span> Subjekt, <span class=\"la\">regis<\/span> Genitivattribut dazu, <span class=\"la\">urbem<\/span> Akkusativobjekt, <span class=\"la\">hostium<\/span> Genitiv Plural als Attribut zu <span class=\"la\">urbem<\/span>."}],"gen":["dekl"],"html":"<h3>Das Besondere: Der Nominativ verrät den Stamm nicht<\/h3>\n<p>In der dritten Deklination sieht der Nominativ oft ganz anders aus als die übrigen Formen: <span class=\"la\">rex<\/span>, aber <span class=\"la\">reg-is<\/span>; <span class=\"la\">miles<\/span>, aber <span class=\"la\">milit-is<\/span>; <span class=\"la\">corpus<\/span>, aber <span class=\"la\">corpor-is<\/span>. Den <b>Stamm<\/b> erhältst du, indem du vom Genitiv Singular die Endung <span class=\"la\">-is<\/span> wegnimmst. Deshalb lernst du diese Wörter immer mit Genitiv und Geschlecht: <span class=\"la\">rex, regis m.<\/span><\/p>\n<h3>Die Formen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Kons. (m./f.)<\/th><th>Kons. (n.)<\/th><th>Mischklasse<\/th><th>i-Stamm (n.)<\/th><\/tr><tr><td>Nom. Sg.<\/td><td>rex<\/td><td>corpus<\/td><td>urbs<\/td><td>mare<\/td><\/tr><tr><td>Gen. Sg.<\/td><td>reg<b class=\"e\">is<\/b><\/td><td>corpor<b class=\"e\">is<\/b><\/td><td>urb<b class=\"e\">is<\/b><\/td><td>mar<b class=\"e\">is<\/b><\/td><\/tr><tr><td>Dat. Sg.<\/td><td>reg<b class=\"e\">i<\/b><\/td><td>corpor<b class=\"e\">i<\/b><\/td><td>urb<b class=\"e\">i<\/b><\/td><td>mar<b class=\"e\">i<\/b><\/td><\/tr><tr><td>Akk. Sg.<\/td><td>reg<b class=\"e\">em<\/b><\/td><td>corpus<\/td><td>urb<b class=\"e\">em<\/b><\/td><td>mare<\/td><\/tr><tr><td>Abl. Sg.<\/td><td>reg<b class=\"e\">e<\/b><\/td><td>corpor<b class=\"e\">e<\/b><\/td><td>urb<b class=\"e\">e<\/b><\/td><td>mar<b class=\"e\">i<\/b><\/td><\/tr><tr><td>Nom. Pl.<\/td><td>reg<b class=\"e\">es<\/b><\/td><td>corpor<b class=\"e\">a<\/b><\/td><td>urb<b class=\"e\">es<\/b><\/td><td>mar<b class=\"e\">ia<\/b><\/td><\/tr><tr><td>Gen. Pl.<\/td><td>reg<b class=\"e\">um<\/b><\/td><td>corpor<b class=\"e\">um<\/b><\/td><td>urb<b class=\"e\">ium<\/b><\/td><td>mar<b class=\"e\">ium<\/b><\/td><\/tr><tr><td>Dat. Pl.<\/td><td>reg<b class=\"e\">ibus<\/b><\/td><td>corpor<b class=\"e\">ibus<\/b><\/td><td>urb<b class=\"e\">ibus<\/b><\/td><td>mar<b class=\"e\">ibus<\/b><\/td><\/tr><tr><td>Akk. Pl.<\/td><td>reg<b class=\"e\">es<\/b><\/td><td>corpor<b class=\"e\">a<\/b><\/td><td>urb<b class=\"e\">es<\/b><\/td><td>mar<b class=\"e\">ia<\/b><\/td><\/tr><tr><td>Abl. Pl.<\/td><td>reg<b class=\"e\">ibus<\/b><\/td><td>corpor<b class=\"e\">ibus<\/b><\/td><td>urb<b class=\"e\">ibus<\/b><\/td><td>mar<b class=\"e\">ibus<\/b><\/td><\/tr><\/table><\/div>\n<p>Die Unterschiede zwischen den Gruppen sind klein: Die <b>Mischklasse<\/b> hat im Genitiv Plural <span class=\"la\">-ium<\/span>. Dazu gehören Wörter, deren Stamm auf zwei Konsonanten endet (<span class=\"la\">urbs, urbis<\/span>; <span class=\"la\">mons, montis<\/span>; <span class=\"la\">nox, noctis<\/span>), und gleichsilbige Wörter auf <span class=\"la\">-is<\/span> und <span class=\"la\">-es<\/span> (<span class=\"la\">navis, navis<\/span>; <span class=\"la\">hostis, hostis<\/span>). Die wenigen <b>Neutra auf -e, -al, -ar<\/b> haben zusätzlich Ablativ Singular auf <span class=\"la\">-i<\/span> und Plural auf <span class=\"la\">-ia<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">-i<\/span> ist in der dritten Deklination <b>Dativ<\/b> Singular, in der o-Deklination Genitiv Singular oder Nominativ Plural. <span class=\"la\">regi<\/span> heißt „dem König“, <span class=\"la\">domini<\/span> heißt „des Herrn“ oder „die Herren“. Du musst also wissen, zu welcher Deklination ein Wort gehört.<\/div>\n<h3>Zurück zum Nominativ<\/h3>\n<p>Im Text begegnen dir gebeugte Formen, im Wörterbuch steht der Nominativ. Diese Muster helfen beim Zurückfinden:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Stammende<\/th><th>Nominativ<\/th><th>Beispiele<\/th><\/tr><tr><td>-g-, -c-<\/td><td>-x<\/td><td><span class=\"la\">regis<\/span> → <span class=\"la\">rex<\/span>, <span class=\"la\">vocis<\/span> → <span class=\"la\">vox<\/span>, <span class=\"la\">pacis<\/span> → <span class=\"la\">pax<\/span><\/td><\/tr><tr><td>-t-, -d-<\/td><td>-s (der Dental fällt aus)<\/td><td><span class=\"la\">militis<\/span> → <span class=\"la\">miles<\/span>, <span class=\"la\">pedis<\/span> → <span class=\"la\">pes<\/span>, <span class=\"la\">virtutis<\/span> → <span class=\"la\">virtus<\/span><\/td><\/tr><tr><td>-tat-<\/td><td>-tas<\/td><td><span class=\"la\">civitatis<\/span> → <span class=\"la\">civitas<\/span>, <span class=\"la\">libertatis<\/span> → <span class=\"la\">libertas<\/span><\/td><\/tr><tr><td>-in-<\/td><td>-o oder -en<\/td><td><span class=\"la\">hominis<\/span> → <span class=\"la\">homo<\/span>, <span class=\"la\">nominis<\/span> → <span class=\"la\">nomen<\/span><\/td><\/tr><tr><td>-ion-<\/td><td>-io<\/td><td><span class=\"la\">nationis<\/span> → <span class=\"la\">natio<\/span>, <span class=\"la\">orationis<\/span> → <span class=\"la\">oratio<\/span><\/td><\/tr><tr><td>-or-, -er- (n.)<\/td><td>-us<\/td><td><span class=\"la\">corporis<\/span> → <span class=\"la\">corpus<\/span>, <span class=\"la\">generis<\/span> → <span class=\"la\">genus<\/span>, <span class=\"la\">operis<\/span> → <span class=\"la\">opus<\/span><\/td><\/tr><tr><td>-r-<\/td><td>-r<\/td><td><span class=\"la\">patris<\/span> → <span class=\"la\">pater<\/span>, <span class=\"la\">oratoris<\/span> → <span class=\"la\">orator<\/span><\/td><\/tr><\/table><\/div>\n<h3>Geschlecht erkennen<\/h3>\n<ul><li><b>maskulin:<\/b> Wörter auf <span class=\"la\">-or, -oris<\/span> (<span class=\"la\">labor<\/span>, <span class=\"la\">orator<\/span>) und männliche Personen<\/li><li><b>feminin:<\/b> Wörter auf <span class=\"la\">-tas<\/span>, <span class=\"la\">-tus (-tutis)<\/span>, <span class=\"la\">-io<\/span>, <span class=\"la\">-tudo<\/span>, meist auch <span class=\"la\">-x<\/span> und <span class=\"la\">-s<\/span> nach Konsonant (<span class=\"la\">libertas<\/span>, <span class=\"la\">virtus<\/span>, <span class=\"la\">natio<\/span>, <span class=\"la\">pax<\/span>, <span class=\"la\">urbs<\/span>)<\/li><li><b>neutrum:<\/b> Wörter auf <span class=\"la\">-men<\/span>, <span class=\"la\">-us (-eris, -oris)<\/span>, <span class=\"la\">-e<\/span>, <span class=\"la\">-al<\/span>, <span class=\"la\">-ar<\/span> (<span class=\"la\">nomen<\/span>, <span class=\"la\">genus<\/span>, <span class=\"la\">tempus<\/span>, <span class=\"la\">mare<\/span>, <span class=\"la\">animal<\/span>)<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Vom Text zum Wörterbuch<\/h4><div class=\"task\">Im Text steht <span class=\"la\">itineribus<\/span>. Bestimme die Form und finde den Wörterbucheintrag.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die Endung <span class=\"la\">-ibus<\/span> gibt es nur in der dritten (und vierten) Deklination. Sie bezeichnet Dativ oder Ablativ Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Stamm abtrennen: <span class=\"la\">itiner-<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Stämme auf <span class=\"la\">-er-<\/span> gehören oft zu Neutra. Suche im Wörterbuch unter <span class=\"la\">iter<\/span>: Dort steht <span class=\"la\">iter, itineris n.<\/span> Weg, Reise, Marsch.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Bestimmung: Dativ oder Ablativ Plural von <span class=\"la\">iter<\/span>. Ohne Präposition meist Ablativ: „durch die Märsche“, „auf den Wegen“. Der Satz entscheidet.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"dekl45","t":"u- und e-Deklination, Überblick über alle Deklinationen","kl":"1","k":1,"a":"F","tag":"Basis","goals":["Substantive der u- und e-Deklination deklinieren","alle fünf Deklinationen an ihrem Genitiv unterscheiden","die Sonderformen von domus und die Ortsangaben dazu kennen","jede Substantivform sicher bestimmen"],"ex":[{"type":"txt","a":["exercitui"],"q":"Bilde den Dativ Singular von <span class=\"la\">exercitus, -us m.<\/span>","s":"Stamm <span class=\"la\">exercit-<\/span> und Endung <span class=\"la\">-ui<\/span>: <span class=\"la\">exercitui<\/span> (dem Heer)."},{"type":"txt","a":["rerum"],"q":"Bilde den Genitiv Plural von <span class=\"la\">res, rei f.<\/span>","s":"<span class=\"la\">rerum<\/span>. Du kennst die Form aus dem Titel des Lehrgedichts <span class=\"la\">De rerum natura<\/span> (Über die Natur der Dinge)."},{"type":"txt","a":["die"],"q":"Bilde den Ablativ Singular von <span class=\"la\">dies, diei m.<\/span>","s":"<span class=\"la\">die<\/span>. Die Form steckt in vielen Zeitangaben: <span class=\"la\">eo die<\/span> (an diesem Tag), <span class=\"la\">postero die<\/span> (am folgenden Tag)."},{"type":"mc","q":"Welche Bestimmung ist für <span class=\"la\">senatus<\/span> <b>nicht<\/b> möglich?","s":"Der Dativ Singular lautet <span class=\"la\">senatui<\/span>. Die anderen drei Bestimmungen teilen sich die Form <span class=\"la\">senatus<\/span>.","o":["Dativ Singular","Nominativ Singular","Genitiv Singular","Akkusativ Plural"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">domi<\/span>?","s":"<span class=\"la\">domi<\/span> ist eine alte Ortsform (Lokativ) und antwortet auf die Frage „wo?“. „Nach Hause“ heißt <span class=\"la\">domum<\/span>, „von zu Hause“ <span class=\"la\">domo<\/span>.","o":["zu Hause","nach Hause","von zu Hause","die Häuser"]},{"type":"mc","q":"Zu welcher Deklination gehört ein Wort mit der Wörterbuchangabe <span class=\"la\">casus, -us m.<\/span>?","s":"Der Genitiv auf <span class=\"la\">-us<\/span> zeigt die u-Deklination. Bei der o-Deklination stünde <span class=\"la\">-i<\/span>.","o":["u-Deklination","o-Deklination","3. Deklination","e-Deklination"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">res publica<\/span> am besten?","s":"Wörtlich „die öffentliche Sache“, gemeint ist das Gemeinwesen, der Staat. Davon kommt unser Wort Republik. Bei <span class=\"la\">res<\/span> gilt immer: nicht „Sache“ hinschreiben, sondern das Gemeinte suchen.","o":["der Staat","die öffentliche Sache","das Publikum","die Rede"]},{"type":"self","q":"Übersetze: <span class=\"la\">Senatus exercitui victoriam nuntiat.<\/span> (victoria = Sieg; nuntiare = melden)","s":"„Der Senat meldet dem Heer den Sieg.“ <span class=\"la\">senatus<\/span> ist hier Nominativ Singular (das Prädikat steht im Singular), <span class=\"la\">exercitui<\/span> Dativ."}],"gen":["dekl"],"html":"<h3>Die u-Deklination<\/h3>\n<p>Hierher gehören vor allem maskuline Wörter auf <span class=\"la\">-us<\/span> mit dem Genitiv auf <span class=\"la\">-us<\/span>: <span class=\"la\">exercitus, -us m.<\/span> (Heer), <span class=\"la\">senatus<\/span> (Senat), <span class=\"la\">metus<\/span> (Furcht), <span class=\"la\">casus<\/span> (Fall, Zufall), <span class=\"la\">adventus<\/span> (Ankunft). Feminin sind <span class=\"la\">manus<\/span> (Hand, Schar) und <span class=\"la\">domus<\/span> (Haus). Die wenigen Neutra enden auf <span class=\"la\">-u<\/span>: <span class=\"la\">cornu<\/span> (Horn, Flügel des Heeres).<\/p>\n<h3>Die e-Deklination<\/h3>\n<p>Alle Wörter sind feminin, mit einer wichtigen Ausnahme: <span class=\"la\">dies<\/span> (Tag) ist maskulin. Am häufigsten ist <span class=\"la\">res, rei f.<\/span> Dieses Wort bedeutet „Sache“, wird aber fast nie so übersetzt. Sieh dir immer an, was gemeint ist: Angelegenheit, Ereignis, Lage, Umstand, Tat, Besitz. <span class=\"la\">res publica<\/span> ist der Staat, <span class=\"la\">res gestae<\/span> sind Taten, <span class=\"la\">res secundae<\/span> ist das Glück, <span class=\"la\">res adversae<\/span> das Unglück.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>u-Dekl.<\/th><th>e-Dekl.<\/th><th>e-Dekl.<\/th><\/tr><tr><td>Nom. Sg.<\/td><td>exercit<b class=\"e\">us<\/b><\/td><td>r<b class=\"e\">es<\/b><\/td><td>di<b class=\"e\">es<\/b><\/td><\/tr><tr><td>Gen. Sg.<\/td><td>exercit<b class=\"e\">us<\/b><\/td><td>r<b class=\"e\">ei<\/b><\/td><td>di<b class=\"e\">ei<\/b><\/td><\/tr><tr><td>Dat. Sg.<\/td><td>exercit<b class=\"e\">ui<\/b><\/td><td>r<b class=\"e\">ei<\/b><\/td><td>di<b class=\"e\">ei<\/b><\/td><\/tr><tr><td>Akk. Sg.<\/td><td>exercit<b class=\"e\">um<\/b><\/td><td>r<b class=\"e\">em<\/b><\/td><td>di<b class=\"e\">em<\/b><\/td><\/tr><tr><td>Abl. Sg.<\/td><td>exercit<b class=\"e\">u<\/b><\/td><td>r<b class=\"e\">e<\/b><\/td><td>di<b class=\"e\">e<\/b><\/td><\/tr><tr><td>Nom. Pl.<\/td><td>exercit<b class=\"e\">us<\/b><\/td><td>r<b class=\"e\">es<\/b><\/td><td>di<b class=\"e\">es<\/b><\/td><\/tr><tr><td>Gen. Pl.<\/td><td>exercit<b class=\"e\">uum<\/b><\/td><td>r<b class=\"e\">erum<\/b><\/td><td>di<b class=\"e\">erum<\/b><\/td><\/tr><tr><td>Dat. Pl.<\/td><td>exercit<b class=\"e\">ibus<\/b><\/td><td>r<b class=\"e\">ebus<\/b><\/td><td>di<b class=\"e\">ebus<\/b><\/td><\/tr><tr><td>Akk. Pl.<\/td><td>exercit<b class=\"e\">us<\/b><\/td><td>r<b class=\"e\">es<\/b><\/td><td>di<b class=\"e\">es<\/b><\/td><\/tr><tr><td>Abl. Pl.<\/td><td>exercit<b class=\"e\">ibus<\/b><\/td><td>r<b class=\"e\">ebus<\/b><\/td><td>di<b class=\"e\">ebus<\/b><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die Endung <span class=\"la\">-us<\/span> ist tückisch. Bei <span class=\"la\">dominus<\/span> ist sie Nominativ Singular. Bei <span class=\"la\">exercitus<\/span> kann sie Nominativ Singular, Genitiv Singular, Nominativ Plural oder Akkusativ Plural sein. Und bei <span class=\"la\">corpus<\/span> oder <span class=\"la\">tempus<\/span> ist sie Nominativ oder Akkusativ eines Neutrums der dritten Deklination. Ohne Wörterbuchangabe geht es nicht.<\/div>\n<h3>domus<\/h3>\n<p><span class=\"la\">domus<\/span> mischt Formen der u- und der o-Deklination (Ablativ <span class=\"la\">domo<\/span>, Akkusativ Plural <span class=\"la\">domos<\/span>). Merken musst du dir vor allem drei Ortsangaben ohne Präposition:<\/p>\n<div class=\"formula\"><span class=\"la\">domi<\/span> zu Hause – <span class=\"la\">domum<\/span> nach Hause – <span class=\"la\">domo<\/span> von zu Hause<\/div>\n<h3>Alle Deklinationen auf einen Blick<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Deklination<\/th><th>Genitiv Sg.<\/th><th>Beispiel<\/th><th>Geschlecht meist<\/th><\/tr><tr><td>a-Deklination<\/td><td><span class=\"la\">-ae<\/span><\/td><td><span class=\"la\">puella, puellae<\/span><\/td><td>feminin<\/td><\/tr><tr><td>o-Deklination<\/td><td><span class=\"la\">-i<\/span><\/td><td><span class=\"la\">dominus, domini<\/span>; <span class=\"la\">templum, templi<\/span><\/td><td>maskulin, neutrum<\/td><\/tr><tr><td>3. Deklination<\/td><td><span class=\"la\">-is<\/span><\/td><td><span class=\"la\">rex, regis<\/span><\/td><td>alle drei<\/td><\/tr><tr><td>u-Deklination<\/td><td><span class=\"la\">-us<\/span><\/td><td><span class=\"la\">exercitus, exercitus<\/span><\/td><td>maskulin<\/td><\/tr><tr><td>e-Deklination<\/td><td><span class=\"la\">-ei<\/span><\/td><td><span class=\"la\">res, rei<\/span><\/td><td>feminin<\/td><\/tr><\/table><\/div>\n<p>Gemeinsamkeiten, die dir das Lernen erleichtern: Der Akkusativ Singular endet bei maskulinen und femininen Wörtern immer auf <span class=\"la\">-m<\/span>. Der Akkusativ Plural endet immer auf <span class=\"la\">-s<\/span>. Der Genitiv Plural endet immer auf <span class=\"la\">-um<\/span> (<span class=\"la\">-arum, -orum, -um, -ium, -uum, -erum<\/span>). Dativ und Ablativ Plural sind immer gleich.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Form bestimmen mit System<\/h4><div class=\"task\">Bestimme <span class=\"la\">rebus<\/span> und <span class=\"la\">manus<\/span> im Satz <span class=\"la\">Milites his rebus territi manus ad caelum tendunt.<\/span> (his = durch diese; territi = erschreckt; tendere = strecken)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">rebus<\/span>: Endung <span class=\"la\">-ebus<\/span>, das gibt es nur in der e-Deklination. Dativ oder Ablativ Plural von <span class=\"la\">res<\/span>. Mit <span class=\"la\">his<\/span> zusammen und ohne Präposition: Ablativ, „durch diese Ereignisse“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">manus<\/span>: u-Deklination. Möglich sind Nominativ Singular, Genitiv Singular, Nominativ Plural, Akkusativ Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Das Prädikat <span class=\"la\">tendunt<\/span> (sie strecken) hat schon ein Subjekt: <span class=\"la\">milites<\/span>. „Strecken“ braucht ein Objekt. Also ist <span class=\"la\">manus<\/span> Akkusativ Plural: „die Hände“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übersetzung: „Die Soldaten strecken, durch diese Ereignisse erschreckt, die Hände zum Himmel.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"adj","t":"Adjektive, KNG-Kongruenz und Adverbien","kl":"1","k":1,"a":"F","tag":"Basis","goals":["Adjektive der a-/o-Deklination und der dritten Deklination deklinieren","Adjektive mit Hilfe von Kasus, Numerus und Genus dem richtigen Substantiv zuordnen","substantivierte Adjektive übersetzen","Adverbien bilden und erkennen"],"ex":[{"type":"txt","a":["magnae"],"q":"Bilde die passende Form von <span class=\"la\">magnus, -a, -um<\/span> zu <span class=\"la\">urbis<\/span> (Genitiv Singular feminin).","h":"Genitiv Singular feminin der a-Deklination.","s":"<span class=\"la\">urbis magnae<\/span> (der großen Stadt). Das Substantiv geht nach der dritten, das Adjektiv nach der a-Deklination. Übereinstimmen müssen nur Kasus, Numerus und Genus."},{"type":"txt","a":["forti"],"q":"Bilde die passende Form von <span class=\"la\">fortis, -e<\/span> zu <span class=\"la\">cum milite<\/span> (Ablativ Singular).","s":"<span class=\"la\">cum milite forti<\/span> (mit dem tapferen Soldaten). Adjektive der dritten Deklination haben im Ablativ Singular <span class=\"la\">-i<\/span>, das Substantiv <span class=\"la\">miles<\/span> dagegen <span class=\"la\">-e<\/span>."},{"type":"txt","a":["omnia"],"q":"Bilde den Akkusativ Plural Neutrum von <span class=\"la\">omnis, -e<\/span>.","s":"<span class=\"la\">omnia<\/span> (alles, alle Dinge). Du kennst die Form aus <span class=\"la\">Omnia vincit amor<\/span> (Alles besiegt die Liebe; Vergil)."},{"type":"mc","q":"Zu welchem Wort gehört <span class=\"la\">clarum<\/span> im Satz <span class=\"la\">Clarum Romani poetam laudant.<\/span>?","h":"Vergleiche Kasus, Numerus und Genus.","s":"<span class=\"la\">clarum<\/span> ist Akkusativ Singular maskulin, <span class=\"la\">poetam<\/span> ebenfalls (<span class=\"la\">poeta<\/span> ist maskulin). „Die Römer loben den berühmten Dichter.“ Die verschiedenen Endungen <span class=\"la\">-um<\/span> und <span class=\"la\">-am<\/span> dürfen dich nicht täuschen.","o":["zu <span class=\"la\">poetam<\/span>","zu <span class=\"la\">Romani<\/span>","zu <span class=\"la\">laudant<\/span>","Es steht allein und bedeutet „das Berühmte“."]},{"type":"mc","q":"Was bedeutet <span class=\"la\">multa<\/span> im Satz <span class=\"la\">Magister multa scit.<\/span> (scire = wissen)?","s":"<span class=\"la\">multa<\/span> ist Akkusativ Plural Neutrum und steht ohne Substantiv: „viele Dinge“, also „vieles“. „Der Lehrer weiß vieles.“","o":["vieles","viele Frauen","die viele","sehr"]},{"type":"txt","a":["fortiter"],"q":"Bilde das Adverb zu <span class=\"la\">fortis<\/span> (tapfer).","s":"Adjektive der dritten Deklination bilden das Adverb auf <span class=\"la\">-iter<\/span>: <span class=\"la\">fortiter<\/span>."},{"type":"txt","a":["bene"],"q":"Wie lautet das Adverb zu <span class=\"la\">bonus<\/span> (gut)?","s":"Unregelmäßig: <span class=\"la\">bene<\/span>. Ebenso unregelmäßig ist <span class=\"la\">male<\/span> zu <span class=\"la\">malus<\/span>."},{"type":"self","q":"Übersetze: <span class=\"la\">Omnes cives regem iustum amant.<\/span> (civis = Bürger; iustus = gerecht)","s":"„Alle Bürger lieben den gerechten König.“ <span class=\"la\">omnes cives<\/span> gehört zusammen (Nominativ Plural), ebenso <span class=\"la\">regem iustum<\/span> (Akkusativ Singular maskulin)."}],"gen":["kng"],"html":"<h3>Zwei Gruppen von Adjektiven<\/h3>\n<p><b>Adjektive der a- und o-Deklination<\/b> haben drei Endungen und gehen wie <span class=\"la\">dominus<\/span>, <span class=\"la\">puella<\/span> und <span class=\"la\">templum<\/span>: <span class=\"la\">magn<b class=\"e\">us<\/b>, magn<b class=\"e\">a<\/b>, magn<b class=\"e\">um<\/b><\/span>. Einige enden im Maskulinum auf <span class=\"la\">-er<\/span>: <span class=\"la\">pulcher, pulchra, pulchrum<\/span> (schön), <span class=\"la\">miser, misera, miserum<\/span> (elend).<\/p>\n<p><b>Adjektive der dritten Deklination<\/b> gehen wie die i-Stämme. Sie haben im Ablativ Singular <span class=\"la\">-i<\/span>, im Genitiv Plural <span class=\"la\">-ium<\/span> und im Neutrum Plural <span class=\"la\">-ia<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>m./f.<\/th><th>n.<\/th><th>m./f. Plural<\/th><th>n. Plural<\/th><\/tr><tr><td>Nom.<\/td><td>fort<b class=\"e\">is<\/b><\/td><td>fort<b class=\"e\">e<\/b><\/td><td>fort<b class=\"e\">es<\/b><\/td><td>fort<b class=\"e\">ia<\/b><\/td><\/tr><tr><td>Gen.<\/td><td>fort<b class=\"e\">is<\/b><\/td><td>fort<b class=\"e\">is<\/b><\/td><td>fort<b class=\"e\">ium<\/b><\/td><td>fort<b class=\"e\">ium<\/b><\/td><\/tr><tr><td>Dat.<\/td><td>fort<b class=\"e\">i<\/b><\/td><td>fort<b class=\"e\">i<\/b><\/td><td>fort<b class=\"e\">ibus<\/b><\/td><td>fort<b class=\"e\">ibus<\/b><\/td><\/tr><tr><td>Akk.<\/td><td>fort<b class=\"e\">em<\/b><\/td><td>fort<b class=\"e\">e<\/b><\/td><td>fort<b class=\"e\">es<\/b><\/td><td>fort<b class=\"e\">ia<\/b><\/td><\/tr><tr><td>Abl.<\/td><td>fort<b class=\"e\">i<\/b><\/td><td>fort<b class=\"e\">i<\/b><\/td><td>fort<b class=\"e\">ibus<\/b><\/td><td>fort<b class=\"e\">ibus<\/b><\/td><\/tr><\/table><\/div>\n<p>Im Wörterbuch erkennst du drei Typen: dreiendig (<span class=\"la\">acer, acris, acre<\/span>), zweiendig (<span class=\"la\">fortis, forte<\/span>) und einendig mit Genitiv (<span class=\"la\">felix, felicis<\/span>; <span class=\"la\">ingens, ingentis<\/span>; <span class=\"la\">sapiens, sapientis<\/span>).<\/p>\n<h3>KNG: Das Adjektiv richtet sich nach seinem Substantiv<\/h3>\n<p>Ein Adjektiv stimmt mit seinem Bezugswort in <b>K<\/b>asus, <b>N<\/b>umerus und <b>G<\/b>enus überein. Das ist die KNG-Kongruenz.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Übereinstimmen heißt nicht „gleich aussehen“. Wenn Substantiv und Adjektiv zu verschiedenen Deklinationen gehören, haben sie verschiedene Endungen: <span class=\"la\">rex bon<b class=\"e\">us<\/b><\/span>, <span class=\"la\">regis bon<b class=\"e\">i<\/b><\/span>, <span class=\"la\">urbs magn<b class=\"e\">a<\/b><\/span>, <span class=\"la\">poeta clar<b class=\"e\">us<\/b><\/span>, <span class=\"la\">corpus fort<b class=\"e\">e<\/b><\/span>, <span class=\"la\">manus dextr<b class=\"e\">a<\/b><\/span>.<\/div>\n<p>Weil die KNG-Kongruenz so zuverlässig ist, darf das Adjektiv weit von seinem Substantiv entfernt stehen. In der Dichtung ist das die Regel. Du findest zusammengehörige Wörter, indem du KNG vergleichst und nicht, indem du schaust, was nebeneinander steht.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Adjektiv und Substantiv zuordnen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Magnam fortes milites urbem defendunt.<\/span> (defendere = verteidigen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">defendunt<\/span>, 3. Person Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Subjekt: <span class=\"la\">milites<\/span> kann Nominativ Plural sein. Dazu passt <span class=\"la\">fortes<\/span> (Nominativ Plural maskulin): „die tapferen Soldaten“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Objekt: <span class=\"la\">urbem<\/span>, Akkusativ Singular feminin.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">magnam<\/span> ist Akkusativ Singular feminin. Es kann nur zu <span class=\"la\">urbem<\/span> gehören, obwohl zwei Wörter dazwischen stehen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Die tapferen Soldaten verteidigen die große Stadt.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Verwendung<\/h3>\n<ul><li><b>attributiv:<\/b> <span class=\"la\">vir bonus<\/span> – ein guter Mann<\/li><li><b>prädikativ<\/b> mit <span class=\"la\">esse<\/span>: <span class=\"la\">Vir bonus est.<\/span> – Der Mann ist gut.<\/li><li><b>substantiviert:<\/b> Das Adjektiv steht allein. Im Maskulinum Plural sind Menschen gemeint (<span class=\"la\">boni<\/span> – die Guten, <span class=\"la\">Romani<\/span> – die Römer, <span class=\"la\">multi<\/span> – viele), im Neutrum Plural Dinge (<span class=\"la\">multa<\/span> – vieles, <span class=\"la\">omnia<\/span> – alles, <span class=\"la\">bona<\/span> – Güter, <span class=\"la\">vera<\/span> – Wahres).<\/li><\/ul>\n<h3>Adverbien<\/h3>\n<p>Das Adverb bestimmt ein Verb näher und ist unveränderlich. Es wird vom Adjektiv gebildet:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Adjektiv<\/th><th>Bildung<\/th><th>Adverb<\/th><\/tr><tr><td>a-/o-Deklination: <span class=\"la\">longus<\/span><\/td><td>Stamm + <span class=\"la\">-e<\/span><\/td><td><span class=\"la\">long<b class=\"e\">e<\/b><\/span> weit<\/td><\/tr><tr><td>3. Deklination: <span class=\"la\">fortis<\/span><\/td><td>Stamm + <span class=\"la\">-iter<\/span><\/td><td><span class=\"la\">fort<b class=\"e\">iter<\/b><\/span> tapfer<\/td><\/tr><tr><td>auf <span class=\"la\">-ns<\/span>: <span class=\"la\">sapiens<\/span><\/td><td>Stamm + <span class=\"la\">-er<\/span><\/td><td><span class=\"la\">sapient<b class=\"e\">er<\/b><\/span> weise<\/td><\/tr><tr><td>unregelmäßig<\/td><td>| <span class=\"la\">bene<\/span> gut, <span class=\"la\">male<\/span> schlecht, <span class=\"la\">facile<\/span> leicht, <span class=\"la\">multum<\/span> viel<\/td><\/tr><\/table><\/div>\n<p>Im Deutschen sehen Adjektiv und Adverb gleich aus („Der Soldat ist tapfer“ und „Er kämpft tapfer“). Im Lateinischen nicht: <span class=\"la\">Miles fortis est.<\/span> – <span class=\"la\">Fortiter pugnat.<\/span><\/p>"},{"id":"steig","t":"Die Steigerung der Adjektive und Adverbien","kl":"1","k":1,"a":"F","tag":"Basis","goals":["Komparativ und Superlativ bilden und im Text erkennen","die unregelmäßigen Steigerungsformen auswendig können","Vergleiche mit quam und mit dem Ablativ übersetzen","die verschiedenen Übersetzungsmöglichkeiten von Komparativ und Superlativ anwenden"],"ex":[{"type":"txt","a":["fortior"],"q":"Bilde den Komparativ (Nominativ Singular maskulin) von <span class=\"la\">fortis<\/span>.","s":"Stamm <span class=\"la\">fort-<\/span> und <span class=\"la\">-ior<\/span>: <span class=\"la\">fortior<\/span>."},{"type":"txt","a":["pulcherrimus"],"q":"Bilde den Superlativ (Nominativ Singular maskulin) von <span class=\"la\">pulcher, pulchra, pulchrum<\/span>.","h":"Adjektive auf <span class=\"la\">-er<\/span> haben eine eigene Superlativendung.","s":"<span class=\"la\">pulcherrimus<\/span>: An den Nominativ auf <span class=\"la\">-er<\/span> tritt <span class=\"la\">-rimus<\/span>."},{"type":"txt","a":["optimus"],"q":"Wie lautet der Superlativ von <span class=\"la\">bonus<\/span>?","s":"<span class=\"la\">bonus – melior – optimus<\/span>."},{"type":"txt","a":["peior"],"q":"Wie lautet der Komparativ (maskulin) von <span class=\"la\">malus<\/span>?","s":"<span class=\"la\">malus – peior – pessimus<\/span>."},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">quam celerrime<\/span>?","s":"<span class=\"la\">quam<\/span> vor einem Superlativ bedeutet „möglichst“. Die Wendung ist bei Caesar sehr häufig.","o":["möglichst schnell","schneller als","wie schnell","am schnellsten von allen"]},{"type":"mc","q":"Welche Übersetzung passt für <span class=\"la\">Cicero orator clarissimus erat.<\/span>, wenn im Text niemand verglichen wird?","s":"Ein Superlativ ohne Vergleichsgruppe wird als Elativ mit „sehr“ oder „überaus“ wiedergegeben. „Der berühmteste Redner“ wäre auch möglich, wenn eine Gruppe mitgedacht ist.","o":["Cicero war ein sehr berühmter Redner.","Cicero war berühmter als ein Redner.","Cicero war ein ziemlich berühmter Redner.","Cicero war der berühmtere Redner."]},{"type":"mc","q":"In welchem Fall steht <span class=\"la\">luce<\/span> im Satz <span class=\"la\">Nihil est clarius luce.<\/span> (lux = Licht), und warum?","s":"Ablativus comparationis nach dem Komparativ <span class=\"la\">clarius<\/span>: „Nichts ist heller als das Licht.“ Mit <span class=\"la\">quam<\/span> hieße es <span class=\"la\">quam lux<\/span>.","o":["im Ablativ, weil es den Vergleich ausdrückt","im Dativ, weil es das Objekt ist","im Ablativ, weil es den Ort angibt","im Nominativ, weil es das Subjekt ist"]},{"type":"self","q":"Übersetze: <span class=\"la\">Hostes maiorem exercitum habent quam Romani.<\/span>","s":"„Die Feinde haben ein größeres Heer als die Römer.“ <span class=\"la\">maiorem<\/span> ist Komparativ von <span class=\"la\">magnus<\/span> im Akkusativ Singular maskulin und gehört zu <span class=\"la\">exercitum<\/span>. Nach <span class=\"la\">quam<\/span> steht <span class=\"la\">Romani<\/span> im Nominativ, weil es mit dem Subjekt <span class=\"la\">hostes<\/span> verglichen wird."}],"gen":["steig"],"html":"<h3>Die Bildung<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Stufe<\/th><th>Bildung<\/th><th>Beispiel<\/th><\/tr><tr><td>Positiv<\/td><td>Grundform<\/td><td><span class=\"la\">long<b class=\"e\">us<\/b>, -a, -um<\/span> lang<\/td><\/tr><tr><td>Komparativ<\/td><td>Stamm + <span class=\"la\">-ior<\/span> (m./f.), <span class=\"la\">-ius<\/span> (n.)<\/td><td><span class=\"la\">long<b class=\"e\">ior<\/b>, long<b class=\"e\">ius<\/b><\/span> länger<\/td><\/tr><tr><td>Superlativ<\/td><td>Stamm + <span class=\"la\">-issimus, -a, -um<\/span><\/td><td><span class=\"la\">long<b class=\"e\">issimus<\/b><\/span> der längste<\/td><\/tr><\/table><\/div>\n<p>Der <b>Komparativ<\/b> wird nach der dritten Deklination (konsonantisch) dekliniert: <span class=\"la\">longior, longioris, longiori, longiorem, longiore<\/span>; Plural <span class=\"la\">longiores, longiorum<\/span>; Neutrum Plural <span class=\"la\">longiora<\/span>. Der <b>Superlativ<\/b> geht nach der a- und o-Deklination.<\/p>\n<p>Zwei Sondergruppen beim Superlativ:<\/p>\n<ul><li>Adjektive auf <span class=\"la\">-er<\/span>: <span class=\"la\">-errimus<\/span>. <span class=\"la\">pulcher<\/span> → <span class=\"la\">pulcherrimus<\/span>, <span class=\"la\">miser<\/span> → <span class=\"la\">miserrimus<\/span>, <span class=\"la\">acer<\/span> → <span class=\"la\">acerrimus<\/span><\/li><li>sechs Adjektive auf <span class=\"la\">-ilis<\/span>: <span class=\"la\">-illimus<\/span>. <span class=\"la\">facilis<\/span> → <span class=\"la\">facillimus<\/span>, ebenso <span class=\"la\">difficilis<\/span>, <span class=\"la\">similis<\/span>, <span class=\"la\">dissimilis<\/span>, <span class=\"la\">humilis<\/span>, <span class=\"la\">gracilis<\/span><\/li><\/ul>\n<h3>Unregelmäßige Steigerung<\/h3>\n<p>Diese fünf Reihen kommen ständig vor. Lerne sie auswendig.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Positiv<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td><span class=\"la\">bonus<\/span> gut<\/td><td><span class=\"la\">melior, melius<\/span><\/td><td><span class=\"la\">optimus<\/span><\/td><\/tr><tr><td><span class=\"la\">malus<\/span> schlecht<\/td><td><span class=\"la\">peior, peius<\/span><\/td><td><span class=\"la\">pessimus<\/span><\/td><\/tr><tr><td><span class=\"la\">magnus<\/span> groß<\/td><td><span class=\"la\">maior, maius<\/span><\/td><td><span class=\"la\">maximus<\/span><\/td><\/tr><tr><td><span class=\"la\">parvus<\/span> klein<\/td><td><span class=\"la\">minor, minus<\/span><\/td><td><span class=\"la\">minimus<\/span><\/td><\/tr><tr><td><span class=\"la\">multi<\/span> viele<\/td><td><span class=\"la\">plures, plura<\/span><\/td><td><span class=\"la\">plurimi<\/span><\/td><\/tr><\/table><\/div>\n<p>Viele Fremdwörter helfen dir beim Merken: optimal, Pessimist, Major, Maximum, Minimum, Minus, Plural.<\/p>\n<h3>Der Vergleich<\/h3>\n<p>Womit verglichen wird, steht entweder nach <span class=\"la\">quam<\/span> (als) im selben Fall oder im bloßen Ablativ, dem <b>Ablativus comparationis<\/b>:<\/p>\n<div class=\"formula\"><span class=\"la\">Marcus fortior est quam Titus.<\/span> = <span class=\"la\">Marcus fortior est Tito.<\/span> – Marcus ist tapferer als Titus.<\/div>\n<h3>Richtig übersetzen<\/h3>\n<p>Nicht jeder Komparativ ist ein Vergleich, und nicht jeder Superlativ bezeichnet die Spitze.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Form<\/th><th>ohne Vergleich<\/th><th>Beispiel<\/th><\/tr><tr><td>Komparativ<\/td><td>„ziemlich“, „recht“, „allzu“<\/td><td><span class=\"la\">iter longius<\/span> – ein ziemlich langer Weg<\/td><\/tr><tr><td>Superlativ (Elativ)<\/td><td>„sehr“, „überaus“, „äußerst“<\/td><td><span class=\"la\">vir fortissimus<\/span> – ein sehr tapferer Mann<\/td><\/tr><tr><td><span class=\"la\">quam<\/span> + Superlativ<\/td><td>„möglichst“<\/td><td><span class=\"la\">quam celerrime<\/span> – möglichst schnell<\/td><\/tr><\/table><\/div>\n<h3>Steigerung der Adverbien<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Positiv<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td><span class=\"la\">longe<\/span>, <span class=\"la\">fortiter<\/span><\/td><td><span class=\"la\">-ius<\/span>: <span class=\"la\">longius<\/span>, <span class=\"la\">fortius<\/span><\/td><td><span class=\"la\">-issime<\/span>: <span class=\"la\">longissime<\/span>, <span class=\"la\">fortissime<\/span><\/td><\/tr><tr><td><span class=\"la\">bene<\/span><\/td><td><span class=\"la\">melius<\/span><\/td><td><span class=\"la\">optime<\/span><\/td><\/tr><tr><td><span class=\"la\">male<\/span><\/td><td><span class=\"la\">peius<\/span><\/td><td><span class=\"la\">pessime<\/span><\/td><\/tr><tr><td><span class=\"la\">multum<\/span><\/td><td><span class=\"la\">plus<\/span><\/td><td><span class=\"la\">plurimum<\/span><\/td><\/tr><tr><td><span class=\"la\">magnopere<\/span><\/td><td><span class=\"la\">magis<\/span><\/td><td><span class=\"la\">maxime<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die Form auf <span class=\"la\">-ius<\/span> ist doppeldeutig: <span class=\"la\">fortius<\/span> kann das Neutrum des Komparativs sein („ein tapfereres …“) oder das Adverb im Komparativ („tapferer kämpfen“). Steht kein passendes Neutrum im Satz, ist es das Adverb.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Komparativ im Satz<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Nihil est melius amico fideli.<\/span> (nihil = nichts; fidelis = treu)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">est<\/span>. Subjekt: <span class=\"la\">nihil<\/span> (nichts), ein Neutrum.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">melius<\/span> ist Komparativ zu <span class=\"la\">bonus<\/span>, hier im Neutrum, weil es sich auf <span class=\"la\">nihil<\/span> bezieht: „besser“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Ein Komparativ lässt einen Vergleich erwarten. Es steht kein <span class=\"la\">quam<\/span> da, also suche einen Ablativ: <span class=\"la\">amico fideli<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">fideli<\/span> ist Ablativ Singular (Adjektiv der dritten Deklination auf <span class=\"la\">-i<\/span>) und passt zu <span class=\"la\">amico<\/span>.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Nichts ist besser als ein treuer Freund.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"pron1","t":"Personal-, Possessiv- und Reflexivpronomen","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die Formen von ego, tu, nos, vos und se beherrschen","Possessivpronomen richtig zuordnen","reflexive und nicht reflexive Formen der dritten Person unterscheiden","suus und eius korrekt übersetzen"],"ex":[{"type":"txt","a":["mihi"],"q":"Bilde den Dativ von <span class=\"la\">ego<\/span>.","s":"<span class=\"la\">mihi<\/span> (mir)."},{"type":"txt","a":["nobiscum"],"q":"Wie sagt man „mit uns“?","s":"<span class=\"la\">cum<\/span> wird an das Pronomen angehängt: <span class=\"la\">nobiscum<\/span>."},{"type":"mc","q":"Was bedeutet <span class=\"la\">Pater filium suum monet.<\/span>?","s":"<span class=\"la\">suum<\/span> ist reflexiv und bezieht sich auf das Subjekt <span class=\"la\">pater<\/span>. Es ist der Sohn des Vaters selbst.","o":["Der Vater ermahnt seinen eigenen Sohn.","Der Vater ermahnt dessen Sohn.","Der Sohn ermahnt seinen Vater.","Der Vater ermahnt sich und seinen Sohn."]},{"type":"mc","q":"<span class=\"la\">Cornelia Iuliam videt et filiam eius salutat.<\/span> Wessen Tochter wird gegrüßt?","h":"<span class=\"la\">eius<\/span> ist nicht reflexiv.","s":"<span class=\"la\">eius<\/span> bezieht sich nicht auf das Subjekt (Cornelia), sondern auf die andere genannte Person: „Cornelia sieht Iulia und grüßt deren Tochter.“ Für Cornelias eigene Tochter stünde <span class=\"la\">filiam suam<\/span>.","o":["die Tochter der Iulia","die Tochter der Cornelia","die Tochter eines Mannes","Das lässt sich nicht entscheiden."]},{"type":"mc","q":"Warum steht in <span class=\"la\">Ego maneo, tu abis.<\/span> (manere = bleiben; abire = weggehen) das Pronomen <span class=\"la\">ego<\/span>?","s":"Die Endung <span class=\"la\">-o<\/span> zeigt die Person schon. Das Pronomen steht nur zur Betonung: „Ich bleibe, du aber gehst.“","o":["weil ein Gegensatz betont wird","weil das Verb sonst keine Person hätte","weil <span class=\"la\">ego<\/span> das Objekt ist","weil es im Lateinischen immer stehen muss"]},{"type":"mc","q":"„Ich liebe meine Mutter“ heißt <span class=\"la\">Matrem … amo.<\/span> Welche Form von <span class=\"la\">meus<\/span> gehört in die Lücke?","s":"<span class=\"la\">matrem<\/span> ist Akkusativ Singular feminin. Das Possessivpronomen richtet sich nach dem Besitz: <span class=\"la\">matrem meam<\/span>. Wer spricht, ob Mann oder Frau, spielt keine Rolle.","o":["meam","meum","mea","meae"]},{"type":"txt","a":["se"],"q":"Ergänze das Reflexivpronomen: <span class=\"la\">Milites … defendunt.<\/span> (Die Soldaten verteidigen sich.)","s":"<span class=\"la\">se<\/span> ist Akkusativ und gilt für Singular und Plural gleich."},{"type":"self","q":"Übersetze: <span class=\"la\">Rex amicos suos ad se vocat.<\/span> (vocare = rufen)","s":"„Der König ruft seine (eigenen) Freunde zu sich.“ Sowohl <span class=\"la\">suos<\/span> als auch <span class=\"la\">se<\/span> beziehen sich auf das Subjekt <span class=\"la\">rex<\/span>."}],"gen":[],"html":"<h3>Personalpronomen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>ich<\/th><th>du<\/th><th>wir<\/th><th>ihr<\/th><th>sich (3. Person, Sg. und Pl.)<\/th><\/tr><tr><td>Nom.<\/td><td>ego<\/td><td>tu<\/td><td>nos<\/td><td>vos<\/td><td>–<\/td><\/tr><tr><td>Gen.<\/td><td>mei<\/td><td>tui<\/td><td>nostri, nostrum<\/td><td>vestri, vestrum<\/td><td>sui<\/td><\/tr><tr><td>Dat.<\/td><td>mihi<\/td><td>tibi<\/td><td>nobis<\/td><td>vobis<\/td><td>sibi<\/td><\/tr><tr><td>Akk.<\/td><td>me<\/td><td>te<\/td><td>nos<\/td><td>vos<\/td><td>se<\/td><\/tr><tr><td>Abl.<\/td><td>me<\/td><td>te<\/td><td>nobis<\/td><td>vobis<\/td><td>se<\/td><\/tr><\/table><\/div>\n<p>Im Nominativ stehen diese Pronomen nur, wenn die Person <b>betont<\/b> werden soll, etwa bei einem Gegensatz: <span class=\"la\">Ego laboro, tu dormis.<\/span> – „Ich arbeite, du (aber) schläfst.“ Sonst genügt die Personalendung.<\/p>\n<p>Die Präposition <span class=\"la\">cum<\/span> wird angehängt: <span class=\"la\">mecum<\/span> (mit mir), <span class=\"la\">tecum<\/span>, <span class=\"la\">nobiscum<\/span>, <span class=\"la\">vobiscum<\/span>, <span class=\"la\">secum<\/span>.<\/p>\n<p>Für die dritte Person (er, sie, es) gibt es kein eigenes Personalpronomen. Man verwendet <span class=\"la\">is, ea, id<\/span> (siehe das nächste Kapitel).<\/p>\n<h3>Possessivpronomen<\/h3>\n<p><span class=\"la\">meus<\/span> (mein), <span class=\"la\">tuus<\/span> (dein), <span class=\"la\">noster<\/span> (unser), <span class=\"la\">vester<\/span> (euer), <span class=\"la\">suus<\/span> (sein eigener, ihr eigener). Sie werden wie Adjektive der a- und o-Deklination dekliniert und richten sich in KNG nach dem <b>Besitz<\/b>, nicht nach dem Besitzer: Auch ein Mann sagt <span class=\"la\">mater me<b class=\"e\">a<\/b><\/span>.<\/p>\n<p>Oft lässt das Lateinische das Possessivpronomen weg, wenn der Besitzer klar ist. <span class=\"la\">Pater filium amat.<\/span> heißt „Der Vater liebt seinen Sohn.“ Du darfst im Deutschen „seinen“ ergänzen.<\/p>\n<h3>Reflexiv oder nicht? Der wichtigste Punkt<\/h3>\n<p>In der dritten Person unterscheidet das Lateinische genau, ob sich ein Pronomen auf das <b>Subjekt des eigenen Satzes<\/b> bezieht (reflexiv) oder auf <b>jemand anderen<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>bezieht sich auf das Subjekt<\/th><th>bezieht sich auf jemand anderen<\/th><\/tr><tr><td>Personalpronomen<\/td><td><span class=\"la\">se, sibi<\/span> – sich<\/td><td><span class=\"la\">eum, eam, ei, eos<\/span> – ihn, sie, ihm<\/td><\/tr><tr><td>Besitz<\/td><td><span class=\"la\">suus, -a, -um<\/span> – sein (eigener), ihr (eigener)<\/td><td><span class=\"la\">eius<\/span> – dessen, sein; <span class=\"la\">eorum, earum<\/span> – deren, ihr<\/td><\/tr><\/table><\/div>\n<div class=\"formula\"><span class=\"la\">Marcus amicum suum laudat.<\/span> – Marcus lobt seinen (eigenen) Freund.<\/div>\n<div class=\"formula\"><span class=\"la\">Marcus amicum eius laudat.<\/span> – Marcus lobt dessen Freund (den Freund eines anderen).<\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Deutschen heißt beides „seinen Freund“. Beim Übersetzen von <span class=\"la\">eius<\/span> ist „dessen“ oder „deren“ die sichere Wahl, weil es den Unterschied sichtbar macht. In Prüfungstexten hängt daran oft das richtige Verständnis des ganzen Satzes.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: suus oder eius?<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Caesar Labienum laudat, quod milites eius fortiter pugnaverunt.<\/span> (quod = weil; pugnaverunt = sie haben gekämpft)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Hauptsatz: Subjekt <span class=\"la\">Caesar<\/span>, Prädikat <span class=\"la\">laudat<\/span>, Objekt <span class=\"la\">Labienum<\/span>: „Caesar lobt Labienus.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Nebensatz mit <span class=\"la\">quod<\/span>: Subjekt <span class=\"la\">milites<\/span>, Prädikat <span class=\"la\">pugnaverunt<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">eius<\/span> ist Genitiv von <span class=\"la\">is<\/span> und nicht reflexiv. Es bezieht sich also nicht auf das Subjekt, sondern auf eine andere genannte Person. Das ist Labienus.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Übersetzung: „Caesar lobt Labienus, weil dessen Soldaten tapfer gekämpft haben.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Stünde <span class=\"la\">sui<\/span> da, wären es Caesars eigene Soldaten.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"pron2","t":"Demonstrativ-, Relativ-, Frage- und unbestimmte Pronomen","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die Formen von is, hic, ille, iste, ipse und idem bilden und unterscheiden","das Relativpronomen deklinieren","Frage- und Indefinitpronomen erkennen","die Pronominaladjektive mit ihrem Genitiv auf -ius kennen"],"ex":[{"type":"txt","a":["huius"],"q":"Bilde den Genitiv Singular von <span class=\"la\">hic, haec, hoc<\/span>.","s":"<span class=\"la\">huius<\/span>, für alle drei Geschlechter gleich."},{"type":"txt","a":["eam"],"q":"Bilde den Akkusativ Singular feminin von <span class=\"la\">is, ea, id<\/span>.","s":"<span class=\"la\">eam<\/span> (sie, diese)."},{"type":"txt","a":["cui"],"q":"Bilde den Dativ Singular des Relativpronomens <span class=\"la\">qui, quae, quod<\/span>.","s":"<span class=\"la\">cui<\/span> (dem, der; wem), für alle drei Geschlechter gleich."},{"type":"txt","a":["quibus"],"q":"Bilde den Ablativ Plural des Relativpronomens.","
