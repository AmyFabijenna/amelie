r essen, um zu leben.","Wir essen, wie wir leben.","Wir essen so, dass wir leben.","Wir essen, sobald wir leben."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Timeo, ne amicus sero veniat.<\/span> (sero = zu spät)?","s":"Nach Verben des Fürchtens bedeutet <span class=\"la\">ne<\/span> „dass“.","o":["Ich fürchte, dass der Freund zu spät kommt.","Ich fürchte, dass der Freund nicht zu spät kommt.","Ich fürchte mich, damit der Freund nicht zu spät kommt.","Ich fürchte den Freund, der zu spät kommt."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Caesar militibus imperavit, ne flumen transirent.<\/span>?","s":"Verneinter Begehrsatz nach <span class=\"la\">imperare<\/span>: „dass nicht“. Im Deutschen ist ein Infinitiv eleganter.","o":["Caesar befahl den Soldaten, den Fluss nicht zu überschreiten.","Caesar befahl den Soldaten, den Fluss zu überschreiten.","Caesar befahl den Soldaten, sodass sie den Fluss nicht überschritten.","Caesar fürchtete, dass die Soldaten den Fluss überschreiten."]},{"type":"mc","q":"Welche Bedeutung hat <span class=\"la\">cum<\/span> in <span class=\"la\">Cum Caesar in Galliam venisset, legati ad eum venerunt.<\/span>?","s":"<span class=\"la\">venisset<\/span> ist Konjunktiv Plusquamperfekt in einer Erzählung: <span class=\"la\">cum narrativum<\/span>. „Nachdem Caesar nach Gallien gekommen war, kamen Gesandte zu ihm.“","o":["als, nachdem","mit","obwohl","immer wenn"]},{"type":"mc","q":"Welche Bedeutung hat <span class=\"la\">cum<\/span> in <span class=\"la\">Cum te video, gaudeo.<\/span>?","s":"<span class=\"la\">video<\/span> ist Indikativ, und gemeint ist eine wiederholte Handlung: „Immer wenn ich dich sehe, freue ich mich.“ Auch „wenn“ ist richtig.","o":["immer wenn","obwohl","weil","mit"]},{"type":"mc","q":"Welche Bedeutung hat <span class=\"la\">cum<\/span> in <span class=\"la\">Cum magna voce clamaret, nemo eum audivit.<\/span>?","h":"Passt der Hauptsatz zu dem, was man nach lautem Rufen erwartet?","s":"Der Hauptsatz enthält das Gegenteil des Erwarteten: „Obwohl er mit lauter Stimme rief, hörte ihn niemand.“ Auch ohne <span class=\"la\">tamen<\/span> ist der Sinn konzessiv.","o":["obwohl","nachdem","weil","mit"]},{"type":"self","q":"Übersetze: <span class=\"la\">Milites tam fortiter pugnaverunt, ut hostes urbem capere non possent.<\/span>","s":"„Die Soldaten kämpften so tapfer, dass die Feinde die Stadt nicht einnehmen konnten.“ <span class=\"la\">tam<\/span> und die Verneinung <span class=\"la\">non<\/span> zeigen den konsekutiven Sinn."}],"gen":[],"html":"<h3>Drei kleine Wörter, viele Bedeutungen<\/h3>\n<p><span class=\"la\">ut<\/span>, <span class=\"la\">ne<\/span> und <span class=\"la\">cum<\/span> gehören zu den häufigsten Wörtern überhaupt. Die Seite zur Zentralmatura fasst ihre Bedeutungen in einer Übersicht zusammen. Hier bekommst du ein Verfahren, mit dem du im Satz entscheidest, welche Bedeutung vorliegt. Der erste Blick gilt immer dem <b>Modus<\/b> des Verbs.<\/p>\n<h3>ut<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Modus<\/th><th>Art<\/th><th>Bedeutung<\/th><th>Signale im Hauptsatz<\/th><\/tr><tr><td>Indikativ<\/td><td>Vergleich<\/td><td>wie<\/td><td><span class=\"la\">ita, sic<\/span> (so)<\/td><\/tr><tr><td>Indikativ<\/td><td>Zeit<\/td><td>sobald (als)<\/td><td>Perfekt, oft <span class=\"la\">ut primum<\/span><\/td><\/tr><tr><td>Konjunktiv<\/td><td>Zweck (final)<\/td><td>damit, um zu<\/td><td>Verneinung <span class=\"la\">ne<\/span><\/td><\/tr><tr><td>Konjunktiv<\/td><td>Begehren<\/td><td>dass<\/td><td>nach <span class=\"la\">rogare, petere, imperare, monere, optare<\/span><\/td><\/tr><tr><td>Konjunktiv<\/td><td>Folge (konsekutiv)<\/td><td>(so)dass<\/td><td><span class=\"la\">tam, ita, sic, tantus, talis, adeo<\/span>; Verneinung <span class=\"la\">ut non<\/span><\/td><\/tr><\/table><\/div>\n<p>Den häufigsten Zweifel, final oder konsekutiv, entscheidest du so: Steht im Hauptsatz ein „so“-Wort (<span class=\"la\">tam, ita, tantus<\/span>), ist es eine Folge. Wird mit <span class=\"la\">ne<\/span> verneint, ist es ein Zweck. Wird mit <span class=\"la\">ut non<\/span> verneint, ist es eine Folge.<\/p>\n<h3>ne<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verwendung<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>verneinter Zweck<\/td><td>damit nicht, um nicht zu<\/td><td><span class=\"la\">Fugit, ne caperetur.<\/span> – Er floh, um nicht gefangen zu werden.<\/td><\/tr><tr><td>verneintes Begehren<\/td><td>dass nicht<\/td><td><span class=\"la\">Te rogo, ne abeas.<\/span> – Ich bitte dich, nicht wegzugehen.<\/td><\/tr><tr><td>nach Verben des Fürchtens<\/td><td><b>dass<\/b><\/td><td><span class=\"la\">Timeo, ne veniat.<\/span> – Ich fürchte, dass er kommt.<\/td><\/tr><tr><td>im Hauptsatz<\/td><td>nicht (Wunsch, Verbot)<\/td><td><span class=\"la\">Ne dixeris!<\/span> – Sag nicht!<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach <span class=\"la\">timere, metuere, vereri<\/span> und <span class=\"la\">periculum est<\/span> heißt <span class=\"la\">ne<\/span> „<b>dass<\/b>“ und nicht „dass nicht“. Der Grund: Wer fürchtet, wünscht das Gegenteil („Möge er nicht kommen!“). „Dass nicht“ heißt hier <span class=\"la\">ne non<\/span> oder <span class=\"la\">ut<\/span>.<\/div>\n<h3>cum<\/h3>\n<p>Zuerst prüfst du, ob <span class=\"la\">cum<\/span> eine Präposition ist: Steht dahinter ein Ablativ (<span class=\"la\">cum amicis<\/span>), heißt es „mit“. Sonst leitet es einen Gliedsatz ein.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Modus<\/th><th>Name<\/th><th>Bedeutung<\/th><th>Hinweise<\/th><\/tr><tr><td>Indikativ<\/td><td>temporale<\/td><td>(damals) als, (dann) wenn<\/td><td>reine Zeitangabe, oft <span class=\"la\">tum<\/span> im Hauptsatz<\/td><\/tr><tr><td>Indikativ<\/td><td>iterativum<\/td><td>immer wenn, sooft<\/td><td>wiederholte Handlung<\/td><\/tr><tr><td>Indikativ<\/td><td>inversum<\/td><td>als (plötzlich)<\/td><td>steht nach dem Hauptsatz, oft mit <span class=\"la\">subito<\/span><\/td><\/tr><tr><td>Konjunktiv<\/td><td>narrativum (historicum)<\/td><td>als, nachdem<\/td><td>Konj. Imperfekt oder Plusquamperfekt in Erzählungen<\/td><\/tr><tr><td>Konjunktiv<\/td><td>causale<\/td><td>weil, da<\/td><td>oft <span class=\"la\">praesertim cum<\/span> (zumal da)<\/td><\/tr><tr><td>Konjunktiv<\/td><td>concessivum<\/td><td>obwohl<\/td><td><span class=\"la\">tamen<\/span> im Hauptsatz<\/td><\/tr><tr><td>Konjunktiv<\/td><td>adversativum<\/td><td>während (dagegen)<\/td><td>Gegensatz zweier Aussagen<\/td><\/tr><\/table><\/div>\n<p>Bei <span class=\"la\">cum<\/span> mit Konjunktiv gehst du so vor: Probiere zuerst „als“ oder „nachdem“. Ergibt der Satz dann wenig Sinn, probiere „weil“. Steht <span class=\"la\">tamen<\/span> im Hauptsatz, nimm „obwohl“.<\/p>\n<p>Die Verbindung <span class=\"la\">cum … tum<\/span> heißt „sowohl … als auch besonders“.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: ut entscheiden<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Tantus erat timor, ut omnes fugerent.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat des Hauptsatzes: <span class=\"la\">erat<\/span>. Subjekt: <span class=\"la\">timor<\/span>. Dazu <span class=\"la\">tantus<\/span> (so groß).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gliedsatz: <span class=\"la\">ut omnes fugerent<\/span>. Das Verb steht im Konjunktiv Imperfekt, also kein „wie“ und kein „sobald“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Final oder konsekutiv? Im Hauptsatz steht das Signalwort <span class=\"la\">tantus<\/span>. Das weist auf eine Folge.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übersetzung: „Die Furcht war so groß, dass alle flohen.“ Der Konjunktiv wird im Deutschen mit dem Indikativ wiedergegeben.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: cum entscheiden<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Cum hostes appropinquarent, cives tamen in urbe manserunt.<\/span> (appropinquare = sich nähern)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">cum<\/span> steht nicht vor einem Ablativ (<span class=\"la\">hostes<\/span> ist Nominativ). Es ist also eine Subjunktion.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Modus im Gliedsatz: <span class=\"la\">appropinquarent<\/span> ist Konjunktiv Imperfekt. In Frage kommen „als“, „weil“, „obwohl“, „während“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Hauptsatz: <span class=\"la\">cives … manserunt<\/span> (die Bürger blieben). Darin steht <span class=\"la\">tamen<\/span> (dennoch).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">tamen<\/span> entscheidet: konzessiv, „obwohl“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Obwohl die Feinde näher rückten, blieben die Bürger dennoch in der Stadt.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"adverbial","t":"Bedingungssätze und andere Adverbialsätze","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["realen, möglichen und irrealen Bedingungssatz am Modus und Tempus unterscheiden","Irrealis der Gegenwart und der Vergangenheit korrekt übersetzen","die Subjunktionen für Zeit, Grund und Einräumung kennen","die drei Bedeutungen von dum und von quod auseinanderhalten"],"ex":[{"type":"mc","q":"Welcher Fall liegt vor? <span class=\"la\">Si tacuisses, philosophus mansisses.<\/span> (tacere = schweigen)","s":"Beide Verben stehen im Konjunktiv Plusquamperfekt: „Wenn du geschwiegen hättest, wärst du ein Philosoph geblieben.“","o":["Irrealis der Vergangenheit","Irrealis der Gegenwart","Realis","Potentialis"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Si amicum haberem, beatus essem.<\/span>?","s":"Konjunktiv Imperfekt in beiden Teilen: Irrealis der Gegenwart. Der Sprecher hat keinen Freund.","o":["Wenn ich einen Freund hätte, wäre ich glücklich.","Wenn ich einen Freund gehabt hätte, wäre ich glücklich gewesen.","Wenn ich einen Freund habe, bin ich glücklich.","Als ich einen Freund hatte, war ich glücklich."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Postquam hostes urbem ceperunt, …<\/span>?","s":"<span class=\"la\">postquam<\/span> steht mit Indikativ Perfekt. Im Deutschen verlangt „nachdem“ bei Vergangenem das Plusquamperfekt.","o":["Nachdem die Feinde die Stadt eingenommen hatten, …","Nachdem die Feinde die Stadt einnehmen, …","Bevor die Feinde die Stadt einnahmen, …","Während die Feinde die Stadt einnahmen, …"]},{"type":"mc","q":"Welche Bedeutung hat <span class=\"la\">dum<\/span> in <span class=\"la\">Dum Romani consultant, Saguntum captum est.<\/span> (consultare = beraten)?","s":"<span class=\"la\">dum<\/span> mit Indikativ Präsens, obwohl der Hauptsatz in der Vergangenheit steht: „Während die Römer berieten, wurde Sagunt eingenommen.“","o":["während","solange bis","wenn nur","weil"]},{"type":"mc","q":"Welche Subjunktion bedeutet „obwohl“ und steht mit dem Indikativ?","s":"<span class=\"la\">quamquam<\/span> (ebenso <span class=\"la\">etsi<\/span>) leitet einen Konzessivsatz mit Indikativ ein. <span class=\"la\">quia<\/span> heißt „weil“, <span class=\"la\">postquam<\/span> „nachdem“, <span class=\"la\">quasi<\/span> „als ob“.","o":["<span class=\"la\">quamquam<\/span>","<span class=\"la\">quia<\/span>","<span class=\"la\">postquam<\/span>","<span class=\"la\">quasi<\/span>"]},{"type":"mc","q":"Was ist <span class=\"la\">quod<\/span> in <span class=\"la\">Gaudeo, quod vales.<\/span> (valere = gesund sein)?","s":"Es gibt kein Neutrum als Bezugswort. Nach einem Verb des Gefühls gibt <span class=\"la\">quod<\/span> den Grund oder Inhalt der Freude an: „Ich freue mich, dass (weil) du gesund bist.“","o":["eine Subjunktion: „dass“ oder „weil“","ein Relativpronomen: „das, was“","ein Fragepronomen: „was?“","ein relativer Anschluss: „und das“"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Loquitur, quasi omnia sciat.<\/span>?","s":"<span class=\"la\">quasi<\/span> mit Konjunktiv leitet einen irrealen Vergleich ein: „wie wenn“, „als ob“.","o":["Er redet, als ob er alles wüsste.","Er redet, weil er alles weiß.","Er redet, obwohl er alles weiß.","Er redet, sodass er alles weiß."]},{"type":"self","q":"Übersetze: <span class=\"la\">Quamquam multi cives pacem cupiebant, senatus bellum decrevit.<\/span> (cupere = wünschen; decernere, decerno, decrevi = beschließen)","s":"„Obwohl viele Bürger den Frieden wünschten, beschloss der Senat den Krieg.“ <span class=\"la\">quamquam<\/span> mit Indikativ Imperfekt."}],"gen":[],"html":"<h3>Bedingungssätze<\/h3>\n<p>Ein Bedingungssatz wird mit <span class=\"la\">si<\/span> (wenn, falls), <span class=\"la\">nisi<\/span> (wenn nicht, außer wenn) oder <span class=\"la\">sin<\/span> (wenn aber) eingeleitet. Entscheidend ist der Modus. Er sagt, wie der Sprecher die Bedingung einschätzt.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fall<\/th><th>Modus und Tempus<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>Realis (als Tatsache hingestellt)<\/td><td>Indikativ<\/td><td><span class=\"la\">Si hoc dicis, erras.<\/span><\/td><td>Wenn du das sagst, irrst du.<\/td><\/tr><tr><td>Potentialis (möglich, nur gedacht)<\/td><td>Konj. Präsens oder Perfekt<\/td><td><span class=\"la\">Si hoc dicas, erres.<\/span><\/td><td>Wenn du das sagen solltest, würdest du wohl irren.<\/td><\/tr><tr><td>Irrealis der Gegenwart<\/td><td>Konj. Imperfekt<\/td><td><span class=\"la\">Si hoc diceres, errares.<\/span><\/td><td>Wenn du das sagtest (sagen würdest), würdest du irren.<\/td><\/tr><tr><td>Irrealis der Vergangenheit<\/td><td>Konj. Plusquamperfekt<\/td><td><span class=\"la\">Si hoc dixisses, erravisses.<\/span><\/td><td>Wenn du das gesagt hättest, hättest du geirrt.<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Der Konjunktiv <b>Imperfekt<\/b> im Bedingungssatz bezeichnet etwas Unwirkliches in der <b>Gegenwart<\/b>, nicht in der Vergangenheit. <span class=\"la\">Si pecuniam haberem, tibi darem.<\/span> – „Wenn ich Geld hätte, würde ich es dir geben.“ (Ich habe aber keines.)<\/div>\n<p>Die beiden Irrealis können gemischt sein: <span class=\"la\">Si tum venisses, nunc gauderem.<\/span> – „Wenn du damals gekommen wärst, würde ich mich jetzt freuen.“<\/p>\n<h3>Temporalsätze<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Subjunktion<\/th><th>Bedeutung<\/th><th>Modus<\/th><\/tr><tr><td><span class=\"la\">postquam<\/span><\/td><td>nachdem<\/td><td>Indikativ Perfekt (deutsch: Plusquamperfekt!)<\/td><\/tr><tr><td><span class=\"la\">ubi<\/span>, <span class=\"la\">ut<\/span>, <span class=\"la\">ubi primum<\/span>, <span class=\"la\">ut primum<\/span>, <span class=\"la\">simulac<\/span><\/td><td>sobald<\/td><td>Indikativ Perfekt<\/td><\/tr><tr><td><span class=\"la\">dum<\/span><\/td><td>während<\/td><td>Indikativ Präsens (auch bei Vergangenem)<\/td><\/tr><tr><td><span class=\"la\">dum<\/span>, <span class=\"la\">donec<\/span>, <span class=\"la\">quoad<\/span><\/td><td>solange; (solange) bis<\/td><td>Indikativ; bei Absicht Konjunktiv<\/td><\/tr><tr><td><span class=\"la\">antequam<\/span>, <span class=\"la\">priusquam<\/span><\/td><td>bevor<\/td><td>Indikativ oder Konjunktiv<\/td><\/tr><tr><td><span class=\"la\">cum<\/span><\/td><td>als, nachdem, immer wenn<\/td><td>siehe das Kapitel zu <span class=\"la\">cum<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Nach <span class=\"la\">postquam<\/span> steht im Lateinischen das Perfekt, im Deutschen brauchst du das Plusquamperfekt: <span class=\"la\">Postquam venit, …<\/span> – „Nachdem er gekommen war, …“. Und nach <span class=\"la\">dum<\/span> „während“ steht immer Präsens, auch wenn von der Vergangenheit die Rede ist: <span class=\"la\">Dum haec geruntur, …<\/span> – „Während das geschah, …“.<\/div>\n<h3>Kausalsätze und Konzessivsätze<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Art<\/th><th>Subjunktion<\/th><th>Bedeutung<\/th><th>Modus<\/th><\/tr><tr><td>kausal<\/td><td><span class=\"la\">quod<\/span>, <span class=\"la\">quia<\/span>, <span class=\"la\">quoniam<\/span><\/td><td>weil, da<\/td><td>Indikativ<\/td><\/tr><tr><td>kausal<\/td><td><span class=\"la\">cum<\/span><\/td><td>weil, da<\/td><td>Konjunktiv<\/td><\/tr><tr><td>konzessiv<\/td><td><span class=\"la\">quamquam<\/span>, <span class=\"la\">etsi<\/span>, <span class=\"la\">tametsi<\/span><\/td><td>obwohl<\/td><td>Indikativ<\/td><\/tr><tr><td>konzessiv<\/td><td><span class=\"la\">quamvis<\/span>, <span class=\"la\">cum<\/span>, <span class=\"la\">licet<\/span><\/td><td>obwohl, wenn auch noch so<\/td><td>Konjunktiv<\/td><\/tr><tr><td>vergleichend<\/td><td><span class=\"la\">ut … ita<\/span> / <span class=\"la\">sicut<\/span><\/td><td>wie … so<\/td><td>Indikativ<\/td><\/tr><tr><td>vergleichend<\/td><td><span class=\"la\">quasi<\/span>, <span class=\"la\">tamquam (si)<\/span>, <span class=\"la\">velut si<\/span><\/td><td>wie wenn, als ob<\/td><td>Konjunktiv<\/td><\/tr><\/table><\/div>\n<p>Steht nach <span class=\"la\">quod<\/span> oder <span class=\"la\">quia<\/span> ausnahmsweise der Konjunktiv, gibt der Autor den Grund als Meinung eines anderen wieder: „weil angeblich“, „weil er, wie er sagte, …“.<\/p>\n<h3>Die vielen Gesichter von quod<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><span class=\"la\">quod<\/span> ist …<\/th><th>Bedeutung<\/th><th>Erkennungszeichen<\/th><\/tr><tr><td>Relativpronomen (Neutrum)<\/td><td>das, was, welches<\/td><td>Bezugswort im Neutrum oder „das, was“<\/td><\/tr><tr><td>kausale Subjunktion<\/td><td>weil<\/td><td>kein Bezugswort, gibt einen Grund an<\/td><\/tr><tr><td>faktische Subjunktion<\/td><td>dass, die Tatsache, dass<\/td><td>nach Ausdrücken des Gefühls und nach <span class=\"la\">accedit<\/span> (es kommt hinzu)<\/td><\/tr><tr><td>relativer Anschluss<\/td><td>und das, dies<\/td><td>am Satzanfang nach starkem Einschnitt<\/td><\/tr><\/table><\/div>\n<p>Auf der Seite zur Zentralmatura ist <span class=\"la\">quod<\/span> unter den Formen-Fallen genannt. Die sichere Probe: Gibt es ein Neutrum, auf das sich <span class=\"la\">quod<\/span> beziehen kann? Wenn nein, ist es fast immer „weil“ oder „dass“.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Bedingungssatz bestimmen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Nisi Hannibal Alpes transisset, Romani Italiam facile defendissent.<\/span> (transire = überqueren; defendere = verteidigen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Einleitung: <span class=\"la\">nisi<\/span> (wenn nicht). Verb im Gliedsatz: <span class=\"la\">transisset<\/span>, Konjunktiv Plusquamperfekt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Verb im Hauptsatz: <span class=\"la\">defendissent<\/span>, ebenfalls Konjunktiv Plusquamperfekt. Beides zusammen: Irrealis der Vergangenheit.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Wörtlich: „Wenn Hannibal die Alpen nicht überquert hätte, hätten die Römer Italien leicht verteidigt.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Sinnprobe: Der Satz stellt sich eine Vergangenheit vor, die es nicht gab. Tatsächlich hat Hannibal die Alpen überquert, und die Verteidigung war schwer. Das passt zum Irrealis.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Gute Übersetzung: „Hätte Hannibal die Alpen nicht überquert, hätten die Römer Italien leicht verteidigen können.“ Das „wenn“ darf im Deutschen durch die Spitzenstellung des Verbs ersetzt werden.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"rel","t":"Relativsätze","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["Bezugswort und Kasus des Relativpronomens bestimmen","Relativsätze ohne Bezugswort übersetzen","den relativen Satzanschluss erkennen","Relativsätze im Konjunktiv und verschränkte Relativsätze auflösen"],"ex":[{"type":"mc","q":"Warum steht in <span class=\"la\">Liber, quem legis, bonus est.<\/span> das Relativpronomen im Akkusativ?","s":"Der Kasus richtet sich nach der Aufgabe im Relativsatz: „das Buch, das (wen oder was?) du liest“. Vom Bezugswort <span class=\"la\">liber<\/span> kommen nur Singular und Maskulinum.","o":["Weil es im Relativsatz das Objekt zu <span class=\"la\">legis<\/span> ist.","Weil <span class=\"la\">liber<\/span> im Akkusativ steht.","Weil nach einem Komma immer der Akkusativ steht.","Weil <span class=\"la\">bonus<\/span> den Akkusativ verlangt."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Femina, cuius filius aegrotat, medicum vocat.<\/span> (medicus = Arzt)?","s":"<span class=\"la\">cuius<\/span> ist Genitiv Singular und bezieht sich auf <span class=\"la\">femina<\/span>: „deren“.","o":["Die Frau, deren Sohn krank ist, ruft den Arzt.","Die Frau, die den Sohn krank macht, ruft den Arzt.","Die Frau, der der Sohn krank ist, ruft den Arzt.","Die Frau ruft den Arzt, dessen Sohn krank ist."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Qui multum habet, plus cupit.<\/span>?","s":"Relativsatz ohne Bezugswort am Satzanfang: „wer“. Der Satz stammt sinngemäß von Seneca.","o":["Wer viel hat, begehrt mehr.","Der viel hat, den begehrt man mehr.","Welcher hat viel und begehrt mehr?","Er, der viel hat, wird mehr begehrt."]},{"type":"mc","q":"Wie übersetzt man den Anfang <span class=\"la\">Quae cum ita sint, …<\/span>?","s":"Relativer Anschluss: <span class=\"la\">quae<\/span> (Neutrum Plural) bezieht sich auf das zuvor Gesagte und wird mit „dies“ übersetzt. <span class=\"la\">cum<\/span> mit Konjunktiv ist hier kausal. Die Wendung ist eine Lieblingsformel Ciceros.","o":["Da dies so ist, …","Welche, da sie so sind, …","Mit welchen es so ist, …","Was ist so, wenn …?"]},{"type":"mc","q":"Welchen Nebensinn hat der Relativsatz in <span class=\"la\">Caesar equites praemisit, qui hostes observarent.<\/span> (equites = Reiter; praemittere = vorausschicken)?","s":"Konjunktiv nach einem Verb des Schickens: Die Reiter sollen etwas tun. „Caesar schickte Reiter voraus, die die Feinde beobachten sollten.“","o":["final","kausal","konzessiv","keinen, es ist ein gewöhnlicher Relativsatz"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Sunt, qui mortem non timeant.<\/span>?","s":"<span class=\"la\">sunt, qui<\/span> mit Konjunktiv: „es gibt Leute, die“. Der Konjunktiv (konsekutiver Nebensinn) wird im Deutschen mit dem Indikativ wiedergegeben.","o":["Es gibt Menschen, die den Tod nicht fürchten.","Sie sind es, die den Tod nicht fürchten sollen.","Die, die den Tod nicht fürchten, sind.","Es sind die, damit sie den Tod nicht fürchten."]},{"type":"self","q":"Übersetze: <span class=\"la\">Urbs, in qua natus sum, pulcherrima est.<\/span> (nasci, natus sum = geboren werden)","s":"„Die Stadt, in der ich geboren wurde, ist sehr schön.“ <span class=\"la\">in qua<\/span>: Ablativ Singular feminin mit Präposition, bezogen auf <span class=\"la\">urbs<\/span>."},{"type":"self","q":"Übersetze: <span class=\"la\">Cicero, quem optimum oratorem fuisse omnes putant, Arpini natus est.<\/span> (Arpinum = eine Stadt in Latium)","s":"„Cicero, der nach allgemeiner Ansicht der beste Redner war, wurde in Arpinum geboren.“ Oder: „Cicero, von dem alle glauben, dass er der beste Redner war, …“. Verschränkter Relativsatz: <span class=\"la\">quem<\/span> ist Subjektsakkusativ des AcI, der von <span class=\"la\">putant<\/span> abhängt. <span class=\"la\">Arpini<\/span> ist Lokativ."}],"gen":[],"html":"<h3>Die Grundregel<\/h3>\n<p>Das Relativpronomen <span class=\"la\">qui, quae, quod<\/span> hat zwei Herren:<\/p>\n<div class=\"formula\"><b>Numerus und Genus<\/b> kommen vom <b>Bezugswort<\/b>. Der <b>Kasus<\/b> kommt von der Aufgabe im <b>Relativsatz<\/b>.<\/div>\n<p><span class=\"la\">Puella, <b>quam<\/b> vides, soror mea est.<\/span> – „Das Mädchen, das du siehst, ist meine Schwester.“ <span class=\"la\">quam<\/span> ist feminin Singular wegen <span class=\"la\">puella<\/span> und Akkusativ, weil es im Relativsatz Objekt zu <span class=\"la\">vides<\/span> ist.<\/p>\n<p>Die deutsche Entsprechung findest du über den Kasus:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Kasus<\/th><th>Deutsch<\/th><th>Beispiel<\/th><\/tr><tr><td>Nominativ<\/td><td>der, die, das<\/td><td><span class=\"la\">vir, qui venit<\/span> – der Mann, der kommt<\/td><\/tr><tr><td>Genitiv<\/td><td>dessen, deren<\/td><td><span class=\"la\">vir, cuius filium novi<\/span> – der Mann, dessen Sohn ich kenne<\/td><\/tr><tr><td>Dativ<\/td><td>dem, der, denen<\/td><td><span class=\"la\">vir, cui librum dedi<\/span> – der Mann, dem ich das Buch gab<\/td><\/tr><tr><td>Akkusativ<\/td><td>den, die, das<\/td><td><span class=\"la\">vir, quem vidi<\/span> – der Mann, den ich sah<\/td><\/tr><tr><td>Ablativ<\/td><td>mit Präposition<\/td><td><span class=\"la\">gladius, quo pugnat<\/span> – das Schwert, mit dem er kämpft<\/td><\/tr><\/table><\/div>\n<h3>Relativsatz ohne Bezugswort<\/h3>\n<p>Oft fehlt das Bezugswort. Dann ergänzt du im Deutschen ein Demonstrativpronomen oder übersetzt mit „wer“ und „was“:<\/p>\n<div class=\"formula\"><span class=\"la\">Qui tacet, consentire videtur.<\/span> – <b>Wer<\/b> schweigt, scheint zuzustimmen.<\/div>\n<div class=\"formula\"><span class=\"la\">Quae dixisti, vera sunt.<\/span> – <b>Was<\/b> du gesagt hast, ist wahr.<\/div>\n<p>Der Relativsatz steht im Lateinischen gern <b>vor<\/b> dem Hauptsatz. Ein nachfolgendes <span class=\"la\">is, ea, id<\/span> nimmt ihn dann wieder auf: <span class=\"la\">Qui hoc fecit, is poenam dabit.<\/span> – „Wer das getan hat, der wird bestraft werden.“<\/p>\n<h3>Der relative Satzanschluss<\/h3>\n<p>Steht ein Relativpronomen am Anfang eines neuen Satzes (nach Punkt oder Strichpunkt) und bezieht sich auf den Satz davor, verbindet es nur. Du übersetzt es mit einem <b>Demonstrativpronomen<\/b>. Die Regel steht auch auf der Seite zur Zentralmatura. Übe hier, sie anzuwenden:<\/p>\n<div class=\"formula\"><span class=\"la\">Caesar legatos misit. <b>Qui<\/b> cum venissent, …<\/span> – Caesar schickte Gesandte. Als <b>diese<\/b> gekommen waren, …<\/div>\n<p>Typisch sind <span class=\"la\">quod cum audivisset<\/span> (als er das gehört hatte), <span class=\"la\">quibus rebus cognitis<\/span> (nachdem er das erfahren hatte), <span class=\"la\">quam ob rem<\/span> und <span class=\"la\">quare<\/span> (deshalb).<\/p>\n<h3>Relativsätze im Konjunktiv<\/h3>\n<p>Steht das Verb des Relativsatzes im Konjunktiv, hat der Satz einen <b>Nebensinn<\/b>. Du übersetzt ihn mit der passenden Subjunktion.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Nebensinn<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>final (Zweck)<\/td><td><span class=\"la\">Legatos misit, qui pacem peterent.<\/span><\/td><td>Er schickte Gesandte, die um Frieden bitten sollten (damit sie … bäten).<\/td><\/tr><tr><td>kausal (Grund)<\/td><td><span class=\"la\">Me miserum, qui hoc non viderim!<\/span><\/td><td>Ich Unglücklicher, weil ich das nicht gesehen habe!<\/td><\/tr><tr><td>konsekutiv (Folge)<\/td><td><span class=\"la\">Nemo est, qui hoc nesciat.<\/span><\/td><td>Es gibt niemanden, der das nicht wüsste.<\/td><\/tr><\/table><\/div>\n<p>Konsekutiv sind vor allem Relativsätze nach <span class=\"la\">sunt, qui<\/span> (es gibt Leute, die), <span class=\"la\">nemo est, qui<\/span> und nach <span class=\"la\">dignus, qui<\/span> (würdig, dass).<\/p>\n<h3>Der verschränkte Relativsatz<\/h3>\n<p>Manchmal ist das Relativpronomen zugleich Teil eines AcI, der vom Verb des Relativsatzes abhängt. Wörtlich lässt sich das nicht übersetzen.<\/p>\n<div class=\"formula\"><span class=\"la\">Socrates, <b>quem<\/b> sapientissimum fuisse constat, …<\/span><\/div>\n<p>Wörtlich: „Sokrates, von dem feststeht, dass er der Weiseste war, …“. Bewährte Lösungen sind „von dem“ mit dass-Satz, ein Einschub („Sokrates, der, wie feststeht, der Weiseste war“) oder ein Präpositionalausdruck („der bekanntlich der Weiseste war“).<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Relativpronomen bestimmen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Milites, quorum virtutem Caesar laudaverat, fortiter pugnaverunt.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Hauptsatz: <span class=\"la\">Milites … fortiter pugnaverunt<\/span> – „Die Soldaten kämpften tapfer.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Relativsatz: <span class=\"la\">quorum virtutem Caesar laudaverat<\/span>. Prädikat <span class=\"la\">laudaverat<\/span>, Subjekt <span class=\"la\">Caesar<\/span>, Objekt <span class=\"la\">virtutem<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">quorum<\/span>: Genitiv Plural maskulin. Plural und maskulin wegen <span class=\"la\">milites<\/span>. Genitiv, weil es im Relativsatz Attribut zu <span class=\"la\">virtutem<\/span> ist („die Tapferkeit von wem?“).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Genitiv heißt im Deutschen „deren“ oder „dessen“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Die Soldaten, deren Tapferkeit Caesar gelobt hatte, kämpften tapfer.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Relativer Anschluss und Konjunktiv<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Galli legatos ad Caesarem miserunt, qui auxilium peterent. Quibus Caesar respondit …<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erster Relativsatz: <span class=\"la\">qui auxilium peterent<\/span>. Bezugswort <span class=\"la\">legatos<\/span>. Das Verb steht im Konjunktiv Imperfekt, also Nebensinn.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gesandte werden geschickt, damit sie etwas tun: finaler Nebensinn. „… die um Hilfe bitten sollten.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweiter Satz: <span class=\"la\">Quibus<\/span> steht am Satzanfang nach dem Punkt. Relativer Anschluss, zu übersetzen mit einem Demonstrativpronomen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">quibus<\/span> ist Dativ Plural (zu <span class=\"la\">respondit<\/span>): „diesen“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Die Gallier schickten Gesandte zu Caesar, die um Hilfe bitten sollten. Diesen antwortete Caesar …“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"indfr","t":"Indirekte Fragesätze und die Zeitenfolge","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["indirekte Fragesätze erkennen und von Relativsätzen unterscheiden","die Regeln der Zeitenfolge (consecutio temporum) anwenden","das Zeitverhältnis konjunktivischer Gliedsätze bestimmen","indirekte Satz- und Doppelfragen übersetzen"],"ex":[{"type":"mc","q":"In welchem Modus steht das Verb einer indirekten Frage im Lateinischen?","s":"Jede indirekte Frage steht im Konjunktiv. Im Deutschen übersetzt du mit dem Indikativ.","o":["immer im Konjunktiv","immer im Indikativ","im Indikativ, wenn die Frage sicher ist","im Infinitiv"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Nescio, quis venerit.<\/span>?","s":"Hauptverb im Präsens (Haupttempus), Gliedsatz im Konjunktiv Perfekt: vorzeitig.","o":["Ich weiß nicht, wer gekommen ist.","Ich weiß nicht, wer kommt.","Ich weiß nicht, wer kommen wird.","Ich wusste nicht, wer gekommen war."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Pater rogavit, num filius domi esset.<\/span>?","s":"<span class=\"la\">num<\/span> heißt in der indirekten Frage „ob“. Konjunktiv Imperfekt nach Nebentempus: gleichzeitig.","o":["Der Vater fragte, ob der Sohn zu Hause sei.","Der Vater fragte, ob der Sohn etwa nicht zu Hause gewesen war.","Der Vater fragte, dass der Sohn zu Hause sei.","Der Vater fragte, warum der Sohn zu Hause war."]},{"type":"mc","q":"Welcher Konjunktiv drückt nach <span class=\"la\">dixit<\/span> die Vorzeitigkeit aus?","s":"<span class=\"la\">dixit<\/span> ist ein Nebentempus. Dazu gehören Konjunktiv Imperfekt (gleichzeitig) und Konjunktiv Plusquamperfekt (vorzeitig).","o":["Konjunktiv Plusquamperfekt","Konjunktiv Perfekt","Konjunktiv Imperfekt","Konjunktiv Präsens"]},{"type":"mc","q":"Welcher Satz enthält eine indirekte Frage?","h":"Suche ein Fragewort, ein übergeordnetes Verb des Sagens oder Fragens und einen Konjunktiv.","s":"„Sag mir, was du denkst.“ <span class=\"la\">quid<\/span> ist Fragewort, <span class=\"la\">sentias<\/span> Konjunktiv. Im zweiten und vierten Satz stehen Relativsätze mit Indikativ, der dritte ist eine direkte Frage.","o":["<span class=\"la\">Dic mihi, quid sentias.<\/span> (sentire = denken, meinen)","<span class=\"la\">Id, quod sentis, dic mihi.<\/span>","<span class=\"la\">Quid sentis?<\/span>","<span class=\"la\">Dic mihi id, quod verum est.<\/span>"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Dubito, utrum maneam an abeam.<\/span> (dubitare = zweifeln, unschlüssig sein)?","s":"Indirekte Doppelfrage mit <span class=\"la\">utrum … an<\/span>. Die Konjunktive geben hier zusätzlich das Überlegen wieder („soll“).","o":["Ich bin unschlüssig, ob ich bleiben oder weggehen soll.","Ich zweifle, dass ich bleibe und weggehe.","Ich zweifle nicht daran, zu bleiben.","Ich bleibe oder gehe, wenn ich zweifle."]},{"type":"self","q":"Übersetze: <span class=\"la\">Legati interrogati sunt, cur venissent et quid peterent.<\/span> (interrogare = fragen; cur = warum)","s":"„Die Gesandten wurden gefragt, warum sie gekommen waren und was sie wollten (erbaten).“ <span class=\"la\">venissent<\/span> ist vorzeitig, <span class=\"la\">peterent<\/span> gleichzeitig zu <span class=\"la\">interrogati sunt<\/span>."}],"gen":[],"html":"<h3>Was eine indirekte Frage ist<\/h3>\n<p>Eine indirekte Frage hängt von einem Verb des Fragens, Wissens oder Sagens ab und steht im Lateinischen <b>immer im Konjunktiv<\/b>. Im Deutschen nimmst du den Indikativ.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Direkte Frage<\/th><th>Indirekte Frage<\/th><\/tr><tr><td><span class=\"la\">Quid facis?<\/span> – Was machst du?<\/td><td><span class=\"la\">Rogo, quid facias.<\/span> – Ich frage, was du machst.<\/td><\/tr><tr><td><span class=\"la\">Ubi fuisti?<\/span> – Wo warst du?<\/td><td><span class=\"la\">Scio, ubi fueris.<\/span> – Ich weiß, wo du warst.<\/td><\/tr><\/table><\/div>\n<p>Indirekte Satzfragen werden mit <span class=\"la\">-ne<\/span> oder <span class=\"la\">num<\/span> eingeleitet. Beide heißen hier einfach „<b>ob<\/b>“: <span class=\"la\">Rogo, num venias.<\/span> – „Ich frage, ob du kommst.“ Indirekte Doppelfragen haben <span class=\"la\">utrum … an<\/span> (ob … oder).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>In der indirekten Frage bedeutet <span class=\"la\">num<\/span> nur „ob“ und erwartet kein Nein mehr. Und <span class=\"la\">quid<\/span> ist Fragepronomen („was“), kein Relativpronomen. Der Unterschied zum Relativsatz: Die indirekte Frage hängt von einem Verb des Fragens oder Wissens ab und steht im Konjunktiv.<\/div>\n<h3>Die Zeitenfolge<\/h3>\n<p>In konjunktivischen Gliedsätzen richtet sich das Tempus nach dem <b>übergeordneten Verb<\/b> und nach dem <b>Zeitverhältnis<\/b>. Das ist die <span class=\"la\">consecutio temporum<\/span>. Sie sieht kompliziert aus, besteht aber aus einer einzigen Tabelle.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Übergeordnetes Verb<\/th><th>gleichzeitig<\/th><th>vorzeitig<\/th><th>nachzeitig<\/th><\/tr><tr><td>Haupttempus (Präsens, Futur)<\/td><td>Konj. Präsens<\/td><td>Konj. Perfekt<\/td><td><span class=\"la\">-urus sim<\/span><\/td><\/tr><tr><td>Nebentempus (Imperfekt, Perfekt, Plusquamperfekt)<\/td><td>Konj. Imperfekt<\/td><td>Konj. Plusquamperfekt<\/td><td><span class=\"la\">-urus essem<\/span><\/td><\/tr><\/table><\/div>\n<p>Für das Übersetzen bedeutet das: Der Konjunktiv <b>Imperfekt<\/b> im Gliedsatz ist nicht „Vergangenheit“, sondern „gleichzeitig mit einem vergangenen Hauptverb“. Der Konjunktiv <b>Plusquamperfekt<\/b> ist „vorher“.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Zeitverhältnis<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">Rogo, quid facias.<\/span><\/td><td>gleichzeitig<\/td><td>Ich frage, was du machst.<\/td><\/tr><tr><td><span class=\"la\">Rogo, quid feceris.<\/span><\/td><td>vorzeitig<\/td><td>Ich frage, was du gemacht hast.<\/td><\/tr><tr><td><span class=\"la\">Rogo, quid facturus sis.<\/span><\/td><td>nachzeitig<\/td><td>Ich frage, was du machen wirst.<\/td><\/tr><tr><td><span class=\"la\">Rogavi, quid faceres.<\/span><\/td><td>gleichzeitig<\/td><td>Ich fragte, was du machtest (gerade tatest).<\/td><\/tr><tr><td><span class=\"la\">Rogavi, quid fecisses.<\/span><\/td><td>vorzeitig<\/td><td>Ich fragte, was du gemacht hattest.<\/td><\/tr><tr><td><span class=\"la\">Rogavi, quid facturus esses.<\/span><\/td><td>nachzeitig<\/td><td>Ich fragte, was du machen würdest.<\/td><\/tr><\/table><\/div>\n<p>Dieselbe Regel gilt für <span class=\"la\">ut<\/span>-Sätze, <span class=\"la\">cum<\/span>-Sätze und alle anderen konjunktivischen Gliedsätze. Deshalb steht nach <span class=\"la\">Caesar imperavit, ut<\/span> … immer der Konjunktiv Imperfekt.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Zeitverhältnis bestimmen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Caesar ex captivis quaesivit, ubi hostes castra posuissent et quid facere pararent.<\/span> (captivus = Gefangener; quaerere ex = fragen; castra ponere = ein Lager aufschlagen; parare = vorhaben)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Hauptverb: <span class=\"la\">quaesivit<\/span> (er fragte), Perfekt, also Nebentempus.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zwei indirekte Fragen, eingeleitet durch <span class=\"la\">ubi<\/span> (wo) und <span class=\"la\">quid<\/span> (was).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">posuissent<\/span>: Konjunktiv Plusquamperfekt. Nach Nebentempus bedeutet das Vorzeitigkeit: „wo sie … aufgeschlagen hatten“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">pararent<\/span>: Konjunktiv Imperfekt. Nach Nebentempus Gleichzeitigkeit: „was sie vorhatten“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Caesar fragte die Gefangenen, wo die Feinde ihr Lager aufgeschlagen hatten und was sie zu tun vorhatten.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"orobl","t":"Die indirekte Rede (Oratio obliqua)","kl":"3","k":3,"a":"S","tag":"Lektüre","goals":["den Beginn und das Ende einer indirekten Rede erkennen","die drei Umwandlungsregeln für Aussagen, Aufforderungen und Gliedsätze anwenden","Pronomen in der indirekten Rede richtig beziehen","längere Abschnitte in gutem Deutsch wiedergeben"],"ex":[{"type":"mc","q":"In welcher Form stehen Aussage-Hauptsätze in der indirekten Rede?","s":"Aussagen werden zum AcI, weil sie vom (gedachten) Verb des Sagens abhängen.","o":["im AcI","im Konjunktiv","im Indikativ","im Imperativ"]},{"type":"mc","q":"In welcher Form stehen Aufforderungen in der indirekten Rede?","s":"Aus dem Imperativ der direkten Rede wird ein Konjunktiv. Du übersetzt mit „sollen“.","o":["im Konjunktiv ohne <span class=\"la\">ut<\/span>","im AcI","im Imperativ","im Infinitiv Präsens allein"]},{"type":"mc","q":"Auf wen bezieht sich <span class=\"la\">se<\/span> in <span class=\"la\">Legati dixerunt se pacem petere.<\/span>?","s":"<span class=\"la\">se<\/span> bezeichnet in der indirekten Rede den Sprecher: „Die Gesandten sagten, sie (selbst) bäten um Frieden.“","o":["auf die Gesandten","auf die Angesprochenen","auf eine dritte Gruppe","auf niemanden, es ist unpersönlich"]},{"type":"mc","q":"Welche Übersetzung von <span class=\"la\">Dixit: milites fortiter pugnarent.<\/span> ist richtig?","h":"Steht ein Infinitiv oder ein Konjunktiv?","s":"<span class=\"la\">pugnarent<\/span> ist ein Konjunktiv ohne Subjunktion, also eine Aufforderung. Eine Aussage stünde im AcI: <span class=\"la\">milites fortiter pugnare<\/span>.","o":["Er sagte, die Soldaten sollten tapfer kämpfen.","Er sagte, dass die Soldaten tapfer kämpften.","Er sagte, die Soldaten hätten tapfer gekämpft.","Er sagte den Soldaten, dass er tapfer kämpfe."]},{"type":"mc","q":"Mit welchem deutschen Modus gibt man die indirekte Rede wieder?","s":"„Er sagte, er sei bereit.“ Wo der Konjunktiv I nicht vom Indikativ zu unterscheiden ist („sie kommen“), weicht man auf den Konjunktiv II aus („sie kämen“).","o":["mit dem Konjunktiv I, ersatzweise Konjunktiv II","immer mit dem Indikativ","immer mit „würde“","mit dem Imperativ"]},{"type":"self","q":"Übersetze: <span class=\"la\">Nuntius dixit hostes appropinquare; cives portas clauderent.<\/span> (porta = Tor; claudere = schließen)","s":"„Der Bote sagte, die Feinde näherten sich. Die Bürger sollten die Tore schließen.“ Die Aussage steht im AcI, die Aufforderung im Konjunktiv."},{"type":"self","q":"Übersetze: <span class=\"la\">Caesar respondit se, quod Galli obsides dedissent, pacem facturum esse.<\/span> (obses, obsidis = Geisel)","s":"„Caesar antwortete, er werde, weil die Gallier Geiseln gestellt hätten, Frieden schließen.“ Hauptaussage im AcI mit Infinitiv Futur (<span class=\"la\">se … facturum esse<\/span>), der <span class=\"la\">quod<\/span>-Satz steht als Gliedsatz der indirekten Rede im Konjunktiv."}],"gen":[],"html":"<h3>Was die indirekte Rede ist<\/h3>\n<p>Bei Caesar, Livius und Sallust werden Reden oft nicht wörtlich, sondern berichtend wiedergegeben. Eine solche <span class=\"la\">oratio obliqua<\/span> kann sich über viele Sätze ziehen, ohne dass das einleitende Verb wiederholt wird. Du erkennst sie daran, dass plötzlich <b>Hauptsätze im AcI<\/b> stehen und <b>alle Gliedsätze im Konjunktiv<\/b>.<\/p>\n<h3>Die drei Regeln<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>In der direkten Rede<\/th><th>wird in der indirekten Rede zu<\/th><th>Beispiel<\/th><\/tr><tr><td>Aussagesatz (Hauptsatz)<\/td><td><b>AcI<\/b><\/td><td><span class=\"la\">Hostes veniunt.<\/span> → (<span class=\"la\">dixit<\/span>) <span class=\"la\">hostes venire<\/span><\/td><\/tr><tr><td>Aufforderung, Wunsch<\/td><td><b>Konjunktiv<\/b> (ohne <span class=\"la\">ut<\/span>; verneint <span class=\"la\">ne<\/span>)<\/td><td><span class=\"la\">Venite!<\/span> → <span class=\"la\">venirent<\/span><\/td><\/tr><tr><td>Gliedsatz<\/td><td><b>Konjunktiv<\/b><\/td><td><span class=\"la\">quod timent<\/span> → <span class=\"la\">quod timerent<\/span><\/td><\/tr><tr><td>echte Frage<\/td><td>Konjunktiv<\/td><td><span class=\"la\">Quid facitis?<\/span> → <span class=\"la\">quid facerent<\/span><\/td><\/tr><tr><td>rhetorische Frage<\/td><td>AcI<\/td><td><span class=\"la\">Quis hoc credit?<\/span> → <span class=\"la\">quem hoc credere?<\/span><\/td><\/tr><\/table><\/div>\n<p>Das Tempus der Konjunktive folgt der Zeitenfolge. Da das einleitende Verb meist in der Vergangenheit steht, findest du fast nur Konjunktiv Imperfekt und Plusquamperfekt.<\/p>\n<h3>Pronomen<\/h3>\n<ul><li><span class=\"la\">se<\/span> und <span class=\"la\">suus<\/span> bezeichnen den <b>Sprecher<\/b> der Rede.<\/li><li><span class=\"la\">is, ille<\/span> bezeichnen den <b>Angesprochenen<\/b> oder Dritte.<\/li><li>Aus <span class=\"la\">ego<\/span> und <span class=\"la\">nos<\/span> der direkten Rede wird <span class=\"la\">se<\/span>, aus <span class=\"la\">tu<\/span> und <span class=\"la\">vos<\/span> wird <span class=\"la\">ille<\/span> oder <span class=\"la\">is<\/span>.<\/li><\/ul>\n<h3>Übersetzen<\/h3>\n<p>Im Deutschen gibst du die indirekte Rede mit dem <b>Konjunktiv I<\/b> wieder (er sei, er habe, er komme). Wo der Konjunktiv I mit dem Indikativ gleich lautet, nimmst du den Konjunktiv II (sie kämen, sie hätten). Aufforderungen übersetzt du mit „sollen“. Ein „dass“ brauchst du nur am Anfang, danach genügt der Konjunktiv.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Markiere dir in einem Abschnitt indirekter Rede zuerst alle Infinitive (das sind die Hauptsätze) und alle Konjunktive ohne Subjunktion (das sind die Aufforderungen). Dann siehst du das Gerüst der Rede auf einen Blick.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Indirekte Rede auflösen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Ariovistus Caesari respondit: se prius in Galliam venisse quam populum Romanum; proinde exercitum deduceret; nisi id fecisset, se eum pro hoste habiturum esse.<\/span> (prius … quam = früher als; proinde = daher; deducere = abziehen; pro hoste habere = als Feind betrachten)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Einleitendes Verb: <span class=\"la\">respondit<\/span> (er antwortete), ein Nebentempus. Danach beginnt die indirekte Rede. Sprecher ist Ariovist, angesprochen ist Caesar.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Markiere die Infinitive: <span class=\"la\">venisse<\/span> und <span class=\"la\">habiturum esse<\/span>. Das sind die Aussagen. Markiere den Konjunktiv ohne Subjunktion: <span class=\"la\">deduceret<\/span>. Das ist eine Aufforderung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Erste Aussage: <span class=\"la\">se … venisse<\/span>, AcI mit Infinitiv Perfekt (vorzeitig). <span class=\"la\">se<\/span> ist der Sprecher: „er sei früher nach Gallien gekommen als das römische Volk“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Aufforderung: <span class=\"la\">exercitum deduceret<\/span>. Aus dem Imperativ „Zieh dein Heer ab!“ ist ein Konjunktiv geworden. Gemeint ist der Angesprochene: „er (Caesar) solle daher sein Heer abziehen“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Bedingungssatz: <span class=\"la\">nisi id fecisset<\/span>. Gliedsatz, daher Konjunktiv: „wenn er das nicht tue“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Zweite Aussage: <span class=\"la\">se eum pro hoste habiturum esse<\/span>, AcI mit Infinitiv Futur (nachzeitig). <span class=\"la\">se<\/span> ist wieder Ariovist, <span class=\"la\">eum<\/span> ist Caesar: „werde er ihn als Feind betrachten“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Zusammen: „Ariovist antwortete Caesar, er sei früher nach Gallien gekommen als das römische Volk. Daher solle Caesar sein Heer abziehen. Wenn er das nicht tue, werde er ihn als Feind betrachten.“ Wo im Deutschen unklar wäre, wer mit „er“ gemeint ist, setzt du den Namen ein.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"wortbildung","t":"Wortbildung: Vorsilben, Nachsilben und Wortfamilien","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["zusammengesetzte Verben in Vorsilbe und Grundverb zerlegen","Lautveränderungen wie Assimilation und Vokalschwächung durchschauen","die Bedeutung abgeleiteter Wörter aus ihren Nachsilben erschließen","mit Wortfamilien Vokabeln sparen"],"ex":[{"type":"mc","q":"Aus welchen Bestandteilen besteht <span class=\"la\">accipere<\/span>?","s":"Das d von <span class=\"la\">ad<\/span> gleicht sich an (Assimilation), und das a von <span class=\"la\">capere<\/span> wird zu i (Vokalschwächung): „an sich nehmen“, also „annehmen, empfangen“.","o":["<span class=\"la\">ad<\/span> + <span class=\"la\">capere<\/span>","<span class=\"la\">ab<\/span> + <span class=\"la\">capere<\/span>","<span class=\"la\">ac<\/span> + <span class=\"la\">cipere<\/span>","<span class=\"la\">ad<\/span> + <span class=\"la\">cedere<\/span>"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">reducere<\/span>?","s":"<span class=\"la\">re-<\/span> heißt „zurück“. „Hinausführen“ wäre <span class=\"la\">educere<\/span>, „wegführen“ <span class=\"la\">abducere<\/span> oder <span class=\"la\">deducere<\/span>.","o":["zurückführen","hinausführen","wegführen","zusammenführen"]},{"type":"mc","q":"Was bezeichnet die Nachsilbe <span class=\"la\">-tor<\/span>?","s":"<span class=\"la\">victor<\/span> ist der, der siegt, <span class=\"la\">lector<\/span> der, der liest, <span class=\"la\">imperator<\/span> der, der befiehlt. Viele dieser Wörter leben im Deutschen weiter: Doktor, Rektor, Direktor.","o":["eine handelnde Person","eine Eigenschaft","eine Verkleinerung","einen Ort"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">immortalis<\/span>?","s":"<span class=\"la\">in-<\/span> vor Adjektiven verneint, vor m wird es zu <span class=\"la\">im-<\/span>: nicht <span class=\"la\">mortalis<\/span> (sterblich).","o":["unsterblich","in den Tod gehend","tödlich","sterblich"]},{"type":"mc","q":"Von welchem Grundverb kommt <span class=\"la\">interficere<\/span> (töten)?","s":"<span class=\"la\">inter<\/span> + <span class=\"la\">facere<\/span> mit Vokalschwächung, wörtlich „dazwischen (weg)machen“. Das Partizip lautet <span class=\"la\">interfectus<\/span>.","o":["von <span class=\"la\">facere<\/span>","von <span class=\"la\">ferre<\/span>","von <span class=\"la\">fugere<\/span>","von <span class=\"la\">fieri<\/span>"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">periculosus<\/span>?","s":"<span class=\"la\">-osus<\/span> heißt „reich an“: voll von <span class=\"la\">periculum<\/span> (Gefahr).","o":["gefährlich","gefahrlos","gefährdet","Gefahr"]},{"type":"mc","q":"Welches Wort gehört <b>nicht<\/b> zur Wortfamilie von <span class=\"la\">regere<\/span>?","s":"<span class=\"la\">res, rei<\/span> (Sache) hat mit <span class=\"la\">regere<\/span> nichts zu tun. Die drei anderen enthalten den Stamm <span class=\"la\">reg-<\/span>.","o":["<span class=\"la\">res<\/span>","<span class=\"la\">rex<\/span>","<span class=\"la\">regnum<\/span>","<span class=\"la\">regio<\/span>"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">libellus<\/span>?","s":"<span class=\"la\">-ellus<\/span> ist eine Verkleinerungssilbe zu <span class=\"la\">liber<\/span> (Buch). Catull nennt seine Gedichtsammlung so. Davon kommt das Wort Libell für eine kleine Schrift.","o":["Büchlein","Bücherfreund","Bücherei","Freiheit"]}],"gen":[],"html":"<h3>Warum sich das lohnt<\/h3>\n<p>Der lateinische Wortschatz besteht zu einem großen Teil aus Bausteinen. Wer <span class=\"la\">ducere<\/span> (führen) kennt und die Vorsilben versteht, muss <span class=\"la\">adducere, educere, inducere, reducere, traducere, producere, deducere<\/span> nicht einzeln lernen. Das spart Zeit beim Lernen und beim Nachschlagen.<\/p>\n<h3>Die wichtigsten Vorsilben<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Vorsilbe<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><span class=\"la\">a-, ab-, abs-<\/span><\/td><td>weg, fort<\/td><td><span class=\"la\">abire<\/span> weggehen, <span class=\"la\">abducere<\/span> wegführen<\/td><\/tr><tr><td><span class=\"la\">ad-<\/span><\/td><td>heran, hinzu<\/td><td><span class=\"la\">advenire<\/span> ankommen, <span class=\"la\">adire<\/span> herangehen<\/td><\/tr><tr><td><span class=\"la\">con- (com-, co-)<\/span><\/td><td>zusammen; ganz und gar<\/td><td><span class=\"la\">convenire<\/span> zusammenkommen, <span class=\"la\">conficere<\/span> fertig machen<\/td><\/tr><tr><td><span class=\"la\">de-<\/span><\/td><td>herab, weg<\/td><td><span class=\"la\">descendere<\/span> herabsteigen, <span class=\"la\">deponere<\/span> ablegen<\/td><\/tr><tr><td><span class=\"la\">dis-, di-<\/span><\/td><td>auseinander<\/td><td><span class=\"la\">dimittere<\/span> entlassen, <span class=\"la\">discedere<\/span> auseinandergehen<\/td><\/tr><tr><td><span class=\"la\">e-, ex-<\/span><\/td><td>heraus<\/td><td><span class=\"la\">exire<\/span> hinausgehen, <span class=\"la\">educere<\/span> herausführen<\/td><\/tr><tr><td><span class=\"la\">in-<\/span> (bei Verben)<\/td><td>hinein, auf<\/td><td><span class=\"la\">inire<\/span> hineingehen, <span class=\"la\">imponere<\/span> auferlegen<\/td><\/tr><tr><td><span class=\"la\">in-<\/span> (bei Adjektiven)<\/td><td>un-, nicht<\/td><td><span class=\"la\">iniustus<\/span> ungerecht, <span class=\"la\">immortalis<\/span> unsterblich<\/td><\/tr><tr><td><span class=\"la\">inter-<\/span><\/td><td>dazwischen<\/td><td><span class=\"la\">intercedere<\/span> dazwischentreten, <span class=\"la\">interesse<\/span> teilnehmen<\/td><\/tr><tr><td><span class=\"la\">ob-<\/span><\/td><td>entgegen<\/td><td><span class=\"la\">occurrere<\/span> entgegenlaufen, <span class=\"la\">opponere<\/span> entgegenstellen<\/td><\/tr><tr><td><span class=\"la\">per-<\/span><\/td><td>hindurch; völlig<\/td><td><span class=\"la\">pervenire<\/span> hingelangen, <span class=\"la\">perficere<\/span> vollenden<\/td><\/tr><tr><td><span class=\"la\">prae-<\/span><\/td><td>voran, vorn<\/td><td><span class=\"la\">praeesse<\/span> an der Spitze stehen, <span class=\"la\">praemittere<\/span> vorausschicken<\/td><\/tr><tr><td><span class=\"la\">pro-<\/span><\/td><td>vorwärts, hervor<\/td><td><span class=\"la\">procedere<\/span> vorrücken, <span class=\"la\">producere<\/span> vorführen<\/td><\/tr><tr><td><span class=\"la\">re-, red-<\/span><\/td><td>zurück; wieder<\/td><td><span class=\"la\">redire<\/span> zurückkehren, <span class=\"la\">reficere<\/span> wiederherstellen<\/td><\/tr><tr><td><span class=\"la\">sub-<\/span><\/td><td>unter; zu Hilfe<\/td><td><span class=\"la\">subire<\/span> auf sich nehmen, <span class=\"la\">succurrere<\/span> zu Hilfe eilen<\/td><\/tr><tr><td><span class=\"la\">trans-, tra-<\/span><\/td><td>hinüber<\/td><td><span class=\"la\">transire<\/span> überschreiten, <span class=\"la\">tradere<\/span> übergeben<\/td><\/tr><\/table><\/div>\n<h3>Zwei Lautgesetze<\/h3>\n<p><b>Assimilation:<\/b> Der letzte Laut der Vorsilbe gleicht sich dem folgenden an. Im Wörterbuch musst du dann unter der veränderten Form suchen, die Bedeutung erschließt du aus der ursprünglichen.<\/p>\n<div class=\"formula\"><span class=\"la\">ad + ferre<\/span> → <span class=\"la\">afferre<\/span> – <span class=\"la\">ad + capere<\/span> → <span class=\"la\">accipere<\/span> – <span class=\"la\">con + legere<\/span> → <span class=\"la\">colligere<\/span> – <span class=\"la\">in + mittere<\/span> → <span class=\"la\">immittere<\/span> – <span class=\"la\">ob + currere<\/span> → <span class=\"la\">occurrere<\/span> – <span class=\"la\">sub + ferre<\/span> → <span class=\"la\">sufferre<\/span><\/div>\n<p><b>Vokalschwächung:<\/b> Im Inneren eines Kompositums wird der Stammvokal schwächer, meist wird a oder e zu i.<\/p>\n<div class=\"formula\"><span class=\"la\">facere<\/span> → <span class=\"la\">con<b>fi<\/b>cere, per<b>fi<\/b>cere, inter<b>fi<\/b>cere<\/span> – <span class=\"la\">capere<\/span> → <span class=\"la\">ac<b>ci<\/b>pere, in<b>ci<\/b>pere<\/span> – <span class=\"la\">tenere<\/span> → <span class=\"la\">con<b>ti<\/b>nere, re<b>ti<\/b>nere<\/span> – <span class=\"la\">habere<\/span> → <span class=\"la\">pro<b>hi<\/b>bere<\/span> – <span class=\"la\">cadere<\/span> → <span class=\"la\">ac<b>ci<\/b>dere<\/span><\/div>\n<p>Im Partizip wird a oft zu e: <span class=\"la\">confectus, acceptus, interfectus<\/span>.<\/p>\n<h3>Nachsilben bei Substantiven<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Nachsilbe<\/th><th>bezeichnet<\/th><th>Beispiele<\/th><\/tr><tr><td><span class=\"la\">-tor, -sor<\/span> (m.)<\/td><td>den Handelnden<\/td><td><span class=\"la\">victor<\/span> Sieger, <span class=\"la\">orator<\/span> Redner, <span class=\"la\">defensor<\/span> Verteidiger<\/td><\/tr><tr><td><span class=\"la\">-tio, -sio<\/span> (f.)<\/td><td>die Handlung<\/td><td><span class=\"la\">oratio<\/span> Rede, <span class=\"la\">actio<\/span> Handlung, <span class=\"la\">defensio<\/span> Verteidigung<\/td><\/tr><tr><td><span class=\"la\">-tas, -tus, -tudo, -ia<\/span> (f.)<\/td><td>eine Eigenschaft<\/td><td><span class=\"la\">libertas<\/span> Freiheit, <span class=\"la\">virtus<\/span> Tüchtigkeit, <span class=\"la\">magnitudo<\/span> Größe, <span class=\"la\">audacia<\/span> Kühnheit<\/td><\/tr><tr><td><span class=\"la\">-men, -mentum<\/span> (n.)<\/td><td>Mittel oder Ergebnis<\/td><td><span class=\"la\">nomen<\/span> Name, <span class=\"la\">ornamentum<\/span> Schmuck, <span class=\"la\">monumentum<\/span> Denkmal<\/td><\/tr><tr><td><span class=\"la\">-ium<\/span> (n.)<\/td><td>Handlung, Ergebnis, Ort<\/td><td><span class=\"la\">studium<\/span> Eifer, <span class=\"la\">aedificium<\/span> Gebäude, <span class=\"la\">imperium<\/span> Befehl<\/td><\/tr><tr><td><span class=\"la\">-ulus, -culus, -ellus<\/span><\/td><td>Verkleinerung<\/td><td><span class=\"la\">libellus<\/span> Büchlein, <span class=\"la\">navicula<\/span> Schiffchen<\/td><\/tr><\/table><\/div>\n<h3>Nachsilben bei Adjektiven<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Nachsilbe<\/th><th>Bedeutung<\/th><th>Beispiele<\/th><\/tr><tr><td><span class=\"la\">-osus<\/span><\/td><td>reich an, voll von<\/td><td><span class=\"la\">periculosus<\/span> gefährlich, <span class=\"la\">gloriosus<\/span> ruhmreich<\/td><\/tr><tr><td><span class=\"la\">-bilis, -ilis<\/span><\/td><td>Möglichkeit (passiv)<\/td><td><span class=\"la\">credibilis<\/span> glaubwürdig, <span class=\"la\">facilis<\/span> machbar, leicht<\/td><\/tr><tr><td><span class=\"la\">-alis, -aris, -anus, -icus, -ius<\/span><\/td><td>Zugehörigkeit<\/td><td><span class=\"la\">regalis<\/span> königlich, <span class=\"la\">militaris<\/span> soldatisch, <span class=\"la\">urbanus<\/span> städtisch, <span class=\"la\">publicus<\/span> öffentlich<\/td><\/tr><tr><td><span class=\"la\">-eus<\/span><\/td><td>Stoff<\/td><td><span class=\"la\">aureus<\/span> golden, <span class=\"la\">ferreus<\/span> eisern<\/td><\/tr><tr><td><span class=\"la\">-ax<\/span><\/td><td>Neigung<\/td><td><span class=\"la\">audax<\/span> kühn, <span class=\"la\">loquax<\/span> geschwätzig<\/td><\/tr><\/table><\/div>\n<h3>Wortfamilien<\/h3>\n<p>Lerne neue Wörter nicht einzeln, sondern hänge sie an bekannte an. Ein Beispiel:<\/p>\n<div class=\"formula\"><span class=\"la\">regere<\/span> lenken – <span class=\"la\">rex<\/span> König – <span class=\"la\">regina<\/span> Königin – <span class=\"la\">regnum<\/span> Königreich – <span class=\"la\">regnare<\/span> herrschen – <span class=\"la\">regius, regalis<\/span> königlich – <span class=\"la\">regio<\/span> Richtung, Gegend – <span class=\"la\">rector<\/span> Lenker – <span class=\"la\">dirigere<\/span> ausrichten – <span class=\"la\">corrigere<\/span> berichtigen<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein unbekanntes Wort erschließen<\/h4><div class=\"task\">Im Text steht <span class=\"la\">incredibilis<\/span>. Du kennst das Wort nicht. Erschließe die Bedeutung.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zerlege: <span class=\"la\">in-<\/span> + <span class=\"la\">cred-<\/span> + <span class=\"la\">-ibilis<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">cred-<\/span> kennst du von <span class=\"la\">credere<\/span> (glauben).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">-ibilis<\/span> bezeichnet eine Möglichkeit: <span class=\"la\">credibilis<\/span> ist „glaubbar“, also „glaubwürdig“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">in-<\/span> vor einem Adjektiv verneint: „nicht glaubbar“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ergebnis: „unglaublich“. Das englische <span class=\"la\">incredible<\/span> ist dasselbe Wort.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"lebt","t":"Latein lebt weiter: Fremdwörter, Sprachen, Redewendungen","kl":"3","k":3,"a":"W","tag":"Lektüre","goals":["Fremd- und Lehnwörter auf ihr lateinisches Ursprungswort zurückführen","Verwandtschaften zwischen Latein, den romanischen Sprachen und Englisch erkennen","unbekannte Fremdwörter aus ihren Bestandteilen erklären","gängige lateinische Wendungen und Abkürzungen verstehen"],"ex":[{"type":"mc","q":"Von welchem lateinischen Wort kommt „Fenster“?","s":"<span class=\"la\">fenestra<\/span> ist ein Lehnwort aus der Zeit, als die Germanen das Bauen mit Stein und Glas von den Römern lernten. Französisch <span class=\"la\">fenêtre<\/span>, italienisch <span class=\"la\">finestra<\/span>.","o":["<span class=\"la\">fenestra<\/span>","<span class=\"la\">finis<\/span>","<span class=\"la\">ferre<\/span>","<span class=\"la\">festus<\/span>"]},{"type":"mc","q":"Was bedeutet „Agenda“ wörtlich?","s":"<span class=\"la\">agenda<\/span> ist das Gerundivum von <span class=\"la\">agere<\/span> im Neutrum Plural. Das Gerundivum drückt die Notwendigkeit aus.","o":["Dinge, die getan werden müssen","Dinge, die getan worden sind","jemand, der handelt","das Handeln"]},{"type":"mc","q":"Welches lateinische Verb steckt in „Konferenz“?","s":"<span class=\"la\">con<\/span> + <span class=\"la\">ferre<\/span>: zusammentragen. In einer Konferenz trägt man Meinungen und Ergebnisse zusammen.","o":["<span class=\"la\">ferre<\/span>","<span class=\"la\">facere<\/span>","<span class=\"la\">fieri<\/span>","<span class=\"la\">fingere<\/span>"]},{"type":"mc","q":"Was bedeutet die Abkürzung <span class=\"la\">i. e.<\/span> in englischen Texten?","s":"<span class=\"la\">id est<\/span> – „das ist“, „das heißt“. „Zum Beispiel“ wäre <span class=\"la\">e. g.<\/span> (<span class=\"la\">exempli gratia<\/span>). Die beiden werden häufig verwechselt.","o":["das heißt","zum Beispiel","und so weiter","im Gegensatz dazu"]},{"type":"mc","q":"Aus welchen Bestandteilen besteht „Interregnum“ und was bedeutet es?","s":"<span class=\"la\">inter<\/span> heißt „zwischen“, <span class=\"la\">regnum<\/span> „Herrschaft“. Gemeint ist die Zeit, in der es keinen anerkannten Herrscher gibt.","o":["<span class=\"la\">inter<\/span> + <span class=\"la\">regnum<\/span>: Zeit zwischen zwei Herrschaften","<span class=\"la\">in<\/span> + <span class=\"la\">terra<\/span> + <span class=\"la\">regnum<\/span>: Herrschaft im Land","<span class=\"la\">inter<\/span> + <span class=\"la\">regere<\/span>: gemeinsam herrschen","<span class=\"la\">intra<\/span> + <span class=\"la\">regnum<\/span>: innerhalb des Reichs"]},{"type":"mc","q":"Welches englische Wort geht auf lateinisch <span class=\"la\">populus<\/span> zurück?","s":"Über altfranzösisch <span class=\"la\">pueple<\/span> wurde aus <span class=\"la\">populus<\/span> das englische <span class=\"la\">people<\/span>. <span class=\"la\">folk<\/span> ist das germanische Wort (deutsch Volk).","o":["people","folk","friend","town"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">de facto<\/span>?","s":"Wörtlich „vom Getanen her“. Der Gegenbegriff ist <span class=\"la\">de iure<\/span> (von Rechts wegen).","o":["tatsächlich, der Sache nach","dem Gesetz nach","von Anfang an","ohne Grund"]},{"type":"self","q":"Erkläre das Wort „Manuskript“ aus seinen lateinischen Bestandteilen.","s":"<span class=\"la\">manu<\/span> ist Ablativ von <span class=\"la\">manus<\/span> (Hand), <span class=\"la\">scriptum<\/span> ist das Partizip Perfekt Passiv von <span class=\"la\">scribere<\/span> (schreiben) im Neutrum: „mit der Hand Geschriebenes“. Heute bezeichnet das Wort die Vorlage eines Textes, auch wenn sie getippt ist."}],"gen":[],"html":"<h3>Zwei Wege ins Deutsche<\/h3>\n<p><b>Lehnwörter<\/b> kamen früh, oft schon mit den Römern, und haben sich so angepasst, dass man ihnen die Herkunft nicht mehr ansieht. <b>Fremdwörter<\/b> kamen später über Kirche, Schule und Wissenschaft und sind noch gut erkennbar.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Lehnwort<\/th><th>Lateinisch<\/th><th>Fremdwort<\/th><\/tr><tr><td><span class=\"la\">murus<\/span><\/td><td>Mauer<\/td><td><span class=\"la\">studium<\/span><\/td><td>Studium<\/td><\/tr><tr><td><span class=\"la\">fenestra<\/span><\/td><td>Fenster<\/td><td><span class=\"la\">oratio<\/span><\/td><td>Oration<\/td><\/tr><tr><td><span class=\"la\">cellarium<\/span><\/td><td>Keller<\/td><td><span class=\"la\">actio<\/span><\/td><td>Aktion<\/td><\/tr><tr><td><span class=\"la\">vinum<\/span><\/td><td>Wein<\/td><td><span class=\"la\">universitas<\/span><\/td><td>Universität<\/td><\/tr><tr><td><span class=\"la\">(via) strata<\/span><\/td><td>Straße<\/td><td><span class=\"la\">disciplina<\/span><\/td><td>Disziplin<\/td><\/tr><tr><td><span class=\"la\">caseus<\/span><\/td><td>Käse<\/td><td><span class=\"la\">privatus<\/span><\/td><td>privat<\/td><\/tr><tr><td><span class=\"la\">tegula<\/span><\/td><td>Ziegel<\/td><td><span class=\"la\">humanus<\/span><\/td><td>human<\/td><\/tr><tr><td><span class=\"la\">scribere<\/span><\/td><td>schreiben<\/td><td><span class=\"la\">conferre<\/span><\/td><td>Konferenz<\/td><\/tr><\/table><\/div>\n<p>Die Lehnwörter zeigen, was die Germanen von den Römern übernahmen: das Bauen mit Stein, den Weinbau, das Schreiben.<\/p>\n<p>Die Aufgabe „Fremd- und Lehnwörter zuordnen“ gehört zu den festen Formaten des Interpretationsteils. Wie sie gestellt wird, steht auf der Seite zur Zentralmatura. Hier trainierst du die Fähigkeit dahinter.<\/p>\n<h3>Fremdwörter aus Bausteinen erklären<\/h3>\n<p>Die meisten Fremdwörter lassen sich mit der Wortbildungslehre des vorigen Kapitels durchschauen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fremdwort<\/th><th>Bestandteile<\/th><th>wörtlich<\/th><\/tr><tr><td>Export<\/td><td><span class=\"la\">ex<\/span> + <span class=\"la\">portare<\/span><\/td><td>Hinaustragen<\/td><\/tr><tr><td>Subtraktion<\/td><td><span class=\"la\">sub<\/span> + <span class=\"la\">trahere<\/span><\/td><td>Darunter-Wegziehen<\/td><\/tr><tr><td>Intervention<\/td><td><span class=\"la\">inter<\/span> + <span class=\"la\">venire<\/span><\/td><td>Dazwischenkommen<\/td><\/tr><tr><td>Rezeption<\/td><td><span class=\"la\">re<\/span> + <span class=\"la\">capere<\/span><\/td><td>Zurück-Nehmen, Aufnahme<\/td><\/tr><tr><td>Präposition<\/td><td><span class=\"la\">prae<\/span> + <span class=\"la\">ponere<\/span><\/td><td>das Vorangestellte<\/td><\/tr><tr><td>transparent<\/td><td><span class=\"la\">trans<\/span> + <span class=\"la\">parere<\/span><\/td><td>durchscheinend<\/td><\/tr><tr><td>Konjunktion<\/td><td><span class=\"la\">con<\/span> + <span class=\"la\">iungere<\/span><\/td><td>Verbindung<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Beim Erklären eines Fremdworts nennst du immer drei Dinge: das lateinische Ursprungswort in der Grundform, seine Bedeutung und den Zusammenhang mit der heutigen Bedeutung. Beispiel: „Agenda kommt von <span class=\"la\">agere<\/span> (tun, handeln) und bedeutet wörtlich ‚das, was getan werden muss‘, also eine Liste zu erledigender Dinge.“<\/div>\n<h3>Die Tochtersprachen<\/h3>\n<p>Aus dem gesprochenen Latein der Provinzen entstanden die romanischen Sprachen. Wer Latein kann, versteht in ihnen vieles auf Anhieb.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Latein<\/th><th>Italienisch<\/th><th>Spanisch<\/th><th>Französisch<\/th><th>Englisch (über das Französische)<\/th><\/tr><tr><td><span class=\"la\">pater<\/span><\/td><td>padre<\/td><td>padre<\/td><td>père<\/td><td>paternal<\/td><\/tr><tr><td><span class=\"la\">aqua<\/span><\/td><td>acqua<\/td><td>agua<\/td><td>eau<\/td><td>aquatic<\/td><\/tr><tr><td><span class=\"la\">tempus<\/span><\/td><td>tempo<\/td><td>tiempo<\/td><td>temps<\/td><td>temporary<\/td><\/tr><tr><td><span class=\"la\">populus<\/span><\/td><td>popolo<\/td><td>pueblo<\/td><td>peuple<\/td><td>people<\/td><\/tr><tr><td><span class=\"la\">liber<\/span> (frei)<\/td><td>libero<\/td><td>libre<\/td><td>libre<\/td><td>liberty<\/td><\/tr><tr><td><span class=\"la\">cantare<\/span><\/td><td>cantare<\/td><td>cantar<\/td><td>chanter<\/td><td>chant<\/td><\/tr><tr><td><span class=\"la\">nox, noctis<\/span><\/td><td>notte<\/td><td>noche<\/td><td>nuit<\/td><td>nocturnal<\/td><\/tr><\/table><\/div>\n<p>Das Englische ist keine romanische Sprache, hat aber mehr als die Hälfte seines Wortschatzes aus dem Lateinischen und Französischen. Deshalb gibt es oft zwei Wörter für dieselbe Sache: ein germanisches für den Alltag (<span class=\"la\">freedom<\/span>, <span class=\"la\">kingly<\/span>) und ein lateinisches für die gehobene Sprache (<span class=\"la\">liberty<\/span>, <span class=\"la\">royal<\/span>).<\/p>\n<h3>Wendungen und Abkürzungen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">etc.<\/span> = <span class=\"la\">et cetera<\/span><\/td><td>und die übrigen (Dinge), und so weiter<\/td><\/tr><tr><td><span class=\"la\">ca.<\/span> = <span class=\"la\">circa<\/span><\/td><td>ungefähr<\/td><\/tr><tr><td><span class=\"la\">P. S.<\/span> = <span class=\"la\">post scriptum<\/span><\/td><td>nach dem Geschriebenen, Nachschrift<\/td><\/tr><tr><td><span class=\"la\">a. m.<\/span> / <span class=\"la\">p. m.<\/span> = <span class=\"la\">ante<\/span> / <span class=\"la\">post meridiem<\/span><\/td><td>vor / nach Mittag<\/td><\/tr><tr><td><span class=\"la\">e. g.<\/span> = <span class=\"la\">exempli gratia<\/span><\/td><td>zum Beispiel (im Englischen)<\/td><\/tr><tr><td><span class=\"la\">i. e.<\/span> = <span class=\"la\">id est<\/span><\/td><td>das heißt<\/td><\/tr><tr><td><span class=\"la\">vs.<\/span> = <span class=\"la\">versus<\/span><\/td><td>gegen<\/td><\/tr><tr><td><span class=\"la\">N. B.<\/span> = <span class=\"la\">nota bene<\/span><\/td><td>merke wohl<\/td><\/tr><tr><td><span class=\"la\">ad hoc<\/span><\/td><td>für diesen (Zweck), aus dem Augenblick heraus<\/td><\/tr><tr><td><span class=\"la\">de facto<\/span> / <span class=\"la\">de iure<\/span><\/td><td>tatsächlich / von Rechts wegen<\/td><\/tr><tr><td><span class=\"la\">in flagranti<\/span><\/td><td>auf frischer Tat (wörtlich: im Brennenden)<\/td><\/tr><tr><td><span class=\"la\">status quo<\/span><\/td><td>der Zustand, in dem (sich etwas befindet)<\/td><\/tr><tr><td><span class=\"la\">per se<\/span><\/td><td>an sich<\/td><\/tr><tr><td><span class=\"la\">pro forma<\/span><\/td><td>der Form halber<\/td><\/tr><tr><td><span class=\"la\">summa cum laude<\/span><\/td><td>mit höchstem Lob<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Fremdwort erklären<\/h4><div class=\"task\">Erkläre das Wort „Referendum“.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Suche den lateinischen Kern: <span class=\"la\">refer-<\/span> führt zu <span class=\"la\">referre<\/span> (zurückbringen, berichten, vorlegen), einem Kompositum von <span class=\"la\">ferre<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Erkenne die Form: <span class=\"la\">-nd-<\/span> ist das Kennzeichen des Gerundivums. <span class=\"la\">referendum<\/span> ist Neutrum Singular.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Das Gerundivum drückt eine Notwendigkeit aus: „etwas, das vorgelegt werden muss“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Verbindung zur heutigen Bedeutung: Bei einem Referendum wird eine Frage dem Volk zur Entscheidung vorgelegt.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ebenso gebildet sind Agenda (was getan werden muss), Legende (was gelesen werden muss), Memorandum (was im Gedächtnis behalten werden muss), Dividend (was geteilt werden muss).<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"klein","t":"Kleine Wörter, große Wirkung","kl":"2","k":2,"a":"W","tag":"Aufbau","goals":["die wichtigsten Konnektoren und ihre logische Aufgabe kennen","ähnlich aussehende Wörter sicher unterscheiden","mehrdeutige Wörter wie quam, quo und modo aus dem Zusammenhang bestimmen","Wortpaare wie tam … quam erkennen"],"ex":[{"type":"mc","q":"Was bedeutet <span class=\"la\">tamen<\/span>?","s":"<span class=\"la\">tamen<\/span> = dennoch. „Endlich“ ist <span class=\"la\">tandem<\/span>, „dann“ <span class=\"la\">tum<\/span>, „so sehr“ <span class=\"la\">tam<\/span>.","o":["dennoch","endlich","dann","so sehr"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">ne mater quidem<\/span>?","s":"<span class=\"la\">ne … quidem<\/span> umschließt das betonte Wort und heißt „nicht einmal“.","o":["nicht einmal die Mutter","damit die Mutter zwar nicht","gewiss nicht die Mutter","die Mutter freilich nicht"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">quam<\/span> in <span class=\"la\">Quam pulchra est haec urbs!<\/span>?","s":"Im Ausruf vor einem Adjektiv heißt <span class=\"la\">quam<\/span> „wie“: „Wie schön ist diese Stadt!“","o":["wie","als","möglichst","die"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">neque … neque<\/span>?","s":"<span class=\"la\">neque<\/span> ist <span class=\"la\">ne<\/span> + <span class=\"la\">-que<\/span> („und nicht“). Doppelt gesetzt: weder … noch.","o":["weder … noch","sowohl … als auch","entweder … oder","nicht nur … sondern auch"]},{"type":"mc","q":"Was leistet <span class=\"la\">enim<\/span> in einem Satz?","s":"<span class=\"la\">enim<\/span> heißt „denn, nämlich“ und steht an zweiter Stelle im Satz.","o":["Es begründet das Vorhergehende.","Es zieht eine Folgerung.","Es drückt einen Gegensatz aus.","Es leitet eine Frage ein."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Quo plus habent, eo plus cupiunt.<\/span>?","s":"<span class=\"la\">quo … eo<\/span> mit zwei Komparativen: „je … desto“. Beide sind Ablative des Maßes („um wie viel … um so viel“).","o":["Je mehr sie haben, desto mehr begehren sie.","Wohin sie mehr haben, dorthin begehren sie mehr.","Damit sie mehr haben, begehren sie mehr.","Sie haben mehr, als sie begehren."]},{"type":"mc","q":"Was bedeutet <span class=\"la\">quidam<\/span>?","s":"<span class=\"la\">quidam<\/span> ist ein Indefinitpronomen. „Zwar“ ist <span class=\"la\">quidem<\/span>, „einst“ <span class=\"la\">quondam<\/span>, „jeder“ <span class=\"la\">quisque<\/span>.","o":["ein gewisser","zwar","einst","jeder"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">senatus populusque Romanus<\/span>?","s":"<span class=\"la\">-que<\/span> heißt „und“ und verbindet das Wort, an dem es hängt, mit dem vorigen. Die Formel wird S P Q R abgekürzt.","o":["Senat und Volk von Rom","der Senat des römischen Volkes","der Senat oder das römische Volk","das Volk, das den römischen Senat wählt"]}],"gen":["vok","stf"],"html":"<h3>Warum gerade die kleinen Wörter?<\/h3>\n<p>In Übersetzungen kosten selten die langen Wörter Punkte. Die findet man im Wörterbuch. Teuer werden die kleinen: Wer <span class=\"la\">tamen<\/span> mit <span class=\"la\">tandem<\/span> verwechselt oder <span class=\"la\">autem<\/span> überliest, verdreht die Logik eines ganzen Absatzes. Dieses Kapitel ist eine Liste zum Auswendiglernen. Der Vokabeltrainer fragt dich viele dieser Wörter ab.<\/p>\n<h3>Konnektoren: Wie Sätze zusammenhängen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Aufgabe<\/th><th>Wörter<\/th><th>Bedeutung<\/th><\/tr><tr><td>Begründung<\/td><td><span class=\"la\">nam<\/span>, <span class=\"la\">enim<\/span> (nachgestellt), <span class=\"la\">etenim<\/span><\/td><td>denn, nämlich<\/td><\/tr><tr><td>Gegensatz<\/td><td><span class=\"la\">sed<\/span>, <span class=\"la\">at<\/span>, <span class=\"la\">autem<\/span> (nachgestellt), <span class=\"la\">vero<\/span>, <span class=\"la\">tamen<\/span><\/td><td>aber, jedoch; dennoch<\/td><\/tr><tr><td>Folgerung<\/td><td><span class=\"la\">itaque<\/span>, <span class=\"la\">igitur<\/span>, <span class=\"la\">ergo<\/span>, <span class=\"la\">ideo<\/span>, <span class=\"la\">quare<\/span><\/td><td>daher, also, deshalb<\/td><\/tr><tr><td>Reihung<\/td><td><span class=\"la\">et<\/span>, <span class=\"la\">-que<\/span>, <span class=\"la\">atque/ac<\/span>, <span class=\"la\">etiam<\/span>, <span class=\"la\">quoque<\/span> (nachgestellt)<\/td><td>und; auch, sogar<\/td><\/tr><tr><td>Auswahl<\/td><td><span class=\"la\">aut<\/span>, <span class=\"la\">vel<\/span>, <span class=\"la\">-ve<\/span>, <span class=\"la\">sive<\/span><\/td><td>oder<\/td><\/tr><tr><td>Zeitfolge<\/td><td><span class=\"la\">deinde<\/span>, <span class=\"la\">tum<\/span>, <span class=\"la\">postea<\/span>, <span class=\"la\">denique<\/span>, <span class=\"la\">tandem<\/span><\/td><td>dann, darauf, später, schließlich, endlich<\/td><\/tr><tr><td>Einschränkung<\/td><td><span class=\"la\">quidem<\/span><\/td><td>zwar, freilich, jedenfalls<\/td><\/tr><\/table><\/div>\n<p>Das angehängte <span class=\"la\">-que<\/span> verbindet mit dem Wort <b>davor<\/b>: <span class=\"la\">senatus populusque<\/span> heißt „Senat und Volk“.<\/p>\n<h3>Zweiteilige Verbindungen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">et … et<\/span><\/td><td>sowohl … als auch<\/td><\/tr><tr><td><span class=\"la\">aut … aut<\/span><\/td><td>entweder … oder<\/td><\/tr><tr><td><span class=\"la\">neque … neque<\/span> (<span class=\"la\">nec … nec<\/span>)<\/td><td>weder … noch<\/td><\/tr><tr><td><span class=\"la\">non solum … sed etiam<\/span><\/td><td>nicht nur … sondern auch<\/td><\/tr><tr><td><span class=\"la\">ne … quidem<\/span><\/td><td>nicht einmal (das betonte Wort steht dazwischen)<\/td><\/tr><tr><td><span class=\"la\">cum … tum<\/span><\/td><td>sowohl … als auch besonders<\/td><\/tr><tr><td><span class=\"la\">tam … quam<\/span><\/td><td>so … wie<\/td><\/tr><tr><td><span class=\"la\">tantus … quantus<\/span><\/td><td>so groß … wie<\/td><\/tr><tr><td><span class=\"la\">talis … qualis<\/span><\/td><td>so beschaffen … wie<\/td><\/tr><tr><td><span class=\"la\">tot … quot<\/span><\/td><td>so viele … wie<\/td><\/tr><tr><td><span class=\"la\">alii … alii<\/span><\/td><td>die einen … die anderen<\/td><\/tr><\/table><\/div>\n<h3>Zum Verwechseln ähnlich<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wort<\/th><th>Bedeutung<\/th><th>Wort<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">tamen<\/span><\/td><td>dennoch<\/td><td><span class=\"la\">tandem<\/span><\/td><td>endlich<\/td><\/tr><tr><td><span class=\"la\">quidem<\/span><\/td><td>zwar, freilich<\/td><td><span class=\"la\">quidam<\/span><\/td><td>ein gewisser<\/td><\/tr><tr><td><span class=\"la\">quondam<\/span><\/td><td>einst<\/td><td><span class=\"la\">quoniam<\/span><\/td><td>weil ja<\/td><\/tr><tr><td><span class=\"la\">ita<\/span><\/td><td>so<\/td><td><span class=\"la\">itaque<\/span><\/td><td>daher<\/td><\/tr><tr><td><span class=\"la\">item<\/span><\/td><td>ebenso<\/td><td><span class=\"la\">iterum<\/span><\/td><td>wiederum, zum zweiten Mal<\/td><\/tr><tr><td><span class=\"la\">iam<\/span><\/td><td>schon, nun<\/td><td><span class=\"la\">etiam<\/span><\/td><td>auch, sogar<\/td><\/tr><tr><td><span class=\"la\">autem<\/span><\/td><td>aber<\/td><td><span class=\"la\">aut<\/span><\/td><td>oder<\/td><\/tr><tr><td><span class=\"la\">statim<\/span><\/td><td>sofort<\/td><td><span class=\"la\">satis<\/span><\/td><td>genug<\/td><\/tr><tr><td><span class=\"la\">diu<\/span><\/td><td>lange<\/td><td><span class=\"la\">dum<\/span><\/td><td>während, solange<\/td><\/tr><tr><td><span class=\"la\">olim<\/span><\/td><td>einst<\/td><td><span class=\"la\">solum<\/span><\/td><td>nur; der Boden<\/td><\/tr><tr><td><span class=\"la\">fere<\/span><\/td><td>fast, ungefähr<\/td><td><span class=\"la\">fort
