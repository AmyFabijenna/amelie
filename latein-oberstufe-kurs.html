s":"<span class=\"la\">quibus<\/span>. Dativ und Ablativ Plural sind gleich."},{"type":"mc","q":"Was bedeutet <span class=\"la\">Caesar ipse milites ducit.<\/span>?","s":"<span class=\"la\">ipse<\/span> heißt „selbst“, „persönlich“. „Derselbe“ wäre <span class=\"la\">idem<\/span>. Die beiden werden oft verwechselt.","o":["Caesar selbst führt die Soldaten.","Derselbe Caesar führt die Soldaten.","Dieser Caesar führt die Soldaten.","Caesar führt dieselben Soldaten."]},{"type":"mc","q":"Welche Form ist <span class=\"la\">totius<\/span>?","h":"<span class=\"la\">totus<\/span> gehört zu den Pronominaladjektiven.","s":"Pronominaladjektive haben den Genitiv Singular auf <span class=\"la\">-ius<\/span>: <span class=\"la\">totius Galliae<\/span> (ganz Galliens). Mit einem Komparativ auf <span class=\"la\">-ius<\/span> hat das nichts zu tun.","o":["Genitiv Singular von <span class=\"la\">totus<\/span>","Nominativ Singular maskulin im Komparativ","Akkusativ Singular Neutrum im Komparativ","Adverb im Komparativ"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">quidam philosophus<\/span>?","s":"<span class=\"la\">quidam<\/span> führt jemanden ein, der nicht näher benannt wird: „ein gewisser“, oft einfach „ein“. „Jeder“ wäre <span class=\"la\">quisque<\/span>, „derselbe“ <span class=\"la\">idem<\/span>.","o":["ein gewisser Philosoph","jeder Philosoph","derselbe Philosoph","kein Philosoph"]},{"type":"self","q":"Übersetze: <span class=\"la\">Haec verba illum virum non movent.<\/span> (verbum = Wort; movere = bewegen, beeindrucken)","s":"„Diese Worte beeindrucken jenen Mann nicht.“ <span class=\"la\">haec<\/span> ist hier Nominativ Plural Neutrum und gehört zu <span class=\"la\">verba<\/span>; <span class=\"la\">illum<\/span> ist Akkusativ Singular maskulin und gehört zu <span class=\"la\">virum<\/span>."}],"gen":["pron"],"html":"<h3>Das gemeinsame Muster<\/h3>\n<p>Fast alle Pronomen haben zwei Sonderendungen, die für alle drei Geschlechter gelten:<\/p>\n<div class=\"formula\">Genitiv Singular auf <b><span class=\"la\">-ius<\/span><\/b> – Dativ Singular auf <b><span class=\"la\">-i<\/span><\/b><\/div>\n<p>Wenn du das einmal weißt, sind die Tabellen halb gelernt: <span class=\"la\">eius, huius, illius, cuius<\/span> und <span class=\"la\">ei, huic, illi, cui<\/span>.<\/p>\n<h3>is, ea, id<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>m.<\/th><th>f.<\/th><th>n.<\/th><th>m. Pl.<\/th><th>f. Pl.<\/th><th>n. Pl.<\/th><\/tr><tr><td>Nom.<\/td><td>is<\/td><td>ea<\/td><td>id<\/td><td>ei (ii)<\/td><td>eae<\/td><td>ea<\/td><\/tr><tr><td>Gen.<\/td><td>eius<\/td><td>eius<\/td><td>eius<\/td><td>eorum<\/td><td>earum<\/td><td>eorum<\/td><\/tr><tr><td>Dat.<\/td><td>ei<\/td><td>ei<\/td><td>ei<\/td><td>eis (iis)<\/td><td>eis (iis)<\/td><td>eis (iis)<\/td><\/tr><tr><td>Akk.<\/td><td>eum<\/td><td>eam<\/td><td>id<\/td><td>eos<\/td><td>eas<\/td><td>ea<\/td><\/tr><tr><td>Abl.<\/td><td>eo<\/td><td>ea<\/td><td>eo<\/td><td>eis (iis)<\/td><td>eis (iis)<\/td><td>eis (iis)<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">is<\/span> hat drei Aufgaben: als Personalpronomen der dritten Person (er, sie, es; <span class=\"la\">eum<\/span> ihn), als schwaches Demonstrativpronomen (dieser, der) und als Vorbote eines Relativsatzes (<span class=\"la\">is, qui<\/span> … derjenige, der …).<\/p>\n<h3>hic und ille<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>m.<\/th><th>f.<\/th><th>n.<\/th><th>m. Pl.<\/th><th>f. Pl.<\/th><th>n. Pl.<\/th><\/tr><tr><td>Nom.<\/td><td>hic<\/td><td>haec<\/td><td>hoc<\/td><td>hi<\/td><td>hae<\/td><td>haec<\/td><\/tr><tr><td>Gen.<\/td><td>huius<\/td><td>huius<\/td><td>huius<\/td><td>horum<\/td><td>harum<\/td><td>horum<\/td><\/tr><tr><td>Dat.<\/td><td>huic<\/td><td>huic<\/td><td>huic<\/td><td>his<\/td><td>his<\/td><td>his<\/td><\/tr><tr><td>Akk.<\/td><td>hunc<\/td><td>hanc<\/td><td>hoc<\/td><td>hos<\/td><td>has<\/td><td>haec<\/td><\/tr><tr><td>Abl.<\/td><td>hoc<\/td><td>hac<\/td><td>hoc<\/td><td>his<\/td><td>his<\/td><td>his<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">ille, illa, illud<\/span> geht regelmäßig: <span class=\"la\">illius, illi, illum, illam, illud, illo, illa<\/span>; Plural <span class=\"la\">illi, illae, illa, illorum, illis, illos, illas<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Pronomen<\/th><th>Bedeutung<\/th><th>Besonderheit<\/th><\/tr><tr><td><span class=\"la\">hic, haec, hoc<\/span><\/td><td>dieser (hier)<\/td><td>das Nähere, zuletzt Genannte, „der folgende“<\/td><\/tr><tr><td><span class=\"la\">ille, illa, illud<\/span><\/td><td>jener (dort)<\/td><td>das Fernere, früher Genannte; auch „jener berühmte“<\/td><\/tr><tr><td><span class=\"la\">iste, ista, istud<\/span><\/td><td>der da<\/td><td>oft abwertend, vor Gericht für den Gegner<\/td><\/tr><tr><td><span class=\"la\">ipse, ipsa, ipsum<\/span><\/td><td>selbst, persönlich<\/td><td>hebt hervor: <span class=\"la\">Caesar ipse<\/span> – Caesar selbst<\/td><\/tr><tr><td><span class=\"la\">idem, eadem, idem<\/span><\/td><td>derselbe<\/td><td><span class=\"la\">is<\/span> + <span class=\"la\">-dem<\/span>: <span class=\"la\">eiusdem<\/span>, <span class=\"la\">eundem<\/span>, <span class=\"la\">eodem<\/span><\/td><\/tr><\/table><\/div>\n<h3>Das Relativpronomen qui, quae, quod<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>m.<\/th><th>f.<\/th><th>n.<\/th><th>m. Pl.<\/th><th>f. Pl.<\/th><th>n. Pl.<\/th><\/tr><tr><td>Nom.<\/td><td>qui<\/td><td>quae<\/td><td>quod<\/td><td>qui<\/td><td>quae<\/td><td>quae<\/td><\/tr><tr><td>Gen.<\/td><td>cuius<\/td><td>cuius<\/td><td>cuius<\/td><td>quorum<\/td><td>quarum<\/td><td>quorum<\/td><\/tr><tr><td>Dat.<\/td><td>cui<\/td><td>cui<\/td><td>cui<\/td><td>quibus<\/td><td>quibus<\/td><td>quibus<\/td><\/tr><tr><td>Akk.<\/td><td>quem<\/td><td>quam<\/td><td>quod<\/td><td>quos<\/td><td>quas<\/td><td>quae<\/td><\/tr><tr><td>Abl.<\/td><td>quo<\/td><td>qua<\/td><td>quo<\/td><td>quibus<\/td><td>quibus<\/td><td>quibus<\/td><\/tr><\/table><\/div>\n<p>Wie das Relativpronomen im Satz arbeitet, erklärt das Kapitel über Relativsätze.<\/p>\n<h3>Fragepronomen<\/h3>\n<p><span class=\"la\">quis?<\/span> (wer?) und <span class=\"la\">quid?<\/span> (was?) stehen allein. Die übrigen Formen gleichen dem Relativpronomen: <span class=\"la\">cuius?<\/span> (wessen?), <span class=\"la\">cui?<\/span> (wem?), <span class=\"la\">quem?<\/span> (wen?). Als Begleiter eines Substantivs verwendet man <span class=\"la\">qui, quae, quod<\/span>: <span class=\"la\">Quem librum legis?<\/span> – Welches Buch liest du?<\/p>\n<h3>Unbestimmte Pronomen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Pronomen<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">aliquis, aliquid<\/span><\/td><td>irgendjemand, irgendetwas<\/td><\/tr><tr><td><span class=\"la\">quidam, quaedam, quoddam<\/span><\/td><td>ein gewisser, ein bestimmter; Plural: einige<\/td><\/tr><tr><td><span class=\"la\">quisque, quidque<\/span><\/td><td>jeder (Einzelne)<\/td><\/tr><tr><td><span class=\"la\">quisquam, quidquam<\/span><\/td><td>irgendjemand (in verneinten Sätzen)<\/td><\/tr><tr><td><span class=\"la\">nemo<\/span> / <span class=\"la\">nihil<\/span><\/td><td>niemand / nichts<\/td><\/tr><\/table><\/div>\n<p>Nach <span class=\"la\">si, nisi, ne, num<\/span> fällt <span class=\"la\">ali-<\/span> weg: <span class=\"la\">si quis<\/span> heißt „wenn jemand“.<\/p>\n<h3>Pronominaladjektive<\/h3>\n<p>Diese Wörter gehen wie <span class=\"la\">magnus<\/span>, haben aber Genitiv Singular auf <span class=\"la\">-ius<\/span> und Dativ Singular auf <span class=\"la\">-i<\/span>: <span class=\"la\">unus<\/span> (einer), <span class=\"la\">solus<\/span> (allein), <span class=\"la\">totus<\/span> (ganz), <span class=\"la\">ullus<\/span> (irgendein), <span class=\"la\">nullus<\/span> (kein), <span class=\"la\">alius<\/span> (ein anderer), <span class=\"la\">alter<\/span> (der andere von zweien), <span class=\"la\">uter<\/span> (welcher von beiden), <span class=\"la\">neuter<\/span> (keiner von beiden). Also <span class=\"la\">totius urbis<\/span> (der ganzen Stadt) und <span class=\"la\">nulli homini<\/span> (keinem Menschen).<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Pronomen im Satz bestimmen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Huic viro omnes credunt, illi nemo.<\/span> (credere + Dativ = glauben, vertrauen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">credunt<\/span> (sie glauben). Subjekt: <span class=\"la\">omnes<\/span> (alle).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">credere<\/span> verlangt den Dativ. <span class=\"la\">huic viro<\/span>: <span class=\"la\">huic<\/span> ist Dativ Singular von <span class=\"la\">hic<\/span> und passt zu <span class=\"la\">viro<\/span>: „diesem Mann“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweiter Teil: <span class=\"la\">illi nemo<\/span>. Das Prädikat fehlt und wird aus dem ersten Teil ergänzt: <span class=\"la\">credit<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">illi<\/span> ist Dativ Singular von <span class=\"la\">ille<\/span> (nicht Nominativ Plural, denn Subjekt ist <span class=\"la\">nemo<\/span>): „jenem“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Diesem Mann glauben alle, jenem niemand.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"zahl","t":"Zahlwörter, römische Zahlen und Zeitangaben","kl":"1","k":1,"a":"F","tag":"Basis","goals":["Grund- und Ordnungszahlen erkennen und übersetzen","die deklinierten Formen von unus, duo, tres und milia verwenden","römische Zahlzeichen lesen und schreiben","römische Jahres- und Tagesangaben verstehen"],"ex":[{"type":"num","a":14.0,"q":"Welche Zahl ist XIV?","s":"X = 10, IV = 4 (eins vor fünf wird abgezogen). Zusammen 14."},{"type":"num","a":1789.0,"q":"Welche Jahreszahl ist MDCCLXXXIX?","s":"M = 1000, DCC = 700, LXXX = 80, IX = 9. Zusammen 1789."},{"type":"txt","a":["XCIX"],"q":"Schreibe 99 als römische Zahl.","h":"99 = 90 + 9. Jede Stelle wird für sich geschrieben.","s":"90 = XC, 9 = IX, also XCIX. Die Schreibung IC ist nicht erlaubt, weil I nur vor V und X abgezogen werden darf."},{"type":"mc","q":"Was bedeutet <span class=\"la\">duodeviginti<\/span>?","s":"Wörtlich „zwei von zwanzig“, also 18. Ebenso <span class=\"la\">undeviginti<\/span> = 19.","o":["achtzehn","zweiundzwanzig","zwölf","zwanzig"]},{"type":"mc","q":"Wie sagt man „viertausend Soldaten“?","h":"<span class=\"la\">milia<\/span> ist ein Substantiv.","s":"Nach <span class=\"la\">milia<\/span> steht der Genitiv: „vier Tausende von Soldaten“. Bei <span class=\"la\">mille<\/span> (eintausend) steht dagegen der gleiche Fall: <span class=\"la\">mille milites<\/span>.","o":["quattuor milia militum","quattuor mille milites","quattuor milia milites","quartus mille militum"]},{"type":"mc","q":"Auf welchen Tag fallen die Iden des März?","s":"Im März, Mai, Juli und Oktober liegen die Iden am 15., sonst am 13. An den Iden des März 44 v. Chr. wurde Caesar ermordet.","o":["auf den 15. März","auf den 13. März","auf den 1. März","auf den 7. März"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">tertio anno<\/span>?","s":"Ablativ der Zeit auf die Frage „wann?“, mit der Ordnungszahl <span class=\"la\">tertius<\/span>. „Drei Jahre lang“ wäre der Akkusativ <span class=\"la\">tres annos<\/span>.","o":["im dritten Jahr","drei Jahre lang","nach drei Jahren","vor drei Jahren"]},{"type":"txt","a":["trium"],"q":"Bilde den Genitiv von <span class=\"la\">tres<\/span>.","s":"<span class=\"la\">trium<\/span>, wie bei den i-Stämmen: <span class=\"la\">trium annorum<\/span> (von drei Jahren)."}],"gen":["rom"],"html":"<h3>Grundzahlen und Ordnungszahlen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zahl<\/th><th>Grundzahl<\/th><th>Ordnungszahl<\/th><th>Zahl<\/th><th>Grundzahl<\/th><th>Ordnungszahl<\/th><\/tr><tr><td>1<\/td><td>unus, una, unum<\/td><td>primus<\/td><td>11<\/td><td>undecim<\/td><td>undecimus<\/td><\/tr><tr><td>2<\/td><td>duo, duae, duo<\/td><td>secundus<\/td><td>12<\/td><td>duodecim<\/td><td>duodecimus<\/td><\/tr><tr><td>3<\/td><td>tres, tria<\/td><td>tertius<\/td><td>20<\/td><td>viginti<\/td><td>vicesimus<\/td><\/tr><tr><td>4<\/td><td>quattuor<\/td><td>quartus<\/td><td>30<\/td><td>triginta<\/td><td>tricesimus<\/td><\/tr><tr><td>5<\/td><td>quinque<\/td><td>quintus<\/td><td>50<\/td><td>quinquaginta<\/td><td>quinquagesimus<\/td><\/tr><tr><td>6<\/td><td>sex<\/td><td>sextus<\/td><td>100<\/td><td>centum<\/td><td>centesimus<\/td><\/tr><tr><td>7<\/td><td>septem<\/td><td>septimus<\/td><td>200<\/td><td>ducenti, -ae, -a<\/td><td>ducentesimus<\/td><\/tr><tr><td>8<\/td><td>octo<\/td><td>octavus<\/td><td>500<\/td><td>quingenti, -ae, -a<\/td><td>quingentesimus<\/td><\/tr><tr><td>9<\/td><td>novem<\/td><td>nonus<\/td><td>1000<\/td><td>mille<\/td><td>millesimus<\/td><\/tr><tr><td>10<\/td><td>decem<\/td><td>decimus<\/td><td>2000<\/td><td>duo milia<\/td><td>–<\/td><\/tr><\/table><\/div>\n<p>18 und 19 werden durch Abziehen gebildet: <span class=\"la\">duodeviginti<\/span> (zwei von zwanzig) und <span class=\"la\">undeviginti<\/span> (eins von zwanzig).<\/p>\n<p><b>Dekliniert<\/b> werden nur 1, 2, 3, die Hunderter ab 200 und der Plural <span class=\"la\">milia<\/span>. Alle anderen Grundzahlen sind unveränderlich. Ordnungszahlen gehen wie <span class=\"la\">magnus<\/span>.<\/p>\n<ul><li><span class=\"la\">unus<\/span> wie ein Pronominaladjektiv: <span class=\"la\">unius<\/span>, <span class=\"la\">uni<\/span><\/li><li><span class=\"la\">duo<\/span>: <span class=\"la\">duorum/duarum<\/span>, <span class=\"la\">duobus/duabus<\/span>, <span class=\"la\">duos/duas<\/span><\/li><li><span class=\"la\">tres, tria<\/span>: <span class=\"la\">trium<\/span>, <span class=\"la\">tribus<\/span>, <span class=\"la\">tres/tria<\/span><\/li><li><span class=\"la\">mille<\/span> ist unveränderlich (<span class=\"la\">mille milites<\/span>). Der Plural <span class=\"la\">milia<\/span> ist ein Substantiv und hat den <b>Genitiv<\/b> bei sich: <span class=\"la\">tria milia militum<\/span> – dreitausend Soldaten, wörtlich „drei Tausende von Soldaten“.<\/li><\/ul>\n<h3>Römische Zahlzeichen<\/h3>\n<div class=\"formula\">I = 1 – V = 5 – X = 10 – L = 50 – C = 100 – D = 500 – M = 1000<\/div>\n<p>Regeln: Gleiche Zeichen nebeneinander werden addiert, höchstens drei Mal (III = 3, XXX = 30). Ein kleineres Zeichen <b>rechts<\/b> wird addiert (VI = 6, LX = 60). Ein kleineres Zeichen <b>links<\/b> wird abgezogen, erlaubt sind nur IV, IX, XL, XC, CD, CM.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Römische Zahl lesen und schreiben<\/h4><div class=\"task\">Lies MCMXLVIII und schreibe 2026 als römische Zahl.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zerlege von links in Blöcke: M – CM – XL – VIII.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>M = 1000. CM = 900 (100 vor 1000 wird abgezogen). XL = 40. VIII = 8.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Summe: 1000 + 900 + 40 + 8 = 1948.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Umgekehrt für 2026: Zerlege in Tausender, Hunderter, Zehner, Einer: 2000 + 0 + 20 + 6.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>2000 = MM, 20 = XX, 6 = VI. Zusammen: MMXXVI.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Jahre und Tage bei den Römern<\/h3>\n<p><b>Jahre<\/b> werden auf zwei Arten angegeben: nach den beiden Konsuln des Jahres (<span class=\"la\">Cicerone et Antonio consulibus<\/span> – unter dem Konsulat von Cicero und Antonius, also 63 v. Chr.) oder seit der Gründung Roms, <span class=\"la\">ab urbe condita<\/span> (a. u. c.), die man auf 753 v. Chr. legte.<\/p>\n<p><b>Tage<\/b> zählte man auf drei feste Tage im Monat hin: die <span class=\"la\">Kalendae<\/span> (der 1.), die <span class=\"la\">Nonae<\/span> (der 5., im März, Mai, Juli und Oktober der 7.) und die <span class=\"la\">Idus<\/span> (der 13., in denselben vier Monaten der 15.). Die berühmten <span class=\"la\">Idus Martiae<\/span>, an denen Caesar ermordet wurde, sind also der 15. März. Von <span class=\"la\">Kalendae<\/span> kommt unser Wort Kalender.<\/p>\n<p>Die Monatsnamen September bis Dezember enthalten die Zahlen 7 bis 10, weil das römische Jahr ursprünglich im März begann.<\/p>\n<p><b>Zeitangaben im Satz:<\/b> Auf die Frage „wann?“ steht der Ablativ (<span class=\"la\">tertio die<\/span> – am dritten Tag), auf die Frage „wie lange?“ der Akkusativ (<span class=\"la\">tres dies<\/span> – drei Tage lang).<\/p>"},{"id":"verb1","t":"Das Verb im Präsensstamm: Präsens, Imperfekt, Futur I","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die fünf Konjugationsklassen am Infinitiv und an der 1. Person erkennen","Präsens, Imperfekt und Futur I im Aktiv bilden","Tempuskennzeichen von Stamm und Personalendung trennen","Imperfekt und Präsens im Deutschen treffend wiedergeben"],"ex":[{"type":"txt","a":["laudabamus"],"q":"Bilde von <span class=\"la\">laudare<\/span>: 1. Person Plural Imperfekt Aktiv.","s":"<span class=\"la\">lauda-ba-mus<\/span> (wir lobten)."},{"type":"txt","a":["regent"],"q":"Bilde von <span class=\"la\">regere<\/span>: 3. Person Plural Futur I Aktiv.","s":"<span class=\"la\">reg-e-nt<\/span> (sie werden lenken). Im Präsens hieße es <span class=\"la\">regunt<\/span>."},{"type":"txt","a":["monebit"],"q":"Bilde von <span class=\"la\">monere<\/span>: 3. Person Singular Futur I Aktiv.","s":"<span class=\"la\">mone-bi-t<\/span> (er wird mahnen). Die a- und die e-Konjugation bilden das Futur mit <span class=\"la\">-b-<\/span>."},{"type":"txt","a":["capiunt"],"q":"Bilde von <span class=\"la\">capere<\/span> (capio): 3. Person Plural Präsens Aktiv.","s":"<span class=\"la\">capiunt<\/span> (sie fangen). Die gemischte Konjugation hat hier das i wie <span class=\"la\">audiunt<\/span>."},{"type":"mc","q":"Welche Zeit ist <span class=\"la\">videt<\/span> (videre, video = sehen)?","h":"Zu welcher Konjugation gehört ein Verb mit der 1. Person auf <span class=\"la\">-eo<\/span>?","s":"<span class=\"la\">videre<\/span> gehört zur e-Konjugation, <span class=\"la\">-et<\/span> ist dort Präsens: „er sieht“. Das Futur wäre <span class=\"la\">videbit<\/span>.","o":["Präsens","Futur I","Imperfekt","Perfekt"]},{"type":"mc","q":"Welche Zeit ist <span class=\"la\">mittet<\/span> (mittere, mitto = schicken)?","s":"<span class=\"la\">mittere<\/span> gehört zur konsonantischen Konjugation, <span class=\"la\">-et<\/span> ist dort Futur: „er wird schicken“. Das Präsens wäre <span class=\"la\">mittit<\/span>.","o":["Futur I","Präsens","Imperfekt","Konjunktiv Imperfekt"]},{"type":"txt","a":["erant"],"q":"Bilde von <span class=\"la\">esse<\/span>: 3. Person Plural Imperfekt.","s":"<span class=\"la\">erant<\/span> (sie waren)."},{"type":"self","q":"Übersetze: <span class=\"la\">Romani saepe cum hostibus pugnabant, sed numquam desperabant.<\/span> (pugnare = kämpfen; desperare = verzweifeln)","s":"„Die Römer kämpften oft mit den Feinden, aber sie verzweifelten nie.“ Beide Prädikate stehen im Imperfekt, das hier eine wiederholte Handlung in der Vergangenheit beschreibt."}],"gen":["konj","best"],"html":"<h3>Wie eine Verbform gebaut ist<\/h3>\n<p>Jede Form besteht aus drei Bausteinen: <b>Stamm<\/b> (Bedeutung), <b>Kennzeichen<\/b> (Tempus und Modus) und <b>Personalendung<\/b> (Person und Zahl). In <span class=\"la\">lauda-ba-mus<\/span> steckt: loben – Imperfekt – wir. Wer diese Bausteine sieht, muss keine Tabellen raten.<\/p>\n<p>Die Personalendungen im Aktiv sind in fast allen Zeiten gleich:<\/p>\n<div class=\"formula\"><span class=\"la\">-o<\/span> oder <span class=\"la\">-m<\/span> (ich) – <span class=\"la\">-s<\/span> (du) – <span class=\"la\">-t<\/span> (er, sie, es) – <span class=\"la\">-mus<\/span> (wir) – <span class=\"la\">-tis<\/span> (ihr) – <span class=\"la\">-nt<\/span> (sie)<\/div>\n<h3>Die Konjugationsklassen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Klasse<\/th><th>Infinitiv<\/th><th>1. Person Sg.<\/th><th>Stammauslaut<\/th><\/tr><tr><td>a-Konjugation<\/td><td><span class=\"la\">laud<b class=\"e\">are<\/b><\/span><\/td><td><span class=\"la\">laudo<\/span><\/td><td>-a-<\/td><\/tr><tr><td>e-Konjugation<\/td><td><span class=\"la\">mon<b class=\"e\">ere<\/b><\/span> (langes e, betont)<\/td><td><span class=\"la\">mon<b class=\"e\">eo<\/b><\/span><\/td><td>-e-<\/td><\/tr><tr><td>konsonantische Konjugation<\/td><td><span class=\"la\">reg<b class=\"e\">ere<\/b><\/span> (kurzes e, unbetont)<\/td><td><span class=\"la\">rego<\/span><\/td><td>Konsonant<\/td><\/tr><tr><td>i-Konjugation<\/td><td><span class=\"la\">aud<b class=\"e\">ire<\/b><\/span><\/td><td><span class=\"la\">aud<b class=\"e\">io<\/b><\/span><\/td><td>-i-<\/td><\/tr><tr><td>gemischte Konjugation<\/td><td><span class=\"la\">cap<b class=\"e\">ere<\/b><\/span><\/td><td><span class=\"la\">cap<b class=\"e\">io<\/b><\/span><\/td><td>kurzes -i-<\/td><\/tr><\/table><\/div>\n<p>Die e-Konjugation und die konsonantische Konjugation haben beide den Infinitiv auf <span class=\"la\">-ere<\/span>. Unterscheiden kannst du sie an der 1. Person: <span class=\"la\">moneo<\/span> gegen <span class=\"la\">rego<\/span>. Deshalb lernst du Verben immer mit dieser Form. Die gemischte Konjugation sieht im Infinitiv aus wie <span class=\"la\">regere<\/span>, hat aber in vielen Formen ein i wie <span class=\"la\">audire<\/span>.<\/p>\n<h3>Präsens<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>a<\/th><th>e<\/th><th>kons.<\/th><th>i<\/th><th>gemischt<\/th><\/tr><tr><td>ich<\/td><td>laud<b class=\"e\">o<\/b><\/td><td>mone<b class=\"e\">o<\/b><\/td><td>reg<b class=\"e\">o<\/b><\/td><td>audi<b class=\"e\">o<\/b><\/td><td>capi<b class=\"e\">o<\/b><\/td><\/tr><tr><td>du<\/td><td>lauda<b class=\"e\">s<\/b><\/td><td>mone<b class=\"e\">s<\/b><\/td><td>reg<b class=\"e\">is<\/b><\/td><td>audi<b class=\"e\">s<\/b><\/td><td>cap<b class=\"e\">is<\/b><\/td><\/tr><tr><td>er<\/td><td>lauda<b class=\"e\">t<\/b><\/td><td>mone<b class=\"e\">t<\/b><\/td><td>reg<b class=\"e\">it<\/b><\/td><td>audi<b class=\"e\">t<\/b><\/td><td>cap<b class=\"e\">it<\/b><\/td><\/tr><tr><td>wir<\/td><td>lauda<b class=\"e\">mus<\/b><\/td><td>mone<b class=\"e\">mus<\/b><\/td><td>reg<b class=\"e\">imus<\/b><\/td><td>audi<b class=\"e\">mus<\/b><\/td><td>cap<b class=\"e\">imus<\/b><\/td><\/tr><tr><td>ihr<\/td><td>lauda<b class=\"e\">tis<\/b><\/td><td>mone<b class=\"e\">tis<\/b><\/td><td>reg<b class=\"e\">itis<\/b><\/td><td>audi<b class=\"e\">tis<\/b><\/td><td>cap<b class=\"e\">itis<\/b><\/td><\/tr><tr><td>sie<\/td><td>lauda<b class=\"e\">nt<\/b><\/td><td>mone<b class=\"e\">nt<\/b><\/td><td>reg<b class=\"e\">unt<\/b><\/td><td>audi<b class=\"e\">unt<\/b><\/td><td>capi<b class=\"e\">unt<\/b><\/td><\/tr><\/table><\/div>\n<h3>Imperfekt: Kennzeichen -ba-<\/h3>\n<p><span class=\"la\">lauda<b class=\"e\">ba<\/b>m, lauda<b class=\"e\">ba<\/b>s, lauda<b class=\"e\">ba<\/b>t, lauda<b class=\"e\">ba<\/b>mus, lauda<b class=\"e\">ba<\/b>tis, lauda<b class=\"e\">ba<\/b>nt<\/span>. Ebenso <span class=\"la\">mone<b class=\"e\">ba<\/b>m<\/span>. Bei den drei anderen Klassen steht ein e davor: <span class=\"la\">reg<b class=\"e\">eba<\/b>m<\/span>, <span class=\"la\">audi<b class=\"e\">eba<\/b>m<\/span>, <span class=\"la\">capi<b class=\"e\">eba<\/b>m<\/span>.<\/p>\n<h3>Futur I: zwei verschiedene Bildungen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>a- und e-Konjugation: Kennzeichen -b-<\/th><th>kons., i- und gemischte Konjugation: Kennzeichen -a-/-e-<\/th><\/tr><tr><td>lauda<b class=\"e\">bo<\/b>, lauda<b class=\"e\">bis<\/b>, lauda<b class=\"e\">bit<\/b><\/td><td>reg<b class=\"e\">am<\/b>, reg<b class=\"e\">es<\/b>, reg<b class=\"e\">et<\/b><\/td><\/tr><tr><td>lauda<b class=\"e\">bimus<\/b>, lauda<b class=\"e\">bitis<\/b>, lauda<b class=\"e\">bunt<\/b><\/td><td>reg<b class=\"e\">emus<\/b>, reg<b class=\"e\">etis<\/b>, reg<b class=\"e\">ent<\/b><\/td><\/tr><tr><td>mone<b class=\"e\">bo<\/b>, mone<b class=\"e\">bis<\/b> …<\/td><td>audi<b class=\"e\">am<\/b>, audi<b class=\"e\">es<\/b> … capi<b class=\"e\">am<\/b>, capi<b class=\"e\">es<\/b> …<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Die tückischste Stelle der ganzen Formenlehre: <span class=\"la\">mon<b class=\"e\">et<\/b><\/span> ist Präsens (e-Konjugation), <span class=\"la\">reg<b class=\"e\">et<\/b><\/span> ist Futur (konsonantische Konjugation). Dieselbe Endung, verschiedene Zeiten. Entscheiden kannst du nur, wenn du die Konjugationsklasse des Verbs kennst. Im Zweifel hilft das Wörterbuch: Steht dort <span class=\"la\">-eo<\/span>, ist <span class=\"la\">-et<\/span> Präsens.<\/div>\n<h3>esse<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Präsens<\/th><th>Imperfekt<\/th><th>Futur I<\/th><\/tr><tr><td>ich<\/td><td>sum<\/td><td>eram<\/td><td>ero<\/td><\/tr><tr><td>du<\/td><td>es<\/td><td>eras<\/td><td>eris<\/td><\/tr><tr><td>er<\/td><td>est<\/td><td>erat<\/td><td>erit<\/td><\/tr><tr><td>wir<\/td><td>sumus<\/td><td>eramus<\/td><td>erimus<\/td><\/tr><tr><td>ihr<\/td><td>estis<\/td><td>eratis<\/td><td>eritis<\/td><\/tr><tr><td>sie<\/td><td>sunt<\/td><td>erant<\/td><td>erunt<\/td><\/tr><\/table><\/div>\n<h3>Die Zeiten richtig übersetzen<\/h3>\n<ul><li><b>Präsens:<\/b> Gegenwart. In Erzählungen steht es oft für Vergangenes (historisches Präsens), um die Handlung lebendig zu machen. Du darfst es mit Präsens oder Präteritum übersetzen, musst aber innerhalb eines Abschnitts einheitlich bleiben.<\/li><li><b>Imperfekt:<\/b> die Vergangenheit als Hintergrund. Es beschreibt Zustände, andauernde oder wiederholte Handlungen und Versuche. Übersetze mit Präteritum und setze, wenn es passt, „immer wieder“, „gerade“ oder „versuchte zu“ dazu.<\/li><li><b>Futur I:<\/b> Zukunft. Im Deutschen reicht oft das Präsens mit einer Zeitangabe, in der Prüfung ist „wird … tun“ die sichere Wahl.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Verbform zerlegen<\/h4><div class=\"task\">Bestimme und übersetze <span class=\"la\">ducebatis<\/span> und <span class=\"la\">ducetis<\/span> (ducere, duco = führen).<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Beide Formen enden auf <span class=\"la\">-tis<\/span>: 2. Person Plural, „ihr“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">duc-eba-tis<\/span>: Stamm <span class=\"la\">duc-<\/span>, Kennzeichen <span class=\"la\">-eba-<\/span>, also Imperfekt: „ihr führtet“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">duc-e-tis<\/span>: <span class=\"la\">ducere<\/span> gehört zur konsonantischen Konjugation (1. Person <span class=\"la\">duco<\/span>, nicht <span class=\"la\">duceo<\/span>). Dort ist <span class=\"la\">-e-<\/span> das Kennzeichen des Futurs: „ihr werdet führen“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Gegenprobe: Das Präsens hieße <span class=\"la\">ducitis<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"verb2","t":"Der Perfektstamm: Perfekt, Plusquamperfekt, Futur II","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die Arten der Perfektbildung erkennen","Perfekt, Plusquamperfekt und Futur II im Aktiv bilden","die Stammformen eines Verbs lesen und nutzen","Perfekt und Imperfekt in der Erzählung unterscheiden"],"ex":[{"type":"txt","a":["misit"],"q":"Bilde von <span class=\"la\">mittere, mitto, misi, missum<\/span>: 3. Person Singular Perfekt Aktiv.","s":"Perfektstamm <span class=\"la\">mis-<\/span> und Endung <span class=\"la\">-it<\/span>: <span class=\"la\">misit<\/span> (er schickte, er hat geschickt)."},{"type":"txt","a":["dixerunt"],"q":"Bilde von <span class=\"la\">dicere, dico, dixi, dictum<\/span>: 3. Person Plural Perfekt Aktiv.","s":"Perfektstamm <span class=\"la\">dix-<\/span> und Endung <span class=\"la\">-erunt<\/span>: <span class=\"la\">dixerunt<\/span> (sie sagten). Die Kurzform wäre <span class=\"la\">dixere<\/span>."},{"type":"txt","a":["ceperamus"],"q":"Bilde von <span class=\"la\">capere, capio, cepi, captum<\/span>: 1. Person Plural Plusquamperfekt Aktiv.","s":"Perfektstamm <span class=\"la\">cep-<\/span> und Endung <span class=\"la\">-eramus<\/span>: <span class=\"la\">ceperamus<\/span> (wir hatten gefangen)."},{"type":"txt","a":["veneris"],"q":"Bilde von <span class=\"la\">venire, venio, veni, ventum<\/span>: 2. Person Singular Futur II Aktiv.","s":"Perfektstamm <span class=\"la\">ven-<\/span> und Endung <span class=\"la\">-eris<\/span>: <span class=\"la\">veneris<\/span> (du wirst gekommen sein)."},{"type":"mc","q":"Welche Form ist <span class=\"la\">venit<\/span> ohne Zusammenhang?","s":"Im Präsens ist das e kurz, im Perfekt lang (Dehnungsperfekt). Geschrieben sieht man das nicht. Im Text entscheiden die umgebenden Zeiten.","o":["Präsens oder Perfekt, die Schreibung ist gleich","nur Präsens","nur Perfekt","Futur I"]},{"type":"mc","q":"Welche Art der Perfektbildung liegt bei <span class=\"la\">dedi<\/span> (von <span class=\"la\">dare<\/span>) vor?","s":"Der Anlaut wird verdoppelt: <span class=\"la\">de-di<\/span>. Ebenso <span class=\"la\">steti<\/span> (von <span class=\"la\">stare<\/span>), <span class=\"la\">cucurri<\/span> (von <span class=\"la\">currere<\/span>), <span class=\"la\">tetigi<\/span> (von <span class=\"la\">tangere<\/span>).","o":["Reduplikation","v-Perfekt","s-Perfekt","Dehnung"]},{"type":"mc","q":"Welche Form ist <span class=\"la\">scripsere<\/span>?","h":"An welchem Stamm hängt die Endung?","s":"<span class=\"la\">scrips-<\/span> ist der Perfektstamm von <span class=\"la\">scribere<\/span>. <span class=\"la\">-ere<\/span> am Perfektstamm ist die Kurzform für <span class=\"la\">-erunt<\/span>: „sie schrieben“. Der Infinitiv Präsens wäre <span class=\"la\">scribere<\/span>.","o":["3. Person Plural Perfekt Aktiv","Infinitiv Präsens Aktiv","2. Person Singular Präsens Passiv","Infinitiv Perfekt Aktiv"]},{"type":"self","q":"Übersetze: <span class=\"la\">Hostes urbem diu oppugnabant, sed non ceperunt.<\/span> (diu = lange; oppugnare = bestürmen)","s":"„Die Feinde bestürmten die Stadt lange, aber sie nahmen sie nicht ein.“ Das Imperfekt <span class=\"la\">oppugnabant<\/span> beschreibt die Dauer (oder den vergeblichen Versuch), das Perfekt <span class=\"la\">ceperunt<\/span> das Ergebnis."}],"gen":["konj","stf"],"html":"<h3>Die Stammformen<\/h3>\n<p>Jedes Verb hat neben dem Präsensstamm einen eigenen <b>Perfektstamm<\/b> und einen dritten Stamm für das Partizip Perfekt Passiv. Deshalb stehen im Wörterbuch vier Formen:<\/p>\n<div class=\"formula\"><span class=\"la\">mittere, mitto, misi, missum<\/span> – schicken<\/div>\n<p>Infinitiv, 1. Person Präsens, 1. Person Perfekt, Supinum (daraus das Partizip Perfekt Passiv <span class=\"la\">missus<\/span>). Den Perfektstamm erhältst du, indem du vom Perfekt das <span class=\"la\">-i<\/span> wegnimmst: <span class=\"la\">mis-<\/span>.<\/p>\n<h3>Sechs Arten, das Perfekt zu bilden<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Art<\/th><th>Beispiel<\/th><th>Präsens → Perfekt<\/th><\/tr><tr><td>v-Perfekt<\/td><td><span class=\"la\">laudare<\/span>, <span class=\"la\">audire<\/span><\/td><td><span class=\"la\">laudo<\/span> → <span class=\"la\">lauda<b class=\"e\">v<\/b>i<\/span>, <span class=\"la\">audio<\/span> → <span class=\"la\">audi<b class=\"e\">v<\/b>i<\/span><\/td><\/tr><tr><td>u-Perfekt<\/td><td><span class=\"la\">monere<\/span>, <span class=\"la\">habere<\/span><\/td><td><span class=\"la\">moneo<\/span> → <span class=\"la\">mon<b class=\"e\">u<\/b>i<\/span><\/td><\/tr><tr><td>s-Perfekt<\/td><td><span class=\"la\">scribere<\/span>, <span class=\"la\">dicere<\/span>, <span class=\"la\">mittere<\/span><\/td><td><span class=\"la\">scri<b class=\"e\">ps<\/b>i<\/span>, <span class=\"la\">di<b class=\"e\">x<\/b>i<\/span>, <span class=\"la\">mi<b class=\"e\">s<\/b>i<\/span><\/td><\/tr><tr><td>Dehnung des Stammvokals<\/td><td><span class=\"la\">venire<\/span>, <span class=\"la\">videre<\/span>, <span class=\"la\">capere<\/span><\/td><td><span class=\"la\">v<b class=\"e\">e<\/b>ni<\/span>, <span class=\"la\">v<b class=\"e\">i<\/b>di<\/span>, <span class=\"la\">c<b class=\"e\">e<\/b>pi<\/span><\/td><\/tr><tr><td>Reduplikation (Verdopplung)<\/td><td><span class=\"la\">dare<\/span>, <span class=\"la\">currere<\/span>, <span class=\"la\">pellere<\/span><\/td><td><span class=\"la\"><b class=\"e\">de<\/b>di<\/span>, <span class=\"la\"><b class=\"e\">cu<\/b>curri<\/span>, <span class=\"la\"><b class=\"e\">pe<\/b>puli<\/span><\/td><\/tr><tr><td>ohne Veränderung<\/td><td><span class=\"la\">defendere<\/span>, <span class=\"la\">vertere<\/span><\/td><td><span class=\"la\">defendi<\/span>, <span class=\"la\">verti<\/span><\/td><\/tr><\/table><\/div>\n<p>Die a- und die i-Konjugation bilden fast immer das v-Perfekt, die e-Konjugation meist das u-Perfekt. Bei der konsonantischen Konjugation musst du die Stammformen lernen. Der Stammformentrainer im Kurs hilft dir dabei.<\/p>\n<h3>Die Endungen<\/h3>\n<p>Im Perfektstamm gibt es <b>keinen<\/b> Unterschied mehr zwischen den Konjugationen. Alle Verben haben dieselben Endungen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Perfekt<\/th><th>Plusquamperfekt<\/th><th>Futur II<\/th><\/tr><tr><td>ich<\/td><td>laudav<b class=\"e\">i<\/b><\/td><td>laudav<b class=\"e\">eram<\/b><\/td><td>laudav<b class=\"e\">ero<\/b><\/td><\/tr><tr><td>du<\/td><td>laudav<b class=\"e\">isti<\/b><\/td><td>laudav<b class=\"e\">eras<\/b><\/td><td>laudav<b class=\"e\">eris<\/b><\/td><\/tr><tr><td>er<\/td><td>laudav<b class=\"e\">it<\/b><\/td><td>laudav<b class=\"e\">erat<\/b><\/td><td>laudav<b class=\"e\">erit<\/b><\/td><\/tr><tr><td>wir<\/td><td>laudav<b class=\"e\">imus<\/b><\/td><td>laudav<b class=\"e\">eramus<\/b><\/td><td>laudav<b class=\"e\">erimus<\/b><\/td><\/tr><tr><td>ihr<\/td><td>laudav<b class=\"e\">istis<\/b><\/td><td>laudav<b class=\"e\">eratis<\/b><\/td><td>laudav<b class=\"e\">eritis<\/b><\/td><\/tr><tr><td>sie<\/td><td>laudav<b class=\"e\">erunt<\/b><\/td><td>laudav<b class=\"e\">erant<\/b><\/td><td>laudav<b class=\"e\">erint<\/b><\/td><\/tr><\/table><\/div>\n<p>Eselsbrücke: Plusquamperfekt ist Perfektstamm + Imperfekt von <span class=\"la\">esse<\/span> (<span class=\"la\">eram<\/span>), Futur II ist Perfektstamm + Futur von <span class=\"la\">esse<\/span> (<span class=\"la\">ero<\/span>), nur in der 3. Person Plural <span class=\"la\">-erint<\/span>.<\/p>\n<p>Das Perfekt von <span class=\"la\">esse<\/span> lautet <span class=\"la\">fui, fuisti, fuit, fuimus, fuistis, fuerunt<\/span>.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Kurzformen kommen in Originaltexten oft vor: <span class=\"la\">laudavere<\/span> statt <span class=\"la\">laudaverunt<\/span>, <span class=\"la\">laudasti<\/span> statt <span class=\"la\">laudavisti<\/span>, <span class=\"la\">audierunt<\/span> statt <span class=\"la\">audiverunt<\/span>. Wenn eine Form auf <span class=\"la\">-ere<\/span> wie ein Infinitiv aussieht, aber am Perfektstamm hängt (<span class=\"la\">misere<\/span>, <span class=\"la\">dixere<\/span>), ist sie 3. Person Plural Perfekt.<\/div>\n<h3>Perfekt oder Imperfekt?<\/h3>\n<p>Beide Zeiten bezeichnen Vergangenes, aber mit verschiedenem Blick:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Perfekt<\/th><th>Imperfekt<\/th><\/tr><tr><td>einmalige, abgeschlossene Handlung<\/td><td>Zustand, Dauer, Wiederholung, Versuch<\/td><\/tr><tr><td>treibt die Erzählung voran: „Was geschah dann?“<\/td><td>malt den Hintergrund: „Wie war es gerade?“<\/td><\/tr><tr><td><span class=\"la\">Caesar venit, vidit, vicit.<\/span><\/td><td><span class=\"la\">Milites in castris erant et dormiebant.<\/span><\/td><\/tr><\/table><\/div>\n<p>Im Deutschen übersetzt du beide in der Erzählung mit dem Präteritum. In direkter Rede und bei Feststellungen passt für das Perfekt auch das deutsche Perfekt: <span class=\"la\">Veni.<\/span> – „Ich bin gekommen.“<\/p>\n<p><b>Plusquamperfekt<\/b> bezeichnet, was vor einem vergangenen Ereignis schon abgeschlossen war: „hatte getan“. <b>Futur II<\/b> bezeichnet, was in der Zukunft abgeschlossen sein wird: „wird getan haben“. Im Deutschen nimmt man dafür meist das Perfekt: <span class=\"la\">Si veneris, gaudebo.<\/span> – „Wenn du gekommen bist (kommst), werde ich mich freuen.“<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Perfektform erkennen und zurückführen<\/h4><div class=\"task\">Im Text steht <span class=\"la\">pepulerant<\/span>. Bestimme die Form und finde das Verb.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Endung <span class=\"la\">-erant<\/span>: 3. Person Plural Plusquamperfekt Aktiv. Davor steht der Perfektstamm <span class=\"la\">pepul-<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die Silbe <span class=\"la\">pe-<\/span> am Anfang ist verdoppelt, das deutet auf Reduplikation. Der eigentliche Stamm ist <span class=\"la\">pul-<\/span> oder <span class=\"la\">pel-<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Suche im Wörterbuch unter <span class=\"la\">pell-<\/span>: <span class=\"la\">pellere, pello, pepuli, pulsum<\/span> – stoßen, schlagen, vertreiben.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übersetzung: „sie hatten vertrieben“.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"passiv","t":"Das Passiv","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die Passivendungen des Präsensstamms beherrschen","das Passiv des Perfektstamms aus Partizip und esse bilden","den Urheber und das Mittel richtig übersetzen","ein lateinisches Passiv auf verschiedene Arten gut ins Deutsche bringen"],"ex":[{"type":"txt","a":["laudantur"],"q":"Bilde von <span class=\"la\">laudare<\/span>: 3. Person Plural Präsens Passiv.","s":"<span class=\"la\">lauda-ntur<\/span> (sie werden gelobt)."},{"type":"txt","a":["regebatur"],"q":"Bilde von <span class=\"la\">regere<\/span>: 3. Person Singular Imperfekt Passiv.","s":"<span class=\"la\">reg-eba-tur<\/span> (er wurde gelenkt)."},{"type":"txt","a":["monemini"],"q":"Bilde von <span class=\"la\">monere<\/span>: 2. Person Plural Präsens Passiv.","s":"<span class=\"la\">mone-mini<\/span> (ihr werdet gemahnt). Die Endung <span class=\"la\">-mini<\/span> ist die einzige, die dem Aktiv gar nicht ähnelt."},{"type":"txt","a":["missi sunt"],"q":"Bilde von <span class=\"la\">mittere, mitto, misi, missum<\/span>: 3. Person Plural Perfekt Passiv (maskulin).","s":"Partizip im Nominativ Plural maskulin und <span class=\"la\">sunt<\/span>: <span class=\"la\">missi sunt<\/span> (sie sind geschickt worden)."},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Urbs capta est.<\/span> richtig?","s":"PPP mit <span class=\"la\">est<\/span> ist Perfekt Passiv. „Wird eingenommen“ wäre <span class=\"la\">capitur<\/span>, „wird eingenommen werden“ <span class=\"la\">capietur<\/span>.","o":["Die Stadt ist eingenommen worden.","Die Stadt wird eingenommen.","Die Stadt hat eingenommen.","Die Stadt wird eingenommen werden."]},{"type":"mc","q":"Warum steht in <span class=\"la\">Hostes telis repelluntur.<\/span> (telum = Geschoß; repellere = zurückschlagen) kein <span class=\"la\">a<\/span> vor <span class=\"la\">telis<\/span>?","s":"<span class=\"la\">a/ab<\/span> steht nur beim persönlichen Urheber. Das Mittel steht im bloßen Ablativ: „Die Feinde werden durch Geschoße zurückgeschlagen.“","o":["Weil Geschoße keine Personen sind, sondern das Mittel angeben.","Weil <span class=\"la\">telis<\/span> Dativ ist.","Weil im Plural nie <span class=\"la\">a<\/span> steht.","Weil <span class=\"la\">repellere<\/span> den Ablativ verlangt."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Diu pugnatur.<\/span> am besten?","s":"Unpersönliches Passiv: Es gibt kein Subjekt, betont wird nur die Handlung. Im Deutschen passt „man“ oder „es wird gekämpft“.","o":["Man kämpft lange.","Er wird lange bekämpft.","Sie haben lange gekämpft.","Lange kämpft er."]},{"type":"self","q":"Übersetze: <span class=\"la\">Roma a Romulo condita esse dicitur.<\/span> (condere, condo, condidi, conditum = gründen)","s":"„Man sagt, dass Rom von Romulus gegründet worden ist.“ Oder: „Rom soll von Romulus gegründet worden sein.“ <span class=\"la\">dicitur<\/span> ist Präsens Passiv („wird gesagt“), <span class=\"la\">a Romulo<\/span> der Urheber."}],"gen":["konj","best"],"html":"<h3>Passiv im Präsensstamm: eigene Endungen<\/h3>\n<p>Stamm und Tempuskennzeichen bleiben wie im Aktiv. Nur die Personalendung wechselt.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Person<\/th><th>Aktiv<\/th><th>Passiv<\/th><th>Beispiel<\/th><\/tr><tr><td>ich<\/td><td><span class=\"la\">-o, -m<\/span><\/td><td><span class=\"la\">-or, -r<\/span><\/td><td><span class=\"la\">laud<b class=\"e\">or<\/b><\/span> ich werde gelobt<\/td><\/tr><tr><td>du<\/td><td><span class=\"la\">-s<\/span><\/td><td><span class=\"la\">-ris<\/span><\/td><td><span class=\"la\">lauda<b class=\"e\">ris<\/b><\/span><\/td><\/tr><tr><td>er, sie, es<\/td><td><span class=\"la\">-t<\/span><\/td><td><span class=\"la\">-tur<\/span><\/td><td><span class=\"la\">lauda<b class=\"e\">tur<\/b><\/span><\/td><\/tr><tr><td>wir<\/td><td><span class=\"la\">-mus<\/span><\/td><td><span class=\"la\">-mur<\/span><\/td><td><span class=\"la\">lauda<b class=\"e\">mur<\/b><\/span><\/td><\/tr><tr><td>ihr<\/td><td><span class=\"la\">-tis<\/span><\/td><td><span class=\"la\">-mini<\/span><\/td><td><span class=\"la\">lauda<b class=\"e\">mini<\/b><\/span><\/td><\/tr><tr><td>sie<\/td><td><span class=\"la\">-nt<\/span><\/td><td><span class=\"la\">-ntur<\/span><\/td><td><span class=\"la\">lauda<b class=\"e\">ntur<\/b><\/span><\/td><\/tr><\/table><\/div>\n<p>Das gilt für Präsens, Imperfekt und Futur I: <span class=\"la\">laudabatur<\/span> (er wurde gelobt), <span class=\"la\">laudabitur<\/span> (er wird gelobt werden), <span class=\"la\">regetur<\/span>, <span class=\"la\">audiebantur<\/span>.<\/p>\n<p>In der 2. Person Singular gibt es zwei Besonderheiten: <span class=\"la\">regeris<\/span> (Präsens, kurzes e) und <span class=\"la\">laudaberis<\/span> (Futur). Die Form <span class=\"la\">regeris<\/span> kann auch Futur sein (mit langem e). Hier hilft nur der Zusammenhang.<\/p>\n<h3>Passiv im Perfektstamm: zwei Wörter<\/h3>\n<div class=\"formula\">Partizip Perfekt Passiv + Form von <span class=\"la\">esse<\/span><\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zeit<\/th><th>Bildung<\/th><th>Beispiel<\/th><\/tr><tr><td>Perfekt<\/td><td>PPP + <span class=\"la\">sum, es, est …<\/span><\/td><td><span class=\"la\">laudatus est<\/span> – er ist gelobt worden, er wurde gelobt<\/td><\/tr><tr><td>Plusquamperfekt<\/td><td>PPP + <span class=\"la\">eram, eras …<\/span><\/td><td><span class=\"la\">laudatus erat<\/span> – er war gelobt worden<\/td><\/tr><tr><td>Futur II<\/td><td>PPP + <span class=\"la\">ero, eris …<\/span><\/td><td><span class=\"la\">laudatus erit<\/span> – er wird gelobt worden sein<\/td><\/tr><\/table><\/div>\n<p>Das Partizip richtet sich in Geschlecht und Zahl nach dem Subjekt: <span class=\"la\">puella laudat<b class=\"e\">a<\/b> est<\/span>, <span class=\"la\">milites laudat<b class=\"e\">i<\/b> sunt<\/span>, <span class=\"la\">templum deletu<b class=\"e\">m<\/b> est<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">laudatus est<\/span> ist <b>Perfekt<\/b> und heißt „er ist gelobt worden“. Die Übersetzung „er ist gelobt“ oder gar „er wird gelobt“ ist falsch, obwohl <span class=\"la\">est<\/span> dasteht. Das Präsens Passiv lautet <span class=\"la\">laudatur<\/span>.<\/div>\n<h3>Wer handelt?<\/h3>\n<ul><li>Eine <b>Person<\/b> als Urheber steht mit <span class=\"la\">a<\/span> oder <span class=\"la\">ab<\/span> im Ablativ: <span class=\"la\">a patre laudatur<\/span> – er wird vom Vater gelobt.<\/li><li>Eine <b>Sache<\/b> als Mittel oder Ursache steht im bloßen Ablativ: <span class=\"la\">gladio vulneratur<\/span> – er wird durch ein Schwert (mit einem Schwert) verwundet.<\/li><\/ul>\n<h3>Gutes Deutsch für das Passiv<\/h3>\n<p>Latein verwendet das Passiv viel häufiger als das Deutsche. Du hast mehrere Möglichkeiten:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Möglichkeit<\/th><th>Deutsch<\/th><\/tr><tr><td><span class=\"la\">Urbs deletur.<\/span><\/td><td>Passiv mit „werden“<\/td><td>Die Stadt wird zerstört.<\/td><\/tr><tr><td><span class=\"la\">Urbs ab hostibus deletur.<\/span><\/td><td>ins Aktiv wenden<\/td><td>Die Feinde zerstören die Stadt.<\/td><\/tr><tr><td><span class=\"la\">Dicitur …<\/span><\/td><td>mit „man“<\/td><td>Man sagt …<\/td><\/tr><tr><td><span class=\"la\">Porta aperitur.<\/span><\/td><td>reflexiv<\/td><td>Das Tor öffnet sich.<\/td><\/tr><tr><td><span class=\"la\">Movetur.<\/span><\/td><td>intransitiv<\/td><td>Er bewegt sich.<\/td><\/tr><\/table><\/div>\n<h3>Unpersönliches Passiv<\/h3>\n<p>Auch Verben ohne Akkusativobjekt können in der 3. Person Singular ein Passiv bilden: <span class=\"la\">Pugnatur.<\/span> – „Es wird gekämpft“, „Man kämpft“. <span class=\"la\">Ventum est.<\/span> – „Man kam.“<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Passivsatz übersetzen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Epistulae a servo ad dominum portatae sunt.<\/span> (epistula = Brief)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">portatae sunt<\/span>. Partizip Perfekt Passiv mit <span class=\"la\">sunt<\/span>: Perfekt Passiv, 3. Person Plural.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Das Partizip steht im Nominativ Plural feminin. Das Subjekt muss dazu passen: <span class=\"la\">epistulae<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">a servo<\/span>: Präposition <span class=\"la\">a<\/span> mit Ablativ einer Person, also der Urheber: „vom Sklaven“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">ad dominum<\/span>: Richtung, „zum Herrn“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Die Briefe sind vom Sklaven zum Herrn gebracht worden.“ Besseres Deutsch im Aktiv: „Der Sklave brachte die Briefe zum Herrn.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"konjf","t":"Die Formen des Konjunktivs","kl":"1","k":1,"a":"F","tag":"Basis","goals":["alle vier Konjunktive im Aktiv und Passiv bilden","Konjunktiv Präsens und Futur I der konsonantischen Konjugation auseinanderhalten","die Konjunktive von esse, posse und velle beherrschen","Konjunktivformen im Text sicher erkennen"],"ex":[{"type":"txt","a":["laudet"],"q":"Bilde von <span class=\"la\">laudare<\/span>: 3. Person Singular Konjunktiv Präsens Aktiv.","s":"In der a-Konjugation wird das a zum e: <span class=\"la\">laudet<\/span>."},{"type":"txt","a":["regamus"],"q":"Bilde von <span class=\"la\">regere<\/span>: 1. Person Plural Konjunktiv Präsens Aktiv.","s":"Kennzeichen <span class=\"la\">-a-<\/span>: <span class=\"la\">regamus<\/span>. Das Futur I hieße <span class=\"la\">regemus<\/span>."},{"type":"txt","a":["audirent"],"q":"Bilde von <span class=\"la\">audire<\/span>: 3. Person Plural Konjunktiv Imperfekt Aktiv.","s":"Infinitiv <span class=\"la\">audire<\/span> und Endung <span class=\"la\">-nt<\/span>: <span class=\"la\">audirent<\/span>."},{"type":"txt","a":["cepisset"],"q":"Bilde von <span class=\"la\">capere, capio, cepi, captum<\/span>: 3. Person Singular Konjunktiv Plusquamperfekt Aktiv.","s":"Perfektstamm <span class=\"la\">cep-<\/span> und <span class=\"la\">-isset<\/span>: <span class=\"la\">cepisset<\/span>."},{"type":"txt","a":["sint"],"q":"Bilde von <span class=\"la\">esse<\/span>: 3. Person Plural Konjunktiv Präsens.","s":"<span class=\"la\">sint<\/span>."},{"type":"mc","q":"Welche Form ist <span class=\"la\">moneat<\/span>?","s":"In der e-Konjugation hat der Konjunktiv Präsens das Kennzeichen <span class=\"la\">-ea-<\/span>. Der Indikativ lautet <span class=\"la\">monet<\/span>, das Futur <span class=\"la\">monebit<\/span>.","o":["Konjunktiv Präsens","Indikativ Präsens","Futur I","Konjunktiv Imperfekt"]},{"type":"mc","q":"Welche Form ist <span class=\"la\">dicas<\/span> (dicere, dico)?","h":"Wie lautet das Futur I in der konsonantischen Konjugation?","s":"Konsonantische Konjugation: <span class=\"la\">dicis<\/span> (Präsens), <span class=\"la\">dices<\/span> (Futur I), <span class=\"la\">dicas<\/span> (Konjunktiv Präsens).","o":["2. Person Singular Konjunktiv Präsens","2. Person Singular Futur I","2. Person Singular Indikativ Präsens","2. Person Singular Imperfekt"]},{"type":"mc","q":"Woran erkennst du <span class=\"la\">venissent<\/span> als Konjunktiv Plusquamperfekt?","s":"Perfektstamm <span class=\"la\">ven-<\/span>, dann <span class=\"la\">-isse-<\/span> (wie der Infinitiv Perfekt <span class=\"la\">venisse<\/span>), dann die Personalendung. Die Endung <span class=\"la\">-nt<\/span> allein zeigt nur die 3. Person Plural.","o":["am Kennzeichen <span class=\"la\">-isse-<\/span> hinter dem Perfektstamm","an der Endung <span class=\"la\">-nt<\/span>","am Stamm <span class=\"la\">ven-<\/span>","an der Verdopplung des s"]}],"gen":["konj","best"],"html":"<h3>Vier Konjunktive<\/h3>\n<p>Das Lateinische hat vier Konjunktive: Präsens, Imperfekt, Perfekt und Plusquamperfekt. Einen Konjunktiv Futur gibt es nicht. Was die Konjunktive bedeuten und wie man sie übersetzt, hängt davon ab, ob sie im Hauptsatz oder im Gliedsatz stehen. Das behandeln eigene Kapitel. Hier geht es darum, die Formen sicher zu erkennen. Ohne das hilft die beste Regel nichts.<\/p>\n<h3>Konjunktiv Präsens: Vokalwechsel<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Konjugation<\/th><th>Indikativ<\/th><th>Konjunktiv<\/th><th>Kennzeichen<\/th><\/tr><tr><td>a<\/td><td><span class=\"la\">laudat<\/span><\/td><td><span class=\"la\">laud<b class=\"e\">e<\/b>t<\/span><\/td><td>a wird zu e<\/td><\/tr><tr><td>e<\/td><td><span class=\"la\">monet<\/span><\/td><td><span class=\"la\">mon<b class=\"e\">ea<\/b>t<\/span><\/td><td>-ea-<\/td><\/tr><tr><td>kons.<\/td><td><span class=\"la\">regit<\/span><\/td><td><span class=\"la\">reg<b class=\"e\">a<\/b>t<\/span><\/td><td>-a-<\/td><\/tr><tr><td>i<\/td><td><span class=\"la\">audit<\/span><\/td><td><span class=\"la\">aud<b class=\"e\">ia<\/b>t<\/span><\/td><td>-ia-<\/td><\/tr><tr><td>gemischt<\/td><td><span class=\"la\">capit<\/span><\/td><td><span class=\"la\">cap<b class=\"e\">ia<\/b>t<\/span><\/td><td>-ia-<\/td><\/tr><\/table><\/div>\n<p>Die Endungen sind die gewohnten: <span class=\"la\">laudem, laudes, laudet, laudemus, laudetis, laudent<\/span>. Passiv: <span class=\"la\">lauder, lauderis, laudetur …<\/span><\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Zwei Verwechslungen passieren ständig. Erstens: <span class=\"la\">laudet<\/span> sieht aus wie ein Indikativ der e-Konjugation, ist aber Konjunktiv der a-Konjugation. Zweitens: <span class=\"la\">regam<\/span> ist zugleich 1. Person Futur I und 1. Person Konjunktiv Präsens. Ab der 2. Person trennen sie sich: <span class=\"la\">reges<\/span> (Futur) gegen <span class=\"la\">regas<\/span> (Konjunktiv).<\/div>\n<h3>Konjunktiv Imperfekt: Infinitiv + Endung<\/h3>\n<p>Die einfachste Bildung der ganzen Grammatik: An den Infinitiv Präsens treten die Personalendungen.<\/p>\n<div class=\"formula\"><span class=\"la\">laudare-m, laudare-s, laudare-t, laudare-mus, laudare-tis, laudare-nt<\/span><\/div>\n<p>Ebenso <span class=\"la\">monerem<\/span>, <span class=\"la\">regerem<\/span>, <span class=\"la\">audirem<\/span>, <span class=\"la\">caperem<\/span>, <span class=\"la\">essem<\/span>, <span class=\"la\">possem<\/span>, <span class=\"la\">vellem<\/span>, <span class=\"la\">irem<\/span>, <span class=\"la\">ferrem<\/span>. Passiv: <span class=\"la\">laudarer, laudareris, laudaretur …<\/span><\/p>\n<h3>Konjunktiv Perfekt und Plusquamperfekt<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Konjunktiv Perfekt<\/th><th>Konjunktiv Plusquamperfekt<\/th><\/tr><tr><td>Aktiv<\/td><td>Perfektstamm + <span class=\"la\">-erim, -eris, -erit, -erimus, -eritis, -erint<\/span><\/td><td>Perfektstamm + <span class=\"la\">-issem, -isses, -isset, -issemus, -issetis, -issent<\/span><\/td><\/tr><tr><td>Beispiel<\/td><td><span class=\"la\">laudav<b class=\"e\">erim<\/b><\/span><\/td><td><span class=\"la\">laudav<b class=\"e\">issem<\/b><\/span><\/td><\/tr><tr><td>Passiv<\/td><td>PPP + <span class=\"la\">sim, sis, sit …<\/span><\/td><td>PPP + <span class=\"la\">essem, esses, esset …<\/span><\/td><\/tr><tr><td>Beispiel<\/td><td><span class=\"la\">laudatus sim<\/span><\/td><td><span class=\"la\">laudatus essem<\/span><\/td><\/tr><\/table><\/div>\n<p>Der Konjunktiv Plusquamperfekt lässt sich auch als „Infinitiv Perfekt + Endung“ merken: <span class=\"la\">laudavisse-m<\/span>.<\/p>\n<p>Der Konjunktiv Perfekt gleicht dem Futur II in fast allen Formen (<span class=\"la\">laudaverit<\/span>). Nur die 1. Person Singular unterscheidet sich: <span class=\"la\">laudaverim<\/span> gegen <span class=\"la\">laudavero<\/span>.<\/p>\n<h3>Wichtige unregelmäßige Konjunktive<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Konj. Präsens<\/th><th>Konj. Imperfekt<\/th><th>Konj. Perfekt<\/th><th>Konj. Plusquamperfekt<\/th><\/tr><tr><td><span class=\"la\">esse<\/span><\/td><td><span class=\"la\">sim, sis, sit, simus, sitis, sint<\/span><\/td><td><span class=\"la\">essem<\/span><\/td><td><span class=\"la\">fuerim<\/span><\/td><td><span class=\"la\">fuissem<\/span><\/td><\/tr><tr><td><span class=\"la\">posse<\/span><\/td><td><span class=\"la\">possim<\/span><\/td><td><span class=\"la\">possem<\/span><\/td><td><span class=\"la\">potuerim<\/span><\/td><td><span class=\"la\">potuissem<\/span><\/td><\/tr><tr><td><span class=\"la\">velle<\/span><\/td><td><span class=\"la\">velim<\/span><\/td><td><span class=\"la\">vellem<\/span><\/td><td><span class=\"la\">voluerim<\/span><\/td><td><span class=\"la\">voluissem<\/span><\/td><\/tr><tr><td><span class=\"la\">ire<\/span><\/td><td><span class=\"la\">eam<\/span><\/td><td><span class=\"la\">irem<\/span><\/td><td><span class=\"la\">ierim<\/span><\/td><td><span class=\"la\">issem<\/span><\/td><\/tr><tr><td><span class=\"la\">ferre<\/span><\/td><td><span class=\"la\">feram<\/span><\/td><td><span class=\"la\">ferrem<\/span><\/td><td><span class=\"la\">tulerim<\/span><\/td><td><span class=\"la\">tulissem<\/span><\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>So erkennst du Konjunktive auf einen Blick: Steckt ein ganzer Infinitiv in der Form (<span class=\"la\">venire-t<\/span>, <span class=\"la\">fuisse-nt<\/span>), ist es Konjunktiv Imperfekt oder Plusquamperfekt. Diese beiden sind die häufigsten in Erzähltexten.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Konjunktiv bestimmen<\/h4><div class=\"task\">Bestimme <span class=\"la\">mitteretur<\/span>, <span class=\"la\">mittatur<\/span> und <span class=\"la\">missus esset<\/span> (mittere, mitto, misi, missum).<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">mitteretur<\/span>: Darin steckt der Infinitiv <span class=\"la\">mittere<\/span>, dahinter die Passivendung <span class=\"la\">-tur<\/span>. Konjunktiv Imperfekt Passiv, 3. Person Singular.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">mittatur<\/span>: Stamm <span class=\"la\">mitt-<\/span>, Kennzeichen <span class=\"la\">-a-<\/span>, Endung <span class=\"la\">-tur<\/span>. In der konsonantischen Konjugation ist <span class=\"la\">-a-<\/span> das Zeichen des Konjunktivs Präsens (in der 3. Person eindeutig, das Futur hieße <span class=\"la\">mittetur<\/span>). Konjunktiv Präsens Passiv.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div><span class=\"la\">missus esset<\/span>: PPP mit <span class=\"la\">esset<\/span>, dem Konjunktiv Imperfekt von <span class=\"la\">esse<\/span>. Zusammen: Konjunktiv Plusquamperfekt Passiv.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"irreg","t":"Unregelmäßige Verben: esse, posse, ire, ferre, velle, fieri","kl":"1","k":1,"a":"F","tag":"Basis","goals":["die Formen der wichtigsten unregelmäßigen Verben erkennen","Komposita von esse, ire und ferre auf das Grundverb zurückführen","velle, nolle und malle unterscheiden","fieri als Passiv von facere verstehen"],"ex":[{"type":"txt","a":["potestis"],"q":"Bilde von <span class=\"la\">posse<\/span>: 2. Person Plural Präsens.","s":"<span class=\"la\">pot-estis<\/span> (ihr könnt). Vor e bleibt das t."},{"type":"txt","a":["eunt"],"q":"Bilde von <span class=\"la\">ire<\/span>: 3. Person Plural Präsens.","s":"<span class=\"la\">eunt<\/span> (sie gehen)."},{"type":"txt","a":["vult"],"q":"Bilde von <span class=\"la\">velle<\/span>: 3. Person Singular Präsens.","s":"<span class=\"la\">vult<\/span> (er will)."},{"type":"txt","a":["tulit"],"q":"Bilde von <span class=\"la\">ferre<\/span>: 3. Person Singular Perfekt Aktiv.","s":"Perfektstamm <span class=\"la\">tul-<\/span>: <span class=\"la\">tulit<\/span> (er trug, er hat ertragen)."},{"type":"mc","q":"Was bedeutet <span class=\"la\">prodest<\/span>?","s":"<span class=\"la\">prodesse<\/span> ist ein Kompositum von <span class=\"la\">esse<\/span> und bedeutet „nützen“. Vor Vokal lautet die Vorsilbe <span class=\"la\">prod-<\/span> (<span class=\"la\">prodest<\/span>), vor Konsonant <span class=\"la\">pro-<\/span> (<span class=\"la\">prosunt<\/span>).","o":["es nützt","es ist vorne","er geht voran","er kann"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">mavult<\/span>?","s":"<span class=\"la\">malle<\/span> = <span class=\"la\">magis velle<\/span>, „lieber wollen“. „Er will nicht“ heißt <span class=\"la\">non vult<\/span>.","o":["er will lieber","er will nicht","er will sehr","er ist schlecht"]},{"type":"mc","q":"Welche Form ist <span class=\"la\">fit<\/span>?","s":"<span class=\"la\">fit<\/span> heißt „es geschieht“, „er wird“, „es wird gemacht“. Das Perfekt von <span class=\"la\">esse<\/span> ist <span class=\"la\">fuit<\/span>, das Präsens von <span class=\"la\">facere<\/span> ist <span class=\"la\">facit<\/span>, das von <span class=\"la\">ferre<\/span> ist <span class=\"la\">fert<\/span>.","o":["3. Person Singular Präsens von <span class=\"la\">fieri<\/span>","3. Person Singular Perfekt von <span class=\"la\">esse<\/span>","3. Person Singular Präsens von <span class=\"la\">facere<\/span>","3. Person Singular Präsens von <span class=\"la\">ferre<\/span>"]},{"type":"txt","a":["redire"],"q":"In einem Text steht <span class=\"la\">redierunt<\/span> (sie kehrten zurück). Wie lautet der Infinitiv Präsens?","s":"<span class=\"la\">red-ire<\/span>. Die Vorsilbe <span class=\"la\">re-<\/span> lautet vor Vokal <span class=\"la\">red-<\/span>."},{"type":"self","q":"Übersetze: <span class=\"la\">Amici nobis adesse volunt, sed non possunt.<\/span>","s":"„Die Freunde wollen uns helfen, aber sie können nicht.“ <span class=\"la\">adesse<\/span> (mit Dativ <span class=\"la\">nobis<\/span>) heißt „beistehen, helfen“."}],"gen":[],"html":"<h3>Warum gerade diese Verben?<\/h3>\n<p>Die unregelmäßigen Verben sind zugleich die häufigsten. In jedem Text kommen mehrere davon vor. Unregelmäßig ist bei ihnen fast nur das <b>Präsens<\/b>. Imperfekt, Futur und der ganze Perfektstamm gehen regelmäßig.<\/p>\n<h3>Präsens im Überblick<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>esse<\/th><th>posse<\/th><th>ire<\/th><th>ferre<\/th><th>velle<\/th><th>nolle<\/th><th>malle<\/th><\/tr><tr><td>ich<\/td><td>sum<\/td><td>possum<\/td><td>eo<\/td><td>fero<\/td><td>volo<\/td><td>nolo<\/td><td>malo<\/td><\/tr><tr><td>du<\/td><td>es<\/td><td>potes<\/td><td>is<\/td><td>fers<\/td><td>vis<\/td><td>non vis<\/td><td>mavis<\/td><\/tr><tr><td>er<\/td><td>est<\/td><td>potest<\/td><td>it<\/td><td>fert<\/td><td>vult<\/td><td>non vult<\/td><td>mavult<\/td><\/tr><tr><td>wir<\/td><td>sumus<\/td><td>possumus<\/td><td>imus<\/td><td>ferimus<\/td><td>volumus<\/td><td>nolumus<\/td><td>malumus<\/td><\/tr><tr><td>ihr<\/td><td>estis<\/td><td>potestis<\/td><td>itis<\/td><td>fertis<\/td><td>vultis<\/td><td>non vultis<\/td><td>mavultis<\/td><\/tr><tr><td>sie<\/td><td>sunt<\/td><td>possunt<\/td><td>eunt<\/td><td>ferunt<\/td><td>volunt<\/td><td>nolunt<\/td><td>malunt<\/td><\/tr><\/table><\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Bedeutung<\/th><th>Imperfekt<\/th><th>Futur I<\/th><th>Perfekt<\/th><\/tr><tr><td><span class=\"la\">esse<\/span><\/td><td>sein<\/td><td><span class=\"la\">eram<\/span><\/td><td><span class=\"la\">ero<\/span><\/td><td><span class=\"la\">fui<\/span><\/td><\/tr><tr><td><span class=\"la\">posse<\/span><\/td><td>können<\/td><td><span class=\"la\">poteram<\/span><\/td><td><span class=\"la\">potero<\/span><\/td><td><span class=\"la\">potui<\/span><\/td><\/tr><tr><td><span class=\"la\">ire<\/span><\/td><td>gehen<\/td><td><span class=\"la\">ibam<\/span><\/td><td><span class=\"la\">ibo<\/span><\/td><td><span class=\"la\">ii<\/span><\/td><\/tr><tr><td><span class=\"la\">ferre<\/span><\/td><td>tragen, bringen, ertragen<\/td><td><span class=\"la\">ferebam<\/span><\/td><td><span class=\"la\">feram<\/span><\/td><td><span class=\"la\">tuli<\/span> (PPP <span class=\"la\">latum<\/span>)<\/td><\/tr><tr><td><span class=\"la\">velle<\/span><\/td><td>wollen<\/td><td><span class=\"la\">volebam<\/span><\/td><td><span class=\"la\">volam<\/span><\/td><td><span class=\"la\">volui<\/span><\/td><\/tr><tr><td><span class=\"la\">nolle<\/span><\/td><td>nicht wollen<\/td><td><span class=\"la\">nolebam<\/span><\/td><td><span class=\"la\">nolam<\/span><\/td><td><span class=\"la\">nolui<\/span><\/td><\/tr><tr><td><span class=\"la\">malle<\/span><\/td><td>lieber wollen<\/td><td><span class=\"la\">malebam<\/span><\/td><td><span class=\"la\">malam<\/span><\/td><td><span class=\"la\">malui<\/span><\/td><\/tr><\/table><\/div>\n<p>Merkhilfen: <span class=\"la\">posse<\/span> ist <span class=\"la\">pot-<\/span> + <span class=\"la\">esse<\/span>. Vor s wird das t zu s (<span class=\"la\">pos-sum<\/span>), vor e bleibt es (<span class=\"la\">pot-es<\/span>). <span class=\"la\">nolle<\/span> ist <span class=\"la\">non velle<\/span>, <span class=\"la\">malle<\/span> ist <span class=\"la\">magis velle<\/span> (mehr wollen).<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">vis<\/span> ist doppeldeutig: „du willst“ (von <span class=\"la\">velle<\/span>) oder „Kraft, Gewalt“ (das Substantiv <span class=\"la\">vis<\/span>, Akkusativ <span class=\"la\">vim<\/span>, Ablativ <span class=\"la\">vi<\/span>). Ebenso heißt <span class=\"la\">is<\/span> „du gehst“ oder „dieser“. Der Satzbau entscheidet: Fehlt sonst ein Prädikat, ist es die Verbform.<\/div>\n<h3>Komposita<\/h3>\n<p>Die Vorsilbe ändert die Bedeutung, die Formen bleiben wie beim Grundverb.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Grundverb<\/th><th>Komposita<\/th><\/tr><tr><td><span class=\"la\">esse<\/span><\/td><td><span class=\"la\">adesse<\/span> da sein, helfen · <span class=\"la\">abesse<\/span> fern sein, fehlen · <span class=\"la\">deesse<\/span> fehlen · <span class=\"la\">praeesse<\/span> leiten · <span class=\"la\">prodesse<\/span> nützen · <span class=\"la\">interesse<\/span> teilnehmen · <span class=\"la\">superesse<\/span> übrig sein<\/td><\/tr><tr><td><span class=\"la\">ire<\/span><\/td><td><span class=\"la\">abire<\/span> weggehen · <span class=\"la\">adire<\/span> herangehen · <span class=\"la\">exire<\/span> hinausgehen · <span class=\"la\">inire<\/span> beginnen · <span class=\"la\">redire<\/span> zurückkehren · <span class=\"la\">transire<\/span> hinübergehen · <span class=\"la\">perire<\/span> zugrunde gehen<\/td><\/tr><tr><td><span class=\"la\">ferre<\/span><\/td><td><span class=\"la\">afferre<\/span> herbeibringen · <span class=\"la\">auferre<\/span> wegtragen · <span class=\"la\">conferre<\/span> zusammentragen, vergleichen · <span class=\"la\">differre<\/span> aufschieben, sich unterscheiden · <span class=\"la\">offerre<\/span> anbieten · <span class=\"la\">referre<\/span> zurückbringen, berichten<\/td><\/tr><\/table><\/div>\n<p>Bei <span class=\"la\">ferre<\/span> ändern sich die Vorsilben in den Stammformen stark: <span class=\"la\">afferre, affero, attuli, allatum<\/span> und <span class=\"la\">auferre, aufero, abstuli, ablatum<\/span>. Wenn du in einer Form <span class=\"la\">-tul-<\/span> oder <span class=\"la\">-lat-<\/span> siehst, suche bei <span class=\"la\">ferre<\/span>.<\/p>\n<h3>fieri<\/h3>\n<p><span class=\"la\">fieri, fio, factus sum<\/span> bedeutet „werden“, „geschehen“, „gemacht werden“ und dient als <b>Passiv von <span class=\"la\">facere<\/span><\/b>. Es hat aktive Formen mit passiver Bedeutung.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Präsens<\/th><th>Imperfekt<\/th><th>Futur I<\/th><th>Perfekt<\/th><\/tr><tr><td><span class=\"la\">fio, fis, fit, fimus, fitis, fiunt<\/span><\/td><td><span class=\"la\">fiebam<\/span><\/td><td><span class=\"la\">fiam, fies<\/span><\/td><td><span class=\"la\">factus sum<\/span><\/td><\/tr><\/table><\/div>\n<p>Häufige Wendungen: <span class=\"la\">fit, ut<\/span> … (es geschieht, dass …), <span class=\"la\">certior fieri<\/span> (benachrichtigt werden), <span class=\"la\">consul fieri<\/span> (Konsul werden).<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Kompositum zurückführen<\/h4><div class=\"task\">Im Text steht <span class=\"la\">abstulerunt<\/span>. Bestimme die Form.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Endung <span class=\"la\">-erunt<\/span>: 3. Person Plural Perfekt Aktiv. Perfektstamm: <span class=\"la\">abstul-<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Darin steckt <span class=\"la\">-tul-<\/span>, der Perfektstamm von <span class=\"la\">ferre<\/span>. Davor steht <span class=\"la\">abs-<\/span>, eine Form der Vorsilbe <span class=\"la\">ab-<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Das Verb ist <span class=\"la\">auferre, aufero, abstuli, ablatum<\/span> – wegtragen, rauben.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übersetzung: „sie haben weggetragen“, „sie raubten“.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"depon","t":"Deponentia und Semideponentia","kl":"2","k":2,"a":"F","tag":"Aufbau","goals":["Deponentia an der Wörterbuchangabe erkennen","passive Formen mit aktiver Bedeutung richtig übersetzen","die Besonderheiten bei Partizipien und Imperativ kennen","Semideponentia und die Deponentia mit Ablativ beherrschen"],"ex":[{"type":"mc","q":"Was bedeutet <span class=\"la\">hortatur<\/span>?","s":"<span class=\"la\">hortari<\/span> ist ein Deponens: passive Form, aktive Bedeutung.","o":["er ermahnt","er wird ermahnt","er hat ermahnt","ermahnt zu werden"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">milites profecti sunt<\/span>?","s":"<span class=\"la\">proficisci, proficiscor, profectus sum<\/span> ist ein Deponens. <span class=\"la\">profecti sunt<\/span> ist Perfekt mit aktiver Bedeutung.","o":["Die Soldaten sind aufgebrochen.","Die Soldaten sind vollendet worden.","Die Soldaten werden aufbrechen.","Die Soldaten brechen auf."]},{"type":"txt","a":["locutus est"],"q":"Bilde von <span class=\"la\">loqui, loquor, locutus sum<\/span>: 3. Person Singular Perfekt (maskulin).","s":"<span class=\"la\">locutus est<\/span> (er hat gesprochen)."},{"type":"txt","a":["sequimur"],"q":"Bilde von <span class=\"la\">sequi, sequor<\/span>: 1. Person Plural Präsens.","s":"<span class=\"la\">sequimur<\/span> (wir folgen), gebildet wie das Passiv der konsonantischen Konjugation (<span class=\"la\">regimur<\/span>)."},{"type":"mc","q":"In welchem Fall steht das Objekt bei <span class=\"la\">uti<\/span> (benützen)?","s":"<span class=\"la\">uti, frui, fungi, potiri, vesci<\/span> stehen mit dem Ablativ: <span class=\"la\">armis uti<\/span> (die Waffen gebrauchen).","o":["im Ablativ","im Akkusativ","im Dativ","im Genitiv"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">ausus est<\/span>?","s":"<span class=\"la\">audere, audeo, ausus sum<\/span> ist ein Semideponens. Achtung auf die Ähnlichkeit mit <span class=\"la\">audire<\/span> (hören), dessen Perfekt <span class=\"la\">audivit<\/span> lautet.","o":["er hat gewagt","er ist gewagt worden","er wagt","er hat gehört"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">Sequere me!<\/span>?","s":"<span class=\"la\">sequere<\/span> ist der Imperativ Singular des Deponens <span class=\"la\">sequi<\/span>. Er sieht aus wie ein Infinitiv Aktiv, den es bei diesem Verb aber nicht gibt.","o":["Folge mir!","Mir zu folgen","Du wirst mir folgen.","Er folgt mir."]},{"type":"self","q":"Übersetze: <span class=\"la\">Cicero multa de re publica locutus cives hortatus est.<\/span> (multa = vieles)","s":"„Nachdem Cicero vieles über den Staat gesprochen hatte, ermahnte er die Bürger.“ <span class=\"la\">locutus<\/span> ist ein Partizip Perfekt mit aktiver Bedeutung (Deponens) und bezieht sich auf <span class=\"la\">Cicero<\/span>; <span class=\"la\">hortatus est<\/span> ist das Prädikat."}],"gen":[],"html":"<h3>Passive Form, aktive Bedeutung<\/h3>\n<p>Deponentia sind Verben, die nur passive Formen haben, aber <b>aktiv<\/b> übersetzt werden. Man sagt, sie hätten ihre aktiven Formen „abgelegt“ (<span class=\"la\">deponere<\/span>). Du erkennst sie im Wörterbuch daran, dass schon die Grundformen passiv aussehen:<\/p>\n<div class=\"formula\"><span class=\"la\">hortari, hortor, hortatus sum<\/span> – ermahnen, auffordern<\/div>\n<p><span class=\"la\">hortatur<\/span> heißt also „er ermahnt“ und nicht „er wird ermahnt“. <span class=\"la\">hortatus est<\/span> heißt „er hat ermahnt“.<\/p>\n<h3>Die häufigsten Deponentia<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Stammformen<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">conari<\/span><\/td><td><span class=\"la\">conor, conatus sum<\/span><\/td><td>versuchen<\/td><\/tr><tr><td><span class=\"la\">hortari<\/span><\/td><td><span class=\"la\">hortor, hortatus sum<\/span><\/td><td>ermahnen, auffordern<\/td><\/tr><tr><td><span class=\"la\">mirari<\/span><\/td><td><span class=\"la\">miror, miratus sum<\/span><\/td><td>sich wundern, bewundern<\/td><\/tr><tr><td><span class=\"la\">vereri<\/span><\/td><td><span class=\"la\">vereor, veritus sum<\/span><\/td><td>fürchten, verehren<\/td><\/tr><tr><td><span class=\"la\">loqui<\/span><\/td><td><span class=\"la\">loquor, locutus sum<\/span><\/td><td>sprechen<\/td><\/tr><tr><td><span class=\"la\">sequi<\/span><\/td><td><span class=\"la\">sequor, secutus sum<\/span><\/td><td>folgen (mit Akkusativ!)<\/td><\/tr><tr><td><span class=\"la\">proficisci<\/span><\/td><td><span class=\"la\">proficiscor, profectus sum<\/span><\/td><td>aufbrechen, marschieren<\/td><\/tr><tr><td><span class=\"la\">nasci<\/span><\/td><td><span class=\"la\">nascor, natus sum<\/span><\/td><td>geboren werden<\/td><\/tr><tr><td><span class=\"la\">mori<\/span><\/td><td><span class=\"la\">morior, mortuus sum<\/span><\/td><td>sterben<\/td><\/tr><tr><td><span class=\"la\">pati<\/span><\/td><td><span class=\"la\">patior, passus sum<\/span><\/td><td>leiden, dulden, zulassen<\/td><\/tr><tr><td><span class=\"la\">ingredi<\/span><\/td><td><span class=\"la\">ingredior, ingressus sum<\/span><\/td><td>hineingehen, beginnen<\/td><\/tr><tr><td><span class=\"la\">oriri<\/span><\/td><td><span class=\"la\">orior, ortus sum<\/span><\/td><td>entstehen, aufgehen<\/td><\/tr><tr><td><span class=\"la\">arbitrari<\/span><\/td><td><span class=\"la\">arbitror, arbitratus sum<\/span><\/td><td>meinen, glauben<\/td><\/tr><\/table><\/div>\n<h3>Fünf Deponentia mit Ablativ<\/h3>\n<p><span class=\"la\">uti<\/span> (benützen), <span class=\"la\">frui<\/span> (genießen), <span class=\"la\">fungi<\/span> (verrichten, verwalten), <span class=\"la\">potiri<\/span> (sich bemächtigen), <span class=\"la\">vesci<\/span> (sich ernähren) haben ihr Objekt im <b>Ablativ<\/b>. Im Deutschen steht der Akkusativ: <span class=\"la\">gladio utitur<\/span> – „er benützt das Schwert“.<\/p>\n<h3>Was bei Deponentia anders ist<\/h3>\n<ul><li>Das <b>Partizip Perfekt<\/b> hat aktive Bedeutung: <span class=\"la\">locutus<\/span> heißt „einer, der gesprochen hat“. <span class=\"la\">Caesar milites hortatus proelium commisit.<\/span> – „Nachdem Caesar die Soldaten ermahnt hatte, begann er die Schlacht.“ Bei gewöhnlichen Verben ist das Partizip Perfekt passiv.<\/li><li>Einige Formen sind wirklich aktiv gebildet: das Partizip Präsens (<span class=\"la\">loquens<\/span> sprechend), das Partizip Futur (<span class=\"la\">locuturus<\/span>) und der Infinitiv Futur (<span class=\"la\">locuturum esse<\/span>).<\/li><li>Der <b>Imperativ<\/b> sieht im Singular aus wie ein Infinitiv Aktiv: <span class=\"la\">sequere!<\/span> (folge!), <span class=\"la\">loquere!<\/span> (sprich!). Im Plural endet er auf <span class=\"la\">-mini<\/span>: <span class=\"la\">sequimini!<\/span><\/li><li>Der <b>Infinitiv Präsens<\/b> endet auf <span class=\"la\">-ri<\/span> oder <span class=\"la\">-i<\/span>: <span class=\"la\">hortari<\/span>, <span class=\"la\">vereri<\/span>, <span class=\"la\">loqui<\/span>, <span class=\"la\">pati<\/span>.<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Wenn eine passive Form keinen Sinn ergibt („er wird gesprochen“), prüfe im Wörterbuch, ob das Verb ein Deponens ist. Dieser Blick kostet zehn Sekunden und rettet ganze Sätze.<\/div>\n<h3>Semideponentia<\/h3>\n<p>Bei einigen Verben ist nur der <b>Perfektstamm<\/b> passiv gebildet, die Bedeutung bleibt aktiv:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verb<\/th><th>Perfekt<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">audere<\/span><\/td><td><span class=\"la\">ausus sum<\/span><\/td><td>wagen<\/td><\/tr><tr><td><span class=\"la\">gaudere<\/span><\/td><td><span class=\"la\">gavisus sum<\/span><\/td><td>sich freuen<\/td><\/tr><tr><td><span class=\"la\">solere<\/span><\/td><td><span class=\"la\">solitus sum<\/span><\/td><td>gewohnt sein, pflegen<\/td><\/tr><tr><td><span class=\"la\">confidere<\/span><\/td><td><span class=\"la\">confisus sum<\/span><\/td><td>vertrauen<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">ausus est<\/span> heißt „er hat gewagt“. Umgekehrt ist <span class=\"la\">revertor<\/span> (zurückkehren) im Präsens Deponens und im Perfekt aktiv: <span class=\"la\">reverti<\/span>.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Deponens im Satz<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Legati de pace locuti sunt, sed dux eos secutus non est.<\/span> (legatus = Gesandter; dux = Anführer)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erstes Prädikat: <span class=\"la\">locuti sunt<\/span>. Die Form sieht aus wie Perfekt Passiv. „Sie sind gesprochen worden“ ergibt aber keinen Sinn.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">loqui<\/span> ist ein Deponens. <span class=\"la\">locuti sunt<\/span> heißt aktiv: „sie haben gesprochen“. Subjekt: <span class=\"la\">legati<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweites Prädikat: <span class=\"la\">secutus non est<\/span> von <span class=\"la\">sequi<\/span>, ebenfalls Deponens: „er ist nicht gefolgt“. Subjekt: <span class=\"la\">dux<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">sequi<\/span> hat sein Objekt im Akkusativ: <span class=\"la\">eos<\/span>. Im Deutschen wird daraus ein Dativ: „ihnen“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Die Gesandten sprachen über den Frieden, aber der Anführer folgte ihnen nicht.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"nominal","t":"Imperativ, Infinitive und Partizipien","kl":"2","k":2,"a":"F","tag":"Aufbau","goals":["Imperative bilden und Verbote ausdrücken","alle sechs Infinitive bilden und ihr Zeitverhältnis angeben","die drei Partizipien bilden und nach KNG zuordnen","die Umschreibung mit dem Partizip Futur übersetzen"],"ex":[{"type":"txt","a":["audite"],"q":"Bilde den Imperativ Plural von <span class=\"la\">audire<\/span>.","s":"<span class=\"la\">audite!<\/span> (hört!)."},{"type":"txt","a":["duc"],"q":"Bilde den Imperativ Singular von <span class=\"la\">ducere<\/span>.","s":"<span class=\"la\">duc!<\/span> ist eine der vier Kurzformen: <span class=\"la\">dic, duc, fac, fer<\/span>."},{"type":"txt","a":["misisse"],"q":"Bilde den Infinitiv Perfekt Aktiv von <span class=\"la\">mittere, mitto, misi, missum<\/span>.","s":"Perfektstamm <span class=\"la\">mis-<\/span> + <span class=\"la\">-isse<\/span>: <span class=\"la\">misisse<\/span> (geschickt haben)."},{"type":"txt","a":["mitti"],"q":"Bilde den Infinitiv Präsens Passiv von <span class=\"la\">mittere<\/span>.","s":"Konsonantische Konjugation: <span class=\"la\">mitti<\/span> (geschickt werden)."},{"type":"txt","a":["venturus"],"q":"Bilde das Partizip Futur Aktiv (Nominativ Singular maskulin) von <span class=\"la\">venire, venio, veni, ventum<\/span>.","s":"Supinstamm <span class=\"la\">vent-<\/span> + <span class=\"la\">-urus<\/span>: <span class=\"la\">venturus<\/span> (einer, der kommen wird). Davon kommt das Wort Abenteuer (aus <span class=\"la\">adventura<\/span>)."},{"type":"mc","q":"Welches Zeitverhältnis drückt der Infinitiv Perfekt aus?","s":"Der Infinitiv Perfekt bezeichnet, was <b>vor<\/b> der Handlung des übergeordneten Verbs liegt. Welche Zeit du im Deutschen nimmst, hängt daher vom Hauptverb ab.","o":["Vorzeitigkeit","Gleichzeitigkeit","Nachzeitigkeit","immer Vergangenheit, unabhängig vom Hauptverb"]},{"type":"mc","q":"Wie drückt man „Kommt nicht!“ aus?","s":"Verbot: <span class=\"la\">noli<\/span> (Singular) oder <span class=\"la\">nolite<\/span> (Plural) mit Infinitiv. Die Verneinung <span class=\"la\">non<\/span> steht nie beim Imperativ.","o":["Nolite venire!","Non venite!","Ne venite!","Noli venite!"]},{"type":"mc","q":"Zu welchem Wort gehört <span class=\"la\">clamantes<\/span> in <span class=\"la\">Pueri clamantes per vias currunt.<\/span> (clamare = schreien; currere = laufen)?","s":"<span class=\"la\">clamantes<\/span> ist Partizip Präsens Aktiv im Nominativ Plural und stimmt mit <span class=\"la\">pueri<\/span> überein: „Die Buben laufen schreiend durch die Straßen.“ Der Form nach könnte <span class=\"la\">clamantes<\/span> auch Akkusativ Plural sein und zu <span class=\"la\">vias<\/span> gehören. Aber Straßen schreien nicht: Wo die Form zwei Möglichkeiten lässt, entscheidet der Sinn.","o":["zu <span class=\"la\">pueri<\/span>","zu <span class=\"la\">vias<\/span>","zu <span class=\"la\">currunt<\/span>","Es ist das Prädikat."]}],"gen":["nom"],"html":"<h3>Der Imperativ<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>a-Konjugation<\/td><td><span class=\"la\">lauda!<\/span><\/td><td><span class=\"la\">laudate!<\/span><\/td><\/tr><tr><td>e-Konjugation<\/td><td><span class=\"la\">mone!<\/span><\/td><td><span class=\"la\">monete!<\/span><\/td><\/tr
