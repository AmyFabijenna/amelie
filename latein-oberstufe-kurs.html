><tr><td>kons. Konjugation<\/td><td><span class=\"la\">rege!<\/span><\/td><td><span class=\"la\">regite!<\/span><\/td><\/tr><tr><td>i-Konjugation<\/td><td><span class=\"la\">audi!<\/span><\/td><td><span class=\"la\">audite!<\/span><\/td><\/tr><tr><td><span class=\"la\">esse<\/span> / <span class=\"la\">ire<\/span><\/td><td><span class=\"la\">es!<\/span> / <span class=\"la\">i!<\/span><\/td><td><span class=\"la\">este!<\/span> / <span class=\"la\">ite!<\/span><\/td><\/tr><\/table><\/div>\n<p>Vier Kurzformen ohne Endvokal: <span class=\"la\">dic!<\/span> (sag!), <span class=\"la\">duc!<\/span> (führe!), <span class=\"la\">fac!<\/span> (mach!), <span class=\"la\">fer!<\/span> (trag!).<\/p>\n<p>Ein <b>Verbot<\/b> drückt man so aus: <span class=\"la\">noli<\/span> / <span class=\"la\">nolite<\/span> + Infinitiv (<span class=\"la\">Noli timere!<\/span> – „Fürchte dich nicht!“) oder <span class=\"la\">ne<\/span> + Konjunktiv Perfekt (<span class=\"la\">Ne timueris!<\/span>).<\/p>\n<h3>Die Infinitive<\/h3>\n<p>Es gibt sechs Infinitive. Du brauchst sie vor allem für den AcI. Dort drücken sie kein absolutes Tempus aus, sondern ein <b>Zeitverhältnis<\/b> zum übergeordneten Verb.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Aktiv<\/th><th>Passiv<\/th><th>Zeitverhältnis<\/th><\/tr><tr><td>Präsens<\/td><td><span class=\"la\">laudare<\/span><\/td><td><span class=\"la\">laudari<\/span><\/td><td>gleichzeitig<\/td><\/tr><tr><td>Perfekt<\/td><td><span class=\"la\">laudavisse<\/span><\/td><td><span class=\"la\">laudatum esse<\/span><\/td><td>vorzeitig<\/td><\/tr><tr><td>Futur<\/td><td><span class=\"la\">laudaturum esse<\/span><\/td><td><span class=\"la\">laudatum iri<\/span> (selten)<\/td><td>nachzeitig<\/td><\/tr><\/table><\/div>\n<p>Der Infinitiv Präsens Passiv endet auf <span class=\"la\">-ri<\/span>, in der konsonantischen und gemischten Konjugation auf bloßes <span class=\"la\">-i<\/span>: <span class=\"la\">laudari, moneri, audiri<\/span>, aber <span class=\"la\">regi, capi, mitti, duci<\/span>.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">regi<\/span> kann Infinitiv Präsens Passiv von <span class=\"la\">regere<\/span> sein („gelenkt werden“) oder Dativ Singular von <span class=\"la\">rex<\/span> („dem König“). Ebenso <span class=\"la\">duci<\/span> (geführt werden / dem Anführer). Auch hier entscheidet der Satz.<\/div>\n<p>In den zusammengesetzten Infinitiven wird das Partizip dekliniert. Im AcI steht es im Akkusativ und richtet sich nach dem Subjektsakkusativ: <span class=\"la\">urbem captam esse<\/span>, <span class=\"la\">milites venturos esse<\/span>. Oft fällt <span class=\"la\">esse<\/span> weg.<\/p>\n<h3>Die Partizipien<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Partizip<\/th><th>Bildung<\/th><th>Beispiel<\/th><th>Bedeutung<\/th><th>Zeitverhältnis<\/th><\/tr><tr><td>Präsens Aktiv (PPA)<\/td><td>Präsensstamm + <span class=\"la\">-ns, -ntis<\/span><\/td><td><span class=\"la\">laudans, laudantis<\/span><\/td><td>lobend<\/td><td>gleichzeitig<\/td><\/tr><tr><td>Perfekt Passiv (PPP)<\/td><td>Supinstamm + <span class=\"la\">-us, -a, -um<\/span><\/td><td><span class=\"la\">laudatus<\/span><\/td><td>gelobt<\/td><td>vorzeitig<\/td><\/tr><tr><td>Futur Aktiv (PFA)<\/td><td>Supinstamm + <span class=\"la\">-urus, -a, -um<\/span><\/td><td><span class=\"la\">laudaturus<\/span><\/td><td>einer, der loben wird<\/td><td>nachzeitig<\/td><\/tr><\/table><\/div>\n<p>Das PPA geht nach der dritten Deklination wie ein einendiges Adjektiv: <span class=\"la\">laudans, laudantis, laudanti, laudantem, laudante<\/span>; Plural <span class=\"la\">laudantes, laudantium<\/span>. In der i- und der gemischten Konjugation lautet es <span class=\"la\">audiens<\/span>, <span class=\"la\">capiens<\/span>.<\/p>\n<p>Es gibt <b>kein<\/b> Partizip Präsens Passiv und <b>kein<\/b> Partizip Perfekt Aktiv (außer bei Deponentia). Für „nachdem er gelobt hatte“ muss das Lateinische deshalb einen Umweg nehmen, meist den Ablativus absolutus.<\/p>\n<p>Partizipien sind Verb und Adjektiv zugleich. Sie richten sich in KNG nach einem Bezugswort und können selbst Objekte bei sich haben: <span class=\"la\">puer librum legens<\/span> – „der Bub, der ein Buch liest“.<\/p>\n<h3>PFA mit esse<\/h3>\n<p>Das Partizip Futur mit einer Form von <span class=\"la\">esse<\/span> drückt aus, dass jemand etwas vorhat oder dass etwas unmittelbar bevorsteht: <span class=\"la\">Scripturus sum.<\/span> – „Ich will schreiben“, „Ich bin im Begriff zu schreiben.“ Berühmt ist der Gruß der Gladiatoren: <span class=\"la\">Morituri te salutant.<\/span> – „Die, die sterben werden, grüßen dich.“<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Infinitive bilden<\/h4><div class=\"task\">Bilde alle gebräuchlichen Infinitive von <span class=\"la\">capere, capio, cepi, captum<\/span>.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Präsens Aktiv: <span class=\"la\">capere<\/span> (fangen).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Präsens Passiv: gemischte Konjugation, also bloßes <span class=\"la\">-i<\/span>: <span class=\"la\">capi<\/span> (gefangen werden).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Perfekt Aktiv: Perfektstamm <span class=\"la\">cep-<\/span> + <span class=\"la\">-isse<\/span>: <span class=\"la\">cepisse<\/span> (gefangen haben).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Perfekt Passiv: PPP + <span class=\"la\">esse<\/span>: <span class=\"la\">captum esse<\/span> (gefangen worden sein).<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Futur Aktiv: Supinstamm <span class=\"la\">capt-<\/span> + <span class=\"la\">-urum esse<\/span>: <span class=\"la\">capturum esse<\/span> (fangen werden).<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"kasus1","t":"Kasuslehre I: Akkusativ, Genitiv und Dativ","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["die besonderen Aufgaben von Akkusativ, Genitiv und Dativ erkennen","Genitivus subiectivus und obiectivus unterscheiden","den Dativ des Besitzers und den doppelten Dativ übersetzen","zu jedem Kasus die richtige deutsche Wendung finden"],"ex":[{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Mihi multi amici sunt.<\/span>?","s":"Dativus possessivus: Der Besitzer steht im Dativ, das Besessene ist Subjekt zu <span class=\"la\">esse<\/span>. Im Deutschen wird daraus „haben“.","o":["Ich habe viele Freunde.","Viele Freunde sind bei mir.","Ich bin vielen ein Freund.","Viele Freunde gehören zu mir."]},{"type":"mc","q":"Welche Übersetzung von <span class=\"la\">spes victoriae<\/span> ist richtig?","s":"Genitivus obiectivus: Der Sieg ist das, worauf sich die Hoffnung richtet. Im Deutschen steht eine Präposition.","o":["die Hoffnung auf den Sieg","die Hoffnung des Sieges","der hoffnungsvolle Sieg","der Sieg der Hoffnung"]},{"type":"mc","q":"Welche Kasusfunktion hat <span class=\"la\">Romam<\/span> in <span class=\"la\">Legati Romam veniunt.<\/span>?","s":"Bei Städtenamen steht die Richtung ohne Präposition im bloßen Akkusativ: „Die Gesandten kommen nach Rom.“","o":["Akkusativ der Richtung","Akkusativobjekt","doppelter Akkusativ","Akkusativ der Ausdehnung"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Romani Ciceronem patrem patriae appellaverunt.<\/span>?","s":"Doppelter Akkusativ bei <span class=\"la\">appellare<\/span>: <span class=\"la\">Ciceronem<\/span> ist das Objekt, <span class=\"la\">patrem<\/span> die Bezeichnung. <span class=\"la\">patriae<\/span> ist Genitiv dazu.","o":["Die Römer nannten Cicero Vater des Vaterlandes.","Die Römer riefen Cicero und den Vater des Vaterlandes.","Cicero nannte die Römer Väter des Vaterlandes.","Die Römer nannten den Vater Ciceros Vaterland."]},{"type":"mc","q":"Welcher Genitiv liegt in <span class=\"la\">nihil novi<\/span> vor?","s":"Nach Mengenangaben und Neutra wie <span class=\"la\">nihil, aliquid, multum, plus, satis<\/span> steht das Ganze im Genitiv: wörtlich „nichts des Neuen“, deutsch „nichts Neues“.","o":["Genitivus partitivus","Genitivus possessivus","Genitivus qualitatis","Genitivus obiectivus"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Caesar legionem auxilio misit.<\/span>?","s":"<span class=\"la\">auxilio<\/span> ist ein Dativus finalis und gibt den Zweck an. <span class=\"la\">legionem<\/span> ist das Akkusativobjekt.","o":["Caesar schickte eine Legion zu Hilfe.","Caesar schickte der Legion Hilfe.","Caesar schickte mit Hilfe einer Legion.","Die Legion schickte Caesar Hilfe."]},{"type":"self","q":"Übersetze: <span class=\"la\">Hic vir magnae sapientiae omnibus civibus saluti fuit.<\/span> (sapientia = Weisheit; salus = Rettung)","s":"„Dieser Mann von großer Weisheit war die Rettung für alle Bürger.“ Freier: „… rettete alle Bürger.“ <span class=\"la\">magnae sapientiae<\/span> ist Genitivus qualitatis, <span class=\"la\">omnibus civibus saluti<\/span> ein doppelter Dativ."},{"type":"self","q":"Übersetze: <span class=\"la\">Sapientis est tempori parcere.<\/span> (sapiens = der Weise; parcere mit Dativ = schonen, sparsam umgehen mit)","s":"„Es ist Zeichen (Aufgabe) eines Weisen, mit der Zeit sparsam umzugehen.“ <span class=\"la\">sapientis<\/span> ist Genitiv bei <span class=\"la\">esse<\/span>, <span class=\"la\">tempori<\/span> Dativ bei <span class=\"la\">parcere<\/span>."}],"gen":[],"html":"<h3>Warum Kasuslehre?<\/h3>\n<p>Die Grundfunktionen kennst du: Akkusativ als Objekt, Genitiv für die Zugehörigkeit, Dativ für den Empfänger. Jeder Fall kann aber mehr. Auf der Seite zur Zentralmatura findest du die wichtigsten Sonderfunktionen als Merkliste. Dieses Kapitel erklärt sie der Reihe nach und lässt dich üben, bis du sie im Satz erkennst.<\/p>\n<p>Die lateinischen Namen sind nur Etiketten. Wichtig ist, dass du die passende <b>deutsche Wendung<\/b> findest.<\/p>\n<h3>Akkusativ<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Funktion<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>Richtung (wohin?)<\/td><td><span class=\"la\">Romam ire<\/span>, <span class=\"la\">domum redire<\/span><\/td><td>nach Rom gehen, nach Hause zurückkehren<\/td><\/tr><tr><td>Ausdehnung in Raum und Zeit (wie lang? wie weit?)<\/td><td><span class=\"la\">tres annos regnare<\/span>, <span class=\"la\">decem pedes altus<\/span><\/td><td>drei Jahre (lang) regieren, zehn Fuß hoch<\/td><\/tr><tr><td>doppelter Akkusativ<\/td><td><span class=\"la\">Ciceronem consulem creare<\/span><\/td><td>Cicero zum Konsul wählen<\/td><\/tr><tr><td><\/td><td><span class=\"la\">pueros litteras docere<\/span><\/td><td>die Kinder das Schreiben lehren<\/td><\/tr><tr><td>Ausruf<\/td><td><span class=\"la\">Me miserum!<\/span><\/td><td>Ich Armer!<\/td><\/tr><\/table><\/div>\n<p>Beim doppelten Akkusativ nach Verben wie <span class=\"la\">appellare, nominare, creare, putare, habere<\/span> übersetzt du den zweiten Akkusativ mit „als“, „zu“ oder „für“: <span class=\"la\">Te amicum puto.<\/span> – „Ich halte dich für einen Freund.“<\/p>\n<h3>Genitiv<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Name<\/th><th>Funktion<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>possessivus<\/td><td>Besitzer<\/td><td><span class=\"la\">domus patris<\/span><\/td><td>das Haus des Vaters<\/td><\/tr><tr><td>partitivus<\/td><td>das Ganze, von dem ein Teil genannt wird<\/td><td><span class=\"la\">pars militum<\/span>, <span class=\"la\">nihil novi<\/span>, <span class=\"la\">quis vestrum?<\/span><\/td><td>ein Teil der Soldaten, nichts Neues, wer von euch?<\/td><\/tr><tr><td>qualitatis<\/td><td>Eigenschaft (mit Adjektiv)<\/td><td><span class=\"la\">vir magnae virtutis<\/span><\/td><td>ein Mann von großer Tapferkeit<\/td><\/tr><tr><td>pretii<\/td><td>Wert<\/td><td><span class=\"la\">magni aestimare<\/span><\/td><td>hoch schätzen<\/td><\/tr><tr><td>subiectivus<\/td><td>der, von dem ein Gefühl ausgeht<\/td><td><span class=\"la\">amor matris<\/span><\/td><td>die Liebe der Mutter (sie liebt)<\/td><\/tr><tr><td>obiectivus<\/td><td>das Ziel eines Gefühls<\/td><td><span class=\"la\">amor matris<\/span><\/td><td>die Liebe zur Mutter (sie wird geliebt)<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">amor patriae<\/span> heißt nicht „die Liebe des Vaterlands“, sondern „die Liebe <b>zum<\/b> Vaterland“. <span class=\"la\">metus mortis<\/span> ist „die Furcht <b>vor<\/b> dem Tod“, <span class=\"la\">spes pacis<\/span> „die Hoffnung <b>auf<\/b> Frieden“. Beim Genitivus obiectivus brauchst du im Deutschen fast immer eine Präposition. Frage dich bei Substantiven, die ein Gefühl oder eine Handlung ausdrücken: Wer tut hier etwas, und worauf richtet es sich?<\/div>\n<p>Der Genitiv steht außerdem bei <span class=\"la\">esse<\/span> in der Bedeutung „es ist Aufgabe von“, „es ist Zeichen von“: <span class=\"la\">Iudicis est verum quaerere.<\/span> – „Es ist Aufgabe eines Richters, die Wahrheit zu suchen.“<\/p>\n<h3>Dativ<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Name<\/th><th>Funktion<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>commodi<\/td><td>für wen? zu wessen Vorteil oder Nachteil?<\/td><td><span class=\"la\">Non scholae, sed vitae discimus.<\/span><\/td><td>Nicht für die Schule, sondern für das Leben lernen wir.<\/td><\/tr><tr><td>possessivus<\/td><td>Besitzer bei <span class=\"la\">esse<\/span><\/td><td><span class=\"la\">Mihi liber est.<\/span><\/td><td>Ich habe ein Buch. (wörtlich: Mir ist ein Buch.)<\/td><\/tr><tr><td>finalis<\/td><td>Zweck, Wirkung<\/td><td><span class=\"la\">auxilio venire<\/span><\/td><td>zu Hilfe kommen<\/td><\/tr><tr><td>auctoris<\/td><td>Urheber beim Gerundiv<\/td><td><span class=\"la\">Mihi laborandum est.<\/span><\/td><td>Ich muss arbeiten.<\/td><\/tr><tr><td>doppelter Dativ<\/td><td>Person + Zweck<\/td><td><span class=\"la\">Hoc mihi curae est.<\/span><\/td><td>Das macht mir Sorge.<\/td><\/tr><\/table><\/div>\n<p>Der <b>doppelte Dativ<\/b> verbindet einen Dativ der Person mit einem Dativ des Zwecks. Häufige Wendungen: <span class=\"la\">alicui auxilio venire<\/span> (jemandem zu Hilfe kommen), <span class=\"la\">alicui usui esse<\/span> (jemandem nützlich sein), <span class=\"la\">alicui cordi esse<\/span> (jemandem am Herzen liegen), <span class=\"la\">alicui saluti esse<\/span> (jemandem zur Rettung gereichen, jemanden retten).<\/p>\n<p>Einige Verben haben im Lateinischen den Dativ, im Deutschen den Akkusativ. Lerne sie mit ihrem Fall: <span class=\"la\">parcere<\/span> (schonen), <span class=\"la\">persuadere<\/span> (überreden, überzeugen), <span class=\"la\">studere<\/span> (sich bemühen um), <span class=\"la\">invidere<\/span> (beneiden), <span class=\"la\">nubere<\/span> (heiraten, von der Frau gesagt).<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Kasusfunktion bestimmen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Timor hostium magnus erat.<\/span> Welche zwei Bedeutungen sind möglich?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat <span class=\"la\">erat<\/span>, Subjekt <span class=\"la\">timor<\/span> (Furcht), Prädikatsnomen <span class=\"la\">magnus<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">hostium<\/span> ist Genitiv Plural und hängt von <span class=\"la\">timor<\/span> ab. <span class=\"la\">timor<\/span> bezeichnet ein Gefühl. Also kommen subiectivus und obiectivus in Frage.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Subiectivus: Die Feinde fürchten sich. „Die Furcht der Feinde war groß.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Obiectivus: Jemand fürchtet die Feinde. „Die Furcht vor den Feinden war groß.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Beides ist grammatisch richtig. Entscheiden kann nur der Zusammenhang: Wer hat im Text gerade Grund, sich zu fürchten?<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"kasus2","t":"Kasuslehre II: Ablativ, Präpositionen, Orts- und Zeitangaben","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["die drei Wurzeln des Ablativs und seine wichtigsten Funktionen unterscheiden","für jeden bloßen Ablativ die passende deutsche Präposition finden","Präpositionen mit Akkusativ und mit Ablativ zuordnen","Ortsangaben bei Städtenamen richtig übersetzen"],"ex":[{"type":"mc","q":"Welche Funktion hat <span class=\"la\">gladiis<\/span> in <span class=\"la\">Milites gladiis pugnant.<\/span>?","s":"Womit kämpfen sie? „Die Soldaten kämpfen mit Schwertern.“ Das Mittel steht im bloßen Ablativ.","o":["Ablativ des Mittels","Ablativ der Trennung","Ablativ des Ortes","Dativobjekt"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">multo melior<\/span>?","s":"Ablativ des Maßes beim Komparativ: „um vieles besser“, also „viel besser“. Ebenso <span class=\"la\">paulo maior<\/span> (ein wenig größer).","o":["viel besser","durch vieles besser gemacht","der bessere von vielen","besser als viele"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">in urbem<\/span>?","s":"<span class=\"la\">in<\/span> mit Akkusativ antwortet auf „wohin?“. „In der Stadt“ wäre <span class=\"la\">in urbe<\/span> mit Ablativ.","o":["in die Stadt","in der Stadt","aus der Stadt","bei der Stadt"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">Romae<\/span> in <span class=\"la\">Cicero Romae vivebat.<\/span>?","s":"Lokativ eines Städtenamens auf die Frage „wo?“: „Cicero lebte in Rom.“","o":["in Rom","nach Rom","von Rom","für Rom"]},{"type":"mc","q":"Mit welchem Fall steht die Präposition <span class=\"la\">sine<\/span>?","s":"<span class=\"la\">sine ira et studio<\/span> – „ohne Zorn und Eifer“ (Tacitus), beide Substantive stehen im Ablativ.","o":["mit dem Ablativ","mit dem Akkusativ","mit dem Genitiv","mit Akkusativ oder Ablativ"]},{"type":"mc","q":"Welche Funktion hat <span class=\"la\">prima luce<\/span> in <span class=\"la\">Prima luce profecti sunt.<\/span>?","s":"Wann brachen sie auf? „Beim ersten Licht“, also „bei Tagesanbruch“.","o":["Ablativ der Zeit","Ablativ des Mittels","Ablativ der Art und Weise","Ablativ des Vergleichs"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Athenis venit.<\/span>?","h":"<span class=\"la\">Athenae<\/span> ist ein Pluralwort. Bei einem Verb der Bewegung ist „woher?“ gefragt.","s":"<span class=\"la\">Athenis<\/span> kann „in Athen“ oder „aus Athen“ heißen. Bei <span class=\"la\">venire<\/span> passt nur die Herkunft. „Nach Athen“ wäre der Akkusativ <span class=\"la\">Athenas<\/span>.","o":["Er kommt aus Athen.","Er kommt nach Athen.","Er kommt mit den Athenern.","Er kommt für Athen."]},{"type":"self","q":"Übersetze: <span class=\"la\">Caesar magno cum periculo flumen transiit et paucis diebus in Italiam pervenit.<\/span> (flumen = Fluss; pauci = wenige)","s":"„Caesar überschritt unter großer Gefahr den Fluss und gelangte in wenigen Tagen nach Italien.“ <span class=\"la\">magno cum periculo<\/span> gibt die Begleitumstände an, <span class=\"la\">paucis diebus<\/span> ist Ablativ der Zeit (innerhalb welcher Zeit?), <span class=\"la\">in Italiam<\/span> Richtung."}],"gen":[],"html":"<h3>Drei Fälle in einem<\/h3>\n<p>Der Ablativ ist aus drei alten Fällen zusammengewachsen. Wenn du das weißt, findest du fast immer die richtige Übersetzung. Stelle die drei Fragen der Reihe nach:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wurzel<\/th><th>Frage<\/th><th>Funktionen<\/th><\/tr><tr><td><b>Womit?<\/b> (Instrumental)<\/td><td>womit? wodurch? wie?<\/td><td>Mittel, Art und Weise, Begleitung, Grund, Maß<\/td><\/tr><tr><td><b>Woher?<\/b> (Trennung)<\/td><td>woher? wovon?<\/td><td>Trennung, Herkunft, Vergleich<\/td><\/tr><tr><td><b>Wo? Wann?<\/b> (Ort und Zeit)<\/td><td>wo? wann?<\/td><td>Ort, Zeitpunkt<\/td><\/tr><\/table><\/div>\n<h3>Die wichtigsten Funktionen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Name<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>instrumenti (Mittel)<\/td><td><span class=\"la\">gladio pugnare<\/span><\/td><td>mit dem Schwert kämpfen<\/td><\/tr><tr><td>modi (Art und Weise)<\/td><td><span class=\"la\">magna voce clamare<\/span><\/td><td>mit lauter Stimme rufen<\/td><\/tr><tr><td>causae (Grund)<\/td><td><span class=\"la\">metu fugere<\/span>, <span class=\"la\">ira commotus<\/span><\/td><td>aus Furcht fliehen, von Zorn bewegt<\/td><\/tr><tr><td>mensurae (Maß des Unterschieds)<\/td><td><span class=\"la\">multo maior<\/span>, <span class=\"la\">paulo post<\/span><\/td><td>viel größer, wenig später<\/td><\/tr><tr><td>limitationis (Hinsicht)<\/td><td><span class=\"la\">virtute superare<\/span><\/td><td>an Tapferkeit übertreffen<\/td><\/tr><tr><td>qualitatis (Eigenschaft)<\/td><td><span class=\"la\">vir summo ingenio<\/span><\/td><td>ein Mann von höchster Begabung<\/td><\/tr><tr><td>separativus (Trennung)<\/td><td><span class=\"la\">metu liberare<\/span>, <span class=\"la\">urbe expellere<\/span><\/td><td>von Furcht befreien, aus der Stadt vertreiben<\/td><\/tr><tr><td>comparationis (Vergleich)<\/td><td><span class=\"la\">luce clarior<\/span><\/td><td>heller als das Licht<\/td><\/tr><tr><td>loci (Ort)<\/td><td><span class=\"la\">eo loco<\/span>, <span class=\"la\">terra marique<\/span><\/td><td>an diesem Ort, zu Wasser und zu Land<\/td><\/tr><tr><td>temporis (Zeit)<\/td><td><span class=\"la\">prima luce<\/span>, <span class=\"la\">eo anno<\/span><\/td><td>bei Tagesanbruch, in diesem Jahr<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Ein bloßer Ablativ ohne Präposition verlangt im Deutschen fast immer eine Präposition. Probiere in dieser Reihenfolge: „mit“ oder „durch“ – „von“ oder „aus“ – „in“, „an“ oder „bei“. Eine davon passt.<\/div>\n<h3>Präpositionen<\/h3>\n<p>Die meisten Präpositionen stehen mit dem <b>Akkusativ<\/b>. Mit dem <b>Ablativ<\/b> stehen nur wenige. Lerne diese, dann weißt du den Rest.<\/p>\n<div class=\"formula\">Mit Ablativ: <span class=\"la\">a/ab<\/span> (von), <span class=\"la\">cum<\/span> (mit), <span class=\"la\">de<\/span> (von … herab, über), <span class=\"la\">e/ex<\/span> (aus), <span class=\"la\">pro<\/span> (vor, für), <span class=\"la\">sine<\/span> (ohne), <span class=\"la\">prae<\/span> (vor)<\/div>\n<div class=\"formula\">Mit Akkusativ: <span class=\"la\">ad<\/span> (zu, bei), <span class=\"la\">ante<\/span> (vor), <span class=\"la\">apud<\/span> (bei), <span class=\"la\">contra<\/span> (gegen), <span class=\"la\">inter<\/span> (zwischen), <span class=\"la\">ob<\/span> (wegen), <span class=\"la\">per<\/span> (durch), <span class=\"la\">post<\/span> (nach), <span class=\"la\">propter<\/span> (wegen), <span class=\"la\">trans<\/span> (über … hinüber) und viele andere<\/div>\n<p><span class=\"la\">in<\/span> und <span class=\"la\">sub<\/span> stehen mit beiden Fällen, und der Fall ändert die Bedeutung:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>mit Akkusativ (wohin?)<\/th><th>mit Ablativ (wo?)<\/th><\/tr><tr><td><span class=\"la\">in<\/span><\/td><td><span class=\"la\">in urbem<\/span> – in die Stadt<\/td><td><span class=\"la\">in urbe<\/span> – in der Stadt<\/td><\/tr><tr><td><span class=\"la\">sub<\/span><\/td><td><span class=\"la\">sub montem<\/span> – unter den Berg (hin)<\/td><td><span class=\"la\">sub monte<\/span> – am Fuß des Berges<\/td><\/tr><\/table><\/div>\n<p><span class=\"la\">in<\/span> mit Akkusativ kann auch „gegen“ heißen: <span class=\"la\">oratio in Catilinam<\/span> – die Rede gegen Catilina.<\/p>\n<h3>Städtenamen und kleine Inseln<\/h3>\n<p>Bei Städtenamen, kleinen Inseln und bei <span class=\"la\">domus<\/span> und <span class=\"la\">rus<\/span> (Land) stehen die Ortsangaben <b>ohne Präposition<\/b>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Frage<\/th><th>Fall<\/th><th>Beispiele<\/th><\/tr><tr><td>wohin?<\/td><td>Akkusativ<\/td><td><span class=\"la\">Romam<\/span>, <span class=\"la\">Athenas<\/span>, <span class=\"la\">domum<\/span><\/td><\/tr><tr><td>woher?<\/td><td>Ablativ<\/td><td><span class=\"la\">Roma<\/span>, <span class=\"la\">Athenis<\/span>, <span class=\"la\">domo<\/span><\/td><\/tr><tr><td>wo?<\/td><td>Lokativ (bei Singular der a-/o-Dekl. wie Genitiv, sonst wie Ablativ)<\/td><td><span class=\"la\">Romae<\/span> in Rom, <span class=\"la\">Corinthi<\/span> in Korinth, <span class=\"la\">Athenis<\/span> in Athen, <span class=\"la\">Carthagine<\/span> in Karthago, <span class=\"la\">domi<\/span> zu Hause<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b><span class=\"la\">Romae<\/span> sieht aus wie Genitiv oder Dativ, heißt aber als Ortsangabe „in Rom“. <span class=\"la\">Roma<\/span> im Ablativ heißt „von Rom“, „aus Rom“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Den richtigen Ablativ finden<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Hostes metu perterriti nocte castris excesserunt.<\/span> (perterritus = erschreckt; castra, -orum = Lager; excedere = hinausgehen, verlassen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">excesserunt<\/span> (sie gingen hinaus). Subjekt: <span class=\"la\">hostes<\/span>, dazu das Partizip <span class=\"la\">perterriti<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Drei Ablative ohne Präposition: <span class=\"la\">metu<\/span>, <span class=\"la\">nocte<\/span>, <span class=\"la\">castris<\/span>. Stelle für jeden die drei Fragen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">metu<\/span> steht beim Partizip „erschreckt“. Wodurch erschreckt? Ablativ des Grundes: „von Furcht erschreckt“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">nocte<\/span> ist eine Zeitangabe. Wann? Ablativ der Zeit: „in der Nacht“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">castris<\/span> steht bei <span class=\"la\">excedere<\/span>, einem Verb der Bewegung weg von etwas. Woher? Ablativ der Trennung: „aus dem Lager“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Die Feinde verließen, von Furcht erschreckt, in der Nacht das Lager.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"aci","t":"AcI und NcI","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["einen AcI an seinen Auslösern erkennen und abgrenzen","das Zeitverhältnis des Infinitivs richtig wiedergeben","Reflexivpronomen im AcI korrekt beziehen","den NcI erkennen und flüssig übersetzen"],"ex":[{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Scio te verum dicere.<\/span> (verum = die Wahrheit)?","s":"<span class=\"la\">te<\/span> ist Subjektsakkusativ, <span class=\"la\">dicere<\/span> Infinitiv Präsens (gleichzeitig zu <span class=\"la\">scio<\/span>), <span class=\"la\">verum<\/span> das Objekt im AcI.","o":["Ich weiß, dass du die Wahrheit sagst.","Ich weiß, dir die Wahrheit zu sagen.","Ich weiß, dass du die Wahrheit gesagt hast.","Du weißt, dass ich die Wahrheit sage."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Dux putavit hostes fugisse.<\/span>?","h":"Der Infinitiv Perfekt drückt Vorzeitigkeit aus.","s":"<span class=\"la\">fugisse<\/span> ist vorzeitig zu <span class=\"la\">putavit<\/span>. Vor einem vergangenen Zeitpunkt liegt das Plusquamperfekt: „geflohen waren“.","o":["Der Anführer glaubte, dass die Feinde geflohen waren.","Der Anführer glaubte, dass die Feinde fliehen.","Der Anführer glaubte, dass die Feinde fliehen würden.","Die Feinde glaubten, dass der Anführer geflohen war."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Spero amicum venturum esse.<\/span>?","s":"<span class=\"la\">venturum esse<\/span> ist Infinitiv Futur Aktiv und drückt Nachzeitigkeit aus. Nach <span class=\"la\">sperare<\/span> (hoffen), <span class=\"la\">promittere<\/span> (versprechen) und <span class=\"la\">iurare<\/span> (schwören) steht er regelmäßig.","o":["Ich hoffe, dass der Freund kommen wird.","Ich hoffe, dass der Freund gekommen ist.","Ich hoffe, dass der Freund kommt und bleibt.","Der Freund hofft, dass ich kommen werde."]},{"type":"mc","q":"Auf wen bezieht sich <span class=\"la\">se<\/span> in <span class=\"la\">Marcus dicit Titum se laudavisse.<\/span>?","s":"<span class=\"la\">se<\/span> im AcI bezieht sich auf das Subjekt des übergeordneten Verbs, also auf Marcus: „Marcus sagt, dass Titus ihn (Marcus) gelobt hat.“","o":["auf Marcus","auf Titus","auf beide","auf eine dritte Person"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Romulus urbem Romam condidisse traditur.<\/span>?","s":"NcI: <span class=\"la\">Romulus<\/span> steht im Nominativ, das Verb des Sagens im Passiv. <span class=\"la\">condidisse<\/span> ist vorzeitig: „gegründet haben“.","o":["Romulus soll die Stadt Rom gegründet haben.","Romulus überliefert, die Stadt Rom gegründet zu haben.","Es wird Romulus überliefert, dass die Stadt Rom gegründet wurde.","Romulus wird die Stadt Rom gründen."]},{"type":"mc","q":"Welches Verb löst <b>keinen<\/b> AcI aus?","s":"Ein Verb der Bewegung kann keinen Aussageinhalt bei sich haben. Die drei anderen gehören zu den Verben des Meinens und Sagens beziehungsweise zu den unpersönlichen Ausdrücken.","o":["<span class=\"la\">currere<\/span> (laufen)","<span class=\"la\">putare<\/span> (meinen)","<span class=\"la\">constat<\/span> (es steht fest)","<span class=\"la\">negare<\/span> (verneinen)"]},{"type":"self","q":"Übersetze: <span class=\"la\">Legati nuntiaverunt Gallos pacem petere, sed arma non tradidisse.<\/span> (petere = erbitten; arma tradere = die Waffen ausliefern)","s":"„Die Gesandten meldeten, dass die Gallier um Frieden bäten, aber die Waffen nicht ausgeliefert hätten.“ Zwei Infinitive zum selben Subjektsakkusativ <span class=\"la\">Gallos<\/span>: <span class=\"la\">petere<\/span> gleichzeitig, <span class=\"la\">tradidisse<\/span> vorzeitig."},{"type":"self","q":"Übersetze: <span class=\"la\">Socrates sapientissimus omnium hominum fuisse dicitur.<\/span>","s":"„Sokrates soll der weiseste aller Menschen gewesen sein.“ Oder: „Man sagt, dass Sokrates der weiseste aller Menschen war.“ NcI mit <span class=\"la\">dicitur<\/span>; <span class=\"la\">omnium hominum<\/span> ist Genitivus partitivus beim Superlativ."}],"gen":[],"html":"<h3>Was ein AcI ist<\/h3>\n<p>Im Deutschen sagen wir: „Ich höre, <b>dass der Freund kommt<\/b>.“ Das Lateinische macht aus dem dass-Satz eine Konstruktion ohne Konjunktion:<\/p>\n<div class=\"formula\"><span class=\"la\">Audio amic<b class=\"e\">um<\/b> ven<b class=\"e\">ire<\/b>.<\/span><\/div>\n<p>Das Subjekt des dass-Satzes steht im <b>Akkusativ<\/b> (Subjektsakkusativ), sein Prädikat im <b>Infinitiv<\/b>. Die ganze Gruppe ist das Objekt zu <span class=\"la\">audio<\/span>. Auch im Deutschen gibt es das gelegentlich: „Ich höre den Freund kommen.“<\/p>\n<h3>Wann du einen AcI erwarten musst<\/h3>\n<p>Der AcI steht nach Verben des <b>Sagens, Meinens, Wissens und Wahrnehmens<\/b> und nach unpersönlichen Ausdrücken. Die Erkennungszeichen sind auf der Seite zur Zentralmatura zusammengefasst. Präge dir die häufigsten Auslöser ein:<\/p>\n<ul><li>sagen: <span class=\"la\">dicere, narrare, nuntiare, respondere, negare<\/span> (sagen, dass nicht), <span class=\"la\">tradere<\/span><\/li><li>meinen: <span class=\"la\">putare, credere, existimare, arbitrari, sperare<\/span><\/li><li>wissen und wahrnehmen: <span class=\"la\">scire, nescire, intellegere, cognoscere, videre, audire, sentire<\/span><\/li><li>wollen und befehlen: <span class=\"la\">velle, nolle, iubere<\/span> (befehlen), <span class=\"la\">vetare<\/span> (verbieten), <span class=\"la\">sinere<\/span> (lassen)<\/li><li>unpersönlich: <span class=\"la\">constat<\/span> (es steht fest), <span class=\"la\">apparet<\/span> (es ist offenkundig), <span class=\"la\">oportet<\/span> (es gehört sich), <span class=\"la\">necesse est<\/span>, <span class=\"la\">fama est<\/span><\/li><\/ul>\n<h3>Das Zeitverhältnis<\/h3>\n<p>Der Infinitiv nennt keine eigene Zeit, sondern ein Verhältnis zum übergeordneten Verb. Daraus ergibt sich die deutsche Zeit.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Infinitiv<\/th><th>Verhältnis<\/th><th><span class=\"la\">Dicit<\/span> … (Er sagt, …)<\/th><th><span class=\"la\">Dixit<\/span> … (Er sagte, …)<\/th><\/tr><tr><td>Präsens: <span class=\"la\">amicum venire<\/span><\/td><td>gleichzeitig<\/td><td>dass der Freund kommt<\/td><td>dass der Freund komme / kam<\/td><\/tr><tr><td>Perfekt: <span class=\"la\">amicum venisse<\/span><\/td><td>vorzeitig<\/td><td>dass der Freund gekommen ist<\/td><td>dass der Freund gekommen sei / war<\/td><\/tr><tr><td>Futur: <span class=\"la\">amicum venturum esse<\/span><\/td><td>nachzeitig<\/td><td>dass der Freund kommen wird<\/td><td>dass der Freund kommen werde<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der Infinitiv Präsens heißt nicht „Gegenwart“. Nach einem Hauptverb in der Vergangenheit bezeichnet er etwas, das <b>damals gleichzeitig<\/b> geschah. <span class=\"la\">Vidit hostes fugere.<\/span> – „Er sah, dass die Feinde flohen.“<\/div>\n<h3>Reflexivpronomen im AcI<\/h3>\n<p><span class=\"la\">se<\/span> und <span class=\"la\">suus<\/span> im AcI beziehen sich auf das <b>Subjekt des übergeordneten Verbs<\/b>, also auf den, der spricht oder denkt.<\/p>\n<div class=\"formula\"><span class=\"la\">Caesar dicit se venisse.<\/span> – Caesar sagt, dass <b>er<\/b> (selbst) gekommen ist.<\/div>\n<div class=\"formula\"><span class=\"la\">Caesar dicit eum venisse.<\/span> – Caesar sagt, dass <b>er<\/b> (ein anderer) gekommen ist.<\/div>\n<p>Weil das Deutsche beides mit „er“ wiedergibt, musst du den Bezug notfalls verdeutlichen: „dass er selbst“, „dass jener“.<\/p>\n<h3>Übersetzungsmöglichkeiten<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Möglichkeit<\/th><th>Beispiel für <span class=\"la\">Constat Romanos fortes fuisse.<\/span><\/th><\/tr><tr><td>dass-Satz<\/td><td>Es steht fest, dass die Römer tapfer waren.<\/td><\/tr><tr><td>Hauptsatz mit Einschub<\/td><td>Die Römer waren, wie feststeht, tapfer.<\/td><\/tr><tr><td>Präpositionalausdruck<\/td><td>Die Römer waren bekanntlich tapfer.<\/td><\/tr><tr><td>wörtlich (selten möglich)<\/td><td><span class=\"la\">Video eum venire.<\/span> – Ich sehe ihn kommen.<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: AcI Schritt für Schritt<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Nuntius narravit hostes urbem cepisse et cives fugere.<\/span> (nuntius = Bote)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat des Hauptsatzes: <span class=\"la\">narravit<\/span> (er erzählte). Subjekt: <span class=\"la\">nuntius<\/span>. Ein Verb des Sagens: Erwarte einen AcI.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Suche Infinitive: <span class=\"la\">cepisse<\/span> (Infinitiv Perfekt Aktiv von <span class=\"la\">capere<\/span>) und <span class=\"la\">fugere<\/span> (Infinitiv Präsens). Es sind zwei AcI, verbunden durch <span class=\"la\">et<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Erster AcI: Subjektsakkusativ <span class=\"la\">hostes<\/span>, Infinitiv <span class=\"la\">cepisse<\/span>, dazu das Objekt <span class=\"la\">urbem<\/span>. Zwei Akkusative! Der Sinn entscheidet, wer handelt: Feinde erobern Städte, nicht umgekehrt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zeitverhältnis: Infinitiv Perfekt = vorzeitig zu <span class=\"la\">narravit<\/span>: „dass die Feinde die Stadt erobert hatten“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Zweiter AcI: Subjektsakkusativ <span class=\"la\">cives<\/span>, Infinitiv <span class=\"la\">fugere<\/span>. Infinitiv Präsens = gleichzeitig: „dass die Bürger flohen“ (gerade auf der Flucht waren).<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Der Bote erzählte, dass die Feinde die Stadt erobert hatten und die Bürger auf der Flucht waren.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Der NcI<\/h3>\n<p>Steht ein Verb des Sagens oder Meinens im <b>Passiv<\/b>, wird aus dem Subjektsakkusativ ein Nominativ. Das ist der NcI (Nominativ mit Infinitiv).<\/p>\n<div class=\"formula\"><span class=\"la\">Homerus caecus fuisse dicitur.<\/span> – Homer soll blind gewesen sein. / Man sagt, dass Homer blind war.<\/div>\n<p>Typische Auslöser: <span class=\"la\">dicitur<\/span> (er soll), <span class=\"la\">traditur<\/span> / <span class=\"la\">fertur<\/span> (es wird überliefert, dass er), <span class=\"la\">putatur<\/span> (man glaubt, dass er), <span class=\"la\">videtur<\/span> (er scheint), <span class=\"la\">iubetur<\/span> (er erhält den Befehl), <span class=\"la\">vetatur<\/span> (ihm wird verboten).<\/p>\n<p>Die beste Übersetzung für <span class=\"la\">dicitur<\/span> ist fast immer <b>„soll“<\/b> oder ein Satz mit <b>„man“<\/b>. Die wörtliche Wiedergabe „er wird gesagt, blind gewesen zu sein“ ist kein Deutsch. <span class=\"la\">videri<\/span> übersetzt du mit „scheinen“: <span class=\"la\">Beatus esse videtur.<\/span> – „Er scheint glücklich zu sein.“<\/p>"},{"id":"pc","t":"Das Participium coniunctum","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["ein Partizip seinem Bezugswort zuordnen und die Partizipialgruppe abgrenzen","das Zeitverhältnis von PPA, PPP und PFA bestimmen","die passende Sinnrichtung wählen","ein Partizip auf fünf verschiedene Arten übersetzen"],"ex":[{"type":"mc","q":"Welches Zeitverhältnis drückt ein Partizip Perfekt Passiv aus?","s":"Das PPP bezeichnet eine Handlung, die vor der des Prädikats abgeschlossen war.","o":["Vorzeitigkeit","Gleichzeitigkeit","Nachzeitigkeit","keines"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Pueri ludentes clamant.<\/span> (ludere = spielen)?","s":"<span class=\"la\">ludentes<\/span> ist PPA, also gleichzeitig und aktiv: „während sie spielen“, „beim Spielen“, „spielend“.","o":["Die Buben schreien beim Spielen.","Die Buben schreien, nachdem sie gespielt haben.","Die Buben schreien, um zu spielen.","Die Buben werden beim Spielen angeschrien."]},{"type":"mc","q":"Welche Sinnrichtung passt in <span class=\"la\">Hostes multis proeliis victi tamen pacem non petiverunt.<\/span> (proelium = Schlacht; victus = besiegt)?","s":"<span class=\"la\">tamen<\/span> zeigt den Gegensatz: „Obwohl die Feinde in vielen Schlachten besiegt worden waren, baten sie dennoch nicht um Frieden.“","o":["konzessiv (obwohl)","kausal (weil)","konditional (wenn)","modal (indem)"]},{"type":"mc","q":"Zu welchem Wort gehört <span class=\"la\">missos<\/span> in <span class=\"la\">Caesar legatos ad se missos audivit.<\/span>?","h":"Bestimme Kasus, Numerus und Genus von <span class=\"la\">missos<\/span>.","s":"<span class=\"la\">missos<\/span> ist Akkusativ Plural maskulin wie <span class=\"la\">legatos<\/span>: „Caesar hörte die Gesandten an, die zu ihm geschickt worden waren.“","o":["zu <span class=\"la\">legatos<\/span>","zu <span class=\"la\">Caesar<\/span>","zu <span class=\"la\">se<\/span>","zu <span class=\"la\">audivit<\/span>"]},{"type":"mc","q":"Welche Übersetzung von <span class=\"la\">Milites urbem captam deleverunt.<\/span> ist <b>falsch<\/b>?","s":"<span class=\"la\">captam<\/span> ist PPP und daher vorzeitig. „Während“ würde Gleichzeitigkeit ausdrücken und passt nicht.","o":["Die Soldaten zerstörten die Stadt, während sie sie eroberten.","Die Soldaten zerstörten die eroberte Stadt.","Die Soldaten eroberten die Stadt und zerstörten sie.","Nach der Eroberung der Stadt zerstörten die Soldaten sie."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Dux milites hortatus signum dedit.<\/span> (signum dare = das Zeichen geben)?","h":"<span class=\"la\">hortari<\/span> ist ein Deponens.","s":"Das Partizip Perfekt eines Deponens ist aktiv: <span class=\"la\">hortatus<\/span> = „ermahnt habend“. Es gehört zu <span class=\"la\">dux<\/span> und hat <span class=\"la\">milites<\/span> als Objekt.","o":["Nachdem der Anführer die Soldaten ermahnt hatte, gab er das Zeichen.","Nachdem der Anführer von den Soldaten ermahnt worden war, gab er das Zeichen.","Während der Anführer ermahnt wurde, gaben die Soldaten das Zeichen.","Der Anführer gab den ermahnten Soldaten das Zeichen."]},{"type":"self","q":"Übersetze: <span class=\"la\">Graeci Troiam decem annos oppugnatam dolo ceperunt.<\/span> (dolus = List)","s":"„Die Griechen nahmen Troja, nachdem sie es zehn Jahre lang bestürmt hatten, durch eine List ein.“ Oder: „Die Griechen bestürmten Troja zehn Jahre lang und nahmen es dann durch eine List ein.“ <span class=\"la\">oppugnatam<\/span> gehört zu <span class=\"la\">Troiam<\/span>; <span class=\"la\">decem annos<\/span> ist Akkusativ der Zeitdauer; <span class=\"la\">dolo<\/span> Ablativ des Mittels."},{"type":"self","q":"Übersetze: <span class=\"la\">Multa pericula timentes cives urbem non reliquerunt.<\/span> (relinquere = verlassen)","s":"„Obwohl die Bürger viele Gefahren fürchteten, verließen sie die Stadt nicht.“ Kausal passt hier nicht, denn Furcht wäre ein Grund zu gehen und nicht zu bleiben. Der Sinn verlangt „obwohl“."}],"gen":[],"html":"<h3>Was das Partizip im Satz leistet<\/h3>\n<p>Ein Participium coniunctum (PC, „verbundenes Partizip“) ist ein Partizip, das sich in KNG auf ein Wort des Satzes bezieht und über dieses Wort eine <b>zusätzliche Aussage<\/b> macht. Das Lateinische packt damit einen ganzen Nebensatz in ein einziges Wort.<\/p>\n<div class=\"formula\"><span class=\"la\">Milites <b>vulnerati<\/b> in castra redierunt.<\/span> – Die Soldaten kehrten, <b>nachdem sie verwundet worden waren<\/b>, ins Lager zurück.<\/div>\n<p>Zum Partizip gehören oft weitere Wörter (Objekte, Adverbialien). Sie stehen meist zwischen Bezugswort und Partizip und bilden mit ihm die <b>Partizipialgruppe<\/b>. Grenze sie immer zuerst ab, bevor du übersetzt.<\/p>\n<h3>Das Zeitverhältnis<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Partizip<\/th><th>Zeitverhältnis zum Prädikat<\/th><th>Beispiel<\/th><\/tr><tr><td>Präsens Aktiv (<span class=\"la\">laudans<\/span>)<\/td><td>gleichzeitig, aktiv<\/td><td><span class=\"la\">puer ridens<\/span> – der lachende Bub; während er lacht<\/td><\/tr><tr><td>Perfekt Passiv (<span class=\"la\">laudatus<\/span>)<\/td><td>vorzeitig, passiv<\/td><td><span class=\"la\">urbs capta<\/span> – die eroberte Stadt; nachdem sie erobert worden war<\/td><\/tr><tr><td>Futur Aktiv (<span class=\"la\">laudaturus<\/span>)<\/td><td>nachzeitig, aktiv<\/td><td><span class=\"la\">morituri<\/span> – die, die sterben werden; um zu …<\/td><\/tr><\/table><\/div>\n<p>Bei Deponentia ist das Partizip Perfekt vorzeitig und <b>aktiv<\/b>: <span class=\"la\">hortatus<\/span> – nachdem er ermahnt hatte.<\/p>\n<h3>Die Sinnrichtungen<\/h3>\n<p>Das Partizip sagt nicht, wie die beiden Handlungen logisch zusammenhängen. Das musst du aus dem Zusammenhang erschließen und im Deutschen ausdrücken.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Sinnrichtung<\/th><th>Unterordnung<\/th><th>Beiordnung<\/th><\/tr><tr><td>temporal<\/td><td>als, während, nachdem<\/td><td>und dann, und danach<\/td><\/tr><tr><td>kausal<\/td><td>weil, da<\/td><td>und deshalb<\/td><\/tr><tr><td>konzessiv<\/td><td>obwohl<\/td><td>aber trotzdem, dennoch<\/td><\/tr><tr><td>konditional<\/td><td>wenn, falls<\/td><td>–<\/td><\/tr><tr><td>modal<\/td><td>indem, wobei<\/td><td>und dabei, und so<\/td><\/tr><\/table><\/div>\n<p>Ein <span class=\"la\">tamen<\/span> (dennoch) im Hauptsatz verrät den konzessiven Sinn. Bei einem verneinten Partizip passt oft „ohne zu“.<\/p>\n<h3>Fünf Wege ins Deutsche<\/h3>\n<p>Am Satz <span class=\"la\">Hostes urbem <b>captam<\/b> incenderunt.<\/span> (incendere = anzünden):<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Weg<\/th><th>Übersetzung<\/th><\/tr><tr><td>wörtlich als Attribut<\/td><td>Die Feinde zündeten die <b>eroberte<\/b> Stadt an.<\/td><\/tr><tr><td>Relativsatz<\/td><td>Die Feinde zündeten die Stadt, <b>die sie erobert hatten<\/b>, an.<\/td><\/tr><tr><td>Adverbialsatz<\/td><td><b>Nachdem<\/b> die Feinde die Stadt <b>erobert hatten<\/b>, zündeten sie sie an.<\/td><\/tr><tr><td>Beiordnung<\/td><td>Die Feinde <b>eroberten<\/b> die Stadt <b>und<\/b> zündeten sie (dann) an.<\/td><\/tr><tr><td>Präpositionalausdruck<\/td><td><b>Nach der Eroberung<\/b> der Stadt zündeten die Feinde sie an.<\/td><\/tr><\/table><\/div>\n<p>Die wörtliche Übersetzung ist ein guter erster Schritt, klingt aber bei längeren Gruppen hölzern. Adverbialsatz und Beiordnung sind fast immer möglich und in der Prüfung sicher.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Beim PPP darfst du im Deutschen ins Aktiv wechseln, wenn klar ist, wer gehandelt hat. Aus „die von den Feinden eroberte Stadt“ wird „die Stadt, die die Feinde erobert hatten“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein PC auflösen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Cicero a senatu laudatus tamen Roma discessit.<\/span> (discedere = weggehen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">discessit<\/span> (er ging weg). Subjekt: <span class=\"la\">Cicero<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Partizip: <span class=\"la\">laudatus<\/span>, Nominativ Singular maskulin. Es stimmt mit <span class=\"la\">Cicero<\/span> überein. Zur Gruppe gehört <span class=\"la\">a senatu<\/span> (vom Senat).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zeitverhältnis: PPP, also vorzeitig und passiv: „nachdem er gelobt worden war“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Sinnrichtung: Im Hauptsatz steht <span class=\"la\">tamen<\/span> (dennoch). Das ist ein klares Signal für konzessiv: „obwohl“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">Roma<\/span> ohne Präposition bei einem Verb des Weggehens: Ablativ der Trennung, „aus Rom“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Obwohl Cicero vom Senat gelobt worden war, verließ er dennoch Rom.“ Oder beigeordnet: „Cicero war vom Senat gelobt worden, ging aber trotzdem aus Rom weg.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: PC mit Partizip Präsens<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Senex in horto sedens puellis fabulam narrabat.<\/span> (senex = alter Mann; hortus = Garten; fabula = Geschichte)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">narrabat<\/span> (er erzählte). Subjekt: <span class=\"la\">senex<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Partizip: <span class=\"la\">sedens<\/span>, Nominativ Singular, passt zu <span class=\"la\">senex<\/span>. Zur Gruppe gehört <span class=\"la\">in horto<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zeitverhältnis: PPA, gleichzeitig. Sinnrichtung: temporal oder modal.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übersetzung: „Der alte Mann erzählte den Mädchen eine Geschichte, während er im Garten saß.“ Kürzer: „Der alte Mann saß im Garten und erzählte den Mädchen eine Geschichte.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"ablabs","t":"Der Ablativus absolutus","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["einen Ablativus absolutus erkennen und vom Participium coniunctum unterscheiden","Zeitverhältnis und Sinnrichtung bestimmen","den Abl. abs. mit Nebensatz, Hauptsatz oder Präpositionalausdruck übersetzen","nominale Wendungen wie Cicerone consule verstehen"],"ex":[{"type":"mc","q":"Woran erkennst du einen Ablativus absolutus?","s":"Substantiv (als Subjekt) und Partizip (als Prädikat) im Ablativ, vom Rest des Satzes grammatisch unabhängig.","o":["Ein Substantiv und ein dazu passendes Partizip stehen im Ablativ und bilden eine eigene Sinneinheit.","Ein Partizip steht im Nominativ beim Subjekt.","Ein Infinitiv steht bei einem Akkusativ.","Nach einem Komparativ steht ein Ablativ."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Troia capta Graeci domum navigaverunt.<\/span>?","s":"<span class=\"la\">Troia capta<\/span> ist Abl. abs. mit PPP, also vorzeitig. Im Aktiv: „Nachdem die Griechen Troja erobert hatten, …“","o":["Nachdem Troja erobert worden war, segelten die Griechen nach Hause.","Die Griechen segelten nach dem eroberten Troja nach Hause.","Während Troja erobert wurde, segelten die Griechen nach Hause.","Die Griechen eroberten Troja, während sie nach Hause segelten."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Augusto regnante<\/span> (regnare = herrschen)?","s":"PPA im Abl. abs., also gleichzeitig: „während Augustus herrschte“, kürzer „unter der Herrschaft des Augustus“.","o":["unter der Herrschaft des Augustus","nachdem Augustus geherrscht hatte","um Augustus zu beherrschen","durch den herrschenden Augustus"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Caesare duce<\/span>?","s":"Nominaler Abl. abs. ohne Partizip: „als Caesar Anführer war“.","o":["unter Caesars Führung","für den Anführer Caesar","Caesar führte","mit Caesar und dem Anführer"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">me invito<\/span>?","s":"<span class=\"la\">invitus<\/span> heißt „unwillig, ungern“. Wörtlich: „wobei ich unwillig bin“. „Ohne mein Wissen“ wäre <span class=\"la\">me ignaro<\/span> oder <span class=\"la\">me inscio<\/span>.","o":["gegen meinen Willen","auf meine Einladung","ohne mein Wissen","mit meiner Hilfe"]},{"type":"mc","q":"In welchem Satz liegt ein Ablativus absolutus vor?","h":"Suche ein Substantiv und ein Partizip, die beide im Ablativ stehen.","s":"<span class=\"la\">signo dato<\/span>: „Nachdem das Zeichen gegeben worden war, griffen die Soldaten an.“ Im zweiten Satz ist <span class=\"la\">datum<\/span> ein PC zu <span class=\"la\">signum<\/span> (Akkusativ), im dritten steht <span class=\"la\">signo<\/span> als Ablativ bei <span class=\"la\">uti<\/span>, im vierten ist <span class=\"la\">datum est<\/span> Perfekt Passiv.","o":["<span class=\"la\">Signo dato milites impetum fecerunt.<\/span>","<span class=\"la\">Milites signum datum viderunt.<\/span>","<span class=\"la\">Milites signo utuntur.<\/span>","<span class=\"la\">Signum a duce datum est.<\/span>"]},{"type":"self","q":"Übersetze: <span class=\"la\">Multis militibus vulneratis dux tamen proelium non intermisit.<\/span> (vulnerare = verwunden; intermittere = unterbrechen)","s":"„Obwohl viele Soldaten verwundet worden waren, unterbrach der Anführer dennoch die Schlacht nicht.“ <span class=\"la\">tamen<\/span> zeigt die konzessive Sinnrichtung."},{"type":"self","q":"Übersetze: <span class=\"la\">His rebus cognitis Caesar legatos ad se vocavit.<\/span>","s":"„Als Caesar das erfahren hatte, rief er die Gesandten zu sich.“ Wörtlich: „nachdem diese Dinge erfahren worden waren“. Weil Caesar selbst derjenige ist, der erfährt, wendet man ins Aktiv."}],"gen":[],"html":"<h3>Der Unterschied zum Participium coniunctum<\/h3>\n<p>Beim PC hängt das Partizip an einem Wort, das im Satz ohnehin eine Aufgabe hat (Subjekt, Objekt). Beim Ablativus absolutus hat die Partizipialgruppe ein <b>eigenes Subjekt<\/b>, das im restlichen Satz nicht vorkommt. Beide, Substantiv und Partizip, stehen im Ablativ. Die Gruppe ist vom Satz „losgelöst“ (<span class=\"la\">absolutus<\/span>) und gibt als Adverbiale die Umstände an.<\/p>\n<div class=\"formula\"><span class=\"la\"><b>Urbe capta<\/b> milites domum redierunt.<\/span> – Nachdem die Stadt erobert worden war, kehrten die Soldaten nach Hause zurück.<\/div>\n<p>So prüfst du: Stehen ein Substantiv und ein Partizip beide im Ablativ, passen sie in KNG zusammen, und lässt sich der Ablativ nicht anders erklären? Dann ist es ein Abl. abs. Das Substantiv ist sein Subjekt, das Partizip sein Prädikat.<\/p>\n<h3>Zeitverhältnis<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Partizip<\/th><th>Verhältnis<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>PPP<\/td><td>vorzeitig, passiv<\/td><td><span class=\"la\">hostibus victis<\/span><\/td><td>nachdem die Feinde besiegt worden waren<\/td><\/tr><tr><td>PPA<\/td><td>gleichzeitig, aktiv<\/td><td><span class=\"la\">sole oriente<\/span><\/td><td>während die Sonne aufgeht, bei Sonnenaufgang<\/td><\/tr><\/table><\/div>\n<p>Das PPA hat im Abl. abs. den Ablativ auf <span class=\"la\">-e<\/span>: <span class=\"la\">oriente<\/span>, <span class=\"la\">regnante<\/span>, <span class=\"la\">dormiente<\/span>.<\/p>\n<h3>Sinnrichtungen und Übersetzungswege<\/h3>\n<p>Die Sinnrichtungen sind dieselben wie beim PC: temporal, kausal, konzessiv, konditional, modal. Für die Übersetzung hast du drei Wege. Am Beispiel <span class=\"la\">Hostibus victis Caesar in Italiam rediit.<\/span>:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Weg<\/th><th>Übersetzung<\/th><\/tr><tr><td>Unterordnung<\/td><td><b>Nachdem<\/b> die Feinde besiegt worden waren, kehrte Caesar nach Italien zurück.<\/td><\/tr><tr><td>Beiordnung<\/td><td>Die Feinde waren besiegt worden, <b>und danach<\/b> kehrte Caesar nach Italien zurück.<\/td><\/tr><tr><td>Präpositionalausdruck<\/td><td><b>Nach dem Sieg<\/b> über die Feinde kehrte Caesar nach Italien zurück.<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Oft ist der Handelnde im Abl. abs. derselbe wie das Subjekt des Satzes. Dann darfst du ins Aktiv wenden: „Nachdem Caesar die Feinde besiegt hatte, kehrte er nach Italien zurück.“ Das ist besseres Deutsch und zeigt, dass du den Satz verstanden hast.<\/div>\n<h3>Der nominale Ablativus absolutus<\/h3>\n<p>Weil <span class=\"la\">esse<\/span> kein Partizip Präsens hat, gibt es Abl. abs. <b>ohne Partizip<\/b>. Sie bestehen aus zwei Nomina im Ablativ, zwischen denen man sich „seiend“ denkt.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wendung<\/th><th>Übersetzung<\/th><\/tr><tr><td><span class=\"la\">Cicerone consule<\/span><\/td><td>als Cicero Konsul war, unter dem Konsulat Ciceros<\/td><\/tr><tr><td><span class=\"la\">Caesare duce<\/span><\/td><td>unter Caesars Führung<\/td><\/tr><tr><td><span class=\"la\">patre vivo<\/span><\/td><td>zu Lebzeiten des Vaters<\/td><\/tr><tr><td><span class=\"la\">me invito<\/span><\/td><td>gegen meinen Willen<\/td><\/tr><tr><td><span class=\"la\">te auctore<\/span><\/td><td>auf deine Veranlassung<\/td><\/tr><tr><td><span class=\"la\">nobis ignaris<\/span><\/td><td>ohne unser Wissen<\/td><\/tr><\/table><\/div>\n<h3>Feste Wendungen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wendung<\/th><th>Übersetzung<\/th><\/tr><tr><td><span class=\"la\">his rebus cognitis<\/span><\/td><td>nachdem er das erfahren hatte<\/td><\/tr><tr><td><span class=\"la\">quibus rebus gestis<\/span><\/td><td>nach diesen Taten, danach<\/td><\/tr><tr><td><span class=\"la\">bello confecto<\/span><\/td><td>nach Beendigung des Krieges<\/td><\/tr><tr><td><span class=\"la\">signo dato<\/span><\/td><td>auf ein Zeichen hin<\/td><\/tr><tr><td><span class=\"la\">nullo resistente<\/span><\/td><td>ohne dass jemand Widerstand leistete<\/td><\/tr><tr><td><span class=\"la\">sole orto<\/span> / <span class=\"la\">prima luce<\/span><\/td><td>nach Sonnenaufgang / bei Tagesanbruch<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Abl. abs. erkennen und übersetzen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Caesar omnibus rebus paratis milites e castris eduxit.<\/span> (parare = vorbereiten; educere = herausführen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">eduxit<\/span> (er führte heraus). Subjekt: <span class=\"la\">Caesar<\/span>. Objekt: <span class=\"la\">milites<\/span>. Dazu <span class=\"la\">e castris<\/span> (aus dem Lager).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Es bleiben: <span class=\"la\">omnibus rebus paratis<\/span>. Alle drei Wörter stehen im Ablativ Plural und passen zusammen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">rebus<\/span> ist Substantiv, <span class=\"la\">paratis<\/span> ein PPP. Die Gruppe hat im übrigen Satz keine andere Aufgabe: Abl. abs.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zeitverhältnis: PPP, also vorzeitig. Wörtlich: „nachdem alle Dinge vorbereitet worden waren“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Wer hat vorbereitet? Caesar selbst. Also ins Aktiv wenden und <span class=\"la\">res<\/span> gut übersetzen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Nachdem Caesar alles vorbereitet hatte, führte er die Soldaten aus dem Lager.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: PC oder Abl. abs.?<\/h4><div class=\"task\">Vergleiche: (a) <span class=\"la\">Hostes victi fugerunt.<\/span> (b) <span class=\"la\">Hostibus victis Romani gaudebant.<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>(a): <span class=\"la\">victi<\/span> steht im Nominativ und passt zu <span class=\"la\">hostes<\/span>, dem Subjekt des Satzes. Das Partizip hängt an einem Satzglied: Participium coniunctum. „Die Feinde flohen, nachdem sie besiegt worden waren.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>(b): <span class=\"la\">hostibus victis<\/span> steht im Ablativ. Das Subjekt des Satzes ist ein anderes Wort: <span class=\"la\">Romani<\/span>. Die Gruppe hat ein eigenes Subjekt: Ablativus absolutus.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Übersetzung von (b): „Weil die Feinde besiegt worden waren, freuten sich die Römer.“ Hier passt der kausale Sinn am besten.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Merke: Gleiches Partizip, gleicher Inhalt. Der Unterschied liegt nur darin, ob das Bezugswort im Hauptsatz eine eigene Rolle spielt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"nd","t":"Gerundium und Gerundivum","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["nd-Formen erkennen und zwischen Gerundium und Gerundivum unterscheiden","das Gerundium als deklinierten Infinitiv übersetzen","das Gerundivum mit esse als Ausdruck der Notwendigkeit wiedergeben","Zweckangaben mit ad und causa erkennen"],"ex":[{"type":"mc","q":"Wie übersetzt man <span class=\"la\">ars amandi<\/span>?","s":"<span class=\"la\">amandi<\/span> ist Genitiv des Gerundiums und hängt von <span class=\"la\">ars<\/span> ab. <span class=\"la\">Ars amandi<\/span> ist auch der Titel eines Werks von Ovid.","o":["die Kunst des Liebens","die Kunst muss geliebt werden","die zu liebende Kunst","durch die Kunst lieben"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Pacta servanda sunt.<\/span> (pactum = Vertrag; servare = einhalten)?","s":"Gerundivum mit <span class=\"la\">esse<\/span> drückt eine Notwendigkeit aus. Der Satz ist ein Grundsatz des Rechts, der bis heute zitiert wird.","o":["Verträge müssen eingehalten werden.","Verträge werden eingehalten.","Verträge sind eingehalten worden.","Verträge einzuhalten ist schwierig."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Nobis fortiter pugnandum est.<\/span>?","s":"Unpersönliches Gerundivum im Neutrum mit <span class=\"la\">est<\/span>. <span class=\"la\">nobis<\/span> ist der Dativus auctoris und wird im Deutschen zum Subjekt.","o":["Wir müssen tapfer kämpfen.","Wir werden tapfer bekämpft.","Uns wird tapfer geholfen.","Es ist tapfer, für uns zu kämpfen."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Legati ad pacem petendam venerunt.<\/span>?","s":"<span class=\"la\">ad<\/span> mit nd-Form gibt den Zweck an. <span class=\"la\">petendam<\/span> ist Gerundivum und stimmt mit <span class=\"la\">pacem<\/span> überein.","o":["Die Gesandten kamen, um Frieden zu erbitten.","Die Gesandten kamen zum erbetenen Frieden.","Die Gesandten mussten um Frieden bitten.","Die Gesandten kamen, nachdem sie um Frieden gebeten hatten."]},{"type":"mc","q":"Welche Form ist <span class=\"la\">legendo<\/span> in <span class=\"la\">Legendo multa discimus.<\/span>?","s":"<span class=\"la\">legendo<\/span> steht ohne Bezugswort und gibt das Mittel an: „Durch Lesen lernen wir vieles.“ <span class=\"la\">multa<\/span> ist Akkusativ Plural Neutrum und Objekt zu <span class=\"la\">discimus<\/span>.","o":["Ablativ des Gerundiums","Dativ des Gerundivums zu <span class=\"la\">multa<\/span>","Partizip Präsens Aktiv","1. Person Singular Präsens"]},{"type":"mc","q":"In welchem Fall steht die handelnde Person beim Gerundivum mit <span class=\"la\">esse<\/span>?","s":"Dativus auctoris: <span class=\"la\">Mihi scribendum est.<\/span> – „Ich muss schreiben.“ Beim gewöhnlichen Passiv stünde dagegen <span class=\"la\">a/ab<\/span> mit Ablativ.","o":["im Dativ","im Ablativ mit <span class=\"la\">a/ab<\/span>","im Nominativ","im Genitiv"]},{"type":"self","q":"Übersetze: <span class=\"la\">Caesar navium parandarum causa in Galliam rediit.<\/span> (navis = Schiff; parare = beschaffen, bereitstellen)","s":"„Caesar kehrte nach Gallien zurück, um Schiffe zu beschaffen.“ <span class=\"la\">navium parandarum<\/span> ist Genitiv Plural (Gerundivum mit Bezugswort), abhängig vom nachgestellten <span class=\"la\">causa<\/span>."},{"type":"self","q":"Übersetze: <span class=\"la\">Omnibus hominibus moriendum est.<\/span> (mori = sterben)","s":"„Alle Menschen müssen sterben.“ Unpersönliches Gerundivum mit <span class=\"la\">est<\/span>; <span class=\"la\">omnibus hominibus<\/span> ist Dativus auctoris. Auch Deponentia bilden ein Gerundivum."}],"gen":[],"html":"<h3>Zwei Formen mit -nd-<\/h3>\n<p>Beide Formen haben das Kennzeichen <span class=\"la\">-nd-<\/span> am Präsensstamm: <span class=\"la\">lauda<b class=\"e\">nd<\/b>-<\/span>, <span class=\"la\">mone<b class=\"e\">nd<\/b>-<\/span>, <span class=\"la\">rege<b class=\"e\">nd<\/b>-<\/span>, <span class=\"la\">audie<b class=\"e\">nd<\/b>-<\/span>, <span class=\"la\">capie<b class=\"e\">nd<\/b>-<\/span>. Die Erkennungszeichen stehen auch auf der Seite zur Zentralmatura. Hier lernst du, die beiden sicher zu trennen und für jede Verwendung die richtige Übersetzung zu finden.<\/p>\n<h3>Das Gerundium: der deklinierte Infinitiv<\/h3>\n<p>Der Infinitiv kann Subjekt oder Objekt sein (<span class=\"la\">Errare humanum est.<\/span> – „Irren ist menschlich“). Für die übrigen Fälle springt das Gerundium ein. Es ist ein <b>Substantiv<\/b>, hat nur Singularformen und steht allein, ohne Bezugswort.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fall<\/th><th>Form<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>Genitiv<\/td><td><span class=\"la\">laudandi<\/span><\/td><td><span class=\"la\">ars scribendi<\/span><\/td><td>die Kunst des Schreibens<\/td><\/tr><tr><td>Genitiv mit <span class=\"la\">causa<\/span><\/td><td><span class=\"la\">laudandi causa<\/span><\/td><td><span class=\"la\">discendi causa<\/span><\/td><td>um zu lernen (des Lernens wegen)<\/td><\/tr><tr><td>Dativ (selten)<\/td><td><span class=\"la\">laudando<\/span><\/td><td>–<\/td><td>–<\/td><\/tr><tr><td>Akkusativ (nur nach Präposition)<\/td><td><span class=\"la\">ad laudandum<\/span><\/td><td><span class=\"la\">paratus ad pugnandum<\/span><\/td><td>bereit zum Kämpfen<\/td><\/tr><tr><td>Ablativ<\/td><td><span class=\"la\">laudando<\/span><\/td><td><span class=\"la\">docendo discimus<\/span><\/td><td>durch Lehren lernen wir<\/td><\/tr><\/table><\/div>\n<h3>Das Gerundivum: ein Adjektiv<\/h3>\n<p>Das Gerundivum hat alle Formen eines Adjektivs der a-/o-Deklination (<span class=\"la\">laudandus, -a, -um<\/span>) und stimmt in KNG mit einem <b>Bezugswort<\/b> überein. Es hat zwei Verwendungen.<\/p>\n<p><b>Erstens: anstelle eines Gerundiums mit Akkusativobjekt.<\/b> Statt <span class=\"la\">ad urbem delendum<\/span> sagt das Lateinische lieber <span class=\"la\">ad urbem delendam<\/span>. Übersetzt wird es genau wie ein Gerundium mit Objekt:<\/p>\n<div class=\"formula\"><span class=\"la\">ad urbem delendam<\/span> – um die Stadt zu zerstören, zur Zerstörung der Stadt<\/div>\n<div class=\"formula\"><span class=\"la\">libri legendi causa<\/span> – um das Buch zu lesen<\/div>\n<div class=\"formula\"><span class=\"la\">in pace petenda<\/span> – beim Erbitten des Friedens<\/div>\n<p><b>Zweitens: mit <span class=\"la\">esse<\/span> als Ausdruck der Notwendigkeit.<\/b> Das ist die wichtigste Verwendung.<\/p>\n<div class=\"formula\"><span class=\"la\">Liber legendus est.<\/span> – Das Buch muss gelesen werden.<\/div>\n<p>Verneint heißt es „darf nicht“: <span class=\"la\">Hoc non faciendum est.<\/span> – „Das darf man nicht tun.“ Die Person, die etwas tun muss, steht im <b>Dativ<\/b> (Dativus auctoris):<\/p>\n<div class=\"formula\"><span class=\"la\">Liber <b>mihi<\/b> legendus est.<\/span> – Ich muss das Buch lesen.<\/div>\n<p>Bei Verben ohne Akkusativobjekt steht das Gerundivum unpersönlich im Neutrum: <span class=\"la\">Nobis pugnandum est.<\/span> – „Wir müssen kämpfen.“<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>So unterscheidest du<\/th><th>Gerundium<\/th><th>Gerundivum<\/th><\/tr><tr><td>Wortart<\/td><td>Substantiv<\/td><td>Adjektiv<\/td><\/tr><tr><td>Bezugswort in KNG<\/td><td>keines<\/td><td>ja<\/td><\/tr><tr><td>Formen<\/td><td>nur <span class=\"la\">-ndi, -ndo, -ndum<\/span><\/td><td>alle Fälle, Zahlen, Geschlechter<\/td><\/tr><tr><td>Bedeutung<\/td><td>aktiv: das Loben<\/td><td>passiv: ein zu Lobender; muss gelobt werden<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Übersetze <span class=\"la\">Carthago delenda est<\/span> nicht mit „Karthago ist zu zerstören“ und schon gar nicht mit „Karthago wird zerstört“. Richtig und gut ist: „Karthago muss zerstört werden.“<\/div>\n<h3>Zweck ausdrücken<\/h3>\n<p>Zwei Wendungen mit nd-Formen bezeichnen den Zweck und werden mit „um zu“ übersetzt:<\/p>\n<ul><li><span class=\"la\">ad<\/span> + Akkusativ der nd-Form: <span class=\"la\">ad pacem petendam<\/span> – um Frieden zu erbitten<\/li><li>Genitiv der nd-Form + nachgestelltes <span class=\"la\">causa<\/span> oder <span class=\"la\">gratia<\/span>: <span class=\"la\">pacis petendae causa<\/span> – um Frieden zu erbitten<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Gerundivum mit esse<\/h4><div class=\"task\">Übersetze: <span class=\"la\">Militibus castra ante noctem munienda erant.<\/span> (munire = befestigen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">munienda erant<\/span>. Eine nd-Form mit einer Form von <span class=\"la\">esse<\/span>: Ausdruck der Notwendigkeit, hier in der Vergangenheit („mussten“).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">munienda<\/span> ist Nominativ Plural Neutrum und stimmt mit <span class=\"la\">castra<\/span> überein (ein Pluralwort im Neutrum). <span class=\"la\">castra<\/span> ist das Subjekt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Wörtlich: „Das Lager musste befestigt werden.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">militibus<\/span> ist Dativ: die Person, die handeln muss (Dativus auctoris).<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">ante noctem<\/span>: vor der Nacht.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Die Soldaten mussten das Lager vor der Nacht befestigen.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Gerundium oder Gerundivum?<\/h4><div class=\"task\">Bestimme die nd-Formen: (a) <span class=\"la\">cupiditas vincendi<\/span> (b) <span class=\"la\">cupiditas hostium vincendorum<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>(a): <span class=\"la\">vincendi<\/span> steht allein, ohne Bezugswort. Genitiv des Gerundiums: „das Verlangen zu siegen“, „die Gier nach dem Sieg“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>(b): <span class=\"la\">vincendorum<\/span> ist Genitiv Plural maskulin. Diese Form gibt es beim Gerundium gar nicht. Sie stimmt mit <span class=\"la\">hostium<\/span> überein: Gerundivum.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>Übersetzung von (b): „das Verlangen, die Feinde zu besiegen“. Du übersetzt aktiv mit Objekt, obwohl die Form ein passives Adjektiv ist.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"hauptsatz","t":"Hauptsätze: Konjunktiv, Fragen und Befehle","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["die Bedeutungen des Konjunktivs im Hauptsatz unterscheiden","Wunsch, Aufforderung, Möglichkeit und Unwirklichkeit richtig übersetzen","Satzfragen mit -ne, nonne und num deuten","Verbote und Doppelfragen erkennen"],"ex":[{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Gaudeamus igitur!<\/span> (igitur = also)?","s":"1. Person Plural Konjunktiv Präsens von <span class=\"la\">gaudere<\/span> (e-Konjugation, Kennzeichen <span class=\"la\">-ea-<\/span>): Hortativ. Der Indikativ wäre <span class=\"la\">gaudemus<\/span>.","o":["Lasst uns also fröhlich sein!","Wir sind also fröhlich.","Wir werden uns also freuen.","Sie sollen sich also freuen."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Utinam ne hoc fecisses!<\/span>?","s":"<span class=\"la\">utinam<\/span> mit Konjunktiv Plusquamperfekt ist ein unerfüllbarer Wunsch der Vergangenheit. Verneint wird mit <span class=\"la\">ne<\/span>.","o":["Hättest du das doch nicht getan!","Hoffentlich tust du das nicht!","Tu das nicht!","Du hast das nicht getan."]},{"type":"mc","q":"Welche Antwort erwartet, wer fragt: <span class=\"la\">Num me stultum putas?<\/span> (stultus = dumm)?","s":"<span class=\"la\">num<\/span> erwartet die Antwort Nein: „Hältst du mich etwa für dumm?“ Mit <span class=\"la\">nonne<\/span> würde der Sprecher ein Ja erwarten.","o":["Nein.","Ja.","Die Frage ist völlig offen.","Die Frage ist keine Frage, sondern ein Befehl."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Quid faciamus?<\/span>?","s":"Deliberativ: überlegende Frage im Konjunktiv Präsens. Der Indikativ wäre <span class=\"la\">facimus<\/span>, das Futur <span class=\"la\">faciemus<\/span>.","o":["Was sollen wir tun?","Was tun wir?","Was werden wir tun?","Was haben wir getan?"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Ne desperaveris!<\/span> (desperare = verzweifeln)?","s":"<span class=\"la\">ne<\/span> mit der 2. Person Konjunktiv Perfekt ist ein Verbot (Prohibitiv). Gleichbedeutend: <span class=\"la\">Noli desperare!<\/span>","o":["Verzweifle nicht!","Du hast nicht verzweifelt.","Du wirst nicht verzweifelt sein.","Wenn du doch nicht verzweifelt wärst!"]},{"type":"mc","q":"Welcher Satz ist ein Irrealis der Vergangenheit?","s":"Konjunktiv Plusquamperfekt: „Ich wäre gern gekommen.“ <span class=\"la\">venirem<\/span> wäre Irrealis der Gegenwart („Ich würde gern kommen“), <span class=\"la\">veniam<\/span> Futur oder Konjunktiv Präsens.","o":["<span class=\"la\">Libenter venissem.<\/span> (libenter = gern)","<span class=\"la\">Libenter veniam.<\/span>","<span class=\"la\">Libenter venirem.<\/span>","<span class=\"la\">Libenter veni.<\/span>"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Nonne vides?<\/span>?","s":"<span class=\"la\">nonne<\/span> erwartet Zustimmung: „Du siehst es doch, oder?“","o":["Siehst du denn nicht?","Siehst du etwa?","Du siehst nicht.","Sieh nicht hin!"]},{"type":"self","q":"Übersetze: <span class=\"la\">Audiatur et altera pars!<\/span> (alter, -a, -um = der andere; pars = Teil, Seite, Partei)","s":"„Auch die andere Seite soll gehört werden!“ Oder: „Man höre auch die Gegenseite!“ <span class=\"la\">audiatur<\/span> ist 3. Person Singular Konjunktiv Präsens Passiv: ein Jussiv. Der Satz ist ein Grundsatz jedes fairen Verfahrens."}],"gen":[],"html":"<h3>Der Konjunktiv im Hauptsatz hat immer eine Bedeutung<\/h3>\n<p>Im Gliedsatz steht der Konjunktiv oft nur, weil die Einleitung ihn verlangt, und wird dann im Deutschen mit dem Indikativ wiedergegeben. Im <b>Hauptsatz<\/b> ist das anders: Dort drückt er aus, dass etwas gewünscht, gewollt, möglich oder unwirklich ist. Die Übersicht auf der Seite zur Zentralmatura nennt die Arten kurz. Hier lernst du, sie am Tempus und an der Verneinung zu erkennen.<\/p>\n<h3>Wollen und Wünschen (Verneinung: ne)<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Name<\/th><th>Form<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>Hortativ (Aufforderung an „wir“)<\/td><td>1. Person Plural Konj. Präsens<\/td><td><span class=\"la\">Gaudeamus!<\/span><\/td><td>Lasst uns fröhlich sein!<\/td><\/tr><tr><td>Jussiv (Aufforderung an Dritte)<\/td><td>3. Person Konj. Präsens<\/td><td><span class=\"la\">Veniat!<\/span><\/td><td>Er soll kommen!<\/td><\/tr><tr><td>Prohibitiv (Verbot)<\/td><td><span class=\"la\">ne<\/span> + 2. Person Konj. Perfekt<\/td><td><span class=\"la\">Ne dixeris!<\/span><\/td><td>Sag nicht!<\/td><\/tr><tr><td>Optativ, erfüllbar<\/td><td>(<span class=\"la\">utinam<\/span>) + Konj. Präsens<\/td><td><span class=\"la\">Utinam veniat!<\/span><\/td><td>Hoffentlich kommt er!<\/td><\/tr><tr><td>Optativ, unerfüllbar (Gegenwart)<\/td><td><span class=\"la\">utinam<\/span> + Konj. Imperfekt<\/td><td><span class=\"la\">Utinam adesses!<\/span><\/td><td>Wärst du doch hier!<\/td><\/tr><tr><td>Optativ, unerfüllbar (Vergangenheit)<\/td><td><span class=\"la\">utinam<\/span> + Konj. Plusquamperfekt<\/td><td><span class=\"la\">Utinam venisses!<\/span><\/td><td>Wärst du doch gekommen!<\/td><\/tr><\/table><\/div>\n<h3>Möglichkeit und Unwirklichkeit (Verneinung: non)<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Name<\/th><th>Form<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td>Potentialis (Möglichkeit)<\/td><td>Konj. Präsens oder Perfekt<\/td><td><span class=\"la\">Dicat aliquis …<\/span><\/td><td>Es könnte jemand sagen …<\/td><\/tr><tr><td>Deliberativ (überlegende Frage)<\/td><td>1. Person Konj. Präsens<\/td><td><span class=\"la\">Quid faciam?<\/span><\/td><td>Was soll ich tun?<\/td><\/tr><tr><td>Irrealis der Gegenwart<\/td><td>Konj. Imperfekt<\/td><td><span class=\"la\">Venirem.<\/span><\/td><td>Ich würde kommen.<\/td><\/tr><tr><td>Irrealis der Vergangenheit<\/td><td>Konj. Plusquamperfekt<\/td><td><span class=\"la\">Venissem.<\/span><\/td><td>Ich wäre gekommen.<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Die Faustregel für den Hauptsatz: <b>Konjunktiv Präsens<\/b> bedeutet meist „soll“, „möge“, „lasst uns“ oder „könnte“. <b>Konjunktiv Imperfekt<\/b> bedeutet „würde“ oder „wäre“ (jetzt, aber leider nicht). <b>Konjunktiv Plusquamperfekt<\/b> bedeutet „hätte“ oder „wäre … gewesen“ (damals, aber leider nicht).<\/div>\n<h3>Fragesätze<\/h3>\n<p><b>Wortfragen<\/b> beginnen mit einem Fragewort: <span class=\"la\">quis?<\/span> (wer?), <span class=\"la\">quid?<\/span> (was?), <span class=\"la\">ubi?<\/span> (wo?), <span class=\"la\">quo?<\/span> (wohin?), <span class=\"la\">unde?<\/span> (woher?), <span class=\"la\">quando?<\/span> (wann?), <span class=\"la\">cur?<\/span> (warum?), <span class=\"la\">quomodo?<\/span> (wie?), <span class=\"la\">quot?<\/span> (wie viele?), <span class=\"la\">qualis?<\/span> (was für ein?), <span class=\"la\">quantus?<\/span> (wie groß?).<\/p>\n<p><b>Satzfragen<\/b> (Ja-Nein-Fragen) erkennst du an drei Signalen, die zeigen, welche Antwort der Sprecher erwartet:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Signal<\/th><th>Erwartete Antwort<\/th><th>Beispiel<\/th><th>Übersetzung<\/th><\/tr><tr><td><span class=\"la\">-ne<\/span> (angehängt)<\/td><td>offen<\/td><td><span class=\"la\">Venitne?<\/span><\/td><td>Kommt er?<\/td><\/tr><tr><td><span class=\"la\">nonne<\/span><\/td><td>ja<\/td><td><span class=\"la\">Nonne venit?<\/span><\/td><td>Kommt er denn nicht? Er kommt doch?<\/td><\/tr><tr><td><span class=\"la\">num<\/span><\/td><td>nein<\/td><td><span class=\"la\">Num venit?<\/span><\/td><td>Kommt er etwa?<\/td><\/tr><\/table><\/div>\n<p><b>Doppelfragen<\/b> stellen zwei Möglichkeiten zur Wahl: <span class=\"la\">utrum … an<\/span> oder <span class=\"la\">-ne … an<\/span>: <span class=\"la\">Utrum manes an abis?<\/span> – „Bleibst du oder gehst du?“<\/p>\n<h3>Befehl und Verbot<\/h3>\n<p>Befehle stehen im Imperativ (<span class=\"la\">Veni!<\/span>) oder für die dritte Person im Jussiv (<span class=\"la\">Veniat!<\/span>). Für das Verbot gibt es zwei gleichwertige Möglichkeiten: <span class=\"la\">Noli venire!<\/span> und <span class=\"la\">Ne veneris!<\/span> Beide heißen „Komm nicht!“<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Beim Prohibitiv steht der Konjunktiv <b>Perfekt<\/b>, gemeint ist aber die Gegenwart oder Zukunft. <span class=\"la\">Ne timueris!<\/span> heißt „Fürchte dich nicht!“ und nicht „Du hast dich nicht gefürchtet“.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Konjunktiv im Hauptsatz deuten<\/h4><div class=\"task\">Übersetze die drei Sätze: (a) <span class=\"la\">Amemus patriam!<\/span> (b) <span class=\"la\">Utinam pater viveret!<\/span> (c) <span class=\"la\">Quid dicerem?<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>(a): <span class=\"la\">amemus<\/span> ist 1. Person Plural Konjunktiv Präsens (a-Konjugation, a wird zu e). Aufforderung an „wir“: Hortativ. „Lasst uns die Heimat lieben!“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>(b): <span class=\"la\">utinam<\/span> kündigt einen Wunsch an. <span class=\"la\">viveret<\/span> ist Konjunktiv Imperfekt, also unerfüllbar in der Gegenwart: „Wenn doch der Vater (noch) lebte!“ Er lebt also nicht mehr.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>(c): Eine Frage in der 1. Person mit Konjunktiv ist eine überlegende Frage. Konjunktiv Imperfekt verlegt sie in die Vergangenheit: „Was hätte ich sagen sollen?“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"utnecum","t":"Gliedsätze mit ut, ne und cum","kl":"2","k":2,"a":"S","tag":"Aufbau","goals":["ut mit Indikativ und ut mit Konjunktiv unterscheiden","Final-, Konsekutiv- und Begehrsätze übersetzen","ne nach Verben des Fürchtens richtig wiedergeben","die Bedeutungen von cum am Modus und am Zusammenhang erkennen"],"ex":[{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Ut dixi, pater aegrotat.<\/span> (aegrotare = krank sein)?","s":"<span class=\"la\">dixi<\/span> ist Indikativ. <span class=\"la\">ut<\/span> mit Indikativ heißt „wie“ (oder „sobald“). Hier passt der Vergleich.","o":["Wie ich gesagt habe, ist der Vater krank.","Damit ich es sage: Der Vater ist krank.","Sodass ich sagte, der Vater sei krank.","Als ich es sagte, wurde der Vater krank."]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">Edimus, ut vivamus.<\/span> (edere = essen)?","s":"<span class=\"la\">vivamus<\/span> ist Konjunktiv Präsens, im Hauptsatz steht kein „so“-Wort: finaler Sinn. Bei gleichem Subjekt übersetzt man mit „um zu“.","o":["Wi
