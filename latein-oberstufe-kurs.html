e<\/span><\/td><td>zufällig<\/td><\/tr><tr><td><span class=\"la\">paene<\/span><\/td><td>fast<\/td><td><span class=\"la\">poena<\/span><\/td><td>Strafe<\/td><\/tr><tr><td><span class=\"la\">vix<\/span><\/td><td>kaum<\/td><td><span class=\"la\">vis<\/span><\/td><td>Kraft; du willst<\/td><\/tr><tr><td><span class=\"la\">alius<\/span><\/td><td>ein anderer<\/td><td><span class=\"la\">alter<\/span><\/td><td>der andere (von zweien)<\/td><\/tr><\/table><\/div>\n<h3>Mehrdeutige kleine Wörter<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wort<\/th><th>mögliche Bedeutungen<\/th><th>So entscheidest du<\/th><\/tr><tr><td><span class=\"la\">quam<\/span><\/td><td>„als“ (nach Komparativ) · „wie“ (im Ausruf und nach <span class=\"la\">tam<\/span>) · „möglichst“ (vor Superlativ) · „die, welche“ (Relativpronomen, Akk. Sg. f.)<\/td><td>Was steht davor oder danach: Komparativ, Superlativ, feminines Bezugswort?<\/td><\/tr><tr><td><span class=\"la\">quo<\/span><\/td><td>„wohin?“ · „damit dadurch, damit umso“ (vor Komparativ) · „durch den, mit dem“ (Relativpronomen im Ablativ) · <span class=\"la\">quo … eo<\/span>: „je … desto“<\/td><td>Steht ein Komparativ im Satz? Gibt es ein Bezugswort?<\/td><\/tr><tr><td><span class=\"la\">modo<\/span><\/td><td>„nur“ · „eben, gerade“ · „auf die Art“ (Ablativ von <span class=\"la\">modus<\/span>) · <span class=\"la\">modo … modo<\/span>: „bald … bald“<\/td><td>Steht ein Genitiv oder Adjektiv dabei, ist es <span class=\"la\">modus<\/span>.<\/td><\/tr><tr><td><span class=\"la\">ne<\/span><\/td><td>„damit nicht“, „dass nicht“ · „dass“ (nach Fürchten) · „nicht“ (Wunsch, Verbot) · <span class=\"la\">-ne<\/span>: Fragezeichen · <span class=\"la\">ne … quidem<\/span>: „nicht einmal“<\/td><td>Angehängt oder allein? Welches Verb regiert?<\/td><\/tr><tr><td><span class=\"la\">an<\/span><\/td><td>„oder“ (in Doppelfragen) · „ob nicht“ (nach <span class=\"la\">nescio, haud scio<\/span>)<\/td><td>Geht eine erste Frage voraus?<\/td><\/tr><tr><td><span class=\"la\">ut<\/span>, <span class=\"la\">cum<\/span>, <span class=\"la\">quod<\/span><\/td><td>siehe die eigenen Kapitel<\/td><td>Modus des Verbs<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Die Logik eines Absatzes lesen<\/h4><div class=\"task\">Bestimme, was die kleinen Wörter leisten: <span class=\"la\">Hostes diu restiterunt. Tandem autem fugerunt; nam ne duces quidem pugnare iam volebant.<\/span> (resistere = Widerstand leisten)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">diu<\/span>: lange. „Die Feinde leisteten lange Widerstand.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">tandem<\/span>: endlich (nicht <span class=\"la\">tamen<\/span> „dennoch“). <span class=\"la\">autem<\/span>: aber, nachgestellt. „Endlich aber flohen sie.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">nam<\/span>: denn. Es folgt die Begründung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">ne … quidem<\/span> umschließt das betonte Wort <span class=\"la\">duces<\/span>: „nicht einmal die Anführer“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">iam<\/span> mit Verneinung: „nicht mehr“.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Übersetzung: „Die Feinde leisteten lange Widerstand. Endlich aber flohen sie, denn nicht einmal die Anführer wollten mehr kämpfen.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"satzbau","t":"Lange Sätze knacken: die Einrückmethode","kl":"3","k":3,"a":"T","tag":"Lektüre","goals":["Haupt- und Gliedsätze in einem Satzgefüge voneinander trennen","die Einrückmethode anwenden","satzwertige Konstruktionen als eigene Einheiten behandeln","auch bei Sätzen über mehrere Zeilen den Überblick behalten"],"ex":[{"type":"mc","q":"Woran erkennst du am sichersten, wie viele Teilsätze ein Satzgefüge hat?","s":"Jeder Haupt- und Gliedsatz hat genau ein Prädikat. Beistriche setzen moderne Herausgeber, sie sind hilfreich, aber nicht verlässlich. Infinitive und Partizipien zählen nicht mit.","o":["an der Zahl der finiten Verbformen","an der Zahl der Beistriche","an der Zahl der Substantive im Nominativ","an der Länge des Satzes"]},{"type":"mc","q":"Wie viele Gliedsätze enthält <span class=\"la\">Milites, postquam urbem ceperunt, quae diu oppugnata erat, domum redierunt.<\/span>?","h":"Zähle die finiten Verben und ziehe den Hauptsatz ab.","s":"Drei finite Verben: <span class=\"la\">ceperunt<\/span>, <span class=\"la\">oppugnata erat<\/span>, <span class=\"la\">redierunt<\/span>. Hauptsatz ist <span class=\"la\">Milites … domum redierunt<\/span>. Gliedsätze: der <span class=\"la\">postquam<\/span>-Satz und der Relativsatz mit <span class=\"la\">quae<\/span>.","o":["zwei","einen","drei","keinen"]},{"type":"mc","q":"Welches ist das Prädikat des Hauptsatzes in <span class=\"la\">Cicero, cum Catilinam in senatu vidisset, orationem, quam omnes laudaverunt, habuit.<\/span>?","s":"<span class=\"la\">vidisset<\/span> gehört zum <span class=\"la\">cum<\/span>-Satz, <span class=\"la\">laudaverunt<\/span> zum Relativsatz. Übrig bleibt <span class=\"la\">Cicero … orationem … habuit<\/span>: „Cicero hielt eine Rede.“","o":["<span class=\"la\">habuit<\/span>","<span class=\"la\">vidisset<\/span>","<span class=\"la\">laudaverunt<\/span>","<span class=\"la\">vidisset<\/span> und <span class=\"la\">habuit<\/span> gemeinsam"]},{"type":"mc","q":"Auf welcher Stufe steht in der Einrückmethode ein Relativsatz, der von einem <span class=\"la\">cum<\/span>-Satz abhängt?","s":"Der Hauptsatz steht auf Stufe 0, der <span class=\"la\">cum<\/span>-Satz auf Stufe 1, und was von ihm abhängt, auf Stufe 2.","o":["auf Stufe 2","auf Stufe 1","auf Stufe 0","Er wird nicht eingerückt."]},{"type":"mc","q":"Zu welchem Wort gehört <span class=\"la\">multas<\/span> in <span class=\"la\">Multas Romani in Gallia urbes ceperunt.<\/span>?","s":"<span class=\"la\">multas<\/span> ist Akkusativ Plural feminin wie <span class=\"la\">urbes<\/span>. Die beiden Wörter umklammern den Rest des Satzes: „Die Römer nahmen in Gallien viele Städte ein.“","o":["zu <span class=\"la\">urbes<\/span>","zu <span class=\"la\">Romani<\/span>","zu <span class=\"la\">Gallia<\/span>","Es steht allein."]},{"type":"mc","q":"Was tust du zuerst, wenn ein Satz über vier Zeilen geht?","s":"Ohne Gliederung kein Verständnis. Erst wenn du weißt, wo der Hauptsatz liegt, lohnt sich der Griff zum Wörterbuch.","o":["die finiten Verben suchen und die Teilsätze abgrenzen","das erste Wort im Wörterbuch nachschlagen","von vorne Wort für Wort übersetzen","den längsten Teilsatz übersetzen"]},{"type":"self","q":"Gliedere nach der Einrückmethode und übersetze: <span class=\"la\">Legati, qui a Gallis missi erant, cum ad Caesarem venissent, dixerunt se pacem petere.<\/span>","s":"Hauptsatz: <span class=\"la\">Legati … dixerunt<\/span> + AcI <span class=\"la\">se pacem petere<\/span>. Stufe 1: <span class=\"la\">qui a Gallis missi erant<\/span> (Relativsatz zu <span class=\"la\">legati<\/span>). Stufe 1: <span class=\"la\">cum ad Caesarem venissent<\/span>. Übersetzung: „Als die Gesandten, die von den Galliern geschickt worden waren, zu Caesar gekommen waren, sagten sie, dass sie um Frieden bäten.“"},{"type":"self","q":"Gliedere und übersetze: <span class=\"la\">Hannibal, postquam Alpes transiit, quamquam multos milites amiserat, Romanos tribus proeliis vicit.<\/span> (amittere, amisi = verlieren)","s":"Hauptsatz: <span class=\"la\">Hannibal … Romanos tribus proeliis vicit<\/span>. Stufe 1: <span class=\"la\">postquam Alpes transiit<\/span>. Stufe 1: <span class=\"la\">quamquam multos milites amiserat<\/span>. Übersetzung: „Nachdem Hannibal die Alpen überquert hatte, besiegte er die Römer in drei Schlachten, obwohl er viele Soldaten verloren hatte.“"}],"gen":[],"html":"<h3>Das Problem<\/h3>\n<p>Cicero, Caesar und Livius schreiben oft Perioden: lange Sätze, in denen mehrere Gliedsätze und Konstruktionen ineinandergeschachtelt sind. Wer so einen Satz von links nach rechts liest, verliert nach der zweiten Zeile den Faden. Die Seite zur Zentralmatura zeigt das Übersetzen in acht Schritten. Dieses Kapitel gibt dir für den schwierigsten dieser Schritte, das Gliedern, ein grafisches Werkzeug.<\/p>\n<h3>Die Einrückmethode<\/h3>\n<p>Du schreibst den Satz neu, und zwar so, dass jeder Teilsatz eine eigene Zeile bekommt. Die Regeln:<\/p>\n<ul><li><b>Hauptsatz<\/b> ganz links.<\/li><li>Jeder <b>Gliedsatz<\/b> eine Stufe eingerückt, ein Gliedsatz, der von einem Gliedsatz abhängt, zwei Stufen.<\/li><li><b>Satzwertige Konstruktionen<\/b> (AcI, Abl. abs., längere Partizipialgruppen) bekommen ebenfalls eine eigene, eingerückte Zeile.<\/li><li>Wird ein Satz unterbrochen und später fortgesetzt, steht die Fortsetzung wieder auf <b>derselben Stufe<\/b>.<\/li><\/ul>\n<p>So findest du die Grenzen:<\/p>\n<ul><li>Ein Gliedsatz <b>beginnt<\/b> mit einer Subjunktion (<span class=\"la\">cum, ut, si, quod, postquam<\/span> …), einem Relativpronomen oder einem Fragewort.<\/li><li>Ein Gliedsatz <b>endet<\/b> meist mit seinem Prädikat. Im Lateinischen steht das Verb gern am Schluss.<\/li><li>Jeder Teilsatz hat <b>genau ein<\/b> Prädikat (finite Verbform). Zähle die finiten Verben, dann weißt du, wie viele Teilsätze es gibt.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Periode gliedern<\/h4><div class=\"task\">Gliedere und übersetze: <span class=\"la\">Caesar, cum animadvertisset hostes, qui in silvis latebant, impetum parare, milites, ne subito opprimerentur, castra munire iussit.<\/span> (animadvertere = bemerken; latere = sich verstecken; impetus = Angriff; opprimere = überfallen; munire = befestigen)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zähle die finiten Verben: <span class=\"la\">animadvertisset<\/span>, <span class=\"la\">latebant<\/span>, <span class=\"la\">opprimerentur<\/span>, <span class=\"la\">iussit<\/span>. Vier Verben, also vier Teilsätze.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Suche die Einleitungen: <span class=\"la\">cum<\/span> (Subjunktion), <span class=\"la\">qui<\/span> (Relativpronomen), <span class=\"la\">ne<\/span> (Subjunktion). Drei Gliedsätze. Das vierte Verb, <span class=\"la\">iussit<\/span>, gehört zum Hauptsatz.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Hauptsatz (Stufe 0): <span class=\"la\">Caesar … milites … castra munire iussit.<\/span> „Caesar befahl den Soldaten, das Lager zu befestigen.“ (<span class=\"la\">iubere<\/span> mit AcI)<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Stufe 1: <span class=\"la\">cum animadvertisset<\/span> + AcI <span class=\"la\">hostes … impetum parare<\/span>. „als er bemerkt hatte, dass die Feinde einen Angriff vorbereiteten“<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Stufe 2 (hängt an <span class=\"la\">hostes<\/span>): <span class=\"la\">qui in silvis latebant<\/span>. „die sich in den Wäldern versteckten“<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Stufe 1 (hängt am Hauptsatz): <span class=\"la\">ne subito opprimerentur<\/span>. „damit sie nicht plötzlich überfallen würden“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Übersetzung in deutscher Reihenfolge: „Als Caesar bemerkt hatte, dass die Feinde, die sich in den Wäldern versteckten, einen Angriff vorbereiteten, befahl er den Soldaten, das Lager zu befestigen, damit sie nicht plötzlich überfallen würden.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<p>Als Schema sieht derselbe Satz so aus:<\/p>\n<div class=\"vers\" style=\"white-space:normal;line-height:1.9\"><span class=\"la\">Caesar,<\/span><br>&emsp;&emsp;<span class=\"la\">cum animadvertisset hostes,<\/span><br>&emsp;&emsp;&emsp;&emsp;<span class=\"la\">qui in silvis latebant,<\/span><br>&emsp;&emsp;<span class=\"la\">impetum parare,<\/span><br><span class=\"la\">milites,<\/span><br>&emsp;&emsp;<span class=\"la\">ne subito opprimerentur,<\/span><br><span class=\"la\">castra munire iussit.<\/span><\/div>\n<h3>Klammern im Satz<\/h3>\n<p>Zusammengehörige Wörter stehen im Lateinischen oft weit auseinander und umschließen andere Satzteile wie eine Klammer. Das Stilmittel heißt Hyperbaton. Du löst es mit der KNG-Kongruenz: Suche zu jedem Adjektiv, Pronomen und Partizip das Wort mit demselben Kasus, Numerus und Genus.<\/p>\n<div class=\"formula\"><span class=\"la\"><b>Magnum<\/b> Caesar eo anno cum Gallis <b>bellum<\/b> gessit.<\/span> – Caesar führte in diesem Jahr einen großen Krieg mit den Galliern.<\/div>\n<h3>Der Arbeitsablauf bei einer Periode<\/h3>\n<ul><li>Satz bis zum Punkt lesen, finite Verben unterstreichen.<\/li><li>Einleitewörter der Gliedsätze einkreisen, Teilsätze einrücken.<\/li><li>Infinitive und Partizipien markieren und prüfen, ob ein AcI, ein PC oder ein Abl. abs. vorliegt.<\/li><li>Zuerst den Hauptsatz übersetzen, auch wenn er zerrissen ist.<\/li><li>Die Gliedsätze einzeln übersetzen und an der richtigen Stelle einhängen.<\/li><li>Das Ganze in gutes Deutsch bringen. Eine lange Periode darfst du im Deutschen in zwei Sätze teilen.<\/li><\/ul>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Wenn du nicht weiterkommst, übersetze, was sicher ist, und lass eine Lücke. Ein falscher Anfang zieht den Rest mit. Ein richtiger Hauptsatz mit einer Lücke bringt mehr Punkte als eine flüssige, aber frei erfundene Übersetzung.<\/div>"},{"id":"gattung","t":"Gattungen und Textsorten","kl":"3","k":3,"a":"T","tag":"Lektüre","goals":["die wichtigsten Gattungen der lateinischen Literatur mit ihren Merkmalen nennen","einen Text anhand von Form und Inhalt einer Gattung zuordnen","den Aufbau einer Rede beschreiben","die Erwartungen an einen Text aus seiner Gattung ableiten"],"ex":[{"type":"mc","q":"In welchem Versmaß ist ein Epos geschrieben?","s":"Epos und Lehrgedicht verwenden durchgehend den Hexameter. Das Distichon gehört zu Elegie und Epigramm.","o":["im Hexameter","im elegischen Distichon","im jambischen Senar","in wechselnden lyrischen Maßen"]},{"type":"mc","q":"Welche Gattung endet typischerweise mit einer überraschenden Pointe?","s":"Epigramme sind kurz und zielen auf den Schluss. Der Meister der Gattung ist Martial.","o":["das Epigramm","das Epos","die Geschichtsschreibung","das Lehrgedicht"]},{"type":"mc","q":"In welchem Teil einer Rede wird der Sachverhalt erzählt?","s":"<span class=\"la\">narrare<\/span> heißt erzählen. Das <span class=\"la\">exordium<\/span> leitet ein, die <span class=\"la\">argumentatio<\/span> beweist, die <span class=\"la\">peroratio<\/span> schließt ab.","o":["in der <span class=\"la\">narratio<\/span>","im <span class=\"la\">exordium<\/span>","in der <span class=\"la\">peroratio<\/span>","in der <span class=\"la\">argumentatio<\/span>"]},{"type":"mc","q":"Ein Text erzählt in der 3. Person von einem Feldzug, verwendet das historische Präsens und gibt Reden indirekt wieder. Welche Gattung liegt nahe?","s":"Das sind die Kennzeichen von Caesars <span class=\"la\">Commentarii<\/span> und der Geschichtsschreibung überhaupt.","o":["Geschichtsschreibung","Elegie","Brief","Fabel"]},{"type":"mc","q":"Woran erkennt man eine Fabel?","s":"Die Lehre steht als Vorspruch (<span class=\"la\">promythion<\/span>) oder Nachspruch (<span class=\"la\">epimythion<\/span>) da. Die lateinischen Fabeln stammen von Phaedrus.","o":["Tiere handeln und sprechen wie Menschen, und es gibt eine Lehre.","Ein Held besteht Abenteuer mit Hilfe der Götter.","Ein Liebender klagt über seine Geliebte.","Ein Redner klagt einen Politiker an."]},{"type":"mc","q":"Was bedeuten die drei Ziele <span class=\"la\">docere, delectare, movere<\/span>?","s":"Ein guter Redner informiert seine Hörer, unterhält sie und rührt ihre Gefühle auf.","o":["belehren, erfreuen, bewegen","lernen, auswählen, bewegen","führen, zerstören, mahnen","sagen, lesen, zeigen"]},{"type":"mc","q":"Welches Werk ist ein Lehrgedicht?","s":"Lukrez erklärt in sechs Büchern in Hexametern die Lehre Epikurs von den Atomen und will die Menschen so von der Furcht vor Göttern und Tod befreien.","o":["<span class=\"la\">De rerum natura<\/span> von Lukrez","<span class=\"la\">De bello Gallico<\/span> von Caesar","<span class=\"la\">Epistulae morales<\/span> von Seneca","<span class=\"la\">Carmina<\/span> von Catull"]},{"type":"self","q":"Nenne drei Merkmale, an denen du einen Brief erkennst, und zwei Autoren, von denen Briefe gelesen werden.","s":"Merkmale: Grußformel mit Absender im Nominativ und Empfänger im Dativ (<span class=\"la\">salutem dicit<\/span>), Schlussformel (<span class=\"la\">Vale<\/span>), Anrede in der 2. Person und persönlicher Ton, ein überschaubares Thema. Autoren: Cicero (echte Privatbriefe, etwa an Atticus), Plinius der Jüngere (kunstvoll gestaltete Briefe, zum Beispiel über den Vesuvausbruch), Seneca (philosophische Lehrbriefe an Lucilius)."}],"gen":[],"html":"<h3>Warum die Gattung hilft<\/h3>\n<p>Wer weiß, was für einen Text er vor sich hat, weiß schon vor dem ersten Satz viel: Ein Brief hat einen Absender und einen Adressaten. Eine Rede will überzeugen. Ein Epos erzählt in Hexametern von Helden und Göttern. Dieses Vorwissen lenkt deine Erwartungen und hilft dir bei den Aufgaben des Interpretationsteils, deren Formate auf der Seite zur Zentralmatura beschrieben sind.<\/p>\n<h3>Prosa<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Gattung<\/th><th>Merkmale<\/th><th>Autoren und Werke<\/th><\/tr><tr><td>Geschichtsschreibung<\/td><td>Erzählung in der 3. Person, Vergangenheitstempora, historisches Präsens, eingelegte Reden, oft indirekte Rede; will belehren und bewerten<\/td><td>Caesar (<span class=\"la\">Commentarii<\/span>), Sallust, Livius (<span class=\"la\">Ab urbe condita<\/span>), Tacitus<\/td><\/tr><tr><td>Biographie<\/td><td>Leben einer Person von der Herkunft bis zum Tod, Anekdoten, Charakterbild<\/td><td>Nepos, Sueton<\/td><\/tr><tr><td>Rede<\/td><td>direkte Anrede, 1. und 2. Person, rhetorische Fragen, viele Stilmittel<\/td><td>Cicero<\/td><\/tr><tr><td>Brief<\/td><td>Gruß am Anfang (<span class=\"la\">Cicero Attico salutem dicit<\/span>) und am Ende (<span class=\"la\">Vale<\/span>), persönlicher Ton, Alltag oder Belehrung<\/td><td>Cicero, Plinius, Seneca (<span class=\"la\">Epistulae morales<\/span>)<\/td><\/tr><tr><td>philosophische Schrift<\/td><td>Dialog oder Abhandlung, Fachbegriffe, Beispiele, Aufforderungen an den Leser<\/td><td>Cicero, Seneca, Augustinus<\/td><\/tr><tr><td>Roman<\/td><td>Erzählung in der Ich-Form, Alltagssprache, Komik<\/td><td>Petron, Apuleius<\/td><\/tr><tr><td>Fachschrift<\/td><td>sachlicher Stil, Fachwortschatz, Aufzählungen<\/td><td>Vitruv (Architektur), Celsus (Medizin), Plinius der Ältere<\/td><\/tr><\/table><\/div>\n<h3>Dichtung<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Gattung<\/th><th>Versmaß<\/th><th>Merkmale<\/th><th>Autoren<\/th><\/tr><tr><td>Epos<\/td><td>Hexameter<\/td><td>lange Erzählung von Helden und Göttern, Musenanruf, Gleichnisse, Götterszenen<\/td><td>Vergil (<span class=\"la\">Aeneis<\/span>), Ovid (<span class=\"la\">Metamorphosen<\/span>)<\/td><\/tr><tr><td>Lehrgedicht<\/td><td>Hexameter<\/td><td>vermittelt Wissen in dichterischer Form<\/td><td>Lukrez, Vergil (<span class=\"la\">Georgica<\/span>), Ovid (<span class=\"la\">Ars amatoria<\/span>, im Distichon)<\/td><\/tr><tr><td>Lyrik<\/td><td>verschiedene Maße<\/td><td>kurze Gedichte über Liebe, Freundschaft, Lebenskunst<\/td><td>Catull, Horaz (<span class=\"la\">Carmina<\/span>)<\/td><\/tr><tr><td>Elegie<\/td><td>elegisches Distichon<\/td><td>Liebe, Klage, persönliches Erleben<\/td><td>Tibull, Properz, Ovid<\/td><\/tr><tr><td>Epigramm<\/td><td>meist Distichon<\/td><td>kurz, witzig, mit Schlusspointe<\/td><td>Martial, Catull<\/td><\/tr><tr><td>Satire<\/td><td>Hexameter<\/td><td>Spott über menschliche Schwächen im Plauderton<\/td><td>Horaz, Juvenal<\/td><\/tr><tr><td>Fabel<\/td><td>jambischer Senar<\/td><td>Tiere handeln wie Menschen, am Ende oder Anfang steht eine Lehre<\/td><td>Phaedrus<\/td><\/tr><tr><td>Komödie<\/td><td>Sprechverse<\/td><td>Alltag, Verwechslungen, feste Typen (der schlaue Sklave, der strenge Vater)<\/td><td>Plautus, Terenz<\/td><\/tr><\/table><\/div>\n<h3>Der Aufbau einer Rede<\/h3>\n<p>Die antike Rhetorik unterscheidet drei Arten: die <b>Gerichtsrede<\/b> (Anklage oder Verteidigung), die <b>politische Rede<\/b> (Zuraten oder Abraten) und die <b>Festrede<\/b> (Lob oder Tadel). Der Aufbau folgt meist einem festen Plan:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Teil<\/th><th>Aufgabe<\/th><\/tr><tr><td><span class=\"la\">exordium<\/span><\/td><td>Einleitung: Aufmerksamkeit und Wohlwollen gewinnen<\/td><\/tr><tr><td><span class=\"la\">narratio<\/span><\/td><td>Darstellung des Sachverhalts<\/td><\/tr><tr><td><span class=\"la\">argumentatio<\/span><\/td><td>Beweisführung: eigene Gründe stärken, gegnerische widerlegen<\/td><\/tr><tr><td><span class=\"la\">peroratio<\/span><\/td><td>Schluss: zusammenfassen und die Gefühle der Hörer aufrühren<\/td><\/tr><\/table><\/div>\n<p>Die drei Ziele des Redners: <span class=\"la\">docere<\/span> (belehren), <span class=\"la\">delectare<\/span> (erfreuen), <span class=\"la\">movere<\/span> (bewegen).<\/p>\n<h3>So bestimmst du die Gattung eines unbekannten Textes<\/h3>\n<ul><li>Verse oder Prosa? Bei Versen: Sind alle Zeilen gleich lang (Hexameter) oder wechseln lange und kürzere (Distichon)?<\/li><li>Wer spricht zu wem? Gibt es ein „ich“ und ein „du“?<\/li><li>Welche Tempora herrschen vor? Erzähltempora weisen auf Geschichtsschreibung, Präsens und Imperative auf Rede, Brief oder Philosophie.<\/li><li>Gibt es Formeln: Gruß, Anrede, Musenanruf, Lehrsatz?<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Gattung bestimmen<\/h4><div class=\"task\">Ein Text beginnt so: <span class=\"la\">C. Plinius Tacito suo s.<\/span> Danach folgt ein Bericht in der 1. Person über ein Erlebnis, am Ende steht <span class=\"la\">Vale.<\/span> Um welche Gattung handelt es sich?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die erste Zeile enthält zwei Namen, einen im Nominativ und einen im Dativ, dazu <span class=\"la\">suo<\/span> und die Abkürzung <span class=\"la\">s.<\/span><\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">s.<\/span> steht für <span class=\"la\">salutem (dicit)<\/span>: „Plinius sagt seinem Tacitus einen Gruß.“ Das ist die Grußformel am Briefanfang.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">Vale<\/span> („Leb wohl“) ist die Schlussformel.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ich-Erzählung an einen bestimmten Adressaten: Es ist ein Brief, und zwar von Plinius dem Jüngeren an den Historiker Tacitus.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Was du erwarten darfst: persönlicher Ton, sorgfältiger Stil, ein abgeschlossenes Thema pro Brief.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"stil2","t":"Stilmittel für Fortgeschrittene","kl":"3","k":3,"a":"T","tag":"Lektüre","goals":["weitere Stilmittel über die Grundliste hinaus erkennen und benennen","Klang-, Wort- und Sinnfiguren unterscheiden","die Wirkung eines Stilmittels im Zusammenhang beschreiben","eine Stilanalyse in drei Schritten formulieren"],"ex":[{"type":"mc","q":"Welches Stilmittel liegt in <span class=\"la\">homo homini lupus<\/span> bei den Wörtern <span class=\"la\">homo homini<\/span> vor?","s":"Dasselbe Wort erscheint in zwei verschiedenen Fällen (Nominativ und Dativ). Bei einer Geminatio stünde zweimal dieselbe Form.","o":["Polyptoton","Geminatio","Oxymoron","Pleonasmus"]},{"type":"mc","q":"Welches Stilmittel ist <span class=\"la\">concordia discors<\/span>?","s":"<span class=\"la\">concordia<\/span> (Eintracht) und <span class=\"la\">discors<\/span> (uneins) schließen einander eigentlich aus. Die Verbindung zweier Gegensätze zu einem Ausdruck heißt Oxymoron.","o":["Oxymoron","Hyperbel","Metonymie","Paronomasie"]},{"type":"mc","q":"Catull fordert tausend Küsse, dann hundert, dann wieder tausend. Welches Stilmittel ist das?","s":"Eine offensichtliche Übertreibung, die die Maßlosigkeit der Liebe ausdrückt.","o":["Hyperbel","Euphemismus","Ironie","Litotes"]},{"type":"mc","q":"In <span class=\"la\">Sine Cerere et Libero friget Venus<\/span> stehen Götternamen für Brot, Wein und Liebe. Wie heißt das?","s":"Der Gott steht für das, wofür er zuständig ist: Ceres für das Getreide, Liber (Bacchus) für den Wein, Venus für die Liebe.","o":["Metonymie","Personifikation","Apostrophe","Pars pro toto"]},{"type":"mc","q":"Ein Dichter schreibt <span class=\"la\">carina<\/span> (Kiel) und meint das ganze Schiff. Welches Stilmittel ist das?","s":"Ein Teil steht für das Ganze. Die Figur ist in der Dichtung sehr häufig, auch weil kurze Wörter leichter in den Vers passen.","o":["Pars pro toto","Metapher","Hyperbaton","Ellipse"]},{"type":"mc","q":"Cicero nennt einen Mann, der dem Staat schadet, einen „trefflichen Hüter“. Welches Stilmittel verwendet er?","s":"Er sagt das Gegenteil dessen, was er meint, und jeder Hörer versteht es. Ein Euphemismus würde dagegen etwas Schlimmes schonend ausdrücken, ohne Spott.","o":["Ironie","Euphemismus","Hyperbel","Klimax"]},{"type":"mc","q":"Was fehlt in dieser Antwort? „In Vers 3 steht eine Anapher. Sie macht den Text lebendiger.“","s":"Benannt ist die Figur, aber nicht belegt (welche Wörter?) und nicht gedeutet. „Lebendiger“ passt auf jedes Stilmittel und sagt nichts über diese Stelle.","o":["der lateinische Beleg und eine Deutung, die sich auf die Stelle bezieht","nur der Fachbegriff","die Übersetzung des ganzen Gedichts","die Angabe des Versmaßes"]},{"type":"self","q":"Analysiere in drei Schritten: <span class=\"la\">Fuit, fuit ista quondam in hac re publica virtus.<\/span> (Cicero; ista virtus = diese Tatkraft; quondam = einst)","s":"Übersetzung: „Es gab sie, es gab sie einst in diesem Staat, diese Tatkraft.“ Benennen: Geminatio. Beleg: <span class=\"la\">fuit, fuit<\/span>. Deutung: Die Verdopplung des Perfekts betont schmerzlich, dass diese Tugend der Vergangenheit angehört. Cicero wirft dem Senat damit vor, heute nicht mehr so entschlossen zu handeln wie die Vorfahren. Zusätzlich ist <span class=\"la\">virtus<\/span> durch die Stellung am Satzende hervorgehoben und weit von <span class=\"la\">ista<\/span> getrennt (Hyperbaton)."}],"gen":[],"html":"<h3>Was du schon hast und was hier dazukommt<\/h3>\n<p>Das Stilmittel-Lexikon auf der Seite zur Zentralmatura erklärt die 18 häufigsten Figuren, von Alliteration bis Parenthese. Dieses Kapitel ergänzt sie um weitere, die in Dichtung und Rede regelmäßig vorkommen, und zeigt dir, wie du aus dem bloßen Benennen eine Deutung machst.<\/p>\n<h3>Drei Schritte: benennen, belegen, deuten<\/h3>\n<p>Bei der Aufgabe „Stilmittel benennen und deuten“ gibt es die Punkte nicht für den Fachbegriff allein. Erwartet wird:<\/p>\n<ul><li><b>Benennen:<\/b> der Fachbegriff<\/li><li><b>Belegen:<\/b> die lateinischen Wörter, an denen du die Figur festmachst<\/li><li><b>Deuten:<\/b> was die Figur <b>an dieser Stelle<\/b> bewirkt. Allgemeine Sätze wie „Das macht den Text lebendig“ sind zu wenig. Sage, was hervorgehoben, verlangsamt, verbunden oder gegenübergestellt wird.<\/li><\/ul>\n<h3>Klangfiguren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Figur<\/th><th>Erklärung<\/th><th>Beispiel<\/th><\/tr><tr><td>Onomatopoesie (Lautmalerei)<\/td><td>Der Klang ahmt das Bezeichnete nach.<\/td><td><span class=\"la\">quamvis sint sub aqua, sub aqua maledicere temptant<\/span> (Ovid über die Frösche: Man hört sie quaken.)<\/td><\/tr><tr><td>Homoioteleuton<\/td><td>gleiche Endungen aufeinanderfolgender Wörter<\/td><td><span class=\"la\">abiit, excessit, evasit, erupit<\/span> (Cicero über Catilina)<\/td><\/tr><tr><td>Paronomasie (Wortspiel)<\/td><td>ähnlich klingende Wörter mit verschiedener Bedeutung<\/td><td><span class=\"la\">amentium, haud amantium<\/span> – „von Verrückten, nicht von Verliebten“ (Terenz)<\/td><\/tr><\/table><\/div>\n<h3>Wortfiguren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Figur<\/th><th>Erklärung<\/th><th>Beispiel<\/th><\/tr><tr><td>Geminatio<\/td><td>unmittelbare Wiederholung eines Wortes<\/td><td><span class=\"la\">Fuit, fuit ista quondam in hac re publica virtus.<\/span> (Cicero)<\/td><\/tr><tr><td>Epipher<\/td><td>Wiederholung am Ende aufeinanderfolgender Sätze<\/td><td><span class=\"la\">Poenos populus Romanus iustitia vicit, armis vicit, liberalitate vicit.<\/span> (Rhetorica ad Herennium)<\/td><\/tr><tr><td>Polyptoton<\/td><td>dasselbe Wort in verschiedenen Formen<\/td><td><span class=\"la\">homo homini lupus<\/span> – „Der Mensch ist dem Menschen ein Wolf.“ (nach Plautus)<\/td><\/tr><tr><td>Figura etymologica<\/td><td>Verb und stammverwandtes Substantiv<\/td><td><span class=\"la\">vitam vivere<\/span>, <span class=\"la\">pugnam pugnare<\/span><\/td><\/tr><tr><td>Pleonasmus<\/td><td>ein überflüssiger Zusatz, der verstärkt<\/td><td><span class=\"la\">oculis videre<\/span> – mit (eigenen) Augen sehen<\/td><\/tr><tr><td>Enjambement<\/td><td>Der Satz läuft über das Versende in den nächsten Vers.<\/td><td>in der Dichtung häufig; das Wort am Versanfang wird betont<\/td><\/tr><tr><td>Hysteron proteron<\/td><td>Das Spätere steht vor dem Früheren.<\/td><td><span class=\"la\">moriamur et in media arma ruamus<\/span> – „Lasst uns sterben und uns mitten in die Waffen stürzen.“ (Vergil)<\/td><\/tr><\/table><\/div>\n<h3>Sinnfiguren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Figur<\/th><th>Erklärung<\/th><th>Beispiel<\/th><\/tr><tr><td>Hyperbel<\/td><td>Übertreibung<\/td><td><span class=\"la\">Da mi basia mille, deinde centum.<\/span> – „Gib mir tausend Küsse, dann hundert.“ (Catull)<\/td><\/tr><tr><td>Ironie<\/td><td>Gemeint ist das Gegenteil des Gesagten.<\/td><td><span class=\"la\">O praeclarum custodem ovium, ut aiunt, lupum!<\/span> – „Was für ein trefflicher Hüter der Schafe, der Wolf!“ (Cicero)<\/td><\/tr><tr><td>Euphemismus<\/td><td>Etwas Schlimmes wird beschönigt.<\/td><td><span class=\"la\">Vixerunt.<\/span> – „Sie haben gelebt.“ (statt: Sie sind hingerichtet worden.)<\/td><\/tr><tr><td>Oxymoron<\/td><td>Verbindung zweier Begriffe, die einander widersprechen<\/td><td><span class=\"la\">concordia discors<\/span> – „zwieträchtige Eintracht“ (Horaz)<\/td><\/tr><tr><td>Metonymie<\/td><td>Ein Begriff steht für einen verwandten: der Gott für seinen Bereich, das Material für den Gegenstand.<\/td><td><span class=\"la\">Sine Cerere et Libero friget Venus.<\/span> – „Ohne Brot und Wein friert die Liebe.“ (Terenz); <span class=\"la\">ferrum<\/span> für „Schwert“<\/td><\/tr><tr><td>Pars pro toto<\/td><td>Ein Teil steht für das Ganze.<\/td><td><span class=\"la\">tectum<\/span> (Dach) für „Haus“, <span class=\"la\">carina<\/span> (Kiel) für „Schiff“<\/td><\/tr><tr><td>Apostrophe<\/td><td>Der Sprecher wendet sich an Abwesende, Tote oder Dinge.<\/td><td><span class=\"la\">Quid non mortalia pectora cogis, auri sacra fames!<\/span> – „Wozu zwingst du nicht die Herzen der Menschen, verfluchter Hunger nach Gold!“ (Vergil)<\/td><\/tr><tr><td>Vergleich<\/td><td>ausgeführtes Bild mit <span class=\"la\">ut, velut, tamquam, qualis<\/span><\/td><td>im Epos oft als langes Gleichnis über mehrere Verse<\/td><\/tr><tr><td>Praeteritio<\/td><td>Man erwähnt etwas, indem man ankündigt, es zu übergehen.<\/td><td><span class=\"la\">Praetereo, quod<\/span> … – „Ich übergehe, dass …“<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Stilanalyse schreiben<\/h4><div class=\"task\">Cicero sagt über Catilinas Flucht aus Rom: <span class=\"la\">Abiit, excessit, evasit, erupit.<\/span> Analysiere die Stelle in drei Schritten.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Übersetze zuerst: „Er ist fortgegangen, hat sich entfernt, ist entwichen, ist ausgebrochen.“<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Benennen: Vier Verben stehen ohne Verbindung nebeneinander. Das ist ein <b>Asyndeton<\/b>. Alle enden gleich auf <span class=\"la\">-it<\/span>: <b>Homoioteleuton<\/b>. Die Bedeutung steigert sich vom neutralen Weggehen zum gewaltsamen Ausbrechen: <b>Klimax<\/b>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Belegen: <span class=\"la\">abiit – excessit – evasit – erupit<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Deuten: Die vier kurzen Schläge ohne „und“ wirken atemlos und hämmern den Hörern eine einzige Tatsache ein: Der Feind ist weg. Die Steigerung macht aus einem Weggang eine Flucht und stellt Catilina als gefährliches Tier dar, das aus dem Käfig bricht. Zugleich triumphiert der Redner.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>So sieht eine vollständige Antwort aus: Fachbegriff, lateinischer Beleg, Wirkung an genau dieser Stelle.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"metrik","t":"Metrik: Hexameter und Distichon lesen","kl":"3","k":3,"a":"T","tag":"Lektüre","goals":["lange und kurze Silben nach festen Regeln bestimmen","Elisionen erkennen","einen Hexameter Schritt für Schritt analysieren","den Pentameter und das elegische Distichon erklären"],"ex":[{"type":"num","a":6.0,"q":"Aus wie vielen Versfüßen besteht ein Hexameter?","s":"<span class=\"la\">hex<\/span> ist griechisch und heißt sechs. Der Pentameter hat seinen Namen von fünf (zweimal zweieinhalb)."},{"type":"mc","q":"Welcher Versfuß steht im Hexameter fast immer an fünfter Stelle?","s":"Deshalb kannst du jeden Hexameter von hinten beginnen: Die letzten fünf Silben sind – ∪ ∪ | – ×.","o":["ein Daktylus (– ∪ ∪)","ein Spondeus (– –)","ein Jambus (∪ –)","ein Trochäus (– ∪)"]},{"type":"mc","q":"Warum ist die erste Silbe von <span class=\"la\">arma<\/span> lang?","s":"Positionslänge: r und m folgen auf das a. Mit der Betonung hat die Länge nichts zu tun.","o":["weil auf den Vokal zwei Konsonanten folgen","weil a immer lang ist","weil sie betont ist","weil sie am Versanfang steht"]},{"type":"num","a":2.0,"q":"Wie viele Elisionen enthält die Wortfolge <span class=\"la\">multum ille et terris<\/span>?","h":"Prüfe jede Wortgrenze: Endet das eine Wort auf Vokal oder -m, und beginnt das nächste mit Vokal oder h?","s":"Zwei: <span class=\"la\">mult(um) ille<\/span> und <span class=\"la\">ill(e) et<\/span>. Zwischen <span class=\"la\">et<\/span> und <span class=\"la\">terris<\/span> stoßen Konsonanten aufeinander, dort wird nichts ausgestoßen."},{"type":"num","a":3.0,"q":"Der Vers <span class=\"la\">Tityre, tu patulae recubans sub tegmine fagi<\/span> (Vergil) hat das Schema – ∪ ∪ | – ∪ ∪ | – ∪ ∪ | – – | – ∪ ∪ | – ×. Wie viele der ersten vier Füße sind Daktylen?","s":"Drei: <span class=\"la\">Tī-ty-re<\/span> | <span class=\"la\">tū pa-tu-<\/span> | <span class=\"la\">lae re-cu-<\/span> sind Daktylen, <span class=\"la\">bāns sūb<\/span> ist ein Spondeus. Der Vers fließt leicht dahin, passend zum Hirten, der entspannt im Schatten liegt."},{"type":"mc","q":"Woraus besteht ein elegisches Distichon?","s":"Das Verspaar ist das Maß der Liebeselegie und des Epigramms. Ovid, Tibull, Properz und Martial verwenden es.","o":["aus einem Hexameter und einem Pentameter","aus zwei Hexametern","aus zwei Pentametern","aus einem Hexameter und einem jambischen Vers"]},{"type":"mc","q":"Was ist typisch für den Pentameter?","s":"Zwei Hälften zu je zweieinhalb Füßen. Nur in der ersten Hälfte dürfen Spondeen stehen.","o":["Er hat in der Mitte immer eine Wortgrenze, und die zweite Hälfte besteht aus reinen Daktylen.","Er hat fünf vollständige Daktylen.","Er endet immer auf zwei lange Silben.","Er darf nirgends Spondeen enthalten."]},{"type":"mc","q":"Welche Wirkung haben viele Spondeen in einem Hexameter?","s":"Lange Silben brauchen mehr Zeit. Dichter setzen das gezielt ein, etwa bei Mühe, Trauer oder Würde.","o":["Der Vers wirkt langsam, schwer oder feierlich.","Der Vers wirkt schnell und leicht.","Der Vers wird zum Pentameter.","Der Vers verliert seine Zäsur."]}],"gen":[],"html":"<h3>Worum es geht<\/h3>\n<p>Lateinische Verse beruhen nicht auf Betonung und Reim, sondern auf der geregelten Abfolge von <b>langen<\/b> (–) und <b>kurzen<\/b> (∪) Silben. Die Seite zur Zentralmatura nennt die drei Grundregeln und das Schema des Hexameters. Hier lernst du ein Verfahren, mit dem du jeden Hexameter sicher analysierst, und dazu den Pentameter.<\/p>\n<h3>Wann eine Silbe lang ist<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Die Silbe ist lang, wenn …<\/th><th>Beispiel<\/th><\/tr><tr><td>ihr Vokal von Natur aus lang ist<\/td><td><span class=\"la\">Rōma<\/span>, <span class=\"la\">amīcus<\/span><\/td><\/tr><tr><td>sie einen Doppellaut enthält (<span class=\"la\">ae, au, oe, eu<\/span>)<\/td><td><span class=\"la\">c<b>ae<\/b>lum<\/span>, <span class=\"la\"><b>au<\/b>rum<\/span><\/td><\/tr><tr><td>auf den Vokal zwei oder mehr Konsonanten folgen (Positionslänge), auch über die Wortgrenze<\/td><td><span class=\"la\"><b>ar<\/b>ma<\/span>, <span class=\"la\">e<b>t t<\/b>erris<\/span><\/td><\/tr><\/table><\/div>\n<p>x und z zählen als zwei Konsonanten, h zählt nicht, qu ist ein einziger Laut. Folgt auf einen Verschlusslaut ein l oder r (<span class=\"la\">pa<b>tr<\/b>is<\/span>, <span class=\"la\">tene<b>br<\/b>ae<\/span>), kann die Silbe davor lang oder kurz sein.<\/p>\n<p>Kurz ist ein Vokal fast immer, wenn ein anderer Vokal folgt: <span class=\"la\">vĭa<\/span>, <span class=\"la\">fŭit<\/span>, <span class=\"la\">deus<\/span>.<\/p>\n<h3>Elision<\/h3>\n<p>Trifft ein Wortende auf Vokal (oder auf Vokal + m) auf einen Wortanfang mit Vokal (oder h), wird die Endsilbe nicht gesprochen. Sie zählt im Vers nicht mit.<\/p>\n<div class=\"formula\"><span class=\"la\">mult<b>um<\/b> ille<\/span> → <span class=\"la\">mult’ ille<\/span> – <span class=\"la\">atqu<b>e<\/b> altae<\/span> → <span class=\"la\">atqu’ altae<\/span> – <span class=\"la\">ill<b>e<\/b> et<\/span> → <span class=\"la\">ill’ et<\/span><\/div>\n<p>Bei <span class=\"la\">est<\/span> fällt das e von <span class=\"la\">est<\/span> aus: <span class=\"la\">bonum est<\/span> → <span class=\"la\">bonum’st<\/span>.<\/p>\n<h3>Der Hexameter<\/h3>\n<p>Sechs Versfüße. Die ersten vier sind Daktylen (– ∪ ∪) oder Spondeen (– –), der fünfte fast immer ein Daktylus, der sechste hat zwei Silben, die letzte ist beliebig (×).<\/p>\n<div class=\"vers\">– <u>∪ ∪<\/u> | – <u>∪ ∪<\/u> | – <u>∪ ∪<\/u> | – <u>∪ ∪<\/u> | – ∪ ∪ | – ×<\/div>\n<p>Jedes unterstrichene Paar ∪ ∪ kann durch eine Länge ersetzt werden. Jeder Fuß beginnt mit einer Länge.<\/p>\n<p>Im Vers gibt es Sprechpausen an Wortgrenzen, die <b>Zäsuren<\/b>. Die häufigste liegt nach der dritten Hebung (Penthemimeres, „nach dem fünften Halbfuß“). Daneben gibt es Zäsuren nach der zweiten (Trithemimeres) und nach der vierten Hebung (Hephthemimeres).<\/p>\n<h3>Das Verfahren<\/h3>\n<ul><li>Elisionen suchen und einklammern.<\/li><li><b>Von hinten<\/b> beginnen: Die letzten fünf Silben sind fast immer – ∪ ∪ | – ×.<\/li><li>Vom Anfang her: Die erste Silbe ist lang.<\/li><li>Sichere Längen eintragen: Doppellaute und Positionslängen.<\/li><li>Den Rest ergänzen. Zwischen zwei Längen können nur zwei Kürzen oder gar nichts stehen, nie eine einzelne Kürze.<\/li><li>Kontrolle: sechs Füße, jeder beginnt mit einer Länge.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Hexameter analysieren<\/h4><div class=\"task\">Analysiere den ersten Vers der Aeneis: <span class=\"la\">Arma virumque cano, Troiae qui primus ab oris<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Elisionen: keine. Kein Wort endet auf Vokal oder -m vor einem Vokal.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Von hinten: Die letzten fünf Silben sind <span class=\"la\">pri-mus ab o-ris<\/span>. Schema: – ∪ ∪ | – ×. Also <span class=\"la\">prī-mŭs ăb<\/span> | <span class=\"la\">ō-rīs<\/span>. Das sind Fuß 5 und 6.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Von vorne: <span class=\"la\">Ar-<\/span> ist lang (Position: r und m). Dann <span class=\"la\">-ma vi-<\/span>: zwei Kürzen. Fuß 1: <span class=\"la\">Ār-mă vĭ-<\/span> (Daktylus).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">-rum-<\/span> ist lang (Position: m und qu). <span class=\"la\">-que ca-<\/span>: zwei Kürzen. Fuß 2: <span class=\"la\">rūm-quĕ că-<\/span> (Daktylus).<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">-no<\/span> ist lang (langes o der 1. Person). <span class=\"la\">Troi-<\/span> ist lang (Doppellaut). Fuß 3: <span class=\"la\">nō Trō-<\/span> (Spondeus).<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div><span class=\"la\">-iae<\/span> ist lang (Doppellaut), <span class=\"la\">qui<\/span> ist lang. Fuß 4: <span class=\"la\">-iae quī<\/span> (Spondeus).<\/div><\/div><div class=\"wstep\"><div class=\"n\">7<\/div><div>Ergebnis: <span class=\"vers\" style=\"display:block\">Ār-mă vĭ | rūm-quĕ că | nō, Trō | iae quī | prī-mŭs ăb | ō-rīs<br>– ∪ ∪ | – ∪ ∪ | – – | – – | – ∪ ∪ | – ×<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">8<\/div><div>Zäsur: Nach <span class=\"la\">cano<\/span> endet ein Wort mitten im dritten Fuß, nach der dritten Hebung. Das ist die Penthemimeres. Sie trennt hier den Sänger („ich besinge“) vom Inhalt seines Lieds.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ein Vers mit Elisionen<\/h4><div class=\"task\">Analysiere: <span class=\"la\">litora, multum ille et terris iactatus et alto<\/span> (Vergil, Aeneis 1, 3)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Elisionen: <span class=\"la\">mult(um) ille<\/span> (Endung auf -m vor Vokal) und <span class=\"la\">ill(e) et<\/span> (Vokal vor Vokal). Gesprochen: <span class=\"la\">mult’ ill’ et<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Von hinten: <span class=\"la\">-tus et al-to<\/span>: <span class=\"la\">tā-tŭs ĕt<\/span> | <span class=\"la\">āl-tō<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Von vorne: <span class=\"la\">lī-tŏ-ră<\/span> (Daktylus). Dann <span class=\"la\">mūl-t’īl-<\/span> (Spondeus), <span class=\"la\">l’ēt tēr-<\/span> (Spondeus, <span class=\"la\">et<\/span> ist lang durch Position vor t), <span class=\"la\">rīs iāc-<\/span> (Spondeus).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ergebnis: <span class=\"vers\" style=\"display:block\">lī-tŏ-ră | mūl-t(um) īl | l(e) ēt tēr | rīs iāc | tā-tŭs ĕt | āl-tō<br>– ∪ ∪ | – – | – – | – – | – ∪ ∪ | – ×<\/span><\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Deutung: Drei Spondeen hintereinander machen den Vers schwer und langsam. Das passt zum Inhalt: Aeneas wird lange und mühsam über Länder und Meer getrieben.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Pentameter und Distichon<\/h3>\n<p>Der Pentameter besteht aus zwei gleichen Hälften mit je zweieinhalb Füßen. In der Mitte liegt immer eine Wortgrenze. In der ersten Hälfte dürfen die Daktylen durch Spondeen ersetzt werden, in der zweiten nicht.<\/p>\n<div class=\"vers\">– <u>∪ ∪<\/u> | – <u>∪ ∪<\/u> | – ‖ – ∪ ∪ | – ∪ ∪ | ×<\/div>\n<p>Hexameter und Pentameter bilden zusammen das <b>elegische Distichon<\/b>, das Versmaß von Elegie und Epigramm. Im Druck ist der Pentameter eingerückt.<\/p>\n<div class=\"vers\">Dō-nĕc ĕ | rīs fē | līx, mūl | tōs nŭ-mĕ | rā-bĭs ă | mī-cōs;<br>&emsp;tēm-pŏ-ră | sī fŭ-ĕ | rīnt ‖ nū-bĭ-lă | sō-lŭs ĕ | rīs.<\/div>\n<p>„Solange du glücklich bist, wirst du viele Freunde zählen; wenn die Zeiten trüb geworden sind, wirst du allein sein.“ (Ovid, Tristia 1, 9, 5–6)<\/p>\n<p>Oft enthält der Hexameter eine Aussage und der Pentameter die Antwort, den Gegensatz oder die Pointe. Hier stehen einander <span class=\"la\">multos amicos<\/span> und <span class=\"la\">solus<\/span> gegenüber.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Bei der Deutung zählt nicht das Schema, sondern die Wirkung: Viele Daktylen machen einen Vers schnell und leicht, viele Spondeen langsam, schwer und feierlich. Wenn du so etwas am Inhalt festmachen kannst, hast du die Metrik als Stilmittel genutzt.<\/div>"},{"id":"gesch","t":"Römische Geschichte im Überblick","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die drei großen Epochen Roms mit ihren Staatsformen unterscheiden","die wichtigsten Ereignisse und Daten einordnen","Autoren und Texte ihrer Zeit zuweisen","historische Anspielungen in Texten verstehen"],"ex":[{"type":"mc","q":"In welchem Jahr wurde Rom der Sage nach gegründet?","s":"Von diesem Jahr an zählten die Römer <span class=\"la\">ab urbe condita<\/span>. Merkspruch: „Sieben, fünf, drei – Rom schlüpft aus dem Ei.“","o":["753 v. Chr.","510 v. Chr.","264 v. Chr.","27 v. Chr."]},{"type":"mc","q":"Gegen wen führte Rom die Punischen Kriege?","s":"Die Karthager heißen lateinisch <span class=\"la\">Poeni<\/span>. Ihr berühmtester Feldherr war Hannibal.","o":["gegen Karthago","gegen die Gallier","gegen die Griechen","gegen die Germanen"]},{"type":"mc","q":"Was geschah an den Iden des März 44 v. Chr.?","s":"Eine Gruppe von Senatoren um Brutus und Cassius tötete Caesar, weil sie in ihm einen Tyrannen sah. Die Republik rettete das nicht.","o":["Caesar wurde ermordet.","Caesar überschritt den Rubikon.","Augustus wurde Kaiser.","Cicero wurde Konsul."]},{"type":"mc","q":"Welches Ereignis markiert den Beginn des Prinzipats?","s":"Mit Augustus beginnt die Kaiserzeit, auch wenn er selbst die Form der Republik bestehen ließ.","o":["Octavian erhält 27 v. Chr. den Ehrennamen Augustus.","Caesar wird 49 v. Chr. Diktator.","Karthago wird 146 v. Chr. zerstört.","Konstantin gewährt 313 n. Chr. Religionsfreiheit."]},{"type":"mc","q":"Was wollten die Optimaten?","s":"<span class=\"la\">optimates<\/span> nannten sich die Vertreter der Senatsaristokratie. Ihre Gegner, die Popularen, stützten sich auf die Volksversammlung.","o":["die führende Rolle des Senats bewahren","die Rückkehr der Könige","die Abschaffung der Sklaverei","die Herrschaft eines Einzelnen"]},{"type":"mc","q":"Welcher Autor erlebte den Ausbruch des Vesuvs im Jahr 79 n. Chr. als Augenzeuge und beschrieb ihn in zwei Briefen?","s":"Plinius schildert dem Historiker Tacitus den Tod seines Onkels, Plinius des Älteren, und seine eigene Flucht. Cicero und Caesar waren zu dieser Zeit seit über hundert Jahren tot.","o":["Plinius der Jüngere","Cicero","Caesar","Livius"]},{"type":"mc","q":"In welche Zeit gehört Vergils <span class=\"la\">Aeneis<\/span>?","s":"Vergil (70–19 v. Chr.) schrieb das Epos in den Jahren nach Actium. Es deutet die Herrschaft des Augustus als Ziel der römischen Geschichte.","o":["in die Zeit des Augustus","in die Zeit der Punischen Kriege","in die Zeit Neros","in die Zeit Konstantins"]},{"type":"self","q":"Ordne zeitlich und begründe kurz: Schlacht bei Actium – Zerstörung Karthagos – Ciceros Konsulat – Ausbruch des Vesuvs.","s":"Zerstörung Karthagos (146 v. Chr., Ende des Dritten Punischen Kriegs) – Ciceros Konsulat (63 v. Chr., Verschwörung des Catilina) – Actium (31 v. Chr., Sieg Octavians über Antonius) – Vesuvausbruch (79 n. Chr., unter Kaiser Titus)."}],"gen":[],"html":"<h3>Warum Geschichte zum Lateinlernen gehört<\/h3>\n<p>Fast jeder Text, den du liest, setzt Wissen voraus: wer Hannibal war, warum Caesars Gegner von <span class=\"la\">libertas<\/span> sprechen, was sich mit Augustus änderte. Mit dem Gerüst aus diesem Kapitel kannst du Texte einordnen. Das hilft beim Übersetzen und bei den Interpretationsaufgaben, wo du Aussagen in ihren Zusammenhang stellen sollst.<\/p>\n<h3>Drei Epochen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Epoche<\/th><th>Zeit<\/th><th>Staatsform<\/th><th>Stichworte<\/th><\/tr><tr><td>Königszeit<\/td><td>753 – um 510 v. Chr.<\/td><td>sieben Könige, von Romulus bis Tarquinius Superbus<\/td><td>Gründungssagen, Vertreibung des letzten Königs<\/td><\/tr><tr><td>Republik<\/td><td>um 510 – 27 v. Chr.<\/td><td><span class=\"la\">res publica<\/span>: Senat, Beamte, Volksversammlung<\/td><td>Aufstieg zur Weltmacht, Ständekämpfe, Bürgerkriege<\/td><\/tr><tr><td>Kaiserzeit<\/td><td>27 v. Chr. – 476 n. Chr.<\/td><td>Prinzipat, später Dominat<\/td><td><span class=\"la\">Pax Romana<\/span>, größte Ausdehnung, Christentum, Teilung und Ende des Westreichs<\/td><\/tr><\/table><\/div>\n<h3>Zeittafel<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Jahr<\/th><th>Ereignis<\/th><\/tr><tr><td>753 v. Chr.<\/td><td>sagenhafte Gründung Roms durch Romulus (Beginn der Zählung <span class=\"la\">ab urbe condita<\/span>)<\/td><\/tr><tr><td>um 510<\/td><td>Vertreibung des Tarquinius Superbus, Beginn der Republik<\/td><\/tr><tr><td>um 450<\/td><td>Zwölftafelgesetz: erstes geschriebenes Recht<\/td><\/tr><tr><td>264–241<\/td><td>Erster Punischer Krieg gegen Karthago, Sizilien wird erste Provinz<\/td><\/tr><tr><td>218–201<\/td><td>Zweiter Punischer Krieg: Hannibal zieht über die Alpen, Sieg bei Cannae (216), Niederlage gegen Scipio bei Zama (202)<\/td><\/tr><tr><td>146<\/td><td>Zerstörung von Karthago und Korinth, Rom beherrscht das Mittelmeer<\/td><\/tr><tr><td>133 / 123<\/td><td>Reformversuche der Gracchen, Beginn der Krise der Republik<\/td><\/tr><tr><td>88–79<\/td><td>Bürgerkrieg zwischen Marius und Sulla, Sullas Diktatur<\/td><\/tr><tr><td>73–71<\/td><td>Sklavenaufstand unter Spartacus<\/td><\/tr><tr><td>63<\/td><td>Ciceros Konsulat, Verschwörung des Catilina<\/td><\/tr><tr><td>60<\/td><td>Erstes Triumvirat: Caesar, Pompeius, Crassus<\/td><\/tr><tr><td>58–51<\/td><td>Caesar erobert Gallien<\/td><\/tr><tr><td>49<\/td><td>Caesar überschreitet den Rubikon, Bürgerkrieg gegen Pompeius<\/td><\/tr><tr><td>44<\/td><td>Ermordung Caesars an den Iden des März<\/td><\/tr><tr><td>43<\/td><td>Zweites Triumvirat (Octavian, Antonius, Lepidus), Ermordung Ciceros<\/td><\/tr><tr><td>31<\/td><td>Octavian besiegt Antonius und Kleopatra bei Actium<\/td><\/tr><tr><td>27 v. Chr.<\/td><td>Octavian erhält den Namen Augustus, Beginn des Prinzipats<\/td><\/tr><tr><td>14 n. Chr.<\/td><td>Tod des Augustus, Nachfolger Tiberius<\/td><\/tr><tr><td>64<\/td><td>Brand Roms unter Nero<\/td><\/tr><tr><td>79<\/td><td>Ausbruch des Vesuvs, Untergang von Pompeji und Herculaneum<\/td><\/tr><tr><td>98–117<\/td><td>Trajan: größte Ausdehnung des Reichs<\/td><\/tr><tr><td>161–180<\/td><td>Mark Aurel, der „Philosoph auf dem Kaiserthron“<\/td><\/tr><tr><td>313<\/td><td>Konstantin gewährt den Christen Religionsfreiheit<\/td><\/tr><tr><td>395<\/td><td>endgültige Teilung in West- und Ostreich<\/td><\/tr><tr><td>476<\/td><td>Absetzung des letzten weströmischen Kaisers<\/td><\/tr><\/table><\/div>\n<h3>Die Krise der Republik<\/h3>\n<p>Die meisten Prosatexte der Schule stammen aus dem letzten Jahrhundert der Republik. Es ist geprägt vom Gegensatz zweier politischer Richtungen: Die <b>Optimaten<\/b> stützen sich auf den Senat und wollen die Macht der alten Familien bewahren. Die <b>Popularen<\/b> setzen ihre Ziele mit Hilfe der Volksversammlung und der Volkstribunen durch. Dazu kommen Heerführer, deren Soldaten ihnen persönlich ergeben sind. Aus diesem Gemisch entstehen die Bürgerkriege, an deren Ende die Alleinherrschaft steht.<\/p>\n<h3>Der Prinzipat<\/h3>\n<p>Augustus stellt nach außen die Republik wieder her und nennt sich nur <span class=\"la\">princeps<\/span> (der Erste). Tatsächlich vereinigt er alle wichtigen Befugnisse in seiner Hand. Er sichert den Frieden im Inneren (<span class=\"la\">Pax Augusta<\/span>), fördert Dichter wie Vergil und Horaz über seinen Freund Maecenas und lässt in den <span class=\"la\">Res gestae<\/span> seine Taten aufzeichnen. Ovid dagegen wird im Jahr 8 n. Chr. ans Schwarze Meer verbannt.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Text zeitlich einordnen<\/h4><div class=\"task\">In einem Text spricht ein Redner im Senat über eine Verschwörung, nennt sich selbst Konsul und greift einen Mann namens Catilina an. Wann und von wem stammt der Text vermutlich?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stichwort Catilina: Die Verschwörung fällt in das Jahr 63 v. Chr.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Konsul dieses Jahres war Cicero. Er hielt vier Reden gegen Catilina.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Der Text gehört also in die späte Republik, vierzehn Jahre vor Caesars Marsch auf Rom.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Was du erwarten kannst: einen leidenschaftlichen Ton, direkte Anreden, rhetorische Fragen und den Gegensatz zwischen dem Staat (<span class=\"la\">res publica<\/span>) und seinen Feinden.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"staat","t":"Staat und Gesellschaft","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die Ämter der römischen Republik und ihre Aufgaben nennen","die Rolle von Senat und Volksversammlung erklären","die gesellschaftlichen Gruppen und das Klientelwesen beschreiben","politische Grundbegriffe in Texten wiedererkennen"],"ex":[{"type":"mc","q":"Wofür steht die Abkürzung S P Q R?","s":"„Senat und Volk von Rom“. Die Formel stand auf Feldzeichen und Bauwerken und findet sich bis heute in der Stadt Rom.","o":["Senatus populusque Romanus","Senatus publicus quoque Romae","Salus populi quaestio rei","Senatores patres quique Romani"]},{"type":"mc","q":"Welches Amt war das höchste im <span class=\"la\">cursus honorum<\/span>?","s":"Die Reihenfolge lautet Quästor, Ädil, Prätor, Konsul. Nach den beiden Konsuln wurde auch das Jahr benannt.","o":["der Konsulat","die Quästur","die Prätur","die Ädilität"]},{"type":"mc","q":"Was bedeutet der Grundsatz der Annuität?","s":"<span class=\"la\">annus<\/span> heißt Jahr. Die doppelte Besetzung heißt Kollegialität.","o":["Jedes Amt wird nur für ein Jahr vergeben.","Jedes Amt ist doppelt besetzt.","Ämter werden nur an Adelige vergeben.","Zwischen zwei Ämtern müssen zehn Jahre liegen."]},{"type":"mc","q":"Was konnte ein Volkstribun mit seinem <span class=\"la\">veto<\/span> tun?","s":"<span class=\"la\">veto<\/span> heißt „ich verbiete“. Der Tribun selbst war unverletzlich (<span class=\"la\">sacrosanctus<\/span>).","o":["Maßnahmen von Beamten und Senatsbeschlüsse verhindern","Kriege erklären","Senatoren ernennen","das Heer befehligen"]},{"type":"mc","q":"Was war ein <span class=\"la\">homo novus<\/span>?","s":"Der berühmteste <span class=\"la\">homo novus<\/span> war Cicero, der aus dem Ritterstand der Landstadt Arpinum stammte und sich ohne große Ahnen hocharbeitete.","o":["ein Mann, der als Erster seiner Familie Konsul wurde","ein freigelassener Sklave","ein junger Soldat","ein neu zugezogener Fremder"]},{"type":"mc","q":"Was bezeichnet das Verhältnis zwischen <span class=\"la\">patronus<\/span> und <span class=\"la\">cliens<\/span>?","s":"Der Patron hilft und schützt, die Klienten unterstützen ihn politisch. Unser Wort Patron und das englische <span class=\"la\">client<\/span> kommen daher.","o":["ein Schutz- und Treueverhältnis zwischen einem Mächtigen und von ihm Abhängigen","das Verhältnis zwischen Lehrer und Schüler","einen Kaufvertrag","die Beziehung zwischen Vater und Sohn"]},{"type":"mc","q":"Wie hieß der Führer einer Zenturie?","s":"Der <span class=\"la\">centurio<\/span> führte ursprünglich hundert Mann (<span class=\"la\">centum<\/span>). Ein <span class=\"la\">legatus<\/span> befehligte eine Legion oder war Gesandter.","o":["centurio","legatus","imperator","tribunus plebis"]},{"type":"self","q":"Erkläre in zwei bis drei Sätzen, warum Caesars Diktatur auf Lebenszeit den Grundsätzen der Republik widersprach.","s":"Die Diktatur war als Notamt auf höchstens sechs Monate begrenzt. Caesar machte daraus eine dauernde Alleinherrschaft. Damit waren Annuität (Begrenzung auf ein Jahr) und Kollegialität (gegenseitige Kontrolle gleichberechtigter Beamter) aufgehoben, und der Senat verlor seine führende Rolle. Seine Gegner sahen darin das Ende der <span class=\"la\">libertas<\/span>."}],"gen":[],"html":"<h3>SPQR<\/h3>\n<p><span class=\"la\">Senatus populusque Romanus<\/span> – „Senat und Volk von Rom“: Die Formel nennt die beiden Säulen der Republik. Dazu kommen als dritte Kraft die gewählten Beamten, die <b>Magistrate<\/b>.<\/p>\n<h3>Die Ämterlaufbahn<\/h3>\n<p>Wer Politik machen wollte, durchlief die Ämter in fester Reihenfolge, den <span class=\"la\">cursus honorum<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Amt<\/th><th>Aufgaben<\/th><\/tr><tr><td>Quästor (<span class=\"la\">quaestor<\/span>)<\/td><td>Staatskasse, Finanzverwaltung<\/td><\/tr><tr><td>Ädil (<span class=\"la\">aedilis<\/span>)<\/td><td>Aufsicht über Märkte, Bauten und Spiele<\/td><\/tr><tr><td>Prätor (<span class=\"la\">praetor<\/span>)<\/td><td>Rechtsprechung, später Statthalter einer Provinz<\/td><\/tr><tr><td>Konsul (<span class=\"la\">consul<\/span>)<\/td><td>zwei oberste Beamte: Leitung des Staates, Oberbefehl im Krieg<\/td><\/tr><\/table><\/div>\n<p>Außerhalb dieser Reihe stehen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Amt<\/th><th>Aufgaben<\/th><\/tr><tr><td>Zensor (<span class=\"la\">censor<\/span>)<\/td><td>Bürgerliste und Vermögensschätzung, Aufsicht über die Sitten<\/td><\/tr><tr><td>Volkstribun (<span class=\"la\">tribunus plebis<\/span>)<\/td><td>Schutz der Plebejer, Einspruchsrecht (<span class=\"la\">veto<\/span> – „ich verbiete“) gegen jede Amtshandlung<\/td><\/tr><tr><td>Diktator (<span class=\"la\">dictator<\/span>)<\/td><td>in Notzeiten für höchstens sechs Monate mit unbeschränkter Vollmacht<\/td><\/tr><\/table><\/div>\n<p>Zwei Grundsätze sollten Machtmissbrauch verhindern: <b>Annuität<\/b> (jedes Amt dauert nur ein Jahr) und <b>Kollegialität<\/b> (jedes Amt ist mindestens doppelt besetzt, und die Kollegen können einander hindern). Caesars Diktatur auf Lebenszeit brach mit beidem.<\/p>\n<h3>Senat und Volk<\/h3>\n<p>Der <b>Senat<\/b> bestand aus ehemaligen Beamten. Er fasste keine Gesetze, sondern gab Ratschläge (<span class=\"la\">senatus consulta<\/span>). Weil in ihm die erfahrensten Männer saßen, folgte man ihm in aller Regel. Das meint der Begriff <span class=\"la\">auctoritas<\/span>. Die <b>Volksversammlungen<\/b> wählten die Beamten und stimmten über Gesetze, Krieg und Frieden ab.<\/p>\n<h3>Die Gesellschaft<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Gruppe<\/th><th>Erklärung<\/th><\/tr><tr><td>Patrizier<\/td><td>alter Geburtsadel, anfangs allein im Besitz der Ämter<\/td><\/tr><tr><td>Plebejer<\/td><td>die übrigen Bürger, erkämpften in den Ständekämpfen die Gleichberechtigung<\/td><\/tr><tr><td>Nobilität<\/td><td>führende Familien (patrizisch und plebejisch), die schon einen Konsul gestellt hatten; ein Aufsteiger hieß <span class=\"la\">homo novus<\/span> (wie Cicero)<\/td><\/tr><tr><td>Ritter (<span class=\"la\">equites<\/span>)<\/td><td>reiche Bürger, tätig in Handel, Geldgeschäft und Steuerpacht<\/td><\/tr><tr><td>Freigelassene (<span class=\"la\">liberti<\/span>)<\/td><td>ehemalige Sklaven, ihrem früheren Herrn weiter verpflichtet<\/td><\/tr><tr><td>Sklaven (<span class=\"la\">servi<\/span>)<\/td><td>rechtlich eine Sache; ihre Lage reichte vom Bergwerksarbeiter bis zum gebildeten Hauslehrer oder Arzt<\/td><\/tr><\/table><\/div>\n<p>Ein wichtiges Band war das <b>Klientelwesen<\/b>: Ein einflussreicher <span class=\"la\">patronus<\/span> schützte seine <span class=\"la\">clientes<\/span> vor Gericht und half ihnen in Notlagen. Sie unterstützten ihn dafür bei Wahlen und begleiteten ihn in der Öffentlichkeit. Das Verhältnis beruhte auf <span class=\"la\">fides<\/span>, gegenseitiger Treue.<\/p>\n<h3>Das Reich und das Heer<\/h3>\n<p>Eroberte Gebiete wurden zu <b>Provinzen<\/b> unter einem Statthalter. Das Heer gliederte sich in Legionen zu rund 5 000 Mann. Eine Legion bestand aus zehn Kohorten, eine Kohorte aus Zenturien unter je einem <span class=\"la\">centurio<\/span>. Jeden Abend wurde ein befestigtes Lager (<span class=\"la\">castra<\/span>) gebaut. Aus vielen Lagern entstanden Städte, auch auf österreichischem Boden.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Politische Begriffe in einem Text deuten<\/h4><div class=\"task\">In einem Text heißt es, ein Volkstribun habe <span class=\"la\">intercessit<\/span>. Was ist geschehen, und warum ist das bedeutsam?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">intercedere<\/span> heißt wörtlich „dazwischentreten“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Volkstribunen hatten das Recht, gegen jede Maßnahme eines Beamten und gegen Senatsbeschlüsse Einspruch zu erheben. Dieser Einspruch heißt <span class=\"la\">intercessio<\/span>, das Wort dafür <span class=\"la\">veto<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Der Tribun hat also eine Handlung blockiert.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Bedeutsam ist das, weil ein einzelner Tribun die gesamte Politik lahmlegen konnte. In den Krisenjahren der Republik wurde dieses Recht zur Waffe im Machtkampf.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"alltag","t":"Alltag in Rom","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die römische Familie und die Rolle des pater familias beschreiben","römische Namen lesen","Haus, Kleidung, Schule und Tageslauf erklären","die großen Freizeitstätten und ihre Bedeutung einordnen"],"ex":[{"type":"mc","q":"Was bezeichnet <span class=\"la\">patria potestas<\/span>?","s":"<span class=\"la\">patria<\/span> ist hier das Adjektiv zu <span class=\"la\">pater<\/span> („väterlich“) und nicht das Substantiv „Vaterland“.","o":["die rechtliche Gewalt des Hausvaters über seine Familie","die Macht des Vaterlands","die Macht der Patrizier","das Recht der Mutter im Haus"]},{"type":"mc","q":"Für welchen Vornamen steht die Abkürzung <span class=\"la\">C.<\/span>?","s":"<span class=\"la\">C.<\/span> steht für <span class=\"la\">Gaius<\/span>, <span class=\"la\">Cn.<\/span> für <span class=\"la\">Gnaeus<\/span>. Das liegt daran, dass der Buchstabe C ursprünglich auch den g-Laut bezeichnete.","o":["Gaius","Cicero","Claudius","Cornelius"]},{"type":"mc","q":"Wie hieß die Tochter eines Mannes namens Cornelius?","s":"Frauen trugen den Familiennamen in der weiblichen Form. Mehrere Töchter unterschied man durch Zusätze wie <span class=\"la\">maior<\/span> und <span class=\"la\">minor<\/span>.","o":["Cornelia","Cornelii","Cornela","Sie hatte einen frei gewählten Namen."]},{"type":"mc","q":"Was ist eine <span class=\"la\">insula<\/span> in der Stadt Rom?","s":"Wörtlich „Insel“: ein Häuserblock, der von Straßen umgeben ist. Dort wohnte die Mehrheit der Stadtbevölkerung.","o":["ein mehrstöckiges Mietshaus","ein Landgut","ein Badehaus","ein Tempelbezirk"]},{"type":"mc","q":"Was verstand ein gebildeter Römer unter <span class=\"la\">otium<\/span>?","s":"Der Gegenbegriff ist <span class=\"la\">negotium<\/span> (wörtlich „Nicht-Muße“): Geschäft, Arbeit, Politik. Von <span class=\"la\">negotium<\/span> kommt das englische <span class=\"la\">negotiate<\/span>.","o":["freie Zeit für Bildung, Schreiben und Freunde","Nichtstun aus Faulheit","die Arbeit auf dem Forum","das Abendessen"]},{"type":"mc","q":"Wo fanden Wagenrennen statt?","s":"Der Circus hatte eine lange Rennbahn. Im Amphitheater, einem ovalen Bau, kämpften Gladiatoren.","o":["im Circus","im Amphitheater","in den Thermen","im Theater"]},{"type":"mc","q":"Womit schrieben römische Schüler im Unterricht?","s":"Der Griffel heißt <span class=\"la\">stilus<\/span>. Mit seinem flachen Ende konnte man das Wachs glätten und so korrigieren. Von ihm kommt unser Wort Stil.","o":["mit einem Griffel auf Wachstafeln","mit Kreide auf Schiefer","mit Federkiel auf Papier","mit Pinsel auf Leinwand"]},{"type":"self","q":"Erkläre die Wendung <span class=\"la\">panem et circenses<\/span> und wie sie heute verwendet wird.","s":"„Brot und Zirkusspiele“. Juvenal kritisiert damit, dass sich das Volk nicht mehr um Politik kümmere, solange es kostenloses Getreide und Unterhaltung bekomme. Heute bezeichnet man so den Versuch, Menschen mit Geschenken und Vergnügungen von wichtigen Fragen abzulenken."}],"gen":[],"html":"<h3>Die familia<\/h3>\n<p>Zur römischen <span class=\"la\">familia<\/span> gehörten alle, die unter der Gewalt des Hausvaters standen: Ehefrau, Kinder, Schwiegertöchter, Enkel und die Sklaven. Der <span class=\"la\">pater familias<\/span> hatte rechtlich die volle Verfügung (<span class=\"la\">patria potestas<\/span>) über Personen und Vermögen. Im Alltag war die <span class=\"la\">matrona<\/span> für das Haus zuständig und genoss hohes Ansehen. Zum Haus gehörten Schutzgötter: die <span class=\"la\">Lares<\/span> und die <span class=\"la\">Penates<\/span>.<\/p>\n<h3>Namen<\/h3>\n<p>Ein freier Römer trug drei Namen, die <span class=\"la\">tria nomina<\/span>:<\/p>\n<div class=\"formula\"><span class=\"la\">Gaius<\/span> (Vorname) – <span class=\"la\">Iulius<\/span> (Name der Familie, <span class=\"la\">gens<\/span>) – <span class=\"la\">Caesar<\/span> (Beiname, <span class=\"la\">cognomen<\/span>)<\/div>\n<p>Vornamen gab es nur wenige, sie werden abgekürzt: C. = Gaius, Cn. = Gnaeus, L. = Lucius, M. = Marcus, P. = Publius, Q. = Quintus, T. = Titus, Ti. = Tiberius. Frauen trugen den Familiennamen in der weiblichen Form: Die Tochter eines Tullius hieß <span class=\"la\">Tullia<\/span>, die eines Iulius <span class=\"la\">Iulia<\/span>.<\/p>\n<h3>Wohnen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Begriff<\/th><th>Erklärung<\/th><\/tr><tr><td><span class=\"la\">domus<\/span><\/td><td>Stadthaus wohlhabender Familien, nach innen gebaut<\/td><\/tr><tr><td><span class=\"la\">atrium<\/span><\/td><td>zentrale Halle mit Dachöffnung und Regenwasserbecken (<span class=\"la\">impluvium<\/span>)<\/td><\/tr><tr><td><span class=\"la\">peristylium<\/span><\/td><td>Gartenhof mit Säulengang<\/td><\/tr><tr><td><span class=\"la\">triclinium<\/span><\/td><td>Speisezimmer mit drei Liegen<\/td><\/tr><tr><td><span class=\"la\">insula<\/span><\/td><td>mehrstöckiges Mietshaus für die große Mehrheit, eng und feuergefährlich<\/td><\/tr><tr><td><span class=\"la\">villa<\/span><\/td><td>Landgut (<span class=\"la\">villa rustica<\/span>) oder Landsitz zur Erholung<\/td><\/tr><\/table><\/div>\n<h3>Der Tag<\/h3>\n<p>Der Tag begann bei Sonnenaufgang. Am Vormittag gingen die Männer ihren Geschäften nach (<span class=\"la\">negotium<\/span>), Klienten machten ihrem Patron die Aufwartung (<span class=\"la\">salutatio<\/span>). Am Nachmittag folgten Erholung, Sport und Bad. Die Hauptmahlzeit, die <span class=\"la\">cena<\/span>, begann am späten Nachmittag. Die freie Zeit, die man für Bildung, Freunde und Schreiben nutzte, hieß <span class=\"la\">otium<\/span>. Für einen Römer der Oberschicht war <span class=\"la\">otium<\/span> nichts Faules, sondern die Zeit für das, was dem Leben Wert gibt.<\/p>\n<p>Die Stunden wurden von Sonnenaufgang bis Sonnenuntergang gezählt. Die <span class=\"la\">hora sexta<\/span> war die Mittagsstunde (davon kommt die Siesta), die <span class=\"la\">hora nona<\/span> der mittlere Nachmittag (davon englisch <span class=\"la\">noon<\/span>).<\/p>\n<h3>Kleidung und Schule<\/h3>\n<p>Das Grundkleid war die <span class=\"la\">tunica<\/span>. Bürger trugen darüber bei offiziellen Anlässen die <span class=\"la\">toga<\/span>, verheiratete Frauen die <span class=\"la\">stola<\/span>.<\/p>\n<p>Kinder wohlhabender Familien besuchten drei Stufen: beim <span class=\"la\">litterator<\/span> lernten sie Lesen, Schreiben und Rechnen, beim <span class=\"la\">grammaticus<\/span> lasen sie Dichter (auch griechische), beim <span class=\"la\">rhetor<\/span> übten junge Männer das Reden. Geschrieben wurde auf Wachstafeln mit einem Griffel (<span class=\"la\">stilus<\/span>). Oft war der Lehrer ein griechischer Sklave oder Freigelassener.<\/p>\n<h3>Freizeit: Brot und Spiele<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Ort<\/th><th>Was dort geschah<\/th><\/tr><tr><td><span class=\"la\">circus<\/span><\/td><td>Wagenrennen; der Circus Maximus fasste weit über hunderttausend Menschen<\/td><\/tr><tr><td><span class=\"la\">amphitheatrum<\/span><\/td><td>Gladiatorenkämpfe und Tierhetzen; das bekannteste ist das Kolosseum<\/td><\/tr><tr><td><span class=\"la\">theatrum<\/span><\/td><td>Komödien, Tragödien, Pantomimen<\/td><\/tr><tr><td><span class=\"la\">thermae<\/span><\/td><td>Badeanlagen mit Kalt-, Warm- und Heißbad, Sportplatz, oft Bibliothek; ein Treffpunkt für alle<\/td><\/tr><tr><td><span class=\"la\">forum<\/span><\/td><td>Markt, Gericht, Politik: das Zentrum jeder Stadt<\/td><\/tr><\/table><\/div>\n<p>Der Dichter Juvenal spottete, das Volk wünsche sich nur noch zwei Dinge: <span class=\"la\">panem et circenses<\/span>, Brot und Zirkusspiele.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen römischen Namen lesen<\/h4><div class=\"task\">Auf einer Inschrift steht: <span class=\"la\">M. TVLLIVS M. F. CICERO<\/span>. Was erfährst du?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>In Inschriften steht V für u. Lies: <span class=\"la\">M. Tullius M. f. Cicero<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">M.<\/span> ist die Abkürzung des Vornamens <span class=\"la\">Marcus<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">Tullius<\/span> ist der Familienname: Er gehört zur <span class=\"la\">gens Tullia<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">M. f.<\/span> heißt <span class=\"la\">Marci filius<\/span>, „Sohn des Marcus“. Die Angabe des Vaters steht zwischen Familienname und Beiname.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">Cicero<\/span> ist der Beiname. Er soll von <span class=\"la\">cicer<\/span> (Kichererbse) kommen.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Seine Tochter hieß nach der Familie <span class=\"la\">Tullia<\/span>.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"mythos","t":"Mythos und Religion","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die wichtigsten Götter mit römischem und griechischem Namen und Zuständigkeit nennen","die Gründungssagen Roms nacherzählen","häufig gelesene Mythen aus Ovids Metamorphosen kennen","Grundzüge der römischen Religion erklären"],"ex":[{"type":"mc","q":"Welcher römische Gott entspricht dem griechischen Zeus?","s":"Jupiter ist der Himmels- und Wettergott und König der Götter.","o":["Iuppiter","Mars","Neptunus","Apollo"]},{"type":"mc","q":"Wofür ist Minerva zuständig?","s":"Minerva entspricht der griechischen Athene. Venus ist für die Liebe, Diana für die Jagd, Ceres für das Getreide zuständig.","o":["für Weisheit, Handwerk und Kriegskunst","für Liebe und Schönheit","für Jagd und Mond","für Ackerbau und Getreide"]},{"type":"mc","q":"Was bedeutet die Formel <span class=\"la\">do, ut des<\/span>?","s":"<span class=\"la\">ut<\/span> mit Konjunktiv (<span class=\"la\">des<\/span> von <span class=\"la\">dare<\/span>) ist final. Die Formel beschreibt das Verhältnis zu den Göttern als Geben und Nehmen.","o":["Ich gebe, damit du gibst.","Ich gebe, wie du gibst.","Gib, damit ich gebe.","Ich gab, als du gabst."]},{"type":"mc","q":"Wer ist nach der Sage der Stammvater der Römer?","s":"Aeneas flieht aus Troja und gelangt nach Latium. Seine Nachkommen gründen Alba Longa, aus dessen Königshaus Romulus und Remus stammen.","o":["der Trojaner Aeneas","der Grieche Odysseus","der König Tarquinius","der Held Hercules"]},{"type":"mc","q":"In was wird Daphne verwandelt?","s":"Griechisch <span class=\"la\">daphne<\/span> heißt Lorbeer. Apollo macht den Lorbeer zu seinem heiligen Baum, daher der Lorbeerkranz der Sieger und Dichter.","o":["in einen Lorbeerbaum","in eine Narzisse","in eine Quelle","in einen Stern"]},{"type":"mc","q":"Welches Liebespaar aus den Metamorphosen ist das Vorbild für Romeo und Julia?","s":"Die Eltern verbieten die Liebe, ein Missverständnis führt zum Tod beider.","o":["Pyramus und Thisbe","Orpheus und Eurydice","Philemon und Baucis","Apollo und Daphne"]},{"type":"mc","q":"Welche Aufgabe hatten die Auguren?","s":"Vor wichtigen Entscheidungen wurde das <span class=\"la\">auspicium<\/span> (Vogelschau) eingeholt. Davon kommt die Wendung „unter guten Auspizien“.","o":["Sie deuteten aus dem Vogelflug den Willen der Götter.","Sie hüteten das Feuer der Vesta.","Sie leiteten die Gladiatorenspiele.","Sie verwalteten die Staatskasse."]},{"type":"self","q":"Was bedeutet <span class=\"la\">pietas<\/span>, und warum heißt Aeneas bei Vergil <span class=\"la\">pius Aeneas<\/span>?","s":"<span class=\"la\">pietas<\/span> ist das pflichtbewusste Verhalten gegenüber Göttern, Familie und Vaterland. Aeneas verkörpert es: Er rettet die Hausgötter und seinen Vater aus Troja, folgt dem Auftrag der Götter auch gegen seinen eigenen Wunsch (er verlässt Dido) und nimmt alle Mühen für die künftige Stadt auf sich. Mit „fromm“ ist das Wort nur unvollständig übersetzt."}],"gen":[],"html":"<h3>Die Götter<\/h3>\n<p>Die Römer setzten ihre Götter früh mit den griechischen gleich. In lateinischen Texten stehen die römischen Namen, in der Kunst und in modernen Büchern oft die griechischen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Römisch<\/th><th>Griechisch<\/th><th>Zuständigkeit<\/th><th>Kennzeichen<\/th><\/tr><tr><td>Iuppiter<\/td><td>Zeus<\/td><td>Himmel, Wetter, Recht; König der Götter<\/td><td>Blitz, Adler<\/td><\/tr><tr><td>Iuno<\/td><td>Hera<\/td><td>Ehe, Frauen<\/td><td>Pfau<\/td><\/tr><tr><td>Neptunus<\/td><td>Poseidon<\/td><td>Meer<\/td><td>Dreizack<\/td><\/tr><tr><td>Minerva<\/td><td>Athene<\/td><td>Weisheit, Handwerk, Kriegskunst<\/td><td>Eule, Helm<\/td><\/tr><tr><td>Mars<\/td><td>Ares<\/td><td>Krieg<\/td><td>Waffen<\/td><\/tr><tr><td>Venus<\/td><td>Aphrodite<\/td><td>Liebe, Schönheit<\/td><td>Taube<\/td><\/tr><tr><td>Apollo<\/td><td>Apollon<\/td><td>Licht, Musik, Weissagung<\/td><td>Leier, Lorbeer<\/td><\/tr><tr><td>Diana<\/td><td>Artemis<\/td><td>Jagd, Mond<\/td><td>Bogen, Hirsch<\/td><\/tr><tr><td>Vulcanus<\/td><td>Hephaistos<\/td><td>Feuer, Schmiedekunst<\/td><td>Hammer<\/td><\/tr><tr><td>Vesta<\/td><td>Hestia<\/td><td>Herdfeuer<\/td><td>ewige Flamme<\/td><\/tr><tr><td>Mercurius<\/td><td>Hermes<\/td><td>Handel, Reisen; Götterbote<\/td><td>Flügelschuhe, Stab<\/td><\/tr><tr><td>Ceres<\/td><td>Demeter<\/td><td>Ackerbau, Getreide<\/td><td>Ähren<\/td><\/tr><tr><td>Bacchus (Liber)<\/td><td>Dionysos<\/td><td>Wein, Rausch<\/td><td>Weinlaub<\/td><\/tr><tr><td>Pluto (Dis)<\/td><td>Hades<\/td><td>Unterwelt<\/td><td>–<\/td><\/tr><\/table><\/div>\n<p>Dazu kommen typisch römische Gottheiten wie <span class=\"la\">Ianus<\/span>, der Gott der Türen und des Anfangs mit zwei Gesichtern (davon der Monatsname Januar).<\/p>\n<h3>Römische Religion<\/h3>\n<p>Im Mittelpunkt stand nicht der Glaube des Einzelnen, sondern die richtige Ausführung der Rituale. Man verstand das Verhältnis zu den Göttern wie einen Vertrag: <span class=\"la\">Do, ut des<\/span> – „Ich gebe, damit du gibst.“ Wer opferte und Gelübde erfüllte, durfte Schutz erwarten. Der Friede mit den Göttern (<span class=\"la\">pax deorum<\/span>) galt als Grundlage für das Wohl des Staates.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Begriff<\/th><th>Erklärung<\/th><\/tr><tr><td><span class=\"la\">pietas<\/span><\/td><td>Pflichtgefühl gegenüber Göttern, Eltern und Vaterland<\/td><\/tr><tr><td><span class=\"la\">pontifex maximus<\/span><\/td><td>oberster Priester (den Titel trägt heute der Papst)<\/td><\/tr><tr><td><span class=\"la\">augures<\/span><\/td><td>deuten aus dem Vogelflug den Willen der Götter<\/td><\/tr><tr><td><span class=\"la\">haruspices<\/span><\/td><td>deuten die Eingeweide der Opfertiere<\/td><\/tr><tr><td><span class=\"la\">virgines Vestales<\/span><\/td><td>hüten das heilige Feuer der Vesta<\/td><\/tr><tr><td><span class=\"la\">votum<\/span><\/td><td>Gelübde: ein Versprechen an eine Gottheit für den Fall der Hilfe<\/td><\/tr><\/table><\/div>\n<p>Das Reich nahm viele fremde Kulte auf (Isis, Mithras). Das <b>Christentum<\/b> geriet in Konflikt mit dem Staat, weil Christen das Opfer für die Götter und den Kaiser verweigerten. Nach Zeiten der Verfolgung wurde es 313 erlaubt und Ende des 4. Jahrhunderts zur Staatsreligion.<\/p>\n<h3>Die Gründungssagen<\/h3>\n<p><b>Aeneas:<\/b> Der Trojaner, Sohn der Venus, flieht aus dem brennenden Troja. Er trägt seinen Vater Anchises auf den Schultern und führt seinen Sohn Ascanius (Iulus) an der Hand. Nach langen Irrfahrten, dem Aufenthalt bei der Königin Dido in Karthago und einem Gang in die Unterwelt erreicht er Latium und wird Stammvater der Römer. Vergil erzählt davon in der <span class=\"la\">Aeneis<\/span>. Die Familie der Iulier, zu der Caesar und Augustus gehören, führte sich auf Iulus zurück.<\/p>\n<p><b>Romulus und Remus:<\/b> Die Zwillinge, Söhne des Mars und der Rhea Silvia, werden ausgesetzt, von einer Wölfin gesäugt und von einem Hirten aufgezogen. Bei der Gründung der Stadt erschlägt Romulus seinen Bruder im Streit. Um Frauen für die neue Stadt zu gewinnen, rauben die Römer die Töchter der Sabiner.<\/p>\n<p><b>Das Ende der Könige:<\/b> Lucretia, von einem Sohn des Königs Tarquinius vergewaltigt, tötet sich. Brutus führt den Aufstand an, der die Könige vertreibt. Livius erzählt diese Geschichten im ersten Buch seines Werks.<\/p>\n<h3>Mythen aus Ovids Metamorphosen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Mythos<\/th><th>Kern<\/th><th>Verwandlung<\/th><\/tr><tr><td>Apollo und Daphne<\/td><td>Die Nymphe flieht vor dem verliebten Gott.<\/td><td>Daphne wird zum Lorbeerbaum.<\/td><\/tr><tr><td>Narcissus und Echo<\/td><td>Ein schöner Jüngling verliebt sich in sein Spiegelbild.<\/td><td>Er wird zur Narzisse, Echo zum bloßen Widerhall.<\/td><\/tr><tr><td>Pyramus und Thisbe<\/td><td>Zwei Liebende sterben durch ein Missverständnis (Vorbild für Romeo und Julia).<\/td><td>Die Früchte des Maulbeerbaums werden dunkelrot.<\/td><\/tr><tr><td>Daedalus und Icarus<\/td><td>Der Sohn fliegt trotz Warnung zu hoch.<\/td><td>Das Wachs der Flügel schmilzt, Icarus stürzt ins Meer.<\/td><\/tr><tr><td>Orpheus und Eurydice<\/td><td>Der Sänger holt seine Frau aus der Unterwelt und verliert sie, weil er sich umdreht.<\/td><td>–<\/td><\/tr><tr><td>Philemon und Baucis<\/td><td>Ein altes Paar nimmt unerkannte Götter gastlich auf.<\/td><td>Sie werden zu Eiche und Linde.<\/td><\/tr><tr><td>Europa<\/td><td>Jupiter entführt die Königstochter in Gestalt eines Stiers.<\/td><td>Der Erdteil trägt ihren Namen.<\/td><\/tr><tr><td>Pygmalion<\/td><td>Ein Bildhauer verliebt sich in seine Statue.<\/td><td>Venus macht sie lebendig.<\/td><\/tr><\/table><\/div>\n<p>Diese Stoffe sind bis heute Vorlage für Malerei, Musik, Literatur und Film. Im Unterricht wird oft nach solchen Nachwirkungen gefragt.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Mythos deuten<\/h4><div class=\"task\">Daedalus warnt seinen Sohn Icarus, weder zu tief noch zu hoch zu fliegen. Icarus fliegt aus Freude am Flug immer höhe
