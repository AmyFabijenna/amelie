r und stürzt ab. Welche Deutungen sind möglich?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erzählkern festhalten: Warnung des Vaters – Übermut des Sohnes – Absturz.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Erste Deutung: Maßhalten. Der Rat „in der Mitte fliegen“ entspricht dem antiken Ideal der <span class=\"la\">aurea mediocritas<\/span>, der goldenen Mitte.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zweite Deutung: Der Mensch überschreitet mit seiner Technik Grenzen, die ihm gesetzt sind. Daedalus bereut am Ende seine Erfindung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Dritte Deutung: das Verhältnis der Generationen. Der Vater kennt die Gefahr, der Sohn will selbst erfahren.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>In einer Interpretationsaufgabe belegst du jede Deutung mit einer Stelle aus dem Text und nennst, wenn verlangt, ein Beispiel für das Weiterleben des Stoffes, etwa ein Gemälde oder die Redewendung vom „Ikarusflug“.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"philo","t":"Philosophie und römische Werte","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die Lehren von Stoa und Epikur in Grundzügen erklären und vergleichen","Cicero und Seneca als philosophische Autoren einordnen","zentrale römische Wertbegriffe übersetzen und deuten","philosophische Aussagen in Texten einer Schule zuordnen"],"ex":[{"type":"mc","q":"Was ist für die Stoiker das höchste Gut?","s":"Glücklich ist nach stoischer Lehre, wer vernünftig und sittlich richtig handelt, unabhängig von äußeren Umständen.","o":["die Tugend (<span class=\"la\">virtus<\/span>)","die Lust (<span class=\"la\">voluptas<\/span>)","der Reichtum","der Ruhm"]},{"type":"mc","q":"Was versteht Epikur unter Lust?","s":"Epikur empfiehlt ein einfaches Leben. Wer wenig braucht, ist selten enttäuscht.","o":["vor allem die Freiheit von Schmerz und innerer Unruhe","möglichst viele und starke Genüsse","Macht über andere Menschen","den Ruhm bei der Nachwelt"]},{"type":"mc","q":"Welcher Autor ist der wichtigste römische Vertreter der Stoa?","s":"Seneca schrieb unter anderem die <span class=\"la\">Epistulae morales ad Lucilium<\/span>. Lukrez ist Epikureer.","o":["Seneca","Lukrez","Catull","Caesar"]},{"type":"mc","q":"Welches Werk stellt die Lehre Epikurs in lateinischen Versen dar?","s":"Lukrez will mit der Atomlehre die Furcht vor den Göttern und vor dem Tod nehmen.","o":["<span class=\"la\">De rerum natura<\/span> von Lukrez","<span class=\"la\">De officiis<\/span> von Cicero","<span class=\"la\">Aeneis<\/span> von Vergil","<span class=\"la\">Ab urbe condita<\/span> von Livius"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">mos maiorum<\/span>?","s":"<span class=\"la\">maiores<\/span> (wörtlich „die Größeren, Älteren“) sind die Vorfahren. Ihr Vorbild war für die Römer der Maßstab richtigen Handelns.","o":["die Sitte der Vorfahren","der größere Brauch","der Tod der Älteren","die Art der Mehrheit"]},{"type":"mc","q":"Welcher Begriff bezeichnet Einfluss, dem andere freiwillig folgen?","s":"<span class=\"la\">potestas<\/span> ist die Amtsgewalt, die man kraft Gesetz hat. <span class=\"la\">auctoritas<\/span> ist das persönliche Gewicht. Augustus sagte von sich, er habe alle an <span class=\"la\">auctoritas<\/span> übertroffen, nicht an <span class=\"la\">potestas<\/span>.","o":["<span class=\"la\">auctoritas<\/span>","<span class=\"la\">potestas<\/span>","<span class=\"la\">clementia<\/span>","<span class=\"la\">voluptas<\/span>"]},{"type":"mc","q":"Welcher Schule steht ein Text nahe, der zum Rückzug aus der Politik und zu einem Leben mit Freunden im Verborgenen rät?","s":"Die Stoa verlangt den Einsatz für die Gemeinschaft. Epikur rät, sich von den Aufregungen der Politik fernzuhalten.","o":["den Epikureern","der Stoa","den Kynikern","keiner, das war in der Antike undenkbar"]},{"type":"self","q":"Erkläre den Unterschied zwischen dem stoischen und dem epikureischen Umgang mit der Furcht vor dem Tod.","s":"Die Stoiker sehen den Tod als Teil der vernünftigen Weltordnung. Wer mit der Natur übereinstimmt, nimmt ihn an, und nur das eigene Urteil macht ihn schrecklich. Die Epikureer argumentieren mit der Atomlehre: Die Seele löst sich mit dem Körper auf, es gibt kein Weiterleben und daher nichts zu fürchten. Solange wir sind, ist der Tod nicht da, und wenn er da ist, sind wir nicht mehr."}],"gen":[],"html":"<h3>Philosophie als Lebenskunst<\/h3>\n<p>Für die Römer war Philosophie keine reine Theorie. Sie sollte die Frage beantworten: <b>Wie lebe ich gut und glücklich?<\/b> Das Ziel heißt <span class=\"la\">vita beata<\/span> oder <span class=\"la\">summum bonum<\/span> (das höchste Gut). Die Antworten kamen aus Griechenland. Cicero machte sie in lateinischer Sprache zugänglich und schuf dabei viele Begriffe, die wir heute noch verwenden (<span class=\"la\">qualitas<\/span>, <span class=\"la\">humanitas<\/span>, <span class=\"la\">moralis<\/span>).<\/p>\n<h3>Stoa und Epikur im Vergleich<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Stoa<\/th><th>Epikureer<\/th><\/tr><tr><td>Gründer<\/td><td>Zenon (um 300 v. Chr.)<\/td><td>Epikur (um 300 v. Chr.)<\/td><\/tr><tr><td>römische Vertreter<\/td><td>Seneca, Mark Aurel; Cicero steht ihr nahe<\/td><td>Lukrez; Horaz mit Sympathie<\/td><\/tr><tr><td>höchstes Gut<\/td><td><span class=\"la\">virtus<\/span>: die Tugend, das sittlich richtige Handeln<\/td><td><span class=\"la\">voluptas<\/span>: die Lust, verstanden als Freiheit von Schmerz und Unruhe<\/td><\/tr><tr><td>Weg zum Glück<\/td><td><span class=\"la\">secundum naturam vivere<\/span>: im Einklang mit der Natur und der Vernunft leben<\/td><td>einfache Bedürfnisse, Freundschaft, Seelenruhe<\/td><\/tr><tr><td>Gefühle<\/td><td>Leidenschaften (<span class=\"la\">affectus<\/span>) sind Krankheiten der Seele und zu überwinden<\/td><td>natürliche Bedürfnisse stillen, unnötige Begierden meiden<\/td><\/tr><tr><td>Weltbild<\/td><td>Die Welt ist von der göttlichen Vernunft (<span class=\"la\">ratio<\/span>, <span class=\"la\">fatum<\/span>) geordnet.<\/td><td>Die Welt besteht aus Atomen und leerem Raum, die Götter greifen nicht ein.<\/td><\/tr><tr><td>Tod<\/td><td>gehört zur Natur und ist nicht zu fürchten<\/td><td>„geht uns nichts an“: Wenn er da ist, sind wir nicht mehr.<\/td><\/tr><tr><td>Politik<\/td><td>Pflicht, sich für die Gemeinschaft einzusetzen<\/td><td>Rückzug: „Lebe im Verborgenen“<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Epikur predigt nicht den hemmungslosen Genuss. „Lust“ bedeutet bei ihm vor allem Schmerzfreiheit und innere Ruhe. Und der Stoiker ist nicht gefühllos, sondern lässt sich von Gefühlen nicht beherrschen. Beide Missverständnisse kommen in Prüfungsantworten oft vor.<\/div>\n<h3>Weitere Richtungen<\/h3>\n<ul><li><b>Sokrates<\/b> (gestorben 399 v. Chr.) schrieb nichts, prüfte im Gespräch die Meinungen seiner Mitbürger und gilt als Vater der Ethik. „Ich weiß, dass ich nichts weiß.“<\/li><li><b>Akademie<\/b> (Platon) und später die <b>Skeptiker<\/b>: Sicheres Wissen ist nicht zu haben, man hält sich an das Wahrscheinliche. Dieser Haltung folgt Cicero.<\/li><li><b>Kyniker<\/b> (Diogenes): radikale Bedürfnislosigkeit, Verachtung von Besitz und Ansehen.<\/li><\/ul>\n<h3>Wichtige Sätze<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lateinisch<\/th><th>Übersetzung<\/th><th>Herkunft<\/th><\/tr><tr><td><span class=\"la\">Non vitae, sed scholae discimus.<\/span><\/td><td>Nicht für das Leben, sondern für die Schule lernen wir. (als Kritik gemeint)<\/td><td>Seneca<\/td><\/tr><tr><td><span class=\"la\">Vivere militare est.<\/span><\/td><td>Leben heißt kämpfen.<\/td><td>Seneca<\/td><\/tr><tr><td><span class=\"la\">Carpe diem.<\/span><\/td><td>Pflücke den Tag.<\/td><td>Horaz<\/td><\/tr><tr><td><span class=\"la\">Aurea mediocritas<\/span><\/td><td>die goldene Mitte<\/td><td>Horaz<\/td><\/tr><tr><td><span class=\"la\">Homo sum, humani nil a me alienum puto.<\/span><\/td><td>Ich bin ein Mensch, nichts Menschliches ist mir fremd.<\/td><td>Terenz<\/td><\/tr><tr><td><span class=\"la\">Cogito, ergo sum.<\/span><\/td><td>Ich denke, also bin ich.<\/td><td>Descartes (17. Jh.)<\/td><\/tr><\/table><\/div>\n<h3>Römische Wertbegriffe<\/h3>\n<p>Diese Wörter lassen sich mit einem einzigen deutschen Wort nicht wiedergeben. Lerne sie mit einer kurzen Erklärung.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Begriff<\/th><th>Bedeutung<\/th><\/tr><tr><td><span class=\"la\">virtus<\/span><\/td><td>von <span class=\"la\">vir<\/span> (Mann): Tapferkeit, Tüchtigkeit, Leistung; bei Philosophen: Tugend<\/td><\/tr><tr><td><span class=\"la\">pietas<\/span><\/td><td>Pflichtgefühl gegenüber Göttern, Familie und Staat<\/td><\/tr><tr><td><span class=\"la\">fides<\/span><\/td><td>Treue, Zuverlässigkeit, Vertrauen; die Grundlage von Verträgen und Freundschaft<\/td><\/tr><tr><td><span class=\"la\">gravitas<\/span><\/td><td>Ernst, Würde im Auftreten<\/td><\/tr><tr><td><span class=\"la\">dignitas<\/span><\/td><td>Ansehen und Rang, die jemandem aufgrund seiner Leistung zustehen<\/td><\/tr><tr><td><span class=\"la\">auctoritas<\/span><\/td><td>persönliches Gewicht, Einfluss, dem man freiwillig folgt<\/td><\/tr><tr><td><span class=\"la\">mos maiorum<\/span><\/td><td>die Sitte der Vorfahren als Maßstab richtigen Handelns<\/td><\/tr><tr><td><span class=\"la\">clementia<\/span><\/td><td>Milde gegenüber Besiegten (Caesars politisches Schlagwort)<\/td><\/tr><tr><td><span class=\"la\">humanitas<\/span><\/td><td>Menschlichkeit und Bildung zugleich<\/td><\/tr><tr><td><span class=\"la\">libertas<\/span><\/td><td>Freiheit des Bürgers; in der Republik: Freiheit von der Herrschaft eines Einzelnen<\/td><\/tr><tr><td><span class=\"la\">gloria<\/span><\/td><td>Ruhm als Lohn für Leistungen im Dienst des Staates<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Aussage einer Schule zuordnen<\/h4><div class=\"task\">In einem Text heißt es sinngemäß: „Nicht die Dinge selbst beunruhigen uns, sondern unsere Meinungen über sie. Wer seine Begierden zügelt und der Vernunft folgt, ist frei, auch wenn er in Ketten liegt.“ Welche Schule spricht hier?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Suche Schlüsselbegriffe: Vernunft, Zügelung der Begierden, innere Freiheit unabhängig von der äußeren Lage.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die Vernunft als Maßstab und die Beherrschung der Leidenschaften sind Kernpunkte der Stoa.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die Idee, dass wahre Freiheit innerlich ist und einem auch im Unglück nicht genommen werden kann, ist typisch stoisch.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ein Epikureer würde eher von Seelenruhe, einfachen Freuden und Freundschaft sprechen und von Vernunft als Mittel zur Lust.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ergebnis: Stoa. In einer Prüfungsantwort nennst du die Schule, zwei Merkmale und belegst sie mit Wörtern aus dem Text.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"prosa","t":"Die Prosa-Autoren","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die wichtigsten Prosa-Autoren mit Lebenszeit und Hauptwerken nennen","ihre sprachlichen Eigenheiten kennen und beim Übersetzen nutzen","Texte anhand von Inhalt und Stil einem Autor zuordnen","Entstehungszeit und Absicht eines Werks berücksichtigen"],"ex":[{"type":"mc","q":"Welcher Autor schreibt über seine eigenen Taten in der 3. Person?","s":"In den <span class=\"la\">Commentarii<\/span> heißt es nie „ich“, sondern immer „Caesar“. Das wirkt sachlich und verschleiert, dass hier jemand in eigener Sache schreibt.","o":["Caesar","Cicero","Seneca","Plinius"]},{"type":"mc","q":"Von wem stammen die <span class=\"la\">Epistulae morales ad Lucilium<\/span>?","s":"In 124 Briefen führt Seneca seinen Freund Lucilius in die stoische Lebenskunst ein.","o":["von Seneca","von Cicero","von Plinius dem Jüngeren","von Hieronymus"]},{"type":"mc","q":"Welches Werk hat Livius geschrieben?","s":"Livius erzählt die römische Geschichte „seit Gründung der Stadt“. Die <span class=\"la\">Annales<\/span> stammen von Tacitus, die Schrift über Catilina von Sallust.","o":["<span class=\"la\">Ab urbe condita<\/span>","<span class=\"la\">De bello Gallico<\/span>","<span class=\"la\">Annales<\/span>","<span class=\"la\">De coniuratione Catilinae<\/span>"]},{"type":"mc","q":"Für welchen Autor sind extreme Kürze, Ellipsen und ein kritischer Blick auf die Kaiser typisch?","s":"Tacitus verdichtet, wo Cicero ausbreitet. Sein Grundsatz, <span class=\"la\">sine ira et studio<\/span> (ohne Zorn und Parteilichkeit) zu schreiben, ist sprichwörtlich geworden.","o":["Tacitus","Nepos","Livius","Cicero"]},{"type":"mc","q":"Wer verfasste die <span class=\"la\">Vulgata<\/span>?","s":"Hieronymus übersetzte um 400 die Bibel aus dem Hebräischen und Griechischen ins Lateinische. Diese Fassung blieb über tausend Jahre maßgeblich.","o":["Hieronymus","Augustinus","Seneca","Tacitus"]},{"type":"mc","q":"In einem spätantiken Text steht <span class=\"la\">Dixit, quia veniret.<\/span> Wie ist <span class=\"la\">quia<\/span> zu übersetzen?","s":"Im späten und im mittelalterlichen Latein ersetzen <span class=\"la\">quia<\/span> und <span class=\"la\">quod<\/span> nach Verben des Sagens den AcI: „Er sagte, dass er komme.“","o":["dass","weil","obwohl","damit"]},{"type":"mc","q":"Welcher Autor war ein <span class=\"la\">homo novus<\/span>, Konsul des Jahres 63 v. Chr. und der bedeutendste Redner Roms?","s":"Cicero deckte als Konsul die Verschwörung des Catilina auf. Im Jahr 43 wurde er auf Befehl des Antonius ermordet.","o":["Cicero","Caesar","Sallust","Livius"]},{"type":"self","q":"Nenne zwei sprachliche Merkmale Ciceros und sage, was sie für dein Vorgehen beim Übersetzen bedeuten.","s":"Erstens lange Perioden mit mehreren ineinandergeschachtelten Gliedsätzen: Ich gliedere zuerst (finite Verben, Einleitewörter, Einrückmethode) und übersetze den Hauptsatz vor den Gliedsätzen. Zweitens steht das Prädikat meist am Satzende, und zusammengehörige Wörter sind oft gesperrt: Ich lese bis zum Punkt und ordne Adjektive über KNG zu. Dazu kommen viele Stilmittel wie Trikolon und Anapher."}],"gen":[],"html":"<h3>Wozu Autorenwissen?<\/h3>\n<p>Jeder Autor hat seine Gewohnheiten. Wer weiß, dass Caesar von sich in der dritten Person schreibt und Tacitus Wörter weglässt, ist beim Übersetzen vorbereitet. In Schularbeiten und bei der Matura steht vor dem Text eine Einleitung mit Autor und Zusammenhang. Dieses Kapitel hilft dir, sie zu nutzen.<\/p>\n<h3>Republik<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Autor<\/th><th>Leben<\/th><th>Werke<\/th><th>Sprache und Besonderheiten<\/th><\/tr><tr><td><b>Caesar<\/b><\/td><td>100–44 v. Chr.<\/td><td><span class=\"la\">Commentarii de bello Gallico<\/span>, <span class=\"la\">De bello civili<\/span><\/td><td>klar, knapp, kleiner Wortschatz; schreibt von sich in der 3. Person; viele Abl. abs. und indirekte Reden; stellt sein Handeln als notwendig dar<\/td><\/tr><tr><td><b>Cicero<\/b><\/td><td>106–43 v. Chr.<\/td><td>Reden (<span class=\"la\">In Catilinam<\/span>, <span class=\"la\">In Verrem<\/span>), philosophische Schriften (<span class=\"la\">De re publica<\/span>, <span class=\"la\">De officiis<\/span>, <span class=\"la\">De amicitia<\/span>), Briefe<\/td><td>lange, kunstvoll gebaute Perioden, das Verb am Schluss; viele Stilmittel; Maßstab für „klassisches“ Latein<\/td><\/tr><tr><td><b>Sallust<\/b><\/td><td>86–35 v. Chr.<\/td><td><span class=\"la\">De coniuratione Catilinae<\/span>, <span class=\"la\">Bellum Iugurthinum<\/span><\/td><td>gedrängt, altertümliche Formen (<span class=\"la\">optumus<\/span>, <span class=\"la\">lubido<\/span>), Asyndeta, Infinitive als Prädikat; beklagt den Sittenverfall<\/td><\/tr><tr><td><b>Nepos<\/b><\/td><td>um 100–25 v. Chr.<\/td><td><span class=\"la\">De viris illustribus<\/span> (Lebensbeschreibungen, etwa Hannibal)<\/td><td>einfach und kurz, daher oft erste Lektüre<\/td><\/tr><\/table><\/div>\n<h3>Kaiserzeit<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Autor<\/th><th>Leben<\/th><th>Werke<\/th><th>Sprache und Besonderheiten<\/th><\/tr><tr><td><b>Livius<\/b><\/td><td>59 v. Chr.–17 n. Chr.<\/td><td><span class=\"la\">Ab urbe condita<\/span> (Geschichte Roms seit der Gründung)<\/td><td>erzählfreudig, anschauliche Szenen, Vorbilder (<span class=\"la\">exempla<\/span>) für richtiges und falsches Handeln<\/td><\/tr><tr><td><b>Seneca<\/b><\/td><td>um 4 v. Chr.–65 n. Chr.<\/td><td><span class=\"la\">Epistulae morales<\/span>, Dialoge (<span class=\"la\">De brevitate vitae<\/span>), Tragödien<\/td><td>kurze, zugespitzte Sätze (Sentenzen), Gegensätze, direkte Anrede; Erzieher und Opfer Neros<\/td><\/tr><tr><td><b>Petron<\/b><\/td><td>gestorben 66 n. Chr.<\/td><td><span class=\"la\">Satyrica<\/span> mit dem „Gastmahl des Trimalchio“<\/td><td>Roman, Umgangssprache der Freigelassenen, Spott auf Neureiche<\/td><\/tr><tr><td><b>Plinius der Jüngere<\/b><\/td><td>um 61–113 n. Chr.<\/td><td>Briefe (Vesuvbriefe, Christenbrief an Trajan)<\/td><td>gepflegt und klar, jedes Thema ein kleines Kunstwerk<\/td><\/tr><tr><td><b>Tacitus<\/b><\/td><td>um 55–120 n. Chr.<\/td><td><span class=\"la\">Annales<\/span>, <span class=\"la\">Historiae<\/span>, <span class=\"la\">Germania<\/span>, <span class=\"la\">Agricola<\/span><\/td><td>extrem knapp, Ellipsen, ungewöhnliche Wortstellung; kritischer Blick auf die Kaiser<\/td><\/tr><tr><td><b>Sueton<\/b><\/td><td>um 70–130 n. Chr.<\/td><td><span class=\"la\">De vita Caesarum<\/span> (Kaiserbiographien)<\/td><td>sachlich, viele Anekdoten<\/td><\/tr><\/table><\/div>\n<h3>Spätantike und Christentum<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Autor<\/th><th>Leben<\/th><th>Werke<\/th><th>Besonderheiten<\/th><\/tr><tr><td><b>Hieronymus<\/b><\/td><td>um 347–420<\/td><td><span class=\"la\">Vulgata<\/span>: die lateinische Bibelübersetzung<\/td><td>einfache Sätze, viele <span class=\"la\">et<\/span>, <span class=\"la\">quia<\/span>- und <span class=\"la\">quod<\/span>-Sätze statt AcI<\/td><\/tr><tr><td><b>Augustinus<\/b><\/td><td>354–430<\/td><td><span class=\"la\">Confessiones<\/span> (Bekenntnisse), <span class=\"la\">De civitate Dei<\/span><\/td><td>persönlich, rhetorisch geschult, Anrede an Gott<\/td><\/tr><\/table><\/div>\n<h3>Was das für dein Übersetzen bedeutet<\/h3>\n<ul><li>Bei <b>Caesar<\/b>: <span class=\"la\">Caesar<\/span> im Text ist der Autor selbst. Rechne mit Abl. abs. am Satzanfang (<span class=\"la\">his rebus cognitis<\/span>) und langen indirekten Reden.<\/li><li>Bei <b>Cicero<\/b>: Lies bis zum Punkt und suche das Verb am Ende. Gliedere mit der Einrückmethode.<\/li><li>Bei <b>Sallust<\/b> und <b>Tacitus<\/b>: Ergänze fehlende Formen von <span class=\"la\">esse<\/span> und fehlende Verbindungswörter.<\/li><li>Bei <b>Seneca<\/b>: Achte auf Gegensatzpaare und übersetze die Pointen knapp.<\/li><li>Bei der <b>Vulgata<\/b>: <span class=\"la\">quia<\/span> und <span class=\"la\">quod<\/span> heißen nach Verben des Sagens einfach „dass“.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Einen Text einem Autor zuordnen<\/h4><div class=\"task\">Ein Text lautet: <span class=\"la\">His rebus cognitis Caesar legiones ex castris eduxit et, cum hostes in conspectu essent, suos cohortatus proelium commisit.<\/span> Von wem stammt er vermutlich, und woran erkennst du es?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Inhalt: Ein Feldherr namens Caesar führt Legionen aus dem Lager und beginnt eine Schlacht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Erzählform: 3. Person, obwohl der Feldherr die Hauptfigur ist. Das ist Caesars Markenzeichen in den <span class=\"la\">Commentarii<\/span>.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Sprache: Ablativus absolutus am Anfang (<span class=\"la\">his rebus cognitis<\/span>), <span class=\"la\">cum<\/span> mit Konjunktiv, ein Partizip eines Deponens (<span class=\"la\">cohortatus<\/span>), militärischer Wortschatz. Alles typisch für Caesar.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Kein schmückendes Beiwerk, keine Bewertung: der nüchterne Berichtsstil.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Übersetzung: „Als Caesar das erfahren hatte, führte er die Legionen aus dem Lager, und als die Feinde in Sichtweite waren, feuerte er seine Leute an und begann die Schlacht.“<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"dichter","t":"Die Dichter","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die wichtigsten Dichter mit Lebenszeit, Gattung und Hauptwerk nennen","Besonderheiten der Dichtersprache erkennen","Gedichte und Epenstellen einem Autor zuordnen","zentrale Themen wie Liebe, Lebenskunst und Sendung Roms einordnen"],"ex":[{"type":"mc","q":"Wer schrieb die <span class=\"la\">Aeneis<\/span>?","s":"Vergil arbeitete elf Jahre an dem Epos und starb, bevor er es ganz überarbeitet hatte.","o":["Vergil","Ovid","Horaz","Catull"]},{"type":"mc","q":"Von wem stammt das Gedicht, das mit <span class=\"la\">Odi et amo<\/span> beginnt?","s":"Das Zweizeiler-Gedicht fasst Catulls zerrissene Liebe zu Lesbia zusammen.","o":["von Catull","von Horaz","von Martial","von Tibull"]},{"type":"mc","q":"Welcher Dichter prägte die Wendung <span class=\"la\">carpe diem<\/span>?","s":"Sie steht in einer Ode an Leuconoe. Gemeint ist kein hemmungsloser Genuss, sondern der bewusste Umgang mit der begrenzten Zeit.","o":["Horaz","Vergil","Ovid","Lukrez"]},{"type":"mc","q":"Welches Werk Ovids erzählt Verwandlungssagen?","s":"<span class=\"la\">metamorphosis<\/span> ist griechisch und heißt Verwandlung. Die <span class=\"la\">Tristia<\/span> sind die Klagelieder aus der Verbannung.","o":["die <span class=\"la\">Metamorphosen<\/span>","die <span class=\"la\">Tristia<\/span>","die <span class=\"la\">Amores<\/span>","die <span class=\"la\">Ars amatoria<\/span>"]},{"type":"mc","q":"Was ist mit <span class=\"la\">tecta<\/span> in einem Vers meist gemeint?","s":"Zwei Dichtergewohnheiten zugleich: Plural für ein Einzelding und ein Teil für das Ganze.","o":["das Haus (dichterischer Plural, Dach für Haus)","mehrere Dächer","die Bedeckten","die Stadtmauern"]},{"type":"mc","q":"Welche Form ist <span class=\"la\">omnis<\/span> in einem Vergilvers, wenn es zu <span class=\"la\">terras<\/span> gehört?","s":"Bei i-Stämmen verwenden Dichter (und manche Prosaautoren) den Akkusativ Plural auf <span class=\"la\">-is<\/span>. Das Bezugswort <span class=\"la\">terras<\/span> zeigt Kasus und Numerus.","o":["Akkusativ Plural (= <span class=\"la\">omnes<\/span>)","Nominativ Singular","Genitiv Singular","Dativ Plural"]},{"type":"mc","q":"Welche Gattung pflegten Plautus und Terenz?","s":"Ihre Stücke folgen griechischen Vorbildern und sind die ältesten vollständig erhaltenen Werke der lateinischen Literatur.","o":["die Komödie","das Epos","die Elegie","das Epigramm"]},{"type":"self","q":"Erkläre, warum Ovid aus Rom verbannt wurde und wo sich das in seinem Werk zeigt.","s":"Augustus verbannte ihn 8 n. Chr. nach Tomi am Schwarzen Meer. Ovid selbst nennt <span class=\"la\">carmen et error<\/span>, ein Gedicht und einen Fehltritt. Mit dem Gedicht ist wohl die <span class=\"la\">Ars amatoria<\/span> gemeint, deren spielerischer Umgang mit der Liebe zur Sittenpolitik des Augustus nicht passte. Der Fehltritt bleibt unbekannt. In den <span class=\"la\">Tristia<\/span> und den <span class=\"la\">Epistulae ex Ponto<\/span> klagt Ovid über die Verbannung und bittet vergeblich um Rückkehr."}],"gen":[],"html":"<h3>Die Dichter auf einen Blick<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Dichter<\/th><th>Leben<\/th><th>Gattung und Werke<\/th><th>Themen<\/th><\/tr><tr><td><b>Plautus<\/b><\/td><td>um 250–184 v. Chr.<\/td><td>Komödien (<span class=\"la\">Miles gloriosus<\/span>, <span class=\"la\">Aulularia<\/span>)<\/td><td>derber Witz, schlaue Sklaven, Verwechslungen<\/td><\/tr><tr><td><b>Terenz<\/b><\/td><td>um 190–159 v. Chr.<\/td><td>Komödien (<span class=\"la\">Adelphoe<\/span>)<\/td><td>feinerer Humor, Erziehung, Menschlichkeit<\/td><\/tr><tr><td><b>Lukrez<\/b><\/td><td>um 97–55 v. Chr.<\/td><td>Lehrgedicht <span class=\"la\">De rerum natura<\/span><\/td><td>Lehre Epikurs, Atome, Befreiung von Furcht<\/td><\/tr><tr><td><b>Catull<\/b><\/td><td>um 84–54 v. Chr.<\/td><td>Gedichtsammlung (<span class=\"la\">Carmina<\/span>)<\/td><td>Liebe zu Lesbia zwischen Glück und Verzweiflung, Freundschaft, Spott<\/td><\/tr><tr><td><b>Vergil<\/b><\/td><td>70–19 v. Chr.<\/td><td><span class=\"la\">Bucolica<\/span> (Hirtengedichte), <span class=\"la\">Georgica<\/span>, <span class=\"la\">Aeneis<\/span><\/td><td>Sendung Roms, <span class=\"la\">pietas<\/span>, Leid der Einzelnen<\/td><\/tr><tr><td><b>Horaz<\/b><\/td><td>65–8 v. Chr.<\/td><td><span class=\"la\">Carmina<\/span> (Oden), Satiren, Episteln<\/td><td>Lebenskunst, Maß, Freundschaft, Vergänglichkeit<\/td><\/tr><tr><td><b>Tibull<\/b>, <b>Properz<\/b><\/td><td>um 55–19 und um 50–15 v. Chr.<\/td><td>Liebeselegien<\/td><td>Leben für die Liebe statt für Krieg und Karriere<\/td><\/tr><tr><td><b>Ovid<\/b><\/td><td>43 v. Chr.–17 n. Chr.<\/td><td><span class=\"la\">Amores<\/span>, <span class=\"la\">Ars amatoria<\/span>, <span class=\"la\">Metamorphosen<\/span>, <span class=\"la\">Tristia<\/span><\/td><td>Liebe als Spiel, Mythen von Verwandlungen, Klage aus der Verbannung<\/td><\/tr><tr><td><b>Phaedrus<\/b><\/td><td>1. Jh. n. Chr.<\/td><td>Fabeln<\/td><td>Kritik der Schwachen an den Mächtigen<\/td><\/tr><tr><td><b>Martial<\/b><\/td><td>um 40–104 n. Chr.<\/td><td>Epigramme<\/td><td>Spott über Zeitgenossen, Schlusspointe<\/td><\/tr><tr><td><b>Juvenal<\/b><\/td><td>um 60–130 n. Chr.<\/td><td>Satiren<\/td><td>bittere Kritik an den Zuständen in Rom<\/td><\/tr><\/table><\/div>\n<h3>Drei, die du genauer kennen musst<\/h3>\n<p><b>Catull<\/b> gehört zu einem Kreis junger Dichter, die kurze, persönliche, sorgfältig gefeilte Gedichte schreiben. Die Geliebte nennt er <span class=\"la\">Lesbia<\/span>. Sein berühmtestes Gedicht hat nur zwei Verse: <span class=\"la\">Odi et amo.<\/span> („Ich hasse und ich liebe.“)<\/p>\n<p><b>Vergils<\/b> <span class=\"la\">Aeneis<\/span> erzählt in zwölf Büchern die Flucht des Aeneas aus Troja und seinen Kampf um eine neue Heimat in Italien. Das Werk feiert die Bestimmung Roms zur Herrschaft und verschweigt doch nicht, was sie kostet: Dido, die verlassene Königin von Karthago, und Turnus, der unterlegene Gegner, gehören zu den eindrucksvollsten Gestalten.<\/p>\n<p><b>Ovid<\/b> erzählt in den <span class=\"la\">Metamorphosen<\/span> rund 250 Verwandlungssagen vom Anfang der Welt bis zu Caesar, leicht und geistreich. Im Jahr 8 n. Chr. verbannte ihn Augustus nach Tomi am Schwarzen Meer. Als Gründe nennt Ovid <span class=\"la\">carmen et error<\/span>, ein Gedicht (wohl die <span class=\"la\">Ars amatoria<\/span>) und einen Fehltritt.<\/p>\n<h3>Die Sprache der Dichter<\/h3>\n<p>Dichtung ist schwerer zu übersetzen als Prosa, weil der Vers die Wortstellung bestimmt. Darauf musst du dich einstellen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Erscheinung<\/th><th>Erklärung<\/th><th>Beispiel<\/th><\/tr><tr><td>weite Sperrung (Hyperbaton)<\/td><td>Adjektiv und Substantiv stehen oft an den Enden des Verses oder umrahmen ihn.<\/td><td>Ordne streng nach KNG zu.<\/td><\/tr><tr><td>dichterischer Plural<\/td><td>Plural, wo ein einzelnes Ding gemeint ist<\/td><td><span class=\"la\">tecta<\/span> für „das Haus“, <span class=\"la\">ora<\/span> für „das Gesicht“<\/td><\/tr><tr><td>Kurzformen<\/td><td><span class=\"la\">-ere<\/span> statt <span class=\"la\">-erunt<\/span>, <span class=\"la\">-um<\/span> statt <span class=\"la\">-orum<\/span><\/td><td><span class=\"la\">dedere<\/span> = <span class=\"la\">dederunt<\/span>, <span class=\"la\">deum<\/span> = <span class=\"la\">deorum<\/span><\/td><\/tr><tr><td>Akkusativ Plural auf <span class=\"la\">-is<\/span><\/td><td>bei i-Stämmen<\/td><td><span class=\"la\">omnis<\/span> = <span class=\"la\">omnes<\/span>, <span class=\"la\">urbis<\/span> = <span class=\"la\">urbes<\/span><\/td><\/tr><tr><td>fehlende Präposition<\/td><td>bloßer Ablativ oder Akkusativ bei Ortsangaben<\/td><td><span class=\"la\">Italiam venit<\/span> – „er kam nach Italien“<\/td><\/tr><tr><td>griechische Formen<\/td><td>vor allem bei Namen<\/td><td>Akkusativ <span class=\"la\">Aenean<\/span>, <span class=\"la\">Daphnen<\/span><\/td><\/tr><tr><td>Umschreibungen<\/td><td>Götternamen und Herkunftsbezeichnungen statt des einfachen Namens<\/td><td><span class=\"la\">Cytherea<\/span> für Venus, <span class=\"la\">Anchisiades<\/span> für Aeneas<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Bei einem Vers gehst du so vor: zuerst das Prädikat, dann alle Wortpaare über KNG verbinden (am besten mit Bögen im Text), dann erst die Reihenfolge fürs Deutsche herstellen. Lies dir danach den Vers im Rhythmus vor: Was am Versanfang und am Versende steht, ist betont.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Zwei Verse übersetzen<\/h4><div class=\"task\">Übersetze: <span class=\"la\">In nova fert animus mutatas dicere formas / corpora.<\/span> (Ovid, Metamorphosen 1, 1–2; fert animus = der Sinn treibt mich)<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Prädikat: <span class=\"la\">fert<\/span> mit dem Subjekt <span class=\"la\">animus<\/span>. Davon hängt der Infinitiv <span class=\"la\">dicere<\/span> ab: „Der Sinn treibt mich zu erzählen“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Objekt zu <span class=\"la\">dicere<\/span>: <span class=\"la\">formas<\/span> (Gestalten), dazu das Partizip <span class=\"la\">mutatas<\/span> (verwandelt), beide Akkusativ Plural feminin.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">in nova … corpora<\/span>: <span class=\"la\">in<\/span> mit Akkusativ. <span class=\"la\">nova<\/span> gehört zu <span class=\"la\">corpora<\/span> (Akkusativ Plural Neutrum), obwohl ein ganzer Vers dazwischen liegt: „in neue Körper“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zusammensetzen: „Der Sinn treibt mich, von Gestalten zu erzählen, die in neue Körper verwandelt wurden.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Beobachtung: Das Wort <span class=\"la\">corpora<\/span> steht erst im zweiten Vers (Enjambement). Die Wortstellung ahmt die Verwandlung nach: <span class=\"la\">nova<\/span> und <span class=\"la\">corpora<\/span> sind weit voneinander getrennt, das Thema „neu“ steht programmatisch ganz vorne.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"nachantik","t":"Latein nach der Antike: Mittelalter, Humanismus, Austria Latina","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die Besonderheiten des mittelalterlichen Lateins erkennen und beim Übersetzen berücksichtigen","wichtige Texte und Autoren aus Mittelalter und Neuzeit einordnen","römische Spuren und lateinische Texte aus dem österreichischen Raum nennen","einfache Inschriften mit Hilfe der gängigen Abkürzungen lesen"],"ex":[{"type":"mc","q":"Wie lautet <span class=\"la\">celum<\/span> aus einem mittelalterlichen Text in klassischer Schreibung?","s":"Im Mittelalter schrieb man für <span class=\"la\">ae<\/span> meist einfaches <span class=\"la\">e<\/span>. <span class=\"la\">caelum<\/span> heißt Himmel.","o":["<span class=\"la\">caelum<\/span>","<span class=\"la\">celer<\/span>","<span class=\"la\">cella<\/span>","<span class=\"la\">collum<\/span>"]},{"type":"mc","q":"Wie übersetzt man <span class=\"la\">miles<\/span> in einem Text des 12. Jahrhunderts meist?","s":"Viele Wörter bekamen im Mittelalter neue Bedeutungen. Aus dem Soldaten wurde der Ritter, aus dem <span class=\"la\">dux<\/span> der Herzog, aus dem <span class=\"la\">comes<\/span> der Graf.","o":["Ritter","Soldat","Meile","Bote"]},{"type":"mc","q":"Welche Stadt hieß in römischer Zeit <span class=\"la\">Iuvavum<\/span>?","s":"Wien hieß <span class=\"la\">Vindobona<\/span>, Bregenz <span class=\"la\">Brigantium<\/span>, Wels <span class=\"la\">Ovilava<\/span>.","o":["Salzburg","Wien","Bregenz","Wels"]},{"type":"mc","q":"Was beschreibt die <span class=\"la\">Vita Sancti Severini<\/span> des Eugippius?","s":"Die Schrift ist eine der wichtigsten Quellen für das Ende der Römerzeit im Donauraum. Das Leben Karls des Großen schrieb Einhard.","o":["das Leben eines Heiligen an der Donau in der Zeit, als die römische Herrschaft zerfiel","das Leben Karls des Großen","die Gründung Wiens durch die Römer","den Feldzug Mark Aurels gegen die Markomannen"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">D M<\/span> am Anfang einer Grabinschrift?","s":"Die <span class=\"la\">di Manes<\/span> sind die Geister der Verstorbenen. Die Formel steht auf unzähligen Grabsteinen der Kaiserzeit.","o":["Dis Manibus – den Totengöttern","Deo Maximo – dem größten Gott","Domino Meo – meinem Herrn","Dies Mortis – Todestag"]},{"type":"mc","q":"Was bedeutet <span class=\"la\">in dubio pro reo<\/span>?","s":"<span class=\"la\">reus<\/span> ist der Angeklagte. Wenn die Schuld nicht bewiesen ist, muss freigesprochen werden.","o":["Im Zweifel für den Angeklagten.","Im Zweifel gegen den Angeklagten.","Ohne Zweifel schuldig.","Der Angeklagte hat das letzte Wort."]},{"type":"mc","q":"Wen nahmen sich die Humanisten sprachlich zum Vorbild?","s":"Sie wollten zum klassischen Latein zurück und lehnten die Sprache des Mittelalters als verdorben ab.","o":["Cicero","die Vulgata","die Carmina Burana","Einhard"]},{"type":"self","q":"Übersetze den mittelalterlichen Satz und nenne zwei Abweichungen vom klassischen Latein: <span class=\"la\">Rex dixit militibus suis, quod civitatem defenderent.<\/span>","s":"„Der König sagte seinen Rittern, dass sie die Stadt verteidigen sollten.“ Abweichungen: <span class=\"la\">quod<\/span> mit Konjunktiv statt eines AcI oder eines <span class=\"la\">ut<\/span>-Satzes; <span class=\"la\">milites<\/span> in der Bedeutung „Ritter“ und <span class=\"la\">civitas<\/span> in der Bedeutung „Stadt“ (klassisch: Bürgerschaft, Staat)."}],"gen":[],"html":"<h3>Latein blieb<\/h3>\n<p>Mit dem Ende des Weströmischen Reichs hörte das Lateinische nicht auf. Es blieb weit über tausend Jahre die Sprache der Kirche, der Schulen und Universitäten, des Rechts und der Wissenschaft. Der größte Teil aller lateinischen Texte, die es gibt, stammt aus der Zeit <b>nach<\/b> der Antike. Im Unterricht begegnen dir solche Texte in mehreren Themenbereichen.<\/p>\n<h3>Mittellatein: Was anders ist<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Erscheinung<\/th><th>Beispiel<\/th><th>Klassisch<\/th><\/tr><tr><td><span class=\"la\">e<\/span> statt <span class=\"la\">ae<\/span> und <span class=\"la\">oe<\/span><\/td><td><span class=\"la\">puelle<\/span>, <span class=\"la\">celum<\/span>, <span class=\"la\">pena<\/span><\/td><td><span class=\"la\">puellae<\/span>, <span class=\"la\">caelum<\/span>, <span class=\"la\">poena<\/span><\/td><\/tr><tr><td><span class=\"la\">quod<\/span>, <span class=\"la\">quia<\/span>, <span class=\"la\">quoniam<\/span> + Verb statt AcI<\/td><td><span class=\"la\">dixit, quod veniret<\/span><\/td><td><span class=\"la\">dixit se venire<\/span><\/td><\/tr><tr><td>Präpositionen statt bloßer Fälle<\/td><td><span class=\"la\">de<\/span> + Abl. für den Genitiv, <span class=\"la\">ad<\/span> + Akk. für den Dativ<\/td><td>Genitiv, Dativ<\/td><\/tr><tr><td>neue Bedeutungen<\/td><td><span class=\"la\">comes<\/span> Graf, <span class=\"la\">dux<\/span> Herzog, <span class=\"la\">miles<\/span> Ritter, <span class=\"la\">civitas<\/span> Stadt, <span class=\"la\">villa<\/span> Dorf<\/td><td>Begleiter, Anführer, Soldat, Bürgerschaft, Landgut<\/td><\/tr><tr><td><span class=\"la\">unus<\/span> und <span class=\"la\">ille<\/span> als Artikel<\/td><td><span class=\"la\">unus homo<\/span> – ein Mann<\/td><td>–<\/td><\/tr><tr><td>Reim und betonender Rhythmus in der Dichtung<\/td><td>Hymnen, Vagantenlieder<\/td><td>Versmaß nach Längen<\/td><\/tr><\/table><\/div>\n<p>In diesen Veränderungen siehst du die romanischen Sprachen entstehen.<\/p>\n<h3>Texte und Autoren<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Zeit<\/th><th>Autor oder Werk<\/th><th>Inhalt<\/th><\/tr><tr><td>um 400<\/td><td>Hieronymus, <span class=\"la\">Vulgata<\/span><\/td><td>lateinische Bibel<\/td><\/tr><tr><td>um 400<\/td><td>Augustinus, <span class=\"la\">Confessiones<\/span><\/td><td>Lebensbericht und Suche nach Gott<\/td><\/tr><tr><td>um 511<\/td><td>Eugippius, <span class=\"la\">Vita Sancti Severini<\/span><\/td><td>Leben des heiligen Severin an der Donau während der Auflösung der römischen Herrschaft<\/td><\/tr><tr><td>um 830<\/td><td>Einhard, <span class=\"la\">Vita Karoli Magni<\/span><\/td><td>Lebensbeschreibung Karls des Großen<\/td><\/tr><tr><td>12./13. Jh.<\/td><td><span class=\"la\">Carmina Burana<\/span><\/td><td>Lieder über Liebe, Trinken, Glück und Kritik an der Kirche (<span class=\"la\">O Fortuna<\/span>)<\/td><\/tr><tr><td>13. Jh.<\/td><td><span class=\"la\">Legenda aurea<\/span>; <span class=\"la\">Gesta Romanorum<\/span><\/td><td>Heiligenlegenden; unterhaltsame Geschichten mit Moral<\/td><\/tr><tr><td>14.–16. Jh.<\/td><td>Humanisten: Petrarca, Erasmus von Rotterdam, Thomas Morus<\/td><td>Rückkehr zum klassischen Latein; <span class=\"la\">Laus stultitiae<\/span> (Lob der Torheit), <span class=\"la\">Utopia<\/span><\/td><\/tr><tr><td>16.–18. Jh.<\/td><td>Kopernikus, Kepler, Newton, Linné<\/td><td>Latein als Sprache der Wissenschaft<\/td><\/tr><\/table><\/div>\n<p>Die <b>Humanisten<\/b> nahmen sich Cicero zum Vorbild und verachteten das Latein des Mittelalters. Ihr Bildungsideal, die <span class=\"la\">studia humanitatis<\/span>, wirkt im Namen „humanistisches Gymnasium“ nach.<\/p>\n<h3>Austria Latina<\/h3>\n<p>Das Gebiet des heutigen Österreich gehörte zu drei römischen Provinzen: <b>Noricum<\/b> (der größte Teil), <b>Raetia<\/b> (im Westen) und <b>Pannonia<\/b> (im Osten). Die Donau bildete die Grenze, den <span class=\"la\">Limes<\/span>.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Römischer Name<\/th><th>Heute<\/th><\/tr><tr><td><span class=\"la\">Vindobona<\/span><\/td><td>Wien<\/td><\/tr><tr><td><span class=\"la\">Carnuntum<\/span><\/td><td>bei Petronell und Bad Deutsch-Altenburg; Hauptstadt Oberpannoniens<\/td><\/tr><tr><td><span class=\"la\">Iuvavum<\/span><\/td><td>Salzburg<\/td><\/tr><tr><td><span class=\"la\">Lauriacum<\/span><\/td><td>Enns-Lorch<\/td><\/tr><tr><td><span class=\"la\">Ovilava<\/span><\/td><td>Wels<\/td><\/tr><tr><td><span class=\"la\">Virunum<\/span><\/td><td>auf dem Zollfeld bei Klagenfurt; Hauptstadt Noricums<\/td><\/tr><tr><td><span class=\"la\">Flavia Solva<\/span><\/td><td>bei Leibnitz<\/td><\/tr><tr><td><span class=\"la\">Aguntum<\/span><\/td><td>bei Lienz<\/td><\/tr><tr><td><span class=\"la\">Brigantium<\/span><\/td><td>Bregenz<\/td><\/tr><\/table><\/div>\n<p>Lateinische Texte mit Österreichbezug reichen von römischen Grabsteinen über die <span class=\"la\">Vita Severini<\/span> bis zu Enea Silvio Piccolomini (später Papst Pius II.), der im 15. Jahrhundert das Leben in Wien beschrieb, und zu den vielen Inschriften an Kirchen, Denkmälern und Universitäten.<\/p>\n<h3>Inschriften lesen<\/h3>\n<p>Inschriften sparen Platz durch Abkürzungen. Mit wenigen davon verstehst du die meisten Grabsteine und Bauinschriften.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Abkürzung<\/th><th>Auflösung<\/th><th>Bedeutung<\/th><\/tr><tr><td>D M<\/td><td><span class=\"la\">Dis Manibus<\/span><\/td><td>den Totengöttern (Beginn vieler Grabinschriften)<\/td><\/tr><tr><td>F / FIL<\/td><td><span class=\"la\">filius, filia<\/span><\/td><td>Sohn, Tochter<\/td><\/tr><tr><td>VIX ANN<\/td><td><span class=\"la\">vixit annos<\/span><\/td><td>lebte … Jahre<\/td><\/tr><tr><td>H S E<\/td><td><span class=\"la\">hic situs est<\/span><\/td><td>hier liegt er begraben<\/td><\/tr><tr><td>S T T L<\/td><td><span class=\"la\">sit tibi terra levis<\/span><\/td><td>die Erde sei dir leicht<\/td><\/tr><tr><td>V S L M<\/td><td><span class=\"la\">votum solvit libens merito<\/span><\/td><td>hat das Gelübde gern und verdientermaßen erfüllt<\/td><\/tr><tr><td>IMP CAES<\/td><td><span class=\"la\">Imperator Caesar<\/span><\/td><td>Beginn der Kaisertitel<\/td><\/tr><tr><td>COS<\/td><td><span class=\"la\">consul<\/span><\/td><td>Konsul<\/td><\/tr><tr><td>P P<\/td><td><span class=\"la\">pater patriae<\/span><\/td><td>Vater des Vaterlandes<\/td><\/tr><tr><td>F C<\/td><td><span class=\"la\">faciendum curavit<\/span><\/td><td>ließ errichten<\/td><\/tr><\/table><\/div>\n<p>In Inschriften steht V für U und meist nur Großschrift ohne Wortabstände. Neuzeitliche Inschriften verstecken oft eine Jahreszahl: In einem <b>Chronogramm<\/b> ergeben die hervorgehobenen Buchstaben, als römische Zahlen gelesen und addiert, das Jahr.<\/p>\n<h3>Latein in den Fachsprachen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Bereich<\/th><th>Beispiele<\/th><\/tr><tr><td>Recht<\/td><td><span class=\"la\">in dubio pro reo<\/span> (im Zweifel für den Angeklagten), <span class=\"la\">nulla poena sine lege<\/span> (keine Strafe ohne Gesetz), <span class=\"la\">pacta sunt servanda<\/span><\/td><\/tr><tr><td>Medizin<\/td><td><span class=\"la\">musculus<\/span>, <span class=\"la\">cor<\/span>, <span class=\"la\">pulmo<\/span>; Anweisungen wie <span class=\"la\">per os<\/span> (durch den Mund)<\/td><\/tr><tr><td>Biologie<\/td><td>zweiteilige Artnamen nach Linné: <span class=\"la\">Homo sapiens<\/span>, <span class=\"la\">Canis lupus<\/span><\/td><\/tr><tr><td>Wissenschaft allgemein<\/td><td><span class=\"la\">et al.<\/span> (<span class=\"la\">et alii<\/span>, und andere), <span class=\"la\">ibid.<\/span> (<span class=\"la\">ibidem<\/span>, ebendort), <span class=\"la\">sic<\/span> (so steht es da)<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Eine Grabinschrift lesen<\/h4><div class=\"task\">Lies und übersetze: <span class=\"la\">D M · C IVLIVS C F SEVERVS · VIX ANN XXX · H S E · IVLIA MATER F C<\/span><\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div><span class=\"la\">D M<\/span> = <span class=\"la\">Dis Manibus<\/span>: „Den Totengöttern“. Das zeigt: Es ist ein Grabstein.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div><span class=\"la\">C IVLIVS C F SEVERVS<\/span> = <span class=\"la\">Gaius Iulius Gai filius Severus<\/span>: der Name des Verstorbenen mit Angabe des Vaters. „Gaius Iulius Severus, Sohn des Gaius“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div><span class=\"la\">VIX ANN XXX<\/span> = <span class=\"la\">vixit annos triginta<\/span>: „lebte dreißig Jahre“. Akkusativ der Zeitdauer.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><span class=\"la\">H S E<\/span> = <span class=\"la\">hic situs est<\/span>: „liegt hier begraben“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div><span class=\"la\">IVLIA MATER F C<\/span> = <span class=\"la\">Iulia mater faciendum curavit<\/span>: „Seine Mutter Iulia ließ (den Stein) errichten.“<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Was man daraus erfährt: Die Mutter trägt den Familiennamen in weiblicher Form, und sie hat ihren Sohn überlebt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"module","t":"Die Lektürethemen der Oberstufe: ein Wegweiser","kl":"3","k":3,"a":"K","tag":"Lektüre","goals":["die Themenbereiche der Lektürephase kennen","zu jedem Thema passende Autoren, Texte und Leitfragen nennen","Texte verschiedener Epochen unter einer gemeinsamen Fragestellung vergleichen","gezielt die Kapitel dieses Kurses für ein Thema nutzen"],"ex":[{"type":"mc","q":"Wie ist die Lektüre in der Oberstufe organisiert?","s":"Zu einem Thema wie „Suche nach Sinn und Glück“ können Seneca, Horaz und Augustinus nebeneinander stehen.","o":["nach Themen, zu denen Texte verschiedener Autoren und Zeiten gelesen werden","streng nach Autoren in zeitlicher Reihenfolge","nur nach Gattungen","jede Klasse liest ein einziges Gesamtwerk"]},{"type":"mc","q":"Zu welchem Thema passt ein Auszug aus Senecas <span class=\"la\">Epistulae morales<\/span> über den richtigen Umgang mit der Zeit am besten?","s":"Senecas Briefe geben Ratschläge für ein gelingendes Leben. Das ist das Kernanliegen der antiken Philosophie.","o":["Suche nach Sinn und Glück (Formen der Lebensbewältigung)","Austria Latina","Witz, Spott, Ironie","Fachsprachen und Fachtexte"]},{"type":"mc","q":"Zu welchem Thema passt Tacitus’ <span class=\"la\">Germania<\/span>?","s":"Die Schrift beschreibt Land, Sitten und Stämme der Germanen aus römischer Sicht.","o":["Begegnung und Umgang mit dem Fremden","Eros und Amor","Religio","Der Mensch in seinem Alltag in Rom"]},{"type":"mc","q":"Welcher Autor ist für das Thema „Witz, Spott, Ironie“ besonders ergiebig?","s":"Martials Epigramme verspotten Geizige, Angeber, schlechte Dichter und Ärzte, immer mit einer Pointe am Schluss.","o":["Martial","Caesar","Livius","Hieronymus"]},{"type":"mc","q":"Was ist der erste Schritt bei einem Textvergleich?","s":"Ohne klare Frage wird der Vergleich zur Aufzählung. Erst wenn feststeht, woraufhin verglichen wird, lassen sich Gemeinsamkeiten und Unterschiede ordnen.","o":["den Vergleichspunkt festlegen","beide Texte vollständig nacherzählen","die eigene Meinung äußern","die Stilmittel zählen"]},{"type":"mc","q":"Welcher Text gehört zum Thema „Rhetorik, Propaganda, Manipulation“?","s":"Im Tatenbericht stellt Augustus seine Herrschaft als Wiederherstellung der Republik dar. An ihm lässt sich zeigen, wie Auswahl und Wortwahl ein Bild formen.","o":["die <span class=\"la\">Res gestae<\/span> des Augustus","die Fabeln des Phaedrus","die <span class=\"la\">Vita Severini<\/span>","Catulls Liebesgedichte"]},{"type":"self","q":"Nenne zu einem Thema deiner Wahl zwei Texte oder Autoren und formuliere eine Leitfrage, unter der man sie vergleichen kann.","s":"Beispiel „Eros und Amor“: Catulls Lesbia-Gedichte und Ovids <span class=\"la\">Ars amatoria<\/span>. Leitfrage: Wird Liebe als überwältigendes Gefühl oder als erlernbare Kunst dargestellt? Catull zeigt Leidenschaft und Schmerz aus der Ich-Perspektive, Ovid gibt spielerisch-ironische Ratschläge wie ein Lehrer. Beispiel „Politik und Gesellschaft“: Ciceros <span class=\"la\">De re publica<\/span> und Thomas Morus’ <span class=\"la\">Utopia<\/span>. Leitfrage: Was macht einen Staat gerecht?"}],"gen":[],"html":"<h3>Lesen nach Themen<\/h3>\n<p>In der Lektürephase wird in Österreich nicht ein Autor nach dem anderen gelesen, sondern nach <b>Themen<\/b>: Zu einer Fragestellung kommen Texte verschiedener Autoren, Gattungen und Zeiten zusammen, von der Antike bis in die Neuzeit. Für dich heißt das: Du brauchst zu jedem Thema ein Grundwissen über typische Texte, Begriffe und Fragen. Welche Themen in welchem Jahr behandelt werden, legt deine Lehrkraft fest. Lehrpläne werden von Zeit zu Zeit überarbeitet, frage also nach, welche Fassung für deinen Jahrgang gilt.<\/p>\n<h3>Themen im sechsjährigen Latein<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Thema<\/th><th>Häufig gelesene Texte<\/th><th>Leitfragen<\/th><\/tr><tr><td>Gestalten und Persönlichkeiten aus Mythologie und Geschichte<\/td><td>Nepos, Livius, Caesar, Hygin, Heiligenlegenden<\/td><td>Was macht jemanden zum Vorbild oder zum abschreckenden Beispiel?<\/td><\/tr><tr><td>Der Mensch in seinem Alltag<\/td><td>Plinius-Briefe, Martial, Petron, Inschriften<\/td><td>Wie lebten, wohnten, lernten und feierten die Menschen?<\/td><\/tr><tr><td>Eros und Amor<\/td><td>Catull, Ovid, Tibull, Carmina Burana<\/td><td>Wie wird über Liebe gesprochen: Glück, Leid, Spiel?<\/td><\/tr><tr><td>Begegnung und Umgang mit dem Fremden<\/td><td>Caesar über Gallier und Germanen, Tacitus’ <span class=\"la\">Germania<\/span>, Berichte über die Neue Welt<\/td><td>Wie wird das Fremde dargestellt, und was verrät das über den Autor?<\/td><\/tr><tr><td>Herkunft, Idee und Bedeutung Europas<\/td><td>Europa-Mythos bei Ovid, Texte über Karl den Großen, Humanisten<\/td><td>Woher kommt die Idee „Europa“?<\/td><\/tr><tr><td>Austria Latina<\/td><td>Inschriften, <span class=\"la\">Vita Severini<\/span>, Enea Silvio Piccolomini<\/td><td>Welche Spuren hat das Lateinische in Österreich hinterlassen?<\/td><\/tr><tr><td>Der Mythos und seine Wirkung<\/td><td>Ovids <span class=\"la\">Metamorphosen<\/span>, Vergils <span class=\"la\">Aeneis<\/span><\/td><td>Was erzählt ein Mythos, und wie lebt er in Kunst und Literatur weiter?<\/td><\/tr><tr><td>Suche nach Sinn und Glück<\/td><td>Seneca, Cicero, Horaz, Augustinus<\/td><td>Was ist ein gutes Leben?<\/td><\/tr><tr><td>Witz, Spott, Ironie<\/td><td>Martial, Catull, Phaedrus, Horaz, Petron<\/td><td>Worüber lacht man, und wen trifft der Spott?<\/td><\/tr><tr><td>Politik und Gesellschaft<\/td><td>Cicero, Sallust, Livius, Thomas Morus<\/td><td>Wie soll ein Staat aussehen? Wer darf herrschen?<\/td><\/tr><tr><td>Rhetorik, Propaganda, Manipulation<\/td><td>Cicero-Reden, Caesar, <span class=\"la\">Res gestae<\/span> des Augustus<\/td><td>Mit welchen Mitteln werden Menschen überzeugt oder getäuscht?<\/td><\/tr><tr><td>Religio<\/td><td>Vulgata, Plinius’ Christenbrief, Augustinus, Märtyrerakten<\/td><td>Wie verstehen Römer und Christen das Verhältnis zum Göttlichen?<\/td><\/tr><tr><td>Fachsprachen und Fachtexte<\/td><td>Texte aus Recht, Medizin, Naturkunde, Architektur<\/td><td>Wie prägt Latein die Sprache der Wissenschaften?<\/td><\/tr><tr><td>Rezeption in Sprache und Literatur<\/td><td>lateinische Texte neben späteren Bearbeitungen<\/td><td>Wie gehen spätere Zeiten mit antiken Vorlagen um?<\/td><\/tr><\/table><\/div>\n<h3>Themen im vierjährigen Latein<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Thema<\/th><th>Entspricht im Wesentlichen<\/th><\/tr><tr><td>Gestalten und Persönlichkeiten aus Mythologie, Legende und Geschichte<\/td><td>dem ersten Thema oben<\/td><\/tr><tr><td>Der Mensch in seinem Alltag<\/td><td>demselben Thema<\/td><\/tr><tr><td>Politik und Rhetorik<\/td><td>„Politik und Gesellschaft“ und „Rhetorik, Propaganda, Manipulation“<\/td><\/tr><tr><td>Liebe, Lust und Leidenschaft<\/td><td>„Eros und Amor“<\/td><\/tr><tr><td>Formen der Lebensbewältigung<\/td><td>„Suche nach Sinn und Glück“<\/td><\/tr><tr><td>Heiteres und Hintergründiges<\/td><td>„Witz, Spott, Ironie“<\/td><\/tr><tr><td>Latein und Europa<\/td><td>Europa-Thema und Fortleben des Lateinischen<\/td><\/tr><tr><td>Fachsprachen und Fachtexte<\/td><td>demselben Thema<\/td><\/tr><tr><td>Mythos und Rezeption<\/td><td>„Der Mythos und seine Wirkung“ und „Rezeption“<\/td><\/tr><\/table><\/div>\n<h3>Welches Kapitel hilft wobei?<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Wenn dein Thema ist …<\/th><th>lies in diesem Kurs<\/th><\/tr><tr><td>Mythos, Gestalten<\/td><td>„Mythos und Religion“, „Die Dichter“, „Metrik“<\/td><\/tr><tr><td>Alltag<\/td><td>„Alltag in Rom“, „Zahlwörter“ (Inschriften, Daten)<\/td><\/tr><tr><td>Liebe<\/td><td>„Die Dichter“, „Metrik“, „Stilmittel für Fortgeschrittene“<\/td><\/tr><tr><td>Das Fremde<\/td><td>„Die Prosa-Autoren“ (Caesar, Tacitus), „Die indirekte Rede“<\/td><\/tr><tr><td>Sinn und Glück<\/td><td>„Philosophie und römische Werte“<\/td><\/tr><tr><td>Politik, Rhetorik<\/td><td>„Staat und Gesellschaft“, „Römische Geschichte“, „Gattungen“ (Aufbau der Rede)<\/td><\/tr><tr><td>Religio, Europa, Austria Latina<\/td><td>„Latein nach der Antike“<\/td><\/tr><tr><td>Fachsprachen, Rezeption<\/td><td>„Latein lebt weiter“, „Wortbildung“<\/td><\/tr><\/table><\/div>\n<h3>Texte vergleichen<\/h3>\n<p>Themenlektüre bedeutet Vergleichen. Die Aufgabe „Gegenüberstellen und Vergleichen“ gehört auch zum Interpretationsteil der Klausur. Gehe immer gleich vor:<\/p>\n<ul><li><b>Vergleichspunkt festlegen:<\/b> Woraufhin vergleiche ich (Thema, Haltung, Darstellungsweise)?<\/li><li><b>Gemeinsamkeiten<\/b> nennen und belegen.<\/li><li><b>Unterschiede<\/b> nennen und belegen.<\/li><li><b>Erklären:<\/b> Woher kommen die Unterschiede (Zeit, Gattung, Absicht des Autors)?<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Zwei Texte zum selben Thema vergleichen<\/h4><div class=\"task\">Caesar beschreibt die Germanen als kriegerisch, bedürfnislos und frei von festen Wohnsitzen. Tacitus lobt 150 Jahre später ihre Sittenstrenge und Treue. Vergleiche die beiden Darstellungen.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Vergleichspunkt: das Bild der Germanen und die Absicht dahinter.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gemeinsamkeit: Beide schildern die Germanen als einfach lebend, tapfer und anders als die Römer. Beide schreiben als Römer für Römer und kennen das Land nur teilweise aus eigener Anschauung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Unterschied: Caesar betont das Gefährliche und Unbezähmbare. Tacitus hebt das Vorbildliche hervor: Ehe, Treue, Unbestechlichkeit.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Erklärung für Caesar: Er rechtfertigt, warum er Gallien erobert, aber Germanien nicht. Ein so wildes Volk zu unterwerfen lohnt sich nicht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Erklärung für Tacitus: Er hält den Römern seiner Zeit einen Spiegel vor. Was er an den Germanen lobt, vermisst er in Rom.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Ergebnis: Beide Texte sagen mindestens so viel über ihre Verfasser wie über die Germanen. Das ist die typische Einsicht beim Thema „Umgang mit dem Fremden“.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"}]};

/* ---------- Antworten prüfen ---------- */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,;:!?"„“()]/g,' ').replace(/\s+/g,' ').trim();
function check(e,val){
  if(e.type==='num'){const x=Number(String(val).trim().replace(/\./g,'').replace(',','.'));if(String(val).trim()===''||isNaN(x))return null;return Math.abs(x-e.a)<0.001}
  const v=norm(val);if(!v)return null;return e.a.some(a=>norm(a)===v);
}
const ansText=e=>e.type==='num'?String(e.a):e.a[0];

/* ---------- Aufgaben ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function exHTML(e,label){
  let h='<div class="nr">'+label+'</div><div class="q">'+e.q+'</div>';
  if(e.type==='mc'){h+='<div class="opts">'+shuffle(e.o.map((o,i)=>[o,i])).map(([o,i])=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>'}
  else if(e.type==='self'){h+='<div class="row"><button class="ghost show">Musterlösung zeigen</button></div>'}
  else{h+='<div class="row"><input type="text" placeholder="deine Antwort" autocomplete="off" autocapitalize="off" spellcheck="false"> <button class="chk">Prüfen</button><button class="ghost show" style="display:none">Lösung zeigen</button></div>'}
  return h+'<div class="fb"></div>';
}
function wireEx(box,e,onOk){
  const fb=box.querySelector('.fb');let tries=0;
  const show=(cls,head,body)=>{fb.className='fb show '+cls;fb.innerHTML='<b class="h">'+head+'</b>'+body};
  const sol=()=>'<div>'+e.s+'</div>';
  const good=()=>{box.classList.remove('no');box.classList.add('ok');show('good','Richtig!',sol());onOk&&onOk()};
  if(e.type==='mc'){
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(box.dataset.fin)return;
      if(+b.dataset.i===0){b.classList.add('right');box.dataset.fin=1;if(tries===0)good();else show('good','Jetzt stimmt es.',sol())}
      else{b.classList.add('wrong');b.disabled=true;tries++;box.classList.add('no');
        if(tries===1&&e.o.length>2)show('hint','Noch nicht.',e.h?('Tipp: '+e.h):'Lies die Angabe noch einmal genau und versuche es erneut.');
        else{box.dataset.fin=1;box.querySelector('.opt[data-i="0"]').classList.add('right');show('bad','Die richtige Antwort ist markiert.',sol())}}
    });
  }else if(e.type==='self'){
    box.querySelector('.show').onclick=()=>{show('good','Musterlösung',sol()+'<div class="row"><button class="petrol yes">Sinngemäß hatte ich das auch</button><button class="ghost nope">Noch nicht ganz</button></div>');
      fb.querySelector('.yes').onclick=()=>{box.classList.add('ok');onOk&&onOk();fb.querySelector('.row').remove()};
      fb.querySelector('.nope').onclick=()=>{fb.querySelector('.row').innerHTML='Kein Problem. Vergleiche Wort für Wort mit der Musterlösung, markiere die Stelle, an der du abgewichen bist, und versuche den Satz morgen noch einmal.'}};
  }else{
    const inp=box.querySelector('input'),sb=box.querySelector('.show');
    const go=()=>{
      const r=check(e,inp.value);
      if(r===null){show('hint','Noch keine Eingabe.',e.type==='num'?'Gib eine Zahl ein.':'Tippe deine Antwort ins Feld. Groß- und Kleinschreibung und Längenzeichen spielen keine Rolle.');return}
      if(r){if(box.dataset.shown)show('good','Stimmt.',sol());else good();return}
      tries++;box.classList.add('no');sb.style.display='';
      show(tries===1&&e.h?'hint':'bad','Noch nicht richtig.',tries===1&&e.h?('Tipp: '+e.h):(e.type==='num'?'Überlege noch einmal – oder sieh dir die Lösung an.':'Prüfe Stamm und Endung noch einmal – oder sieh dir die Lösung an und bilde die Form danach selbst.'));
    };
    box.querySelector('.chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
    sb.onclick=()=>{box.dataset.shown=1;show('bad','Lösung: '+ansText(e),sol())};
  }
}

nom:{n:'Infinitive und Partizipien',f(){const v=pick(VERBS),c=v[2],t=ri(0,5);const ip={a:'ari',e:'eri',k:'i',i:'iri',m:'i'}[c],pa={a:'ans',e:'ens',k:'ens',i:'iens',m:'iens'}[c];
  const X=[['Infinitiv Präsens Passiv',v[1]+ip],['Infinitiv Perfekt Aktiv',v[3]+'isse'],['Infinitiv Perfekt Passiv (maskulin, Akkusativ Singular, wie im AcI)',v[4]+'um esse'],['Partizip Präsens Aktiv (Nominativ Singular)',v[1]+pa],['Partizip Perfekt Passiv (Nominativ Singular maskulin)',v[4]+'us'],['Partizip Futur Aktiv (Nominativ Singular maskulin)',v[4]+'urus']][t];
  return{type:'txt',q:'Bilde von '+L(v[0])+' ('+v[5]+'): <b>'+X[0]+'</b>.',a:[X[1]],s:'Richtig ist '+L(X[1])+'. Stammformen: '+L(v[0]+', '+v[3]+'i, '+v[4]+'um')+'.'}}},
rom:{n:'Römische Zahlen',f(){const n=pick([ri(1,40),ri(41,400),ri(401,2030)]);
  return ri(0,1)?{type:'num',q:'Welche Zahl ist <b>'+toRoman(n)+'</b>?',a:n,s:toRoman(n)+' = '+n+'. Steht ein kleineres Zeichen vor einem größeren, wird es abgezogen.'}:{type:'txt',q:'Schreibe <b>'+n+'</b> als römische Zahl.',a:[toRoman(n)],s:n+' = '+toRoman(n)+'.'}}},
vok:{n:'Vokabeln',f(){const g=pick(['n','n','v','v','a','p']),list=g==='v'&&Math.random()<0.4?STFV:VLIST[g],w=pick(list),rev=Math.random()<0.3,o=[];let guard=0;
  while(o.length<3&&guard++<99){const x=pick(list);if(x[0]!==w[0]&&x[1]!==w[1]&&!o.some(y=>y[0]===x[0]||y[1]===x[1]))o.push(x)}
  return rev?{type:'mc',q:'Welches lateinische Wort bedeutet „<b>'+w[1]+'</b>“?',o:[L(w[0])].concat(o.map(x=>L(x[0]))),s:L(w[0])+' = '+w[1]}:{type:'mc',q:'Was bedeutet '+L(w[0])+'?',o:[w[1]].concat(o.map(x=>x[1])),s:L(w[0])+' = '+w[1]}}}
};
function genBox(ids,host,label){
  const box=document.createElement('div');box.className='ex';host.appendChild(box);let cnt=0,ok=0;
  const next=()=>{const id=pick(ids),e=GEN[id].f();cnt++;
    box.className='ex';delete box.dataset.shown;delete box.dataset.fin;
    box.innerHTML=exHTML(e,(label||'Endlos-Training')+' · '+GEN[id].n+' · Nr. '+cnt)+'<div class="row"><button class="lilac nx">Neue Aufgabe</button><span class="score">'+ok+' richtig</span></div>';
    wireEx(box,e,()=>{ok++;box.querySelector('.score').textContent=ok+' richtig'});box.querySelector('.nx').onclick=next;const i=box.querySelector('input');if(i&&cnt>1)i.focus()};
  next();
}

/* ---------- Seiten ---------- */
function sidebar(){
  let h='<input id="q" placeholder="Thema suchen …"><a class="homelink" href="#">⌂ Startseite & Lernplan</a><a class="homelink" href="#mix">∞ Formen- und Vokabeltrainer</a>';
  Object.keys(AREAS).forEach(a=>{h+='<div class="c'+a+'"><h5>'+AREAS[a]+'</h5>'+CH.filter(c=>c.a===a).map(c=>'<a class="ch" data-id="'+c.id+'" href="#'+c.id+'"><span class="dot"></span><span>'+c.t+'</span></a>').join('')+'</div>'});
  $('#side').innerHTML=h;
  $('#q').oninput=e=>{const v=e.target.value.toLowerCase();$$('aside a.ch').forEach(a=>{const c=BYID[a.dataset.id];a.style.display=(c.t+' '+c.goals.join(' ')).toLowerCase().includes(v)?'':'none'})};
  $('#side').onclick=e=>{if(e.target.closest('a'))$('#side').classList.remove('open')};
}
function home(){
  let h='<div class="hero"><h1>Latein Oberstufe</h1><p>Der komplette Stoff von der ersten Deklination bis zur Lektüre in '+CH.length+' Kapiteln: verständlich erklärt, an Beispielen Schritt für Schritt gezeigt und mit Aufgaben zum Selbermachen. Für Schularbeiten und für die Matura, im vierjährigen wie im sechsjährigen Latein.</p><div class="chips"><span>'+CH.length+' Kapitel</span><span>'+CH.reduce((s,c)=>s+c.ex.length,0)+' Aufgaben mit Erklärung</span><span>Formentrainer ohne Ende</span><span>Vokabel- und Stammformentrainer</span><span>Fortschritt wird gespeichert</span></div></div>';
  h+='<h2>So arbeitest du mit dem Kurs</h2><div class="grid g3 step3"><div class="card"><h4>Verstehen</h4>Lies die Erklärung langsam und sprich die lateinischen Beispiele halblaut mit. Bei jedem Beispiel gilt: erst selbst überlegen, dann den nächsten Schritt aufdecken.</div><div class="card"><h4>Anwenden</h4>Löse die Aufgaben. Übersetzungen schreibst du auf Papier und vergleichst sie dann mit der Musterlösung. Zu jeder Aufgabe gibt es eine Begründung.</div><div class="card"><h4>Automatisieren</h4>Formen und Vokabeln müssen ohne Nachdenken kommen. Dafür ist der Trainer da: lieber jeden Tag zehn Minuten als einmal pro Woche eine Stunde.</div></div>';
  h+='<div class="note t" style="margin-top:20px"><b class="lab">Zwei Seiten, ein Ziel</b>Dieser Kurs baut die Sprache von Grund auf und liefert das Hintergrundwissen für die Lektüre. Aufbau und Bewertung der Klausur, die Übersetzungsmethode in acht Schritten, den Umgang mit dem Wörterbuch, die Aufgabenformate des Interpretationsteils und eine vollständige Prüfungssimulation findest du auf der Seite <a href="latein-zentralmatura.html">Latein Zentralmatura</a>. Am besten arbeitest du hier ein Kapitel durch und prüfst dich danach dort.</div>';
  h+='<div class="note"><b class="lab">Wo fange ich an?</b><b>Basis</b>-Kapitel sind der Stoff der ersten beiden Lernjahre. <b>Aufbau</b>-Kapitel behandeln die Konstruktionen, an denen sich gute und sehr gute Übersetzungen entscheiden. <b>Lektüre</b>-Kapitel begleiten die Arbeit an Originaltexten. Wer schon in der Lektürephase ist, beginnt mit dem Trainer: Zeigt er Lücken, liest du das passende Basis-Kapitel nach.</div>';
  Object.keys(AREAS).forEach(a=>{h+='<h3>'+AREAS[a]+'</h3><div class="grid g2">'+CH.filter(c=>c.a===a).map(c=>{const d=chDone(c);return '<a class="tile c'+c.a+(d===c.ex.length?' done':'')+'" href="#'+c.id+'"><b>'+c.t+'</b><small>'+c.tag+' · '+d+' von '+c.ex.length+' Aufgaben'+(d===c.ex.length?' ✓':'')+'</small></a>'}).join('')+'</div>'});
  h+='<footer>Alle Erklärungen, Beispielsätze und Aufgaben wurden eigens für diesen Kurs geschrieben. Zitate antiker Autoren sind als solche gekennzeichnet. Dein Fortschritt wird nur in deinem Browser gespeichert. <a href="#" id="reset">Fortschritt zurücksetzen</a></footer>';
  $('#main').innerHTML=h;
  $('#reset').onclick=e=>{e.preventDefault();if(e.target.dataset.sure){ST={ok:{}};save();route()}else{e.target.dataset.sure=1;e.target.textContent='Wirklich alles löschen? Noch einmal klicken.'}};
}
function mix(){
  const sets=[['Alles gemischt',Object.keys(GEN)],['Nomen und Adjektive',['dekl','kng','steig','pron']],['Verbformen',['konj','best','nom','stf']],['Vokabeln',['vok']],['Stammformen',['stf']],['Römische Zahlen',['rom']]];
  $('#main').innerHTML='<div class="chead cF"><span class="tag">Training</span><h2 style="margin-top:.5em">Formen- und Vokabeltrainer</h2><p style="margin:0">Hier entstehen laufend neue Aufgaben. Wähle, was du üben willst. Wenn du zehn Aufgaben hintereinander ohne Fehler schaffst, sitzt der Bereich.</p></div><div class="row" id="mixsel" style="margin-bottom:18px">'+sets.map((s,i)=>'<button class="'+(i?'ghost':'')+'" data-i="'+i+'">'+s[0]+'</button>').join('')+'</div><div class="cF" id="mixhost"></div>';
  const start=i=>{$('#mixhost').innerHTML='';genBox(sets[i][1],$('#mixhost'),sets[i][0]);$$('#mixsel button').forEach((b,j)=>b.className=j===i?'':'ghost')};
  $$('#mixsel button').forEach(b=>b.onclick=()=>start(+b.dataset.i));start(0);
}
function chapter(c){
  const prev=CH[c.i-1],next=CH[c.i+1];
  let h='<div class="c'+c.a+'"><div class="chead"><span class="tag">'+AREAS[c.a]+'</span><span class="tag">'+c.tag+'</span><h2 style="margin-top:.5em">'+c.t+'</h2><b>Das kannst du nach diesem Kapitel:</b><ul class="goals">'+c.goals.map(g=>'<li>'+g+'</li>').join('')+'</ul></div>';
  h+=c.html;
  h+='<h3 id="ueb">Übungen</h3><p>Lateinische Formen tippst du ohne Längenzeichen, Groß- und Kleinschreibung ist egal. Übersetzungen schreibst du zuerst auf Papier und vergleichst sie dann mit der Musterlösung.</p><div id="exhost"></div>';
  if(c.gen.length)h+='<h3>Endlos-Training</h3><p>Immer neue Formen nach demselben Muster. Übe so lange weiter, bis du nicht mehr überlegen musst.</p><div id="genhost"></div>';
  h+='<div class="navrow">'+(prev?'<a href="#'+prev.id+'"><button class="ghost">← '+prev.t+'</button></a>':'<span></span>')+(next?'<a href="#'+next.id+'"><button>'+next.t+' →</button></a>':'<a href="#"><button>Zur Startseite</button></a>')+'</div></div>';
  $('#main').innerHTML=h;
  $$('.walk').forEach(w=>{const st=[...w.querySelectorAll('.wstep')],b=w.querySelector('.nxt'),all=w.querySelector('.all');let i=0;
    const upd=()=>{b.disabled=i>=st.length;b.textContent=i>=st.length?'Fertig':(i===0?'Ersten Schritt zeigen':'Nächster Schritt');if(i>=st.length)all.style.display='none'};
    b.onclick=()=>{if(i<st.length){st[i++].classList.add('show');upd()}};all.onclick=()=>{st.forEach(s=>s.classList.add('show'));i=st.length;upd()};upd()});
  const host=$('#exhost');
  c.ex.forEach((e,i)=>{const box=document.createElement('div');box.className='ex'+(ST.ok[c.id+'_'+i]?' ok':'');box.innerHTML=exHTML(e,'Aufgabe '+(i+1)+(ST.ok[c.id+'_'+i]?' · schon gelöst ✓':''));host.appendChild(box);wireEx(box,e,()=>{ST.ok[c.id+'_'+i]=1;save();progress()})});
  if(c.gen.length)genBox(c.gen,$('#genhost'));
}
function route(){
  const id=location.hash.slice(1);
  if(id==='mix')mix();else if(BYID[id])chapter(BYID[id]);else home();
  $$('aside a.ch').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const on=$('aside a.ch.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  progress();window.scrollTo(0,0);
}
sidebar();window.addEventListener('hashchange',route);$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');route();

</script>
