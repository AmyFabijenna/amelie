gleich. Die Funktion ist eine Lösung.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Deutung: $G=20$ ist die Grenze, der sich $f$ nähert. $f(0)=20-15=5$ ist der Anfangswert. Ein Beispiel wäre ein Getränk mit 5 °C in einem Raum mit 20 °C.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Um zu prüfen, ob eine Funktion eine Differentialgleichung löst, musst du nichts „lösen“. Du leitest ab, setzt links und rechts ein und vergleichst.<\/div>"},{"id":"statistik","t":"Beschreibende Statistik","kl":"6","k":6,"a":"S","tag":"M","goals":["absolute und relative Häufigkeiten bestimmen","Mittelwert, Median, Modus und Quartile berechnen und vergleichen","Spannweite, Varianz und Standardabweichung berechnen und deuten","Boxplots lesen und irreführende Diagramme erkennen"],"ex":[{"type":"num","a":6.0,"q":"Bestimme den Median der Daten 3, 5, 5, 6, 8, 9, 13.","s":"Die Liste ist geordnet und hat 7 Werte. Der mittlere (vierte) Wert ist 6."},{"type":"num","a":7.0,"q":"Berechne das arithmetische Mittel der Daten 3, 5, 5, 6, 8, 9, 13.","s":"Summe: 49. $49:7=7$. Das Mittel liegt über dem Median, weil der Wert 13 nach oben zieht."},{"type":"num","a":2.0,"q":"Berechne die Standardabweichung der Daten 2, 4, 4, 4, 5, 5, 7, 9 (Division durch $n$).","h":"Der Mittelwert ist 5. Bilde die quadrierten Abweichungen.","s":"Abweichungsquadrate: $9+1+1+1+0+0+4+16=32$. Varianz: $32:8=4$. Standardabweichung: $\\sqrt4=2$."},{"type":"num","a":2.4,"q":"In einer Klasse gab es 4-mal die Note 1, 6-mal die Note 2, 8-mal die Note 3 und 2-mal die Note 4. Berechne den Notendurchschnitt.","s":"$\\dfrac{4\\cdot1+6\\cdot2+8\\cdot3+2\\cdot4}{20}=\\dfrac{48}{20}=2,4$."},{"type":"num","a":8.0,"q":"Ein Boxplot zeigt $q_1=12$ und $q_3=20$. Wie groß ist der Interquartilsabstand?","s":"$q_3-q_1=20-12=8$. In diesem Bereich liegt die mittlere Hälfte aller Werte."},{"type":"mc","q":"In einer Datenliste wird der größte Wert durch einen noch viel größeren ersetzt. Welche Kennzahl ändert sich dadurch sicher?","s":"Das Mittel verwendet alle Werte, jede Änderung eines Werts verschiebt es. Der Median hängt nur davon ab, welcher Wert in der Mitte steht, und der bleibt derselbe.","o":["das arithmetische Mittel","der Median","der Modus","das untere Quartil"]},{"type":"num","a":15.0,"q":"18 von 120 Befragten fahren mit dem Rad zur Schule. Wie groß ist die relative Häufigkeit in Prozent?","unit":"%","s":"$\\dfrac{18}{120}=0,15=15\\,\\%$."},{"type":"num","a":13.0,"q":"Fünf Werte haben das Mittel 12. Ein sechster Wert, nämlich 18, kommt dazu. Wie groß ist das neue Mittel?","h":"Berechne zuerst die Summe der fünf Werte.","s":"Summe der fünf Werte: $5\\cdot12=60$. Neue Summe: 78. Neues Mittel: $78:6=13$."}],"gen":[],"html":"<h3>Häufigkeiten<\/h3>\n<p>Die <b>absolute Häufigkeit<\/b> sagt, wie oft ein Wert vorkommt. Die <b>relative Häufigkeit<\/b> ist der Anteil an allen Werten: absolute Häufigkeit durch Gesamtzahl. Sie liegt zwischen 0 und 1 und wird oft in Prozent angegeben. Nur mit relativen Häufigkeiten lassen sich Gruppen verschiedener Größe fair vergleichen.<\/p>\n<h3>Wo liegt die Mitte? Lagemaße<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Kennzahl<\/th><th>Berechnung<\/th><th>Eigenschaft<\/th><\/tr><tr><td>arithmetisches Mittel $\\bar x$<\/td><td>Summe aller Werte durch ihre Anzahl<\/td><td>verwendet alle Werte, reagiert stark auf Ausreißer<\/td><\/tr><tr><td>Median<\/td><td>mittlerer Wert der <b>geordneten<\/b> Liste (bei gerader Anzahl: Mittel der beiden mittleren)<\/td><td>robust gegen Ausreißer<\/td><\/tr><tr><td>Modus<\/td><td>häufigster Wert<\/td><td>auch für Merkmale ohne Zahlen brauchbar<\/td><\/tr><tr><td>Quartile $q_1$, $q_3$<\/td><td>Mediane der unteren und der oberen Hälfte<\/td><td>teilen die Daten in Viertel<\/td><\/tr><\/table><\/div>\n<p>Sind die Werte mit Häufigkeiten gegeben, rechnest du das <b>gewichtete Mittel<\/b>: jeden Wert mal seine Häufigkeit, alles addieren, durch die Gesamtzahl dividieren.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Wenn in einer Aufgabe Mittelwert und Median stark voneinander abweichen, gibt es Ausreißer oder die Verteilung ist schief. Bei Einkommen liegt der Mittelwert deshalb fast immer über dem Median.<\/div>\n<h3>Wie stark streuen die Werte? Streumaße<\/h3>\n<ul><li><b>Spannweite:<\/b> größter minus kleinster Wert<\/li><li><b>Interquartilsabstand:<\/b> $q_3-q_1$, die Breite der mittleren Hälfte der Daten<\/li><li><b>Varianz<\/b> $s^2$: mittlere quadratische Abweichung vom Mittelwert<\/li><li><b>Standardabweichung<\/b> $s$: Wurzel aus der Varianz, in derselben Einheit wie die Daten<\/li><\/ul>\n<div class=\"formula\">$s^2=\\dfrac{(x_1-\\bar x)^2+(x_2-\\bar x)^2+\\dots+(x_n-\\bar x)^2}{n}\\qquad s=\\sqrt{s^2}$<\/div>\n<p>Manche Bücher und Rechner dividieren bei Stichproben durch $n-1$ statt durch $n$. Achte darauf, welche Variante in deiner Klasse verwendet wird.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Kennzahlen einer Datenliste<\/h4><div class=\"task\">Bei einem Test wurden diese Punkte erreicht: 12, 7, 9, 15, 7, 10, 18, 9, 7, 6. Bestimme Mittelwert, Median, Modus, Quartile und Spannweite.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst ordnen: 6, 7, 7, 7, 9, 9, 10, 12, 15, 18. Es sind 10 Werte.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Mittelwert: Summe $=100$, also $\\bar x=100:10=10$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Median: Bei 10 Werten ist es das Mittel aus dem 5. und 6. Wert: $\\frac{9+9}{2}=9$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Modus: 7 kommt dreimal vor, öfter als jeder andere Wert.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Quartile: Die untere Hälfte ist 6, 7, 7, 7, 9 mit dem mittleren Wert $q_1=7$. Die obere Hälfte ist 9, 10, 12, 15, 18 mit $q_3=12$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Spannweite: $18-6=12$. Interquartilsabstand: $12-7=5$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Der Boxplot<\/h3>\n<p>Ein Boxplot zeigt fünf Kennzahlen auf einen Blick: Minimum, $q_1$, Median, $q_3$, Maximum. Die Box reicht von $q_1$ bis $q_3$ und enthält die mittleren 50 % der Daten. In jedem der vier Abschnitte liegt etwa ein Viertel der Werte. Ein langer Abschnitt bedeutet also nicht „viele Werte“, sondern „weit verstreute Werte“.<\/p>\n<figure><svg viewBox=\"0 0 460 120\" width=\"460\"><line x1=\"40\" y1=\"90\" x2=\"430\" y2=\"90\" stroke=\"#1b1b1f\"/><g font-size=\"12\" text-anchor=\"middle\" fill=\"#56535d\"><text x=\"70\" y=\"108\">6<\/text><text x=\"100\" y=\"108\">7<\/text><text x=\"160\" y=\"108\">9<\/text><text x=\"250\" y=\"108\">12<\/text><text x=\"430\" y=\"108\">18<\/text><\/g><line x1=\"70\" y1=\"50\" x2=\"100\" y2=\"50\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><line x1=\"250\" y1=\"50\" x2=\"430\" y2=\"50\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><rect x=\"100\" y=\"28\" width=\"150\" height=\"44\" fill=\"#e7edf6\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><line x1=\"160\" y1=\"28\" x2=\"160\" y2=\"72\" stroke=\"#9c4f3d\" stroke-width=\"3\"/><line x1=\"70\" y1=\"38\" x2=\"70\" y2=\"62\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><line x1=\"430\" y1=\"38\" x2=\"430\" y2=\"62\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><\/svg><figcaption>Boxplot zu den Testpunkten aus dem Beispiel: Minimum 6, q₁ = 7, Median 9, q₃ = 12, Maximum 18<\/figcaption><\/figure>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>So wird mit Diagrammen getäuscht: abgeschnittene senkrechte Achse (kleine Unterschiede wirken riesig), ungleiche Abstände auf der Zeitachse, Flächen oder Bilder statt Balken (doppelte Höhe wirkt wie vierfache Größe). Sieh dir immer zuerst die Achsen an.<\/div>"},{"id":"wkt","t":"Grundlagen der Wahrscheinlichkeitsrechnung","kl":"6","k":6,"a":"S","tag":"M","goals":["Ergebnisse und Ereignisse eines Zufallsversuchs angeben","Laplace-Wahrscheinlichkeiten berechnen","mit Gegenereignis, Additionssatz und Pfadregeln rechnen","Ziehen mit und ohne Zurücklegen unterscheiden"],"ex":[{"type":"num","a":0.5,"q":"Ein fairer Würfel wird einmal geworfen. Wie groß ist die Wahrscheinlichkeit für eine Primzahl?","s":"Primzahlen sind 2, 3 und 5. $P=\\dfrac36=0,5$. Die 1 ist keine Primzahl."},{"type":"num","tol":0.001,"a":0.1388888888888889,"q":"Zwei faire Würfel werden geworfen. Wie groß ist die Wahrscheinlichkeit für die Augensumme 8 (als Bruch oder mit vier Dezimalstellen)?","h":"Zähle die günstigen Paare unter den 36 möglichen.","s":"Günstig sind $(2|6),(3|5),(4|4),(5|3),(6|2)$, also 5 Paare. $P=\\dfrac{5}{36}\\approx0,1389$."},{"type":"num","tol":0.001,"a":0.13333333333333333,"q":"In einer Urne sind 4 rote und 6 blaue Kugeln. Zwei Kugeln werden ohne Zurücklegen gezogen. Wie groß ist die Wahrscheinlichkeit, dass beide rot sind?","s":"$\\dfrac{4}{10}\\cdot\\dfrac39=\\dfrac{12}{90}=\\dfrac{2}{15}\\approx0,1333$."},{"type":"num","tol":0.001,"a":0.5333333333333333,"q":"Aus derselben Urne (4 rote, 6 blaue Kugeln) werden zwei Kugeln ohne Zurücklegen gezogen. Wie groß ist die Wahrscheinlichkeit für zwei verschiedene Farben?","h":"Es gibt zwei Pfade: rot-blau und blau-rot.","s":"$\\dfrac{4}{10}\\cdot\\dfrac69+\\dfrac{6}{10}\\cdot\\dfrac49=\\dfrac{48}{90}=\\dfrac{8}{15}\\approx0,5333$."},{"type":"num","a":0.7,"q":"Es gilt $P(A)=0,5$, $P(B)=0,4$ und $P(A\\cap B)=0,2$. Berechne $P(A\\cup B)$.","s":"$0,5+0,4-0,2=0,7$."},{"type":"num","a":0.875,"q":"Eine faire Münze wird dreimal geworfen. Wie groß ist die Wahrscheinlichkeit für mindestens einmal „Kopf“?","s":"Gegenereignis „dreimal Zahl“: $0,5^3=0,125$. Also $1-0,125=0,875$."},{"type":"num","a":13.0,"q":"Wie oft muss man einen fairen Würfel mindestens werfen, damit mit mindestens 90 % Wahrscheinlichkeit mindestens ein Sechser dabei ist?","s":"$1-\\left(\\frac56\\right)^n\\ge0,9$ ergibt $\\left(\\frac56\\right)^n\\le0,1$ und $n\\ge\\dfrac{\\ln0,1}{\\ln\\frac56}\\approx12,63$. Also mindestens 13 Würfe."},{"type":"mc","q":"Was besagt das Gesetz der großen Zahlen?","s":"Der Zufall hat kein Gedächtnis. Die Wahrscheinlichkeit für einen Sechser bleibt bei jedem Wurf $\\frac16$, egal was vorher war. Stabil wird nur der Anteil über sehr viele Versuche.","o":["Bei sehr vielen Wiederholungen liegt die relative Häufigkeit eines Ereignisses nahe bei seiner Wahrscheinlichkeit.","Nach vielen Würfen ohne Sechser wird ein Sechser wahrscheinlicher.","Bei genügend vielen Wiederholungen tritt jedes Ergebnis genau gleich oft auf.","Je länger die Versuchsreihe, desto mehr gleicht sich die absolute Anzahl der Ergebnisse aus."]}],"gen":[],"html":"<h3>Die Sprache<\/h3>\n<p>Ein <b>Zufallsversuch<\/b> hat mehrere mögliche Ausgänge, die <b>Ergebnisse<\/b>. Alle zusammen bilden den Grundraum $\\Omega$. Ein <b>Ereignis<\/b> ist eine Menge von Ergebnissen, zum Beispiel beim Würfeln „gerade Zahl“ $=\\{2;4;6\\}$. Jede Wahrscheinlichkeit liegt zwischen 0 (unmöglich) und 1 (sicher).<\/p>\n<p>Sind alle Ergebnisse gleich wahrscheinlich, spricht man von einem <b>Laplace-Versuch<\/b>:<\/p>\n<div class=\"formula\">$P(E)=\\dfrac{\\text{Anzahl der günstigen Ergebnisse}}{\\text{Anzahl der möglichen Ergebnisse}}$<\/div>\n<p>Ob die Annahme „gleich wahrscheinlich“ stimmt, muss man prüfen. Bei zwei Würfeln sind die 36 Paare gleich wahrscheinlich, die Augensummen 2 bis 12 sind es nicht.<\/p>\n<p>Was aber, wenn man die Wahrscheinlichkeit nicht berechnen kann? Dann schätzt man sie durch die relative Häufigkeit in einer langen Versuchsreihe. Das <b>Gesetz der großen Zahlen<\/b> sagt, dass sich die relative Häufigkeit mit wachsender Versuchszahl bei der Wahrscheinlichkeit einpendelt.<\/p>\n<h3>Drei Rechenregeln<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Regel<\/th><th>Formel<\/th><th>Wann<\/th><\/tr><tr><td>Gegenereignis<\/td><td>$P(\\text{nicht }E)=1-P(E)$<\/td><td>bei „mindestens“, „höchstens“, „kein“<\/td><\/tr><tr><td>Additionssatz<\/td><td>$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$<\/td><td>„$A$ oder $B$“<\/td><\/tr><tr><td>Pfadregeln<\/td><td>entlang eines Pfades multiplizieren, mehrere Pfade addieren<\/td><td>mehrstufige Versuche<\/td><\/tr><\/table><\/div>\n<p>Beim Additionssatz wird $P(A\\cap B)$ abgezogen, weil Ergebnisse, die in beiden Ereignissen liegen, sonst doppelt gezählt würden. Schließen $A$ und $B$ einander aus, fällt dieser Teil weg.<\/p>\n<h3>Mehrstufige Versuche<\/h3>\n<p>Die Grundlagen des Baumdiagramms und die Aufgaben mit „mindestens einmal“ sind auf der Seite zur Zentralmatura vorgerechnet. Hier geht es um den Unterschied, der in Prüfungen am meisten Punkte kostet:<\/p>\n<ul><li><b>Mit Zurücklegen:<\/b> Die Wahrscheinlichkeiten bleiben in jeder Stufe gleich.<\/li><li><b>Ohne Zurücklegen:<\/b> Nach jedem Zug ändert sich der Inhalt. Zähler und Nenner werden kleiner.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Ziehen ohne Zurücklegen<\/h4><div class=\"task\">In einer Lade liegen 5 schwarze und 3 graue Socken. Man zieht im Dunkeln zwei Socken. Mit welcher Wahrscheinlichkeit haben sie dieselbe Farbe?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Es wird nicht zurückgelegt. Beim zweiten Zug sind nur noch 7 Socken da.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Pfad „schwarz, schwarz“: $\\dfrac58\\cdot\\dfrac47=\\dfrac{20}{56}$. Nach einer schwarzen Socke sind noch 4 schwarze unter 7 übrig.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Pfad „grau, grau“: $\\dfrac38\\cdot\\dfrac27=\\dfrac{6}{56}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Beide Pfade gehören zum Ereignis, also addieren: $\\dfrac{20}{56}+\\dfrac{6}{56}=\\dfrac{26}{56}=\\dfrac{13}{28}\\approx0,464$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Kontrolle über das Gegenereignis „verschiedene Farben“: $2\\cdot\\dfrac58\\cdot\\dfrac37=\\dfrac{30}{56}$. Zusammen mit $\\frac{26}{56}$ ergibt das 1. Passt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wie oft muss man es versuchen?<\/h4><div class=\"task\">Ein Glücksrad zeigt mit der Wahrscheinlichkeit 0,15 einen Gewinn. Wie oft muss man mindestens drehen, damit man mit mindestens 90 % Wahrscheinlichkeit mindestens einmal gewinnt?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>„Mindestens einmal“ rechnet man über das Gegenereignis „kein einziger Gewinn“: $P=0,85^n$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Bedingung: $1-0,85^n\\ge0,9$, also $0,85^n\\le0,1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Logarithmieren: $n\\cdot\\ln(0,85)\\le\\ln(0,1)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Beim Dividieren durch $\\ln(0,85)$ dreht sich das Zeichen um, weil dieser Logarithmus negativ ist: $n\\ge\\dfrac{\\ln0,1}{\\ln0,85}\\approx14,17$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: Man muss mindestens 15-mal drehen. Hier wird immer aufgerundet.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"bedingt","t":"Bedingte Wahrscheinlichkeit, Unabhängigkeit und Satz von Bayes","kl":"6","k":6,"a":"S","tag":"M","goals":["bedingte Wahrscheinlichkeiten aus Vierfeldertafeln und Bäumen ablesen","P(A|B) und P(B|A) auseinanderhalten","Ereignisse auf Unabhängigkeit prüfen","mit dem Satz von Bayes von der Wirkung auf die Ursache schließen"],"ex":[{"type":"num","a":0.75,"q":"Von 100 Personen sind 60 Frauen und 40 Männer. 30 Frauen und 10 Männer treiben Sport. Eine zufällig gewählte Person treibt Sport. Mit welcher Wahrscheinlichkeit ist sie eine Frau?","s":"Bezugsgruppe sind die 40 Sporttreibenden. $P(\\text{Frau}\\mid\\text{Sport})=\\dfrac{30}{40}=0,75$."},{"type":"num","a":0.25,"q":"Dieselbe Gruppe: Mit welcher Wahrscheinlichkeit treibt ein zufällig gewählter Mann Sport?","s":"Bezugsgruppe sind die 40 Männer. $P(\\text{Sport}\\mid\\text{Mann})=\\dfrac{10}{40}=0,25$."},{"type":"num","tol":0.0011,"a":0.1624,"q":"2 % einer Gruppe haben eine Eigenschaft $K$. Ein Test zeigt bei Personen mit $K$ zu 95 % positiv an, bei Personen ohne $K$ fälschlich zu 10 %. Mit welcher Wahrscheinlichkeit hat eine positiv getestete Person $K$ (vier Dezimalstellen)?","h":"Rechne mit 10 000 gedachten Personen oder mit den beiden Pfaden zu „positiv“.","s":"$P(K\\cap+)=0,02\\cdot0,95=0,019$ und $P(\\text{nicht }K\\cap+)=0,98\\cdot0,10=0,098$. $P(K\\mid+)=\\dfrac{0,019}{0,019+0,098}=\\dfrac{0,019}{0,117}\\approx0,1624$."},{"type":"mc","q":"Es gilt $P(A)=0,3$, $P(B)=0,5$ und $P(A\\cap B)=0,15$. Sind $A$ und $B$ unabhängig?","s":"$0,3\\cdot0,5=0,15$, genau der Wert von $P(A\\cap B)$. Achtung: „unabhängig“ ist etwas ganz anderes als „schließen einander aus“. Bei $P(A\\cap B)=0$ wären die Ereignisse sogar stark abhängig.","o":["Ja, denn $P(A)\\cdot P(B)=P(A\\cap B)$.","Nein, denn $P(A)+P(B)\\neq1$.","Nein, denn $P(A\\cap B)$ ist nicht 0.","Das kann man ohne weitere Angaben nicht entscheiden."]},{"type":"num","a":0.1,"q":"Es gilt $P(A)=0,4$ und $P(B\\mid A)=0,25$. Berechne $P(A\\cap B)$.","s":"Pfadregel: $P(A\\cap B)=P(A)\\cdot P(B\\mid A)=0,4\\cdot0,25=0,1$."},{"type":"num","a":0.032,"q":"Maschine 1 stellt 60 % der Teile her, davon sind 2 % fehlerhaft. Maschine 2 stellt 40 % her, davon sind 5 % fehlerhaft. Mit welcher Wahrscheinlichkeit ist ein zufällig gewähltes Teil fehlerhaft?","s":"Totale Wahrscheinlichkeit, beide Pfade addieren: $0,6\\cdot0,02+0,4\\cdot0,05=0,012+0,02=0,032$."},{"type":"num","a":0.625,"q":"Dieselben Maschinen: Ein Teil ist fehlerhaft. Mit welcher Wahrscheinlichkeit stammt es von Maschine 2?","s":"$P(M_2\\mid F)=\\dfrac{0,4\\cdot0,05}{0,032}=\\dfrac{0,02}{0,032}=0,625$. Obwohl Maschine 2 weniger produziert, stammen die meisten fehlerhaften Teile von ihr."},{"type":"mc","q":"„Von den Rauchern einer Gruppe sind 30 % Sportler.“ Wie schreibt man das als Wahrscheinlichkeit?","s":"Die Bezugsgruppe sind die Raucher, sie steht hinter dem Strich. Der Schnitt wäre der Anteil an der gesamten Gruppe.","o":["$P(\\text{Sportler}\\mid\\text{Raucher})=0,3$","$P(\\text{Raucher}\\mid\\text{Sportler})=0,3$","$P(\\text{Sportler}\\cap\\text{Raucher})=0,3$","$P(\\text{Sportler})=0,3$"]}],"gen":["bed"],"html":"<h3>Was „unter der Bedingung“ bedeutet<\/h3>\n<p>$P(A\\mid B)$ ist die Wahrscheinlichkeit für $A$, wenn man schon weiß, dass $B$ eingetreten ist. Man betrachtet nicht mehr alle Fälle, sondern nur noch die, in denen $B$ zutrifft. Der Grundraum schrumpft.<\/p>\n<div class=\"formula\">$P(A\\mid B)=\\dfrac{P(A\\cap B)}{P(B)}$<\/div>\n<p>Im Baumdiagramm stehen bedingte Wahrscheinlichkeiten an den Ästen der zweiten Stufe. Wie man sie dort abliest, zeigt ein Beispiel auf der Seite zur Zentralmatura. Dieses Kapitel arbeitet mit dem zweiten Werkzeug, der Vierfeldertafel.<\/p>\n<h3>Die Vierfeldertafel<\/h3>\n<p>Sie ordnet zwei Merkmale mit je zwei Ausprägungen. Innen stehen die „und“-Häufigkeiten, am Rand die Summen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>Sport<\/th><th>kein Sport<\/th><th>Summe<\/th><\/tr><tr><td>Frauen<\/td><td>30<\/td><td>30<\/td><td>60<\/td><\/tr><tr><td>Männer<\/td><td>10<\/td><td>30<\/td><td>40<\/td><\/tr><tr><td>Summe<\/td><td>40<\/td><td>60<\/td><td>100<\/td><\/tr><\/table><\/div>\n<p>Daraus liest du alles ab. Entscheidend ist, durch welche Summe du dividierst:<\/p>\n<ul><li>Anteil der Sporttreibenden <b>unter den Frauen<\/b>: $P(\\text{Sport}\\mid\\text{Frau})=\\frac{30}{60}=0,5$<\/li><li>Anteil der Frauen <b>unter den Sporttreibenden<\/b>: $P(\\text{Frau}\\mid\\text{Sport})=\\frac{30}{40}=0,75$<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>$P(A\\mid B)$ und $P(B\\mid A)$ sind verschiedene Dinge. Fast alle Lottogewinner haben einen Schein gekauft, aber fast kein Scheinkäufer gewinnt. Lies bei jedem Text genau, welche Gruppe die Bezugsgruppe ist. Sie steht hinter dem senkrechten Strich.<\/div>\n<h3>Unabhängigkeit<\/h3>\n<p>Zwei Ereignisse sind unabhängig, wenn das Eintreten des einen die Wahrscheinlichkeit des anderen nicht ändert: $P(A\\mid B)=P(A)$. Gleichwertig und zum Prüfen bequemer:<\/p>\n<div class=\"formula\">$A,B\\text{ unabhängig}\\iff P(A\\cap B)=P(A)\\cdot P(B)$<\/div>\n<p>In der Tafel oben: $P(\\text{Frau}\\cap\\text{Sport})=0,3$, aber $P(\\text{Frau})\\cdot P(\\text{Sport})=0,6\\cdot0,4=0,24$. Die Merkmale sind abhängig.<\/p>\n<h3>Der Satz von Bayes<\/h3>\n<p>Oft kennt man $P(\\text{Wirkung}\\mid\\text{Ursache})$ und will $P(\\text{Ursache}\\mid\\text{Wirkung})$ wissen. Man dreht die Bedingung um. Am sichersten gelingt das mit gedachten absoluten Zahlen.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Positiver Test: Wie sicher ist das Ergebnis?<\/h4><div class=\"task\">1 % einer Bevölkerung hat eine bestimmte Eigenschaft $K$. Ein Test erkennt sie in 98 % der Fälle. Bei Personen ohne $K$ zeigt er in 4 % der Fälle fälschlich positiv an. Jemand wird positiv getestet. Mit welcher Wahrscheinlichkeit hat diese Person $K$ wirklich?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stelle dir 10 000 Personen vor. Davon haben 1 %, also 100, die Eigenschaft $K$. 9 900 haben sie nicht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Von den 100 mit $K$ werden 98 % positiv getestet: 98 Personen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Von den 9 900 ohne $K$ werden 4 % fälschlich positiv getestet: 396 Personen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Insgesamt gibt es $98+396=494$ positive Tests.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Gesucht ist der Anteil der wirklich Betroffenen unter den Positiven: $\\dfrac{98}{494}\\approx0,198$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Antwort: Nur knapp 20 %. Der Grund ist die Seltenheit von $K$: Die wenigen falschen Alarme unter sehr vielen Personen ohne $K$ überwiegen die richtigen Treffer.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<p>Als Formel ist das der Satz von Bayes zusammen mit dem Satz von der totalen Wahrscheinlichkeit:<\/p>\n<div class=\"formula\">$P(K\\mid+)=\\dfrac{P(K)\\cdot P(+\\mid K)}{P(K)\\cdot P(+\\mid K)+P(\\text{nicht }K)\\cdot P(+\\mid\\text{nicht }K)}$<\/div>\n<p>Im Nenner steht die Summe aller Pfade, die zu „positiv“ führen. Im Zähler steht der eine Pfad, der dich interessiert.<\/p>"},{"id":"kombi","t":"Kombinatorik","kl":"6–7","k":6,"a":"S","tag":"S","goals":["mit der Produktregel Möglichkeiten zählen","Fakultät und Binomialkoeffizient berechnen und deuten","entscheiden, ob die Reihenfolge eine Rolle spielt","Wahrscheinlichkeiten durch Abzählen bestimmen"],"ex":[{"type":"num","a":120.0,"q":"Auf wie viele Arten kann man 5 verschiedene Bücher nebeneinander ins Regal stellen?","s":"$5!=5\\cdot4\\cdot3\\cdot2\\cdot1=120$."},{"type":"num","a":10000.0,"q":"Wie viele vierstellige Zahlencodes (Ziffern 0 bis 9, Wiederholung erlaubt) gibt es?","s":"Für jede der vier Stellen 10 Möglichkeiten: $10^4=10\\,000$."},{"type":"num","a":5040.0,"q":"Wie viele vierstellige Zahlencodes gibt es, wenn jede Ziffer höchstens einmal vorkommen darf?","s":"$10\\cdot9\\cdot8\\cdot7=5040$."},{"type":"num","a":56.0,"q":"Berechne $\\dbinom83$.","s":"$\\dfrac{8\\cdot7\\cdot6}{3\\cdot2\\cdot1}=\\dfrac{336}{6}=56$."},{"type":"num","a":120.0,"q":"Aus 10 Personen wird ein Ausschuss von 3 gleichberechtigten Personen gewählt. Wie viele Möglichkeiten gibt es?","s":"Reihenfolge egal: $\\dbinom{10}{3}=\\dfrac{10\\cdot9\\cdot8}{6}=120$."},{"type":"num","a":720.0,"q":"Aus 10 Personen werden eine Vorsitzende, ein Stellvertreter und eine Kassierin gewählt. Wie viele Möglichkeiten gibt es?","s":"Die Ämter sind verschieden, die Reihenfolge zählt: $10\\cdot9\\cdot8=720$."},{"type":"num","a":8145060.0,"q":"Wie viele verschiedene Tipps gibt es bei „6 aus 45“?","s":"$\\dbinom{45}{6}=\\dfrac{45\\cdot44\\cdot43\\cdot42\\cdot41\\cdot40}{720}=8\\,145\\,060$. Die Wahrscheinlichkeit für sechs Richtige mit einem Tipp ist also etwa 1 zu 8 Millionen."},{"type":"num","a":6.0,"q":"Wie viele verschiedene Anordnungen der Buchstaben des Wortes ANNA gibt es?","s":"$\\dfrac{4!}{2!\\cdot2!}=\\dfrac{24}{4}=6$, weil A und N jeweils doppelt vorkommen."}],"gen":[],"html":"<h3>Die Produktregel<\/h3>\n<p>Trifft man mehrere Entscheidungen nacheinander, multipliziert man die Anzahlen der Möglichkeiten. Bei 3 Hosen, 5 Hemden und 2 Paar Schuhen gibt es $3\\cdot5\\cdot2=30$ Kombinationen. Alle weiteren Formeln sind Anwendungen dieser Regel.<\/p>\n<h3>Vier Grundfragen<\/h3>\n<p>Stelle dir bei jeder Zählaufgabe zwei Fragen: Spielt die <b>Reihenfolge<\/b> eine Rolle? Darf sich etwas <b>wiederholen<\/b>?<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Situation<\/th><th>Formel<\/th><th>Beispiel<\/th><\/tr><tr><td>alle $n$ Dinge anordnen<\/td><td>$n!=n\\cdot(n-1)\\cdots2\\cdot1$<\/td><td>4 Personen in einer Reihe: $4!=24$<\/td><\/tr><tr><td>$k$ aus $n$ mit Reihenfolge, mit Wiederholung<\/td><td>$n^k$<\/td><td>Zahlenschloss mit 3 Ringen und 10 Ziffern: $10^3$<\/td><\/tr><tr><td>$k$ aus $n$ mit Reihenfolge, ohne Wiederholung<\/td><td>$n\\cdot(n-1)\\cdots(n-k+1)$<\/td><td>Gold, Silber, Bronze unter 8 Läufern: $8\\cdot7\\cdot6$<\/td><\/tr><tr><td>$k$ aus $n$ ohne Reihenfolge, ohne Wiederholung<\/td><td>$\\dbinom{n}{k}=\\dfrac{n!}{k!\\cdot(n-k)!}$<\/td><td>3 von 8 Läufern erreichen das Finale: $\\binom83=56$<\/td><\/tr><\/table><\/div>\n<p>Der <b>Binomialkoeffizient<\/b> $\\binom nk$ („$n$ über $k$“) zählt, auf wie viele Arten man aus $n$ Dingen $k$ auswählen kann, wenn die Reihenfolge egal ist. Er entsteht aus der Zeile darüber, indem man durch $k!$ dividiert: So viele Reihenfolgen gehören zu jeder Auswahl.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Zwei Regeln sparen Rechenarbeit: $\\binom n0=\\binom nn=1$ und $\\binom nk=\\binom n{n-k}$. Sieben von zehn auszuwählen ist dasselbe, wie drei von zehn wegzulassen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Reihenfolge wichtig oder nicht?<\/h4><div class=\"task\">Aus 12 Mitgliedern eines Vereins sollen (a) ein Dreierteam für ein Turnier und (b) Obfrau, Kassier und Schriftführerin gewählt werden. Wie viele Möglichkeiten gibt es jeweils?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zu (a): Im Team haben alle dieselbe Rolle. Die Reihenfolge der Auswahl ist egal, also Binomialkoeffizient.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\dbinom{12}{3}=\\dfrac{12\\cdot11\\cdot10}{3\\cdot2\\cdot1}=\\dfrac{1320}{6}=220$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zu (b): Die drei Ämter sind verschieden. Es macht einen Unterschied, wer welches Amt bekommt. Die Reihenfolge zählt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$12\\cdot11\\cdot10=1320$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Vergleich: 1320 ist genau $3!=6$-mal so viel wie 220, weil sich jedes Dreierteam auf 6 Arten auf die Ämter verteilen lässt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wahrscheinlichkeit durch Abzählen<\/h4><div class=\"task\">In einer Klasse sind 10 Mädchen und 8 Burschen. Vier Personen werden ausgelost. Mit welcher Wahrscheinlichkeit sind es genau zwei Mädchen und zwei Burschen?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Mögliche Auswahlen: 4 aus 18, Reihenfolge egal. $\\dbinom{18}{4}=\\dfrac{18\\cdot17\\cdot16\\cdot15}{24}=3060$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Günstige Auswahlen: 2 aus 10 Mädchen <b>und<\/b> 2 aus 8 Burschen. Produktregel: $\\dbinom{10}{2}\\cdot\\dbinom82=45\\cdot28=1260$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>Wahrscheinlichkeit: $\\dfrac{1260}{3060}\\approx0,4118$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Kommen gleiche Dinge mehrfach vor, dividierst du durch die Fakultäten der Mehrfachen. Das Wort OTTO hat $\\dfrac{4!}{2!\\cdot2!}=6$ verschiedene Anordnungen der Buchstaben.<\/div>"},{"id":"zufallsvar","t":"Zufallsvariablen, Erwartungswert und Standardabweichung","kl":"7","k":7,"a":"S","tag":"M","goals":["eine Wahrscheinlichkeitsverteilung als Tabelle aufstellen","Erwartungswert, Varianz und Standardabweichung berechnen und deuten","mit der Verteilungsfunktion kumulierte Wahrscheinlichkeiten bestimmen","beurteilen, ob ein Spiel fair ist"],"ex":[{"type":"num","a":0.7,"q":"$X$ nimmt die Werte 0, 1 und 2 mit den Wahrscheinlichkeiten 0,5, 0,3 und 0,2 an. Berechne $E(X)$.","s":"$0\\cdot0,5+1\\cdot0,3+2\\cdot0,2=0,7$."},{"type":"num","a":0.61,"q":"Berechne für dieselbe Verteilung (Werte 0, 1, 2 mit 0,5, 0,3, 0,2) die Varianz.","h":"Berechne zuerst $E(X^2)$.","s":"$E(X^2)=0+1\\cdot0,3+4\\cdot0,2=1,1$. $V(X)=1,1-0,7^2=1,1-0,49=0,61$."},{"type":"num","a":0.78,"q":"Berechne für dieselbe Verteilung die Standardabweichung (zwei Dezimalstellen).","s":"$\\sigma=\\sqrt{0,61}\\approx0,78$."},{"type":"num","a":-0.5,"q":"Man zahlt 2 € Einsatz und würfelt einmal. Bei einem Sechser erhält man 9 € ausbezahlt, sonst nichts. Berechne den Erwartungswert des Gewinns.","unit":"€","s":"Gewinn: $+7$ € mit $\\frac16$ und $-2$ € mit $\\frac56$. $E=\\dfrac{7-10}{6}=-0,5$ €. Auf lange Sicht verliert man 50 Cent pro Spiel."},{"type":"num","a":1.5,"q":"Wie hoch müsste der Einsatz bei diesem Würfelspiel (9 € Auszahlung bei einem Sechser) sein, damit es fair ist?","unit":"€","s":"Die erwartete Auszahlung ist $9\\cdot\\dfrac16=1,5$ €. Fair ist das Spiel, wenn der Einsatz genauso groß ist."},{"type":"num","a":0.35,"q":"Eine Zufallsvariable nimmt vier Werte mit den Wahrscheinlichkeiten $0,1$, $0,25$, $p$ und $0,3$ an. Bestimme $p$.","s":"Die Summe muss 1 sein: $p=1-0,1-0,25-0,3=0,35$."},{"type":"num","a":0.8,"q":"$X$ nimmt die Werte 0, 1 und 2 mit den Wahrscheinlichkeiten 0,5, 0,3 und 0,2 an. Berechne $P(X\\le1)$.","s":"$P(X=0)+P(X=1)=0,5+0,3=0,8$."},{"type":"num","a":3.1,"q":"Ein Glücksrad zahlt mit Wahrscheinlichkeit 0,5 einen Euro, mit 0,3 zwei Euro und mit 0,2 zehn Euro. Wie groß ist die erwartete Auszahlung?","unit":"€","s":"$1\\cdot0,5+2\\cdot0,3+10\\cdot0,2=0,5+0,6+2=3,1$ €."}],"gen":["erw"],"html":"<h3>Vom Ergebnis zur Zahl<\/h3>\n<p>Eine <b>Zufallsvariable<\/b> $X$ ordnet jedem Ergebnis eines Zufallsversuchs eine Zahl zu: die Augensumme zweier Würfel, die Anzahl der Treffer, den Gewinn in Euro. Die <b>Wahrscheinlichkeitsverteilung<\/b> gibt an, mit welcher Wahrscheinlichkeit jeder Wert auftritt. Die Summe aller Wahrscheinlichkeiten ist immer 1. Damit lassen sich fehlende Werte in Tabellen ergänzen.<\/p>\n<h3>Erwartungswert<\/h3>\n<div class=\"formula\">$E(X)=\\mu=x_1\\cdot p_1+x_2\\cdot p_2+\\dots+x_n\\cdot p_n$<\/div>\n<p>Jeder Wert wird mit seiner Wahrscheinlichkeit gewichtet. Der Erwartungswert ist der Wert, den man <b>auf lange Sicht im Durchschnitt<\/b> erhält. Er muss selbst gar kein möglicher Wert sein: Beim Würfeln ist $E(X)=3,5$.<\/p>\n<p>Ein Spiel heißt <b>fair<\/b>, wenn der Erwartungswert des Gewinns (Auszahlung minus Einsatz) gleich 0 ist.<\/p>\n<h3>Varianz und Standardabweichung<\/h3>\n<div class=\"formula\">$V(X)=\\sigma^2=(x_1-\\mu)^2\\cdot p_1+\\dots+(x_n-\\mu)^2\\cdot p_n\\qquad\\sigma=\\sqrt{V(X)}$<\/div>\n<p>Die Standardabweichung $\\sigma$ misst, wie stark die Werte um den Erwartungswert streuen. Oft rechnet es sich leichter mit der gleichwertigen Formel $V(X)=E(X^2)-\\mu^2$.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ist das Spiel fair?<\/h4><div class=\"task\">Bei einem Spiel zahlt man 3 € Einsatz und wirft zwei Münzen. Bei zweimal Kopf erhält man 8 €, bei genau einmal Kopf 2 €, sonst nichts. Ist das Spiel fair? Wie groß ist die Streuung des Gewinns?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zufallsvariable: $X$ = Gewinn in Euro, also Auszahlung minus Einsatz. Mögliche Werte: $8-3=5$, $2-3=-1$, $0-3=-3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Wahrscheinlichkeiten: zweimal Kopf $\\frac14$, genau einmal Kopf $\\frac12$, keinmal Kopf $\\frac14$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Erwartungswert: $E(X)=5\\cdot0,25+(-1)\\cdot0,5+(-3)\\cdot0,25=1,25-0,5-0,75=0$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Das Spiel ist fair. Auf lange Sicht gewinnt und verliert man im Durchschnitt nichts.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Varianz: $V(X)=5^2\\cdot0,25+(-1)^2\\cdot0,5+(-3)^2\\cdot0,25-0^2=6,25+0,5+2,25=9$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Standardabweichung: $\\sigma=3$ €. Der Gewinn eines einzelnen Spiels weicht typischerweise um etwa 3 € vom Erwartungswert ab.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Die Verteilungsfunktion<\/h3>\n<p>$F(x)=P(X\\le x)$ sammelt die Wahrscheinlichkeiten aller Werte bis einschließlich $x$. Damit berechnest du Bereiche:<\/p>\n<ul><li>$P(X\\le k)$: direkt ablesen oder aufsummieren<\/li><li>$P(X>k)=1-P(X\\le k)$<\/li><li>$P(a<X\\le b)=F(b)-F(a)$<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Achte bei ganzzahligen Zufallsvariablen genau auf die Grenzen. „Mindestens 3“ heißt $X\\ge3$, das Gegenereignis ist $X\\le2$ und nicht $X\\le3$. „Mehr als 3“ heißt $X\\ge4$.<\/div>"},{"id":"binomial","t":"Die Binomialverteilung","kl":"7","k":7,"a":"S","tag":"M","goals":["erkennen, wann eine Binomialverteilung vorliegt","Wahrscheinlichkeiten für genau, höchstens und mindestens k Treffer berechnen","Erwartungswert und Standardabweichung angeben","die nötige Anzahl von Versuchen bestimmen"],"ex":[{"type":"num","tol":0.0006,"a":0.2668,"q":"$X$ ist binomialverteilt mit $n=10$ und $p=0,3$. Berechne $P(X=3)$ (vier Dezimalstellen).","s":"$\\dbinom{10}{3}\\cdot0,3^3\\cdot0,7^7=120\\cdot0,027\\cdot0,08235\\approx0,2668$."},{"type":"num","tol":0.0006,"a":0.3828,"q":"$X$ ist binomialverteilt mit $n=10$ und $p=0,3$. Berechne $P(X\\le2)$ (vier Dezimalstellen).","s":"$P(X=0)\\approx0,0282$, $P(X=1)\\approx0,1211$, $P(X=2)\\approx0,2335$. Summe: $\\approx0,3828$."},{"type":"num","tol":0.0006,"a":0.8784,"q":"$X$ ist binomialverteilt mit $n=20$ und $p=0,1$. Berechne $P(X\\ge1)$ (vier Dezimalstellen).","s":"Gegenereignis: $1-P(X=0)=1-0,9^{20}\\approx1-0,1216=0,8784$."},{"type":"num","a":20.0,"q":"$X$ ist binomialverteilt mit $n=50$ und $p=0,4$. Berechne den Erwartungswert.","s":"$\\mu=n\\cdot p=50\\cdot0,4=20$."},{"type":"num","a":3.46,"q":"$X$ ist binomialverteilt mit $n=50$ und $p=0,4$. Berechne die Standardabweichung (zwei Dezimalstellen).","s":"$\\sigma=\\sqrt{50\\cdot0,4\\cdot0,6}=\\sqrt{12}\\approx3,46$."},{"type":"mc","q":"Welche Bedingung gehört <b>nicht<\/b> zu den Voraussetzungen der Binomialverteilung?","s":"$p$ darf jeder Wert zwischen 0 und 1 sein, er muss nur bei allen Versuchen derselbe sein.","o":["Die Trefferwahrscheinlichkeit muss 0,5 betragen.","Jeder Versuch hat genau zwei Ausgänge.","Die Versuche beeinflussen einander nicht.","Die Trefferwahrscheinlichkeit ist bei jedem Versuch gleich."]},{"type":"num","tol":0.0006,"a":0.3115,"q":"Ein Test hat 8 Fragen mit je 4 Antworten, von denen eine richtig ist. Jemand rät bei allen Fragen. Wie groß ist die Wahrscheinlichkeit für genau 2 richtige Antworten (vier Dezimalstellen)?","s":"$n=8$, $p=0,25$. $\\dbinom82\\cdot0,25^2\\cdot0,75^6=28\\cdot0,0625\\cdot0,17798\\approx0,3115$."},{"type":"num","a":14.0,"q":"Die Trefferwahrscheinlichkeit beträgt 0,2. Wie viele Versuche braucht man mindestens, damit mit mindestens 95 % Wahrscheinlichkeit mindestens ein Treffer dabei ist?","s":"$1-0,8^n\\ge0,95$ ergibt $0,8^n\\le0,05$ und $n\\ge\\dfrac{\\ln0,05}{\\ln0,8}\\approx13,43$. Also mindestens 14 Versuche."},{"type":"mc","q":"Aus einer Schachtel mit 6 roten und 4 blauen Kugeln werden 3 Kugeln ohne Zurücklegen gezogen. $X$ zählt die roten Kugeln. Ist $X$ binomialverteilt?","s":"Ohne Zurücklegen sind die Züge nicht unabhängig, und $p$ bleibt nicht gleich. Zwei Ausgänge allein reichen nicht.","o":["Nein, weil sich die Wahrscheinlichkeit für Rot nach jedem Zug ändert.","Ja, weil es nur zwei Farben gibt.","Ja, weil dreimal gezogen wird.","Nein, weil es mehr rote als blaue Kugeln gibt."]}],"gen":["binom"],"html":"<h3>Wann ist etwas binomialverteilt?<\/h3>\n<p>Ein Versuch mit nur zwei Ausgängen (Treffer oder kein Treffer) wird $n$-mal wiederholt. $X$ zählt die Treffer. $X$ ist binomialverteilt, wenn drei Bedingungen erfüllt sind:<\/p>\n<ul><li>Es gibt bei jedem Versuch nur <b>zwei<\/b> Ausgänge.<\/li><li>Die Versuche sind voneinander <b>unabhängig<\/b>.<\/li><li>Die Trefferwahrscheinlichkeit $p$ ist bei jedem Versuch <b>gleich<\/b>.<\/li><\/ul>\n<p>Das passt zum Ziehen <b>mit<\/b> Zurücklegen. Beim Ziehen ohne Zurücklegen ändert sich $p$ von Zug zu Zug, außer die Gesamtmenge ist so groß, dass das keine Rolle spielt (etwa bei Umfragen in der Bevölkerung).<\/p>\n<h3>Die Formel und was dahintersteckt<\/h3>\n<div class=\"formula\">$P(X=k)=\\dbinom{n}{k}\\cdot p^k\\cdot(1-p)^{n-k}$<\/div>\n<p>Jeder Teil hat eine Bedeutung. $p^k$: $k$ Treffer. $(1-p)^{n-k}$: die übrigen Versuche sind keine Treffer. $\\binom nk$: so viele verschiedene Reihenfolgen gibt es für $k$ Treffer unter $n$ Versuchen. Es ist also die Pfadregel für einen Baum mit $n$ Stufen, bei dem man gleichartige Pfade zusammenzählt.<\/p>\n<div class=\"formula\">$\\mu=n\\cdot p\\qquad\\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}$<\/div>\n<p>Eine kompakte Übersicht und ein Labor zum Ausprobieren findest du auf der Seite zur Zentralmatura. Hier übst du die Rechnungen im Detail.<\/p>\n<h3>Genau, höchstens, mindestens<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Formulierung<\/th><th>Schreibweise<\/th><th>Berechnung<\/th><\/tr><tr><td>genau 3<\/td><td>$P(X=3)$<\/td><td>Formel<\/td><\/tr><tr><td>höchstens 3<\/td><td>$P(X\\le3)$<\/td><td>$P(X=0)+P(X=1)+P(X=2)+P(X=3)$<\/td><\/tr><tr><td>weniger als 3<\/td><td>$P(X\\le2)$<\/td><td>Summe bis 2<\/td><\/tr><tr><td>mindestens 3<\/td><td>$P(X\\ge3)$<\/td><td>$1-P(X\\le2)$<\/td><\/tr><tr><td>mehr als 3<\/td><td>$P(X\\ge4)$<\/td><td>$1-P(X\\le3)$<\/td><\/tr><tr><td>mindestens 1<\/td><td>$P(X\\ge1)$<\/td><td>$1-P(X=0)=1-(1-p)^n$<\/td><\/tr><\/table><\/div>\n<p>Mit Technologie verwendest du für „genau“ die Einzelwahrscheinlichkeit (oft „binomPdf“) und für „höchstens“ die kumulierte Wahrscheinlichkeit („binomCdf“).<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Genau und höchstens<\/h4><div class=\"task\">Eine Maschine erzeugt mit der Wahrscheinlichkeit 5 % ein fehlerhaftes Teil. Es werden 20 Teile entnommen. Wie groß ist die Wahrscheinlichkeit für (a) genau 2 und (b) höchstens 1 fehlerhaftes Teil?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Modell: $X$ = Anzahl der fehlerhaften Teile, binomialverteilt mit $n=20$ und $p=0,05$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zu (a): $P(X=2)=\\dbinom{20}{2}\\cdot0,05^2\\cdot0,95^{18}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$\\dbinom{20}{2}=190$, $0,05^2=0,0025$, $0,95^{18}\\approx0,3972$. Produkt: $\\approx0,1887$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zu (b): $P(X\\le1)=P(X=0)+P(X=1)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>$P(X=0)=0,95^{20}\\approx0,3585$ und $P(X=1)=20\\cdot0,05\\cdot0,95^{19}\\approx0,3774$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>$P(X\\le1)\\approx0,7358$. Erwartet wird im Mittel $\\mu=20\\cdot0,05=1$ fehlerhaftes Teil.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Vor dem Rechnen immer das Modell hinschreiben: Was zählt $X$, wie groß sind $n$ und $p$? Die meisten Fehler entstehen, weil $p$ zur falschen Sache gehört, zum Beispiel zur Wahrscheinlichkeit für „fehlerfrei“, obwohl $X$ die fehlerhaften Teile zählt.<\/div>"},{"id":"normal","t":"Die Normalverteilung","kl":"8","k":8,"a":"S","tag":"M","goals":["die Bedeutung von μ und σ an der Glockenkurve erklären","Werte standardisieren und Wahrscheinlichkeiten für Bereiche berechnen","zu einer Wahrscheinlichkeit den passenden Wert bestimmen","die Sigma-Regeln anwenden"],"ex":[{"type":"num","tol":0.0011,"a":0.8944,"q":"$X$ ist normalverteilt mit $\\mu=170$ und $\\sigma=8$. Berechne $P(X<180)$ (vier Dezimalstellen).","s":"$z=\\dfrac{180-170}{8}=1,25$. $\\Phi(1,25)\\approx0,8944$."},{"type":"num","tol":0.0011,"a":0.7887,"q":"$X$ ist normalverteilt mit $\\mu=170$ und $\\sigma=8$. Berechne $P(160<X<180)$ (vier Dezimalstellen).","h":"Der Bereich liegt symmetrisch um $\\mu$.","s":"$z=\\pm1,25$. $2\\cdot\\Phi(1,25)-1\\approx2\\cdot0,8944-1=0,7887$."},{"type":"num","tol":0.0011,"a":0.0228,"q":"$X$ ist normalverteilt mit $\\mu=170$ und $\\sigma=8$. Berechne $P(X>186)$ (vier Dezimalstellen).","s":"$z=\\dfrac{186-170}{8}=2$. $1-\\Phi(2)\\approx1-0,9772=0,0228$."},{"type":"num","tol":0.06,"a":180.25,"q":"$X$ ist normalverteilt mit $\\mu=170$ und $\\sigma=8$. Unter welchem Wert liegen 90 % aller Werte (zwei Dezimalstellen)?","s":"Zur Fläche 0,90 gehört $z\\approx1,282$. $x=170+1,282\\cdot8\\approx180,25$."},{"type":"num","a":-1.5,"q":"$X$ ist normalverteilt mit $\\mu=170$ und $\\sigma=8$. Welcher $z$-Wert gehört zu $x=158$?","s":"$z=\\dfrac{158-170}{8}=-1,5$. Der Wert liegt eineinhalb Standardabweichungen unter dem Erwartungswert."},{"type":"mc","q":"Welcher Anteil der Werte einer normalverteilten Größe liegt ungefähr im Bereich $\\mu\\pm2\\sigma$?","s":"Die Sigma-Regeln: 68 % innerhalb einer, 95 % innerhalb von zwei und 99,7 % innerhalb von drei Standardabweichungen.","o":["etwa 95 %","etwa 68 %","etwa 50 %","etwa 99,7 %"]},{"type":"num","tol":0.03,"a":507.84,"q":"Die Füllmenge von Flaschen ist normalverteilt mit $\\mu=500$ ml und $\\sigma=4$ ml. Bestimme die obere Grenze des um $\\mu$ symmetrischen Bereichs, in dem 95 % aller Füllmengen liegen (zwei Dezimalstellen).","unit":"ml","h":"Wenn in der Mitte 95 % liegen, bleiben rechts 2,5 %. Links von der oberen Grenze liegen also 97,5 %.","s":"Zur Fläche 0,975 gehört $z=1,960$. Obere Grenze: $500+1,96\\cdot4=507,84$ ml. Der Bereich reicht von 492,16 ml bis 507,84 ml."},{"type":"mc","q":"Wie verändert sich die Glockenkurve, wenn $\\sigma$ größer wird und $\\mu$ gleich bleibt?","s":"Die Werte streuen stärker, die Kurve wird breiter. Weil die Gesamtfläche 1 bleiben muss, wird sie zugleich flacher.","o":["Sie wird flacher und breiter.","Sie wird höher und schmäler.","Sie verschiebt sich nach rechts.","Die Fläche unter der Kurve wird größer."]}],"gen":["norm"],"html":"<h3>Eine stetige Verteilung<\/h3>\n<p>Körpergrößen, Füllmengen oder Messfehler können jeden Wert in einem Bereich annehmen. Solche <b>stetigen<\/b> Zufallsvariablen beschreibt man nicht mit einer Tabelle, sondern mit einer <b>Dichtefunktion<\/b>. Wahrscheinlichkeiten sind <b>Flächen<\/b> unter ihrem Graphen, die gesamte Fläche ist 1.<\/p>\n<p>Die wichtigste stetige Verteilung ist die Normalverteilung mit ihrer Glockenkurve. Zwei Zahlen legen sie fest:<\/p>\n<ul><li>$\\mu$ (Erwartungswert): die Stelle des Gipfels und der Symmetrieachse<\/li><li>$\\sigma$ (Standardabweichung): die Breite. Großes $\\sigma$ bedeutet eine flache, breite Kurve, kleines $\\sigma$ eine hohe, schmale. Die Wendestellen liegen bei $\\mu\\pm\\sigma$.<\/li><\/ul>\n[[plot:f=exp(-x*x/2)/2.5066;;exp(-(x-1)*(x-1)/8)/5.0133 | x=-5,7 | y=-0.05,0.45 | cap=blau: μ = 0 und σ = 1 · rot: μ = 1 und σ = 2 (flacher und breiter)]]\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Bei einer stetigen Verteilung hat ein einzelner Wert die Wahrscheinlichkeit 0. Deshalb ist es egal, ob du $<$ oder $\\le$ schreibst: $P(X<180)=P(X\\le180)$. Bei der Binomialverteilung ist das anders.<\/div>\n<h3>Standardisieren<\/h3>\n<p>Jede Normalverteilung lässt sich auf die <b>Standardnormalverteilung<\/b> ($\\mu=0$, $\\sigma=1$) zurückführen. Der $z$-Wert gibt an, wie viele Standardabweichungen ein Wert vom Erwartungswert entfernt ist:<\/p>\n<div class=\"formula\">$z=\\dfrac{x-\\mu}{\\sigma}\\qquad P(X\\le x)=\\Phi(z)$<\/div>\n<p>$\\Phi$ ist die Verteilungsfunktion der Standardnormalverteilung. Ihre Werte liefern Rechner oder Tabelle. Wegen der Symmetrie gilt $\\Phi(-z)=1-\\Phi(z)$.<\/p>\n<div class=\"phi\"><\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Gesucht<\/th><th>Rechnung<\/th><\/tr><tr><td>$P(X\\le b)$<\/td><td>$\\Phi(z_b)$<\/td><\/tr><tr><td>$P(X>b)$<\/td><td>$1-\\Phi(z_b)$<\/td><\/tr><tr><td>$P(a<X\\le b)$<\/td><td>$\\Phi(z_b)-\\Phi(z_a)$<\/td><\/tr><tr><td>symmetrisch um $\\mu$ mit Abstand $z\\cdot\\sigma$<\/td><td>$2\\cdot\\Phi(z)-1$<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wahrscheinlichkeit für einen Bereich<\/h4><div class=\"task\">Die Masse von Äpfeln einer Sorte ist normalverteilt mit $\\mu=180$ g und $\\sigma=20$ g. Wie groß ist der Anteil der Äpfel zwischen 150 g und 200 g?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Standardisiere beide Grenzen: $z_1=\\dfrac{150-180}{20}=-1,5$ und $z_2=\\dfrac{200-180}{20}=1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\Phi(1)\\approx0,8413$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$\\Phi(-1,5)=1-\\Phi(1,5)\\approx1-0,9332=0,0668$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Differenz: $P(150<X<200)\\approx0,8413-0,0668=0,7745$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: Etwa 77,5 % der Äpfel liegen in diesem Bereich.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Die Umkehrfrage: Quantile<\/h3>\n<p>Manchmal ist die Wahrscheinlichkeit gegeben und der Wert gesucht. Dann suchst du zuerst den passenden $z$-Wert und rechnest zurück: $x=\\mu+z\\cdot\\sigma$.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Fläche links von $z$<\/th><th>0,90<\/th><th>0,95<\/th><th>0,975<\/th><th>0,99<\/th><th>0,995<\/th><\/tr><tr><td>$z$<\/td><td>1,282<\/td><td>1,645<\/td><td>1,960<\/td><td>2,326<\/td><td>2,576<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wert zu einer Wahrscheinlichkeit<\/h4><div class=\"task\">Dieselben Äpfel ($\\mu=180$ g, $\\sigma=20$ g): Die schwersten 5 % werden als Premiumware verkauft. Ab welcher Masse gehört ein Apfel dazu?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die schwersten 5 % liegen rechts. Links von der gesuchten Grenze liegen 95 %.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Aus der Tabelle: Zur Fläche 0,95 gehört $z=1,645$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zurückrechnen: $x=180+1,645\\cdot20=212,9$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Antwort: Ab etwa 213 g.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Die Sigma-Regeln<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Bereich<\/th><th>Anteil der Werte<\/th><\/tr><tr><td>$\\mu\\pm\\sigma$<\/td><td>etwa 68,3 %<\/td><\/tr><tr><td>$\\mu\\pm2\\sigma$<\/td><td>etwa 95,4 %<\/td><\/tr><tr><td>$\\mu\\pm3\\sigma$<\/td><td>etwa 99,7 %<\/td><\/tr><\/table><\/div>\n<p>Damit schätzt du Ergebnisse im Kopf ab und kontrollierst deine Rechnung. Eine Binomialverteilung mit $\\sigma>3$ lässt sich übrigens gut durch eine Normalverteilung mit $\\mu=np$ und $\\sigma=\\sqrt{np(1-p)}$ annähern.<\/p>"},{"id":"konfidenz","t":"Schätzen und Testen: Konfidenzintervalle","kl":"8","k":8,"a":"S","tag":"M","goals":["von einer Stichprobe auf die Grundgesamtheit schließen","ein Konfidenzintervall für einen Anteil berechnen und richtig deuten","den Einfluss von Stichprobengröße und Sicherheit erklären","die nötige Stichprobengröße bestimmen","die Idee eines Hypothesentests beschreiben"],"ex":[{"type":"num","a":0.18,"q":"In einer Stichprobe von 300 Personen besitzen 54 ein bestimmtes Gerät. Bestimme die relative Häufigkeit $h$.","s":"$h=\\dfrac{54}{300}=0,18$."},{"type":"num","tol":0.002,"a":0.303,"q":"In einer Stichprobe von 400 Personen haben 35 % eine bestimmte Meinung. Berechne die untere Grenze des 95-%-Konfidenzintervalls (drei Dezimalstellen).","s":"Halbe Breite: $1,96\\cdot\\sqrt{\\dfrac{0,35\\cdot0,65}{400}}\\approx1,96\\cdot0,02385\\approx0,0467$. Untere Grenze: $0,35-0,0467\\approx0,303$. Das Intervall ist etwa $[0,303;\\,0,397]$."},{"type":"num","tol":0.002,"a":0.216,"q":"Eine Stichprobe hat $n=300$ und $h=0,18$. Berechne die obere Grenze des 90-%-Konfidenzintervalls (drei Dezimalstellen).","h":"Für 90 % ist $z=1,645$.","s":"Halbe Breite: $1,645\\cdot\\sqrt{\\dfrac{0,18\\cdot0,82}{300}}\\approx1,645\\cdot0,02218\\approx0,0365$. Obere Grenze: $0,18+0,0365\\approx0,216$."},{"type":"mc","q":"Die Stichprobengröße wird vervierfacht, $h$ und die Sicherheit bleiben gleich. Wie ändert sich die Breite des Konfidenzintervalls?","s":"$n$ steht unter einer Wurzel im Nenner: $\\sqrt{4n}=2\\sqrt n$. Die Breite wird durch 2 geteilt.","o":["Sie halbiert sich.","Sie sinkt auf ein Viertel.","Sie verdoppelt sich.","Sie bleibt gleich."]},{"type":"mc","q":"Die Sicherheit wird von 95 % auf 99 % erhöht, die Stichprobe bleibt dieselbe. Was geschieht mit dem Intervall?","s":"$z$ steigt von 1,960 auf 2,576. Um sicherer zu sein, dass der wahre Anteil erfasst wird, muss man einen größeren Bereich angeben.","o":["Es wird breiter.","Es wird schmäler.","Es bleibt gleich breit.","Es verschiebt sich nach rechts."]},{"type":"num","a":1068.0,"q":"Ein Anteil soll mit 95 % Sicherheit auf höchstens ±3 Prozentpunkte genau geschätzt werden. Wie groß muss die Stichprobe mindestens sein (ungünstigster Fall $h=0,5$)?","s":"$n\\ge0,25\\cdot\\left(\\dfrac{1,96}{0,03}\\right)^2\\approx0,25\\cdot4268,4\\approx1067,1$. Aufrunden: mindestens 1068 Personen."},{"type":"mc","q":"Welche Deutung eines 95-%-Konfidenzintervalls ist richtig?","s":"Ein Konfidenzintervall macht eine Aussage über den unbekannten Anteil in der Grundgesamtheit und über die Zuverlässigkeit des Verfahrens. Der Stichprobenanteil liegt immer genau in der Mitte des Intervalls, über ihn gibt es keine Unsicherheit.","o":["Das Verfahren liefert in 95 % aller Fälle ein Intervall, das den wahren Anteil enthält.","95 % aller Personen der Grundgesamtheit liegen in diesem Intervall.","Der Anteil in der Stichprobe liegt mit 95 % Wahrscheinlichkeit in diesem Intervall.","In 95 % aller künftigen Stichproben ergibt sich genau dieses Intervall."]},{"type":"mc","q":"Was ist bei einem Hypothesentest ein Fehler 1. Art?","s":"Man entscheidet sich gegen $H_0$, obwohl sie stimmt. Die Wahrscheinlichkeit dafür ist durch das Signifikanzniveau begrenzt.","o":["Die Nullhypothese wird verworfen, obwohl sie zutrifft.","Die Nullhypothese wird beibehalten, obwohl sie falsch ist.","Die Stichprobe ist zu klein.","Das Signifikanzniveau wurde falsch gewählt."]}],"gen":[],"html":"<h3>Die Fragestellung<\/h3>\n<p>Bisher war die Wahrscheinlichkeit $p$ bekannt, und man fragte nach den Ergebnissen. In der Praxis ist es umgekehrt: Man hat ein Stichprobenergebnis und möchte wissen, wie groß der unbekannte Anteil $p$ in der Grundgesamtheit ist. Der Anteil $h$ in der Stichprobe (die relative Häufigkeit) ist dafür der beste einzelne Schätzwert. Weil jede Stichprobe zufällig etwas anders ausfällt, gibt man zusätzlich einen Bereich an, in dem $p$ vermutlich liegt.<\/p>\n<h3>Das Konfidenzintervall<\/h3>\n<div class=\"formula\">$h\\pm z\\cdot\\sqrt{\\dfrac{h\\cdot(1-h)}{n}}$<\/div>\n<p>$n$ ist die Stichprobengröße, $z$ hängt von der gewünschten Sicherheit $\\gamma$ (dem Konfidenzniveau) ab:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Sicherheit $\\gamma$<\/th><th>90 %<\/th><th>95 %<\/th><th>99 %<\/th><\/tr><tr><td>$z$<\/td><td>1,645<\/td><td>1,960<\/td><td>2,576<\/td><\/tr><\/table><\/div>\n<p>Ein vollständig vorgerechnetes 95-%-Intervall findest du auf der Seite zur Zentralmatura. Hier geht es um das Verständnis: Was bedeutet das Intervall, und wovon hängt seine Breite ab?<\/p>\n<h3>Was das Intervall bedeutet<\/h3>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Richtig: „Das Verfahren liefert in 95 % aller Fälle ein Intervall, das den wahren Anteil $p$ enthält.“ Die Sicherheit bezieht sich auf das <b>Verfahren<\/b>, mit dem das Intervall berechnet wird. Der wahre Anteil $p$ ist eine feste, unbekannte Zahl. Zufällig sind die Grenzen des Intervalls, die bei jeder Stichprobe anders ausfallen.<\/div>\n<h3>Wovon die Breite abhängt<\/h3>\n<p>Der Ausdruck $z\\cdot\\sqrt{\\frac{h(1-h)}{n}}$ ist die halbe Breite des Intervalls. Daran liest du ab:<\/p>\n<ul><li><b>Größere Stichprobe:<\/b> $n$ steht im Nenner unter der Wurzel. Das Intervall wird schmäler. Für die halbe Breite braucht man die <b>vierfache<\/b> Stichprobe.<\/li><li><b>Höhere Sicherheit:<\/b> $z$ wird größer, das Intervall wird breiter. Mehr Sicherheit gibt es nur um den Preis einer ungenaueren Aussage.<\/li><li><b>Anteil nahe 50 %:<\/b> $h(1-h)$ ist bei $h=0,5$ am größten, dort ist das Intervall am breitesten.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Nötige Stichprobengröße<\/h4><div class=\"task\">Vor einer Abstimmung soll der Anteil der Befürworter mit 95 % Sicherheit auf höchstens ±2 Prozentpunkte genau geschätzt werden. Wie viele Personen muss man mindestens befragen?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die halbe Breite soll höchstens 0,02 sein: $1,96\\cdot\\sqrt{\\dfrac{h(1-h)}{n}}\\le0,02$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$h$ kennt man vor der Umfrage nicht. Man rechnet mit dem ungünstigsten Fall $h=0,5$, dann ist $h(1-h)=0,25$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Nach $n$ auflösen: $\\sqrt{\\dfrac{0,25}{n}}\\le\\dfrac{0,02}{1,96}$. Quadrieren: $\\dfrac{0,25}{n}\\le\\left(\\dfrac{0,02}{1,96}\\right)^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$n\\ge0,25\\cdot\\left(\\dfrac{1,96}{0,02}\\right)^2=0,25\\cdot9604=2401$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: mindestens 2401 Personen. Für ±1 Prozentpunkt wären es viermal so viele.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Ausblick: Hypothesentests<\/h3>\n<p>Beim Testen prüft man eine Behauptung, die <b>Nullhypothese<\/b> $H_0$, etwa „der Anteil fehlerhafter Teile beträgt höchstens 3 %“. Man legt vorher fest, bei welchen Stichprobenergebnissen man $H_0$ verwirft. Zwei Fehler sind möglich:<\/p>\n<ul><li><b>Fehler 1. Art:<\/b> $H_0$ wird verworfen, obwohl sie stimmt. Seine Wahrscheinlichkeit ist höchstens das Signifikanzniveau $\\alpha$, meist 5 %.<\/li><li><b>Fehler 2. Art:<\/b> $H_0$ wird beibehalten, obwohl sie falsch ist.<\/li><\/ul>\n<p>Ein Testergebnis beweist nie, dass eine Hypothese wahr ist. Es sagt nur, ob die Daten mit ihr verträglich sind.<\/p>"}]};

/* ---------- Zahlen einlesen und prüfen ---------- */
function pnum(s){
  s=String(s).trim().replace(/[−–]/g,'-').replace(/\s/g,'').replace(/[a-zA-Zäöü°%€²³]+$/,'').replace(/,/g,'.');
  if(s==='')return NaN;
  if(s.includes('/')){const p=s.split('/');if(p.length!==2)return NaN;const a=Number(p[0]),b=Number(p[1]);return b?a/b:NaN}
  return Number(s);
}
const tolOf=(a,t)=>t!=null?t:Math.max(Number.isInteger(a)?0.001:0.011,Math.abs(a)*0.002);
function check(e,val){
  if(e.type==='num'){const x=pnum(val);if(isNaN(x))return null;return Math.abs(x-e.a)<=tolOf(e.a,e.tol)}
  const parts=String(val).split(';').map(pnum);if(parts.some(isNaN))return null;
  let a=e.a.slice(),p=parts.slice();
  if(e.type==='set'){p=[...new Set(p.map(x=>Math.round(x*1e6)/1e6))];a.sort((x,y)=>x-y);p.sort((x,y)=>x-y)}
  if(a.length!==p.length)return false;
  return a.every((x,i)=>Math.abs(x-p[i])<=tolOf(x,e.tol));
}
const fm=(x,d=2)=>{let s=(Math.round(x*10**d)/10**d).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',').replace('-','−')};
const ansText=e=>e.type==='num'?fm(e.a,4):e.a.map(x=>fm(x,4)).join('; ');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  }
  return h+'<div class="fb"></div>';
}
function wireEx(box,e,onOk){
  const fb=box.querySelector('.fb');let tries=0;
  const show=(cls,head,body)=>{fb.className='fb show '+cls;fb.innerHTML='<b class="h">'+head+'</b>'+mfy(body);typeset(fb)};
  const sol=()=>'<div>'+e.s+'</div>';
  const good=()=>{box.classList.remove('no');box.classList.add('ok');show('good','Richtig!',sol());onOk&&onOk()};
  if(e.type==='mc'){
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(box.dataset.fin)return;
      if(+b.dataset.i===0){b.classList.add('right');box.dataset.fin=1;if(tries===0)good();else{show('good','Jetzt stimmt es.',sol())}}
      else{b.classList.add('wrong');b.disabled=true;tries++;box.classList.add('no');
        if(tries===1&&e.o.length>2)show('hint','Noch nicht.',e.h?('Tipp: '+e.h):'Lies die Angabe noch einmal genau und versuche es erneut.');
        else{box.dataset.fin=1;box.querySelector('.opt[data-i="0"]').classList.add('right');show('bad','Die richtige Antwort ist markiert.',sol())}}
    });
  }else if(e.type==='self'){
    box.querySelector('.show').onclick=()=>{show('good','Musterlösung',sol()+'<div class="row"><button class="petrol yes">Das hatte ich auch</button><button class="ghost nope">Noch nicht ganz</button></div>');
      fb.querySelector('.yes').onclick=()=>{box.classList.add('ok');onOk&&onOk();fb.querySelector('.row').remove()};
      fb.querySelector('.nope').onclick=()=>{fb.querySelector('.row').innerHTML='Kein Problem – lies die Lösung in Ruhe durch und probiere die Aufgabe morgen noch einmal.'}};
  }else{
    const inp=box.querySelector('input'),sb=box.querySelector('.show');
    const go=()=>{
      const r=check(e,inp.value);
      if(r===null){show('hint','Eingabe nicht erkannt.','Gib nur Zahlen ein, zum Beispiel 3,5 oder −2 oder 7/3.');return}
      if(r){if(box.dataset.shown)show('good','Stimmt.',sol());else good();return}
      tries++;box.classList.add('no');sb.style.display='';
      show(tries===1&&e.h?'hint':'bad','Noch nicht richtig.',tries===1&&e.h?('Tipp: '+e.h):'Rechne noch einmal nach – oder sieh dir die Lösung an und rechne sie danach selbst durch.');
    };
    box.querySelector('.chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
    sb.onclick=()=>{box.dataset.shown=1;show('bad','Lösung: '+ansText(e),sol())};
  }
}

  const fs=(o.f||'').split(';;').filter(s=>s.trim()).map(s=>new Function('x','with(Math){return '+s+'}'));
  if(o.area&&fs[0]){const [a,b]=o.area.split(',').map(Number);const lo=fs[1]||(()=>0);let d='M'+X(a)+' '+Y(lo(a));for(let i=0;i<=80;i++){const x=a+(b-a)*i/80;d+='L'+X(x)+' '+Y(fs[0](x))}for(let i=80;i>=0;i--){const x=a+(b-a)*i/80;d+='L'+X(x)+' '+Y(lo(x))}g+='<path d="'+d+'Z" fill="#a7843b" opacity=".28"/>'}
  fs.forEach((f,k)=>{let d='',pen=false;for(let i=0;i<=400;i++){const x=x0+(x1-x0)*i/400,y=f(x);if(!isFinite(y)||y<y0-(y1-y0)||y>y1+(y1-y0)){pen=false;continue}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true}
    g+='<path d="'+d+'" fill="none" stroke="'+COL[k%4]+'" stroke-width="2.6" stroke-linejoin="round"/>'});

linf:{n:'Gerade durch zwei Punkte',f(){const k=pick([-3,-2,-1.5,-1,-0.5,0.5,1,1.5,2,3]),d=ri(-6,6),x1=pick([-4,-2,0,2]),x2=x1+pick([2,4,6]);
  return{q:'Der Graph einer linearen Funktion $f(x)=k\\cdot x+d$ geht durch $A=('+x1+'|'+T(k*x1+d)+')$ und $B=('+x2+'|'+T(k*x2+d)+')$. Gib $k; d$ an.',type:'list',a:[k,d],s:'$k=\\dfrac{\\Delta y}{\\Delta x}=\\dfrac{'+T(k*x2+d)+'-('+T(k*x1+d)+')}{'+x2+'-('+x1+')}='+T(k)+'$. Punkt einsetzen: $d=y-k\\cdot x='+T(d)+'$.'}}},
scheitel:{n:'Scheitelpunkt',f(){const a=pick([-2,-1,1,2,3]),m=ri(-4,4),n=ri(-6,6),b=-2*a*m,c=a*m*m+n;
  return{q:'Bestimme den Scheitelpunkt $S=(x_S|y_S)$ der Parabel $f(x)='+poly([a,b,c])+'$. Gib $x_S; y_S$ an.',type:'list',a:[m,n],s:'$x_S=-\\dfrac{b}{2a}=-\\dfrac{'+T(b)+'}{'+T(2*a)+'}='+T(m)+'$ und $y_S=f('+T(m)+')='+T(n)+'$. Scheitelform: $f(x)='+T(a)+'\\,(x'+sgn(-m)+')^2'+sgn(n)+'$.'.replace('(x+0)','(x)').replace('(x-0)','(x)')}}},
rw:{n:'Rechtwinkliges Dreieck',f(){const al=ri(15,70),c=ri(5,20),t=ri(0,2);const r=al*Math.PI/180;
  if(t===0)return{q:'Rechtwinkliges Dreieck mit Hypotenuse $c='+c+'$ cm und Winkel $\\alpha='+al+'°$. Berechne die Gegenkathete $a$ (in cm, zwei Dezimalstellen).',a:c*Math.sin(r),tol:0.02,s:'$\\sin\\alpha=\\dfrac{a}{c}\\Rightarrow a=c\\cdot\\sin\\alpha='+c+'\\cdot\\sin('+al+'°)\\approx '+fm(c*Math.sin(r))+'$ cm.'};
  if(t===1)return{q:'Rechtwinkliges Dreieck mit Ankathete $b='+c+'$ cm und Winkel $\\alpha='+al+'°$. Berechne die Gegenkathete $a$ (in cm, zwei Dezimalstellen).',a:c*Math.tan(r),tol:0.02,s:'$\\tan\\alpha=\\dfrac{a}{b}\\Rightarrow a=b\\cdot\\tan\\alpha='+c+'\\cdot\\tan('+al+'°)\\approx '+fm(c*Math.tan(r))+'$ cm.'};
  const a=ri(3,c-1);return{q:'Rechtwinkliges Dreieck mit Gegenkathete $a='+a+'$ cm und Hypotenuse $c='+c+'$ cm. Berechne $\\alpha$ in Grad (zwei Dezimalstellen).',a:Math.asin(a/c)*180/Math.PI,tol:0.02,s:'$\\sin\\alpha=\\dfrac{'+a+'}{'+c+'}\\Rightarrow\\alpha=\\arcsin\\left(\\dfrac{'+a+'}{'+c+'}\\right)\\approx '+fm(Math.asin(a/c)*180/Math.PI)+'°$. Achte darauf, dass dein Rechner auf Grad (DEG) steht.'}}},
cos:{n:'Cosinussatz',f(){const a=ri(4,12),b=ri(4,12),g=pick([35,48,60,72,95,110,125]),c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(g*Math.PI/180));
  return{q:'Dreieck mit $a='+a+'$, $b='+b+'$ und eingeschlossenem Winkel $\\gamma='+g+'°$. Berechne $c$ (zwei Dezimalstellen).',a:c,tol:0.02,s:'Zwei Seiten und der eingeschlossene Winkel: Cosinussatz. $c^2=a^2+b^2-2ab\\cos\\gamma='+(a*a+b*b)+'-'+(2*a*b)+'\\cdot\\cos('+g+'°)\\approx '+fm(c*c)+'$, also $c\\approx '+fm(c)+'$.'}}},
skal:{n:'Winkel zwischen Vektoren',f(){const a=[nz(-4,4),nz(-4,4),ri(-3,3)],b=[nz(-4,4),ri(-4,4),nz(-3,3)],d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2],na=Math.hypot(...a),nb=Math.hypot(...b),w=Math.acos(d/na/nb)*180/Math.PI;
  return{q:'Berechne den Winkel zwischen $\\vec a='+vec(a)+'$ und $\\vec b='+vec(b)+'$ in Grad (zwei Dezimalstellen).',a:w,tol:0.02,s:'$\\vec a\\cdot\\vec b='+T(d)+'$, $|\\vec a|=\\sqrt{'+(a[0]**2+a[1]**2+a[2]**2)+'}$, $|\\vec b|=\\sqrt{'+(b[0]**2+b[1]**2+b[2]**2)+'}$. $\\cos\\varphi=\\dfrac{\\vec a\\cdot\\vec b}{|\\vec a|\\cdot|\\vec b|}\\approx '+fm(d/na/nb,4)+'$, also $\\varphi\\approx '+fm(w)+'°$.'}}},
kreuz:{n:'Kreuzprodukt',f(){const a=[ri(-4,4),ri(-4,4),ri(-4,4)],b=[ri(-4,4),ri(-4,4),nz(-4,4)],c=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  return{q:'Berechne das Kreuzprodukt $'+vec(a)+'\\times'+vec(b)+'$ und gib die drei Koordinaten an.',type:'list',a:c,s:'Koordinatenweise: $a_2b_3-a_3b_2='+T(c[0])+'$, $a_3b_1-a_1b_3='+T(c[1])+'$, $a_1b_2-a_2b_1='+T(c[2])+'$. Kontrolle: Das Ergebnis muss auf beide Vektoren normal stehen, beide Skalarprodukte sind 0.'}}},
abst:{n:'Abstand zweier Punkte',f(){const A=[ri(-5,5),ri(-5,5),ri(-5,5)],B=[ri(-5,5),ri(-5,5),ri(-5,5)];if(A.join()===B.join())B[0]+=3;const d=B.map((v,i)=>v-A[i]);
  return{q:'Berechne den Abstand der Punkte $A=('+A.join('|')+')$ und $B=('+B.join('|')+')$ (zwei Dezimalstellen).',a:Math.hypot(...d),tol:0.02,s:'$\\overrightarrow{AB}=B-A='+vec(d)+'$, Betrag: $\\sqrt{'+d.map(v=>'('+T(v)+')^2').join('+')+'}=\\sqrt{'+(d[0]**2+d[1]**2+d[2]**2)+'}\\approx '+fm(Math.hypot(...d))+'$.'}}},
arith:{n:'Arithmetische Folge',f(){const a1=ri(-10,20),d=nz(-6,9),n=ri(8,30),an=a1+(n-1)*d,t=ri(0,1);
  return t?{q:'Arithmetische Folge mit $a_1='+a1+'$ und $d='+d+'$. Berechne die Summe der ersten $'+n+'$ Glieder.',a:n*(a1+an)/2,s:'Zuerst $a_{'+n+'}=a_1+('+n+'-1)\\cdot d='+T(an)+'$, dann $s_{'+n+'}=\\dfrac{'+n+'}{2}\\cdot(a_1+a_{'+n+'})='+T(n*(a1+an)/2)+'$.'}
  :{q:'Arithmetische Folge mit $a_1='+a1+'$ und $d='+d+'$. Berechne $a_{'+n+'}$.',a:an,s:'$a_n=a_1+(n-1)\\cdot d='+a1+'+'+(n-1)+'\\cdot('+d+')='+T(an)+'$.'}}},
geom:{n:'Geometrische Folge',f(){const b=pick([1,2,3,5,8,10]),t=ri(0,1);

proz:{n:'Prozentuelles Wachstum',f(){const p=pick([-12,-8,-5,-2.5,1.5,2,3,4.5,6,10]),k=pick([800,1200,2500,5000,12000]),n=ri(3,12),v=k*(1+p/100)**n;

abl:{n:'Ableitung an einer Stelle',f(){const c=[nz(-3,3),ri(-4,4),ri(-6,6),ri(-9,9)],x=ri(-3,3),v=3*c[0]*x*x+2*c[1]*x+c[2];

ext:{n:'Extremstellen',f(){const a=ri(1,4),c=ri(-8,8);

tang:{n:'Tangente',f(){const a=nz(-2,3),b=ri(-4,4),c=ri(-5,5),x=ri(-2,3),k=2*a*x+b,y=a*x*x+b*x+c;
  return{q:'Bestimme die Gleichung $y=k\\cdot x+d$ der Tangente an $f(x)='+poly([a,b,c])+'$ an der Stelle $x_0='+x+'$. Gib $k; d$ an.',type:'list',a:[k,y-k*x],s:'$f\'(x)='+poly([2*a,b])+'$, also $k=f\'('+x+')='+T(k)+'$. Berührpunkt: $f('+x+')='+T(y)+'$. $d=y_0-k\\cdot x_0='+T(y-k*x)+'$.'}}},
int:{n:'Bestimmtes Integral',f(){const p=pick([3,6,-3]),q=pick([2,4,-2,-4,6]),r=ri(-4,5),a=ri(-2,1),b=a+ri(1,3),F=x=>p/3*x**3+q/2*x*x+r*x;
  return{q:'Berechne $\\displaystyle\\int_{'+a+'}^{'+b+'}\\left('+poly([p,q,r])+'\\right)\\,dx$.',a:F(b)-F(a),s:'Stammfunktion: $F(x)='+poly([p/3,q/2,r,0])+'$. $F('+b+')-F('+a+')='+T(F(b))+'-('+T(F(a))+')='+T(F(b)-F(a))+'$.'}}},
flaeche:{n:'Fläche unter einer Parabel',f(){const r=ri(-3,1),s=r+ri(1,4),k=pick([1,2,3,-1,-2,-3]),A=Math.abs(k)*(s-r)**3/6;

binom:{n:'Binomialverteilung',f(){const n=ri(5,12),p=pick([0.1,0.2,0.25,0.3,0.4,0.5,0.6]),k=ri(0,Math.min(n,5)),v=binom(n,k)*p**k*(1-p)**(n-k);
  return{q:'$X$ ist binomialverteilt mit $n='+n+'$ und $p='+T(p)+'$. Berechne $P(X='+k+')$ (vier Dezimalstellen).',a:v,tol:0.0006,s:'$P(X='+k+')=\\dbinom{'+n+'}{'+k+'}\\cdot '+T(p)+'^{'+k+'}\\cdot '+T(1-p)+'^{'+(n-k)+'}='+binom(n,k)+'\\cdot '+T(p)+'^{'+k+'}\\cdot '+T(1-p)+'^{'+(n-k)+'}\\approx '+fm(v,4)+'$.'}}},
erw:{n:'Erwartungswert',f(){const xs=[ri(-5,0),ri(1,4),ri(5,12)],p1=pick([0.5,0.6,0.7]),p2=pick([0.1,0.2]),p3=Math.round((1-p1-p2)*100)/100,E=xs[0]*p1+xs[1]*p2+xs[2]*p3;
  return{q:'Eine Zufallsvariable $X$ nimmt die Werte $'+xs[0]+'$, $'+xs[1]+'$ und $'+xs[2]+'$ mit den Wahrscheinlichkeiten $'+T(p1)+'$, $'+T(p2)+'$ und $'+T(p3)+'$ an. Berechne $E(X)$.',a:E,tol:0.006,s:'Jeden Wert mit seiner Wahrscheinlichkeit multiplizieren und addieren: $E(X)='+xs[0]+'\\cdot '+T(p1)+'+'+xs[1]+'\\cdot '+T(p2)+'+'+xs[2]+'\\cdot '+T(p3)+'='+fm(E,3)+'$.'}}},
norm:{n:'Normalverteilung',f(){const mu=pick([50,100,170,500]),si=pick([4,5,8,10]),z=pick([-1.5,-1,-0.5,0.5,1,1.5,2]),x=mu+z*si,up=ri(0,1),v=up?1-Phi(z):Phi(z);
  return{q:'$X$ ist normalverteilt mit $\\mu='+mu+'$ und $\\sigma='+si+'$. Berechne $P(X'+(up?'>':'<')+T(x)+')$ (vier Dezimalstellen).',a:v,tol:0.0011,s:'Standardisieren: $z=\\dfrac{'+T(x)+'-'+mu+'}{'+si+'}='+T(z)+'$. $\\Phi('+T(z)+')\\approx '+fm(Phi(z),4)+'$'+(up?', gesucht ist die Gegenwahrscheinlichkeit: $1-'+fm(Phi(z),4)+'='+fm(v,4)+'$.':'.')}}},
bed:{n:'Satz von Bayes',f(){const pa=pick([0.01,0.02,0.05,0.1,0.2]),s=pick([0.9,0.95,0.98]),f=pick([0.02,0.05,0.1]),v=pa*s/(pa*s+(1-pa)*f);

kompl:{n:'Komplexe Zahlen multiplizieren',f(){const a=nz(-5,5),b=nz(-5,5),c=nz(-5,5),d=nz(-5,5);

function genBox(ids,host,label){
  const box=document.createElement('div');box.className='ex';host.appendChild(box);let cnt=0,ok=0;

  h+=mfy(c.html.replace(/\[\[plot:([^\]]+)\]\]/g,(m,s)=>plot(s)));

  if(c.gen.length)h+='<h3>Endlos-Training</h3><p>Immer neue Zahlen, immer derselbe Lösungsweg. Rechne so lange weiter, bis es sich leicht anfühlt.</p><div id="genhost"></div>';
  h+='<div class="navrow">'+(prev?'<a href="#'+prev.id+'"><button class="ghost">← '+prev.t+'</button></a>':'<span></span>')+(next?'<a href="#'+next.id+'"><button>'+next.t+' →</button></a>':'<a href="#"><button>Zur Startseite</button></a>')+'</div></div>';
  $('#main').innerHTML=h;
  $$('.walk').forEach(w=>{const st=[...w.querySelectorAll('.wstep')],b=w.querySelector('.nxt'),all=w.querySelector('.all');let i=0;
    const upd=()=>{b.disabled=i>=st.length;b.textContent=i>=st.length?'Fertig':(i===0?'Ersten Schritt zeigen':'Nächster Schritt');if(i>=st.length)all.style.display='none'};
    b.onclick=()=>{if(i<st.length){st[i++].classList.add('show');upd()}};all.onclick=()=>{st.forEach(s=>s.classList.add('show'));i=st.length;upd()};upd()});
  $$('.phi').forEach(p=>{p.innerHTML='<b>Φ-Rechner:</b> z = <input type="text" value="1"> → Φ(z) = <b class="out"></b>';const inp=p.querySelector('input'),out=p.querySelector('.out');const u=()=>{const z=pnum(inp.value);out.textContent=isNaN(z)?'–':fm(Phi(z),4)};inp.oninput=u;u()});
  const host=$('#exhost');
  c.ex.forEach((e,i)=>{const box=document.createElement('div');box.className='ex'+(ST.ok[c.id+'_'+i]?' ok':'');box.innerHTML=exHTML(e,'Aufgabe '+(i+1)+(ST.ok[c.id+'_'+i]?' · schon gelöst ✓':''));host.appendChild(box);wireEx(box,e,()=>{ST.ok[c.id+'_'+i]=1;save();progress()})});
  if(c.gen.length)genBox(c.gen,$('#genhost'));
  typeset($('#main'));
}
function route(){
  const id=location.hash.slice(1);
  if(id==='mix')mix();else if(BYID[id])chapter(BYID[id]);else home();
  $$('aside a.ch').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const on=$('aside a.ch.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  progress();window.scrollTo(0,0);
}
sidebar();window.addEventListener('hashchange',route);$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');route();

</script>
