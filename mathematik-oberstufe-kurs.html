imalstellen).","unit":"°","h":"Richtungsvektoren sind $(1|2)$ und $(1|-1)$.","s":"Skalarprodukt: $1-2=-1$. Beträge: $\\sqrt5$ und $\\sqrt2$. $\\cos\\varphi=\\dfrac{-1}{\\sqrt{10}}$ ergibt $108,43°$. Der Schnittwinkel ist der kleinere Winkel: $180°-108,43°=71,57°$."},{"type":"mc","q":"Wann heißen zwei Geraden im Raum windschief?","s":"Windschiefe Geraden laufen aneinander vorbei, wie eine Straße und eine Brücke darüber, die in verschiedene Richtungen führen.","o":["Wenn sie nicht parallel sind und keinen gemeinsamen Punkt haben.","Wenn sie parallel sind und keinen gemeinsamen Punkt haben.","Wenn sie einander unter einem Winkel ungleich 90° schneiden.","Wenn sie in derselben Ebene liegen."]}],"gen":[],"html":"<h3>Die Parameterform<\/h3>\n<p>Eine Gerade ist festgelegt durch einen Punkt $P$ und eine Richtung $\\vec g$:<\/p>\n<div class=\"formula\">$g:\\ X=P+t\\cdot\\vec g\\qquad(t\\in\\mathbb{R})$<\/div>\n<p>Für jeden Wert des Parameters $t$ erhältst du einen Punkt der Geraden. $t=0$ liefert $P$, $t=1$ den Punkt eine Richtungslänge weiter. Diese Form gilt in der Ebene und im Raum. In der Ebene gibt es zusätzlich die Normalvektorform $\\vec n\\cdot X=\\vec n\\cdot P$, die ausgeschrieben $ax+by=c$ lautet. Das Umrechnen zwischen beiden Formen ist auf der Seite zur Zentralmatura Schritt für Schritt gezeigt.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Eine Gerade durch zwei Punkte $A$ und $B$ stellst du auf mit $X=A+t\\cdot\\overrightarrow{AB}$.<\/div>\n<h3>Liegt ein Punkt auf der Geraden?<\/h3>\n<p>Setze den Punkt für $X$ ein. Jede Koordinate liefert eine Gleichung für $t$. Kommt überall <b>derselbe<\/b> Wert heraus, liegt der Punkt auf der Geraden.<\/p>\n<h3>Lagebeziehungen<\/h3>\n<p>Der erste Blick gilt immer den Richtungsvektoren.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Richtungsvektoren<\/th><th>Zusatzprüfung<\/th><th>Lage<\/th><\/tr><tr><td>Vielfache voneinander<\/td><td>ein Punkt der einen liegt auf der anderen<\/td><td>identisch<\/td><\/tr><tr><td>Vielfache voneinander<\/td><td>der Punkt liegt nicht darauf<\/td><td>parallel und verschieden<\/td><\/tr><tr><td>keine Vielfachen<\/td><td>Gleichsetzen liefert eine Lösung<\/td><td>schneidend<\/td><\/tr><tr><td>keine Vielfachen<\/td><td>Gleichsetzen führt zum Widerspruch<\/td><td>windschief (nur im Raum möglich)<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Schnittpunkt zweier Geraden im Raum<\/h4><div class=\"task\">Untersuche die Lage von $g: X=\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}+s\\begin{pmatrix}1\\\\1\\\\-1\\end{pmatrix}$ und $h: X=\\begin{pmatrix}4\\\\1\\\\3\\end{pmatrix}+t\\begin{pmatrix}1\\\\-1\\\\2\\end{pmatrix}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Richtungsvektoren vergleichen: $(1|1|-1)$ und $(1|-1|2)$ sind keine Vielfachen. Die Geraden schneiden einander oder sind windschief.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gleichsetzen ergibt drei Gleichungen. I: $1+s=4+t$. II: $s=1-t$. III: $2-s=3+2t$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Löse zwei davon. Aus II in I: $1+1-t=4+t$, also $t=-1$ und $s=2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div><b>Entscheidend:<\/b> Prüfe die dritte Gleichung. III: $2-2=0$ und $3+2\\cdot(-1)=1$. Das ist ein Widerspruch.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Die Geraden haben keinen gemeinsamen Punkt und sind nicht parallel: Sie sind <b>windschief<\/b>. Wäre III erfüllt gewesen, hättest du $s=2$ in $g$ eingesetzt und den Schnittpunkt erhalten.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Abstand und Winkel in der Ebene<\/h3>\n<p>Für eine Gerade $g: ax+by=c$ und einen Punkt $P=(p_1|p_2)$ gilt die Abstandsformel<\/p>\n<div class=\"formula\">$d(P,g)=\\dfrac{|a\\,p_1+b\\,p_2-c|}{\\sqrt{a^2+b^2}}$<\/div>\n<p>Den <b>Schnittwinkel<\/b> zweier Geraden berechnest du als Winkel zwischen ihren Richtungsvektoren. Als Schnittwinkel gilt der kleinere der beiden möglichen Winkel, also höchstens 90°. Kommt ein stumpfer Winkel heraus, nimmst du $180°$ minus diesen Wert.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Abstand eines Punktes von einer Geraden<\/h4><div class=\"task\">Berechne den Abstand des Punktes $P=(6|5)$ von der Geraden $g: X=\\begin{pmatrix}1\\\\0\\end{pmatrix}+t\\begin{pmatrix}4\\\\3\\end{pmatrix}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Für die Abstandsformel brauchst du die Form $ax+by=c$. Normalvektor mit der Kippregel: $\\vec n=\\begin{pmatrix}3\\\\-4\\end{pmatrix}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gleichung: $3x-4y=c$. Punkt $(1|0)$ einsetzen: $c=3$. Also $g: 3x-4y=3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Einsetzen in die Formel: $d=\\dfrac{|3\\cdot6-4\\cdot5-3|}{\\sqrt{9+16}}=\\dfrac{|-5|}{5}=1$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Der Abstand beträgt 1.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"ebenen","t":"Ebenen im Raum","kl":"6","k":6,"a":"V","tag":"S","goals":["Ebenen in Parameterform und in Normalvektorform angeben","aus drei Punkten eine Ebenengleichung aufstellen","den Durchstoßpunkt einer Geraden berechnen","Abstände von Punkten zu Ebenen bestimmen"],"ex":[{"type":"num","a":6.0,"q":"Die Ebene durch $A=(1|0|0)$, $B=(0|2|0)$ und $C=(0|0|3)$ hat die Gleichung $6x+3y+2z=d$. Bestimme $d$.","s":"Punkt $A$ einsetzen: $6\\cdot1+0+0=6$. Kontrolle mit $B$: $3\\cdot2=6$, mit $C$: $2\\cdot3=6$."},{"type":"mc","q":"Liegt $P=(1|1|1)$ in der Ebene $E: 2x-y+3z=4$?","s":"$2\\cdot1-1+3\\cdot1=4$. Die Gleichung ist erfüllt, der Punkt liegt in der Ebene.","o":["Ja, denn Einsetzen ergibt $4=4$.","Nein, denn Einsetzen ergibt $6\\ne4$.","Nein, denn Einsetzen ergibt $0\\ne4$.","Ja, denn jeder Punkt mit gleichen Koordinaten liegt in $E$."]},{"type":"list","a":[2.0,3.0,1.0],"q":"Bestimme den Durchstoßpunkt von $g: X=\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}$ mit $E: x+y+z=6$.","s":"$(1+t)+(1+2t)+t=6$ ergibt $2+4t=6$, also $t=1$. Punkt: $(2|3|1)$."},{"type":"num","a":3.0,"q":"Berechne den Abstand des Punktes $P=(1|2|3)$ von der Ebene $E: 2x+2y+z=18$.","s":"$d=\\dfrac{|2+4+3-18|}{\\sqrt{4+4+1}}=\\dfrac{9}{3}=3$."},{"type":"mc","q":"Woran erkennst du, dass eine Gerade parallel zu einer Ebene ist (oder in ihr liegt)?","s":"Verläuft die Gerade parallel zur Ebene, steht ihre Richtung normal auf dem Normalvektor. Ist der Richtungsvektor dagegen ein Vielfaches von $\\vec n$, steht die Gerade normal auf der Ebene.","o":["Das Skalarprodukt aus Richtungsvektor und Normalvektor ist 0.","Der Richtungsvektor ist ein Vielfaches des Normalvektors.","Das Kreuzprodukt aus Richtungsvektor und Normalvektor ist der Nullvektor.","Der Stützpunkt der Geraden erfüllt die Ebenengleichung."]},{"type":"list","a":[1.0,-4.0,2.0],"q":"Gib einen Normalvektor der Ebene $E: x-4y+2z=7$ an (so, wie man ihn direkt abliest).","s":"Die Zahlen vor $x$, $y$ und $z$: $\\vec n=(1|-4|2)$."},{"type":"num","a":45.0,"q":"Berechne den Winkel zwischen den Ebenen $E_1: z=0$ und $E_2: y+z=3$ in Grad.","unit":"°","s":"Normalvektoren: $(0|0|1)$ und $(0|1|1)$. $\\cos\\varphi=\\dfrac{1}{1\\cdot\\sqrt2}$, also $\\varphi=45°$."}],"gen":[],"html":"<h3>Zwei Darstellungen<\/h3>\n<p>Eine Ebene im Raum ist durch einen Punkt $P$ und zwei nicht parallele Richtungen festgelegt (<b>Parameterform<\/b>), oder durch einen Punkt und einen Vektor $\\vec n$, der normal auf der Ebene steht (<b>Normalvektorform<\/b>):<\/p>\n<div class=\"formula\">$E:\\ X=P+s\\cdot\\vec a+t\\cdot\\vec b\\qquad\\qquad E:\\ \\vec n\\cdot X=\\vec n\\cdot P$<\/div>\n<p>Ausgeschrieben lautet die Normalvektorform $ax+by+cz=d$. Die Zahlen vor $x$, $y$ und $z$ sind genau die Koordinaten des Normalvektors. Diese Form ist für fast alle Rechnungen die bequemere.<\/p>\n<p>Von der Parameterform kommst du mit dem Kreuzprodukt zur Normalvektorform: $\\vec n=\\vec a\\times\\vec b$.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ebene durch drei Punkte<\/h4><div class=\"task\">Stelle eine Gleichung der Ebene durch $A=(1|0|2)$, $B=(3|1|2)$ und $C=(0|2|5)$ auf.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zwei Richtungsvektoren in der Ebene: $\\overrightarrow{AB}=\\begin{pmatrix}2\\\\1\\\\0\\end{pmatrix}$ und $\\overrightarrow{AC}=\\begin{pmatrix}-1\\\\2\\\\3\\end{pmatrix}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Normalvektor mit dem Kreuzprodukt: $\\vec n=\\begin{pmatrix}1\\cdot3-0\\cdot2\\\\0\\cdot(-1)-2\\cdot3\\\\2\\cdot2-1\\cdot(-1)\\end{pmatrix}=\\begin{pmatrix}3\\\\-6\\\\5\\end{pmatrix}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Ansatz: $3x-6y+5z=d$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Punkt $A$ einsetzen: $d=3\\cdot1-0+5\\cdot2=13$. Also $E: 3x-6y+5z=13$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe mit $B$ und $C$: $9-6+10=13$ und $0-12+25=13$. Beide stimmen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Gerade und Ebene<\/h3>\n<p>Setze die Koordinaten der Geraden (mit Parameter $t$) in die Ebenengleichung ein. Du bekommst eine Gleichung für $t$.<\/p>\n<ul><li>genau eine Lösung: Die Gerade durchstößt die Ebene. Einsetzen von $t$ in die Gerade liefert den Durchstoßpunkt.<\/li><li>falsche Aussage: Die Gerade ist parallel zur Ebene.<\/li><li>wahre Aussage: Die Gerade liegt in der Ebene.<\/li><\/ul>\n<p>Parallelität erkennst du auch vorab: Der Richtungsvektor der Geraden steht dann normal auf $\\vec n$, also ist ihr Skalarprodukt 0.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Durchstoßpunkt<\/h4><div class=\"task\">Wo durchstößt $g: X=\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}$ die Ebene $E: 2x+y-z=9$?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Koordinaten der Geraden: $x=2+t$, $y=-1+2t$, $z=t$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Einsetzen in $E$: $2(2+t)+(-1+2t)-t=9$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Vereinfachen: $4+2t-1+2t-t=9$, also $3+3t=9$ und $t=2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$t=2$ in die Gerade einsetzen: $D=(2+2\\mid-1+4\\mid2)=(4|3|2)$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe in $E$: $8+3-2=9$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Abstand und Winkel<\/h3>\n<div class=\"formula\">$d(P,E)=\\dfrac{|a\\,p_1+b\\,p_2+c\\,p_3-d|}{\\sqrt{a^2+b^2+c^2}}$<\/div>\n<p>Der Winkel zwischen zwei Ebenen ist der Winkel zwischen ihren Normalvektoren (wieder der kleinere der beiden möglichen).<\/p>"},{"id":"kreis","t":"Kreis, Kugel und Kegelschnitte","kl":"7","k":7,"a":"V","tag":"S","goals":["Kreis- und Kugelgleichungen aufstellen und Mittelpunkt und Radius ablesen","die Lage von Punkten und Geraden zum Kreis untersuchen","Tangenten an einen Kreis bestimmen","Ellipse, Hyperbel und Parabel an ihren Gleichungen erkennen"],"ex":[{"type":"mc","q":"Ein Kreis hat den Mittelpunkt $M=(2|-1)$ und den Radius 5. Wo liegt $P=(5|3)$?","s":"$(5-2)^2+(3+1)^2=9+16=25=r^2$. Der Punkt liegt genau auf dem Kreis.","o":["auf dem Kreis","innerhalb des Kreises","außerhalb des Kreises","im Mittelpunkt"]},{"type":"list","a":[3.0,-2.0,5.0],"q":"Bestimme Mittelpunkt und Radius von $x^2+y^2-6x+4y-12=0$. Gib $m_1; m_2; r$ an.","h":"Ergänze mit 9 und mit 4.","s":"$(x^2-6x+9)+(y^2+4y+4)=12+9+4$, also $(x-3)^2+(y+2)^2=25$. $M=(3|-2)$, $r=5$."},{"type":"num","a":25.0,"q":"Die Tangente an den Kreis $x^2+y^2=25$ im Punkt $T=(3|4)$ hat die Gleichung $3x+4y=c$. Bestimme $c$.","s":"Für einen Kreis um den Ursprung gilt $x_T\\cdot x+y_T\\cdot y=r^2$, also $c=25$. Kontrolle: $T$ erfüllt die Gleichung, denn $9+16=25$."},{"type":"num","a":2.0,"q":"Wie viele gemeinsame Punkte haben die Gerade $y=x+1$ und der Kreis $x^2+y^2=13$?","s":"Einsetzen: $x^2+(x+1)^2=13$, also $2x^2+2x-12=0$ und $x^2+x-6=0$. Die Diskriminante ist positiv (Lösungen $2$ und $-3$): zwei Schnittpunkte, nämlich $(2|3)$ und $(-3|-2)$."},{"type":"num","a":3.0,"q":"Eine Kugel hat den Mittelpunkt $M=(1|2|3)$ und geht durch $P=(3|4|4)$. Berechne ihren Radius.","s":"$r=|\\overrightarrow{MP}|=\\sqrt{2^2+2^2+1^2}=\\sqrt9=3$."},{"type":"num","a":4.0,"q":"Eine Ellipse hat die Halbachsen $a=5$ und $b=3$. Berechne die Brennweite $e$.","s":"$e^2=a^2-b^2=25-9=16$, also $e=4$. Die Brennpunkte sind $(\\pm4|0)$."},{"type":"num","a":2.0,"q":"Eine Parabel hat die Gleichung $y^2=8x$. Welche $x$-Koordinate hat ihr Brennpunkt?","s":"Vergleich mit $y^2=2px$: $2p=8$, also $p=4$. Brennpunkt: $\\left(\\frac p2\\,\\big|\\,0\\right)=(2|0)$."},{"type":"num","a":5.0,"q":"Eine Hyperbel hat $a=3$ und $b=4$. Berechne die Brennweite $e$.","s":"Bei der Hyperbel wird addiert: $e^2=a^2+b^2=9+16=25$, also $e=5$."}],"gen":[],"html":"<h3>Der Kreis<\/h3>\n<p>Ein Kreis besteht aus allen Punkten, die vom Mittelpunkt $M=(m_1|m_2)$ den Abstand $r$ haben. Mit dem Satz von Pythagoras wird daraus die Kreisgleichung:<\/p>\n<div class=\"formula\">$(x-m_1)^2+(y-m_2)^2=r^2$<\/div>\n<p>Um zu prüfen, wo ein Punkt liegt, setzt du ihn links ein. Kommt genau $r^2$ heraus, liegt er auf dem Kreis, bei weniger innerhalb, bei mehr außerhalb.<\/p>\n<p>Ist die Gleichung ausmultipliziert gegeben, bringst du sie durch <b>quadratisches Ergänzen<\/b> in diese Form zurück.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Mittelpunkt und Radius durch Ergänzen<\/h4><div class=\"task\">Bestimme Mittelpunkt und Radius von $x^2+y^2-4x+10y+13=0$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Ordne nach $x$ und $y$ und bringe die Zahl auf die andere Seite: $(x^2-4x)+(y^2+10y)=-13$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Ergänze jede Klammer zu einem Quadrat. Halbiere dazu die Zahl vor $x$ und quadriere sie: $(-2)^2=4$. Bei $y$: $5^2=25$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Addiere beide Zahlen auf <b>beiden<\/b> Seiten: $(x^2-4x+4)+(y^2+10y+25)=-13+4+25$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Schreibe als Quadrate: $(x-2)^2+(y+5)^2=16$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ablesen: $M=(2|-5)$ und $r=4$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Kreis und Gerade<\/h3>\n<p>Setze die Geradengleichung in die Kreisgleichung ein. Es entsteht eine quadratische Gleichung, und ihre Diskriminante entscheidet:<\/p>\n<ul><li>zwei Lösungen: Die Gerade schneidet den Kreis (Sekante).<\/li><li>eine Lösung: Sie berührt ihn (Tangente).<\/li><li>keine Lösung: Sie läuft vorbei (Passante).<\/li><\/ul>\n<p>Die Tangente steht normal auf dem Berührradius. Für einen Kreis um den Ursprung mit Berührpunkt $T=(x_T|y_T)$ lautet sie besonders einfach $x_T\\cdot x+y_T\\cdot y=r^2$.<\/p>\n<h3>Die Kugel<\/h3>\n<p>Im Raum kommt eine Koordinate dazu: $(x-m_1)^2+(y-m_2)^2+(z-m_3)^2=r^2$. Alles Weitere funktioniert wie beim Kreis.<\/p>\n<h3>Kegelschnitte in erster Hauptlage<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Kurve<\/th><th>Gleichung<\/th><th>Kenngrößen<\/th><\/tr><tr><td>Ellipse<\/td><td>$\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1$<\/td><td>Halbachsen $a>b$, Brennweite $e$ mit $e^2=a^2-b^2$, Brennpunkte $(\\pm e\\mid0)$<\/td><\/tr><tr><td>Hyperbel<\/td><td>$\\dfrac{x^2}{a^2}-\\dfrac{y^2}{b^2}=1$<\/td><td>$e^2=a^2+b^2$, Asymptoten $y=\\pm\\dfrac{b}{a}x$<\/td><\/tr><tr><td>Parabel<\/td><td>$y^2=2px$<\/td><td>Brennpunkt $\\left(\\dfrac{p}{2}\\,\\Big|\\,0\\right)$, Leitlinie $x=-\\dfrac{p}{2}$<\/td><\/tr><\/table><\/div>\n<p>Die geometrischen Definitionen dahinter: Bei der Ellipse ist die <b>Summe<\/b> der Abstände zu den beiden Brennpunkten konstant ($2a$), bei der Hyperbel die <b>Differenz<\/b>. Bei der Parabel ist jeder Punkt gleich weit vom Brennpunkt und von der Leitlinie entfernt.<\/p>"},{"id":"diffq","t":"Vom Differenzenquotienten zur Ableitung","kl":"7","k":7,"a":"A","tag":"M","goals":["mittlere und momentane Änderungsrate unterscheiden und berechnen","den Differentialquotienten als Grenzwert verstehen und an einfachen Funktionen selbst herleiten","Ableitungswerte als Tangentensteigung und im Sachzusammenhang mit Einheit deuten"],"ex":[{"type":"num","a":4.0,"q":"Berechne die mittlere Änderungsrate von $f(x)=x^2+1$ im Intervall $[1;3]$.","s":"$\\dfrac{f(3)-f(1)}{3-1}=\\dfrac{10-2}{2}=4$."},{"type":"num","a":6.0,"q":"Berechne mit der h-Methode die Ableitung von $f(x)=x^2$ an der Stelle $x_0=3$.","s":"$\\dfrac{(3+h)^2-9}{h}=\\dfrac{6h+h^2}{h}=6+h$. Für $h\\to0$ ergibt sich 6."},{"type":"num","a":25.0,"q":"Ein Wert steigt von 80 auf 100. Wie groß ist die relative Änderung in Prozent?","unit":"%","s":"$\\dfrac{100-80}{80}=0,25=25\\,\\%$. Bezugsgröße ist immer der alte Wert."},{"type":"num","a":15.0,"q":"Für den zurückgelegten Weg gilt $s(t)=5t^2$ (in m, $t$ in s). Berechne die mittlere Geschwindigkeit im Intervall $[1;2]$.","unit":"m/s","s":"$\\dfrac{s(2)-s(1)}{2-1}=\\dfrac{20-5}{1}=15$ m/s."},{"type":"num","a":20.0,"q":"Berechne für $s(t)=5t^2$ die Momentangeschwindigkeit zum Zeitpunkt $t=2$.","unit":"m/s","s":"$s'(t)=10t$, also $s'(2)=20$ m/s. Sie ist größer als die mittlere Geschwindigkeit davor, weil der Körper immer schneller wird."},{"type":"mc","q":"Was bedeutet $f'(2)=-3$ geometrisch?","s":"Die Ableitung an einer Stelle ist die Tangentensteigung. Sie ist negativ, der Graph fällt dort also.","o":["Die Tangente an den Graphen an der Stelle 2 hat die Steigung $-3$.","Der Graph schneidet die $x$-Achse bei $-3$.","Der Funktionswert an der Stelle 2 ist $-3$.","Die Sekante durch $(0|f(0))$ und $(2|f(2))$ hat die Steigung $-3$."]},{"type":"mc","q":"Was beschreibt der Differenzenquotient geometrisch?","s":"Zwei Punkte, eine Gerade durch beide: die Sekante. Erst der Grenzübergang macht daraus die Tangente.","o":["die Steigung der Sekante durch zwei Punkte des Graphen","die Steigung der Tangente in einem Punkt","die Fläche unter dem Graphen","den Abstand zweier Punkte des Graphen"]},{"type":"mc","q":"$V(t)$ ist das Wasservolumen in Litern in einem Becken nach $t$ Minuten. Was bedeutet $V'(5)=2$?","s":"Die Ableitung ist eine momentane Änderungsrate mit der Einheit Liter pro Minute. Über den Füllstand selbst sagt sie nichts.","o":["Nach 5 Minuten nimmt das Volumen momentan um 2 Liter pro Minute zu.","Nach 5 Minuten sind 2 Liter im Becken.","In den ersten 5 Minuten sind insgesamt 2 Liter zugeflossen.","Nach 2 Minuten sind 5 Liter im Becken."]},{"type":"num","a":1.25,"q":"Ein Wert steigt von 80 auf 100. Wie groß ist der Änderungsfaktor?","s":"$\\dfrac{100}{80}=1,25$. Faktor und relative Änderung hängen zusammen: $1,25=1+0,25$."}],"gen":[],"html":"<h3>Die Grundfrage der Analysis<\/h3>\n<p>Wie schnell ändert sich etwas? Für einen ganzen Zeitraum ist das leicht zu beantworten, für einen einzelnen Augenblick zunächst nicht. Genau diesen Schritt macht die Differentialrechnung.<\/p>\n<p>Für ein Intervall $[a;b]$ beschreibt der <b>Differenzenquotient<\/b> die mittlere Änderungsrate:<\/p>\n<div class=\"formula\">$\\dfrac{f(b)-f(a)}{b-a}$<\/div>\n<p>Geometrisch ist das die Steigung der <b>Sekante<\/b> durch die Punkte $(a|f(a))$ und $(b|f(b))$. Die vier Änderungsmaße (absolute, relative und mittlere Änderung sowie Änderungsfaktor) sind auf der Seite zur Zentralmatura gegenübergestellt. Hier geht es darum, was passiert, wenn das Intervall immer kleiner wird.<\/p>\n<h3>Der Grenzübergang<\/h3>\n<p>Lässt man den zweiten Punkt auf den ersten zuwandern, dreht sich die Sekante in die <b>Tangente<\/b>. Ihre Steigung ist der <b>Differentialquotient<\/b>, die Ableitung an der Stelle $x_0$:<\/p>\n<div class=\"formula\">$f'(x_0)=\\lim\\limits_{h\\to0}\\dfrac{f(x_0+h)-f(x_0)}{h}$<\/div>\n<p>Man darf $h=0$ nicht einfach einsetzen, weil dann $\\frac00$ dastünde. Man formt den Bruch so lange um, bis sich $h$ kürzen lässt, und bildet erst dann den Grenzwert.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Ableitung mit der h-Methode<\/h4><div class=\"task\">Bestimme die Ableitung von $f(x)=x^2$ an einer beliebigen Stelle $x$ direkt aus der Definition.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Differenzenquotient aufstellen: $\\dfrac{f(x+h)-f(x)}{h}=\\dfrac{(x+h)^2-x^2}{h}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zähler ausmultiplizieren: $(x+h)^2-x^2=x^2+2xh+h^2-x^2=2xh+h^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$h$ herausheben und kürzen: $\\dfrac{h(2x+h)}{h}=2x+h$. Das ist erlaubt, weil $h$ zwar klein, aber nicht 0 ist.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Jetzt den Grenzwert bilden: Für $h\\to0$ bleibt $2x$ übrig.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ergebnis: $f'(x)=2x$. An der Stelle 3 hat die Tangente an die Normalparabel also die Steigung 6.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Was die Ableitung bedeutet<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Sichtweise<\/th><th>Bedeutung von $f'(x_0)$<\/th><\/tr><tr><td>geometrisch<\/td><td>Steigung der Tangente an den Graphen im Punkt $(x_0\\mid f(x_0))$<\/td><\/tr><tr><td>rechnerisch<\/td><td>Grenzwert der Differenzenquotienten<\/td><\/tr><tr><td>im Sachzusammenhang<\/td><td>momentane (lokale) Änderungsrate an der Stelle $x_0$<\/td><\/tr><\/table><\/div>\n<p>Die <b>Einheit<\/b> der Ableitung ist immer „Einheit von $f$ pro Einheit von $x$“. Ist $s(t)$ ein Weg in Metern und $t$ die Zeit in Sekunden, dann ist $s'(t)$ eine Geschwindigkeit in m/s.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Ordnet man jeder Stelle $x$ ihre Ableitung zu, entsteht eine neue Funktion $f'$, die <b>Ableitungsfunktion<\/b>. Leitet man diese noch einmal ab, erhält man die zweite Ableitung $f''$.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ableitungswert deuten<\/h4><div class=\"task\">$T(t)$ ist die Temperatur eines Getränks in °C nach $t$ Minuten. Es gilt $T(10)=42$ und $T'(10)=-1,5$. Deute beide Angaben und schätze $T(12)$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>$T(10)=42$ ist ein Funktionswert: Nach 10 Minuten hat das Getränk 42 °C.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$T'(10)=-1,5$ ist eine Änderungsrate mit der Einheit °C pro Minute. Das Minus bedeutet Abnahme.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>In einem Satz: Nach 10 Minuten kühlt das Getränk gerade mit 1,5 °C pro Minute ab.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Schätzung mit der Tangente: In 2 Minuten ändert sich die Temperatur um ungefähr $2\\cdot(-1,5)=-3$ °C. Also $T(12)\\approx39$ °C.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Das ist eine Näherung, weil sich die Änderungsrate in diesen 2 Minuten selbst ein wenig ändert.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Verwechsle nie „mittlere Änderungsrate im Intervall $[2;5]$“ mit „momentane Änderungsrate an der Stelle 2“. Für das Erste brauchst du zwei Funktionswerte und einen Bruch, für das Zweite die Ableitung.<\/div>"},{"id":"ablregeln","t":"Ableitungsregeln","kl":"7","k":7,"a":"A","tag":"M","goals":["Polynomfunktionen sicher ableiten","Wurzeln und Brüche vor dem Ableiten als Potenzen schreiben","Produkt-, Quotienten- und Kettenregel anwenden","Exponential-, Logarithmus- und Winkelfunktionen ableiten"],"ex":[{"type":"num","a":15.0,"q":"Gegeben ist $f(x)=3x^4-2x^2+7x-5$. Berechne $f'(1)$.","s":"$f'(x)=12x^3-4x+7$, also $f'(1)=12-4+7=15$."},{"type":"num","a":-0.25,"q":"Gegeben ist $f(x)=\\dfrac{1}{x^2}$. Berechne $f'(2)$.","h":"Schreibe zuerst $f(x)=x^{-2}$.","s":"$f'(x)=-2x^{-3}=-\\dfrac{2}{x^3}$, also $f'(2)=-\\dfrac28=-0,25$."},{"type":"num","a":0.25,"q":"Gegeben ist $f(x)=\\sqrt x$. Berechne $f'(4)$.","s":"$f(x)=x^{\\frac12}$, $f'(x)=\\frac12x^{-\\frac12}=\\dfrac{1}{2\\sqrt x}$. $f'(4)=\\dfrac14$."},{"type":"mc","q":"Wie lautet die Ableitung von $f(x)=x^2\\cdot e^x$?","h":"Produktregel mit $u=x^2$ und $v=e^x$.","s":"$f'(x)=2x\\cdot e^x+x^2\\cdot e^x=(x^2+2x)e^x$. Die Antwort $2x\\cdot e^x$ entsteht, wenn man fälschlich nur die Ableitungen multipliziert.","o":["$(x^2+2x)\\cdot e^x$","$2x\\cdot e^x$","$x^2\\cdot e^x$","$2x+e^x$"]},{"type":"num","a":10.0,"q":"Gegeben ist $f(x)=(2x+1)^5$. Berechne $f'(0)$.","s":"$f'(x)=5(2x+1)^4\\cdot2=10(2x+1)^4$, also $f'(0)=10$."},{"type":"num","a":3.0,"q":"Gegeben ist $f(x)=\\sin(3x)$. Berechne $f'(0)$.","s":"$f'(x)=\\cos(3x)\\cdot3$, also $f'(0)=3\\cdot\\cos(0)=3$."},{"type":"num","a":1.0,"q":"Gegeben ist $f(x)=\\ln(x^2+1)$. Berechne $f'(1)$.","s":"Äußere Ableitung $\\dfrac{1}{x^2+1}$, innere Ableitung $2x$: $f'(x)=\\dfrac{2x}{x^2+1}$. $f'(1)=\\dfrac22=1$."},{"type":"num","a":0.25,"q":"Gegeben ist $f(x)=\\dfrac{x}{x+1}$. Berechne $f'(1)$.","h":"Quotientenregel mit $u=x$ und $v=x+1$.","s":"$f'(x)=\\dfrac{1\\cdot(x+1)-x\\cdot1}{(x+1)^2}=\\dfrac{1}{(x+1)^2}$, also $f'(1)=\\dfrac14$."},{"type":"num","a":4.0,"q":"Gegeben ist $f(x)=e^{-2x}$. Berechne $f''(0)$.","s":"$f'(x)=-2e^{-2x}$ und $f''(x)=4e^{-2x}$. Also $f''(0)=4$."}],"gen":["abl","kette"],"html":"<h3>Die Grundregeln<\/h3>\n<p>Niemand rechnet jede Ableitung mit dem Grenzwert aus. Man verwendet Regeln, die einmal hergeleitet wurden.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Regel<\/th><th>Funktion<\/th><th>Ableitung<\/th><\/tr><tr><td>Konstante<\/td><td>$f(x)=c$<\/td><td>$f'(x)=0$<\/td><\/tr><tr><td>Potenzregel<\/td><td>$f(x)=x^n$<\/td><td>$f'(x)=n\\cdot x^{n-1}$<\/td><\/tr><tr><td>Faktorregel<\/td><td>$c\\cdot g(x)$<\/td><td>$c\\cdot g'(x)$<\/td><\/tr><tr><td>Summenregel<\/td><td>$g(x)+h(x)$<\/td><td>$g'(x)+h'(x)$<\/td><\/tr><\/table><\/div>\n<p>Damit leitest du jede Polynomfunktion Glied für Glied ab: $f(x)=4x^3-5x^2+2x-7$ ergibt $f'(x)=12x^2-10x+2$.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Die Potenzregel gilt für <b>jede<\/b> Hochzahl, auch für negative und gebrochene. Schreibe deshalb Wurzeln und Brüche zuerst um: $\\sqrt x=x^{\\frac12}$ und $\\dfrac{1}{x^2}=x^{-2}$. Danach ist es eine gewöhnliche Potenz.<\/div>\n<h3>Besondere Funktionen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>$f(x)$<\/th><th>$e^x$<\/th><th>$a^x$<\/th><th>$\\ln x$<\/th><th>$\\sin x$<\/th><th>$\\cos x$<\/th><\/tr><tr><td>$f'(x)$<\/td><td>$e^x$<\/td><td>$a^x\\cdot\\ln a$<\/td><td>$\\dfrac1x$<\/td><td>$\\cos x$<\/td><td>$-\\sin x$<\/td><\/tr><\/table><\/div>\n<p>Die Funktion $e^x$ ist ihre eigene Ableitung. Das macht die Zahl $e$ so besonders.<\/p>\n<h3>Produkt, Quotient, Verkettung<\/h3>\n<div class=\"formula\"><b>Produktregel:<\/b> $\\ (u\\cdot v)'=u'\\cdot v+u\\cdot v'$<\/div>\n<div class=\"formula\"><b>Quotientenregel:<\/b> $\\ \\left(\\dfrac{u}{v}\\right)'=\\dfrac{u'\\cdot v-u\\cdot v'}{v^2}$<\/div>\n<div class=\"formula\"><b>Kettenregel:<\/b> $\\ \\big(g(h(x))\\big)'=g'(h(x))\\cdot h'(x)$ — „äußere Ableitung mal innere Ableitung“<\/div>\n<p>Die Kettenregel brauchst du immer dann, wenn in einer Funktion etwas anderes als ein bloßes $x$ steckt: $(3x+1)^5$, $e^{-2x}$, $\\sin(4x)$, $\\ln(x^2+1)$.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Kettenregel<\/h4><div class=\"task\">Leite $f(x)=(3x^2+1)^4$ ab.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erkenne die Verkettung: Die innere Funktion ist $h(x)=3x^2+1$, die äußere ist „hoch 4“.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Äußere Ableitung: Hoch 4 wird zu $4\\cdot(\\dots)^3$. Das Innere bleibt dabei unverändert stehen: $4(3x^2+1)^3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Innere Ableitung: $h'(x)=6x$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Multiplizieren: $f'(x)=4(3x^2+1)^3\\cdot6x=24x(3x^2+1)^3$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Produktregel mit Kettenregel<\/h4><div class=\"task\">Leite $f(x)=x^2\\cdot e^{-3x}$ ab.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Es ist ein Produkt aus $u=x^2$ und $v=e^{-3x}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$u'=2x$. Für $v'$ brauchst du die Kettenregel: Die $e$-Funktion bleibt, die innere Ableitung von $-3x$ ist $-3$. Also $v'=-3e^{-3x}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Produktregel: $f'(x)=2x\\cdot e^{-3x}+x^2\\cdot(-3e^{-3x})$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>$e^{-3x}$ herausheben: $f'(x)=e^{-3x}\\cdot(2x-3x^2)$. Diese Form ist für das Suchen von Nullstellen am besten, weil $e^{-3x}$ nie 0 wird.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Bruch und Wurzel umschreiben<\/h4><div class=\"task\">Leite $f(x)=\\dfrac{4}{x^3}-6\\sqrt x$ ab.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Umschreiben als Potenzen: $f(x)=4x^{-3}-6x^{\\frac12}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Potenzregel: $f'(x)=4\\cdot(-3)x^{-4}-6\\cdot\\frac12x^{-\\frac12}=-12x^{-4}-3x^{-\\frac12}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>Zurück in Bruch- und Wurzelschreibweise: $f'(x)=-\\dfrac{12}{x^4}-\\dfrac{3}{\\sqrt x}$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Zwei Klassiker: Die Ableitung eines Produkts ist <b>nicht<\/b> das Produkt der Ableitungen. Und bei $e^{2x}$ fehlt oft die innere Ableitung, richtig ist $2e^{2x}$.<\/div>"},{"id":"kurvdisk","t":"Kurvendiskussion: Monotonie, Krümmung, Extrem- und Wendepunkte","kl":"7","k":7,"a":"A","tag":"M","goals":["mit der ersten Ableitung Monotonie und Extremstellen bestimmen","mit der zweiten Ableitung Krümmung und Wendestellen bestimmen","notwendige und hinreichende Bedingungen unterscheiden","Sattelpunkte erkennen und Wendetangenten aufstellen"],"ex":[{"type":"set","a":[-1.0,3.0],"q":"Bestimme die Stellen mit waagrechter Tangente von $f(x)=x^3-3x^2-9x+5$.","s":"$f'(x)=3x^2-6x-9=3(x^2-2x-3)=3(x-3)(x+1)$. Nullstellen: $-1$ und $3$."},{"type":"mc","q":"Was liegt bei $f(x)=x^3-3x^2-9x+5$ an der Stelle $x=3$ vor?","h":"Setze in die zweite Ableitung ein.","s":"$f''(x)=6x-6$, also $f''(3)=12>0$: Tiefpunkt. Bei $x=-1$ ist $f''(-1)=-12<0$, dort liegt der Hochpunkt.","o":["ein Tiefpunkt","ein Hochpunkt","ein Sattelpunkt","ein Wendepunkt"]},{"type":"num","a":1.0,"q":"Bestimme die Wendestelle von $f(x)=x^3-3x^2-9x+5$.","s":"$f''(x)=6x-6=0$ ergibt $x=1$. Bei Polynomfunktionen dritten Grades liegt die Wendestelle immer genau in der Mitte zwischen den beiden Extremstellen."},{"type":"num","a":-22.0,"q":"Berechne den Funktionswert des Tiefpunkts von $f(x)=x^3-3x^2-9x+5$.","s":"$f(3)=27-27-27+5=-22$."},{"type":"num","a":0.0,"q":"An welcher Stelle hat $f(x)=x^4-4x^3$ einen Sattelpunkt?","h":"Faktorisiere $f'$ und prüfe, wo kein Vorzeichenwechsel stattfindet.","s":"$f'(x)=4x^3-12x^2=4x^2(x-3)$. Bei $x=0$ ist der Faktor $x^2$ nie negativ, $f'$ wechselt dort das Vorzeichen nicht: Sattelpunkt. Bei $x=3$ wechselt $f'$ von $-$ nach $+$: Tiefpunkt."},{"type":"mc","q":"Für alle $x$ in einem Intervall gilt $f'(x)>0$. Was folgt daraus?","s":"Positive Steigung überall bedeutet: Der Graph steigt. Ob die Funktionswerte dabei positiv oder negativ sind, weiß man nicht.","o":["$f$ ist in diesem Intervall streng monoton steigend.","$f$ ist in diesem Intervall positiv.","$f$ ist in diesem Intervall linksgekrümmt.","$f$ hat in diesem Intervall eine Extremstelle."]},{"type":"mc","q":"Für alle $x$ in einem Intervall gilt $f''(x)<0$. Was folgt daraus?","s":"$f''$ ist die Ableitung von $f'$. Ist sie negativ, fällt $f'$, die Steigung wird also kleiner. Der Graph kann dabei trotzdem noch steigen, nur eben immer flacher.","o":["Der Graph ist dort rechtsgekrümmt, die Steigung nimmt ab.","Der Graph fällt dort.","Der Graph ist dort linksgekrümmt, die Steigung nimmt zu.","Der Graph liegt dort unter der $x$-Achse."]},{"type":"num","a":-3.0,"q":"Welche Steigung hat die Wendetangente von $f(x)=x^3-3x^2$?","s":"$f''(x)=6x-6=0$ ergibt die Wendestelle $x=1$. $f'(x)=3x^2-6x$, also $f'(1)=-3$."},{"type":"mc","q":"Der Graph von $f'$ schneidet die $x$-Achse an der Stelle 2 und wechselt dort von positiven zu negativen Werten. Was hat $f$ an der Stelle 2?","s":"Vor der Stelle 2 steigt $f$ (weil $f'>0$), danach fällt $f$. Das ist ein Hochpunkt.","o":["einen Hochpunkt","einen Tiefpunkt","eine Nullstelle","einen Wendepunkt"]}],"gen":["ext","tang"],"html":"<h3>Was die Ableitungen über den Graphen sagen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Ableitung<\/th><th>Vorzeichen<\/th><th>Bedeutung für den Graphen von $f$<\/th><\/tr><tr><td>$f'(x)$<\/td><td>positiv<\/td><td>$f$ steigt<\/td><\/tr><tr><td>$f'(x)$<\/td><td>negativ<\/td><td>$f$ fällt<\/td><\/tr><tr><td>$f''(x)$<\/td><td>positiv<\/td><td>linksgekrümmt (wie eine Schüssel), die Steigung nimmt zu<\/td><\/tr><tr><td>$f''(x)$<\/td><td>negativ<\/td><td>rechtsgekrümmt (wie ein Hügel), die Steigung nimmt ab<\/td><\/tr><\/table><\/div>\n<p>Eine Zusammenfassung dieser Zusammenhänge und eine vollständige Kurvendiskussion als Beispiel findest du auf der Seite zur Zentralmatura. Dieses Kapitel erklärt die Begründungen dahinter und die Sonderfälle, an denen man in Schularbeiten Punkte verliert.<\/p>\n<h3>Extremstellen: notwendig und hinreichend<\/h3>\n<p>An einem Hoch- oder Tiefpunkt (im Inneren des Definitionsbereichs) ist die Tangente waagrecht. Deshalb muss dort $f'(x_0)=0$ gelten. Das ist die <b>notwendige Bedingung<\/b>. Sie reicht aber nicht aus: Auch an einem Sattelpunkt ist die Tangente waagrecht.<\/p>\n<p>Erst eine <b>hinreichende Bedingung<\/b> entscheidet. Du hast zwei zur Auswahl:<\/p>\n<ul><li><b>Zweite Ableitung:<\/b> Ist $f'(x_0)=0$ und $f''(x_0)<0$, liegt ein Hochpunkt vor. Bei $f''(x_0)>0$ ein Tiefpunkt.<\/li><li><b>Vorzeichenwechsel:<\/b> Wechselt $f'$ bei $x_0$ von $+$ nach $-$, liegt ein Hochpunkt vor (erst steigend, dann fallend). Bei $-$ nach $+$ ein Tiefpunkt. Ohne Wechsel ist es ein Sattelpunkt.<\/li><\/ul>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Ist $f'(x_0)=0$ und auch $f''(x_0)=0$, sagt die zweite Ableitung <b>nichts<\/b> aus. Dann musst du den Vorzeichenwechsel von $f'$ prüfen. $f(x)=x^4$ hat bei 0 einen Tiefpunkt, obwohl $f''(0)=0$ ist.<\/div>\n<h3>Wendestellen<\/h3>\n<p>An einer Wendestelle wechselt die Krümmung. Dort ist die Steigung am größten oder am kleinsten. Die Bedingungen sind dieselben wie oben, nur eine Ableitung höher: $f''(x_0)=0$ ist notwendig, hinreichend ist zusätzlich $f'''(x_0)\\neq0$ oder ein Vorzeichenwechsel von $f''$.<\/p>\n<p>Ein <b>Sattelpunkt<\/b> ist ein Wendepunkt mit waagrechter Tangente: $f'(x_0)=0$ und $f''(x_0)=0$ mit Vorzeichenwechsel von $f''$.<\/p>\n[[plot:f=pow(x,4)/4-pow(x,3) | x=-2,5 | y=-8,6 | pts=0,0,Sattel/3,-6.75,T/2,-4,W | cap=f(x) = ¼x⁴ − x³: Sattelpunkt bei 0, Wendepunkt W bei 2, Tiefpunkt T bei 3]]\n<div class=\"walk\"><h4>Schritt für Schritt: Extremstellen mit Sattelpunkt<\/h4><div class=\"task\">Untersuche $f(x)=\\frac14x^4-x^3$ auf Extrem- und Wendepunkte.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Ableitungen: $f'(x)=x^3-3x^2$, $f''(x)=3x^2-6x$, $f'''(x)=6x-6$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Notwendige Bedingung für Extrema: $f'(x)=x^2(x-3)=0$ ergibt $x=0$ und $x=3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Prüfe $x=3$: $f''(3)=27-18=9>0$, also Tiefpunkt. $f(3)=20,25-27=-6,75$. Tiefpunkt $T=(3|-6,75)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Prüfe $x=0$: $f''(0)=0$. Keine Entscheidung möglich, also Vorzeichenwechsel von $f'$ prüfen. $f'(-1)=-4$ und $f'(1)=-2$. Beide negativ, kein Wechsel.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Bei $x=0$ liegt daher kein Extremum, sondern ein Sattelpunkt $(0|0)$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Wendestellen: $f''(x)=3x(x-2)=0$ ergibt $x=0$ und $x=2$. $f'''(0)=-6\\ne0$ und $f'''(2)=6\\ne0$. Beides sind Wendestellen. $f(2)=4-8=-4$, also $W=(2|-4)$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Vom Graphen von f′ auf f schließen<\/h3>\n<p>Sehr oft bekommst du den Graphen der Ableitung und sollst Aussagen über $f$ treffen. Übersetze dazu konsequent:<\/p>\n<ul><li>Nullstelle von $f'$ mit Vorzeichenwechsel: Extremstelle von $f$<\/li><li>$f'$ oberhalb der $x$-Achse: $f$ steigt dort<\/li><li>Extremstelle von $f'$: Wendestelle von $f$<\/li><li>$f'$ steigt: $f$ ist dort linksgekrümmt<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Wendetangente<\/h4><div class=\"task\">Bestimme die Gleichung der Wendetangente von $f(x)=x^3-6x^2+9x$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>$f'(x)=3x^2-12x+9$ und $f''(x)=6x-12$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Wendestelle: $6x-12=0$ ergibt $x=2$. ($f'''(x)=6\\ne0$, also wirklich eine Wendestelle.)<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Wendepunkt: $f(2)=8-24+18=2$, also $W=(2|2)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Steigung der Tangente: $k=f'(2)=12-24+9=-3$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Tangente $y=kx+d$ durch $W$: $2=-3\\cdot2+d$, also $d=8$. Wendetangente: $y=-3x+8$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"extremwert","t":"Extremwertaufgaben","kl":"7","k":7,"a":"A","tag":"S","goals":["eine Zielfunktion aus einem Sachtext aufstellen","Nebenbedingungen nutzen, um auf eine Variable zu kommen","das Maximum oder Minimum bestimmen und nachweisen","Randwerte und Definitionsbereich berücksichtigen"],"ex":[{"type":"num","a":100.0,"q":"Ein Rechteck hat 40 cm Umfang. Wie groß kann sein Flächeninhalt höchstens sein?","unit":"cm²","s":"$2a+2b=40$, also $b=20-a$. $A(a)=a(20-a)=20a-a^2$, $A'(a)=20-2a=0$ ergibt $a=10$. Das Rechteck ist ein Quadrat mit $A=100$ cm²."},{"type":"num","a":450.0,"q":"Mit 60 m Zaun wird ein rechteckiges Beet an einer Mauer abgegrenzt (drei Seiten). Wie groß ist die maximale Fläche?","unit":"m²","s":"$A(x)=x(60-2x)=60x-2x^2$, $A'(x)=60-4x=0$ ergibt $x=15$. $A=15\\cdot30=450$ m²."},{"type":"num","a":5.0,"q":"Aus einem quadratischen Karton mit 30 cm Seitenlänge werden an den Ecken Quadrate der Seitenlänge $x$ ausgeschnitten und die Ränder hochgeklappt. Für welches $x$ ist das Volumen der Schachtel am größten?","unit":"cm","h":"$V(x)=x(30-2x)^2$. Leite ab und faktorisiere.","s":"$V(x)=4x^3-120x^2+900x$, $V'(x)=12x^2-240x+900=12(x-5)(x-15)$. Nur $x=5$ liegt im Definitionsbereich $0<x<15$. $V''(5)=120-240<0$, also Maximum."},{"type":"num","a":36.0,"q":"Zwei positive Zahlen haben die Summe 12. Wie groß kann ihr Produkt höchstens sein?","s":"$P(x)=x(12-x)=12x-x^2$, $P'(x)=12-2x=0$ ergibt $x=6$. Beide Zahlen sind 6, das Produkt ist 36."},{"type":"num","a":5.42,"q":"Eine zylindrische Dose soll 1 000 cm³ fassen und möglichst wenig Blech verbrauchen (Boden, Deckel und Mantel). Welchen Radius muss sie haben (zwei Dezimalstellen)?","unit":"cm","h":"$O=2\\pi r^2+2\\pi rh$ und $h=\\dfrac{1000}{\\pi r^2}$.","s":"Einsetzen: $O(r)=2\\pi r^2+\\dfrac{2000}{r}$. $O'(r)=4\\pi r-\\dfrac{2000}{r^2}=0$ ergibt $r^3=\\dfrac{500}{\\pi}$, also $r\\approx5,42$ cm. Dann ist $h=2r$: Die Dose ist genauso hoch wie breit."},{"type":"num","a":40.0,"q":"Der Gewinn eines Betriebs beträgt $G(x)=-0,5x^2+40x-300$ (in €, $x$ in Stück). Bei welcher Stückzahl ist der Gewinn am größten?","unit":"Stück","s":"$G'(x)=-x+40=0$ ergibt $x=40$. $G''(x)=-1<0$, also Maximum. Der maximale Gewinn ist $G(40)=500$ €."},{"type":"num","a":32.0,"q":"Ein Rechteck liegt mit einer Seite auf der $x$-Achse, die beiden oberen Ecken liegen auf der Parabel $y=12-x^2$. Wie groß kann sein Flächeninhalt höchstens sein?","h":"Die Ecken liegen bei $-x$ und $x$. Die Breite ist $2x$, die Höhe $12-x^2$.","s":"$A(x)=2x(12-x^2)=24x-2x^3$. $A'(x)=24-6x^2=0$ ergibt $x=2$. $A(2)=4\\cdot8=32$."},{"type":"mc","q":"Warum muss man bei Extremwertaufgaben auch die Ränder des Definitionsbereichs beachten?","s":"$f'(x)=0$ findet nur Stellen mit waagrechter Tangente im Inneren. Ein Graph, der bis zum Rand hin steigt, hat seinen größten Wert am Rand.","o":["Weil der größte Wert auch am Rand liegen kann, wo die Ableitung nicht 0 ist.","Weil die erste Ableitung an den Rändern immer 0 ist.","Weil die Funktion an den Rändern des Intervalls nicht definiert ist.","Weil an den Rändern stets das Minimum zu finden ist."]}],"gen":[],"html":"<h3>Das Schema<\/h3>\n<p>Bei Extremwertaufgaben soll etwas möglichst groß oder möglichst klein werden: eine Fläche, ein Volumen, die Kosten, der Materialverbrauch. Der Rechenteil ist immer derselbe. Die eigentliche Arbeit ist das Aufstellen der Funktion.<\/p>\n<ul><li><b>Skizze und Variablen:<\/b> Zeichne die Situation und benenne alle Größen.<\/li><li><b>Zielfunktion (Hauptbedingung):<\/b> Schreibe die Größe auf, die extrem werden soll. Sie hängt meist noch von zwei Variablen ab.<\/li><li><b>Nebenbedingung:<\/b> Finde im Text die Einschränkung, die die Variablen verknüpft, und löse sie nach einer Variablen auf.<\/li><li><b>Einsetzen:<\/b> Jetzt hängt die Zielfunktion nur noch von einer Variablen ab. Gib den sinnvollen Definitionsbereich an.<\/li><li><b>Ableiten und null setzen<\/b>, dann mit der zweiten Ableitung nachweisen, dass es das gewünschte Extremum ist.<\/li><li><b>Antwort:<\/b> Beantworte die Frage im Sachzusammenhang, mit allen gesuchten Größen und Einheiten.<\/li><\/ul>\n<div class=\"walk\"><h4>Schritt für Schritt: Größte Fläche bei festem Zaun<\/h4><div class=\"task\">Mit 80 m Zaun soll ein rechteckiges Gehege abgegrenzt werden, das an eine Hauswand grenzt. An der Wand braucht man keinen Zaun. Wie müssen die Seiten gewählt werden, damit die Fläche möglichst groß ist?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Skizze: Zwei Seiten der Länge $x$ stehen normal zur Wand, eine Seite der Länge $y$ ist parallel zur Wand.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zielfunktion: $A=x\\cdot y$ soll maximal werden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Nebenbedingung: Der Zaun ist 80 m lang, also $2x+y=80$. Daraus $y=80-2x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Einsetzen: $A(x)=x(80-2x)=80x-2x^2$ mit $0<x<40$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Ableiten und null setzen: $A'(x)=80-4x=0$ ergibt $x=20$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Nachweis: $A''(x)=-4<0$, also ein Maximum.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Antwort: $x=20$ m, $y=80-40=40$ m, größte Fläche $800$ m². Die Seite parallel zur Wand ist doppelt so lang wie die anderen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Schachtel mit größtem Volumen<\/h4><div class=\"task\">Aus einem quadratischen Karton mit 24 cm Seitenlänge werden an den Ecken Quadrate der Seitenlänge $x$ ausgeschnitten. Die Ränder werden hochgeklappt. Für welches $x$ hat die offene Schachtel das größte Volumen?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die Grundfläche ist ein Quadrat mit der Seite $24-2x$, die Höhe ist $x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zielfunktion: $V(x)=x(24-2x)^2$ mit $0<x<12$. Hier ist die Nebenbedingung schon eingebaut.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Ausmultiplizieren: $V(x)=x(576-96x+4x^2)=4x^3-96x^2+576x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ableiten: $V'(x)=12x^2-192x+576=12(x^2-16x+48)=12(x-4)(x-12)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Nullstellen: $x=4$ und $x=12$. Bei $x=12$ bliebe keine Grundfläche übrig, dieser Wert liegt nicht im Definitionsbereich.<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Nachweis: $V''(x)=24x-192$, $V''(4)=-96<0$, also ein Maximum.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Antwort: $x=4$ cm. Das Volumen beträgt dann $4\\cdot16^2=1024$ cm³.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Liegt die Lösung von $f'(x)=0$ nicht im Definitionsbereich, oder gibt es gar keine, dann liegt das Extremum am <b>Rand<\/b>. Vergleiche in solchen Fällen die Funktionswerte an den Randstellen.<\/div>"},{"id":"umkehr","t":"Umkehraufgaben: Funktionen aus Bedingungen bestimmen","kl":"7","k":7,"a":"A","tag":"S","goals":["Aussagen über einen Graphen in Gleichungen für f, f′ und f″ übersetzen","den passenden Ansatz für den Funktionsterm wählen","das entstehende Gleichungssystem lösen","das Ergebnis überprüfen"],"ex":[{"type":"mc","q":"Welche Gleichungen folgen aus „Der Graph hat den Hochpunkt $H=(2|5)$“?","s":"Der Punkt liegt auf dem Graphen ($f(2)=5$), und an einer Extremstelle ist die Tangente waagrecht ($f'(2)=0$).","o":["$f(2)=5$ und $f'(2)=0$","$f(2)=5$ und $f''(2)=0$","$f(5)=2$ und $f'(5)=0$","$f'(2)=5$"]},{"type":"mc","q":"Welche Gleichungen folgen aus „An der Wendestelle 1 hat die Wendetangente die Steigung $-3$“?","s":"Wendestelle bedeutet $f''(1)=0$. Die Steigung der Tangente ist der Wert der ersten Ableitung: $f'(1)=-3$.","o":["$f''(1)=0$ und $f'(1)=-3$","$f'(1)=0$ und $f''(1)=-3$","$f(1)=-3$ und $f''(1)=0$","$f''(1)=-3$"]},{"type":"list","a":[1.0,-4.0,1.0],"q":"Eine Parabel $f(x)=ax^2+bx+c$ geht durch $(0|1)$ und hat den Scheitel $(2|-3)$. Gib $a; b; c$ an.","h":"Der Scheitel liefert zwei Bedingungen: $f(2)=-3$ und $f'(2)=0$.","s":"$c=1$. $f'(2)=4a+b=0$, also $b=-4a$. $f(2)=4a+2b+1=-3$ ergibt $4a-8a=-4$, also $a=1$ und $b=-4$."},{"type":"list","a":[1.0,-3.0],"q":"Eine Funktion $f(x)=ax^3+bx$ geht durch $(1|-2)$ und hat bei $x=1$ eine Extremstelle. Gib $a; b$ an.","s":"$f(1)=a+b=-2$ und $f'(1)=3a+b=0$. Subtrahieren: $2a=2$, also $a=1$ und $b=-3$."},{"type":"num","a":4.0,"q":"Wie viele Bedingungen braucht man, um eine Polynomfunktion dritten Grades eindeutig festzulegen?","s":"Der Ansatz $ax^3+bx^2+cx+d$ hat vier Unbekannte, also braucht man vier Gleichungen."},{"type":"list","a":[-2.0,3.0,2.0],"q":"Für $f(x)=ax^2+bx+c$ gilt $f(0)=2$, $f'(0)=3$ und $f''(0)=-4$. Gib $a; b; c$ an.","s":"$f(0)=c=2$. $f'(x)=2ax+b$, also $f'(0)=b=3$. $f''(x)=2a=-4$, also $a=-2$."},{"type":"mc","q":"Welche Gleichungen folgen aus „Der Graph berührt die $x$-Achse an der Stelle 3“?","s":"Berühren heißt: Der Punkt liegt auf der Achse ($f(3)=0$), und der Graph hat dort dieselbe Steigung wie die Achse, nämlich 0.","o":["$f(3)=0$ und $f'(3)=0$","$f(3)=0$ und $f''(3)=0$","nur $f(3)=0$","nur $f'(3)=0$"]}],"gen":[],"html":"<h3>Die Idee<\/h3>\n<p>Bei der Kurvendiskussion ist der Term gegeben und die Eigenschaften sind gesucht. Hier ist es umgekehrt: Du kennst Eigenschaften und suchst den Term. Dazu setzt du die Funktion mit unbekannten Koeffizienten an und stellst für jede Eigenschaft eine Gleichung auf.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Grad<\/th><th>Ansatz<\/th><th>Anzahl der nötigen Bedingungen<\/th><\/tr><tr><td>2<\/td><td>$f(x)=ax^2+bx+c$<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>$f(x)=ax^3+bx^2+cx+d$<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>$f(x)=ax^4+bx^3+cx^2+dx+e$<\/td><td>5<\/td><\/tr><\/table><\/div>\n<p>Symmetrie spart Arbeit: Ist der Graph symmetrisch zur $y$-Achse, kommen nur gerade Hochzahlen vor. Ist er punktsymmetrisch zum Ursprung, nur ungerade.<\/p>\n<h3>Das Wörterbuch<\/h3>\n<p>Jede Formulierung im Text entspricht einer oder zwei Gleichungen. Diese Übersetzungen musst du sicher beherrschen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Im Text steht<\/th><th>Gleichung(en)<\/th><\/tr><tr><td>geht durch den Punkt $(2\\mid5)$<\/td><td>$f(2)=5$<\/td><\/tr><tr><td>hat bei $x=2$ eine Nullstelle<\/td><td>$f(2)=0$<\/td><\/tr><tr><td>hat an der Stelle 2 die Steigung 4<\/td><td>$f'(2)=4$<\/td><\/tr><tr><td>hat den Hochpunkt $(2\\mid5)$<\/td><td>$f(2)=5$ <b>und<\/b> $f'(2)=0$<\/td><\/tr><tr><td>hat den Wendepunkt $(2\\mid5)$<\/td><td>$f(2)=5$ <b>und<\/b> $f''(2)=0$<\/td><\/tr><tr><td>hat bei $x=2$ einen Sattelpunkt<\/td><td>$f'(2)=0$ <b>und<\/b> $f''(2)=0$<\/td><\/tr><tr><td>berührt die $x$-Achse bei $x=2$<\/td><td>$f(2)=0$ <b>und<\/b> $f'(2)=0$<\/td><\/tr><tr><td>Tangente bei $x=2$ ist parallel zu $y=3x+1$<\/td><td>$f'(2)=3$<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Ein Punkt wie „Hochpunkt $(2|5)$“ liefert <b>zwei<\/b> Bedingungen, eine für den Funktionswert und eine für die Ableitung. Wer nur eine verwendet, hat am Ende zu wenige Gleichungen.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Funktion dritten Grades bestimmen<\/h4><div class=\"task\">Der Graph einer Polynomfunktion dritten Grades geht durch den Ursprung, hat dort die Steigung 9 und besitzt den Wendepunkt $W=(2|2)$. Bestimme den Funktionsterm.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Ansatz und Ableitungen: $f(x)=ax^3+bx^2+cx+d$, $f'(x)=3ax^2+2bx+c$, $f''(x)=6ax+2b$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Bedingungen übersetzen. Durch den Ursprung: $f(0)=0$. Steigung 9 im Ursprung: $f'(0)=9$. Wendepunkt $(2|2)$: $f(2)=2$ und $f''(2)=0$. Das sind vier Bedingungen, wie verlangt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die ersten beiden liefern sofort: $d=0$ und $c=9$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$f''(2)=0$: $12a+2b=0$, also $b=-6a$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>$f(2)=2$: $8a+4b+2\\cdot9=2$, also $8a+4b=-16$. Mit $b=-6a$: $8a-24a=-16$, also $a=1$ und $b=-6$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Ergebnis: $f(x)=x^3-6x^2+9x$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Probe: $f(2)=8-24+18=2$, $f'(0)=9$, $f''(2)=12-12=0$. Alles erfüllt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Symmetrie ausnutzen<\/h4><div class=\"task\">Eine Polynomfunktion vierten Grades ist symmetrisch zur $y$-Achse, geht durch $(0|3)$ und hat den Tiefpunkt $(2|-5)$. Bestimme den Term.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Wegen der Symmetrie nur gerade Hochzahlen: $f(x)=ax^4+bx^2+c$. Nur drei Unbekannte statt fünf.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$f(0)=3$ ergibt $c=3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Tiefpunkt $(2|-5)$: $f(2)=-5$ ergibt $16a+4b+3=-5$, also $16a+4b=-8$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$f'(x)=4ax^3+2bx$ und $f'(2)=0$ ergibt $32a+4b=0$, also $b=-8a$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Einsetzen: $16a-32a=-8$, also $a=0,5$ und $b=-4$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Ergebnis: $f(x)=0,5x^4-4x^2+3$. Kontrolle: $f''(x)=6x^2-8$ und $f''(2)=16>0$, es ist wirklich ein Tiefpunkt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"stamm","t":"Stammfunktionen und Integrationsregeln","kl":"8","k":8,"a":"A","tag":"M","goals":["Stammfunktionen von Potenz-, Exponential- und Winkelfunktionen angeben","verstehen, warum es unendlich viele Stammfunktionen gibt","die Konstante aus einer Zusatzbedingung bestimmen","Funktionen mit linearem Inneren integrieren"],"ex":[{"type":"num","a":14.0,"q":"$F$ ist die Stammfunktion von $f(x)=6x^2-4x+1$ mit $F(1)=5$. Berechne $F(2)$.","s":"$F(x)=2x^3-2x^2+x+C$. $F(1)=1+C=5$ ergibt $C=4$. $F(2)=16-8+2+4=14$."},{"type":"mc","q":"Was ergibt $\\displaystyle\\int\\dfrac{1}{x^2}\\,dx$?","h":"Schreibe $x^{-2}$ und wende die Potenzregel an.","s":"$\\dfrac{x^{-1}}{-1}=-\\dfrac1x$. Die Antwort $-\\frac{2}{x^3}$ wäre die Ableitung, nicht die Stammfunktion. Der Logarithmus gehört nur zu $\\frac1x$.","o":["$-\\dfrac1x+C$","$\\ln(x^2)+C$","$\\dfrac{1}{x}+C$","$-\\dfrac{2}{x^3}+C$"]},{"type":"mc","q":"Was ergibt $\\displaystyle\\int e^{3x}\\,dx$?","s":"Lineares Inneres mit $a=3$: durch 3 dividieren. Probe: Die Ableitung von $\\frac13e^{3x}$ ist $\\frac13\\cdot3e^{3x}=e^{3x}$.","o":["$\\dfrac13e^{3x}+C$","$3e^{3x}+C$","$e^{3x}+C$","$\\dfrac{e^{3x+1}}{3x+1}+C$"]},{"type":"mc","q":"Was ergibt $\\displaystyle\\int\\cos(2x)\\,dx$?","s":"Die Stammfunktion von Cosinus ist Sinus (ohne Minus), und wegen des linearen Inneren wird durch 2 dividiert.","o":["$\\dfrac12\\sin(2x)+C$","$2\\sin(2x)+C$","$-\\dfrac12\\sin(2x)+C$","$\\sin(2x)+C$"]},{"type":"num","a":0.125,"q":"Bestimme die Stammfunktion von $f(x)=(2x+1)^3$ mit $C=0$ und berechne ihren Wert an der Stelle 0.","s":"$F(x)=\\dfrac12\\cdot\\dfrac{(2x+1)^4}{4}=\\dfrac{(2x+1)^4}{8}$. $F(0)=\\dfrac18=0,125$."},{"type":"num","a":18.0,"q":"Bestimme die Stammfunktion von $f(x)=\\sqrt x$ mit $C=0$ und berechne ihren Wert an der Stelle 9.","h":"$\\sqrt x=x^{\\frac12}$","s":"$F(x)=\\dfrac{x^{\\frac32}}{\\frac32}=\\dfrac23x^{\\frac32}$. $F(9)=\\dfrac23\\cdot27=18$, denn $9^{\\frac32}=(\\sqrt9)^3=27$."},{"type":"mc","q":"$f$ hat an der Stelle 4 eine Nullstelle und wechselt dort von positiven zu negativen Werten. Was hat eine Stammfunktion $F$ an der Stelle 4?","s":"$f$ ist die Ableitung von $F$. Vor der Stelle 4 steigt $F$, danach fällt $F$: Hochpunkt.","o":["einen Hochpunkt","einen Tiefpunkt","eine Nullstelle","einen Wendepunkt"]},{"type":"mc","q":"Was ergibt $\\displaystyle\\int\\dfrac{3}{x}\\,dx$?","s":"Der Faktor 3 bleibt stehen, und $\\frac1x$ hat die Stammfunktion $\\ln|x|$. Die Potenzregel versagt hier, weil sie eine Division durch 0 ergäbe.","o":["$3\\ln\\lvert x\\rvert+C$","$-\\dfrac{3}{x^2}+C$","$\\ln\\lvert3x\\rvert+C$","$\\dfrac{3}{2}x^{-2}+C$"]}],"gen":[],"html":"<h3>Ableiten rückwärts<\/h3>\n<p>Eine Funktion $F$ heißt <b>Stammfunktion<\/b> von $f$, wenn $F'(x)=f(x)$ gilt. Integrieren ist also die Umkehrung des Ableitens. Weil eine Konstante beim Ableiten wegfällt, ist mit $F$ auch $F+C$ eine Stammfunktion, für jede Zahl $C$. Die Gesamtheit aller Stammfunktionen heißt <b>unbestimmtes Integral<\/b>:<\/p>\n<div class=\"formula\">$\\displaystyle\\int f(x)\\,dx=F(x)+C$<\/div>\n<p>Geometrisch sind alle Stammfunktionen einer Funktion nach oben oder unten verschobene Kopien voneinander.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>$f(x)$<\/th><th>Stammfunktion $F(x)$<\/th><th>Hinweis<\/th><\/tr><tr><td>$x^n$<\/td><td>$\\dfrac{x^{n+1}}{n+1}$<\/td><td>gilt für $n\\neq-1$: Hochzahl um 1 erhöhen, durch die neue Hochzahl dividieren<\/td><\/tr><tr><td>$\\dfrac1x$<\/td><td>$\\ln\\lvert x\\rvert$<\/td><td>der Sonderfall $n=-1$<\/td><\/tr><tr><td>$e^x$<\/td><td>$e^x$<\/td><td><\/td><\/tr><tr><td>$\\sin x$<\/td><td>$-\\cos x$<\/td><td>Vorzeichen beachten<\/td><\/tr><tr><td>$\\cos x$<\/td><td>$\\sin x$<\/td><td><\/td><\/tr><\/table><\/div>\n<p>Faktor- und Summenregel gelten wie beim Ableiten: Konstante Faktoren bleiben stehen, Summen werden gliedweise integriert. Für Produkte und Quotienten gibt es dagegen <b>keine<\/b> einfache Regel.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Jede Stammfunktion lässt sich in zehn Sekunden überprüfen: Leite dein Ergebnis ab. Es muss wieder die Ausgangsfunktion herauskommen.<\/div>\n<h3>Lineares Inneres<\/h3>\n<p>Steht im Inneren ein linearer Ausdruck $ax+b$, integrierst du die äußere Funktion wie gewohnt und <b>dividierst<\/b> durch $a$. Das gleicht die innere Ableitung aus, die beim Ableiten als Faktor entstehen würde.<\/p>\n<div class=\"formula\">$\\displaystyle\\int f(ax+b)\\,dx=\\dfrac{1}{a}\\cdot F(ax+b)+C$<\/div>\n<p>Beispiele: $\\displaystyle\\int e^{4x}\\,dx=\\tfrac14e^{4x}+C$ und $\\displaystyle\\int\\sin(2x)\\,dx=-\\tfrac12\\cos(2x)+C$.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Diese Regel gilt nur für <b>lineares<\/b> Inneres. Bei $e^{x^2}$ oder $(x^2+1)^3$ darfst du nicht einfach durch die innere Ableitung dividieren.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Stammfunktion mit Zusatzbedingung<\/h4><div class=\"task\">Bestimme die Stammfunktion $F$ von $f(x)=6x^2-\\dfrac{4}{x^2}+3$, deren Graph durch den Punkt $(1|4)$ geht.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Schreibe den Bruch als Potenz: $f(x)=6x^2-4x^{-2}+3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gliedweise integrieren: $6\\cdot\\dfrac{x^3}{3}=2x^3$. Dann $-4\\cdot\\dfrac{x^{-1}}{-1}=4x^{-1}=\\dfrac4x$. Und $3$ wird zu $3x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Alle Stammfunktionen: $F(x)=2x^3+\\dfrac4x+3x+C$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Bedingung $F(1)=4$ einsetzen: $2+4+3+C=4$, also $C=-5$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Ergebnis: $F(x)=2x^3+\\dfrac4x+3x-5$. Kontrolle durch Ableiten: $6x^2-\\dfrac{4}{x^2}+3$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Der Zusammenhang der Graphen<\/h3>\n<p>Weil $F'=f$ gilt, sagt dir der Graph von $f$, wie $F$ verläuft. Das ist dieselbe Übersetzung wie zwischen $f'$ und $f$:<\/p>\n<ul><li>$f$ positiv: $F$ steigt<\/li><li>Nullstelle von $f$ mit Vorzeichenwechsel von $+$ nach $-$: $F$ hat dort einen Hochpunkt<\/li><li>Extremstelle von $f$: $F$ hat dort eine Wendestelle<\/li><\/ul>"},{"id":"bestint","t":"Das bestimmte Integral und Flächenberechnung","kl":"8","k":8,"a":"A","tag":"M","goals":["bestimmte Integrale mit dem Hauptsatz berechnen","die Rechenregeln für Integrale anwenden","Flächen zwischen Graph und x-Achse sowie zwischen zwei Graphen berechnen","den Mittelwert einer Funktion bestimmen"],"ex":[{"type":"num","a":10.0,"q":"Berechne $\\displaystyle\\int_1^3(2x+1)\\,dx$.","s":"$\\big[x^2+x\\big]_1^3=(9+3)-(1+1)=10$."},{"type":"num","a":2.0,"q":"Berechne $\\displaystyle\\int_0^{\\pi}\\sin(x)\\,dx$.","s":"$\\big[-\\cos x\\big]_0^{\\pi}=-\\cos\\pi-(-\\cos0)=1+1=2$."},{"type":"num","a":0.0,"q":"Berechne $\\displaystyle\\int_0^3(x^2-2x)\\,dx$.","s":"$\\left[\\dfrac{x^3}{3}-x^2\\right]_0^3=9-9=0$. Das bedeutet nicht, dass keine Fläche da ist. Die Teile über und unter der Achse heben einander auf."},{"type":"num","a":2.6666666666666665,"q":"Berechne den Inhalt der Fläche zwischen dem Graphen von $f(x)=x^2-2x$ und der $x$-Achse im Intervall $[0;3]$ (zwei Dezimalstellen oder als Bruch).","h":"Die Nullstelle 2 teilt das Intervall.","s":"$\\displaystyle\\int_0^2f=\\frac83-4=-\\frac43$ und $\\displaystyle\\int_2^3f=0-\\left(-\\frac43\\right)=\\frac43$. Fläche: $\\frac43+\\frac43=\\frac83\\approx2,67$."},{"type":"num","a":4.5,"q":"Berechne den Inhalt der Fläche, die von $f(x)=x^2$ und $g(x)=x+2$ eingeschlossen wird.","s":"Schnittstellen: $x^2-x-2=0$, also $-1$ und $2$. Oben liegt $g$. $\\displaystyle\\int_{-1}^2(x+2-x^2)\\,dx=\\left[\\frac{x^2}{2}+2x-\\frac{x^3}{3}\\right]_{-1}^2=\\frac{10}{3}-\\left(-\\frac76\\right)=4,5$."},{"type":"num","a":3.19,"q":"Berechne $\\displaystyle\\int_0^1e^{2x}\\,dx$ (zwei Dezimalstellen).","s":"$\\left[\\dfrac12e^{2x}\\right]_0^1=\\dfrac{e^2-1}{2}\\approx3,19$."},{"type":"num","a":3.0,"q":"Für welche positive Zahl $b$ gilt $\\displaystyle\\int_0^b2x\\,dx=9$?","s":"$\\big[x^2\\big]_0^b=b^2=9$, also $b=3$."},{"type":"num","a":3.0,"q":"Berechne den Mittelwert von $f(x)=x^2$ im Intervall $[0;3]$.","s":"$\\dfrac{1}{3}\\displaystyle\\int_0^3x^2\\,dx=\\dfrac13\\cdot9=3$."},{"type":"mc","q":"Welche Regel gilt für jede integrierbare Funktion?","s":"Vertauschen der Grenzen dreht das Vorzeichen um, weil aus $F(b)-F(a)$ dann $F(a)-F(b)$ wird. Im Hauptsatz steht die Stammfunktion $F$ und nicht $f$ selbst.","o":["$\\displaystyle\\int_a^bf(x)\\,dx=-\\int_b^af(x)\\,dx$","$\\displaystyle\\int_a^bf(x)\\,dx=\\int_b^af(x)\\,dx$","$\\displaystyle\\int_a^bf(x)\\,dx=f(b)-f(a)$","$\\displaystyle\\int_a^bf(x)\\,dx\\ge0$"]}],"gen":["int","flaeche"],"html":"<h3>Vom Summieren zum Integral<\/h3>\n<p>Das bestimmte Integral $\\displaystyle\\int_a^bf(x)\\,dx$ entsteht als Grenzwert von Summen: Man zerlegt das Intervall in viele schmale Streifen, multipliziert jeweils Breite mal Funktionswert und addiert. Je feiner die Zerlegung, desto genauer das Ergebnis. Auf der Seite zur Zentralmatura kannst du das in einem Labor ausprobieren.<\/p>\n<p>Zum Rechnen verwendet man den <b>Hauptsatz der Differential- und Integralrechnung<\/b>:<\/p>\n<div class=\"formula\">$\\displaystyle\\int_a^bf(x)\\,dx=F(b)-F(a)\\qquad\\text{kurz geschrieben}\\quad\\big[F(x)\\big]_a^b$<\/div>\n<p>Stammfunktion bilden, obere Grenze einsetzen, untere Grenze einsetzen, subtrahieren. Die Konstante $C$ fällt dabei weg, du brauchst sie hier nicht.<\/p>\n<h3>Rechenregeln<\/h3>\n<ul><li>Grenzen vertauschen ändert das Vorzeichen: $\\displaystyle\\int_a^bf=-\\int_b^af$<\/li><li>Intervalle lassen sich zusammensetzen: $\\displaystyle\\int_a^bf+\\int_b^cf=\\int_a^cf$<\/li><li>Faktoren und Summen dürfen herausgezogen werden, wie beim unbestimmten Integral.<\/li><\/ul>\n<h3>Integral und Flächeninhalt<\/h3>\n<p>Das Integral zählt Flächen <b>über<\/b> der $x$-Achse positiv und Flächen <b>unter<\/b> der $x$-Achse negativ. Es liefert also eine Bilanz. Warum das eine berüchtigte Falle ist, steht auf der Seite zur Zentralmatura. Für den tatsächlichen Flächeninhalt gehst du so vor: Nullstellen im Intervall suchen, von Nullstelle zu Nullstelle einzeln integrieren und die <b>Beträge<\/b> addieren.<\/p>\n<h3>Fläche zwischen zwei Graphen<\/h3>\n<div class=\"formula\">$A=\\displaystyle\\int_a^b\\big(f(x)-g(x)\\big)\\,dx\\qquad\\text{wenn }f\\text{ im ganzen Intervall oberhalb von }g\\text{ liegt}$<\/div>\n<p>Die Grenzen sind meist die Schnittstellen der beiden Graphen. Ob die Fläche über oder unter der $x$-Achse liegt, spielt hier keine Rolle. Entscheidend ist nur, welche Funktion oben liegt.<\/p>\n[[plot:f=4-x*x;;x+2 | x=-3,3 | y=-2,5 | area=-2,1 | pts=-2,0/1,3 | cap=Fläche zwischen f(x) = 4 − x² und g(x) = x + 2]]\n<div class=\"walk\"><h4>Schritt für Schritt: Fläche zwischen zwei Graphen<\/h4><div class=\"task\">Berechne den Inhalt der Fläche, die von $f(x)=4-x^2$ und $g(x)=x+2$ eingeschlossen wird.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Schnittstellen: $4-x^2=x+2$, also $x^2+x-2=0$ mit den Lösungen $x=-2$ und $x=1$. Das sind die Grenzen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Welche Funktion liegt oben? Testwert $x=0$: $f(0)=4$ und $g(0)=2$. Also liegt $f$ oben.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Differenzfunktion: $f(x)-g(x)=4-x^2-x-2=-x^2-x+2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Stammfunktion: $D(x)=-\\dfrac{x^3}{3}-\\dfrac{x^2}{2}+2x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Einsetzen: $D(1)=-\\frac13-\\frac12+2=\\frac76$ und $D(-2)=\\frac83-2-4=-\\frac{10}{3}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>$A=D(1)-D(-2)=\\dfrac76+\\dfrac{10}{3}=\\dfrac{27}{6}=4,5$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Fläche mit Vorzeichenwechsel<\/h4><div class=\"task\">Berechne den Inhalt der Fläche zwischen dem Graphen von $f(x)=x^2-4x+3$ und der $x$-Achse im Intervall $[0;3]$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Nullstellen: $x^2-4x+3=(x-1)(x-3)=0$, also $x=1$ und $x=3$. Die Stelle 1 liegt im Inneren des Intervalls, dort muss geteilt werden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Stammfunktion: $F(x)=\\dfrac{x^3}{3}-2x^2+3x$ mit $F(0)=0$, $F(1)=\\frac43$ und $F(3)=9-18+9=0$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Erstes Teilstück: $\\displaystyle\\int_0^1f=F(1)-F(0)=\\frac43$. Positiv, die Fläche liegt über der Achse.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zweites Teilstück: $\\displaystyle\\int_1^3f=F(3)-F(1)=-\\frac43$. Negativ, die Fläche liegt unter der Achse.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Flächeninhalt: $\\frac43+\\left|-\\frac43\\right|=\\frac83\\approx2,67$. Das Integral über das ganze Intervall wäre dagegen 0.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Der Mittelwert einer Funktion<\/h3>\n<div class=\"formula\">$\\bar f=\\dfrac{1}{b-a}\\displaystyle\\int_a^bf(x)\\,dx$<\/div>\n<p>Das ist die Höhe eines Rechtecks über $[a;b]$, das denselben (orientierten) Flächeninhalt hat wie die Fläche unter dem Graphen. Anwendung: die Durchschnittstemperatur eines Tages aus der Temperaturkurve.<\/p>"},{"id":"intanw","t":"Anwendungen der Integralrechnung","kl":"8","k":8,"a":"A","tag":"M","goals":["das Integral einer Änderungsrate als Gesamtänderung deuten","Wege aus Geschwindigkeiten und Arbeit aus Kräften berechnen","Volumen von Rotationskörpern bestimmen","Ergebnisse mit der richtigen Einheit angeben"],"ex":[{"type":"num","a":25.13,"q":"Die Fläche unter $f(x)=\\sqrt x$ im Intervall $[0;4]$ dreht sich um die $x$-Achse. Berechne das Volumen (zwei Dezimalstellen).","s":"$V=\\pi\\displaystyle\\int_0^4x\\,dx=\\pi\\cdot\\left[\\frac{x^2}{2}\\right]_0^4=8\\pi\\approx25,13$."},{"type":"num","a":20.11,"q":"Die Fläche unter $f(x)=x^2$ im Intervall $[0;2]$ dreht sich um die $x$-Achse. Berechne das Volumen (zwei Dezimalstellen).","s":"$V=\\pi\\displaystyle\\int_0^2x^4\\,dx=\\pi\\cdot\\frac{32}{5}\\approx20,11$."},{"type":"num","a":56.55,"q":"Die Gerade $y=0,5x$ dreht sich im Intervall $[0;6]$ um die $x$-Achse. Berechne das Volumen des entstehenden Kegels (zwei Dezimalstellen).","s":"$V=\\pi\\displaystyle\\int_0^60,25x^2\\,dx=\\pi\\cdot0,25\\cdot\\frac{216}{3}=18\\pi\\approx56,55$. Kontrolle mit der Kegelformel: $r=3$, $h=6$, $V=\\frac13\\pi\\cdot9\\cdot6=18\\pi$."},{"type":"num","a":12.0,"q":"Für die Geschwindigkeit gilt $v(t)=3t^2+2$ (in m/s). Welchen Weg legt der Körper in den ersten 2 Sekunden zurück?","unit":"m","s":"$\\displaystyle\\int_0^2(3t^2+2)\\,dt=\\big[t^3+2t\\big]_0^2=8+4=12$ m. Die Geschwindigkeit ist immer positiv, Ortsänderung und Weg sind hier gleich."},{"type":"num","a":18.0,"q":"Eine Feder wird mit der Kraft $F(s)=4s$ (in N, $s$ in m) gedehnt. Welche Arbeit ist nötig, um sie von 0 auf 3 m zu dehnen?","unit":"J","s":"$W=\\displaystyle\\int_0^34s\\,ds=\\big[2s^2\\big]_0^3=18$ J."},{"type":"num","a":9.0,"q":"In ein Becken fließt Wasser mit der Rate $z(t)=6-2t$ (in l/min). Um wie viele Liter ändert sich der Inhalt in den ersten 3 Minuten?","unit":"Liter","s":"$\\displaystyle\\int_0^3(6-2t)\\,dt=\\big[6t-t^2\\big]_0^3=18-9=9$ Liter."},{"type":"mc","q":"Die Geschwindigkeit $v(t)$ eines Fahrzeugs ist im Intervall $[0;10]$ teils positiv, teils negativ. Was gibt $\\displaystyle\\int_0^{10}v(t)\\,dt$ an?","s":"Vorwärts und rückwärts gefahrene Strecken werden gegeneinander aufgerechnet. Für den zurückgelegten Weg müsste man $|v(t)|$ integrieren.","o":["die Ortsänderung zwischen Anfang und Ende","den insgesamt zurückgelegten Weg","die mittlere Geschwindigkeit","die Beschleunigung am Ende"]},{"type":"num","tol":0.03,"a":113.1,"q":"Der Halbkreis $y=\\sqrt{9-x^2}$ dreht sich um die $x$-Achse. Berechne das Volumen der entstehenden Kugel (zwei Dezimalstellen).","h":"Die Grenzen sind $-3$ und $3$.","s":"$V=\\pi\\displaystyle\\int_{-3}^3(9-x^2)\\,dx=\\pi\\left[9x-\\frac{x^3}{3}\\right]_{-3}^3=\\pi\\cdot(18-(-18))=36\\pi\\approx113,10$. Das stimmt mit $\\frac43\\pi r^3$ für $r=3$ überein."}],"gen":[],"html":"<h3>Die zentrale Deutung<\/h3>\n<p>Integriert man eine Änderungsrate über einen Zeitraum, erhält man die <b>gesamte Änderung<\/b> in diesem Zeitraum:<\/p>\n<div class=\"formula\">$\\displaystyle\\int_a^bf'(t)\\,dt=f(b)-f(a)$<\/div>\n<p>Daraus folgen die bekannten Anwendungen. Die Einheit des Ergebnisses ist immer das Produkt der Einheiten der beiden Achsen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Integriert wird<\/th><th>über<\/th><th>Ergebnis<\/th><\/tr><tr><td>Geschwindigkeit $v(t)$ in m/s<\/td><td>die Zeit in s<\/td><td>Ortsänderung in m<\/td><\/tr><tr><td>Beschleunigung $a(t)$ in m/s²<\/td><td>die Zeit in s<\/td><td>Geschwindigkeitsänderung in m/s<\/td><\/tr><tr><td>Zuflussrate in l/min<\/td><td>die Zeit in min<\/td><td>zugeflossene Menge in l<\/td><\/tr><tr><td>Kraft $F(s)$ in N<\/td><td>den Weg in m<\/td><td>Arbeit in J<\/td><\/tr><tr><td>Leistung $P(t)$ in W<\/td><td>die Zeit in s<\/td><td>Energie in J<\/td><\/tr><\/table><\/div>\n<p>Die Zusammenhänge zwischen Weg, Geschwindigkeit und Beschleunigung und die Rechnung „neuer Bestand = Anfangsbestand + Integral der Änderungsrate“ sind auf der Seite zur Zentralmatura vorgerechnet. Hier folgen Aufgabentypen, die dort nicht vorkommen.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Ist $v(t)$ zeitweise negativ (Rückwärtsbewegung), liefert $\\int v\\,dt$ die <b>Ortsänderung<\/b>, also wie weit man am Ende vom Start entfernt ist. Für den tatsächlich <b>zurückgelegten Weg<\/b> musst du an den Nullstellen von $v$ teilen und die Beträge addieren, wie bei der Flächenberechnung.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Ortsänderung und zurückgelegter Weg<\/h4><div class=\"task\">Ein Wagen bewegt sich mit $v(t)=6-2t$ (in m/s, $t$ in s). Bestimme die Ortsänderung und den zurückgelegten Weg in den ersten 5 Sekunden.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stammfunktion: $s(t)=6t-t^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Ortsänderung: $\\displaystyle\\int_0^5v(t)\\,dt=s(5)-s(0)=30-25=5$ m.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Nullstelle von $v$: $6-2t=0$ bei $t=3$. Bis dahin fährt der Wagen vorwärts, danach rückwärts.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Vorwärts: $s(3)-s(0)=18-9=9$ m. Rückwärts: $s(5)-s(3)=5-9=-4$ m.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Zurückgelegter Weg: $9+4=13$ m. Der Wagen ist also 13 m gefahren, steht aber nur 5 m vom Start entfernt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Rotationskörper<\/h3>\n<p>Dreht sich die Fläche unter dem Graphen von $f$ zwischen $a$ und $b$ um die $x$-Achse, entsteht ein Körper. Man denkt ihn sich aus dünnen Scheiben aufgebaut: Jede Scheibe ist ein flacher Zylinder mit Radius $f(x)$ und Dicke $dx$.<\/p>\n<div class=\"formula\">$V_x=\\pi\\displaystyle\\int_a^b\\big(f(x)\\big)^2\\,dx$<\/div>\n<p>Bei Drehung um die $y$-Achse löst du die Funktionsgleichung nach $x$ auf und integrierst über $y$: $V_y=\\pi\\displaystyle\\int_c^dx^2\\,dy$.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Volumen eines Rotationskörpers<\/h4><div class=\"task\">Die Fläche unter $f(x)=\\frac12x^2+1$ im Intervall $[0;2]$ dreht sich um die $x$-Achse. Berechne das Volumen.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst quadrieren, dann integrieren: $\\big(f(x)\\big)^2=\\left(\\frac12x^2+1\\right)^2=\\frac14x^4+x^2+1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Stammfunktion: $\\dfrac{x^5}{20}+\\dfrac{x^3}{3}+x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Grenzen einsetzen: $\\dfrac{32}{20}+\\dfrac83+2-0=1,6+2,667+2=6,267$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Mit $\\pi$ multiplizieren: $V\\approx6,267\\cdot\\pi\\approx19,69$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Typischer Fehler: zuerst integrieren und dann quadrieren. Das Quadrat gehört unter das Integral.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Einen Kegel erhältst du durch Drehung einer Geraden durch den Ursprung, eine Kugel durch Drehung eines Halbkreises $y=\\sqrt{r^2-x^2}$. So lassen sich die Volumsformeln aus der Unterstufe herleiten.<\/div>"},{"id":"dynamik","t":"Dynamische Prozesse: Differenzen- und Differentialgleichungen","kl":"8","k":8,"a":"A","tag":"S","goals":["Entwicklungen in Zeitschritten durch Differenzengleichungen beschreiben","den langfristigen Wert eines Prozesses berechnen","lineare, exponentielle, beschränkte und logistische Modelle unterscheiden","prüfen, ob eine Funktion eine Differentialgleichung erfüllt"],"ex":[{"type":"num","a":154.0,"q":"Für eine Folge gilt $x_{n+1}=0,8\\cdot x_n+50$ mit $x_0=100$. Berechne $x_2$.","s":"$x_1=0,8\\cdot100+50=130$ und $x_2=0,8\\cdot130+50=154$."},{"type":"num","a":250.0,"q":"Auf welchen Wert pendelt sich die Folge $x_{n+1}=0,8\\cdot x_n+50$ langfristig ein?","s":"$x^*=0,8x^*+50$, also $0,2x^*=50$ und $x^*=250$."},{"type":"num","a":200.0,"q":"Der Körper baut täglich 20 % eines Wirkstoffs ab, täglich werden 40 mg zugeführt. Welche Menge stellt sich langfristig ein?","unit":"mg","s":"$x_{n+1}=0,8x_n+40$. Gleichgewicht: $0,2x^*=40$, also $x^*=200$ mg."},{"type":"num","a":9.11,"q":"Für $f$ gilt $f'(t)=0,3\\cdot f(t)$ und $f(0)=5$. Berechne $f(2)$ (zwei Dezimalstellen).","s":"Exponentielles Wachstum: $f(t)=5e^{0,3t}$. $f(2)=5e^{0,6}\\approx9,11$."},{"type":"mc","q":"Welches Wachstum beschreibt die Gleichung $f'(t)=k\\cdot\\big(G-f(t)\\big)$ mit $k>0$?","s":"Die Änderungsrate ist proportional zum Abstand von der Grenze $G$. Je näher der Bestand an $G$ kommt, desto langsamer wächst er.","o":["beschränktes Wachstum","exponentielles Wachstum","lineares Wachstum","logistisches Wachstum"]},{"type":"num","a":57.93,"q":"Für ein beschränktes Wachstum gilt $f(t)=80-60\\cdot e^{-0,1t}$. Berechne $f(10)$ (zwei Dezimalstellen).","s":"$f(10)=80-60\\cdot e^{-1}\\approx80-22,07=57,93$."},{"type":"mc","q":"Welche Funktion erfüllt die Differentialgleichung $f'(t)=-2\\cdot f(t)$?","h":"Leite jede Funktion ab und vergleiche mit $-2\\cdot f(t)$.","s":"$f'(t)=3\\cdot(-2)e^{-2t}=-2\\cdot3e^{-2t}=-2\\cdot f(t)$. Bei $3e^{2t}$ wäre $f'=+2f$.","o":["$f(t)=3e^{-2t}$","$f(t)=-2t+3$","$f(t)=3e^{2t}$","$f(t)=-t^2$"]},{"type":"num","a":500.0,"q":"Ein Bestand wächst logistisch mit der Obergrenze 1 000. Bei welchem Bestand ist das Wachstum am schnellsten?","s":"Beim logistischen Wachstum liegt der Wendepunkt bei der halben Grenze: $\\dfrac{1000}{2}=500$."},{"type":"mc","q":"Was beschreibt die Gleichung $x_{n+1}-x_n=0,05\\cdot x_n$?","s":"Die Zunahme pro Schritt beträgt 5 % des aktuellen Bestands. Umgeformt: $x_{n+1}=1,05\\cdot x_n$, also exponentielles Wachstum.","o":["Der Bestand wächst in jedem Schritt um 5 %.","Der Bestand wächst in jedem Schritt um 0,05 Einheiten.","Der Bestand sinkt in jedem Schritt um 5 %.","Der Bestand wächst in jedem Schritt um 5 Einheiten."]}],"gen":[],"html":"<h3>Schritt für Schritt: Differenzengleichungen<\/h3>\n<p>Viele Vorgänge beschreibt man am einfachsten, indem man sagt, wie aus dem heutigen Wert der morgige wird. Eine solche Vorschrift heißt Differenzengleichung. Die wichtigste Form:<\/p>\n<div class=\"formula\">$x_{n+1}=a\\cdot x_n+b$<\/div>\n<p>Der Bestand wird in jedem Schritt mit $a$ multipliziert (prozentuelle Änderung), und es kommt ein fester Betrag $b$ dazu (oder weg). Für $b=0$ ist das exponentielles Wachstum, für $a=1$ lineares.<\/p>\n<p>Liegt $a$ zwischen 0 und 1, pendelt sich der Bestand auf einen festen Wert ein. Diesen <b>Gleichgewichtswert<\/b> (Fixpunkt) findest du, indem du verlangst, dass sich nichts mehr ändert, also $x_{n+1}=x_n=x^*$:<\/p>\n<div class=\"formula\">$x^*=a\\cdot x^*+b\\quad\\Longrightarrow\\quad x^*=\\dfrac{b}{1-a}$<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Medikamentenspiegel<\/h4><div class=\"task\">Ein Patient nimmt täglich 50 mg eines Wirkstoffs ein. Der Körper baut pro Tag 40 % der vorhandenen Menge ab. Wie entwickelt sich die Wirkstoffmenge, und wo pendelt sie sich ein?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>40 % Abbau heißt: 60 % bleiben. Dazu kommen 50 mg. $x_{n+1}=0,6\\cdot x_n+50$ mit $x_0=0$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die ersten Tage: $x_1=50$, $x_2=0,6\\cdot50+50=80$, $x_3=0,6\\cdot80+50=98$, $x_4=108,8$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die Zunahmen werden kleiner: $30$, $18$, $10,8$. Der Bestand wächst immer langsamer.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Gleichgewicht: $x^*=0,6x^*+50$, also $0,4x^*=50$ und $x^*=125$ mg.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Deutung: Bei 125 mg wird pro Tag genau so viel abgebaut ($0,4\\cdot125=50$ mg), wie eingenommen wird.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Stetig: Differentialgleichungen<\/h3>\n<p>Beschreibt man die Änderung nicht in Schritten, sondern in jedem Augenblick, steht statt der Differenz die Ableitung. Eine <b>Differentialgleichung<\/b> verknüpft eine Funktion mit ihrer Ableitung. Gesucht ist die Funktion.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Modell<\/th><th>Differentialgleichung<\/th><th>In Worten<\/th><th>Lösung<\/th><\/tr><tr><td>linear<\/td><td>$f'(t)=k$<\/td><td>Änderungsrate konstant<\/td><td>$f(t)=k\\cdot t+f_0$<\/td><\/tr><tr><td>exponentiell<\/td><td>$f'(t)=k\\cdot f(t)$<\/td><td>Änderungsrate proportional zum Bestand<\/td><td>$f(t)=f_0\\cdot e^{kt}$<\/td><\/tr><tr><td>beschränkt<\/td><td>$f'(t)=k\\cdot\\big(G-f(t)\\big)$<\/td><td>Änderungsrate proportional zum Abstand von der Grenze $G$<\/td><td>$f(t)=G-(G-f_0)\\cdot e^{-kt}$<\/td><\/tr><tr><td>logistisch<\/td><td>$f'(t)=k\\cdot f(t)\\cdot\\big(G-f(t)\\big)$<\/td><td>proportional zu Bestand und freiem Platz<\/td><td>S-förmige Kurve<\/td><\/tr><\/table><\/div>\n[[plot:f=80-60*exp(-0.3*x);;80/(1+15*exp(-0.8*x));;80 | x=0,14 | y=0,90 | cap=blau: beschränktes Wachstum · rot: logistisches Wachstum · beide nähern sich der Grenze G = 80]]\n<p>Beim <b>logistischen<\/b> Wachstum verläuft der Anfang fast exponentiell. Am schnellsten wächst der Bestand, wenn er die halbe Grenze $\\frac G2$ erreicht hat. Dort liegt der Wendepunkt der Kurve. Danach flacht sie ab.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Lösung einer Differentialgleichung überprüfen<\/h4><div class=\"task\">Zeige, dass $f(t)=20-15e^{-0,2t}$ die Differentialgleichung $f'(t)=0,2\\cdot\\big(20-f(t)\\big)$ erfüllt, und deute die Zahlen.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Linke Seite, die Ableitung: $f'(t)=-15\\cdot(-0,2)\\cdot e^{-0,2t}=3e^{-0,2t}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Rechte Seite, $f$ einsetzen: $0,2\\cdot\\big(20-(20-15e^{-0,2t})\\big)=0,2\\cdot15e^{-0,2t}=3e^{-0,2t}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Beide Seiten sind
