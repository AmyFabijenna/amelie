Umkehrfunktion bestimmen<\/h4><div class=\"task\">Bestimme die Umkehrfunktion von $f(x)=3x-6$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Schreibe $y=3x-6$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Löse nach $x$ auf: $y+6=3x$, also $x=\\dfrac{y+6}{3}=\\dfrac{y}{3}+2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Vertausche die Namen der Variablen, damit wieder $x$ das Argument ist: $f^{-1}(x)=\\dfrac{x}{3}+2$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Probe mit einer Zahl: $f(4)=6$ und $f^{-1}(6)=2+2=4$. Die Umkehrfunktion führt zurück zum Start.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Symmetrie am Term prüfen<\/h4><div class=\"task\">Untersuche $f(x)=x^3-5x$ auf Symmetrie.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Ersetze überall $x$ durch $-x$: $f(-x)=(-x)^3-5\\cdot(-x)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Vereinfache: $(-x)^3=-x^3$ und $-5\\cdot(-x)=5x$. Also $f(-x)=-x^3+5x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Vergleiche mit $f(x)=x^3-5x$: Alle Vorzeichen sind umgedreht, also $f(-x)=-f(x)$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Der Graph ist punktsymmetrisch zum Ursprung. Merkhilfe für Polynomfunktionen: nur ungerade Hochzahlen bedeutet punktsymmetrisch, nur gerade Hochzahlen (und Zahlen ohne $x$) bedeutet symmetrisch zur $y$-Achse.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"linf","t":"Lineare Funktionen","kl":"5","k":5,"a":"F","tag":"M","goals":["die Parameter k und d am Graphen und im Sachzusammenhang deuten","den Funktionsterm aus Steigung und Punkt oder aus zwei Punkten aufstellen","Nullstelle und Schnittpunkte berechnen","parallele und normale Geraden erkennen"],"ex":[{"type":"list","a":[2.0,1.0],"q":"Eine lineare Funktion geht durch $A=(1|3)$ und $B=(4|9)$. Gib $k; d$ an.","s":"$k=\\dfrac{9-3}{4-1}=2$. Einsetzen von $A$: $3=2\\cdot1+d$, also $d=1$."},{"type":"num","a":8.0,"q":"Bestimme die Nullstelle von $f(x)=-0,5x+4$.","s":"$-0,5x+4=0$ ergibt $0,5x=4$ und $x=8$."},{"type":"num","a":-5.0,"q":"Eine Gerade ist parallel zu $y=3x-2$ und geht durch $P=(2|1)$. Wie groß ist ihr $d$?","s":"Parallel bedeutet gleiche Steigung: $y=3x+d$. Einsetzen: $1=6+d$, also $d=-5$."},{"type":"num","a":-0.5,"q":"Welche Steigung hat eine Gerade, die normal auf $y=2x+1$ steht?","s":"$k_2=-\\dfrac{1}{k_1}=-\\dfrac12=-0,5$."},{"type":"num","a":26.57,"q":"Eine Gerade hat die Steigung $k=0,5$. Wie groß ist ihr Steigungswinkel in Grad (zwei Dezimalstellen)?","unit":"°","s":"$\\tan\\alpha=0,5$, also $\\alpha=\\arctan(0,5)\\approx26,57°$."},{"type":"num","a":12.5,"q":"Eine 20 cm hohe Kerze brennt gleichmäßig 1,6 cm pro Stunde ab. Nach wie vielen Stunden ist sie abgebrannt?","unit":"Stunden","s":"Höhe nach $t$ Stunden: $h(t)=20-1,6t$. Nullstelle: $t=20:1,6=12,5$."},{"type":"list","a":[2.0,3.0],"q":"Bestimme den Schnittpunkt der Geraden $y=2x-1$ und $y=-x+5$. Gib $x; y$ an.","s":"Gleichsetzen: $2x-1=-x+5$, also $3x=6$ und $x=2$. Einsetzen: $y=3$."},{"type":"mc","q":"Die Kosten für $x$ Stück betragen $K(x)=12x+300$ Euro. Was bedeutet die Zahl 12?","s":"12 ist die Steigung, also die Änderung der Kosten pro Stück, mit der Einheit Euro pro Stück. Die Kosten ohne Produktion sind die 300 €.","o":["Jedes weitere Stück verursacht 12 € zusätzliche Kosten.","Auch ohne Produktion fallen 12 € an.","Es werden 12 Stück produziert.","Die Kosten steigen pro Stück um 12 %."]}],"gen":["linf"],"html":"<h3>Die Gleichung und ihre zwei Parameter<\/h3>\n<div class=\"formula\">$f(x)=k\\cdot x+d$<\/div>\n<p>Der Graph ist eine Gerade. $d$ ist der Wert an der Stelle 0, also der Abschnitt auf der $y$-Achse. $k$ ist die <b>Steigung<\/b>: Geht man um 1 nach rechts, ändert sich der Funktionswert um $k$. Allgemein:<\/p>\n<div class=\"formula\">$k=\\dfrac{\\Delta y}{\\Delta x}=\\dfrac{f(x_2)-f(x_1)}{x_2-x_1}$<\/div>\n<p>Bei $k>0$ steigt die Gerade, bei $k<0$ fällt sie, bei $k=0$ ist sie waagrecht (konstante Funktion). Je größer der Betrag von $k$, desto steiler.<\/p>\n[[plot:f=0.5*x+1;;-2*x+4 | x=-3,5 | y=-3,6 | cap=blau: k = 0,5 und d = 1 · rot: k = −2 und d = 4]]\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Das Kennzeichen linearer Zusammenhänge: Gleiche Zunahme von $x$ bewirkt immer <b>gleiche Zunahme<\/b> von $f(x)$. Die Änderung pro Einheit ist konstant.<\/div>\n<h3>Deuten im Sachzusammenhang<\/h3>\n<p>In einer Kostenfunktion $K(x)=12x+300$ sind 300 die Fixkosten (sie fallen auch bei 0 Stück an) und 12 die Kosten für jedes weitere Stück. Die Einheit von $k$ ist immer „Einheit von $y$ pro Einheit von $x$“, hier Euro pro Stück. Solche Deutungen sind beliebte Prüfungsfragen.<\/p>\n<p>Ist $d=0$, also $f(x)=k\\cdot x$, spricht man von <b>direkter Proportionalität<\/b>: Verdoppelt man $x$, verdoppelt sich auch $f(x)$.<\/p>\n<h3>Besondere Lagen<\/h3>\n<ul><li>Zwei Geraden sind <b>parallel<\/b>, wenn sie dieselbe Steigung haben: $k_1=k_2$.<\/li><li>Zwei Geraden stehen <b>normal<\/b> aufeinander, wenn $k_1\\cdot k_2=-1$ gilt, also $k_2=-\\dfrac{1}{k_1}$.<\/li><li>Der <b>Steigungswinkel<\/b> $\\alpha$ zur $x$-Achse erfüllt $\\tan\\alpha=k$.<\/li><\/ul>\n<p>Wie man den Term aus zwei Punkten aufstellt, ist auf der Seite zur Zentralmatura Schritt für Schritt gezeigt. Hier geht es um Schnittpunkte und um das Modellieren.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Schnittpunkt zweier Geraden im Sachzusammenhang<\/h4><div class=\"task\">Ein Fitnessstudio bietet zwei Tarife an. Tarif A: 25 € pro Monat ohne Anmeldegebühr. Tarif B: 80 € Anmeldegebühr und 15 € pro Monat. Ab welchem Monat ist Tarif B insgesamt günstiger?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stelle für jeden Tarif die Gesamtkosten nach $x$ Monaten auf: $A(x)=25x$ und $B(x)=15x+80$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Am Schnittpunkt kosten beide gleich viel. Setze gleich: $25x=15x+80$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Löse: $10x=80$, also $x=8$. Nach 8 Monaten hat man bei beiden $200$ € bezahlt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Wer ist danach günstiger? Der Tarif mit der kleineren Steigung, also B mit 15 € pro Monat.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: Bis zum 8. Monat ist A günstiger, bei genau 8 Monaten sind beide gleich, ab dem 9. Monat ist B günstiger.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Normale Gerade durch einen Punkt<\/h4><div class=\"task\">Bestimme die Gerade $h$, die normal auf $g: y=\\frac12x+3$ steht und durch $P=(2|1)$ geht.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Steigung von $g$ ist $k_1=\\frac12$. Die Steigung der Normalen ist der negative Kehrwert: $k_2=-2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Ansatz: $y=-2x+d$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Setze den Punkt $P$ ein: $1=-2\\cdot2+d$, also $d=5$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: $h: y=-2x+5$. Kontrolle: $k_1\\cdot k_2=\\frac12\\cdot(-2)=-1$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"quadf","t":"Quadratische Funktionen","kl":"5","k":5,"a":"F","tag":"M","goals":["den Einfluss der Parameter a, b und c auf die Parabel beschreiben","den Scheitelpunkt berechnen und die Scheitelform aufstellen","zwischen allgemeiner Form, Scheitelform und Linearfaktorform wechseln","Wurf- und Optimierungsaufgaben lösen"],"ex":[{"type":"list","a":[3.0,-4.0],"q":"Bestimme den Scheitelpunkt von $f(x)=x^2-6x+5$. Gib $x_S; y_S$ an.","s":"$x_S=-\\dfrac{-6}{2}=3$ und $y_S=9-18+5=-4$."},{"type":"set","a":[1.0,-3.0],"q":"Bestimme die Nullstellen von $f(x)=-2(x+1)^2+8$.","h":"Setze den Term gleich 0 und löse nach der Klammer auf.","s":"$2(x+1)^2=8$, also $(x+1)^2=4$ und $x+1=\\pm2$. Nullstellen: $1$ und $-3$."},{"type":"mc","q":"Für $f(x)=ax^2+bx+c$ gilt $a<0$ und $c>0$. Was folgt daraus sicher?","s":"$a<0$ bedeutet nach unten offen, $c=f(0)>0$ bedeutet Schnitt mit der $y$-Achse im Positiven. Eine nach unten offene Parabel, die irgendwo über der Achse liegt, hat sogar sicher zwei Nullstellen.","o":["Die Parabel ist nach unten offen und schneidet die $y$-Achse oberhalb des Ursprungs.","Die Parabel ist nach oben offen und hat keine Nullstellen.","Der Scheitel liegt auf der $y$-Achse.","Die Parabel ist nach unten offen und hat keine Nullstellen."]},{"type":"num","a":21.5,"q":"Die Höhe eines Steins beträgt $h(t)=-5t^2+20t+1,5$ (in m, $t$ in s). Wie groß ist die maximale Höhe?","unit":"m","s":"$t_S=-\\dfrac{20}{-10}=2$. $h(2)=-20+40+1,5=21,5$."},{"type":"num","a":4.07,"q":"Nach wie vielen Sekunden trifft der Stein aus der vorigen Aufgabe am Boden auf (zwei Dezimalstellen)?","unit":"s","s":"$-5t^2+20t+1,5=0$. $t=\\dfrac{-20\\pm\\sqrt{400+30}}{-10}$. Die positive Lösung ist $t=\\dfrac{-20-20,74}{-10}\\approx4,07$."},{"type":"num","a":14.0,"q":"Wandle $f(x)=2(x-3)^2-4$ in die allgemeine Form $ax^2+bx+c$ um. Gib $c$ an.","s":"$2(x^2-6x+9)-4=2x^2-12x+18-4=2x^2-12x+14$. Also $c=14$. Schneller: $c=f(0)=2\\cdot9-4$."},{"type":"num","a":-2.0,"q":"Eine Parabel hat die Nullstellen $-1$ und $3$ und geht durch $(0|6)$. Bestimme $a$.","h":"Linearfaktorform ansetzen und den Punkt einsetzen.","s":"$f(x)=a(x+1)(x-3)$. $f(0)=a\\cdot1\\cdot(-3)=6$, also $a=-2$."},{"type":"num","a":0.0,"q":"Wie viele Nullstellen hat $f(x)=x^2+2x+5$?","s":"Diskriminante: $1-5=-4<0$. Keine Nullstelle. Anschaulich: Der Scheitel $(-1|4)$ liegt über der Achse, und die Parabel ist nach oben offen."}],"gen":["scheitel"],"html":"<h3>Drei Schreibweisen derselben Parabel<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Form<\/th><th>Term<\/th><th>Was man direkt abliest<\/th><\/tr><tr><td>allgemeine Form<\/td><td>$f(x)=ax^2+bx+c$<\/td><td>Öffnung ($a$) und Schnitt mit der $y$-Achse ($c$)<\/td><\/tr><tr><td>Scheitelform<\/td><td>$f(x)=a(x-x_S)^2+y_S$<\/td><td>Scheitelpunkt $S=(x_S\\mid y_S)$<\/td><\/tr><tr><td>Linearfaktorform<\/td><td>$f(x)=a(x-x_1)(x-x_2)$<\/td><td>Nullstellen $x_1$ und $x_2$<\/td><\/tr><\/table><\/div>\n<p>Der Parameter $a$ ist in allen drei Formen derselbe. Bei $a>0$ ist die Parabel nach oben offen und der Scheitel ist der tiefste Punkt, bei $a<0$ nach unten offen und der Scheitel ist der höchste Punkt. Je größer $|a|$, desto schmäler die Parabel.<\/p>\n[[plot:f=(x-2)*(x-2)-3;;-0.5*x*x+4 | x=-4,6 | y=-5,7 | pts=2,-3,S/0,4 | cap=blau: (x − 2)² − 3 mit Scheitel S = (2 | −3) · rot: −0,5x² + 4, nach unten offen]]\n<h3>Den Scheitel finden<\/h3>\n<p>Aus der allgemeinen Form berechnest du die Scheitelstelle mit<\/p>\n<div class=\"formula\">$x_S=-\\dfrac{b}{2a}\\qquad y_S=f(x_S)$<\/div>\n<p>Die Parabel ist symmetrisch zur senkrechten Geraden durch den Scheitel. Deshalb liegt $x_S$ auch genau in der Mitte zwischen den beiden Nullstellen, falls es welche gibt.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>In der Scheitelform steht ein Minus vor $x_S$. Bei $f(x)=(x+3)^2-1$ ist die Scheitelstelle daher $-3$ und nicht $+3$.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Von der allgemeinen Form zur Scheitelform<\/h4><div class=\"task\">Bringe $f(x)=2x^2-12x+10$ in Scheitelform und gib alle wichtigen Eigenschaften an.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Scheitelstelle: $x_S=-\\dfrac{b}{2a}=-\\dfrac{-12}{4}=3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Scheitelwert: $y_S=f(3)=2\\cdot9-36+10=-8$. Scheitel: $S=(3|-8)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Scheitelform: $f(x)=2(x-3)^2-8$. Das $a$ bleibt 2.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Weil $a>0$ ist, ist $S$ der Tiefpunkt. Der kleinste Funktionswert ist $-8$, die Wertemenge $[-8;\\infty)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Nullstellen aus der Scheitelform: $2(x-3)^2=8$, also $(x-3)^2=4$, $x-3=\\pm2$. Nullstellen: $1$ und $5$. Die Mitte davon ist 3. Das passt zur Scheitelstelle.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Linearfaktorform: $f(x)=2(x-1)(x-5)$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wurfaufgabe<\/h4><div class=\"task\">Ein Ball wird geworfen. Seine Höhe in Metern nach $t$ Sekunden ist $h(t)=-5t^2+12t+2$. Wie hoch steigt er höchstens, und wann landet er?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Deute zuerst die Zahlen: $h(0)=2$ ist die Abwurfhöhe. Die Parabel ist nach unten offen, der Scheitel ist also der höchste Punkt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Scheitelstelle: $t_S=-\\dfrac{12}{2\\cdot(-5)}=1,2$ Sekunden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Größte Höhe: $h(1,2)=-5\\cdot1,44+14,4+2=9,2$ Meter.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Landung bedeutet $h(t)=0$: $-5t^2+12t+2=0$. Große Lösungsformel: $t=\\dfrac{-12\\pm\\sqrt{144+40}}{-10}=\\dfrac{-12\\pm13,56}{-10}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Das ergibt $t\\approx-0,16$ und $t\\approx2,56$. Die negative Zeit liegt vor dem Abwurf und scheidet aus.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Antwort: Der Ball erreicht nach 1,2 s seine größte Höhe von 9,2 m und landet nach etwa 2,56 s.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"potpoly","t":"Potenz- und Polynomfunktionen","kl":"5–6","k":5,"a":"F","tag":"M","goals":["Graphen von Potenzfunktionen mit positiven und negativen Hochzahlen skizzieren","indirekte Proportionalität erkennen","aus dem Grad einer Polynomfunktion auf die mögliche Anzahl von Nullstellen, Extremstellen und Wendestellen schließen","den Verlauf für große x vorhersagen"],"ex":[{"type":"num","a":2.0,"q":"Wie viele Extremstellen kann eine Polynomfunktion dritten Grades höchstens haben?","s":"Höchstens $n-1=2$. Sie kann auch gar keine haben, wie $f(x)=x^3$."},{"type":"num","a":4.0,"q":"Welchen Grad hat $f(x)=x(x-2)^2(x+3)$?","h":"Zähle, wie oft der Faktor $x$ insgesamt vorkommt, wenn man ausmultiplizieren würde.","s":"$1+2+1=4$. Ausmultipliziert beginnt der Term mit $x^4$."},{"type":"set","a":[0.0,2.0,-3.0],"q":"Gib die Nullstellen von $f(x)=x(x-2)^2(x+3)$ an.","s":"Jeder Faktor wird einzeln 0: $x=0$, $x=2$ (doppelt) und $x=-3$. Eine doppelte Nullstelle wird in der Lösungsmenge nur einmal aufgeschrieben."},{"type":"mc","q":"Wie verhält sich $f(x)=-2x^5+x^2$ für sehr große und sehr kleine $x$?","h":"Nur das Glied $-2x^5$ zählt.","s":"Ungerader Grad mit negativem Vorfaktor: Der Graph kommt von links oben und geht nach rechts unten.","o":["Für $x\\to\\infty$ gilt $f(x)\\to-\\infty$, für $x\\to-\\infty$ gilt $f(x)\\to+\\infty$.","Für $x\\to\\infty$ gilt $f(x)\\to+\\infty$, für $x\\to-\\infty$ gilt $f(x)\\to-\\infty$.","In beide Richtungen gilt $f(x)\\to-\\infty$.","In beide Richtungen gilt $f(x)\\to+\\infty$."]},{"type":"num","a":3.0,"q":"$y$ ist indirekt proportional zu $x$. Für $x=4$ ist $y=6$. Wie groß ist $y$ für $x=8$?","s":"Das Produkt bleibt konstant: $4\\cdot6=24$. Also $y=24:8=3$. Doppeltes $x$ bedeutet halbes $y$."},{"type":"num","a":0.5,"q":"Der Graph von $f(x)=a\\cdot x^3$ geht durch $(2|4)$. Bestimme $a$.","s":"$a\\cdot8=4$, also $a=0,5$."},{"type":"mc","q":"Wie verläuft der Graph einer Polynomfunktion an einer doppelten Nullstelle?","s":"Der Faktor $(x-x_0)^2$ ist nie negativ, daher wechselt der Funktionswert dort nicht das Vorzeichen. Polynomfunktionen haben nie Sprünge oder senkrechte Stellen.","o":["Er berührt die $x$-Achse und wechselt die Seite nicht.","Er schneidet die $x$-Achse geradlinig.","Er hat dort einen Sprung.","Er verläuft dort senkrecht."]},{"type":"num","a":9.0,"q":"Der Radius eines Kreises wird verdreifacht. Auf das Wievielfache wächst der Flächeninhalt?","s":"$A=\\pi r^2$ ist eine Potenzfunktion mit Hochzahl 2. Dreifacher Radius ergibt $3^2=9$-fache Fläche."}],"gen":[],"html":"<h3>Potenzfunktionen<\/h3>\n<p>Eine Potenzfunktion hat die Form $f(x)=a\\cdot x^z$. Der Graph hängt davon ab, ob die Hochzahl gerade oder ungerade, positiv oder negativ ist.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Hochzahl<\/th><th>Beispiel<\/th><th>Verlauf<\/th><\/tr><tr><td>positiv und gerade<\/td><td>$x^2$, $x^4$<\/td><td>parabelartig, symmetrisch zur $y$-Achse, Werte nie negativ<\/td><\/tr><tr><td>positiv und ungerade<\/td><td>$x^3$, $x^5$<\/td><td>von links unten nach rechts oben, punktsymmetrisch<\/td><\/tr><tr><td>negativ<\/td><td>$x^{-1}=\\frac1x$, $x^{-2}=\\frac{1}{x^2}$<\/td><td>Hyperbel, bei 0 nicht definiert, nähert sich beiden Achsen<\/td><\/tr><tr><td>$\\frac12$<\/td><td>$\\sqrt x$<\/td><td>nur für $x\\ge0$, steigt immer langsamer<\/td><\/tr><\/table><\/div>\n[[plot:f=pow(x,3)/3;;1/x | x=-4,4 | y=-4,4 | cap=blau: x³/3 · rot: 1/x (Hyperbel)]]\n<h3>Indirekte Proportionalität<\/h3>\n<p>$f(x)=\\dfrac{c}{x}$ beschreibt eine indirekte Proportionalität: Das <b>Produkt<\/b> $x\\cdot f(x)=c$ bleibt konstant. Verdoppelt man $x$, halbiert sich der Funktionswert. Typisch: Je mehr Personen eine feste Arbeit erledigen, desto kürzer dauert sie.<\/p>\n<p>Praktisch für den Alltag: Bei $f(x)=a\\cdot x^n$ bewirkt eine Verdopplung von $x$ das $2^n$-Fache des Funktionswerts. Ein Würfel mit doppelter Kante hat das achtfache Volumen.<\/p>\n<h3>Polynomfunktionen<\/h3>\n<div class=\"formula\">$f(x)=a_nx^n+a_{n-1}x^{n-1}+\\dots+a_1x+a_0\\qquad (a_n\\ne0)$<\/div>\n<p>$n$ heißt <b>Grad<\/b>. Lineare und quadratische Funktionen sind die Fälle $n=1$ und $n=2$. Aus dem Grad kannst du viel ablesen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Eigenschaft<\/th><th>Polynomfunktion vom Grad $n$ hat<\/th><\/tr><tr><td>Nullstellen<\/td><td>höchstens $n$ (bei ungeradem Grad mindestens eine)<\/td><\/tr><tr><td>Extremstellen<\/td><td>höchstens $n-1$<\/td><\/tr><tr><td>Wendestellen<\/td><td>höchstens $n-2$<\/td><\/tr><\/table><\/div>\n<p>Das <b>Verhalten für große $|x|$<\/b> bestimmt allein das Glied mit der höchsten Hochzahl, $a_nx^n$. Bei geradem Grad zeigen beide Enden in dieselbe Richtung (nach oben, wenn $a_n>0$). Bei ungeradem Grad zeigen sie in entgegengesetzte Richtungen.<\/p>\n<h3>Nullstellen und ihre Vielfachheit<\/h3>\n<p>In der faktorisierten Form liest du die Nullstellen ab. Die Hochzahl eines Faktors sagt, wie der Graph die Achse trifft:<\/p>\n<ul><li>einfache Nullstelle, etwa $(x-1)$: Der Graph <b>schneidet<\/b> die Achse.<\/li><li>doppelte Nullstelle, etwa $(x-1)^2$: Der Graph <b>berührt<\/b> die Achse und kehrt um.<\/li><li>dreifache Nullstelle, etwa $(x-1)^3$: Der Graph schneidet die Achse mit waagrechter Tangente (Sattelpunkt).<\/li><\/ul>\n[[plot:f=0.25*x*(x-2)*(x-2)*(x+3) | x=-4,4 | y=-8,6 | pts=-3,0/0,0/2,0 | cap=f(x) = ¼·x·(x − 2)²·(x + 3): schneidet bei −3 und 0, berührt bei 2]]\n<div class=\"walk\"><h4>Schritt für Schritt: Graph aus dem Term vorhersagen<\/h4><div class=\"task\">Beschreibe den Verlauf von $f(x)=-x^3+4x$, ohne Technologie zu verwenden.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Grad 3, ungerade. Das höchste Glied ist $-x^3$ mit negativem Vorzeichen: Für große positive $x$ geht $f$ nach $-\\infty$, für große negative $x$ nach $+\\infty$. Der Graph kommt also von links oben und geht nach rechts unten.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Nullstellen durch Herausheben: $-x(x^2-4)=-x(x-2)(x+2)$. Nullstellen: $-2$, $0$, $2$, alle einfach. Der Graph schneidet die Achse dreimal.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Symmetrie: nur ungerade Hochzahlen, also punktsymmetrisch zum Ursprung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zwischen den Nullstellen muss der Graph umkehren: ein Tiefpunkt zwischen $-2$ und $0$, ein Hochpunkt zwischen $0$ und $2$. Mehr als zwei Extremstellen sind bei Grad 3 nicht möglich.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Schnitt mit der $y$-Achse: $f(0)=0$. Damit lässt sich der Graph schon gut skizzieren.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"expf","t":"Exponential- und Logarithmusfunktion","kl":"6","k":6,"a":"F","tag":"M","goals":["exponentielles Wachstum und exponentielle Abnahme erkennen und modellieren","zwischen prozentueller Änderung, Änderungsfaktor a und Konstante λ umrechnen","Zeitpunkte durch Logarithmieren berechnen","die Logarithmusfunktion als Umkehrfunktion verstehen"],"ex":[{"type":"num","tol":0.6,"a":2533.54,"q":"Ein Kapital von 2 000 € wird mit 3 % pro Jahr verzinst (Zinseszins). Wie groß ist es nach 8 Jahren?","unit":"€","s":"$K=2000\\cdot1,03^8\\approx2000\\cdot1,26677\\approx2533,54$ €."},{"type":"num","a":1.728,"q":"Eine Bakterienkultur wächst pro Stunde um 20 %. Mit welchem Faktor wächst sie in 3 Stunden?","s":"$1,2^3=1,728$. Das entspricht einer Zunahme um 72,8 %."},{"type":"num","a":4.88,"q":"Für einen Zerfall gilt $N(t)=N_0\\cdot e^{-0,05t}$ ($t$ in Jahren). Um wie viel Prozent nimmt der Bestand pro Jahr ab (zwei Dezimalstellen)?","unit":"%","h":"Berechne zuerst den Jahresfaktor $a=e^{\\lambda}$.","s":"$a=e^{-0,05}\\approx0,9512$. Abnahme: $1-0,9512=0,0488$, also 4,88 %."},{"type":"num","tol":0.0006,"a":-0.1625,"q":"Ein Bestand sinkt jährlich um 15 %. Bestimme $\\lambda$ in der Schreibweise $c\\cdot e^{\\lambda t}$ (vier Dezimalstellen).","s":"$a=0,85$ und $\\lambda=\\ln(0,85)\\approx-0,1625$."},{"type":"num","a":4.27,"q":"Ein Bestand sinkt jährlich um 15 %. Nach wie vielen Jahren hat er sich halbiert (zwei Dezimalstellen)?","unit":"Jahre","s":"$0,85^t=0,5$, also $t=\\dfrac{\\ln0,5}{\\ln0,85}\\approx\\dfrac{-0,6931}{-0,1625}\\approx4,27$."},{"type":"mc","q":"Wie verläuft der Graph von $f(x)=a^x$ für $0<a<1$?","s":"Jeder Schritt nach rechts multipliziert den Wert mit einer Zahl kleiner als 1. Die Werte werden kleiner, bleiben aber positiv, deshalb gibt es keinen Schnittpunkt mit der $x$-Achse.","o":["streng monoton fallend, er nähert sich für große $x$ der $x$-Achse","streng monoton steigend, er nähert sich für kleine $x$ der $x$-Achse","streng monoton fallend, er schneidet die $x$-Achse an einer Stelle","er ist eine fallende Gerade"]},{"type":"num","a":20.0,"q":"Ein Auto kostet neu 24 000 € und ist nach zwei Jahren noch 15 360 € wert. Um wie viel Prozent sinkt der Wert pro Jahr, wenn man exponentielle Abnahme annimmt?","unit":"%","h":"Bestimme zuerst den Faktor für zwei Jahre und ziehe dann die Wurzel.","s":"Faktor für zwei Jahre: $15\\,360:24\\,000=0,64$. Jahresfaktor: $a=\\sqrt{0,64}=0,8$. Das sind 20 % Abnahme pro Jahr."},{"type":"mc","q":"Welche Definitionsmenge hat $f(x)=\\ln(x-2)$?","s":"Das Argument eines Logarithmus muss positiv sein: $x-2>0$. Bei $x=2$ stünde $\\ln(0)$ da, und das gibt es nicht.","o":["$x>2$","$x\\ge2$","$x>0$","$x\\ne2$"]}],"gen":["proz","expgl"],"html":"<h3>Die Exponentialfunktion<\/h3>\n<div class=\"formula\">$f(x)=c\\cdot a^x\\qquad (c>0,\\ a>0,\\ a\\ne1)$<\/div>\n<p>Die Variable steht in der <b>Hochzahl<\/b>. $c=f(0)$ ist der Anfangswert. $a$ ist der <b>Änderungsfaktor<\/b>: Erhöht man $x$ um 1, wird der Funktionswert mit $a$ multipliziert.<\/p>\n[[plot:f=pow(1.5,x);;pow(0.6,x) | x=-4,5 | y=-1,7 | pts=0,1 | cap=blau: 1,5ˣ (Wachstum) · rot: 0,6ˣ (Abnahme) · beide gehen durch (0 | 1)]]\n<ul><li>$a>1$: exponentielles Wachstum, der Graph steigt immer steiler.<\/li><li>$0<a<1$: exponentielle Abnahme, der Graph fällt und nähert sich der $x$-Achse.<\/li><li>Der Graph hat keine Nullstelle. Die $x$-Achse ist Asymptote.<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Das Kennzeichen exponentieller Zusammenhänge: Gleiche Zunahme von $x$ bewirkt immer <b>gleiche prozentuelle Änderung<\/b> von $f(x)$. Konstant ist der Quotient aufeinanderfolgender Werte, nicht die Differenz.<\/div>\n<h3>Prozent, Faktor und λ<\/h3>\n<p>Eine Zunahme um $p\\,\\%$ pro Zeitschritt entspricht dem Faktor $a=1+\\frac{p}{100}$, eine Abnahme um $p\\,\\%$ dem Faktor $a=1-\\frac{p}{100}$.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Aussage<\/th><th>Faktor $a$<\/th><\/tr><tr><td>wächst jährlich um 3 %<\/td><td>$1,03$<\/td><\/tr><tr><td>sinkt pro Stunde um 12 %<\/td><td>$0,88$<\/td><\/tr><tr><td>verdoppelt sich pro Tag<\/td><td>$2$<\/td><\/tr><tr><td>halbiert sich pro Woche<\/td><td>$0,5$<\/td><\/tr><\/table><\/div>\n<p>Oft schreibt man dieselbe Funktion mit der Basis $e$:<\/p>\n<div class=\"formula\">$f(t)=c\\cdot e^{\\lambda t}\\qquad\\text{mit}\\qquad a=e^{\\lambda}\\quad\\text{und}\\quad\\lambda=\\ln a$<\/div>\n<p>Bei Wachstum ist $\\lambda>0$, bei Abnahme $\\lambda<0$.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Aus $\\lambda=-0,05$ folgt nicht „Abnahme um 5 %“. Der Faktor ist $a=e^{-0,05}\\approx0,9512$, die Abnahme beträgt also etwa 4,88 %. Für kleine Werte liegen $\\lambda$ und die prozentuelle Änderung nah beieinander, gleich sind sie nie.<\/div>\n<h3>Zeitpunkte berechnen<\/h3>\n<p>Sobald nach einem Zeitpunkt gefragt ist, steht die Unbekannte in der Hochzahl und du brauchst den Logarithmus. Verdopplungszeit und Halbwertszeit sind die bekanntesten Fälle. Ihre Formeln und ein Modell aus zwei Messwerten sind auf der Seite zur Zentralmatura erklärt. Hier siehst du eine allgemeine Zeitfrage und die Umrechnung auf andere Zeiteinheiten.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Wann wird ein Wert erreicht?<\/h4><div class=\"task\">Ein Auto kostet neu 28 000 € und verliert jedes Jahr 15 % an Wert. Nach wie vielen Jahren ist es nur noch 10 000 € wert?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Modell aufstellen: Abnahme um 15 % bedeutet Faktor $0,85$. $W(t)=28\\,000\\cdot0,85^t$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Gleichung: $28\\,000\\cdot0,85^t=10\\,000$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Potenz freistellen: $0,85^t=\\dfrac{10\\,000}{28\\,000}\\approx0,3571$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Logarithmieren: $t=\\dfrac{\\ln(0,3571)}{\\ln(0,85)}\\approx\\dfrac{-1,0296}{-0,1625}\\approx6,34$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: Nach etwa 6,3 Jahren. Probe: $28\\,000\\cdot0,85^{6,34}\\approx10\\,000$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Faktor auf eine andere Zeiteinheit umrechnen<\/h4><div class=\"task\">Eine Bakterienkultur wächst pro Stunde um 20 %. Um wie viel Prozent wächst sie in 3 Stunden, und um wie viel Prozent in einer halben Stunde?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stundenfaktor: $a=1,2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Für 3 Stunden wird dreimal multipliziert: $1,2^3=1,728$. Das sind 72,8 % Zunahme und nicht $3\\cdot20=60\\,\\%$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Für eine halbe Stunde ist die Hochzahl $\\frac12$: $1,2^{0,5}=\\sqrt{1,2}\\approx1,0954$. Das sind etwa 9,54 % und nicht 10 %.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Merke: Prozentsätze darf man bei exponentiellen Vorgängen nie einfach multiplizieren oder teilen. Man rechnet immer mit dem Faktor.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Die Logarithmusfunktion<\/h3>\n<p>$f(x)=\\log_a(x)$ ist die Umkehrfunktion von $a^x$. Ihr Graph ist das Spiegelbild der Exponentialkurve an der Geraden $y=x$. Sie ist nur für $x>0$ definiert, geht durch $(1|0)$ und wächst (für $a>1$) immer langsamer, aber ohne Grenze.<\/p>\n[[plot:f=exp(x);;log(x);;x | x=-4,6 | y=-4,6 | cap=blau: eˣ · rot: ln(x) · dazwischen die Spiegelachse y = x]]"},{"id":"trigf","t":"Winkelfunktionen","kl":"6","k":6,"a":"F","tag":"M","goals":["zwischen Gradmaß und Bogenmaß umrechnen","Sinus, Cosinus und Tangens am Einheitskreis erklären","Periode, Amplitude und Wertebereich angeben","einfache Gleichungen wie sin(x) = c in einem Intervall lösen"],"ex":[{"type":"num","a":2.62,"q":"Rechne 150° ins Bogenmaß um (zwei Dezimalstellen).","s":"$150\\cdot\\dfrac{\\pi}{180}=\\dfrac{5\\pi}{6}\\approx2,62$."},{"type":"num","a":135.0,"q":"Rechne $\\dfrac{3\\pi}{4}$ ins Gradmaß um.","unit":"°","s":"$\\dfrac{3\\pi}{4}\\cdot\\dfrac{180}{\\pi}=135°$."},{"type":"num","a":1.57,"q":"Welche Periode hat $f(x)=\\sin(4x)$ (zwei Dezimalstellen)?","s":"$T=\\dfrac{2\\pi}{b}=\\dfrac{2\\pi}{4}=\\dfrac{\\pi}{2}\\approx1,57$. Der Faktor 4 lässt die Kurve viermal so schnell schwingen."},{"type":"num","a":2.0,"q":"Welchen größten Wert nimmt $f(x)=3\\sin(x)-1$ an?","s":"Der Sinus ist höchstens 1. Also $3\\cdot1-1=2$. Der Wertebereich ist $[-4;2]$."},{"type":"set","a":[30.0,150.0],"q":"Bestimme alle Lösungen von $\\sin(\\alpha)=0,5$ für $0°\\le\\alpha<360°$ (in Grad).","s":"$\\alpha_1=\\arcsin(0,5)=30°$ und $\\alpha_2=180°-30°=150°$."},{"type":"num","a":0.8,"q":"Für einen spitzen Winkel gilt $\\sin\\alpha=0,6$. Berechne $\\cos\\alpha$ ohne den Winkel zu bestimmen.","h":"$\\sin^2\\alpha+\\cos^2\\alpha=1$","s":"$\\cos^2\\alpha=1-0,36=0,64$, also $\\cos\\alpha=0,8$ (positiv, weil der Winkel spitz ist)."},{"type":"mc","q":"Welche Gleichung gilt für alle $x$?","s":"Der Cosinus ist die $x$-Koordinate am Einheitskreis. Sie bleibt gleich, wenn man den Winkel nach unten statt nach oben abträgt. Richtig wäre außerdem $\\sin^2(x)+\\cos^2(x)=1$, mit Quadraten.","o":["$\\cos(-x)=\\cos(x)$","$\\sin(-x)=\\sin(x)$","$\\cos(-x)=-\\cos(x)$","$\\sin(x)+\\cos(x)=1$"]},{"type":"num","a":60.0,"q":"Die Höhe einer Gondel eines Riesenrads ist $h(t)=20\\cdot\\sin\\!\\left(\\dfrac{\\pi}{30}\\cdot t\\right)+22$ (in m, $t$ in s). Wie lange dauert eine Umdrehung?","unit":"s","s":"$T=\\dfrac{2\\pi}{b}=2\\pi:\\dfrac{\\pi}{30}=60$ Sekunden. Zusatz: Der Radius ist 20 m, die Achse liegt 22 m hoch."}],"gen":[],"html":"<h3>Das Bogenmaß<\/h3>\n<p>Winkel kann man in Grad oder im Bogenmaß messen. Das Bogenmaß gibt an, wie lang der Bogen ist, den der Winkel aus einem Kreis mit Radius 1 schneidet. Ein voller Kreis hat den Umfang $2\\pi$, also gilt:<\/p>\n<div class=\"formula\">$360°\\ \\widehat{=}\\ 2\\pi\\qquad 180°\\ \\widehat{=}\\ \\pi\\qquad \\text{Bogenmaß}=\\text{Grad}\\cdot\\dfrac{\\pi}{180}$<\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Grad<\/th><th>30°<\/th><th>45°<\/th><th>60°<\/th><th>90°<\/th><th>180°<\/th><th>270°<\/th><th>360°<\/th><\/tr><tr><td>Bogenmaß<\/td><td>$\\frac{\\pi}{6}$<\/td><td>$\\frac{\\pi}{4}$<\/td><td>$\\frac{\\pi}{3}$<\/td><td>$\\frac{\\pi}{2}$<\/td><td>$\\pi$<\/td><td>$\\frac{3\\pi}{2}$<\/td><td>$2\\pi$<\/td><\/tr><\/table><\/div>\n<p>Bei Funktionen wie $f(x)=\\sin(x)$ wird $x$ immer im Bogenmaß gemessen. Stelle dafür den Rechner auf RAD.<\/p>\n<h3>Definition am Einheitskreis<\/h3>\n<figure><svg viewBox=\"0 0 320 300\" width=\"320\"><line x1=\"20\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"#1b1b1f\"/><line x1=\"160\" y1=\"15\" x2=\"160\" y2=\"285\" stroke=\"#1b1b1f\"/><circle cx=\"160\" cy=\"150\" r=\"110\" fill=\"none\" stroke=\"#56535d\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"150\" x2=\"248\" y2=\"84\" stroke=\"#3a5a8c\" stroke-width=\"2.5\"/><line x1=\"248\" y1=\"84\" x2=\"248\" y2=\"150\" stroke=\"#9c4f3d\" stroke-width=\"3\"/><line x1=\"160\" y1=\"150\" x2=\"248\" y2=\"150\" stroke=\"#1d6b74\" stroke-width=\"3\"/><circle cx=\"248\" cy=\"84\" r=\"5\" fill=\"#1b1b1f\"/><path d=\"M190 150 A30 30 0 0 0 184 132\" fill=\"none\" stroke=\"#1b1b1f\"/><text x=\"194\" y=\"142\" font-size=\"14\">α<\/text><text x=\"254\" y=\"78\" font-size=\"14\" font-weight=\"600\">P<\/text><text x=\"254\" y=\"122\" font-size=\"13\" fill=\"#9c4f3d\">sin α<\/text><text x=\"186\" y=\"168\" font-size=\"13\" fill=\"#1d6b74\">cos α<\/text><text x=\"274\" y=\"166\" font-size=\"12\">1<\/text><\/svg><figcaption>Der Punkt P auf dem Einheitskreis hat die Koordinaten (cos α | sin α).<\/figcaption><\/figure>\n<p>Dreht man einen Zeiger der Länge 1 um den Winkel $\\alpha$, so ist $\\cos\\alpha$ die $x$-Koordinate und $\\sin\\alpha$ die $y$-Koordinate der Zeigerspitze. Damit sind Sinus und Cosinus für <b>jeden<\/b> Winkel erklärt, auch für Winkel über 90° und für negative Winkel. Der Tangens ist $\\tan\\alpha=\\dfrac{\\sin\\alpha}{\\cos\\alpha}$.<\/p>\n<p>Aus dem Bild folgt sofort:<\/p>\n<ul><li>Alle Werte von Sinus und Cosinus liegen zwischen $-1$ und $1$.<\/li><li>Nach einer vollen Umdrehung wiederholt sich alles: Die Periode ist $2\\pi$.<\/li><li>Satz von Pythagoras im Dreieck: $\\sin^2\\alpha+\\cos^2\\alpha=1$.<\/li><li>$\\sin(-x)=-\\sin(x)$ (ungerade) und $\\cos(-x)=\\cos(x)$ (gerade).<\/li><\/ul>\n[[plot:f=sin(x);;cos(x) | x=-1,7 | y=-1.5,1.5 | cap=blau: sin(x) · rot: cos(x). Der Cosinus ist der um π/2 nach links verschobene Sinus.]]\n<h3>Die allgemeine Sinusfunktion<\/h3>\n<div class=\"formula\">$f(x)=a\\cdot\\sin(b\\cdot x+c)+d$<\/div>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Parameter<\/th><th>Wirkung<\/th><\/tr><tr><td>$a$<\/td><td>Amplitude: größter Ausschlag von der Mittellage<\/td><\/tr><tr><td>$b$<\/td><td>bestimmt die Periode: $T=\\dfrac{2\\pi}{b}$<\/td><\/tr><tr><td>$c$<\/td><td>Verschiebung in $x$-Richtung<\/td><\/tr><tr><td>$d$<\/td><td>Mittellage, Verschiebung nach oben oder unten<\/td><\/tr><\/table><\/div>\n<p>Der Wertebereich ist $[d-a;\\,d+a]$. Wie man diese Parameter aus einem Sachtext oder Graphen bestimmt, ist auf der Seite zur Zentralmatura ausführlich gezeigt. Hier lernst du, Gleichungen mit Winkelfunktionen zu lösen.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Gleichung sin(x) = c lösen<\/h4><div class=\"task\">Bestimme alle Lösungen von $\\sin(x)=0,5$ im Intervall $[0;2\\pi)$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Der Rechner liefert mit $\\arcsin(0,5)$ nur <b>eine<\/b> Lösung: $x_1=\\frac{\\pi}{6}$ (das sind 30°).<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Am Einheitskreis gibt es aber zwei Punkte mit der Höhe $0,5$: einen rechts und einen links von der $y$-Achse.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Der zweite Winkel liegt spiegelbildlich: $x_2=\\pi-x_1=\\pi-\\frac{\\pi}{6}=\\frac{5\\pi}{6}$ (150°).<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Kontrolle: $\\sin(150°)=0,5$. Stimmt.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Lösungen: $x_1=\\frac{\\pi}{6}\\approx0,52$ und $x_2=\\frac{5\\pi}{6}\\approx2,62$. Ohne Einschränkung des Intervalls kämen zu jeder Lösung noch alle Vielfachen von $2\\pi$ dazu.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Für die zweite Lösung gilt: beim Sinus $x_2=\\pi-x_1$ (in Grad $180°-x_1$), beim Cosinus $x_2=2\\pi-x_1$ (in Grad $360°-x_1$). Der Tangens hat die Periode $\\pi$, die zweite Lösung ist $x_1+\\pi$.<\/div>"},{"id":"transf","t":"Funktionen verändern und Modelle vergleichen","kl":"5–6","k":5,"a":"F","tag":"M","goals":["am Term erkennen, wie ein Graph verschoben, gestreckt oder gespiegelt wird","umgekehrt zu einer Veränderung den Term angeben","an Wertetabellen lineare, quadratische und exponentielle Zusammenhänge unterscheiden","das passende Modell für einen Sachverhalt wählen"],"ex":[{"type":"mc","q":"Wie entsteht der Graph von $g(x)=f(x-3)+2$ aus dem Graphen von $f$?","s":"Innen steht $x-3$: nach rechts. Außen steht $+2$: nach oben.","o":["Verschiebung um 3 nach rechts und um 2 nach oben","Verschiebung um 3 nach links und um 2 nach oben","Verschiebung um 3 nach rechts und um 2 nach unten","Verschiebung um 2 nach rechts und um 3 nach oben"]},{"type":"list","a":[-4.0,-1.0],"q":"Gib den Scheitelpunkt von $g(x)=(x+4)^2-1$ an ($x_S; y_S$).","s":"Die Normalparabel wurde um 4 nach links und um 1 nach unten verschoben: $S=(-4|-1)$."},{"type":"mc","q":"Was bewirkt der Übergang von $f(x)$ zu $-f(x)$?","s":"Jeder Funktionswert wechselt das Vorzeichen, jeder Punkt klappt also auf die andere Seite der $x$-Achse.","o":["Spiegelung an der $x$-Achse","Spiegelung an der $y$-Achse","Verschiebung nach unten","Drehung um 90°"]},{"type":"mc","q":"Wie verändert sich der Graph von $f(x)=\\sin(x)$ beim Übergang zu $g(x)=\\sin(2x)$?","s":"Der Faktor steht innen, wirkt also in $x$-Richtung und umgekehrt: Alles geschieht doppelt so schnell. Die Amplitude würde sich bei $2\\sin(x)$ ändern.","o":["Er wird in $x$-Richtung auf die Hälfte gestaucht, die Periode halbiert sich.","Er wird in $x$-Richtung auf das Doppelte gestreckt, die Periode verdoppelt sich.","Die Amplitude verdoppelt sich.","Er wird um 2 nach links verschoben."]},{"type":"mc","q":"Eine Tabelle zeigt für $x=0,1,2,3$ die Werte $5,\\ 8,\\ 11,\\ 14$. Welcher Zusammenhang liegt vor?","s":"Die Differenzen sind immer 3. Der Term ist $f(x)=3x+5$.","o":["linear","exponentiell","quadratisch","indirekt proportional"]},{"type":"num","a":96.0,"q":"Eine Tabelle zeigt für $x=0,1,2,3$ die Werte $3,\\ 6,\\ 12,\\ 24$. Berechne $f(5)$, wenn sich das Muster fortsetzt.","s":"Die Quotienten sind immer 2, der Zusammenhang ist exponentiell: $f(x)=3\\cdot2^x$. $f(5)=3\\cdot32=96$."},{"type":"mc","q":"Eine Tabelle zeigt für $x=1,2,3,4$ die Werte $1,\\ 4,\\ 9,\\ 16$. Welcher Zusammenhang liegt vor?","h":"Bilde die Differenzen und dann die Differenzen der Differenzen.","s":"Differenzen: $3,5,7$. Zweite Differenzen: $2,2$. Konstante zweite Differenzen bedeuten quadratisch, hier $f(x)=x^2$.","o":["quadratisch","linear","exponentiell","indirekt proportional"]},{"type":"num","a":11.0,"q":"Der Punkt $(2|5)$ liegt auf dem Graphen von $f$. Welche $y$-Koordinate hat der entsprechende Punkt auf dem Graphen von $g(x)=2\\cdot f(x)+1$?","s":"Die Stelle bleibt 2. $g(2)=2\\cdot f(2)+1=2\\cdot5+1=11$."}],"gen":[],"html":"<h3>Sechs Veränderungen<\/h3>\n<p>Ausgehend von einer Funktion $f$ entstehen neue Funktionen, wenn man außen oder innen etwas ändert. Die Regel dahinter: Änderungen <b>außen<\/b> (am Funktionswert) wirken in $y$-Richtung und so, wie man es erwartet. Änderungen <b>innen<\/b> (am Argument) wirken in $x$-Richtung und genau umgekehrt.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Neuer Term<\/th><th>Wirkung auf den Graphen<\/th><\/tr><tr><td>$f(x)+d$<\/td><td>Verschiebung um $d$ nach oben (bei $d<0$ nach unten)<\/td><\/tr><tr><td>$f(x-c)$<\/td><td>Verschiebung um $c$ nach <b>rechts<\/b> (bei $f(x+c)$ nach links)<\/td><\/tr><tr><td>$a\\cdot f(x)$<\/td><td>Streckung in $y$-Richtung mit Faktor $a$<\/td><\/tr><tr><td>$f(b\\cdot x)$<\/td><td>Stauchung in $x$-Richtung auf das $\\frac1b$-Fache<\/td><\/tr><tr><td>$-f(x)$<\/td><td>Spiegelung an der $x$-Achse<\/td><\/tr><tr><td>$f(-x)$<\/td><td>Spiegelung an der $y$-Achse<\/td><\/tr><\/table><\/div>\n[[plot:f=x*x;;(x-3)*(x-3)+1;;-x*x | x=-4,6 | y=-5,7 | cap=blau: x² · rot: (x − 3)² + 1, um 3 nach rechts und 1 nach oben · petrol: −x², gespiegelt]]\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>$f(x-3)$ verschiebt nach <b>rechts<\/b>, obwohl ein Minus dasteht. Begründung: Der neue Graph erreicht denselben Wert erst bei einem um 3 größeren $x$.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Aus einer Veränderung den Term bestimmen<\/h4><div class=\"task\">Der Graph von $f(x)=x^2$ wird an der $x$-Achse gespiegelt, mit dem Faktor 2 gestreckt, um 1 nach links und um 5 nach oben verschoben. Wie lautet der neue Term?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Spiegeln an der $x$-Achse: $-x^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Strecken mit Faktor 2 in $y$-Richtung: $-2x^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Um 1 nach links: Ersetze $x$ durch $(x+1)$. Das ergibt $-2(x+1)^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Um 5 nach oben: $g(x)=-2(x+1)^2+5$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Kontrolle über den Scheitel: Er sollte bei $(-1|5)$ liegen, und die Parabel sollte nach unten offen sein. Beides liest man an der Scheitelform ab.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Welches Modell passt? Die Tabellenprobe<\/h3>\n<p>In vielen Aufgaben sollst du aus einer Wertetabelle entscheiden, welcher Funktionstyp vorliegt. Wenn die $x$-Werte in gleichen Schritten wachsen, genügen zwei Rechnungen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Funktionstyp<\/th><th>Kennzeichen in der Tabelle<\/th><th>Sprachliches Signal<\/th><\/tr><tr><td>linear<\/td><td><b>Differenzen<\/b> benachbarter Werte sind gleich<\/td><td>„nimmt pro … um 5 Stück zu“<\/td><\/tr><tr><td>exponentiell<\/td><td><b>Quotienten<\/b> benachbarter Werte sind gleich<\/td><td>„nimmt pro … um 5 % zu“, „verdoppelt sich“<\/td><\/tr><tr><td>quadratisch<\/td><td>die Differenzen der Differenzen sind gleich<\/td><td>„proportional zum Quadrat“<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Tabellenprobe<\/h4><div class=\"task\">Welcher Funktionstyp passt zu den Werten $f(0)=80$, $f(1)=60$, $f(2)=45$, $f(3)=33,75$?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Differenzen: $60-80=-20$, $45-60=-15$, $33,75-45=-11,25$. Nicht gleich, also nicht linear.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Quotienten: $60:80=0,75$, $45:60=0,75$, $33,75:45=0,75$. Gleich.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Es liegt eine exponentielle Abnahme mit dem Faktor $a=0,75$ vor, also um 25 % pro Schritt.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Funktionsterm: $f(x)=80\\cdot0,75^x$. Kontrolle: $f(3)=80\\cdot0,421875=33,75$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"folgen","t":"Folgen und Reihen","kl":"6","k":6,"a":"F","tag":"S","goals":["Folgen explizit und rekursiv angeben","arithmetische und geometrische Folgen erkennen und ihre Glieder und Summen berechnen","den Grenzwert einfacher Folgen bestimmen","die unendliche geometrische Reihe anwenden"],"ex":[{"type":"num","a":83.0,"q":"Arithmetische Folge mit $a_1=7$ und $d=4$. Berechne $a_{20}$.","s":"$a_{20}=7+19\\cdot4=83$."},{"type":"num","a":900.0,"q":"Berechne für dieselbe Folge ($a_1=7$, $d=4$) die Summe der ersten 20 Glieder.","s":"$s_{20}=\\dfrac{20}{2}\\cdot(7+83)=10\\cdot90=900$."},{"type":"num","a":1536.0,"q":"Geometrische Folge mit $b_1=3$ und $q=2$. Berechne $b_{10}$.","s":"$b_{10}=3\\cdot2^9=3\\cdot512=1536$."},{"type":"num","a":3069.0,"q":"Berechne für dieselbe Folge ($b_1=3$, $q=2$) die Summe der ersten 10 Glieder.","s":"$s_{10}=3\\cdot\\dfrac{2^{10}-1}{2-1}=3\\cdot1023=3069$."},{"type":"num","a":16.0,"q":"Berechne die Summe der unendlichen Reihe $8+4+2+1+\\dots$","s":"$b_1=8$ und $q=0,5$. $s=\\dfrac{8}{1-0,5}=16$."},{"type":"num","a":3.0,"q":"Bestimme den Grenzwert der Folge $a_n=\\dfrac{3n+1}{n+2}$.","s":"Durch $n$ dividieren: $\\dfrac{3+\\frac1n}{1+\\frac2n}\\to\\dfrac31=3$."},{"type":"num","a":17.0,"q":"Eine Folge ist rekursiv gegeben: $a_1=3$ und $a_{n+1}=2a_n-1$. Berechne $a_4$.","s":"$a_2=2\\cdot3-1=5$, $a_3=2\\cdot5-1=9$, $a_4=2\\cdot9-1=17$."},{"type":"mc","q":"Welche Folge ist konvergent?","s":"$\\frac1n$ nähert sich 0. $(-1)^n$ springt ewig zwischen $-1$ und $1$ hin und her, die beiden anderen wachsen über alle Grenzen.","o":["$a_n=\\dfrac{1}{n}$","$a_n=(-1)^n$","$a_n=n^2$","$a_n=2^n$"]},{"type":"num","tol":1.0,"a":11168.71,"q":"Jemand zahlt zehn Jahre lang jeweils am Jahresanfang 1 000 € auf ein Sparkonto mit 2 % Zinsen pro Jahr. Wie groß ist das Guthaben am Ende des zehnten Jahres?","unit":"€","h":"Die erste Einzahlung wird zehnmal verzinst, die letzte einmal. Das ist eine geometrische Reihe mit $b_1=1000\\cdot1,02$.","s":"$1000\\cdot1,02+1000\\cdot1,02^2+\\dots+1000\\cdot1,02^{10}=1020\\cdot\\dfrac{1,02^{10}-1}{0,02}\\approx1020\\cdot10,9497\\approx11\\,168,71$ €."}],"gen":["arith","geom"],"html":"<h3>Was eine Folge ist<\/h3>\n<p>Eine Folge ist eine Funktion, deren Definitionsmenge die natürlichen Zahlen sind. Statt $f(n)$ schreibt man $a_n$ und nennt das das $n$-te Glied. Es gibt zwei Arten, eine Folge anzugeben:<\/p>\n<ul><li><b>explizit:<\/b> eine Formel, die $a_n$ direkt aus $n$ berechnet, etwa $a_n=3n+1$<\/li><li><b>rekursiv:<\/b> ein Startwert und eine Regel, wie man vom einen Glied zum nächsten kommt, etwa $a_1=4$ und $a_{n+1}=a_n+3$<\/li><\/ul>\n<h3>Arithmetische und geometrische Folgen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th><\/th><th>arithmetische Folge<\/th><th>geometrische Folge<\/th><\/tr><tr><td>Bildungsgesetz<\/td><td>immer dieselbe Zahl $d$ <b>addieren<\/b><\/td><td>immer mit derselben Zahl $q$ <b>multiplizieren<\/b><\/td><\/tr><tr><td>rekursiv<\/td><td>$a_{n+1}=a_n+d$<\/td><td>$b_{n+1}=b_n\\cdot q$<\/td><\/tr><tr><td>explizit<\/td><td>$a_n=a_1+(n-1)\\cdot d$<\/td><td>$b_n=b_1\\cdot q^{\\,n-1}$<\/td><\/tr><tr><td>Summe der ersten $n$ Glieder<\/td><td>$s_n=\\dfrac{n}{2}\\cdot(a_1+a_n)$<\/td><td>$s_n=b_1\\cdot\\dfrac{q^n-1}{q-1}$<\/td><\/tr><tr><td>passt zu<\/td><td>linearen Funktionen<\/td><td>Exponentialfunktionen<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>In den expliziten Formeln steht $(n-1)$ und nicht $n$. Vom ersten zum zehnten Glied sind es nur neun Schritte.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Summe einer arithmetischen Folge<\/h4><div class=\"task\">In einem Hörsaal hat die erste Reihe 18 Plätze, jede weitere Reihe 2 Plätze mehr. Wie viele Plätze gibt es in 25 Reihen?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Arithmetische Folge mit $a_1=18$ und $d=2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Plätze in der letzten Reihe: $a_{25}=18+24\\cdot2=66$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Summe: $s_{25}=\\dfrac{25}{2}\\cdot(18+66)=12,5\\cdot84=1050$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Antwort: 1050 Plätze. Die Formel funktioniert, weil erste und letzte, zweite und vorletzte Reihe zusammen immer gleich viele Plätze haben.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Grenzwerte<\/h3>\n<p>Manche Folgen nähern sich mit wachsendem $n$ immer mehr einer festen Zahl. Diese Zahl heißt <b>Grenzwert<\/b>, die Folge heißt konvergent. Man schreibt $\\lim\\limits_{n\\to\\infty}a_n=a$. Die wichtigste Grundfolge ist $\\frac1n$: Sie geht gegen 0.<\/p>\n<p>Bei Brüchen aus Polynomen dividierst du Zähler und Nenner durch die höchste Potenz von $n$. Alle Glieder der Form $\\frac{\\text{Zahl}}{n}$ verschwinden dann im Grenzwert.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Grenzwert berechnen<\/h4><div class=\"task\">Bestimme $\\lim\\limits_{n\\to\\infty}\\dfrac{4n^2-3n}{2n^2+5}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die höchste Potenz ist $n^2$. Dividiere jedes Glied in Zähler und Nenner durch $n^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\dfrac{4-\\frac{3}{n}}{2+\\frac{5}{n^2}}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Für $n\\to\\infty$ gehen $\\frac3n$ und $\\frac{5}{n^2}$ gegen 0.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Übrig bleibt $\\dfrac{4}{2}=2$. Der Grenzwert ist 2. Kurzregel bei gleichem Grad oben und unten: Quotient der Vorzahlen der höchsten Potenzen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Die unendliche geometrische Reihe<\/h3>\n<p>Addiert man unendlich viele Glieder, kann trotzdem eine endliche Summe herauskommen. Bei einer geometrischen Folge ist das genau dann der Fall, wenn $|q|<1$ ist:<\/p>\n<div class=\"formula\">$s=b_1+b_1q+b_1q^2+\\dots=\\dfrac{b_1}{1-q}\\qquad\\text{für }|q|<1$<\/div>\n<p>Beispiel: $\\frac12+\\frac14+\\frac18+\\dots=\\dfrac{0,5}{1-0,5}=1$.<\/p>"},{"id":"trig1","t":"Trigonometrie im rechtwinkligen Dreieck","kl":"5","k":5,"a":"V","tag":"M","goals":["Sinus, Cosinus und Tangens als Seitenverhältnisse angeben","fehlende Seiten und Winkel berechnen","Höhen- und Tiefenwinkel in Skizzen einzeichnen","Steigungen in Prozent in Winkel umrechnen"],"ex":[{"type":"num","a":22.62,"q":"In einem rechtwinkligen Dreieck ist die Gegenkathete von $\\alpha$ 5 cm lang, die Hypotenuse 13 cm. Berechne $\\alpha$ (zwei Dezimalstellen).","unit":"°","s":"$\\sin\\alpha=\\dfrac{5}{13}$, also $\\alpha=\\arcsin\\left(\\dfrac{5}{13}\\right)\\approx22,62°$."},{"type":"num","a":5.64,"q":"Eine 6 m lange Leiter lehnt unter 70° zum Boden an einer Wand. In welcher Höhe berührt sie die Wand (zwei Dezimalstellen)?","unit":"m","s":"Die Leiter ist die Hypotenuse, die Höhe die Gegenkathete: $h=6\\cdot\\sin(70°)\\approx5,64$ m."},{"type":"num","tol":0.03,"a":24.99,"q":"Aus 40 m Entfernung sieht man die Spitze eines Turms unter dem Höhenwinkel 32° (Augenhöhe wird vernachlässigt). Wie hoch ist der Turm (zwei Dezimalstellen)?","unit":"m","s":"Beide Katheten sind beteiligt: $\\tan(32°)=\\dfrac{h}{40}$, also $h=40\\cdot\\tan(32°)\\approx24,99$ m."},{"type":"num","a":6.84,"q":"Eine Straße hat 12 % Steigung. Wie groß ist ihr Steigungswinkel (zwei Dezimalstellen)?","unit":"°","s":"$\\tan\\alpha=0,12$, also $\\alpha=\\arctan(0,12)\\approx6,84°$."},{"type":"num","a":13.95,"q":"In einem rechtwinkligen Dreieck ist die Gegenkathete von $\\alpha=35°$ genau 8 cm lang. Berechne die Hypotenuse (zwei Dezimalstellen).","unit":"cm","h":"Hier steht die gesuchte Größe im Nenner.","s":"$\\sin(35°)=\\dfrac{8}{c}$, also $c=\\dfrac{8}{\\sin(35°)}\\approx13,95$ cm."},{"type":"mc","q":"Welches Verhältnis beschreibt $\\cos\\alpha$ im rechtwinkligen Dreieck?","s":"Der Cosinus verbindet die anliegende Kathete mit der Hypotenuse.","o":["Ankathete durch Hypotenuse","Gegenkathete durch Hypotenuse","Gegenkathete durch Ankathete","Hypotenuse durch Ankathete"]},{"type":"num","a":53.13,"q":"Ein gleichschenkliges Dreieck hat 10 cm lange Schenkel und eine 12 cm lange Basis. Berechne einen Basiswinkel (zwei Dezimalstellen).","unit":"°","h":"Die Höhe auf die Basis teilt das Dreieck in zwei rechtwinklige Dreiecke.","s":"Im halben Dreieck ist die Ankathete 6 cm und die Hypotenuse 10 cm: $\\cos\\alpha=0,6$, also $\\alpha\\approx53,13°$."},{"type":"num","tol":0.4,"a":320.19,"q":"Von einem 45 m hohen Leuchtturm sieht man ein Boot unter dem Tiefenwinkel 8°. Wie weit ist das Boot vom Fuß des Turms entfernt (zwei Dezimalstellen)?","unit":"m","s":"Der Tiefenwinkel findet sich als Höhenwinkel beim Boot wieder. $\\tan(8°)=\\dfrac{45}{e}$, also $e=\\dfrac{45}{\\tan(8°)}\\approx320,19$ m."}],"gen":["rw"],"html":"<h3>Die drei Seitenverhältnisse<\/h3>\n<p>Im rechtwinkligen Dreieck heißt die Seite gegenüber dem rechten Winkel <b>Hypotenuse<\/b>. Sie ist immer die längste Seite. Die beiden anderen Seiten heißen Katheten. Von einem spitzen Winkel $\\alpha$ aus gesehen gibt es die <b>Gegenkathete<\/b> (gegenüber von $\\alpha$) und die <b>Ankathete<\/b> (sie liegt an $\\alpha$ an).<\/p>\n<figure><svg viewBox=\"0 0 380 230\" width=\"380\"><polygon points=\"40,190 330,190 330,50\" fill=\"#f6efdf\" stroke=\"#1b1b1f\" stroke-width=\"2\"/><rect x=\"310\" y=\"170\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"#1b1b1f\"/><path d=\"M90 190 A50 50 0 0 0 85 168\" fill=\"none\" stroke=\"#1b1b1f\"/><text x=\"98\" y=\"182\" font-size=\"15\">α<\/text><text x=\"150\" y=\"108\" font-size=\"14\" fill=\"#3a5a8c\" font-weight=\"600\">Hypotenuse c<\/text><text x=\"340\" y=\"125\" font-size=\"14\" fill=\"#9c4f3d\" font-weight=\"600\">a<\/text><text x=\"150\" y=\"212\" font-size=\"14\" fill=\"#1d6b74\" font-weight=\"600\">Ankathete b<\/text><text x=\"240\" y=\"150\" font-size=\"12\" fill=\"#9c4f3d\">Gegenkathete<\/text><\/svg><figcaption>Bezeichnungen aus der Sicht des Winkels α<\/figcaption><\/figure>\n<div class=\"formula\">$\\sin\\alpha=\\dfrac{\\text{Gegenkathete}}{\\text{Hypotenuse}}\\qquad\\cos\\alpha=\\dfrac{\\text{Ankathete}}{\\text{Hypotenuse}}\\qquad\\tan\\alpha=\\dfrac{\\text{Gegenkathete}}{\\text{Ankathete}}$<\/div>\n<p>Diese Verhältnisse hängen nur vom Winkel ab und nicht von der Größe des Dreiecks. Deshalb kann man mit ihnen rechnen.<\/p>\n<h3>Welche Funktion nehme ich?<\/h3>\n<p>Schreibe auf, welche zwei Seiten im Spiel sind (eine gegebene und eine gesuchte, oder zwei gegebene). Genau eine der drei Funktionen verbindet diese beiden Seiten.<\/p>\n<ul><li>Gegenkathete und Hypotenuse: Sinus<\/li><li>Ankathete und Hypotenuse: Cosinus<\/li><li>beide Katheten: Tangens<\/li><\/ul>\n<p>Ist ein <b>Winkel<\/b> gesucht, brauchst du die Umkehrfunktion: $\\alpha=\\arcsin(\\dots)$, auf dem Rechner meist $\\sin^{-1}$.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Kontrolliere vor jeder Rechnung, ob dein Rechner auf Grad (DEG) steht. Mit der falschen Einstellung sind alle Ergebnisse falsch, ohne dass eine Fehlermeldung kommt. Schnelltest: $\\sin(30)$ muss $0,5$ ergeben.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Seite berechnen<\/h4><div class=\"task\">Eine 5 m lange Rampe schließt mit dem Boden einen Winkel von 12° ein. Welche Höhe überwindet sie, und wie lang ist ihr Grundriss?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Skizze: Die Rampe ist die Hypotenuse ($c=5$). Die Höhe $h$ liegt dem Winkel gegenüber, der Grundriss $g$ liegt am Winkel an.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Höhe: Gegenkathete und Hypotenuse, also Sinus. $\\sin(12°)=\\dfrac{h}{5}$, daher $h=5\\cdot\\sin(12°)\\approx1,04$ m.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Grundriss: Ankathete und Hypotenuse, also Cosinus. $g=5\\cdot\\cos(12°)\\approx4,89$ m.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Kontrolle mit Pythagoras: $1,04^2+4,89^2\\approx25$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Winkel berechnen<\/h4><div class=\"task\">Ein Baum wirft einen 9 m langen Schatten und ist 6,5 m hoch. Unter welchem Winkel treffen die Sonnenstrahlen auf den Boden?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Skizze: Baum und Schatten sind die beiden Katheten, der Sonnenstrahl ist die Hypotenuse. Gesucht ist der Winkel am Boden.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Aus Sicht dieses Winkels ist der Baum die Gegenkathete und der Schatten die Ankathete. Beide Katheten: Tangens.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$\\tan\\alpha=\\dfrac{6,5}{9}\\approx0,7222$<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>$\\alpha=\\arctan(0,7222)\\approx35,84°$<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Höhenwinkel, Tiefenwinkel und Steigung<\/h3>\n<p>Der <b>Höhenwinkel<\/b> wird von der Waagrechten nach oben gemessen, der <b>Tiefenwinkel<\/b> von der Waagrechten nach unten. Der Tiefenwinkel vom Turm zum Schiff ist gleich groß wie der Höhenwinkel vom Schiff zum Turm (Wechselwinkel an Parallelen).<\/p>\n<p>Eine Steigung von 12 % bedeutet: 12 m Höhenunterschied auf 100 m <b>waagrechter<\/b> Strecke. Das ist genau der Tangens: $\\tan\\alpha=0,12$.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Besondere Werte, die man kennen sollte: $\\sin30°=\\cos60°=0,5$ und $\\tan45°=1$.<\/div>"},{"id":"trig2","t":"Sinussatz, Cosinussatz und das allgemeine Dreieck","kl":"5","k":5,"a":"V","tag":"S","goals":["entscheiden, wann Sinussatz und wann Cosinussatz gebraucht wird","fehlende Seiten und Winkel in beliebigen Dreiecken berechnen","den Flächeninhalt mit der trigonometrischen Formel bestimmen","Vermessungsaufgaben lösen"],"ex":[{"type":"num","a":8.19,"q":"Gegeben sind $a=7$, $b=9$ und der eingeschlossene Winkel $\\gamma=60°$. Berechne $c$ (zwei Dezimalstellen).","s":"$c^2=49+81-2\\cdot7\\cdot9\\cdot\\cos60°=130-63=67$, also $c=\\sqrt{67}\\approx8,19$."},{"type":"num","a":78.46,"q":"Ein Dreieck hat die Seiten 5, 6 und 7. Berechne den größten Winkel (zwei Dezimalstellen).","unit":"°","h":"Der größte Winkel liegt der Seite 7 gegenüber.","s":"$\\cos\\gamma=\\dfrac{5^2+6^2-7^2}{2\\cdot5\\cdot6}=\\dfrac{12}{60}=0,2$, also $\\gamma\\approx78,46°$."},{"type":"num","a":11.28,"q":"Gegeben sind $\\alpha=40°$, $\\beta=65°$ und $a=8$. Berechne $b$ (zwei Dezimalstellen).","s":"Sinussatz: $b=\\dfrac{a\\cdot\\sin\\beta}{\\sin\\alpha}=\\dfrac{8\\cdot\\sin65°}{\\sin40°}\\approx11,28$."},{"type":"num","a":15.0,"q":"Berechne den Flächeninhalt eines Dreiecks mit $a=6$, $b=10$ und eingeschlossenem Winkel $\\gamma=30°$.","s":"$A=\\dfrac12\\cdot6\\cdot10\\cdot\\sin30°=30\\cdot0,5=15$."},{"type":"mc","q":"Von einem Dreieck sind alle drei Seiten bekannt. Womit berechnest du den ersten Winkel?","s":"Es gibt kein Paar aus Seite und gegenüberliegendem Winkel, der Sinussatz fällt also aus. Pythagoras gilt nur im rechtwinkligen Dreieck.","o":["mit dem Cosinussatz","mit dem Sinussatz","mit dem Satz von Pythagoras","mit der Winkelsumme"]},{"type":"num","a":0.5,"q":"Berechne $\\sin(150°)$ ohne Technologie.","s":"$\\sin(150°)=\\sin(180°-150°)=\\sin(30°)=0,5$."},{"type":"num","a":8.48,"q":"Zwei Schiffe verlassen denselben Hafen. Das eine ist 8 km, das andere 11 km entfernt, ihre Kurse schließen 50° ein. Wie weit sind die Schiffe voneinander entfernt (zwei Dezimalstellen)?","unit":"km","s":"SWS, also Cosinussatz: $d^2=64+121-2\\cdot8\\cdot11\\cdot\\cos50°\\approx185-113,13=71,87$, daher $d\\approx8,48$ km."},{"type":"num","a":150.0,"q":"Ein stumpfer Winkel erfüllt $\\sin\\alpha=0,5$. Wie groß ist er?","unit":"°","s":"Der Rechner liefert 30°. Der stumpfe Winkel mit demselben Sinus ist $180°-30°=150°$."}],"gen":["cos"],"html":"<h3>Winkel über 90°<\/h3>\n<p>Im allgemeinen Dreieck können stumpfe Winkel vorkommen. Am Einheitskreis sieht man, wie Sinus und Cosinus dort aussehen:<\/p>\n<div class=\"formula\">$\\sin(180°-\\alpha)=\\sin\\alpha\\qquad\\cos(180°-\\alpha)=-\\cos\\alpha$<\/div>\n<p>Der Sinus eines stumpfen Winkels ist also positiv und gleich dem seines Ergänzungswinkels. Der Cosinus eines stumpfen Winkels ist negativ.<\/p>\n<h3>Die beiden Sätze<\/h3>\n<p>In jedem Dreieck mit den Seiten $a,b,c$ und den gegenüberliegenden Winkeln $\\alpha,\\beta,\\gamma$ gilt:<\/p>\n<div class=\"formula\"><b>Sinussatz:<\/b>$\\quad\\dfrac{a}{\\sin\\alpha}=\\dfrac{b}{\\sin\\beta}=\\dfrac{c}{\\sin\\gamma}$<\/div>\n<div class=\"formula\"><b>Cosinussatz:<\/b>$\\quad c^2=a^2+b^2-2ab\\cdot\\cos\\gamma$<\/div>\n<p>Der Cosinussatz ist der Satz von Pythagoras mit einem Korrekturglied. Für $\\gamma=90°$ ist $\\cos\\gamma=0$, und es bleibt $c^2=a^2+b^2$.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Gegeben<\/th><th>Abkürzung<\/th><th>Erster Schritt<\/th><\/tr><tr><td>drei Seiten<\/td><td>SSS<\/td><td>Cosinussatz, nach dem Winkel umgestellt<\/td><\/tr><tr><td>zwei Seiten und der eingeschlossene Winkel<\/td><td>SWS<\/td><td>Cosinussatz<\/td><\/tr><tr><td>eine Seite und zwei Winkel<\/td><td>WSW<\/td><td>dritter Winkel über die Winkelsumme, dann Sinussatz<\/td><\/tr><tr><td>zwei Seiten und ein gegenüberliegender Winkel<\/td><td>SSW<\/td><td>Sinussatz<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Faustregel: Der Sinussatz braucht ein vollständiges Paar aus Seite und gegenüberliegendem Winkel. Gibt es kein solches Paar, nimm den Cosinussatz.<\/div>\n<h3>Flächeninhalt<\/h3>\n<div class=\"formula\">$A=\\dfrac12\\cdot a\\cdot b\\cdot\\sin\\gamma$<\/div>\n<p>In Worten: halbes Produkt zweier Seiten mal Sinus des eingeschlossenen Winkels.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Dreieck aus drei Seiten<\/h4><div class=\"task\">Ein Dreieck hat die Seiten $a=8$, $b=5$ und $c=7$. Berechne alle Winkel.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Drei Seiten, kein Paar aus Seite und Winkel: Cosinussatz. Beginne mit dem größten Winkel. Er liegt der längsten Seite gegenüber, das ist $\\alpha$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Cosinussatz für $\\alpha$: $a^2=b^2+c^2-2bc\\cos\\alpha$. Umstellen: $\\cos\\alpha=\\dfrac{b^2+c^2-a^2}{2bc}=\\dfrac{25+49-64}{70}=\\dfrac{10}{70}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$\\alpha=\\arccos\\left(\\frac17\\right)\\approx81,79°$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Jetzt gibt es ein Paar. Sinussatz für $\\beta$: $\\dfrac{\\sin\\beta}{5}=\\dfrac{\\sin81,79°}{8}$, also $\\sin\\beta\\approx0,6186$ und $\\beta\\approx38,21°$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Der dritte Winkel über die Winkelsumme: $\\gamma=180°-81,79°-38,21°=60°$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Warum mit dem größten Winkel beginnen? Nur er kann stumpf sein. Der Cosinussatz erkennt das am negativen Cosinus, der Arcussinus würde es übersehen.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Vermessungsaufgabe<\/h4><div class=\"task\">Von den Punkten $A$ und $B$ eines 120 m langen Uferstücks sieht man einen Baum $C$ am anderen Ufer. Gemessen werden die Winkel $\\alpha=65°$ bei $A$ und $\\beta=48°$ bei $B$. Wie breit ist der Fluss?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Dritter Winkel: $\\gamma=180°-65°-48°=67°$. Er liegt der bekannten Seite $c=120$ gegenüber. Damit gibt es ein Paar.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Sinussatz für die Seite $b=\\overline{AC}$: $\\dfrac{b}{\\sin48°}=\\dfrac{120}{\\sin67°}$, also $b\\approx96,88$ m.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Die Flussbreite ist die Höhe von $C$ auf die Uferlinie. Im rechtwinkligen Teildreieck bei $A$ gilt: $h=b\\cdot\\sin65°$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>$h\\approx96,88\\cdot0,9063\\approx87,80$ m. Der Fluss ist rund 88 m breit.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Im Fall SSW kann es zwei verschiedene Dreiecke geben, wenn der gegebene Winkel der <b>kürzeren<\/b> Seite gegenüberliegt. Der Rechner liefert dann nur den spitzen Winkel. Prüfe, ob auch $180°$ minus dieser Winkel möglich ist.<\/div>"},{"id":"vektor","t":"Vektoren: Grundlagen und Rechnen","kl":"5–6","k":5,"a":"V","tag":"M","goals":["Vektoren als Pfeile und als Zahlenlisten deuten","den Vektor zwischen zwei Punkten aufstellen","Vektoren addieren, vervielfachen und ihren Betrag berechnen","Mittelpunkte und Parallelität bestimmen"],"ex":[{"type":"list","a":[3.0,4.0,-4.0],"q":"Gegeben sind $A=(2|-1|3)$ und $B=(5|3|-1)$. Gib die Koordinaten von $\\overrightarrow{AB}$ an.","s":"$B-A=(5-2\\mid3-(-1)\\mid-1-3)=(3\\mid4\\mid-4)$."},{"type":"num","a":13.0,"q":"Berechne den Betrag des Vektors $\\begin{pmatrix}3\\\\4\\\\12\\end{pmatrix}$.","s":"$\\sqrt{9+16+144}=\\sqrt{169}=13$."},{"type":"list","a":[4.0,1.0],"q":"Bestimme den Mittelpunkt der Strecke von $A=(1|4)$ nach $B=(7|-2)$.","s":"$M=\\dfrac12(A+B)=\\left(\\dfrac{1+7}{2}\\,\\Big|\\,\\dfrac{4-2}{2}\\right)=(4|1)$."},{"type":"list","a":[-2.0,8.0],"q":"Gegeben sind $\\vec a=\\begin{pmatrix}1\\\\3\\end{pmatrix}$ und $\\vec b=\\begin{pmatrix}4\\\\-2\\end{pmatrix}$. Berechne $2\\vec a-\\vec b$.","s":"$\\begin{pmatrix}2\\\\6\\end{pmatrix}-\\begin{pmatrix}4\\\\-2\\end{pmatrix}=\\begin{pmatrix}-2\\\\8\\end{pmatrix}$."},{"type":"num","a":9.0,"q":"Für welchen Wert von $t$ sind $\\begin{pmatrix}2\\\\-3\\end{pmatrix}$ und $\\begin{pmatrix}-6\\\\t\\end{pmatrix}$ parallel?","h":"Mit welcher Zahl wurde die erste Koordinate multipliziert?","s":"$-6=(-3)\\cdot2$, also ist der Faktor $-3$. Dann muss $t=(-3)\\cdot(-3)=9$ sein."},{"type":"list","a":[0.6,0.8],"q":"Bestimme den Einheitsvektor in Richtung von $\\begin{pmatrix}6\\\\8\\end{pmatrix}$.","s":"Betrag: $\\sqrt{36+64}=10$. Einheitsvektor: $\\dfrac{1}{10}\\begin{pmatrix}6\\\\8\\end{pmatrix}=\\begin{pmatrix}0,6\\\\0,8\\end{pmatrix}$."},{"type":"list","a":[3.0,3.0],"q":"Bestimme den Schwerpunkt des Dreiecks mit $A=(0|0)$, $B=(6|0)$ und $C=(3|9)$.","s":"$S=\\dfrac13(A+B+C)=\\left(\\dfrac{0+6+3}{3}\\,\\Big|\\,\\dfrac{0+0+9}{3}\\right)=(3|3)$."},{"type":"list","a":[2.0,4.0],"q":"Von einem Parallelogramm $ABCD$ sind $A=(1|1)$, $B=(5|2)$ und $C=(6|5)$ bekannt. Bestimme $D$.","s":"$D=A+\\overrightarrow{BC}=(1|1)+(1|3)=(2|4)$."}],"gen":["abst"],"html":"<h3>Zwei Sichtweisen<\/h3>\n<p>Ein Vektor ist eine geordnete Liste von Zahlen, in der Ebene $\\vec a=\\begin{pmatrix}a_1\\\\a_2\\end{pmatrix}$, im Raum mit drei Koordinaten. Geometrisch ist er ein <b>Pfeil<\/b>: eine Verschiebung mit Richtung und Länge. Wo der Pfeil beginnt, spielt keine Rolle. Alle gleich langen, gleich gerichteten Pfeile sind derselbe Vektor.<\/p>\n<p>In Sachaufgaben sind Vektoren oft einfach Listen, zum Beispiel die Stückzahlen oder die Preise mehrerer Produkte. Gerechnet wird in beiden Fällen gleich.<\/p>\n<h3>Die Grundrechnungen<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Rechnung<\/th><th>Vorschrift<\/th><th>Geometrische Bedeutung<\/th><\/tr><tr><td>Vektor von $A$ nach $B$<\/td><td>$\\overrightarrow{AB}=B-A$ („Spitze minus Schaft“)<\/td><td>Pfeil von $A$ nach $B$<\/td><\/tr><tr><td>Addition<\/td><td>koordinatenweise addieren<\/td><td>Pfeile aneinanderhängen<\/td><\/tr><tr><td>Vielfaches $t\\cdot\\vec a$<\/td><td>jede Koordinate mal $t$<\/td><td>Pfeil strecken, bei $t<0$ umdrehen<\/td><\/tr><tr><td>Betrag<\/td><td>$\\lvert\\vec a\\rvert=\\sqrt{a_1^2+a_2^2+a_3^2}$<\/td><td>Länge des Pfeils<\/td><\/tr><tr><td>Gegenvektor<\/td><td>$-\\vec a$<\/td><td>gleicher Pfeil in Gegenrichtung<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Zwei Vektoren sind <b>parallel<\/b>, wenn einer ein Vielfaches des anderen ist: $\\vec b=t\\cdot\\vec a$. Dann müssen alle Koordinaten im selben Verhältnis stehen.<\/div>\n<h3>Nützliche Formeln<\/h3>\n<div class=\"formula\">$M_{AB}=\\dfrac12\\cdot(A+B)\\qquad S=\\dfrac13\\cdot(A+B+C)\\qquad \\vec a_0=\\dfrac{1}{|\\vec a|}\\cdot\\vec a$<\/div>\n<p>Mittelpunkt einer Strecke, Schwerpunkt eines Dreiecks und Einheitsvektor (Länge 1 in Richtung von $\\vec a$). Den Abstand zweier Punkte erhältst du als Betrag des Vektors zwischen ihnen.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Vom Punkt zum Punkt<\/h4><div class=\"task\">Gegeben sind $A=(1|-2|4)$ und $B=(5|1|-8)$. Berechne den Vektor von $A$ nach $B$, den Abstand der Punkte und den Punkt $C$, der von $A$ aus in derselben Richtung doppelt so weit entfernt liegt wie $B$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Spitze minus Schaft: $\\overrightarrow{AB}=\\begin{pmatrix}5-1\\\\1-(-2)\\\\-8-4\\end{pmatrix}=\\begin{pmatrix}4\\\\3\\\\-12\\end{pmatrix}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Abstand: $|\\overrightarrow{AB}|=\\sqrt{16+9+144}=\\sqrt{169}=13$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Doppelt so weit in derselben Richtung: $C=A+2\\cdot\\overrightarrow{AB}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>$C=\\begin{pmatrix}1\\\\-2\\\\4\\end{pmatrix}+\\begin{pmatrix}8\\\\6\\\\-24\\end{pmatrix}=\\begin{pmatrix}9\\\\4\\\\-20\\end{pmatrix}$, also $C=(9|4|-20)$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Fehlenden Eckpunkt eines Parallelogramms finden<\/h4><div class=\"task\">Von einem Parallelogramm $ABCD$ sind $A=(2|1)$, $B=(7|2)$ und $C=(9|6)$ bekannt. Bestimme $D$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>In einem Parallelogramm sind gegenüberliegende Seiten gleich lang und parallel. Als Vektoren: $\\overrightarrow{AD}=\\overrightarrow{BC}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\overrightarrow{BC}=C-B=\\begin{pmatrix}2\\\\4\\end{pmatrix}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$D=A+\\overrightarrow{BC}=\\begin{pmatrix}2+2\\\\1+4\\end{pmatrix}$, also $D=(4|5)$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Kontrolle über die andere Seite: $\\overrightarrow{AB}=\\begin{pmatrix}5\\\\1\\end{pmatrix}$ und $\\overrightarrow{DC}=C-D=\\begin{pmatrix}5\\\\1\\end{pmatrix}$. Gleich, passt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Häufig vertauscht: $\\overrightarrow{AB}=B-A$ und nicht $A-B$. Wer es verkehrt rechnet, bekommt den Gegenvektor. Der Betrag stimmt dann noch, die Richtung nicht mehr.<\/div>"},{"id":"skalar","t":"Skalarprodukt, Normalvektoren und Kreuzprodukt","kl":"5–6","k":5,"a":"V","tag":"M","goals":["das Skalarprodukt berechnen und im Sachzusammenhang deuten","prüfen, ob zwei Vektoren normal aufeinander stehen","Normalvektoren in der Ebene angeben","das Kreuzprodukt berechnen und damit Flächen bestimmen"],"ex":[{"type":"num","a":-3.0,"q":"Berechne das Skalarprodukt von $\\begin{pmatrix}2\\\\-1\\\\3\\end{pmatrix}$ und $\\begin{pmatrix}4\\\\5\\\\-2\\end{pmatrix}$.","s":"$2\\cdot4+(-1)\\cdot5+3\\cdot(-2)=8-5-6=-3$. Das negative Vorzeichen zeigt: Der Winkel zwischen den Vektoren ist stumpf."},{"type":"num","a":-2.0,"q":"Für welchen Wert von $t$ stehen $\\begin{pmatrix}3\\\\t\\end{pmatrix}$ und $\\begin{pmatrix}4\\\\6\\end{pmatrix}$ normal aufeinander?","s":"Das Skalarprodukt muss 0 sein: $12+6t=0$, also $t=-2$."},{"type":"num","tol":0.02,"a":53.4,"q":"Berechne den Winkel zwischen $\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ und $\\begin{pmatrix}2\\\\0\\\\1\\end{pmatrix}$ in Grad (zwei Dezimalstellen).","unit":"°","s":"Skalarprodukt: $2+0+2=4$. Beträge: $3$ und $\\sqrt5$. $\\cos\\varphi=\\dfrac{4}{3\\sqrt5}\\approx0,5963$, also $\\varphi\\approx53,40°$."},{"type":"mc","q":"Welcher Vektor steht normal auf $\\begin{pmatrix}5\\\\-2\\end{pmatrix}$?","h":"Berechne jeweils das Skalarprodukt.","s":"$5\\cdot2+(-2)\\cdot5=0$. Bei $\\binom{-5}{2}$ ergibt sich $-29$ (das ist der Gegenvektor), bei $\\binom{5}{2}$ ergibt sich $21$, bei $\\binom{-2}{5}$ ergibt sich $-20$.","o":["$\\begin{pmatrix}2\\\\5\\end{pmatrix}$","$\\begin{pmatrix}-5\\\\2\\end{pmatrix}$","$\\begin{pmatrix}5\\\\2\\end{pmatrix}$","$\\begin{pmatrix}-2\\\\5\\end{pmatrix}$"]},{"type":"list","a":[-3.0,6.0,-3.0],"q":"Berechne $\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\times\\begin{pmatrix}4\\\\5\\\\6\\end{pmatrix}$.","s":"$2\\cdot6-3\\cdot5=-3$, $3\\cdot4-1\\cdot6=6$, $1\\cdot5-2\\cdot4=-3$."},{"type":"num","a":6.0,"q":"Berechne den Flächeninhalt des Dreiecks $A=(0|0|0)$, $B=(3|0|0)$, $C=(0|4|0)$ mit dem Kreuzprodukt.","s":"$\\overrightarrow{AB}\\times\\overrightarrow{AC}=\\begin{pmatrix}3\\\\0\\\\0\\end{pmatrix}\\times\\begin{pmatrix}0\\\\4\\\\0\\end{pmatrix}=\\begin{pmatrix}0\\\\0\\\\12\\end{pmatrix}$. Betrag 12, halbe Fläche: 6."},{"type":"num","a":42.0,"q":"Ein Kunde kauft 3, 5 und 2 Stück von drei Produkten, die 4 €, 2 € und 10 € pro Stück kosten. Berechne den Gesamtpreis als Skalarprodukt.","unit":"€","s":"$\\begin{pmatrix}3\\\\5\\\\2\\end{pmatrix}\\cdot\\begin{pmatrix}4\\\\2\\\\10\\end{pmatrix}=12+10+20=42$."},{"type":"mc","q":"Für zwei Vektoren gilt $\\vec a\\cdot\\vec b<0$. Was folgt daraus?","s":"Beträge sind immer positiv, das Vorzeichen kommt also allein vom Cosinus. Er ist für Winkel zwischen 90° und 180° negativ.","o":["Der Winkel zwischen ihnen ist stumpf.","Die Vektoren sind parallel.","Der Winkel zwischen ihnen ist spitz.","Die Vektoren stehen normal aufeinander."]}],"gen":["skal","kreuz"],"html":"<h3>Das Skalarprodukt<\/h3>\n<p>Man multipliziert die entsprechenden Koordinaten und addiert die Ergebnisse. Heraus kommt eine <b>Zahl<\/b>, kein Vektor.<\/p>\n<div class=\"formula\">$\\vec a\\cdot\\vec b=a_1b_1+a_2b_2+a_3b_3$<\/div>\n<p>In Sachaufgaben hat das eine einfache Bedeutung: Ist $\\vec s$ der Vektor der Stückzahlen und $\\vec p$ der Vektor der Stückpreise, dann ist $\\vec s\\cdot\\vec p$ der Gesamtpreis.<\/p>\n<p>Geometrisch hängt das Skalarprodukt mit dem Winkel $\\varphi$ zwischen den Vektoren zusammen:<\/p>\n<div class=\"formula\">$\\vec a\\cdot\\vec b=|\\vec a|\\cdot|\\vec b|\\cdot\\cos\\varphi$<\/div>\n<p>Wie man daraus den Winkel berechnet, ist auf der Seite zur Zentralmatura vorgerechnet. Hier nutzen wir vor allem das Vorzeichen:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Skalarprodukt<\/th><th>Winkel zwischen den Vektoren<\/th><\/tr><tr><td>positiv<\/td><td>spitz (kleiner als 90°)<\/td><\/tr><tr><td><b>null<\/b><\/td><td><b>rechter Winkel<\/b>, die Vektoren stehen normal aufeinander<\/td><\/tr><tr><td>negativ<\/td><td>stumpf (größer als 90°)<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Das Orthogonalitätskriterium: $\\vec a\\perp\\vec b\\iff\\vec a\\cdot\\vec b=0$. Mit dieser einen Zeile prüfst du rechte Winkel, ohne einen Winkel auszurechnen.<\/div>\n<h3>Normalvektoren in der Ebene<\/h3>\n<p>Zu $\\vec a=\\begin{pmatrix}a_1\\\\a_2\\end{pmatrix}$ findest du einen Normalvektor mit der <b>Kippregel<\/b>: Koordinaten vertauschen und bei einer das Vorzeichen ändern.<\/p>\n<div class=\"formula\">$\\vec n=\\begin{pmatrix}-a_2\\\\a_1\\end{pmatrix}\\quad\\text{oder}\\quad\\begin{pmatrix}a_2\\\\-a_1\\end{pmatrix}$<\/div>\n<p>Kontrolle: $a_1\\cdot(-a_2)+a_2\\cdot a_1=0$.<\/p>\n<h3>Das Kreuzprodukt im Raum<\/h3>\n<p>Im Raum gibt es zu zwei Vektoren unendlich viele Richtungen, die auf einem davon normal stehen, aber nur eine, die auf <b>beiden<\/b> normal steht. Das Kreuzprodukt liefert sie.<\/p>\n<div class=\"formula\">$\\vec a\\times\\vec b=\\begin{pmatrix}a_2b_3-a_3b_2\\\\a_3b_1-a_1b_3\\\\a_1b_2-a_2b_1\\end{pmatrix}$<\/div>\n<p>Sein Betrag ist der Flächeninhalt des Parallelogramms, das $\\vec a$ und $\\vec b$ aufspannen. Ein Dreieck hat die halbe Fläche.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Kreuzprodukt berechnen und prüfen<\/h4><div class=\"task\">Berechne $\\vec n=\\begin{pmatrix}2\\\\1\\\\-1\\end{pmatrix}\\times\\begin{pmatrix}1\\\\3\\\\2\\end{pmatrix}$ und überprüfe das Ergebnis.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Erste Koordinate: Decke die erste Zeile ab und rechne über Kreuz: $a_2b_3-a_3b_2=1\\cdot2-(-1)\\cdot3=5$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zweite Koordinate: $a_3b_1-a_1b_3=(-1)\\cdot1-2\\cdot2=-5$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Dritte Koordinate: $a_1b_2-a_2b_1=2\\cdot3-1\\cdot1=5$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Ergebnis: $\\vec n=\\begin{pmatrix}5\\\\-5\\\\5\\end{pmatrix}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe mit dem Skalarprodukt: $\\vec n\\cdot\\vec a=10-5-5=0$ und $\\vec n\\cdot\\vec b=5-15+10=0$. Der Vektor steht auf beiden normal.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Rechter Winkel im Dreieck<\/h4><div class=\"task\">Zeige, dass das Dreieck $A=(1|1)$, $B=(5|3)$, $C=(3|7)$ bei $B$ einen rechten Winkel hat, und berechne seinen Flächeninhalt.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Der Winkel bei $B$ wird von den Vektoren $\\overrightarrow{BA}$ und $\\overrightarrow{BC}$ gebildet. Beide müssen in $B$ beginnen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\overrightarrow{BA}=A-B=\\begin{pmatrix}-4\\\\-2\\end{pmatrix}$ und $\\overrightarrow{BC}=C-B=\\begin{pmatrix}-2\\\\4\\end{pmatrix}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Skalarprodukt: $(-4)\\cdot(-2)+(-2)\\cdot4=8-8=0$. Also ist der Winkel bei $B$ ein rechter.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Flächeninhalt eines rechtwinkligen Dreiecks: halbes Produkt der Katheten. $|\\overrightarrow{BA}|=\\sqrt{20}$ und $|\\overrightarrow{BC}|=\\sqrt{20}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>$A=\\dfrac12\\cdot\\sqrt{20}\\cdot\\sqrt{20}=10$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"geraden","t":"Geraden in der Ebene und im Raum","kl":"5–6","k":5,"a":"V","tag":"M","goals":["Geraden in Parameterform aufstellen und Punkte darauf berechnen","prüfen, ob ein Punkt auf einer Geraden liegt","die gegenseitige Lage zweier Geraden bestimmen und Schnittpunkte berechnen","Abstände und Schnittwinkel in der Ebene berechnen"],"ex":[{"type":"list","a":[7.0,0.0],"q":"Gegeben ist $g: X=\\begin{pmatrix}1\\\\2\\end{pmatrix}+t\\begin{pmatrix}3\\\\-1\\end{pmatrix}$. Welcher Punkt gehört zu $t=2$?","s":"$(1+2\\cdot3\\mid2+2\\cdot(-1))=(7|0)$."},{"type":"mc","q":"Liegt $P=(7|5)$ auf der Geraden $g: X=\\begin{pmatrix}1\\\\2\\end{pmatrix}+t\\begin{pmatrix}2\\\\1\\end{pmatrix}$?","h":"Stelle für jede Koordinate eine Gleichung auf.","s":"$1+2t=7$ ergibt $t=3$, und $2+t=5$ ergibt ebenfalls $t=3$. Derselbe Wert in beiden Zeilen: Der Punkt liegt auf $g$.","o":["Ja, für $t=3$.","Ja, für $t=2$.","Nein, die Koordinaten liefern verschiedene Werte für $t$.","Das lässt sich nicht entscheiden."]},{"type":"num","a":7.0,"q":"Eine Gerade geht durch $(1|2)$ und hat den Richtungsvektor $\\begin{pmatrix}3\\\\-1\\end{pmatrix}$. Ihre Gleichung lautet $x+3y=c$. Bestimme $c$.","s":"Der Normalvektor $(1|3)$ passt zur Richtung, denn $3\\cdot1+(-1)\\cdot3=0$. Punkt einsetzen: $c=1+3\\cdot2=7$."},{"type":"list","a":[2.0,5.0],"q":"Bestimme den Schnittpunkt von $g: X=\\begin{pmatrix}0\\\\1\\end{pmatrix}+s\\begin{pmatrix}1\\\\2\\end{pmatrix}$ und $h: X=\\begin{pmatrix}5\\\\2\\end{pmatrix}+t\\begin{pmatrix}1\\\\-1\\end{pmatrix}$.","h":"Setze gleich und löse das System für $s$ und $t$.","s":"I: $s=5+t$. II: $1+2s=2-t$. Einsetzen: $1+10+2t=2-t$, also $t=-3$ und $s=2$. Schnittpunkt: $(0+2\\mid1+4)=(2|5)$. Kontrolle mit $h$: $(5-3\\mid2+3)=(2|5)$."},{"type":"mc","q":"Welche Lage haben $g: X=\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}+t\\begin{pmatrix}2\\\\-1\\\\3\\end{pmatrix}$ und $h: X=\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}+s\\begin{pmatrix}-4\\\\2\\\\-6\\end{pmatrix}$?","h":"Vergleiche zuerst die Richtungsvektoren und mache dann die Punktprobe.","s":"$(-4|2|-6)=-2\\cdot(2|-1|3)$, die Richtungen sind parallel. Punktprobe mit $(0|1|1)$ in $g$: $1+2t=0$ ergibt $t=-0,5$, aber $-t=1$ ergibt $t=-1$. Der Punkt liegt nicht auf $g$, also sind die Geraden parallel und verschieden.","o":["parallel und verschieden","identisch","schneidend","windschief"]},{"type":"num","a":3.0,"q":"Berechne den Abstand des Punktes $P=(3|4)$ von der Geraden $g: 3x+4y=10$.","s":"$d=\\dfrac{|3\\cdot3+4\\cdot4-10|}{\\sqrt{9+16}}=\\dfrac{15}{5}=3$."},{"type":"num","a":71.57,"q":"Berechne den Schnittwinkel der Geraden $y=2x$ und $y=-x$ in Grad (zwei Dez
