<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1b1b1f; --muted:#56535d; --line:#e3ddd3;
  --blue:#3a5a8c; --blue-soft:#e7edf6;
  --petrol:#1d6b74; --petrol-soft:#e3eff1;
  --lilac:#5d4a7e; --lilac-soft:#eee9f5;
  --terra:#9c4f3d; --terra-soft:#f6e9e4;
  --gold:#a7843b; --gold-soft:#f6efdf;
  --radius:20px; --shadow:0 6px 24px rgba(40,30,20,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:18px;line-height:1.75}
h1,h2,h3,h4{line-height:1.3;font-weight:600;margin:0 0 .6em}
h2{font-size:1.75rem} h3{font-size:1.25rem;margin-top:1.5em} h4{font-size:1.05rem}
p{margin:0 0 1em} a{color:var(--blue)}
ul{margin:0 0 1em;padding-left:1.3em} li{margin-bottom:.35em}
.katex{font-size:1.08em}
.tex.d{display:block;margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.topbar{position:sticky;top:0;z-index:60;background:rgba(245,242,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.topbar .brand{font-weight:600;cursor:pointer;white-space:nowrap}
.topbar .brand small{font-weight:400;color:var(--muted)}
.topbar .grow{flex:1}
.pbar{width:150px;height:10px;background:#e6dfd3;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--petrol);border-radius:99px;width:0;transition:.4s}
.ptxt{font-size:.85rem;color:var(--muted);white-space:nowrap}
#menuBtn{display:none}

.layout{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1380px;margin:0 auto}
aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line)}
aside input{width:100%;font:inherit;font-size:.95rem;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
aside h5{margin:16px 6px 6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
aside a.ch{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:12px;font-size:.93rem;line-height:1.35}
aside a.ch:hover{background:#fff}
aside a.ch.on{background:#fff;box-shadow:var(--shadow);font-weight:500}
aside a.ch .dot{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:#fff}
aside a.ch.done .dot{background:var(--petrol);border-color:var(--petrol)}
aside a.ch.part .dot{border-color:var(--gold);background:var(--gold-soft)}
aside a.homelink{display:block;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:500}
aside a.homelink:hover{background:#fff}
main{padding:28px 30px 90px;min-width:0}
.inner{max-width:880px;margin:0 auto}

.hero{background:linear-gradient(135deg,#2f4a75 0%,#1d5d68 50%,#4a3e6b 100%);color:#fff;padding:44px 38px;border-radius:30px;margin-bottom:26px}
.hero h1{font-size:2.3rem;font-weight:700;margin-bottom:.3em}
.hero p{font-size:1.1rem;max-width:720px;opacity:.96;margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:.92rem}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px;border:1px solid #efe9df}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #efe9df;border-left:6px solid var(--blue);transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{display:block;font-weight:500;line-height:1.35}
.tile small{color:var(--muted)}
.tile.done{background:var(--petrol-soft)}
.cG{--c:var(--blue);--cs:var(--blue-soft)}.cF{--c:var(--petrol);--cs:var(--petrol-soft)}.cV{--c:var(--gold);--cs:var(--gold-soft)}.cA{--c:var(--lilac);--cs:var(--lilac-soft)}.cS{--c:var(--terra);--cs:var(--terra-soft)}
.tile{border-left-color:var(--c)} aside h5{color:var(--c)}
.step3{counter-reset:s}
.step3 .card{position:relative;padding-top:54px;margin:0}
.step3 .card:before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:24px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}

.chead{border-radius:26px;padding:30px 32px;background:var(--cs);border-top:6px solid var(--c);margin-bottom:22px}
.chead h2{margin-bottom:.35em}
.tag{display:inline-block;font-size:.8rem;padding:3px 11px;border-radius:999px;font-weight:500;background:#fff;color:var(--c);margin-right:6px}
.goals{margin:14px 0 0;padding-left:1.2em;font-size:.98rem}
.goals li{margin-bottom:.15em}
.formula{background:var(--bg);border-radius:14px;padding:12px 18px;margin:12px 0;overflow-x:auto}
.note{border-left:5px solid var(--gold);background:var(--gold-soft);padding:14px 18px;border-radius:12px;margin:14px 0}
.note.f{border-color:var(--terra);background:var(--terra-soft)}
.note.t{border-color:var(--petrol);background:var(--petrol-soft)}
.note b.lab{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tw{overflow-x:auto;margin:12px 0}
table.plain{width:100%;border-collapse:separate;border-spacing:0;font-size:.97rem}
table.plain th{background:var(--cs);text-align:left;padding:10px 14px;font-weight:600}
table.plain td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain tr:last-child td{border-bottom:none}
table.plain th:first-child{border-radius:12px 0 0 0}table.plain th:last-child{border-radius:0 12px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid var(--line)}
figcaption{font-size:.88rem;color:var(--muted);margin-top:4px}

.walk{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px 26px;margin:20px 0;border:1px solid #efe9df}
.walk h4{color:var(--c);margin-bottom:.3em}
.walk .task{background:var(--bg);border-radius:14px;padding:14px 18px;margin:8px 0 12px}
.wstep{display:none;gap:14px;padding:12px 0;border-top:1px dashed var(--line);animation:fade .35s}
.wstep.show{display:flex}
.wstep .n{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.wstep>div:last-child{min-width:0;flex:1}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

button{font-family:inherit;font-size:1rem;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:.2s}
button:hover{filter:brightness(1.08)}
button.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 18px}
button.petrol{background:var(--petrol)} button.lilac{background:var(--lilac)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

.ex{background:#fff;border-radius:18px;border:1px solid #efe9df;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px}
.ex.ok{border-left:6px solid var(--petrol)}
.ex.no{border-left:6px solid var(--terra)}
.ex .nr{font-size:.82rem;font-weight:600;color:var(--c);letter-spacing:.05em;text-transform:uppercase}
.ex input[type=text]{font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);width:210px;max-width:100%}
.ex input[type=text]:focus{outline:none;border-color:var(--blue)}
.ex .unit{color:var(--muted);font-size:.95rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:block;text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:10px 16px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--blue);filter:none}
.opt.right{background:var(--petrol-soft);border-color:var(--petrol)}
.opt.wrong{background:var(--terra-soft);border-color:var(--terra)}
.fb{margin-top:12px;border-radius:14px;padding:12px 16px;display:none}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:var(--petrol-soft)} .fb.bad{background:var(--terra-soft)} .fb.hint{background:var(--gold-soft)}
.fb b.h{display:block;margin-bottom:2px}
.hintline{font-size:.88rem;color:var(--muted);margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.score{font-weight:600;color:var(--petrol)}
.phi{background:var(--bg);border-radius:14px;padding:14px 18px;margin:12px 0}
.phi input{font:inherit;width:110px;padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
footer{color:var(--muted);font-size:.85rem;margin-top:50px;text-align:center}

@media(max-width:560px){.ptxt{display:none}}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:57px;width:min(330px,88vw);background:var(--bg);z-index:55;transform:translateX(-105%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  #menuBtn{display:block;padding:7px 14px}
  main{padding:20px 14px 80px}
  .hero{padding:30px 24px}.hero h1{font-size:1.8rem}
  .pbar{width:80px}
  .topbar .brand small{display:none}
  .topbar{gap:8px;padding:8px 12px}.topbar .brand{overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
  #menuBtn{white-space:nowrap;flex-shrink:0}
  .pbar{flex-shrink:0;width:64px}
  .card,.walk,.ex{padding:18px 16px}.chead{padding:22px 18px}
  .ex input[type=text]{width:100%}
  body{font-size:17px}
}
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" class="ghost">☰ Inhalt</button>
  <div class="brand" onclick="location.hash=''">Mathematik Oberstufe <small>· der komplette Kurs</small></div>
  <div class="grow"></div>
  <span class="ptxt" id="ptxt"></span><div class="pbar"><i id="pbar"></i></div>
</div>
<div class="layout">
  <aside id="side"></aside>
  <main><div class="inner" id="main"></div></main>
</div>

<script>
const DATA={"chapters":[{"id":"mengen","t":"Mengen, Zahlenbereiche und Intervalle","kl":"5","k":5,"a":"G","tag":"M","goals":["Mengen in aufzählender und beschreibender Form lesen und schreiben","Durchschnitt, Vereinigung und Differenz bilden","Zahlen den Bereichen ℕ, ℤ, ℚ und ℝ zuordnen und das begründen","Intervalle richtig notieren und deuten"],"ex":[{"type":"set","a":[4.0,5.0,6.0],"q":"Gegeben sind $A=\\{1;2;3;4;5;6\\}$ und $B=\\{4;5;6;7;8\\}$. Gib die Elemente von $A\\cap B$ an.","s":"Der Durchschnitt enthält, was in beiden Mengen liegt: $A\\cap B=\\{4;5;6\\}$."},{"type":"num","a":8.0,"q":"Wie viele Elemente hat $A\\cup B$ für die Mengen $A=\\{1;2;3;4;5;6\\}$ und $B=\\{4;5;6;7;8\\}$?","h":"Gemeinsame Elemente zählen nur einmal.","s":"$A\\cup B=\\{1;2;3;4;5;6;7;8\\}$ hat 8 Elemente. Rechnerisch: $6+5-3=8$, weil die drei gemeinsamen Elemente sonst doppelt gezählt würden."},{"type":"set","a":[1.0,2.0,3.0],"q":"Gib für dieselben Mengen die Elemente von $A\\setminus B$ an.","s":"Aus $A$ wird alles gestrichen, was auch in $B$ liegt: $A\\setminus B=\\{1;2;3\\}$."},{"type":"mc","q":"Welche dieser Zahlen ist irrational?","h":"Prüfe bei den Wurzeln, ob unter der Wurzel eine Quadratzahl (oder ein Bruch aus Quadratzahlen) steht.","s":"$12$ ist keine Quadratzahl, daher ist $\\sqrt{12}$ irrational. $\\sqrt{\\frac94}=\\frac32$ ist ein Bruch, $0{,}\\overline3=\\frac13$ ebenfalls, und $-\\frac{22}{7}$ ist ohnehin als Bruch gegeben.","o":["$\\sqrt{12}$","$\\sqrt{\\frac{9}{4}}$","$0{,}\\overline{3}$","$-\\frac{22}{7}$"]},{"type":"mc","q":"Welches Intervall beschreibt alle Zahlen $x$ mit $-2\\le x<5$?","s":"$-2$ gehört dazu (eckige Klammer), $5$ gehört nicht dazu (runde Klammer): $[-2;5)$.","o":["$[-2;5)$","$(-2;5]$","$[-2;5]$","$(-2;5)$"]},{"type":"num","a":7.0,"q":"Wie viele ganze Zahlen liegen im Intervall $(-3;4]$?","h":"$-3$ gehört nicht dazu, $4$ schon.","s":"Es sind $-2,-1,0,1,2,3,4$, also 7 Zahlen."},{"type":"num","a":11.0,"q":"Schreibe $0{,}\\overline{45}$ als gekürzten Bruch. Gib den Nenner an.","h":"Multipliziere mit 100 und subtrahiere.","s":"$x=0,4545\\dots$, $100x=45,4545\\dots$, also $99x=45$ und $x=\\frac{45}{99}=\\frac{5}{11}$. Der Nenner ist 11."},{"type":"mc","q":"Welche Aussage ist wahr?","h":"Suche zu den falschen Aussagen ein Gegenbeispiel. Ein einziges genügt.","s":"Jede ganze Zahl $z$ lässt sich als $\\frac{z}{1}$ schreiben, also ist sie rational. Gegenbeispiele zu den anderen: $\\sqrt2$ ist reell, aber nicht rational; $\\sqrt2+(-\\sqrt2)=0$ ist rational; zwischen zwei rationalen Zahlen liegt immer ihr Mittelwert, der wieder rational ist.","o":["Jede ganze Zahl ist auch eine rationale Zahl.","Jede reelle Zahl ist auch eine rationale Zahl.","Die Summe zweier irrationaler Zahlen ist immer irrational.","Zwischen zwei rationalen Zahlen liegt nicht immer eine weitere rationale Zahl."]}],"gen":[],"html":"<h3>Was eine Menge ist<\/h3>\n<p>Eine Menge fasst Objekte zusammen, die man ihre <b>Elemente<\/b> nennt. Du kannst eine Menge aufzählen, etwa $A=\\{1;2;3\\}$, oder beschreiben: $B=\\{x\\in\\mathbb{N}\\mid x<4\\}$ liest man als „alle natürlichen Zahlen $x$, für die gilt: $x$ ist kleiner als 4“. Das Zeichen $\\in$ heißt „ist Element von“, $\\notin$ „ist kein Element von“. Die leere Menge $\\{\\}$ enthält nichts.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Schreibweise<\/th><th>Bedeutung<\/th><th>Beispiel mit $A=\\{1;2;3;4\\}$, $B=\\{3;4;5\\}$<\/th><\/tr><tr><td>$A\\cap B$<\/td><td>Durchschnitt: liegt in $A$ <b>und<\/b> in $B$<\/td><td>$\\{3;4\\}$<\/td><\/tr><tr><td>$A\\cup B$<\/td><td>Vereinigung: liegt in $A$ <b>oder<\/b> in $B$ (oder in beiden)<\/td><td>$\\{1;2;3;4;5\\}$<\/td><\/tr><tr><td>$A\\setminus B$<\/td><td>Differenz: liegt in $A$, aber nicht in $B$<\/td><td>$\\{1;2\\}$<\/td><\/tr><tr><td>$C\\subseteq A$<\/td><td>Teilmenge: jedes Element von $C$ liegt auch in $A$<\/td><td>$\\{1;4\\}\\subseteq A$<\/td><\/tr><\/table><\/div>\n<h3>Die Zahlenbereiche<\/h3>\n<p>Jeder Bereich erweitert den vorigen, weil eine Rechenart sonst nicht immer ausführbar wäre: $\\mathbb{N}\\subset\\mathbb{Z}\\subset\\mathbb{Q}\\subset\\mathbb{R}\\subset\\mathbb{C}$.<\/p>\n<ul><li>$\\mathbb{N}=\\{0;1;2;\\dots\\}$ natürliche Zahlen. Subtrahieren führt hinaus ($3-5$).<\/li><li>$\\mathbb{Z}$ ganze Zahlen. Dividieren führt hinaus ($3:4$).<\/li><li>$\\mathbb{Q}$ rationale Zahlen: alles, was sich als Bruch zweier ganzer Zahlen schreiben lässt. Als Dezimalzahl sind sie <b>endlich oder periodisch<\/b>.<\/li><li>$\\mathbb{R}$ reelle Zahlen: dazu kommen die irrationalen Zahlen wie $\\sqrt2$, $\\pi$ oder $e$, deren Dezimaldarstellung unendlich und nicht periodisch ist.<\/li><li>$\\mathbb{C}$ komplexe Zahlen: erst hier hat $x^2=-1$ eine Lösung (eigenes Kapitel).<\/li><\/ul>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Eine Wurzel $\\sqrt{n}$ aus einer natürlichen Zahl ist entweder ganzzahlig (wenn $n$ eine Quadratzahl ist) oder irrational. Dazwischen gibt es nichts. $\\sqrt{49}=7$ ist rational, $\\sqrt{50}$ ist irrational.<\/div>\n<h3>Periodische Dezimalzahlen in Brüche verwandeln<\/h3>\n<p>Jede periodische Dezimalzahl ist ein Bruch. Der Trick: mit einer Zehnerpotenz multiplizieren, sodass die Periode genau um eine Länge weiterrückt, und dann subtrahieren.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Periodische Dezimalzahl als Bruch<\/h4><div class=\"task\">Schreibe $0{,}\\overline{27}=0,272727\\dots$ als gekürzten Bruch.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Nenne die Zahl $x=0,2727\\dots$ Die Periode hat zwei Stellen, also multiplizierst du mit $100$: $100x=27,2727\\dots$<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Subtrahiere die beiden Gleichungen. Die Nachkommastellen heben sich auf: $100x-x=27$, also $99x=27$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Löse nach $x$ und kürze: $x=\\frac{27}{99}=\\frac{3}{11}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Kontrolle mit dem Rechner: $3:11=0,2727\\dots$ Passt. Damit ist auch gezeigt, dass die Zahl rational ist.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Intervalle<\/h3>\n<p>Ein Intervall ist ein lückenloses Stück der Zahlengeraden. Die Klammer sagt, ob der Rand dazugehört.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Intervall<\/th><th>Bedeutung<\/th><th>Rand<\/th><\/tr><tr><td>$[2;5]$<\/td><td>$2\\le x\\le 5$<\/td><td>beide Ränder gehören dazu (abgeschlossen)<\/td><\/tr><tr><td>$(2;5)$<\/td><td>$2<x<5$<\/td><td>kein Rand gehört dazu (offen); auch $]2;5[$ geschrieben<\/td><\/tr><tr><td>$[2;5)$<\/td><td>$2\\le x<5$<\/td><td>nur der linke Rand gehört dazu<\/td><\/tr><tr><td>$(-\\infty;3]$<\/td><td>$x\\le 3$<\/td><td>bei $\\infty$ steht immer eine runde Klammer<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>„Oder“ bedeutet in der Mathematik immer das einschließende Oder. In $A\\cup B$ liegen auch die Elemente, die in beiden Mengen vorkommen, und jedes Element wird nur einmal aufgeschrieben.<\/div>"},{"id":"terme","t":"Terme, binomische Formeln und Bruchterme","kl":"5","k":5,"a":"G","tag":"M","goals":["Terme zusammenfassen und Klammern sicher auflösen","die drei binomischen Formeln in beide Richtungen anwenden","Terme durch Herausheben und Zerlegen faktorisieren","Bruchterme kürzen, erweitern und addieren"],"ex":[{"type":"num","a":-12.0,"q":"Multipliziere $(3x-2)^2$ aus. Wie lautet der Koeffizient von $x$ (die Zahl vor dem $x$)?","h":"Zweite binomische Formel mit $a=3x$ und $b=2$.","s":"$(3x-2)^2=(3x)^2-2\\cdot3x\\cdot2+2^2=9x^2-12x+4$. Der Koeffizient von $x$ ist $-12$."},{"type":"num","a":12.0,"q":"Vereinfache $(a+3)^2-(a-3)^2$. Das Ergebnis hat die Form $k\\cdot a$. Gib $k$ an.","h":"Beide Klammern ausmultiplizieren und auf das Minus vor der zweiten Klammer achten.","s":"$(a^2+6a+9)-(a^2-6a+9)=a^2+6a+9-a^2+6a-9=12a$, also $k=12$."},{"type":"mc","q":"Welche Zerlegung von $x^2-49$ ist richtig?","s":"Dritte binomische Formel rückwärts: $a^2-b^2=(a-b)(a+b)$ mit $a=x$, $b=7$. Probe durch Ausmultiplizieren: $x^2+7x-7x-49$.","o":["$(x-7)(x+7)$","$(x-7)^2$","$(x-49)(x+1)$","$x(x-49)$"]},{"type":"mc","q":"Welche Zerlegung von $x^2+5x+6$ ist richtig?","h":"Gesucht sind zwei Zahlen mit Summe 5 und Produkt 6.","s":"$2+3=5$ und $2\\cdot3=6$, daher $(x+2)(x+3)$. Bei $(x+1)(x+6)$ wäre das Produkt zwar 6, die Summe aber 7.","o":["$(x+2)(x+3)$","$(x+1)(x+6)$","$(x-2)(x-3)$","$(x+5)(x+1)$"]},{"type":"mc","q":"Vereinfache $\\dfrac{x^2-9}{x^2+3x}$ so weit wie möglich.","h":"Zuerst Zähler und Nenner faktorisieren, erst dann kürzen.","s":"$\\dfrac{(x-3)(x+3)}{x(x+3)}=\\dfrac{x-3}{x}$. Die Antwort $\\frac{-9}{3x}$ entsteht, wenn man $x^2$ aus Summen „kürzt“, und das ist verboten.","o":["$\\dfrac{x-3}{x}$","$\\dfrac{-9}{3x}$","$\\dfrac{x-3}{x+3}$","$\\dfrac{x+3}{x}$"]},{"type":"set","a":[-2.0,2.0],"q":"Für welche Zahlen ist der Term $\\dfrac{5}{x^2-4}$ nicht definiert?","s":"Der Nenner darf nicht 0 sein: $x^2-4=0\\Leftrightarrow x=2$ oder $x=-2$. Die Definitionsmenge ist $\\mathbb{R}\\setminus\\{-2;2\\}$."},{"type":"mc","q":"Fasse zusammen: $\\dfrac{1}{x}+\\dfrac{1}{x+1}$","h":"Gemeinsamer Nenner ist $x(x+1)$.","s":"$\\dfrac{x+1}{x(x+1)}+\\dfrac{x}{x(x+1)}=\\dfrac{2x+1}{x(x+1)}$. Zähler und Nenner einfach getrennt zu addieren ($\\frac{2}{2x+1}$) ist keine erlaubte Bruchrechnung.","o":["$\\dfrac{2x+1}{x(x+1)}$","$\\dfrac{2}{2x+1}$","$\\dfrac{1}{x(x+1)}$","$\\dfrac{2}{x(x+1)}$"]},{"type":"mc","q":"Vereinfache $2x(x-3)-(x-1)(x+4)$.","h":"Löse zuerst beide Produkte auf und setze das zweite Ergebnis in eine Klammer mit Minus davor.","s":"$2x^2-6x-(x^2+4x-x-4)=2x^2-6x-x^2-3x+4=x^2-9x+4$.","o":["$x^2-9x+4$","$x^2-9x-4$","$x^2-3x+4$","$3x^2-3x-4$"]}],"gen":[],"html":"<h3>Rechnen mit Termen<\/h3>\n<p>Ein Term ist ein Rechenausdruck aus Zahlen, Variablen und Rechenzeichen. Zusammenfassen darfst du nur <b>gleichartige<\/b> Glieder, also solche mit denselben Variablen in denselben Potenzen: $3x^2+5x-x^2=2x^2+5x$. Aus $2x^2$ und $5x$ wird nichts Einfacheres.<\/p>\n<p>Beim Auflösen von Klammern gilt: Steht ein Minus vor der Klammer, drehen sich <b>alle<\/b> Vorzeichen in der Klammer um. Werden zwei Klammern multipliziert, multiplizierst du jedes Glied mit jedem.<\/p>\n<div class=\"formula\">$(a+b)\\cdot(c+d)=ac+ad+bc+bd$<\/div>\n<h3>Die binomischen Formeln<\/h3>\n<div class=\"formula\">$(a+b)^2=a^2+2ab+b^2\\qquad (a-b)^2=a^2-2ab+b^2\\qquad (a+b)(a-b)=a^2-b^2$<\/div>\n<p>Sie sparen Zeit beim Ausmultiplizieren und sind rückwärts gelesen das wichtigste Werkzeug beim Faktorisieren.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Der häufigste Fehler in der ganzen Oberstufe: $(a+b)^2$ ist <b>nicht<\/b> $a^2+b^2$. Das gemischte Glied $2ab$ gehört immer dazu. Mit Zahlen siehst du es sofort: $(3+4)^2=49$, aber $3^2+4^2=25$.<\/div>\n<h3>Faktorisieren: aus einer Summe ein Produkt machen<\/h3>\n<p>Du brauchst das zum Kürzen von Brüchen und zum Lösen von Gleichungen. Gehe immer in dieser Reihenfolge vor:<\/p>\n<ul><li><b>Herausheben:<\/b> Steckt in jedem Glied derselbe Faktor? $6x^3-9x^2=3x^2(2x-3)$<\/li><li><b>Binomische Formel rückwärts:<\/b> $x^2-25=(x-5)(x+5)$ und $x^2+6x+9=(x+3)^2$<\/li><li><b>Zerlegen nach Vieta:<\/b> Bei $x^2+px+q$ suchst du zwei Zahlen mit Summe $p$ und Produkt $q$. Für $x^2+7x+10$ sind das 2 und 5, also $(x+2)(x+5)$.<\/li><\/ul>\n<h3>Bruchterme<\/h3>\n<p>Ein Bruchterm hat eine Variable im Nenner. Weil man durch 0 nicht dividieren darf, musst du zuerst die <b>Definitionsmenge<\/b> bestimmen: alle Zahlen, für die der Nenner nicht 0 wird. Kürzen darfst du nur <b>Faktoren<\/b>, nie Summanden. Deshalb wird vor dem Kürzen immer faktorisiert.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Bruchterm kürzen<\/h4><div class=\"task\">Vereinfache $\\dfrac{x^2-4}{x^2+2x}$ und gib die Definitionsmenge an.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Faktorisiere den Zähler mit der dritten binomischen Formel: $x^2-4=(x-2)(x+2)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Faktorisiere den Nenner durch Herausheben: $x^2+2x=x(x+2)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Definitionsmenge aus dem <b>ursprünglichen<\/b> Nenner: $x(x+2)=0$ gilt für $x=0$ und $x=-2$. Also $D=\\mathbb{R}\\setminus\\{-2;0\\}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Jetzt kürzen: Der Faktor $(x+2)$ steht oben und unten. $\\dfrac{(x-2)(x+2)}{x(x+2)}=\\dfrac{x-2}{x}$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Das Ergebnis $\\dfrac{x-2}{x}$ gilt nur für Zahlen aus $D$. Dass $x=-2$ nach dem Kürzen „wieder ginge“, ändert nichts: Die Definitionsmenge bleibt die des ursprünglichen Terms.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Bruchterme addieren<\/h4><div class=\"task\">Fasse zusammen: $\\dfrac{2}{x-1}+\\dfrac{3}{x+2}$<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die Nenner haben keinen gemeinsamen Faktor. Der gemeinsame Nenner ist ihr Produkt $(x-1)(x+2)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Erweitere jeden Bruch mit dem fehlenden Faktor: $\\dfrac{2(x+2)}{(x-1)(x+2)}+\\dfrac{3(x-1)}{(x-1)(x+2)}$<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Schreibe auf einen Bruchstrich und multipliziere nur den Zähler aus: $2x+4+3x-3=5x+1$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: $\\dfrac{5x+1}{(x-1)(x+2)}$. Den Nenner lässt du in faktorisierter Form stehen, das ist übersichtlicher.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"potenzen","t":"Potenzen und Wurzeln","kl":"5–6","k":5,"a":"G","tag":"M","goals":["die Potenzregeln sicher anwenden, auch bei negativen und gebrochenen Hochzahlen","Zahlen in Gleitkommadarstellung schreiben und damit rechnen","Wurzeln als Potenzen schreiben und teilweise die Wurzel ziehen"],"ex":[{"type":"num","a":0.125,"q":"Schreibe $2^{-3}$ als Dezimalzahl.","s":"$2^{-3}=\\dfrac{1}{2^3}=\\dfrac18=0,125$. Die negative Hochzahl macht den Kehrwert, das Ergebnis bleibt positiv."},{"type":"num","a":7.0,"q":"Vereinfache $\\dfrac{a^5\\cdot a^{-2}}{a^{-4}}$ zu $a^n$. Gib $n$ an.","s":"$5+(-2)-(-4)=7$, also $a^7$."},{"type":"mc","q":"Was ergibt $(2x^3)^4$?","s":"Jeder Faktor wird hoch 4 genommen: $2^4=16$ und $(x^3)^4=x^{12}$. Beim Potenzieren einer Potenz werden die Hochzahlen multipliziert, nicht addiert.","o":["$16x^{12}$","$8x^{12}$","$2x^{12}$","$16x^{7}$"]},{"type":"num","a":9.0,"q":"Berechne $27^{\\frac23}$ ohne Technologie.","h":"Der Nenner 3 bedeutet dritte Wurzel.","s":"$27^{\\frac23}=\\left(\\sqrt[3]{27}\\right)^2=3^2=9$."},{"type":"mc","q":"Wie lautet $0,00042$ in Gleitkommadarstellung?","s":"Das Komma wandert um 4 Stellen nach rechts, bis $4,2$ dasteht, daher $10^{-4}$. $42\\cdot10^{-5}$ hat zwar denselben Wert, ist aber keine Gleitkommadarstellung, weil die Zahl vorne zwischen 1 und 10 liegen muss.","o":["$4,2\\cdot10^{-4}$","$4,2\\cdot10^{-3}$","$42\\cdot10^{-5}$","$4,2\\cdot10^{4}$"]},{"type":"num","a":12000.0,"q":"Berechne $(3\\cdot10^5)\\cdot(4\\cdot10^{-2})$ und gib das Ergebnis als gewöhnliche Zahl an.","s":"$3\\cdot4=12$ und $10^5\\cdot10^{-2}=10^3$. Also $12\\cdot10^3=12\\,000$ (in Gleitkommadarstellung $1,2\\cdot10^4$)."},{"type":"num","a":2.0,"q":"Vereinfache $\\sqrt{50}-\\sqrt{18}$. Das Ergebnis hat die Form $k\\cdot\\sqrt2$. Gib $k$ an.","h":"$50=25\\cdot2$ und $18=9\\cdot2$.","s":"$\\sqrt{50}=5\\sqrt2$ und $\\sqrt{18}=3\\sqrt2$, also $5\\sqrt2-3\\sqrt2=2\\sqrt2$."},{"type":"num","a":1.1666666666666667,"q":"Schreibe $\\sqrt[3]{x^2}\\cdot\\sqrt{x}$ als eine Potenz $x^n$. Gib $n$ an (als Bruch oder Dezimalzahl).","h":"Schreibe beide Wurzeln zuerst als Potenzen mit gebrochener Hochzahl.","s":"$x^{\\frac23}\\cdot x^{\\frac12}=x^{\\frac23+\\frac12}=x^{\\frac46+\\frac36}=x^{\\frac76}$."}],"gen":["pot"],"html":"<h3>Was eine Potenz bedeutet<\/h3>\n<p>$a^n$ heißt: $a$ wird $n$-mal mit sich selbst multipliziert. $a$ ist die <b>Basis<\/b>, $n$ die <b>Hochzahl<\/b> (der Exponent). Aus dieser einen Idee folgen alle Regeln:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Regel<\/th><th>Formel<\/th><th>Beispiel<\/th><\/tr><tr><td>gleiche Basis multiplizieren<\/td><td>$a^m\\cdot a^n=a^{m+n}$<\/td><td>$x^3\\cdot x^4=x^7$<\/td><\/tr><tr><td>gleiche Basis dividieren<\/td><td>$a^m:a^n=a^{m-n}$<\/td><td>$x^5:x^2=x^3$<\/td><\/tr><tr><td>Potenz potenzieren<\/td><td>$(a^m)^n=a^{m\\cdot n}$<\/td><td>$(x^3)^2=x^6$<\/td><\/tr><tr><td>Produkt potenzieren<\/td><td>$(a\\cdot b)^n=a^n\\cdot b^n$<\/td><td>$(2x)^3=8x^3$<\/td><\/tr><tr><td>Bruch potenzieren<\/td><td>$\\left(\\frac{a}{b}\\right)^n=\\frac{a^n}{b^n}$<\/td><td>$\\left(\\frac{x}{3}\\right)^2=\\frac{x^2}{9}$<\/td><\/tr><\/table><\/div>\n<h3>Hochzahl null, negative und gebrochene Hochzahlen<\/h3>\n<p>Damit die Divisionsregel immer stimmt, muss man festlegen:<\/p>\n<div class=\"formula\">$a^0=1\\qquad a^{-n}=\\dfrac{1}{a^n}\\qquad a^{\\frac{1}{n}}=\\sqrt[n]{a}\\qquad a^{\\frac{m}{n}}=\\sqrt[n]{a^m}$<\/div>\n<p>Ein negatives Vorzeichen in der Hochzahl bedeutet also <b>Kehrwert<\/b>, nicht negative Zahl: $2^{-3}=\\frac{1}{8}$. Ein Bruch in der Hochzahl bedeutet <b>Wurzel<\/b>: Der Nenner ist der Wurzelexponent. Wurzeln sind damit nichts Neues, alle Potenzregeln gelten weiter.<\/p>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Bei $27^{\\frac23}$ ziehst du am besten zuerst die Wurzel und potenzierst danach, dann bleiben die Zahlen klein: $\\sqrt[3]{27}=3$, und $3^2=9$.<\/div>\n<h3>Gleitkommadarstellung<\/h3>\n<p>Sehr große und sehr kleine Zahlen schreibt man als $a\\cdot10^k$ mit $1\\le a<10$. Die Hochzahl sagt, um wie viele Stellen das Komma verschoben wurde: $320\\,000=3,2\\cdot10^5$ und $0,00047=4,7\\cdot10^{-4}$. Beim Multiplizieren rechnest du Zahlen und Zehnerpotenzen getrennt.<\/p>\n<h3>Mit Wurzeln rechnen<\/h3>\n<div class=\"formula\">$\\sqrt{a\\cdot b}=\\sqrt a\\cdot\\sqrt b\\qquad \\sqrt{\\dfrac{a}{b}}=\\dfrac{\\sqrt a}{\\sqrt b}\\qquad\\text{aber: }\\sqrt{a+b}\\neq\\sqrt a+\\sqrt b$<\/div>\n<p>Beim <b>teilweisen Wurzelziehen<\/b> spaltest du die größte Quadratzahl ab: $\\sqrt{72}=\\sqrt{36\\cdot2}=6\\sqrt2$. Erst danach lassen sich Wurzeln zusammenfassen.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Potenzterm vereinfachen<\/h4><div class=\"task\">Vereinfache $\\dfrac{(2a^3b)^2\\cdot a^{-4}}{4a\\,b^{-3}}$ und schreibe das Ergebnis ohne negative Hochzahlen.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Zuerst die Klammer: Jeder Faktor wird quadriert. $(2a^3b)^2=4a^6b^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Zähler zusammenfassen: $4a^6b^2\\cdot a^{-4}=4a^{6-4}b^2=4a^2b^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zahlen dividieren: $4:4=1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$a$-Potenzen dividieren, Hochzahlen subtrahieren: $a^{2-1}=a^1=a$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>$b$-Potenzen: $b^{2-(-3)}=b^{5}$. Achtung auf das doppelte Minus.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Ergebnis: $a\\,b^5$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wurzeln zusammenfassen<\/h4><div class=\"task\">Vereinfache $\\sqrt{75}+\\sqrt{12}-\\sqrt{27}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>So wie es dasteht, kann man nichts zusammenfassen. Ziehe überall teilweise die Wurzel.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$\\sqrt{75}=\\sqrt{25\\cdot3}=5\\sqrt3$, $\\sqrt{12}=\\sqrt{4\\cdot3}=2\\sqrt3$, $\\sqrt{27}=\\sqrt{9\\cdot3}=3\\sqrt3$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">3<\/div><div>Jetzt sind es gleichartige Glieder: $5\\sqrt3+2\\sqrt3-3\\sqrt3=4\\sqrt3$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"log","t":"Logarithmen und Exponentialgleichungen","kl":"6","k":6,"a":"G","tag":"M","goals":["den Logarithmus als Hochzahl verstehen und einfache Werte im Kopf bestimmen","die drei Rechenregeln anwenden","Exponentialgleichungen durch Logarithmieren lösen","einfache Logarithmusgleichungen lösen"],"ex":[{"type":"num","a":5.0,"q":"Berechne $\\log_2(32)$.","s":"$2^5=32$, also ist $\\log_2(32)=5$."},{"type":"num","a":-3.0,"q":"Berechne $\\lg(0,001)$.","s":"$0,001=10^{-3}$, daher $\\lg(0,001)=-3$."},{"type":"num","a":0.5,"q":"Berechne $\\ln(\\sqrt e)$.","s":"$\\sqrt e=e^{\\frac12}$, also $\\ln(e^{\\frac12})=\\frac12$."},{"type":"num","a":3.0,"q":"Berechne $\\log_3(54)-\\log_3(2)$ ohne Technologie.","h":"Differenz von Logarithmen bedeutet Quotient im Argument.","s":"$\\log_3\\!\\left(\\frac{54}{2}\\right)=\\log_3(27)=3$, weil $3^3=27$."},{"type":"mc","q":"Welche Umformung ist richtig?","s":"Aus einem Produkt wird eine Summe. Für $\\ln(a+b)$ gibt es keine Regel, und bei $\\ln(a^n)$ kommt die Hochzahl als Faktor nach vorne: $n\\cdot\\ln a$.","o":["$\\ln(a\\cdot b)=\\ln a+\\ln b$","$\\ln(a+b)=\\ln a\\cdot\\ln b$","$\\ln(a+b)=\\ln a+\\ln b$","$\\ln(a^n)=(\\ln a)^n$"]},{"type":"num","a":2.73,"q":"Löse $3^x=20$ (zwei Dezimalstellen).","s":"$x=\\dfrac{\\ln20}{\\ln3}\\approx\\dfrac{2,9957}{1,0986}\\approx2,73$. Plausibel, weil $3^2=9$ und $3^3=27$ ist."},{"type":"num","a":5.0,"q":"Löse $5\\cdot2^x=160$.","h":"Zuerst durch 5 dividieren.","s":"$2^x=32$, und $32=2^5$, also $x=5$. Hier brauchst du gar keinen Rechner."},{"type":"num","a":14.21,"q":"Löse $1,05^t=2$ (zwei Dezimalstellen).","s":"$t=\\dfrac{\\ln2}{\\ln1,05}\\approx\\dfrac{0,6931}{0,0488}\\approx14,21$. In Worten: Bei 5 % Wachstum pro Zeitschritt dauert eine Verdopplung gut 14 Schritte."},{"type":"num","a":4.0,"q":"Löse $\\log_2(x+4)=3$.","s":"Übersetzen: $x+4=2^3=8$, also $x=4$. Probe: $\\log_2(8)=3$."}],"gen":["logv","expgl"],"html":"<h3>Der Logarithmus ist eine Hochzahl<\/h3>\n<p>Bei $2^x=8$ siehst du die Lösung sofort. Bei $2^x=10$ nicht mehr. Für genau diese Frage wurde der Logarithmus erfunden:<\/p>\n<div class=\"formula\">$\\log_a(b)=x\\quad\\Longleftrightarrow\\quad a^x=b\\qquad (a>0,\\ a\\ne1,\\ b>0)$<\/div>\n<p>$\\log_a(b)$ ist also die Antwort auf die Frage: <b>„$a$ hoch wie viel ergibt $b$?“<\/b> Darum ist $\\log_2(8)=3$, $\\log_{10}(0,01)=-2$ und $\\log_5(1)=0$.<\/p>\n<p>Zwei Basen haben eigene Namen: $\\lg$ ist der Logarithmus zur Basis 10, $\\ln$ der zur Basis $e\\approx2,718$. Auf dem Rechner findest du genau diese beiden. Logarithmieren kann man nur <b>positive<\/b> Zahlen, weil eine Potenz mit positiver Basis nie 0 oder negativ wird.<\/p>\n<h3>Die Rechenregeln<\/h3>\n<p>Sie sind die Potenzregeln, aus Sicht der Hochzahlen gelesen:<\/p>\n<div class=\"formula\">$\\log_a(u\\cdot v)=\\log_a u+\\log_a v\\qquad \\log_a\\!\\left(\\dfrac{u}{v}\\right)=\\log_a u-\\log_a v\\qquad \\log_a(u^r)=r\\cdot\\log_a u$<\/div>\n<p>Die dritte Regel ist die wichtigste. Sie holt eine Unbekannte aus der Hochzahl herunter, und genau das brauchst du zum Lösen von Exponentialgleichungen.<\/p>\n<p>Für andere Basen rechnest du um: $\\log_a(b)=\\dfrac{\\ln b}{\\ln a}$. Zum Beispiel $\\log_2(10)=\\dfrac{\\ln10}{\\ln2}\\approx3,32$.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Für Summen gibt es keine Regel. $\\ln(a+b)$ lässt sich nicht zerlegen und ist insbesondere nicht $\\ln a+\\ln b$.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Exponentialgleichung lösen<\/h4><div class=\"task\">Löse $200\\cdot1,04^{t}=350$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Stelle zuerst die Potenz frei. Dividiere durch 200: $1,04^t=1,75$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Logarithmiere beide Seiten (mit $\\ln$ oder $\\lg$, das Ergebnis ist dasselbe): $\\ln(1,04^t)=\\ln(1,75)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Hole $t$ mit der dritten Regel herunter: $t\\cdot\\ln(1,04)=\\ln(1,75)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Dividiere: $t=\\dfrac{\\ln(1,75)}{\\ln(1,04)}\\approx\\dfrac{0,5596}{0,0392}\\approx14,27$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe: $200\\cdot1,04^{14,27}\\approx350$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Logarithmusgleichung lösen<\/h4><div class=\"task\">Löse $\\lg(x)+\\lg(x-3)=1$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Definitionsmenge: Beide Argumente müssen positiv sein, also $x>0$ und $x>3$. Zusammen: $x>3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Fasse links mit der Produktregel zusammen: $\\lg\\big(x(x-3)\\big)=1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Übersetze in eine Potenz: $x(x-3)=10^1=10$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Das ist eine quadratische Gleichung: $x^2-3x-10=0$ mit den Lösungen $x_1=5$ und $x_2=-2$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Vergleiche mit der Definitionsmenge: $-2$ ist nicht größer als 3 und fällt weg. Einzige Lösung: $x=5$. Probe: $\\lg5+\\lg2=\\lg10=1$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Zwei Zeilen, die du auswendig können solltest: $\\ln(e^x)=x$ und $e^{\\ln x}=x$. Logarithmieren und Potenzieren mit derselben Basis heben einander auf.<\/div>"},{"id":"lingl","t":"Lineare Gleichungen und Textaufgaben","kl":"5","k":5,"a":"G","tag":"M","goals":["lineare Gleichungen mit Klammern und Brüchen sicher lösen","die drei möglichen Lösungsfälle erkennen","Sachtexte in Gleichungen übersetzen","Formeln nach einer gewünschten Größe umstellen"],"ex":[{"type":"num","a":17.0,"q":"Löse $3(x-4)=2x+5$.","s":"Klammer auflösen: $3x-12=2x+5$. Dann $x=17$. Probe: $3\\cdot13=39$ und $2\\cdot17+5=39$."},{"type":"num","a":5.0,"q":"Löse $\\dfrac{x+1}{2}-\\dfrac{x-2}{3}=2$.","h":"Multipliziere alles mit 6.","s":"$3(x+1)-2(x-2)=12$, also $3x+3-2x+4=12$, $x+7=12$, $x=5$."},{"type":"mc","q":"Welche Lösungsmenge hat die Gleichung $2(x+3)=2x+6$?","s":"Nach dem Auflösen steht $2x+6=2x+6$, also $0=0$. Das ist für jedes $x$ wahr, die Lösungsmenge ist $\\mathbb{R}$.","o":["alle reellen Zahlen","die leere Menge","nur die Zahl 0","nur die Zahl 3"]},{"type":"num","a":3.0,"q":"Löse $\\dfrac{6}{x-1}=3$.","h":"Multipliziere mit $(x-1)$. Erlaubt ist das für $x\\neq1$.","s":"$6=3(x-1)$, also $x-1=2$ und $x=3$. Der Wert liegt in der Definitionsmenge ($x\\ne1$)."},{"type":"num","a":200.0,"q":"Tarif A kostet 10 € Grundgebühr und 0,05 € pro Minute. Tarif B kostet 4 € Grundgebühr und 0,08 € pro Minute. Bei wie vielen Minuten kosten beide Tarife gleich viel?","unit":"Minuten","s":"$x$ = Anzahl der Minuten. $10+0,05x=4+0,08x$, also $6=0,03x$ und $x=200$. Bei mehr als 200 Minuten ist Tarif A günstiger, weil er pro Minute weniger kostet."},{"type":"num","a":10.0,"q":"Ein Vater ist heute dreimal so alt wie sein Sohn. In 10 Jahren wird er doppelt so alt sein. Wie alt ist der Sohn heute?","unit":"Jahre","h":"Sohn heute: $s$. Vater heute: $3s$. Beide werden um 10 Jahre älter.","s":"$3s+10=2(s+10)$, also $3s+10=2s+20$ und $s=10$. Kontrolle: heute 10 und 30, in zehn Jahren 20 und 40."},{"type":"mc","q":"Stelle die Trapezformel $A=\\dfrac{(a+c)\\cdot h}{2}$ nach $c$ um.","h":"Erst mit 2 multiplizieren, dann durch $h$ dividieren, zuletzt $a$ subtrahieren.","s":"$2A=(a+c)h$, dann $\\dfrac{2A}{h}=a+c$, dann $c=\\dfrac{2A}{h}-a$. Die Reihenfolge ist entscheidend: Du schälst die Formel von außen nach innen.","o":["$c=\\dfrac{2A}{h}-a$","$c=\\dfrac{2A-a}{h}$","$c=\\dfrac{A}{2h}-a$","$c=2A-h-a$"]},{"type":"num","a":1.0,"q":"Zu 2 Litern eines Fruchtsaftgetränks mit 30 % Saftanteil wird Wasser gegeben, bis der Saftanteil 20 % beträgt. Wie viele Liter Wasser sind das?","unit":"Liter","s":"Saftmenge: $0,3\\cdot2=0,6$ Liter. $0,2\\cdot(2+x)=0,6$, also $2+x=3$ und $x=1$."}],"gen":["lin"],"html":"<h3>Äquivalenzumformungen<\/h3>\n<p>Eine Gleichung ist wie eine Waage im Gleichgewicht. Du darfst auf beiden Seiten dasselbe tun, ohne dass sich die Lösung ändert: dieselbe Zahl addieren oder subtrahieren, mit derselben Zahl (ungleich 0) multiplizieren oder durch sie dividieren. Das Ziel ist immer, die Unbekannte allein auf eine Seite zu bringen.<\/p>\n<p>Ein Fahrplan, der bei jeder linearen Gleichung funktioniert:<\/p>\n<ul><li>Brüche beseitigen: mit dem gemeinsamen Nenner multiplizieren<\/li><li>Klammern auflösen<\/li><li>auf jeder Seite zusammenfassen<\/li><li>alle Glieder mit $x$ auf eine Seite, alle Zahlen auf die andere<\/li><li>durch die Zahl vor $x$ dividieren und die Probe machen<\/li><\/ul>\n<h3>Drei mögliche Ausgänge<\/h3>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Am Ende steht<\/th><th>Bedeutung<\/th><th>Lösungsmenge<\/th><\/tr><tr><td>$x=4$<\/td><td>genau eine Lösung<\/td><td>$L=\\{4\\}$<\/td><\/tr><tr><td>$0=5$ (falsche Aussage)<\/td><td>keine Zahl erfüllt die Gleichung<\/td><td>$L=\\{\\}$<\/td><\/tr><tr><td>$0=0$ (wahre Aussage)<\/td><td>jede Zahl erfüllt die Gleichung<\/td><td>$L=\\mathbb{R}$<\/td><\/tr><\/table><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Gleichung mit Brüchen<\/h4><div class=\"task\">Löse $\\dfrac{x-1}{3}-\\dfrac{x+2}{4}=1$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Der gemeinsame Nenner von 3 und 4 ist 12. Multipliziere <b>jedes<\/b> Glied mit 12, auch die 1 auf der rechten Seite.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Kürzen: $4(x-1)-3(x+2)=12$. Die Zähler bekommen Klammern, weil der Bruchstrich wie eine Klammer wirkt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Auflösen, Minus vor der zweiten Klammer beachten: $4x-4-3x-6=12$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zusammenfassen: $x-10=12$, also $x=22$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe: $\\frac{21}{3}-\\frac{24}{4}=7-6=1$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Vom Text zur Gleichung<\/h3>\n<p>Textaufgaben scheitern selten am Rechnen und fast immer am Übersetzen. Halte dich an vier Schritte: Lege fest, was $x$ bedeutet (mit Einheit). Drücke alle anderen Größen durch $x$ aus. Suche den Satz, der eine Gleichheit behauptet, und schreibe ihn als Gleichung. Antworte am Ende in einem Satz und prüfe, ob das Ergebnis im Zusammenhang sinnvoll ist.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Mischungsaufgabe<\/h4><div class=\"task\">3 Liter Sirup-Wasser-Gemisch mit 40 % Sirupanteil sollen mit reinem Wasser auf 25 % Sirupanteil verdünnt werden. Wie viel Wasser muss man dazugeben?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Unbekannte festlegen: $x$ = Menge des zugegebenen Wassers in Litern.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Was bleibt gleich? Die Sirupmenge. Sie beträgt $0,40\\cdot3=1,2$ Liter.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Nach dem Verdünnen sind es $3+x$ Liter Gemisch, und 25 % davon sollen Sirup sein: $0,25\\cdot(3+x)=1,2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Lösen: $3+x=4,8$, also $x=1,8$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Antwort: Man muss 1,8 Liter Wasser zugeben. Kontrolle: $1,2:4,8=0,25$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Formeln umstellen<\/h3>\n<p>Eine Formel umzustellen ist dasselbe wie eine Gleichung zu lösen, nur dass die „Zahlen“ Buchstaben sind. Behandle die gesuchte Größe als Unbekannte und alle anderen wie feste Zahlen. Ein ausführlich vorgerechnetes Beispiel dazu findest du auf der Seite zur Zentralmatura, hier übst du es an neuen Formeln.<\/p>"},{"id":"quadgl","t":"Quadratische Gleichungen","kl":"5","k":5,"a":"G","tag":"M","goals":["Sonderfälle ohne Formel lösen","die kleine und die große Lösungsformel anwenden","an der Diskriminante die Anzahl der Lösungen ablesen","den Satz von Vieta zur Kontrolle und zum Zerlegen nutzen"],"ex":[{"type":"set","a":[2.0,3.0],"q":"Löse $x^2-5x+6=0$.","s":"Vieta: zwei Zahlen mit Summe 5 und Produkt 6 sind 2 und 3. Oder mit der Formel: $x=2,5\\pm\\sqrt{6,25-6}=2,5\\pm0,5$."},{"type":"set","a":[0.5,-2.0],"q":"Löse $2x^2+3x-2=0$.","s":"$D=9+16=25$. $x_{1,2}=\\dfrac{-3\\pm5}{4}$, also $x_1=0,5$ und $x_2=-2$."},{"type":"num","a":0.0,"q":"Wie viele reelle Lösungen hat $x^2-4x+7=0$?","s":"$D=\\dfrac{p^2}{4}-q=4-7=-3<0$. Es gibt keine reelle Lösung."},{"type":"num","a":9.0,"q":"Für welchen Wert von $c$ hat $x^2+6x+c=0$ genau eine Lösung?","h":"Die Diskriminante muss 0 sein.","s":"$\\dfrac{p^2}{4}-q=9-c=0$, also $c=9$. Dann steht da $(x+3)^2=0$."},{"type":"set","a":[0.0,4.0],"q":"Löse $3x^2-12x=0$.","h":"Hier brauchst du keine Formel.","s":"Herausheben: $3x(x-4)=0$. Also $x=0$ oder $x=4$. Wer hier durch $x$ dividiert, verliert die Lösung 0."},{"type":"set","a":[-3.0,7.0],"q":"Löse $(x-2)^2=25$.","s":"Wurzel ziehen: $x-2=5$ oder $x-2=-5$. Also $x=7$ oder $x=-3$."},{"type":"list","a":[2.0,-15.0],"q":"Eine Gleichung $x^2+px+q=0$ hat die Lösungen $3$ und $-5$. Gib $p; q$ an.","s":"Vieta: $-p=3+(-5)=-2$, also $p=2$. $q=3\\cdot(-5)=-15$. Die Gleichung lautet $x^2+2x-15=0$."},{"type":"num","a":12.0,"q":"Ein Rechteck hat 34 cm Umfang und 60 cm² Flächeninhalt. Wie lang ist die längere Seite?","unit":"cm","h":"$a+b=17$ und $a\\cdot b=60$.","s":"$b=17-a$ einsetzen: $a(17-a)=60$, also $a^2-17a+60=0$ mit den Lösungen 5 und 12. Die längere Seite ist 12 cm."}],"gen":["quad"],"html":"<h3>Erst schauen, dann rechnen<\/h3>\n<p>Eine quadratische Gleichung hat die Form $ax^2+bx+c=0$ mit $a\\ne0$. Bevor du eine Formel nimmst, prüfe, ob ein Sonderfall vorliegt. Das spart Zeit und Fehler.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Typ<\/th><th>Beispiel<\/th><th>Weg<\/th><\/tr><tr><td>kein lineares Glied<\/td><td>$2x^2-18=0$<\/td><td>nach $x^2$ auflösen: $x^2=9$, also $x=\\pm3$<\/td><\/tr><tr><td>kein konstantes Glied<\/td><td>$x^2-5x=0$<\/td><td>$x$ herausheben: $x(x-5)=0$, also $x=0$ oder $x=5$<\/td><\/tr><tr><td>schon ein Produkt<\/td><td>$(x-2)(x+7)=0$<\/td><td>jeder Faktor kann 0 sein: $x=2$ oder $x=-7$<\/td><\/tr><tr><td>schon ein Quadrat<\/td><td>$(x+1)^2=16$<\/td><td>Wurzel ziehen: $x+1=\\pm4$<\/td><\/tr><\/table><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><b>Produkt-Null-Satz:<\/b> Ein Produkt ist genau dann 0, wenn mindestens ein Faktor 0 ist. Deshalb ist eine faktorisierte Gleichung schon so gut wie gelöst. Multipliziere sie nie aus.<\/div>\n<h3>Die Lösungsformeln<\/h3>\n<p>Für die normierte Form $x^2+px+q=0$ (vor $x^2$ steht eine 1) gilt die <b>kleine Lösungsformel<\/b>, für $ax^2+bx+c=0$ die <b>große<\/b>:<\/p>\n<div class=\"formula\">$x_{1,2}=-\\dfrac{p}{2}\\pm\\sqrt{\\dfrac{p^2}{4}-q}\\qquad\\qquad x_{1,2}=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}$<\/div>\n<p>Der Ausdruck unter der Wurzel heißt <b>Diskriminante<\/b> $D$. Sie entscheidet, wie viele reelle Lösungen es gibt:<\/p>\n<ul><li>$D>0$: zwei verschiedene Lösungen<\/li><li>$D=0$: genau eine Lösung (Doppellösung)<\/li><li>$D<0$: keine reelle Lösung<\/li><\/ul>\n<h3>Der Satz von Vieta<\/h3>\n<p>Sind $x_1$ und $x_2$ die Lösungen von $x^2+px+q=0$, dann gilt:<\/p>\n<div class=\"formula\">$x_1+x_2=-p\\qquad x_1\\cdot x_2=q\\qquad x^2+px+q=(x-x_1)(x-x_2)$<\/div>\n<p>Das ist deine schnellste Probe. Bei kleinen ganzen Zahlen kannst du die Lösungen damit sogar erraten.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Große Lösungsformel<\/h4><div class=\"task\">Löse $3x^2-5x-2=0$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Lies die Koeffizienten mit Vorzeichen ab: $a=3$, $b=-5$, $c=-2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Diskriminante: $D=b^2-4ac=(-5)^2-4\\cdot3\\cdot(-2)=25+24=49$. Sie ist positiv, also gibt es zwei Lösungen.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Einsetzen: $x_{1,2}=\\dfrac{-(-5)\\pm\\sqrt{49}}{2\\cdot3}=\\dfrac{5\\pm7}{6}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$x_1=\\dfrac{12}{6}=2$ und $x_2=\\dfrac{-2}{6}=-\\dfrac13$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe für $x=2$: $3\\cdot4-10-2=0$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Textaufgabe, die auf eine quadratische Gleichung führt<\/h4><div class=\"task\">Ein rechteckiges Beet ist 3 m länger als breit und hat 40 m² Fläche. Wie breit ist es?<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>$x$ = Breite in Metern. Dann ist die Länge $x+3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Fläche: $x(x+3)=40$, also $x^2+3x-40=0$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Kleine Lösungsformel mit $p=3$, $q=-40$: $x_{1,2}=-1,5\\pm\\sqrt{2,25+40}=-1,5\\pm6,5$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$x_1=5$ und $x_2=-8$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Eine negative Breite ergibt keinen Sinn. Antwort: Das Beet ist 5 m breit (und 8 m lang).<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Vorzeichenfehler bei $-b$ und bei $-4ac$ sind die häufigsten. Schreibe negative Zahlen beim Einsetzen immer in Klammern.<\/div>"},{"id":"ungl","t":"Ungleichungen und Betrag","kl":"5–6","k":5,"a":"G","tag":"M","goals":["lineare Ungleichungen lösen und die Lösung als Intervall angeben","wissen, wann sich das Ungleichheitszeichen umdreht","quadratische Ungleichungen über die Nullstellen lösen","Betragsgleichungen und Betragsungleichungen lösen"],"ex":[{"type":"mc","q":"Löse $-3x+5>11$.","h":"Am Schluss dividierst du durch eine negative Zahl.","s":"$-3x>6$. Division durch $-3$ dreht das Zeichen um: $x<-2$. Kontrolle mit $x=-3$: $9+5=14>11$ stimmt.","o":["$x<-2$","$x>-2$","$x<2$","$x>2$"]},{"type":"num","a":6.0,"q":"Welche ist die größte ganze Zahl, die $4x-7\\le2x+6$ erfüllt?","s":"$2x\\le13$, also $x\\le6,5$. Die größte ganze Zahl ist 6."},{"type":"set","a":[-2.0,8.0],"q":"Löse $|x-3|=5$.","s":"Gesucht sind die Zahlen mit Abstand 5 von der Zahl 3: $3-5=-2$ und $3+5=8$."},{"type":"mc","q":"Welche Lösungsmenge hat $|2x+1|<7$?","h":"Schreibe die Ungleichung ohne Betrag als Doppelungleichung.","s":"$-7<2x+1<7$. Überall 1 subtrahieren: $-8<2x<6$. Durch 2 dividieren: $-4<x<3$, also $(-4;3)$. Die Ränder gehören nicht dazu, weil ein echtes „kleiner“ dasteht.","o":["$(-4;3)$","$(-3;4)$","$(-\\infty;3)$","$[-4;3]$"]},{"type":"mc","q":"Welche Lösungsmenge hat $x^2-2x-8\\le0$?","h":"Nullstellen bestimmen und an die Parabel denken.","s":"Nullstellen: $x^2-2x-8=(x-4)(x+2)$, also $-2$ und $4$. Die Parabel ist nach oben offen und liegt zwischen den Nullstellen unter der Achse. Wegen „kleiner <b>gleich<\/b>“ gehören die Ränder dazu.","o":["$[-2;4]$","$(-2;4)$","$(-\\infty;-2]\\cup[4;\\infty)$","$[-4;2]$"]},{"type":"mc","q":"Für welche Zahlen gilt $x^2\\ge9$?","s":"Die Parabel $x^2-9$ ist nach oben offen und liegt <b>außerhalb<\/b> ihrer Nullstellen $-3$ und $3$ über der Achse.","o":["$x\\le-3$ oder $x\\ge3$","$x\\ge3$","$-3\\le x\\le3$","$x\\ge\\pm3$"]},{"type":"num","a":9.0,"q":"Wie viele ganze Zahlen erfüllen $|x|\\le4$?","s":"Alle ganzen Zahlen von $-4$ bis $4$: Das sind 9 Zahlen (vergiss die 0 nicht)."},{"type":"num","a":11.0,"q":"Eine Taxifahrt kostet 3,80 € Grundgebühr und 1,40 € pro Kilometer. Wie viele ganze Kilometer kann man höchstens fahren, wenn man 20 € hat?","unit":"km","s":"$3,80+1,40x\\le20$, also $1,40x\\le16,20$ und $x\\le11,57\\dots$ Man kann höchstens 11 ganze Kilometer fahren. Hier wird abgerundet, auch wenn die Dezimalstelle über 5 liegt, weil das Geld für den 12. Kilometer nicht reicht."}],"gen":[],"html":"<h3>Lineare Ungleichungen<\/h3>\n<p>Du rechnest wie bei Gleichungen, mit einer einzigen Zusatzregel:<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Multiplizierst oder dividierst du eine Ungleichung mit einer <b>negativen<\/b> Zahl, dreht sich das Zeichen um. Aus $-2x<6$ wird $x>-3$. Warum? $2<5$ ist wahr, aber nach Multiplikation mit $-1$ gilt $-2>-5$.<\/div>\n<p>Die Lösung ist meist keine einzelne Zahl, sondern ein ganzes Intervall. $x>-3$ schreibt man als $(-3;\\infty)$.<\/p>\n<h3>Quadratische Ungleichungen<\/h3>\n<p>Hier hilft das Bild der Parabel mehr als jede Rechnung. Bringe alles auf eine Seite, bestimme die Nullstellen und überlege, wo die Parabel über und wo sie unter der $x$-Achse liegt.<\/p>\n[[plot:f=x*x-x-6 | x=-4,5 | y=-8,8 | pts=-2,0/3,0 | cap=f(x) = x² − x − 6: zwischen den Nullstellen negativ, außerhalb positiv]]\n<div class=\"walk\"><h4>Schritt für Schritt: Quadratische Ungleichung<\/h4><div class=\"task\">Löse $x^2-x-6<0$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Löse zuerst die zugehörige Gleichung $x^2-x-6=0$. Die Nullstellen sind $x_1=-2$ und $x_2=3$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Die Parabel ist nach oben offen, weil vor $x^2$ eine positive Zahl steht.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Eine nach oben offene Parabel liegt <b>zwischen<\/b> ihren Nullstellen unter der $x$-Achse.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Gefragt ist „kleiner als 0“, also der Bereich unter der Achse: $-2<x<3$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Lösungsmenge: $L=(-2;3)$. Die Ränder gehören nicht dazu, weil dort der Wert genau 0 ist. Kontrolle mit $x=0$: $-6<0$ stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Der Betrag<\/h3>\n<p>$|x|$ ist der <b>Abstand<\/b> der Zahl $x$ von 0 auf der Zahlengeraden und daher nie negativ: $|-4|=4$ und $|4|=4$. Genauso ist $|x-a|$ der Abstand der Zahl $x$ von $a$. Mit diesem Bild löst du Betragsaufgaben fast im Kopf:<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Aufgabe<\/th><th>In Worten<\/th><th>Lösung<\/th><\/tr><tr><td>$\\lvert x-3\\rvert=5$<\/td><td>Abstand von 3 ist genau 5<\/td><td>$x=-2$ oder $x=8$<\/td><\/tr><tr><td>$\\lvert x-3\\rvert<5$<\/td><td>Abstand von 3 ist kleiner als 5<\/td><td>$-2<x<8$<\/td><\/tr><tr><td>$\\lvert x-3\\rvert>5$<\/td><td>Abstand von 3 ist größer als 5<\/td><td>$x<-2$ oder $x>8$<\/td><\/tr><\/table><\/div>\n<p>Rechnerisch bedeutet $|T|<c$ dasselbe wie $-c<T<c$.<\/p>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Bei $x^2>9$ darfst du nicht einfach die Wurzel ziehen und $x>3$ schreiben. Auch alle Zahlen kleiner als $-3$ haben ein Quadrat größer als 9. Richtig ist: $x<-3$ oder $x>3$.<\/div>"},{"id":"lgs","t":"Lineare Gleichungssysteme","kl":"5","k":5,"a":"G","tag":"M","goals":["Systeme mit zwei Unbekannten mit einem passenden Verfahren lösen","die drei Lösungsfälle rechnerisch und geometrisch erkennen","ein System mit drei Unbekannten schrittweise lösen","Sachaufgaben in ein Gleichungssystem übersetzen"],"ex":[{"type":"list","a":[3.0,1.0],"q":"Löse $\\text{I: } 2x+y=7$ und $\\text{II: } x-y=2$. Gib $x; y$ an.","h":"Addiere die beiden Gleichungen.","s":"I + II: $3x=9$, also $x=3$. Aus II: $y=x-2=1$."},{"type":"mc","q":"Wie viele Lösungen hat das System $3x-2y=4$ und $6x-4y=10$?","h":"Vergleiche die linken Seiten.","s":"Die linke Seite der zweiten Gleichung ist das Doppelte der ersten, die rechte aber nicht ($10\\ne8$). Die Geraden sind parallel und verschieden. Zwei Geraden können einander übrigens nie in genau zwei Punkten schneiden.","o":["keine","genau eine","unendlich viele","genau zwei"]},{"type":"mc","q":"Wie viele Lösungen hat das System $x+y=5$ und $2x+2y=10$?","s":"Die zweite Gleichung ist das Doppelte der ersten, auf beiden Seiten. Beide beschreiben dieselbe Gerade, jeder ihrer Punkte ist eine Lösung.","o":["unendlich viele","keine","genau eine","genau zwei"]},{"type":"num","a":4.0,"q":"Für welchen Wert von $a$ hat das System $x+2y=3$ und $2x+ay=6$ unendlich viele Lösungen?","s":"Die zweite Gleichung muss das Doppelte der ersten sein: $2x+4y=6$. Also $a=4$."},{"type":"list","a":[1.0,2.0,3.0],"q":"Löse $\\text{I: } x+y+z=6$, $\\text{II: } 2x-y+z=3$, $\\text{III: } x+2y-z=2$. Gib $x; y; z$ an.","h":"I + III und II + III beseitigen jeweils $z$.","s":"I + III: $2x+3y=8$. II + III: $3x+y=5$, also $y=5-3x$. Einsetzen: $2x+15-9x=8$, $x=1$, $y=2$. Aus I: $z=3$."},{"type":"list","a":[10.0,6.0],"q":"Fünf Erwachsene und drei Kinder zahlen im Kino zusammen 68 €. Zwei Erwachsene und vier Kinder zahlen 44 €. Gib den Preis für Erwachsene und den für Kinder an (Erwachsene; Kinder).","s":"$5e+3k=68$ und $2e+4k=44$. Aus der zweiten: $e=22-2k$. Einsetzen: $110-10k+3k=68$, also $k=6$ und $e=10$."},{"type":"num","a":32.0,"q":"Die Summe zweier Zahlen ist 50, ihre Differenz ist 14. Wie lautet die größere Zahl?","s":"$x+y=50$ und $x-y=14$. Addieren: $2x=64$, $x=32$ (und $y=18$)."}],"gen":["lgs"],"html":"<h3>Drei Verfahren, ein Ziel<\/h3>\n<p>Bei zwei Gleichungen mit zwei Unbekannten ist das Ziel immer, eine Unbekannte loszuwerden. Welches Verfahren du nimmst, hängt nur davon ab, wie die Gleichungen aussehen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Verfahren<\/th><th>Idee<\/th><th>Günstig, wenn<\/th><\/tr><tr><td>Einsetzen<\/td><td>eine Gleichung nach einer Variablen auflösen und in die andere einsetzen<\/td><td>eine Variable schon allein steht oder den Faktor 1 hat<\/td><\/tr><tr><td>Gleichsetzen<\/td><td>beide Gleichungen nach derselben Variablen auflösen<\/td><td>beide in der Form $y=\\dots$ gegeben sind<\/td><\/tr><tr><td>Addieren<\/td><td>Gleichungen so vervielfachen, dass beim Addieren eine Variable wegfällt<\/td><td>beide in der Form $ax+by=c$ gegeben sind<\/td><\/tr><\/table><\/div>\n<p>Auf der Seite zur Zentralmatura ist das Additionsverfahren ausführlich vorgerechnet. Hier siehst du das Einsetzungsverfahren und danach den Schritt zu drei Unbekannten.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Einsetzungsverfahren<\/h4><div class=\"task\">Löse $\\text{I: } y=2x-1$ und $\\text{II: } 3x+2y=12$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>In Gleichung I steht $y$ schon allein. Setze den Ausdruck $2x-1$ in Gleichung II an die Stelle von $y$, und zwar in Klammern.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>$3x+2(2x-1)=12$, also $3x+4x-2=12$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>$7x=14$, also $x=2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>$x$ in Gleichung I einsetzen: $y=2\\cdot2-1=3$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Probe in der <b>anderen<\/b> Gleichung II: $3\\cdot2+2\\cdot3=12$. Stimmt. Lösung: $(x|y)=(2|3)$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Was die Lösung geometrisch bedeutet<\/h3>\n<p>Jede lineare Gleichung mit zwei Variablen beschreibt eine Gerade. Das System fragt nach den gemeinsamen Punkten zweier Geraden.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Lage der Geraden<\/th><th>Rechnung endet mit<\/th><th>Anzahl der Lösungen<\/th><\/tr><tr><td>schneiden einander<\/td><td>einem Wert für $x$ und $y$<\/td><td>genau eine<\/td><\/tr><tr><td>parallel und verschieden<\/td><td>einer falschen Aussage wie $0=3$<\/td><td>keine<\/td><\/tr><tr><td>identisch<\/td><td>einer wahren Aussage wie $0=0$<\/td><td>unendlich viele<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Den Fall erkennst du oft ohne Rechnung: Ist die linke Seite der einen Gleichung ein Vielfaches der anderen, sind die Geraden parallel oder identisch. Dann entscheidet die rechte Seite.<\/div>\n<h3>Drei Gleichungen, drei Unbekannte<\/h3>\n<p>Die Idee bleibt dieselbe, nur in zwei Runden: Erst machst du aus drei Gleichungen zwei (indem du zweimal dieselbe Variable beseitigst), dann aus zwei eine.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: System mit drei Unbekannten<\/h4><div class=\"task\">Löse $\\text{I: } x+y+z=9$, $\\text{II: } 2x-y+z=5$, $\\text{III: } x+2y-z=4$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Beseitige zuerst $z$. Addiere I und III: $2x+3y=13$. Das ist Gleichung A.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Addiere II und III, auch hier fällt $z$ weg: $3x+y=9$. Das ist Gleichung B.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Jetzt hast du ein System mit zwei Unbekannten. Aus B folgt $y=9-3x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Einsetzen in A: $2x+3(9-3x)=13$, also $2x+27-9x=13$, $-7x=-14$ und $x=2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Zurück einsetzen: $y=9-3\\cdot2=3$, und aus I: $z=9-2-3=4$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">6<\/div><div>Probe in II (die Gleichung, die du zuletzt nicht verwendet hast): $4-3+4=5$. Stimmt. Lösung: $(2|3|4)$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"polygl","t":"Gleichungen höheren Grades, Bruch- und Wurzelgleichungen","kl":"6–7","k":6,"a":"G","tag":"M","goals":["Gleichungen durch Herausheben und Substitution auf bekannte Typen zurückführen","eine Lösung erraten und den Grad durch Polynomdivision senken","Bruchgleichungen mit Definitionsmenge lösen","bei Wurzelgleichungen Scheinlösungen durch die Probe aussortieren"],"ex":[{"type":"set","a":[-2.0,0.0,2.0],"q":"Löse $x^3-4x=0$.","s":"$x(x^2-4)=x(x-2)(x+2)=0$. Lösungen: $0$, $2$ und $-2$."},{"type":"set","a":[-2.0,-1.0,1.0,2.0],"q":"Löse $x^4-5x^2+4=0$.","h":"Substituiere $u=x^2$.","s":"$u^2-5u+4=0$ hat die Lösungen $u=1$ und $u=4$. Daraus $x=\\pm1$ und $x=\\pm2$."},{"type":"set","a":[1.0,2.0,3.0],"q":"Löse $x^3-6x^2+11x-6=0$.","h":"Probiere $x=1$ und dividiere dann durch $(x-1)$.","s":"$x=1$ ist eine Lösung ($1-6+11-6=0$). Division durch $(x-1)$ ergibt $x^2-5x+6=(x-2)(x-3)$. Lösungen: 1, 2 und 3."},{"type":"mc","q":"Was ergibt die Polynomdivision $(x^3-2x^2-5x+6):(x-1)$?","s":"Kontrolle durch Ausmultiplizieren: $(x-1)(x^2-x-6)=x^3-x^2-6x-x^2+x+6=x^3-2x^2-5x+6$. Mit dieser Gegenprobe kannst du jede Polynomdivision prüfen.","o":["$x^2-x-6$","$x^2+x-6$","$x^2-x+6$","$x^2-3x-6$"]},{"type":"num","a":6.0,"q":"Löse $\\sqrt{x+3}=x-3$.","h":"Nach dem Quadrieren entstehen zwei Kandidaten. Mach bei beiden die Probe.","s":"Quadrieren: $x+3=x^2-6x+9$, also $x^2-7x+6=0$ mit $x=1$ und $x=6$. Probe $x=1$: $\\sqrt4=2$, rechts $-2$. Scheinlösung. Probe $x=6$: $\\sqrt9=3$, rechts $3$. Einzige Lösung: 6."},{"type":"num","a":2.0,"q":"Löse $\\dfrac{x+2}{x-1}=4$.","s":"Definitionsmenge: $x\\ne1$. Multiplikation mit $(x-1)$: $x+2=4x-4$, also $3x=6$ und $x=2$."},{"type":"num","a":2.0,"q":"Wie viele reelle Lösungen hat $x^4+3x^2-4=0$?","h":"Nach der Substitution ist ein $u$-Wert negativ.","s":"$u^2+3u-4=0$ hat die Lösungen $u=1$ und $u=-4$. Nur $u=1$ liefert reelle Werte: $x=\\pm1$. Es gibt 2 reelle Lösungen."},{"type":"set","a":[1.0,-4.0,1.5],"q":"Löse $(x-1)(x+4)(2x-3)=0$.","s":"Jeder Faktor kann 0 sein: $x=1$, $x=-4$ oder $2x=3$, also $x=1,5$. Ausmultiplizieren wäre hier ein großer Umweg."}],"gen":[],"html":"<h3>Der Grundgedanke: zerlegen<\/h3>\n<p>Für Gleichungen dritten oder höheren Grades gibt es in der Schule keine Lösungsformel. Du brauchst auch keine. Das Ziel ist immer, die linke Seite in Faktoren zu zerlegen, bis nur noch lineare oder quadratische Faktoren übrig sind. Dann hilft der Produkt-Null-Satz. Eine Gleichung vom Grad $n$ hat höchstens $n$ reelle Lösungen.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Erkennungszeichen<\/th><th>Werkzeug<\/th><th>Beispiel<\/th><\/tr><tr><td>kein konstantes Glied<\/td><td>$x$ herausheben<\/td><td>$x^3-4x=x(x^2-4)=0$<\/td><\/tr><tr><td>nur $x^4$, $x^2$ und eine Zahl<\/td><td>Substitution $u=x^2$<\/td><td>$x^4-5x^2+4=0$ wird $u^2-5u+4=0$<\/td><\/tr><tr><td>sonst<\/td><td>eine Lösung erraten, Polynomdivision<\/td><td>$x^3-6x^2+11x-6=0$<\/td><\/tr><\/table><\/div>\n<div class=\"note t\"><b class=\"lab\">Tipp<\/b>Beim Erraten probierst du die Teiler des konstanten Glieds, positiv und negativ. Steht am Ende eine 6, kommen nur $\\pm1,\\pm2,\\pm3,\\pm6$ als ganzzahlige Lösungen in Frage.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Lösung erraten und Polynomdivision<\/h4><div class=\"task\">Löse $x^3-2x^2-5x+6=0$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Probiere Teiler von 6. $x=1$: $1-2-5+6=0$. Treffer, $x_1=1$ ist eine Lösung.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Dann lässt sich der Faktor $(x-1)$ abspalten. Dividiere: $(x^3-2x^2-5x+6):(x-1)$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Erster Schritt: $x^3:x=x^2$. Zurückmultiplizieren: $x^2(x-1)=x^3-x^2$. Subtrahieren: Es bleibt $-x^2-5x$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Zweiter Schritt: $-x^2:x=-x$. Zurück: $-x^2+x$. Subtrahieren: Es bleibt $-6x+6$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">5<\/div><div>Dritter Schritt: $-6x:x=-6$. Zurück: $-6x+6$. Rest 0. Ergebnis der Division: $x^2-x-6$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">6<\/div><div>Die Gleichung lautet jetzt $(x-1)(x^2-x-6)=0$. Der quadratische Faktor hat die Nullstellen $3$ und $-2$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">7<\/div><div>Lösungsmenge: $L=\\{-2;1;3\\}$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Biquadratische Gleichung<\/h4><div class=\"task\">Löse $x^4-13x^2+36=0$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Setze $u=x^2$. Dann ist $x^4=u^2$ und die Gleichung lautet $u^2-13u+36=0$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Lösungen für $u$: $u_1=4$ und $u_2=9$ (Vieta: Summe 13, Produkt 36).<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zurück zu $x$: Aus $x^2=4$ folgt $x=\\pm2$, aus $x^2=9$ folgt $x=\\pm3$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Lösungsmenge: $L=\\{-3;-2;2;3\\}$. Wäre ein $u$-Wert negativ gewesen, hätte er keine reellen $x$-Werte geliefert.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<h3>Bruchgleichungen<\/h3>\n<p>Steht die Unbekannte im Nenner, bestimmst du zuerst die Definitionsmenge. Dann multiplizierst du mit dem gemeinsamen Nenner und löst die entstandene Gleichung. Am Ende streichst du alle Lösungen, die nicht in der Definitionsmenge liegen.<\/p>\n<h3>Wurzelgleichungen<\/h3>\n<p>Steht die Unbekannte unter einer Wurzel, stellst du die Wurzel allein und quadrierst beide Seiten. Quadrieren ist aber <b>keine<\/b> Äquivalenzumformung: Aus der falschen Aussage $-2=2$ wird durch Quadrieren die wahre Aussage $4=4$. Es können also Scheinlösungen entstehen.<\/p>\n<div class=\"note\"><b class=\"lab\">Merke<\/b>Bei Wurzelgleichungen ist die Probe in der <b>Ausgangsgleichung<\/b> kein freiwilliger Zusatz, sondern Teil der Lösung.<\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Wurzelgleichung mit Scheinlösung<\/h4><div class=\"task\">Löse $\\sqrt{2x+3}=x$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die Wurzel steht schon allein. Quadriere beide Seiten: $2x+3=x^2$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Ordnen: $x^2-2x-3=0$ mit den Lösungen $x_1=3$ und $x_2=-1$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Probe für $x=3$: $\\sqrt{9}=3$. Stimmt.<\/div><\/div><div class=\"wstep\"><div class=\"n\">4<\/div><div>Probe für $x=-1$: $\\sqrt{1}=1$, rechts steht aber $-1$. Falsch, das ist eine Scheinlösung.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">5<\/div><div>Lösungsmenge: $L=\\{3\\}$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>"},{"id":"komplex","t":"Komplexe Zahlen","kl":"7","k":7,"a":"G","tag":"S","goals":["mit der imaginären Einheit rechnen","komplexe Zahlen addieren, multiplizieren und dividieren","Betrag und konjugiert komplexe Zahl bestimmen","quadratische Gleichungen mit negativer Diskriminante lösen"],"ex":[{"type":"list","a":[6.0,-2.0],"q":"Berechne $(2+3i)+(4-5i)$. Gib Realteil; Imaginärteil an.","s":"Realteile: $2+4=6$. Imaginärteile: $3-5=-2$. Ergebnis: $6-2i$."},{"type":"list","a":[5.0,5.0],"q":"Berechne $(1+2i)(3-i)$. Gib Realteil; Imaginärteil an.","s":"$3-i+6i-2i^2=3+5i+2=5+5i$."},{"type":"mc","q":"Was ergibt $i^{10}$?","h":"$i^{10}=(i^2)^5$","s":"$(i^2)^5=(-1)^5=-1$. Oder mit dem Viererrhythmus: $10=2\\cdot4+2$, also $i^{10}=i^2=-1$.","o":["$-1$","$1$","$i$","$-i$"]},{"type":"num","a":5.0,"q":"Berechne den Betrag von $z=3-4i$.","s":"$|z|=\\sqrt{3^2+(-4)^2}=\\sqrt{25}=5$."},{"type":"mc","q":"Welche Lösungen hat $x^2+4x+13=0$ in $\\mathbb{C}$?","s":"$x_{1,2}=-2\\pm\\sqrt{4-13}=-2\\pm\\sqrt{-9}=-2\\pm3i$.","o":["$-2\\pm3i$","$2\\pm3i$","$-2\\pm9i$","$-4\\pm3i$"]},{"type":"list","a":[0.5,1.5],"q":"Berechne $\\dfrac{2+i}{1-i}$. Gib Realteil; Imaginärteil an.","h":"Erweitere mit $1+i$.","s":"Nenner: $(1-i)(1+i)=2$. Zähler: $(2+i)(1+i)=2+2i+i+i^2=1+3i$. Ergebnis: $0,5+1,5i$."},{"type":"mc","q":"Wie lautet die konjugiert komplexe Zahl zu $z=-3+7i$?","s":"Nur das Vorzeichen des Imaginärteils wechselt. In der Zahlenebene ist das die Spiegelung an der reellen Achse.","o":["$-3-7i$","$3-7i$","$3+7i$","$7-3i$"]},{"type":"num","a":45.0,"q":"Bestimme das Argument (den Winkel $\\varphi$) von $z=1+i$ in Grad.","unit":"°","s":"Der Punkt $(1|1)$ liegt auf der Winkelhalbierenden des ersten Quadranten: $\\tan\\varphi=\\frac11=1$, also $\\varphi=45°$."}],"gen":["kompl"],"html":"<h3>Wozu eine neue Zahl?<\/h3>\n<p>In den reellen Zahlen hat $x^2=-1$ keine Lösung, weil jedes Quadrat mindestens 0 ist. Man führt deshalb eine neue Zahl ein, die <b>imaginäre Einheit<\/b> $i$, mit der Eigenschaft<\/p>\n<div class=\"formula\">$i^2=-1$<\/div>\n<p>Eine <b>komplexe Zahl<\/b> hat die Form $z=a+bi$ mit reellen Zahlen $a$ und $b$. $a$ heißt Realteil, $b$ Imaginärteil. Für $b=0$ erhält man die reellen Zahlen, sie sind also in $\\mathbb{C}$ enthalten.<\/p>\n<h3>Rechnen<\/h3>\n<p>Du rechnest wie mit Termen und ersetzt $i^2$ immer durch $-1$.<\/p>\n<ul><li>Addieren: Realteile und Imaginärteile getrennt. $(2+3i)+(1-5i)=3-2i$<\/li><li>Multiplizieren: jedes Glied mit jedem. $(2+3i)(1-5i)=2-10i+3i-15i^2=2-7i+15=17-7i$<\/li><li>Die <b>konjugiert komplexe Zahl<\/b> zu $z=a+bi$ ist $\\bar z=a-bi$. Ihr Produkt ist reell: $z\\cdot\\bar z=a^2+b^2$.<\/li><li>Dividieren: mit der konjugiert komplexen Zahl des Nenners erweitern, dann wird der Nenner reell.<\/li><\/ul>\n<p>Die Potenzen von $i$ wiederholen sich im Viererrhythmus: $i^1=i$, $i^2=-1$, $i^3=-i$, $i^4=1$, dann wieder von vorne.<\/p>\n<h3>Die Gaußsche Zahlenebene<\/h3>\n<p>Man zeichnet $z=a+bi$ als Punkt $(a|b)$: Realteil nach rechts, Imaginärteil nach oben. Der <b>Betrag<\/b> ist der Abstand vom Ursprung, das <b>Argument<\/b> $\\varphi$ der Winkel zur positiven reellen Achse.<\/p>\n<div class=\"formula\">$|z|=\\sqrt{a^2+b^2}\\qquad \\tan\\varphi=\\dfrac{b}{a}\\qquad z=|z|\\cdot(\\cos\\varphi+i\\sin\\varphi)$<\/div>\n<p>Die letzte Schreibweise heißt Polarform. Sie ist praktisch beim Multiplizieren: Die Beträge werden multipliziert, die Winkel addiert.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt: Division komplexer Zahlen<\/h4><div class=\"task\">Berechne $\\dfrac{3+2i}{1-2i}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Die konjugiert komplexe Zahl des Nenners ist $1+2i$. Erweitere den Bruch damit.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>Nenner: $(1-2i)(1+2i)=1^2+2^2=5$. Er ist jetzt reell.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Zähler: $(3+2i)(1+2i)=3+6i+2i+4i^2=3+8i-4=-1+8i$.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Ergebnis: $\\dfrac{-1+8i}{5}=-0,2+1,6i$.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"walk\"><h4>Schritt für Schritt: Quadratische Gleichung ohne reelle Lösung<\/h4><div class=\"task\">Löse $x^2-6x+13=0$ in $\\mathbb{C}$.<\/div><div class=\"wstep\"><div class=\"n\">1<\/div><div>Kleine Lösungsformel: $x_{1,2}=3\\pm\\sqrt{9-13}=3\\pm\\sqrt{-4}$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">2<\/div><div>In $\\mathbb{C}$ kann man weiterrechnen: $\\sqrt{-4}=\\sqrt{4}\\cdot\\sqrt{-1}=2i$.<\/div><\/div><div class=\"wstep\"><div class=\"n\">3<\/div><div>Lösungen: $x_1=3+2i$ und $x_2=3-2i$. Die beiden Lösungen sind zueinander konjugiert komplex. Das ist bei reellen Koeffizienten immer so.<\/div><\/div><div class=\"wstep final\"><div class=\"n\">4<\/div><div>Probe mit Vieta: Summe $=6=-p$, Produkt $=3^2+2^2=13=q$. Stimmt.<\/div><\/div><div class=\"row\"><button class=\"nxt\">Nächster Schritt<\/button><button class=\"ghost all\">Alles zeigen<\/button><\/div><\/div>\n<div class=\"note\"><b class=\"lab\">Merke<\/b><b>Fundamentalsatz der Algebra:<\/b> In $\\mathbb{C}$ hat jede Gleichung $n$-ten Grades genau $n$ Lösungen, wenn man mehrfache Lösungen mehrfach zählt.<\/div>"},{"id":"funktion","t":"Der Funktionsbegriff und Eigenschaften von Funktionen","kl":"5","k":5,"a":"F","tag":"M","goals":["entscheiden, ob eine Zuordnung eine Funktion ist","Definitions- und Wertemenge bestimmen","Nullstellen, Monotonie, Extremstellen und Symmetrie am Graphen und am Term erkennen","Umkehrfunktionen und Verkettungen bilden"],"ex":[{"type":"mc","q":"Welche Zuordnung ist eine Funktion?","h":"Frage dich bei jeder Zuordnung: Gibt es zu jedem Ausgangswert genau ein Ergebnis?","s":"Jede Zahl hat genau ein Quadrat. Bei den anderen Zuordnungen gibt es mehrere Ergebnisse: Zur Zahl 9 gehören 3 und $-3$, zu einer Größe mehrere Personen, zu einer Mutter möglicherweise mehrere Kinder.","o":["Jeder reellen Zahl wird ihr Quadrat zugeordnet.","Jeder positiven Zahl werden die Zahlen zugeordnet, deren Quadrat sie ist.","Jeder Körpergröße werden die Personen mit dieser Größe zugeordnet.","Jeder Mutter werden ihre Kinder zugeordnet."]},{"type":"num","a":15.0,"q":"Gegeben ist $f(x)=2x^2-3x+1$. Berechne $f(-2)$.","h":"Setze $-2$ in Klammern ein.","s":"$f(-2)=2\\cdot(-2)^2-3\\cdot(-2)+1=8+6+1=15$."},{"type":"mc","q":"Wie lautet die größtmögliche Definitionsmenge von $f(x)=\\sqrt{x-4}$?","s":"Unter der Wurzel darf keine negative Zahl stehen: $x-4\\ge0$, also $x\\ge4$. Die 4 selbst ist erlaubt, weil $\\sqrt0=0$ existiert.","o":["$[4;\\infty)$","$(4;\\infty)$","$(-\\infty;4]$","$\\mathbb{R}\\setminus\\{4\\}$"]},{"type":"mc","q":"Welche Symmetrie hat der Graph von $f(x)=x^4-3x^2$?","s":"$f(-x)=(-x)^4-3(-x)^2=x^4-3x^2=f(x)$. Es kommen nur gerade Hochzahlen vor. Symmetrie zur $x$-Achse kann ein Funktionsgraph gar nicht haben (außer bei $f(x)=0$), das würde die Senkrechtenprobe verletzen.","o":["symmetrisch zur $y$-Achse","punktsymmetrisch zum Ursprung","symmetrisch zur $x$-Achse","keine Symmetrie"]},{"type":"num","a":8.0,"q":"Gegeben ist $f(x)=2x-6$. Berechne $f^{-1}(10)$.","h":"Gesucht ist das $x$ mit $f(x)=10$.","s":"$2x-6=10$ ergibt $x=8$. Du musst die Umkehrfunktion dafür gar nicht vollständig aufstellen."},{"type":"num","a":9.0,"q":"Gegeben sind $f(x)=x+1$ und $g(x)=x^2$. Berechne $g(f(2))$.","s":"Von innen nach außen: $f(2)=3$, dann $g(3)=9$. Umgekehrt wäre $f(g(2))=5$. Die Reihenfolge ist also nicht egal."},{"type":"set","a":[-3.0,3.0],"q":"Bestimme die Nullstellen von $f(x)=x^2-9$.","s":"$x^2-9=0$ ergibt $x=3$ oder $x=-3$."},{"type":"mc","q":"Was bedeutet „$f$ ist streng monoton steigend“?","s":"Größere Stellen haben größere Funktionswerte. Das hat nichts mit dem Vorzeichen der Werte zu tun: $f(x)=x-100$ ist streng monoton steigend, obwohl viele Werte negativ sind.","o":["Aus $x_1<x_2$ folgt immer $f(x_1)<f(x_2)$.","Alle Funktionswerte sind positiv.","Aus $x_1<x_2$ folgt immer $f(x_1)>f(x_2)$.","Der Graph ist eine Gerade."]}],"gen":[],"html":"<h3>Was eine Funktion ist<\/h3>\n<p>Eine Funktion $f$ ordnet <b>jedem<\/b> Element $x$ ihrer Definitionsmenge $D$ <b>genau einen<\/b> Wert $f(x)$ zu. Das Wort „genau einen“ ist der Kern. Die Körpergröße einer Person in Abhängigkeit vom Alter ist eine Funktion, denn zu jedem Zeitpunkt hat man genau eine Größe. Umgekehrt nicht: Dieselbe Größe hat man viele Jahre lang.<\/p>\n<p>Am Graphen prüfst du das mit der <b>Senkrechtenprobe<\/b>: Jede senkrechte Gerade darf den Graphen höchstens einmal treffen. Ein Kreis ist deshalb kein Funktionsgraph.<\/p>\n<div class=\"tw\"><table class=\"plain\"><tr><th>Begriff<\/th><th>Bedeutung<\/th><\/tr><tr><td>Argument, Stelle $x$<\/td><td>der Wert, den man einsetzt (waagrechte Achse)<\/td><\/tr><tr><td>Funktionswert $f(x)$<\/td><td>das Ergebnis (senkrechte Achse)<\/td><\/tr><tr><td>Definitionsmenge $D$<\/td><td>alle erlaubten $x$-Werte<\/td><\/tr><tr><td>Wertemenge $W$<\/td><td>alle Werte, die tatsächlich herauskommen<\/td><\/tr><tr><td>Punkt des Graphen<\/td><td>$(x\\mid f(x))$<\/td><\/tr><\/table><\/div>\n<div class=\"note f\"><b class=\"lab\">Fehlerfalle<\/b>Unterscheide <b>Stelle<\/b> und <b>Punkt<\/b>. Eine Stelle ist eine Zahl auf der $x$-Achse („die Nullstelle ist 3“), ein Punkt hat zwei Koordinaten („der Hochpunkt ist $(2|5)$“). Wer bei einer Frage nach der Stelle einen Punkt angibt, verliert bei genauer Korrektur den Punkt.<\/div>\n<h3>Die größtmögliche Definitionsmenge<\/h3>\n<p>Zwei Dinge sind in $\\mathbb{R}$ verboten: durch 0 dividieren und die Quadratwurzel aus einer negativen Zahl ziehen. Dazu kommt, dass ein Logarithmus nur positive Argumente verträgt. Bei $f(x)=\\sqrt{x-4}$ muss also $x-4\\ge0$ gelten, die Definitionsmenge ist $[4;\\infty)$.<\/p>\n<h3>Eigenschaften, die du erkennen musst<\/h3>\n[[plot:f=pow(x,3)/4-3*x | x=-5,5 | y=-6,6 | pts=-2,4,H/2,-4,T | cap=Hochpunkt H, Tiefpunkt T, drei Nullstellen, punktsymmetrisch zum Ursprung]]\n<ul><li><b>Nullstelle:<\/b> eine Stelle mit $f(x)=0$. Dort trifft der Graph die $x$-Achse.<\/li><li><b>Monotonie:<\/b> $f$ ist streng monoton steigend, wenn aus $x_1<x_2$ immer $f(x_1)<f(x_2)$ folgt. Bei „fallend“ steht am Ende $f(x_1)>f(x_2)$.<\/li><li><b>Extremstellen:<\/b> An einer lokalen Maximumstelle ist der Funktionswert größer als in der unmittelbaren Umgebung, der zugehörige Punkt heißt Hochpunkt. Entsprechend Minimumstelle und Tiefpunkt.<\/li><li><b>Symmetrie:<\/b> Gilt $f(-x)=f(x)$ für alle $x$, ist der Graph symmetrisch zur $y$-Achse (gerade Funktion). Gilt $f(-x)=-f(x)$, ist er punktsymmetrisch zum Ursprung (ungerade Funktion).<\/li><li><b>Periodizität:<\/b> Die Werte wiederholen sich in festen Abständen, wie bei Sinus und Cosinus.<\/li><\/ul>\n<h3>Umkehrfunktion und Verkettung<\/h3>\n<p>Die Umkehrfunktion $f^{-1}$ macht rückgängig, was $f$ tut. Es gibt sie nur, wenn $f$ jeden Wert höchstens einmal annimmt, zum Beispiel wenn $f$ streng monoton ist. Ihr Graph ist das Spiegelbild an der Geraden $y=x$.<\/p>\n<p>Bei einer Verkettung $g(f(x))$ wird zuerst $f$ ausgeführt und das Ergebnis in $g$ eingesetzt. Lies sie von innen nach außen.<\/p>\n<div class=\"walk\"><h4>Schritt für Schritt:
